ि ॥","tr":"saṃnyāsastu mahābāho duḥkhamāptumayogataḥ\nyogayukto munirbrahma nacireṇādhigacchati","gs":"સંન્યાસસ્તુ મહાબાહો દુઃખમાપ્તુમયોગતઃ ।\nયોગયુક્તો મુનિર્બ્રહ્મ નચિરેણાધિગચ્છતિ ॥","en":"But, O mighty-armed Arjuna, renunciation is hard to attain without Yoga; the sage who is in harmony with Yoga quickly goes to Brahman.","hi":"परन्तु हे महाबाहो ! कर्मयोगके बिना संन्यास सिद्ध होना कठिन है। मननशील कर्मयोगी शीघ्र ही ब्रह्मको प्राप्त हो जाता है।"},{"c":5,"v":7,"sp":"krishna","sa":"योगयुक्तो विशुद्धात्मा विजितात्मा जितेन्द्रियः ।\nसर्वभूतात्मभूतात्मा कुर्वन्नपि न लिप्यते ॥","tr":"yogayukto viśuddhātmā vijitātmā jitendriyaḥ\nsarvabhūtātmabhūtātmā kurvannapi na lipyate","gs":"યોગયુક્તો વિશુદ્ધાત્મા વિજિતાત્મા જિતેન્દ્રિયઃ ।\nસર્વભૂતાત્મભૂતાત્મા કુર્વન્નપિ ન લિપ્યતે ॥","en":"He who is devoted to the path of action, whose mind is pure, who has conquered the self, who has subdued his senses, and who realizes his Self as the Self in all beings, though acting, is not tainted.","hi":"जिसकी इन्द्रियाँ अपने वशमें हैं, जिसका अन्तःकरण निर्मल है, जिसका शरीर अपने वशमें है और सम्पूर्ण प्राणियोंकी आत्मा ही जिसकी आत्मा है, ऐसा कर्मयोगी कर्म करते हुए भी लिप्त नहीं होता।"},{"c":5,"v":8,"sp":"krishna","sa":"नैव किंचित्करोमीति युक्तो मन्येत तत्त्ववित् ।\nपश्यन् श्रृणवन्स्पृशञ्जिघ्रन्नश्नन्गच्छन्स्वपन् श्वसन् ॥","tr":"naiva kiṃcitkaromīti yukto manyeta tattvavit\npaśyan śrṛṇavanspṛśañjighrannaśnangacchansvapan śvasan","gs":"નૈવ કિંચિત્કરોમીતિ યુક્તો મન્યેત તત્ત્વવિત્ ।\nપશ્યન્ શ્રૃણવન્સ્પૃશઞ્જિઘ્રન્નશ્નન્ગચ્છન્સ્વપન્ શ્વસન્ ॥","en":"I do nothing at all,\" thus would the harmonized knower of Truth think, seeing, hearing, touching, smelling, eating, going, sleeping, and breathing.","hi":"।।5.8 -- 5.9।। तत्त्वको जाननेवाला सांख्ययोगी देखता, सुनता, छूता, सूँघता, खाता, चलता, ग्रहण करता, बोलता, मल-मूत्र का त्याग करता, सोता, श्वास लेता तथा आँखें खोलता और मूँदता भी सम्पूर्ण इन्द्रियाँ इन्द्रियोंके विषयोंमें बरत रही हैं' -- ऐसा समझकर 'मैं (स्वयं) कुछ भी नहीं करता हूँ' -- ऐसा माने।"},{"c":5,"v":9,"sp":"krishna","sa":"प्रलपन्विसृजन्गृह्णन्नुन्मिषन्निमिषन्नपि ।\nइन्द्रियाणीन्द्रियार्थेषु वर्तन्त इति धारयन् ॥","tr":"pralapanvisṛjangṛhṇannunmiṣannimiṣannapi\nindriyāṇīndriyārtheṣu vartanta iti dhārayan","gs":"પ્રલપન્વિસૃજન્ગૃહ્ણન્નુન્મિષન્નિમિષન્નપિ ।\nઇન્દ્રિયાણીન્દ્રિયાર્થેષુ વર્તન્ત ઇતિ ધારયન્ ॥","en":"Speaking, letting go, seizing, opening, and closing the eyes, one should be convinced that the senses move among the sense-objects.","hi":"।।5.8 -- 5.9।। तत्त्वको जाननेवाला सांख्ययोगी देखता, सुनता, छूता, सूँघता, खाता, चलता, ग्रहण करता, बोलता, मल-मूत्र का त्याग करता, सोता हुआ, श्वास लेता तथा आँखें खोलता और मूँदता हुआ भी 'सम्पूर्ण इन्द्रियाँ इन्द्रियोंके विषयोंमें बरत रही हैं' -- ऐसा समझकर 'मैं (स्वयं) कुछ भी नहीं करता हूँ' -- ऐसा माने।"},{"c":5,"v":10,"sp":"krishna","sa":"ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः ।\nलिप्यते न स पापेन पद्मपत्रमिवाम्भसा ॥","tr":"brahmaṇyādhāya karmāṇi saṅgaṃ tyaktvā karoti yaḥ\nlipyate na sa pāpena padmapatramivāmbhasā","gs":"બ્રહ્મણ્યાધાય કર્માણિ સઙ્ગં ત્યક્ત્વા કરોતિ યઃ ।\nલિપ્યતે ન સ પાપેન પદ્મપત્રમિવામ્ભસા ॥","en":"He who does actions, offering them to Brahman and abandoning attachment, is not tainted by sin, just as a lotus leaf is not tainted by water.","hi":"जो (भक्तियोगी) सम्पूर्ण कर्मोंको भगवान् में अर्पण करके और आसक्तिका त्याग करके कर्म करता है, वह जलसे कमलके पत्तेकी तरह पापसे लिप्त नहीं होता।"},{"c":5,"v":11,"sp":"krishna","sa":"कायेन मनसा बुद्ध्या केवलैरिन्द्रियैरपि ।\nयोगिनः कर्म कुर्वन्ति सङ्गं त्यक्त्वाऽऽत्मशुद्धये ॥","tr":"kāyena manasā buddhyā kevalairindriyairapi\nyoginaḥ karma kurvanti saṅgaṃ tyaktvā''tmaśuddhaye","gs":"કાયેન મનસા બુદ્ધ્યા કેવલૈરિન્દ્રિયૈરપિ ।\nયોગિનઃ કર્મ કુર્વન્તિ સઙ્ગં ત્યક્ત્વાઽઽત્મશુદ્ધયે ॥","en":"Yogis, having abandoned attachment, perform actions only through the body, mind, intellect, and even the senses, for the purification of the self.","hi":"कर्मयोगी आसक्तिका त्याग करके केवल (ममतारहित) इन्द्रियाँ-शरीर-मन-बुद्धि के द्वारा केवल अन्तःकरणकी शुद्धिके लिये ही कर्म करते हैं।"},{"c":5,"v":12,"sp":"krishna","sa":"युक्तः कर्मफलं त्यक्त्वा शान्तिमाप्नोति नैष्ठिकीम् ।\nअयुक्तः कामकारेण फले सक्तो निबध्यते ॥","tr":"yuktaḥ karmaphalaṃ tyaktvā śāntimāpnoti naiṣṭhikīm\nayuktaḥ kāmakāreṇa phale sakto nibadhyate","gs":"યુક્તઃ કર્મફલં ત્યક્ત્વા શાન્તિમાપ્નોતિ નૈષ્ઠિકીમ્ ।\nઅયુક્તઃ કામકારેણ ફલે સક્તો નિબધ્યતે ॥","en":"The one who is united (the well-poised or harmonized) having abandoned the fruit of action attains eternal peace; whereas the one who is not united (the unsteady or unbalanced), impelled by desire and attached to the fruit, is bound.","hi":"कर्मयोगी कर्मफलका त्याग करके नैष्ठिकी शान्तिको प्राप्त होता है। परन्तु सकाम मनुष्य कामनाके कारण फलमें आसक्त होकर बँध जाता है।"},{"c":5,"v":13,"sp":"krishna","sa":"सर्वकर्माणि मनसा संन्यस्यास्ते सुखं वशी ।\nनवद्वारे पुरे देही नैव कुर्वन्न कारयन् ॥","tr":"sarvakarmāṇi manasā saṃnyasyāste sukhaṃ vaśī\nnavadvāre pure dehī naiva kurvanna kārayan","gs":"સર્વકર્માણિ મનસા સંન્યસ્યાસ્તે સુખં વશી ।\nનવદ્વારે પુરે દેહી નૈવ કુર્વન્ન કારયન્ ॥","en":"Mentally renouncing all actions and being self-controlled, the embodied one happily rests in the nine-gated city, neither acting nor causing others (body and senses) to act.","hi":"जिसकी इन्द्रियाँ और मन वशमें हैं, ऐसा देहधारी पुरुष नौ द्वारोंवाले शरीररूपी पुरमें सम्पूर्ण कर्मोंका विवेकपूर्वक मनसे त्याग करके निःसन्देह न करता हुआ और न करवाता हुआ सुखपूर्वक (अपने स्वरूपमें) स्थित रहता है।"},{"c":5,"v":14,"sp":"krishna","sa":"न कर्तृत्वं न कर्माणि लोकस्य सृजति प्रभुः ।\nन कर्मफलसंयोगं स्वभावस्तु प्रवर्तते ॥","tr":"na kartṛtvaṃ na karmāṇi lokasya sṛjati prabhuḥ\nna karmaphalasaṃyogaṃ svabhāvastu pravartate","gs":"ન કર્તૃત્વં ન કર્માણિ લોકસ્ય સૃજતિ પ્રભુઃ ।\nન કર્મફલસંયોગં સ્વભાવસ્તુ પ્રવર્તતે ॥","en":"Neither does the Lord create agency nor actions for the world, nor union with the fruits of actions; rather, it is Nature that acts.","hi":"परमेश्वर मनुष्योंके न कर्तापनकी, न कर्मोंकी और न कर्मफलके साथ संयोगकी रचना करते हैं; किन्तु स्वभाव ही बरत रहा है।"},{"c":5,"v":15,"sp":"krishna","sa":"नादत्ते कस्यचित्पापं न चैव सुकृतं विभुः ।\nअज्ञानेनावृतं ज्ञानं तेन मुह्यन्ति जन्तवः ॥","tr":"nādatte kasyacitpāpaṃ na caiva sukṛtaṃ vibhuḥ\najñānenāvṛtaṃ jñānaṃ tena muhyanti jantavaḥ","gs":"નાદત્તે કસ્યચિત્પાપં ન ચૈવ સુકૃતં વિભુઃ ।\nઅજ્ઞાનેનાવૃતં જ્ઞાનં તેન મુહ્યન્તિ જન્તવઃ ॥","en":"The Lord takes neither the demerit nor the merit of any; knowledge is enveloped by ignorance, and beings are deluded.","hi":"सर्वव्यापी परमात्मा न किसीके पापकर्मको और न शुभकर्मको ही ग्रहण करता है; किन्तु अज्ञानसे ज्ञान ढका हुआ है, उसीसे सब जीव मोहित हो रहे हैं।"},{"c":5,"v":16,"sp":"krishna","sa":"ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः ।\nतेषामादित्यवज्ज्ञानं प्रकाशयति तत्परम् ॥","tr":"jñānena tu tadajñānaṃ yeṣāṃ nāśitamātmanaḥ\nteṣāmādityavajjñānaṃ prakāśayati tatparam","gs":"જ્ઞાનેન તુ તદજ્ઞાનં યેષાં નાશિતમાત્મનઃ ।\nતેષામાદિત્યવજ્જ્ઞાનં પ્રકાશયતિ તત્પરમ્ ॥","en":"But to those whose ignorance is destroyed by knowledge of the Self, like the sun, knowledge reveals the Supreme Brahman.","hi":"परन्तु जिन्होंने अपने जिस ज्ञान-(विवक-) के द्वारा उस अज्ञानका नाश कर दिया है, उनका वह ज्ञान सूर्यकी तरह परमतत्त्व परमात्माको प्रकाशित कर देता है।"},{"c":5,"v":17,"sp":"krishna","sa":"तद्बुद्धयस्तदात्मानस्तन्निष्ठास्तत्परायणाः ।\nगच्छन्त्यपुनरावृत्तिं ज्ञाननिर्धूतकल्मषाः ॥","tr":"tadbuddhayastadātmānastanniṣṭhāstatparāyaṇāḥ\ngacchantyapunarāvṛttiṃ jñānanirdhūtakalmaṣāḥ","gs":"તદ્બુદ્ધયસ્તદાત્માનસ્તન્નિષ્ઠાસ્તત્પરાયણાઃ ।\nગચ્છન્ત્યપુનરાવૃત્તિં જ્ઞાનનિર્ધૂતકલ્મષાઃ ॥","en":"Their intellect absorbed in That, their self being That, established in That, with That as their supreme goal, they go whence there is no return, their sins dispelled by knowledge.","hi":"जिनकी बुद्धि तदाकार हो रही है, जिनका मन तदाकार हो रहा है, जिनकी स्थिति परमात्मतत्वमें है, ऐसे परमात्मपरायण साधक ज्ञानके द्वारा पापरहित होकर अपुनरावृत्ति (परमगति) को प्राप्त होते हैं।"},{"c":5,"v":18,"sp":"krishna","sa":"विद्याविनयसंपन्ने ब्राह्मणे गवि हस्तिनि ।\nशुनि चैव श्वपाके च पण्डिताः समदर्शिनः ॥","tr":"vidyāvinayasaṃpanne brāhmaṇe gavi hastini\nśuni caiva śvapāke ca paṇḍitāḥ samadarśinaḥ","gs":"વિદ્યાવિનયસંપન્ને બ્રાહ્મણે ગવિ હસ્તિનિ ।\nશુનિ ચૈવ શ્વપાકે ચ પણ્ડિતાઃ સમદર્શિનઃ ॥","en":"Sages look with an equal eye on a Brahmana endowed with learning and humility, on a cow, an elephant, a dog, and even an outcaste.","hi":"ज्ञानी महापुरुष विद्या-विनययुक्त ब्राह्मणमें और चाण्डालमें तथा गाय, हाथी एवं कुत्तेमें भी समरूप परमात्माको देखनेवाले होते हैं।"},{"c":5,"v":19,"sp":"krishna","sa":"इहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः ।\nनिर्दोषं हि समं ब्रह्म तस्माद्ब्रह्मणि ते स्थिताः ॥","tr":"ihaiva tairjitaḥ sargo yeṣāṃ sāmye sthitaṃ manaḥ\nnirdoṣaṃ hi samaṃ brahma tasmādbrahmaṇi te sthitāḥ","gs":"ઇહૈવ તૈર્જિતઃ સર્ગો યેષાં સામ્યે સ્થિતં મનઃ ।\nનિર્દોષં હિ સમં બ્રહ્મ તસ્માદ્બ્રહ્મણિ તે સ્થિતાઃ ॥","en":"Even here in this world, those whose minds rest in reality overcome birth; Brahman is indeed spotless and real; therefore they are established in Brahman.","hi":"जिनका अन्तःकरण समतामें स्थित है, उन्होंने इस जीवित-अवस्थामें ही सम्पूर्ण संसारको जीत लिया है; ब्रह्म निर्दोष और सम है, इसलिये वे ब्रह्ममें ही स्थित हैं।"},{"c":5,"v":20,"sp":"krishna","sa":"न प्रहृष्येत्प्रियं प्राप्य नोद्विजेत्प्राप्य चाप्रियम् ।\nस्थिरबुद्धिरसम्मूढो ब्रह्मविद्ब्रह्मणि स्थितः ॥","tr":"na prahṛṣyetpriyaṃ prāpya nodvijetprāpya cāpriyam\nsthirabuddhirasammūḍho brahmavidbrahmaṇi sthitaḥ","gs":"ન પ્રહૃષ્યેત્પ્રિયં પ્રાપ્ય નોદ્વિજેત્પ્રાપ્ય ચાપ્રિયમ્ ।\nસ્થિરબુદ્ધિરસમ્મૂઢો બ્રહ્મવિદ્બ્રહ્મણિ સ્થિતઃ ॥","en":"Resting in Brahman, with a steady intellect and undeluded, the knower of Brahman neither rejoices upon obtaining what is pleasant nor grieves upon obtaining what is unpleasant.","hi":"जो प्रियको प्राप्त होकर हर्षित न हो और अप्रियको प्राप्त होकर उद्विग्न न हो, वह स्थिर बुद्धिवाला, मूढ़तारहित तथा ब्रह्मको जाननेवाला मनुष्य ब्रह्ममें स्थित है।"},{"c":5,"v":21,"sp":"krishna","sa":"बाह्यस्पर्शेष्वसक्तात्मा विन्दत्यात्मनि यत्सुखम् ।\nस ब्रह्मयोगयुक्तात्मा सुखमक्षयमश्नुते ॥","tr":"bāhyasparśeṣvasaktātmā vindatyātmani yatsukham\nsa brahmayogayuktātmā sukhamakṣayamaśnute","gs":"બાહ્યસ્પર્શેષ્વસક્તાત્મા વિન્દત્યાત્મનિ યત્સુખમ્ ।\nસ બ્રહ્મયોગયુક્તાત્મા સુખમક્ષયમશ્નુતે ॥","en":"With the self unattached to external contacts, he finds happiness in the Self; with the self engaged in the meditation of Brahman, he attains endless happiness.","hi":"बाह्यस्पर्शमें आसक्तिरहित अन्तःकरणवाला साधक आत्मामें जो सुख है, उसको प्राप्त होता है। फिर वह ब्रह्ममें अभिन्नभावसे स्थित मनुष्य अक्षय सुखका अनुभव करता है।"},{"c":5,"v":22,"sp":"krishna","sa":"ये हि संस्पर्शजा भोगा दुःखयोनय एव ते ।\nआद्यन्तवन्तः कौन्तेय न तेषु रमते बुधः ॥","tr":"ye hi saṃsparśajā bhogā duḥkhayonaya eva te\nādyantavantaḥ kaunteya na teṣu ramate budhaḥ","gs":"યે હિ સંસ્પર્શજા ભોગા દુઃખયોનય એવ તે ।\nઆદ્યન્તવન્તઃ કૌન્તેય ન તેષુ રમતે બુધઃ ॥","en":"The enjoyments that arise from contact are only sources of pain, for they have a beginning and an end, O Arjuna; the wise do not rejoice in them.","hi":"क्योंकि हे कुन्तीनन्दन ! जो इन्द्रियों और विषयोंके संयोगसे पैदा होनेवाले भोग (सुख) हैं, वे आदि-अन्तवाले और दुःखके ही कारण हैं। अतः विवेकशील मनुष्य उनमें रमण नहीं करता।"},{"c":5,"v":23,"sp":"krishna","sa":"शक्नोतीहैव यः सोढुं प्राक्शरीरविमोक्षणात् ।\nकामक्रोधोद्भवं वेगं स युक्तः स सुखी नरः ॥","tr":"śaknotīhaiva yaḥ soḍhuṃ prākśarīravimokṣaṇāt\nkāmakrodhodbhavaṃ vegaṃ sa yuktaḥ sa sukhī naraḥ","gs":"શક્નોતીહૈવ યઃ સોઢું પ્રાક્શરીરવિમોક્ષણાત્ ।\nકામક્રોધોદ્ભવં વેગં સ યુક્તઃ સ સુખી નરઃ ॥","en":"He who is able, while still here in this world, to withstand the impulse born out of desire and anger before the liberation from the body, he is a Yogi, and he is a happy man.","hi":"इस मनुष्य-शरीरमें जो कोई (मनुष्य) शरीर छूटनेसे पहले ही काम-क्रोधसे उत्पन्न होनेवाले वेगको सहन करनेमें समर्थ होता है, वह नर योगी है और वही सुखी है।"},{"c":5,"v":24,"sp":"krishna","sa":"योऽन्तःसुखोऽन्तरारामस्तथान्तर्ज्योतिरेव यः ।\nस योगी ब्रह्मनिर्वाणं ब्रह्मभूतोऽधिगच्छति ॥","tr":"yo'ntaḥsukho'ntarārāmastathāntarjyotireva yaḥ\nsa yogī brahmanirvāṇaṃ brahmabhūto'dhigacchati","gs":"યોઽન્તઃસુખોઽન્તરારામસ્તથાન્તર્જ્યોતિરેવ યઃ ।\nસ યોગી બ્રહ્મનિર્વાણં બ્રહ્મભૂતોઽધિગચ્છતિ ॥","en":"He who is happy within, who rejoices within, and who is illuminated within, that Yogi attains absolute freedom, or Moksha, becoming Brahman himself.","hi":"जो मनुष्य केवल परमात्मामें सुखवाला है और केवल परमात्मामें रमण करनेवाला है तथा जो केवल परमात्मामें ज्ञानवाला है, वह ब्रह्ममें अपनी स्थितिका अनुभव करनेवाला सांख्ययोगी निर्वाण ब्रह्मको प्राप्त होता है।"},{"c":5,"v":25,"sp":"krishna","sa":"लभन्ते ब्रह्मनिर्वाणमृषयः क्षीणकल्मषाः ।\nछिन्नद्वैधा यतात्मानः सर्वभूतहिते रताः ॥","tr":"labhante brahmanirvāṇamṛṣayaḥ kṣīṇakalmaṣāḥ\nchinnadvaidhā yatātmānaḥ sarvabhūtahite ratāḥ","gs":"લભન્તે બ્રહ્મનિર્વાણમૃષયઃ ક્ષીણકલ્મષાઃ ।\nછિન્નદ્વૈધા યતાત્માનઃ સર્વભૂતહિતે રતાઃ ॥","en":"The sages obtain absolute freedom or Moksha when their sins have been destroyed, their dualities have been torn asunder, they are self-controlled, and they are intent on the welfare of all beings.","hi":"जिनका शरीर मन-बुद्धि-इन्द्रियोंसहित वशमें है, जो सम्पूर्ण प्राणियोंके हितमें रत हैं, जिनके सम्पूर्ण संशय मिट गये हैं, जिनके सम्पूर्ण कल्मष (दोष) नष्ट हो गये हैं, वे विवेकी साधक निर्वाण ब्रह्मको प्राप्त होते हैं।"},{"c":5,"v":26,"sp":"krishna","sa":"कामक्रोधवियुक्तानां यतीनां यतचेतसाम् ।\nअभितो ब्रह्मनिर्वाणं वर्तते विदितात्मनाम् ॥","tr":"kāmakrodhaviyuktānāṃ yatīnāṃ yatacetasām\nabhito brahmanirvāṇaṃ vartate viditātmanām","gs":"કામક્રોધવિયુક્તાનાં યતીનાં યતચેતસામ્ ।\nઅભિતો બ્રહ્મનિર્વાણં વર્તતે વિદિતાત્મનામ્ ॥","en":"Absolute freedom exists on all sides for those self-controlled ascetics who are free from desire and anger, who have controlled their thoughts, and who have realized the Self.","hi":"काम-क्रोधसे सर्वथा रहित, जीते हुए मनवाले और स्वरूपका साक्षात्कार किये हुए सांख्ययोगियोंके लिये दोनों ओरसे--शरीरके रहते हुए अथवा शरीर छूटनेके बाद) निर्वाण ब्रह्म परिपूर्ण है।"},{"c":5,"v":27,"sp":"krishna","sa":"स्पर्शान्कृत्वा बहिर्बाह्यांश्चक्षुश्चैवान्तरे भ्रुवोः ।\nप्राणापानौ समौ कृत्वा नासाभ्यन्तरचारिणौ ॥","tr":"sparśānkṛtvā bahirbāhyāṃścakṣuścaivāntare bhruvoḥ\nprāṇāpānau samau kṛtvā nāsābhyantaracāriṇau","gs":"સ્પર્શાન્કૃત્વા બહિર્બાહ્યાંશ્ચક્ષુશ્ચૈવાન્તરે ભ્રુવોઃ ।\nપ્રાણાપાનૌ સમૌ કૃત્વા નાસાભ્યન્તરચારિણૌ ॥","en":"Shutting out all external contacts and fixing the gaze between the eyebrows, realizing the outgoing and incoming breaths moving within the nostrils.","hi":"।।5.27 -- 5.28।। बाह्य पदार्थोंको बाहर ही छोड़कर और नेत्रोंकी दृष्टिको भौंहोंके बीचमें स्थित करके तथा नासिकामें विचरनेवाले प्राण और अपान वायुको सम करके जिसकी इन्द्रियाँ, मन और बुद्धि अपने वशमें हैं, जो मोक्ष-परायण है तथा जो इच्छा, भय और क्रोधसे सर्वथा रहित है, वह मुनि सदा मुक्त ही है।"},{"c":5,"v":28,"sp":"krishna","sa":"यतेन्द्रियमनोबुद्धिर्मुनिर्मोक्षपरायणः ।\nविगतेच्छाभयक्रोधो यः सदा मुक्त एव सः ॥","tr":"yatendriyamanobuddhirmunirmokṣaparāyaṇaḥ\nvigatecchābhayakrodho yaḥ sadā mukta eva saḥ","gs":"યતેન્દ્રિયમનોબુદ્ધિર્મુનિર્મોક્ષપરાયણઃ ।\nવિગતેચ્છાભયક્રોધો યઃ સદા મુક્ત એવ સઃ ॥","en":"With the senses, mind, and intellect ever controlled, having liberation as their supreme goal, free from desire, fear, and anger, the sage is truly liberated forever.","hi":"।।5.27 -- 5.28।। बाह्य पदार्थोंको बाहर ही छोड़कर और नेत्रोंकी दृष्टिको भौंहोंके बीचमें स्थित करके तथा नासिकामें विचरनेवाले प्राण और अपान वायुको सम करके जिसकी इन्द्रियाँ, मन और बुद्धि अपने वशमें हैं, जो मोक्ष-परायण है तथा जो इच्छा, भय और क्रोधसे सर्वथा रहित है, वह मुनि सदा मुक्त ही है।"},{"c":5,"v":29,"sp":"krishna","sa":"भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम् ।\nसुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति ॥","tr":"bhoktāraṃ yajñatapasāṃ sarvalokamaheśvaram\nsuhṛdaṃ sarvabhūtānāṃ jñātvā māṃ śāntimṛcchati","gs":"ભોક્તારં યજ્ઞતપસાં સર્વલોકમહેશ્વરમ્ ।\nસુહૃદં સર્વભૂતાનાં જ્ઞાત્વા માં શાન્તિમૃચ્છતિ ॥","en":"He who knows Me as the enjoyer of sacrifices and austerities, the great Lord of all the worlds, and the friend of all beings, attains peace.","hi":"भक्त मुझे सब यज्ञों और तपोंका भोक्ता, सम्पूर्ण लोकोंका महान् ईश्वर तथा सम्पूर्ण प्राणियोंका सुहृद् (स्वार्थरहित दयालु और प्रेमी) जानकर शान्तिको प्राप्त हो जाता है।"},{"c":6,"v":1,"sp":"krishna","sa":"अनाश्रितः कर्मफलं कार्यं कर्म करोति यः ।\nस संन्यासी च योगी च न निरग्निर्न चाक्रियः ॥","tr":"anāśritaḥ karmaphalaṃ kāryaṃ karma karoti yaḥ\nsa saṃnyāsī ca yogī ca na niragnirna cākriyaḥ","gs":"અનાશ્રિતઃ કર્મફલં કાર્યં કર્મ કરોતિ યઃ ।\nસ સંન્યાસી ચ યોગી ચ ન નિરગ્નિર્ન ચાક્રિયઃ ॥","en":"The Blessed Lord said: He who performs his bounden duty without depending on the fruits of his actions—he is a sannyasi and a yogi, not he who is without fire and without action.","hi":"श्रीभगवान् बोले -- कर्मफलका आश्रय न लेकर जो कर्तव्यकर्म करता है, वही संन्यासी तथा योगी है; और केवल अग्निका त्याग करनेवाला संन्यासी नहीं होता तथा केवल क्रियाओंका त्याग करनेवाला योगी नहीं होता।"},{"c":6,"v":2,"sp":"krishna","sa":"यं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव ।\nन ह्यसंन्यस्तसङ्कल्पो योगी भवति कश्चन ॥","tr":"yaṃ saṃnyāsamiti prāhuryogaṃ taṃ viddhi pāṇḍava\nna hyasaṃnyastasaṅkalpo yogī bhavati kaścana","gs":"યં સંન્યાસમિતિ પ્રાહુર્યોગં તં વિદ્ધિ પાણ્ડવ ।\nન હ્યસંન્યસ્તસઙ્કલ્પો યોગી ભવતિ કશ્ચન ॥","en":"Do you, O Arjuna, know that Yoga is what they call renunciation; no one indeed becomes a Yogi who has not renounced their thoughts.","hi":"हे अर्जुन ! लोग जिसको संन्यास कहते हैं, उसीको तुम योग समझो; क्योंकि संकल्पोंका त्याग किये बिना मनुष्य कोई-सा भी योगी नहीं हो सकता।"},{"c":6,"v":3,"sp":"krishna","sa":"आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते ।\nयोगारूढस्य तस्यैव शमः कारणमुच्यते ॥","tr":"ārurukṣormuneryogaṃ karma kāraṇamucyate\nyogārūḍhasya tasyaiva śamaḥ kāraṇamucyate","gs":"આરુરુક્ષોર્મુનેર્યોગં કર્મ કારણમુચ્યતે ।\nયોગારૂઢસ્ય તસ્યૈવ શમઃ કારણમુચ્યતે ॥","en":"For a sage who wishes to attain to Yoga, action is said to be the means; for the same sage who has attained Yoga, inaction is said to be the means.","hi":"जो योग-(समता-) में आरूढ़ होना चाहता है, ऐसे मननशील योगीके लिये कर्तव्य-कर्म करना कारण कहा गया है और उसी योगारूढ़ मनुष्यका शम (शान्ति) परमात्मप्राप्तिमें कारण कहा गया है।"},{"c":6,"v":4,"sp":"krishna","sa":"यदा हि नेन्द्रियार्थेषु न कर्मस्वनुषज्जते ।\nसर्वसङ्कल्पसंन्यासी योगारूढस्तदोच्यते ॥","tr":"yadā hi nendriyārtheṣu na karmasvanuṣajjate\nsarvasaṅkalpasaṃnyāsī yogārūḍhastadocyate","gs":"યદા હિ નેન્દ્રિયાર્થેષુ ન કર્મસ્વનુષજ્જતે ।\nસર્વસઙ્કલ્પસંન્યાસી યોગારૂઢસ્તદોચ્યતે ॥","en":"When a person is not attached to the sense-objects or to actions, having renounced all thoughts, then they are said to have attained Yoga.","hi":"जिस समय न इन्द्रियोंके भोगोंमें तथा न कर्मोंमें ही आसक्त होता है, उस समय वह सम्पूर्ण संकल्पोंका त्यागी मनुष्य योगारूढ़ कहा जाता है।"},{"c":6,"v":5,"sp":"krishna","sa":"उद्धरेदात्मनाऽऽत्मानं नात्मानमवसादयेत् ।\nआत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः ॥","tr":"uddharedātmanā''tmānaṃ nātmānamavasādayet\nātmaiva hyātmano bandhurātmaiva ripurātmanaḥ","gs":"ઉદ્ધરેદાત્મનાઽઽત્માનં નાત્માનમવસાદયેત્ ।\nઆત્મૈવ હ્યાત્મનો બન્ધુરાત્મૈવ રિપુરાત્મનઃ ॥","en":"One should raise oneself by one's own self alone; let not one lower oneself; for the self alone is one's own friend, and the self alone is one's own enemy.","hi":"अपने द्वारा अपना उद्धार करे, अपना पतन न करे; क्योंकि आप ही अपना मित्र है और आप ही अपना शत्रु है।"},{"c":6,"v":6,"sp":"krishna","sa":"बन्धुरात्माऽऽत्मनस्तस्य येनात्मैवात्मना जितः ।\nअनात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत् ॥","tr":"bandhurātmā''tmanastasya yenātmaivātmanā jitaḥ\nanātmanastu śatrutve vartetātmaiva śatruvat","gs":"બન્ધુરાત્માઽઽત્મનસ્તસ્ય યેનાત્મૈવાત્મના જિતઃ ।\nઅનાત્મનસ્તુ શત્રુત્વે વર્તેતાત્મૈવ શત્રુવત્ ॥","en":"The Self is the friend of the self of him by whom the Self has been conquered; but to the unconquered self, this Self stands in the position of an enemy, like an external foe.","hi":"जिसने अपने-आपसे अपने-आपको जीत लिया है, उसके लिये आप ही अपना बन्धु है और जिसने अपने-आपको नहीं जीता है, ऐसे अनात्माका आत्मा ही शत्रुतामें शत्रुकी तरह बर्ताव करता है।"},{"c":6,"v":7,"sp":"krishna","sa":"जितात्मनः प्रशान्तस्य परमात्मा समाहितः ।\nशीतोष्णसुखदुःखेषु तथा मानापमानयोः ॥","tr":"jitātmanaḥ praśāntasya paramātmā samāhitaḥ\nśītoṣṇasukhaduḥkheṣu tathā mānāpamānayoḥ","gs":"જિતાત્મનઃ પ્રશાન્તસ્ય પરમાત્મા સમાહિતઃ ।\nશીતોષ્ણસુખદુઃખેષુ તથા માનાપમાનયોઃ ॥","en":"The Supreme Self of him who is self-controlled and peaceful remains balanced in cold and heat, pleasure and pain, as well as in honor and dishonor.","hi":"जिसने अपने-आपपर अपनी विजय कर ली है, उस शीत-उष्ण (अनुकूलता-प्रतिकूलता) सुख-दुःख तथा मान-अपमानमें निर्विकार मनुष्यको परमात्मा नित्यप्राप्त हैं।"},{"c":6,"v":8,"sp":"krishna","sa":"ज्ञानविज्ञानतृप्तात्मा कूटस्थो विजितेन्द्रियः ।\nयुक्त इत्युच्यते योगी समलोष्टाश्मकाञ्चनः ॥","tr":"jñānavijñānatṛptātmā kūṭastho vijitendriyaḥ\nyukta ityucyate yogī samaloṣṭāśmakāñcanaḥ","gs":"જ્ઞાનવિજ્ઞાનતૃપ્તાત્મા કૂટસ્થો વિજિતેન્દ્રિયઃ ।\nયુક્ત ઇત્યુચ્યતે યોગી સમલોષ્ટાશ્મકાઞ્ચનઃ ॥","en":"The Yogi who is satisfied with the knowledge and wisdom of the Self, who has conquered the senses, and to whom a clod of earth, a piece of stone, and gold are all the same, is said to have attained Nirvikalpa Samadhi.","hi":"जिसका अन्तःकरण ज्ञान-विज्ञानसे तृप्त है, जो कूटकी तरह निर्विकार है, जितेन्द्रिय है और मिट्टीके ढेले, पत्थर तथा स्वर्णमें समबुद्धिवाला है -- ऐसा योगी युक्त (योगारूढ़) कहा जाता है।"},{"c":6,"v":9,"sp":"krishna","sa":"सुहृन्मित्रार्युदासीनमध्यस्थद्वेष्यबन्धुषु ।\nसाधुष्वपि च पापेषु समबुद्धिर्विशिष्यते ॥","tr":"suhṛnmitrāryudāsīnamadhyasthadveṣyabandhuṣu\nsādhuṣvapi ca pāpeṣu samabuddhirviśiṣyate","gs":"સુહૃન્મિત્રાર્યુદાસીનમધ્યસ્થદ્વેષ્યબન્ધુષુ ।\nસાધુષ્વપિ ચ પાપેષુ સમબુદ્ધિર્વિશિષ્યતે ॥","en":"He who is of the same mind towards the good-hearted, friends, enemies, the indifferent, the neutral, the hateful, the relatives, the righteous, and the unrighteous, excels.","hi":"सुहृद्, मित्र, वैरी, उदासीन, मध्यस्थ, द्वेष्य और सम्बन्धियोंमें तथा साधु-आचरण करनेवालोंमें और पाप-आचरण करनेवालोंमें भी समबुद्धिवाला मनुष्य श्रेष्ठ है।"},{"c":6,"v":10,"sp":"krishna","sa":"योगी युञ्जीत सततमात्मानं रहसि स्थितः ।\nएकाकी यतचित्तात्मा निराशीरपरिग्रहः ॥","tr":"yogī yuñjīta satatamātmānaṃ rahasi sthitaḥ\nekākī yatacittātmā nirāśīraparigrahaḥ","gs":"યોગી યુઞ્જીત સતતમાત્માનં રહસિ સ્થિતઃ ।\nએકાકી યતચિત્તાત્મા નિરાશીરપરિગ્રહઃ ॥","en":"Let the yogi constantly strive to keep the mind steady, remaining in solitude, alone, with the body and mind controlled, and free from hope and greed.","hi":"भोगबुद्धिसे संग्रह न करनेवाला, इच्छारहित और अन्तःकरण तथा शरीरको वशमें रखनेवाला योगी अकेला एकान्तमें स्थित होकर मनको निरन्तर परमात्मामें लगाये।"},{"c":6,"v":11,"sp":"krishna","sa":"शुचौ देशे प्रतिष्ठाप्य स्थिरमासनमात्मनः ।\nनात्युच्छ्रितं नातिनीचं चैलाजिनकुशोत्तरम् ॥","tr":"śucau deśe pratiṣṭhāpya sthiramāsanamātmanaḥ\nnātyucchritaṃ nātinīcaṃ cailājinakuśottaram","gs":"શુચૌ દેશે પ્રતિષ્ઠાપ્ય સ્થિરમાસનમાત્મનઃ ।\nનાત્યુચ્છ્રિતં નાતિનીચં ચૈલાજિનકુશોત્તરમ્ ॥","en":"In a clean spot, having established a firm seat of his own, neither too high nor too low, made of cloth, skin, and kusha grass layered one over the other.","hi":"शुद्ध भूमिपर, जिसपर क्रमशः कुश, मृगछाला और वस्त्र बिछे हैं, जो न अत्यन्त ऊँचा है और न अत्यन्त नीचा, ऐसे अपने आसनको स्थिरस्थापन करके।"},{"c":6,"v":12,"sp":"krishna","sa":"तत्रैकाग्रं मनः कृत्वा यतचित्तेन्द्रियक्रियः ।\nउपविश्यासने युञ्ज्याद्योगमात्मविशुद्धये ॥","tr":"tatraikāgraṃ manaḥ kṛtvā yatacittendriyakriyaḥ\nupaviśyāsane yuñjyādyogamātmaviśuddhaye","gs":"તત્રૈકાગ્રં મનઃ કૃત્વા યતચિત્તેન્દ્રિયક્રિયઃ ।\nઉપવિશ્યાસને યુઞ્જ્યાદ્યોગમાત્મવિશુદ્ધયે ॥","en":"There, having made the mind one-pointed, with the actions of the mind and senses controlled, let him, seated on the seat, practice Yoga for the purification of the self.","hi":"उस आसनपर बैठकर चित्त और इन्द्रियोंकी क्रियाओंको वशमें रखते हुए मनको एकाग्र करके अन्तःकरणकी शुद्धिके लिये योगका अभ्यास करे।"},{"c":6,"v":13,"sp":"krishna","sa":"समं कायशिरोग्रीवं धारयन्नचलं स्थिरः ।\nसंप्रेक्ष्य नासिकाग्रं स्वं दिशश्चानवलोकयन् ॥","tr":"samaṃ kāyaśirogrīvaṃ dhārayannacalaṃ sthiraḥ\nsaṃprekṣya nāsikāgraṃ svaṃ diśaścānavalokayan","gs":"સમં કાયશિરોગ્રીવં ધારયન્નચલં સ્થિરઃ ।\nસંપ્રેક્ષ્ય નાસિકાગ્રં સ્વં દિશશ્ચાનવલોકયન્ ॥","en":"Let him firmly hold his body, head, and neck erect and still, gazing at the tip of his nose without looking around.","hi":"काया, शिर और ग्रीवाको सीधे अचल धारण करके तथा दिशाओंको न देखकर केवल अपनी नासिकाके अग्रभागको देखते हुए स्थिर होकर बैठे।"},{"c":6,"v":14,"sp":"krishna","sa":"प्रशान्तात्मा विगतभीर्ब्रह्मचारिव्रते स्थितः ।\nमनः संयम्य मच्चित्तो युक्त आसीत मत्परः ॥","tr":"praśāntātmā vigatabhīrbrahmacārivrate sthitaḥ\nmanaḥ saṃyamya maccitto yukta āsīta matparaḥ","gs":"પ્રશાન્તાત્મા વિગતભીર્બ્રહ્મચારિવ્રતે સ્થિતઃ ।\nમનઃ સંયમ્ય મચ્ચિત્તો યુક્ત આસીત મત્પરઃ ॥","en":"Serene-minded, fearless, firm in the vow of a Brahmachari, having controlled their mind, thinking of Me and balanced in mind, let them sit, having Me as their supreme goal.","hi":"जिसका अन्तःकरण शान्त है, जो भय-रहित है और जो ब्रह्मचारिव्रतमें स्थित है, ऐसा सावधान योगी मनका संयम करके मेरेमें चित्त लगाता हुआ मेरे परायण होकर बैठे।"},{"c":6,"v":15,"sp":"krishna","sa":"युञ्जन्नेवं सदाऽऽत्मानं योगी नियतमानसः ।\nशान्तिं निर्वाणपरमां मत्संस्थामधिगच्छति ॥","tr":"yuñjannevaṃ sadā''tmānaṃ yogī niyatamānasaḥ\nśāntiṃ nirvāṇaparamāṃ matsaṃsthāmadhigacchati","gs":"યુઞ્જન્નેવં સદાઽઽત્માનં યોગી નિયતમાનસઃ ।\nશાન્તિં નિર્વાણપરમાં મત્સંસ્થામધિગચ્છતિ ॥","en":"Thus, always keeping the mind balanced, the yogi, with the mind controlled, attains the peace abiding in Me, culminating in liberation.","hi":"नियत मनवाला योगी मनको इस तरहसे सदा परमात्मामें लगाता हुआ मेरेमें सम्यक् स्थितिवाली जो निर्वाणपरमा शान्ति है, उसको प्राप्त हो जाता है।"},{"c":6,"v":16,"sp":"krishna","sa":"नात्यश्नतस्तु योगोऽस्ति न चैकान्तमनश्नतः ।\nन चातिस्वप्नशीलस्य जाग्रतो नैव चार्जुन ॥","tr":"nātyaśnatastu yogo'sti na caikāntamanaśnataḥ\nna cātisvapnaśīlasya jāgrato naiva cārjuna","gs":"નાત્યશ્નતસ્તુ યોગોઽસ્તિ ન ચૈકાન્તમનશ્નતઃ ।\nન ચાતિસ્વપ્નશીલસ્ય જાગ્રતો નૈવ ચાર્જુન ॥","en":"Verily, Yoga is not possible for him who eats too much, nor for him who does not eat at all, nor for him who sleeps too much, nor for him who is always awake, O Arjuna.","hi":"हे अर्जुन ! यह योग न तो अधिक खानेवालेका और न बिलकुल न खानेवालेका तथा न अधिक सोनेवालेका और न बिलकुल न सोनेवालेका ही सिद्ध होता है।"},{"c":6,"v":17,"sp":"krishna","sa":"युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु ।\nयुक्तस्वप्नावबोधस्य योगो भवति दुःखहा ॥","tr":"yuktāhāravihārasya yuktaceṣṭasya karmasu\nyuktasvapnāvabodhasya yogo bhavati duḥkhahā","gs":"યુક્તાહારવિહારસ્ય યુક્તચેષ્ટસ્ય કર્મસુ ।\nયુક્તસ્વપ્નાવબોધસ્ય યોગો ભવતિ દુઃખહા ॥","en":"Yoga becomes the destroyer of pain for him who is moderate in eating and recreation (such as walking, etc.), who exercises moderation in action, and who is moderate in sleep and wakefulness.","hi":"दुःखोंका नाश करनेवाला योग तो यथायोग्य आहार और विहार करनेवालेका, कर्मोंमें यथायोग्य चेष्टा करनेवालेका तथा यथायोग्य सोने और जागनेवालेका ही सिद्ध होता है।"},{"c":6,"v":18,"sp":"krishna","sa":"यदा विनियतं चित्तमात्मन्येवावतिष्ठते ।\nनिःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा ॥","tr":"yadā viniyataṃ cittamātmanyevāvatiṣṭhate\nniḥspṛhaḥ sarvakāmebhyo yukta ityucyate tadā","gs":"યદા વિનિયતં ચિત્તમાત્મન્યેવાવતિષ્ઠતે ।\nનિઃસ્પૃહઃ સર્વકામેભ્યો યુક્ત ઇત્યુચ્યતે તદા ॥","en":"When the perfectly controlled mind rests in the Self alone, free from longing for any of the objects of desire, then it is said, 'He is united'.","hi":"वशमें किया हुआ चित्त जिस कालमें अपने स्वरूपमें ही स्थित हो जाता है और स्वयं सम्पूर्ण पदार्थोंसे निःस्पृह हो जाता है, उस कालमें वह योगी है - ऐसा कहा जाता है।"},{"c":6,"v":19,"sp":"krishna","sa":"यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता ।\nयोगिनो यतचित्तस्य युञ्जतो योगमात्मनः ॥","tr":"yathā dīpo nivātastho neṅgate sopamā smṛtā\nyogino yatacittasya yuñjato yogamātmanaḥ","gs":"યથા દીપો નિવાતસ્થો નેઙ્ગતે સોપમા સ્મૃતા ।\nયોગિનો યતચિત્તસ્ય યુઞ્જતો યોગમાત્મનઃ ॥","en":"As a lamp placed in a windless spot does not flicker, so is the Yogi of a controlled mind, who practices Yoga in the Self, compared.","hi":"जैसे स्पन्दनरहित वायुके स्थानमें स्थित दीपककी लौ चेष्टारहित हो जाती है, योगका अभ्यास करते हुए वश में किए हुए चित्तवाले योगीके चित्तकी वैसी ही उपमा कही गयी है।"},{"c":6,"v":20,"sp":"krishna","sa":"यत्रोपरमते चित्तं निरुद्धं योगसेवया ।\nयत्र चैवात्मनाऽऽत्मानं पश्यन्नात्मनि तुष्यति ॥","tr":"yatroparamate cittaṃ niruddhaṃ yogasevayā\nyatra caivātmanā''tmānaṃ paśyannātmani tuṣyati","gs":"યત્રોપરમતે ચિત્તં નિરુદ્ધં યોગસેવયા ।\nયત્ર ચૈવાત્મનાઽઽત્માનં પશ્યન્નાત્મનિ તુષ્યતિ ॥","en":"When the mind, restrained by the practice of yoga, attains quietude, and when one sees the Self by the Self, they are satisfied in their own Self.","hi":"योगका सेवन करनेसे जिस अवस्थामें निरुद्ध चित्त उपराम हो जाता है तथा जिस अवस्थामें स्वयं अपने-आप से अपने-आपको देखता हुआ अपने-आपमें ही सन्तुष्ट हो जाता है।"},{"c":6,"v":21,"sp":"krishna","sa":"सुखमात्यन्तिकं यत्तद्बुद्धिग्राह्यमतीन्द्रियम् ।\nवेत्ति यत्र न चैवायं स्थितश्चलति तत्त्वतः ॥","tr":"sukhamātyantikaṃ yattadbuddhigrāhyamatīndriyam\nvetti yatra na caivāyaṃ sthitaścalati tattvataḥ","gs":"સુખમાત્યન્તિકં યત્તદ્બુદ્ધિગ્રાહ્યમતીન્દ્રિયમ્ ।\nવેત્તિ યત્ર ન ચૈવાયં સ્થિતશ્ચલતિ તત્ત્વતઃ ॥","en":"When he (the Yogi) feels that infinite bliss which can be grasped by the pure intellect and which transcends the senses, and is established therein, never moving away from the reality.","hi":"जो सुख आत्यन्तिक, अतीन्द्रिय और बुद्धिग्राह्य है, उस सुखका जिस अवस्थामें अनुभव करता है और जिस सुखमें स्थित हुआ यह ध्यानयोगी फिर कभी तत्त्वसे विचलित नहीं होता।"},{"c":6,"v":22,"sp":"krishna","sa":"यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः ।\nयस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते ॥","tr":"yaṃ labdhvā cāparaṃ lābhaṃ manyate nādhikaṃ tataḥ\nyasminsthito na duḥkhena guruṇāpi vicālyate","gs":"યં લબ્ધ્વા ચાપરં લાભં મન્યતે નાધિકં તતઃ ।\nયસ્મિન્સ્થિતો ન દુઃખેન ગુરુણાપિ વિચાલ્યતે ॥","en":"Having obtained it, he thinks there is no other gain superior to it; established in it, he is not moved even by heavy sorrow.","hi":"जिस लाभकी प्राप्ति होनेपर उससे अधिक कोई दूसरा लाभ उसके माननेमें भी नहीं आता और जिसमें स्थित होनेपर वह बड़े भारी दुःखसे भी विचलित नहीं किया जा सकता।"},{"c":6,"v":23,"sp":"krishna","sa":"तं विद्याद् दुःखसंयोगवियोगं योगसंज्ञितम् ।\nस निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा ॥","tr":"taṃ vidyād duḥkhasaṃyogaviyogaṃ yogasaṃjñitam\nsa niścayena yoktavyo yogo'nirviṇṇacetasā","gs":"તં વિદ્યાદ્ દુઃખસંયોગવિયોગં યોગસંજ્ઞિતમ્ ।\nસ નિશ્ચયેન યોક્તવ્યો યોગોઽનિર્વિણ્ણચેતસા ॥","en":"Let this be known by the name of Yoga, the severance from union with pain. This Yoga should be practiced with determination and with an undespairing mind.","hi":"जिसमें दुःखोंके संयोगका ही वियोग है, उसीको 'योग' नामसे जानना चाहिये। (वह योग जिस ध्यानयोगका लक्ष्य है,) उस ध्यानयोगका अभ्यास न उकताये हुए चित्तसे निश्चयपूर्वक करना चाहिये।"},{"c":6,"v":24,"sp":"krishna","sa":"सङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः ।\nमनसैवेन्द्रियग्रामं विनियम्य समन्ततः ॥","tr":"saṅkalpaprabhavānkāmāṃstyaktvā sarvānaśeṣataḥ\nmanasaivendriyagrāmaṃ viniyamya samantataḥ","gs":"સઙ્કલ્પપ્રભવાન્કામાંસ્ત્યક્ત્વા સર્વાનશેષતઃ ।\nમનસૈવેન્દ્રિયગ્રામં વિનિયમ્ય સમન્તતઃ ॥","en":"Abandoning unreservedly all desires born of Sankalpa (thought and imagination) and completely restraining the whole group of senses by the mind from all sides.","hi":"संकल्पसे उत्पन्न होनेवाली सम्पूर्ण कामनाओंका सर्वथा त्याग करके और मनसे ही इन्द्रिय-समूहको सभी ओरसे हटाकर।"},{"c":6,"v":25,"sp":"krishna","sa":"शनैः शनैरुपरमेद् बुद्ध्या धृतिगृहीतया ।\nआत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत् ॥","tr":"śanaiḥ śanairuparamed buddhyā dhṛtigṛhītayā\nātmasaṃsthaṃ manaḥ kṛtvā na kiñcidapi cintayet","gs":"શનૈઃ શનૈરુપરમેદ્ બુદ્ધ્યા ધૃતિગૃહીતયા ।\nઆત્મસંસ્થં મનઃ કૃત્વા ન કિઞ્ચિદપિ ચિન્તયેત્ ॥","en":"Little by little, let him attain steadiness of the intellect by holding it firmly; having made the mind establish itself in the Self, let him not think of anything else.","hi":"धैर्ययुक्त बुद्धिके द्वारा संसारसे धीरे-धीरे उपराम हो जाय और परमात्मस्वरूपमें मन-(बुद्धि-) को सम्यक् प्रकारसे स्थापन करके फिर कुछ भी चिन्तन न करे।"},{"c":6,"v":26,"sp":"krishna","sa":"यतो यतो निश्चरति मनश्चञ्चलमस्थिरम् ।\nततस्ततो नियम्यैतदात्मन्येव वशं नयेत् ॥","tr":"yato yato niścarati manaścañcalamasthiram\ntatastato niyamyaitadātmanyeva vaśaṃ nayet","gs":"યતો યતો નિશ્ચરતિ મનશ્ચઞ્ચલમસ્થિરમ્ ।\nતતસ્તતો નિયમ્યૈતદાત્મન્યેવ વશં નયેત્ ॥","en":"From whatever cause the restless and unsteady mind wanders away, let him restrain it from that and bring it under the control of the Self alone.","hi":"यह अस्थिर और चञ्चल मन जहाँ-जहाँ विचरण करता है, वहाँ-वहाँसे हटाकर इसको एक परमात्मामें ही लगाये।"},{"c":6,"v":27,"sp":"krishna","sa":"प्रशान्तमनसं ह्येनं योगिनं सुखमुत्तमम् ।\nउपैति शान्तरजसं ब्रह्मभूतमकल्मषम् ॥","tr":"praśāntamanasaṃ hyenaṃ yoginaṃ sukhamuttamam\nupaiti śāntarajasaṃ brahmabhūtamakalmaṣam","gs":"પ્રશાન્તમનસં હ્યેનં યોગિનં સુખમુત્તમમ્ ।\nઉપૈતિ શાન્તરજસં બ્રહ્મભૂતમકલ્મષમ્ ॥","en":"Supreme Bliss indeed comes to this Yogi whose mind is made peaceful, whose passion is quelled, who has become Brahman, and who is free from sin.","hi":"जिसके सब पाप नष्ट हो गये हैं, जिसका रजोगुण तथा मन सर्वथा शान्त(निर्मल) हो गया है, ऐसे इस ब्रह्मस्वरूप योगीको निश्चित ही उत्तम (सात्त्विक) सुख प्राप्त होता है।"},{"c":6,"v":28,"sp":"krishna","sa":"युञ्जन्नेवं सदाऽऽत्मानं योगी विगतकल्मषः ।\nसुखेन ब्रह्मसंस्पर्शमत्यन्तं सुखमश्नुते ॥","tr":"yuñjannevaṃ sadā''tmānaṃ yogī vigatakalmaṣaḥ\nsukhena brahmasaṃsparśamatyantaṃ sukhamaśnute","gs":"યુઞ્જન્નેવં સદાઽઽત્માનં યોગી વિગતકલ્મષઃ ।\nસુખેન બ્રહ્મસંસ્પર્શમત્યન્તં સુખમશ્નુતે ॥","en":"The yogi, always engaging the mind thus (in the practice of yoga), is freed from sins and easily enjoys the infinite bliss of contact with Brahman (the Eternal).","hi":"इस प्रकार अपने-आपको सदा परमात्मामें लगाता हुआ पापरहित योगी सुखपूर्वक ब्रह्मप्राप्तिरूप अत्यन्त सुखको प्राप्त हो जाता है।"},{"c":6,"v":29,"sp":"krishna","sa":"सर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि ।\nईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः ॥","tr":"sarvabhūtasthamātmānaṃ sarvabhūtāni cātmani\nīkṣate yogayuktātmā sarvatra samadarśanaḥ","gs":"સર્વભૂતસ્થમાત્માનં સર્વભૂતાનિ ચાત્મનિ ।\nઈક્ષતે યોગયુક્તાત્મા સર્વત્ર સમદર્શનઃ ॥","en":"With the mind harmonized by Yoga, he sees the Self abiding in all beings and all beings in the Self; he sees the same everywhere.","hi":"सब जगह अपने स्वरूपको देखनेवाला और ध्यानयोगसे युक्त अन्तःकरणवाला योगा अपने स्वरूपको सम्पूर्ण प्राणियोंमें स्थित देखता है और सम्पूर्ण प्राणियोंको अपने स्वरूपमें देखता है।"},{"c":6,"v":30,"sp":"krishna","sa":"यो मां पश्यति सर्वत्र सर्वं च मयि पश्यति ।\nतस्याहं न प्रणश्यामि स च मे न प्रणश्यति ॥","tr":"yo māṃ paśyati sarvatra sarvaṃ ca mayi paśyati\ntasyāhaṃ na praṇaśyāmi sa ca me na praṇaśyati","gs":"યો માં પશ્યતિ સર્વત્ર સર્વં ચ મયિ પશ્યતિ ।\nતસ્યાહં ન પ્રણશ્યામિ સ ચ મે ન પ્રણશ્યતિ ॥","en":"He who sees Me everywhere and sees everything in Me, never becomes separated from Me, nor do I from him.","hi":"जो सबमें मुझे देखता है और सबको मुझमें देखता है, उसके लिये मैं अदृश्य नहीं होता और वह मेरे लिये अदृश्य नहीं होता।"},{"c":6,"v":31,"sp":"krishna","sa":"सर्वभूतस्थितं यो मां भजत्येकत्वमास्थितः ।\nसर्वथा वर्तमानोऽपि स योगी मयि वर्तते ॥","tr":"sarvabhūtasthitaṃ yo māṃ bhajatyekatvamāsthitaḥ\nsarvathā vartamāno'pi sa yogī mayi vartate","gs":"સર્વભૂતસ્થિતં યો માં ભજત્યેકત્વમાસ્થિતઃ ।\nસર્વથા વર્તમાનોઽપિ સ યોગી મયિ વર્તતે ॥","en":"He who, being established in unity, worships Me, who dwells in all beings, that yogi abides in Me, whatever their mode of living may be.","hi":"मेरेमें एकीभावसे स्थित हुआ जो योगी सम्पूर्ण प्राणियोंमें स्थित मेरा भजन करता है, वह सब कुछ बर्ताव करता हुआ भी मेरेमें ही बर्ताव कर रहा है अर्थात् वह सर्वथा मेरेमें ही स्थित है।"},{"c":6,"v":32,"sp":"krishna","sa":"आत्मौपम्येन सर्वत्र समं पश्यति योऽर्जुन ।\nसुखं वा यदि वा दुःखं सः योगी परमो मतः ॥","tr":"ātmaupamyena sarvatra samaṃ paśyati yo'rjuna\nsukhaṃ vā yadi vā duḥkhaṃ saḥ yogī paramo mataḥ","gs":"આત્મૌપમ્યેન સર્વત્ર સમં પશ્યતિ યોઽર્જુન ।\nસુખં વા યદિ વા દુઃખં સઃ યોગી પરમો મતઃ ॥","en":"He who, through the likeness of the Self, O Arjuna, sees reality everywhere, be it pleasure or pain, is regarded as the highest Yogi.","hi":"हे अर्जुन ! जो (ध्यानयुक्त ज्ञानी महापुरुष) अपने शरीरकी उपमासे सब जगह अपनेको समान देखता है और सुख अथवा दुःखको भी समान देखता है, वह परम योगी माना गया है।"},{"c":6,"v":33,"sp":"arjuna","sa":"योऽयं योगस्त्वया प्रोक्तः साम्येन मधुसूदन ।\nएतस्याहं न पश्यामि चञ्चलत्वात् स्थितिं स्थिराम् ॥","tr":"yo'yaṃ yogastvayā proktaḥ sāmyena madhusūdana\netasyāhaṃ na paśyāmi cañcalatvāt sthitiṃ sthirām","gs":"યોઽયં યોગસ્ત્વયા પ્રોક્તઃ સામ્યેન મધુસૂદન ।\nએતસ્યાહં ન પશ્યામિ ચઞ્ચલત્વાત્ સ્થિતિં સ્થિરામ્ ॥","en":"Arjuna said, \"O Krishna, I do not see how this Yoga of equanimity, which you have taught me, can be maintained steadily, due to the restlessness of the mind.\"","hi":"अर्जुन बोले -- हे मधुसूदन ! आपने समतापूर्वक जो यह योग कहा है, मनकी चञ्चलताके कारण मैं इस योगकी स्थिर स्थिति नहीं देखता हूँ।"},{"c":6,"v":34,"sp":"arjuna","sa":"चञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम् ।\nतस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम् ॥","tr":"cañcalaṃ hi manaḥ kṛṣṇa pramāthi balavaddṛḍham\ntasyāhaṃ nigrahaṃ manye vāyoriva suduṣkaram","gs":"ચઞ્ચલં હિ મનઃ કૃષ્ણ પ્રમાથિ બલવદ્દૃઢમ્ ।\nતસ્યાહં નિગ્રહં મન્યે વાયોરિવ સુદુષ્કરમ્ ॥","en":"The mind is indeed restless, turbulent, strong, and unyielding, O Krishna; I consider it as difficult to control as controlling the wind.","hi":"क्योंकि हे कृष्ण ! मन बड़ा ही चञ्चल, प्रमथनशील, दृढ़ (जिद्दी) और बलवान् है। उसका निग्रह करना मैं वायुकी तरह अत्यन्त कठिन मानता हूँ।"},{"c":6,"v":35,"sp":"krishna","sa":"असंशयं महाबाहो मनो दुर्निग्रहं चलं ।\nअभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते ॥","tr":"asaṃśayaṃ mahābāho mano durnigrahaṃ calaṃ\nabhyāsena tu kaunteya vairāgyeṇa ca gṛhyate","gs":"અસંશયં મહાબાહો મનો દુર્નિગ્રહં ચલં ।\nઅભ્યાસેન તુ કૌન્તેય વૈરાગ્યેણ ચ ગૃહ્યતે ॥","en":"The Blessed Lord said, \"Undoubtedly, O mighty-armed Arjuna, the mind is difficult to control and restless; but with practice and dispassion, it can be restrained.\"","hi":"श्रीभगवान् बोले -- हे महाबाहो ! यह मन बड़ा चञ्चल है और इसका निग्रह करना भी बड़ा कठिन है -- यह तुम्हारा कहना बिलकुल ठीक है। परन्तु हे कुन्तीनन्दन ! अभ्यास और वैराग्यके द्वारा इसका निग्रह किया जाता है।"},{"c":6,"v":36,"sp":"krishna","sa":"असंयतात्मना योगो दुष्प्राप इति मे मतिः ।\nवश्यात्मना तु यतता शक्योऽवाप्तुमुपायतः ॥","tr":"asaṃyatātmanā yogo duṣprāpa iti me matiḥ\nvaśyātmanā tu yatatā śakyo'vāptumupāyataḥ","gs":"અસંયતાત્મના યોગો દુષ્પ્રાપ ઇતિ મે મતિઃ ।\nવશ્યાત્મના તુ યતતા શક્યોઽવાપ્તુમુપાયતઃ ॥","en":"I think Yoga is hard to be attained by one with an uncontrolled self, but the self-controlled and striving one can attain it by the appropriate means.","hi":"जिसका मन पूरा वशमें नहीं है, उसके द्वारा योग प्राप्त होना कठिन है। परन्तु उपायपूर्वक यत्न करनेवाले वश्यात्माको योग प्राप्त हो सकता है, ऐसा मेरा मत है।"},{"c":6,"v":37,"sp":"arjuna","sa":"अयतिः श्रद्धयोपेतो योगाच्चलितमानसः ।\nअप्राप्य योगसंसिद्धिं कां गतिं कृष्ण गच्छति ॥","tr":"ayatiḥ śraddhayopeto yogāccalitamānasaḥ\naprāpya yogasaṃsiddhiṃ kāṃ gatiṃ kṛṣṇa gacchati","gs":"અયતિઃ શ્રદ્ધયોપેતો યોગાચ્ચલિતમાનસઃ ।\nઅપ્રાપ્ય યોગસંસિદ્ધિં કાં ગતિં કૃષ્ણ ગચ્છતિ ॥","en":"Arjuna said, \"He who is unable to control himself, even though he has faith, and whose mind wanders away from Yoga, what end does he meet, having failed to attain perfection in Yoga, O Krishna?\"","hi":"अर्जुन बोले - हे कृष्ण ! जिसकी साधनमें श्रद्धा है, पर जिसका प्रयत्न शिथिल है, वह अन्तसमयमें अगर योगसे विचलितमना हो जाय, तो वह योगसिद्धिको प्राप्त न करके किस गतिको चला जाता है?"},{"c":6,"v":38,"sp":"arjuna","sa":"कच्चिन्नोभयविभ्रष्टश्छिन्नाभ्रमिव नश्यति ।\nअप्रतिष्ठो महाबाहो विमूढो ब्रह्मणः पथि ॥","tr":"kaccinnobhayavibhraṣṭaśchinnābhramiva naśyati\napratiṣṭho mahābāho vimūḍho brahmaṇaḥ pathi","gs":"કચ્ચિન્નોભયવિભ્રષ્ટશ્છિન્નાભ્રમિવ નશ્યતિ ।\nઅપ્રતિષ્ઠો મહાબાહો વિમૂઢો બ્રહ્મણઃ પથિ ॥","en":"Fallen from both, does he not perish like a rent cloud, supportless, O mighty-armed one, deluded on the path of Brahman?","hi":"हे महाबाहो ! संसारके आश्रयसे रहित और परमात्मप्राप्तिके मार्गमें मोहित अर्थात् विचलित -- इस तरह दोनों ओरसे भ्रष्ट हुआ साधक क्या छिन्न-भिन्न बादलकी तरह नष्ट तो नहीं हो जाता ?"},{"c":6,"v":39,"sp":"arjuna","sa":"एतन्मे संशयं कृष्ण छेत्तुमर्हस्यशेषतः ।\nत्वदन्यः संशयस्यास्य छेत्ता न ह्युपपद्यते ॥","tr":"etanme saṃśayaṃ kṛṣṇa chettumarhasyaśeṣataḥ\ntvadanyaḥ saṃśayasyāsya chettā na hyupapadyate","gs":"એતન્મે સંશયં કૃષ્ણ છેત્તુમર્હસ્યશેષતઃ ।\nત્વદન્યઃ સંશયસ્યાસ્ય છેત્તા ન હ્યુપપદ્યતે ॥","en":"O Krishna, please completely dispel this doubt of mine, for it is not possible for anyone but You to do so.","hi":"हे कृष्ण! मेरे इस सन्देहका सर्वथा छेदन करनेके लिये आप ही योग्य हैं; क्योंकि इस संशयका छेदन करनेवाला आपके सिवाय दूसरा कोई हो नहीं सकता।"},{"c":6,"v":40,"sp":"krishna","sa":"पार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते ।\nनहि कल्याणकृत्कश्िचद्दुर्गतिं तात गच्छति ॥","tr":"pārtha naiveha nāmutra vināśastasya vidyate\nnahi kalyāṇakṛtkaśicaddurgatiṃ tāta gacchati","gs":"પાર્થ નૈવેહ નામુત્ર વિનાશસ્તસ્ય વિદ્યતે ।\nનહિ કલ્યાણકૃત્કશ્િચદ્દુર્ગતિં તાત ગચ્છતિ ॥","en":"The Blessed Lord said, \"O Arjuna, neither in this world nor in the next will there be destruction for him; none, indeed, who does good, O my son, ever comes to grief.\"","hi":"श्रीभगवान् बोले -- हे पृथानन्दन ! उसका न तो इस लोकमें और न परलोकमें ही विनाश होता है; क्योंकि हे प्यारे ! कल्याणकारी काम करनेवाला कोई भी मनुष्य दुर्गतिको प्राप्त नहीं जाता।"},{"c":6,"v":41,"sp":"krishna","sa":"प्राप्य पुण्यकृतां लोकानुषित्वा शाश्वतीः समाः ।\nशुचीनां श्रीमतां गेहे योगभ्रष्टोऽभिजायते ॥","tr":"prāpya puṇyakṛtāṃ lokānuṣitvā śāśvatīḥ samāḥ\nśucīnāṃ śrīmatāṃ gehe yogabhraṣṭo'bhijāyate","gs":"પ્રાપ્ય પુણ્યકૃતાં લોકાનુષિત્વા શાશ્વતીઃ સમાઃ ।\nશુચીનાં શ્રીમતાં ગેહે યોગભ્રષ્ટોઽભિજાયતે ॥","en":"Having attained to the worlds of the righteous and having dwelt there for everlasting years, he who fell from Yoga is born in a house of the pure and wealthy.","hi":"वह योगभ्रष्ट पुण्यकर्म करनेवालोंके लोकोंको प्राप्त होकर और वहाँ बहुत वर्षोंतक रहकर फिर यहाँ शुद्ध श्रीमानोंके घरमें जन्म लेता है।"},{"c":6,"v":42,"sp":"krishna","sa":"अथवा योगिनामेव कुले भवति धीमताम् ।\nएतद्धि दुर्लभतरं लोके जन्म यदीदृशम् ॥","tr":"athavā yogināmeva kule bhavati dhīmatām\netaddhi durlabhataraṃ loke janma yadīdṛśam","gs":"અથવા યોગિનામેવ કુલે ભવતિ ધીમતામ્ ।\nએતદ્ધિ દુર્લભતરં લોકે જન્મ યદીદૃશમ્ ॥","en":"Or he is born in a family of even the wisest of yogis; verily, such a birth is very difficult to obtain in this world.","hi":"अथवा (वैराग्यवान्) योगभ्रष्ट ज्ञानवान् योगियोंके कुलमें ही जन्म लेता है। इस प्रकारका जो यह जन्म है, यह संसारमें बहुत ही दुर्लभ है।"},{"c":6,"v":43,"sp":"krishna","sa":"तत्र तं बुद्धिसंयोगं लभते पौर्वदेहिकम् ।\nयतते च ततो भूयः संसिद्धौ कुरुनन्दन ॥","tr":"tatra taṃ buddhisaṃyogaṃ labhate paurvadehikam\nyatate ca tato bhūyaḥ saṃsiddhau kurunandana","gs":"તત્ર તં બુદ્ધિસંયોગં લભતે પૌર્વદેહિકમ્ ।\nયતતે ચ તતો ભૂયઃ સંસિદ્ધૌ કુરુનન્દન ॥","en":"Then he comes into contact with the knowledge acquired in his former body and strives even more for perfection, O Arjuna.","hi":"हे कुरुनन्दन ! वहाँपर उसको पूर्वजन्मकृत साधन-सम्पत्ति अनायास ही प्राप्त हो जाती है। फिर उससे वह साधनकी सिद्धिके विषयमें पुनः विशेषतासे यत्न करता है।"},{"c":6,"v":44,"sp":"krishna","sa":"पूर्वाभ्यासेन तेनैव ह्रियते ह्यवशोऽपि सः ।\nजिज्ञासुरपि योगस्य शब्दब्रह्मातिवर्तते ॥","tr":"pūrvābhyāsena tenaiva hriyate hyavaśo'pi saḥ\njijñāsurapi yogasya śabdabrahmātivartate","gs":"પૂર્વાભ્યાસેન તેનૈવ હ્રિયતે હ્યવશોઽપિ સઃ ।\nજિજ્ઞાસુરપિ યોગસ્ય શબ્દબ્રહ્માતિવર્તતે ॥","en":"By that same former practice, he is borne on in spite of himself. Even he who merely wishes to know Yoga goes beyond the Brahmanic word.","hi":"वह (श्रीमानोंके घरमें जन्म लेनेवाला योगभ्रष्ट मनुष्य) भोगोंके परवश होता हुआ भी पूर्वजन्ममें किये हुए अभ्यास-(साधन-) के कारण ही परमात्माकी तरफ खिंच जाता है; क्योंकि योग-(समता-) का जिज्ञासु भी वेदोंमें कहे हुए सकाम कर्मोंका अतिक्रमण कर जाता है।"},{"c":6,"v":45,"sp":"krishna","sa":"प्रयत्नाद्यतमानस्तु योगी संशुद्धकिल्बिषः ।\nअनेकजन्मसंसिद्धस्ततो याति परां गतिम् ॥","tr":"prayatnādyatamānastu yogī saṃśuddhakilbiṣaḥ\nanekajanmasaṃsiddhastato yāti parāṃ gatim","gs":"પ્રયત્નાદ્યતમાનસ્તુ યોગી સંશુદ્ધકિલ્બિષઃ ।\nઅનેકજન્મસંસિદ્ધસ્તતો યાતિ પરાં ગતિમ્ ॥","en":"But the Yogi who strives assiduously, purified of sins and perfected gradually over many births, reaches the highest goal.","hi":"परन्तु जो योगी प्रयत्नपूर्वक यत्न करता है और जिसके पाप नष्ट हो गये हैं तथा जो अनेक जन्मोंसे सिद्ध हुआ है, वह योगी फिर परमगतिको प्राप्त हो जाता है।"},{"c":6,"v":46,"sp":"krishna","sa":"तपस्विभ्योऽधिको योगी ज्ञानिभ्योऽपि मतोऽधिकः ।\nकर्मिभ्यश्चाधिको योगी तस्माद्योगी भवार्जुन ॥","tr":"tapasvibhyo'dhiko yogī jñānibhyo'pi mato'dhikaḥ\nkarmibhyaścādhiko yogī tasmādyogī bhavārjuna","gs":"તપસ્વિભ્યોઽધિકો યોગી જ્ઞાનિભ્યોઽપિ મતોઽધિકઃ ।\nકર્મિભ્યશ્ચાધિકો યોગી તસ્માદ્યોગી ભવાર્જુન ॥","en":"The yogi is thought to be superior to the ascetics, even superior to those who have knowledge obtained through the study of scriptures; he is also superior to men of action; therefore, be thou a yogi, O Arjuna.","hi":"(सकामभाववाले) तपस्वियोंसे भी योगी श्रेष्ठ है, ज्ञानियोंसे भी योगी श्रेष्ठ है और कर्मियोंसे भी योगी श्रेष्ठ है -- ऐसा मेरा मत है। अतः हे अर्जुन ! तू योगी हो जा।"},{"c":6,"v":47,"sp":"krishna","sa":"योगिनामपि सर्वेषां मद्गतेनान्तरात्मना ।\nश्रद्धावान्भजते यो मां स मे युक्ततमो मतः ॥","tr":"yogināmapi sarveṣāṃ madgatenāntarātmanā\nśraddhāvānbhajate yo māṃ sa me yuktatamo mataḥ","gs":"યોગિનામપિ સર્વેષાં મદ્ગતેનાન્તરાત્મના ।\nશ્રદ્ધાવાન્ભજતે યો માં સ મે યુક્તતમો મતઃ ॥","en":"And among all the Yogis, he who, full of faith and with his inner self merged in Me, worships Me is deemed by Me to be the most devoted.","hi":"सम्पूर्ण योगियोंमें भी जो श्रद्धावान् भक्त मुझमें तल्लीन हुए मनसे मेरा भजन करता है, वह मेरे मतमें सर्वश्रेष्ठ योगी है।"},{"c":7,"v":1,"sp":"krishna","sa":"मय्यासक्तमनाः पार्थ योगं युञ्जन्मदाश्रयः ।\nअसंशयं समग्रं मां यथा ज्ञास्यसि तच्छृणु ॥","tr":"mayyāsaktamanāḥ pārtha yogaṃ yuñjanmadāśrayaḥ\nasaṃśayaṃ samagraṃ māṃ yathā jñāsyasi tacchṛṇu","gs":"મય્યાસક્તમનાઃ પાર્થ યોગં યુઞ્જન્મદાશ્રયઃ ।\nઅસંશયં સમગ્રં માં યથા જ્ઞાસ્યસિ તચ્છૃણુ ॥","en":"The Blessed Lord said, \"O Arjuna, hear how you shall, without doubt, know Me fully, with your mind intent on Me, practicing Yoga and taking refuge in Me.\"","hi":"श्रीभगवान् बोले -- हे पृथानन्दन ! मुझमें आसक्त मनवाला, मेरे आश्रित होकर योगका अभ्यास करता हुआ तू मेरे समग्ररूपको निःसन्देह जैसा जानेगा, उसको सुन।"},{"c":7,"v":2,"sp":"krishna","sa":"ज्ञानं तेऽहं सविज्ञानमिदं वक्ष्याम्यशेषतः ।\nयज्ज्ञात्वा नेह भूयोऽन्यज्ज्ञातव्यमवशिष्यते ॥","tr":"jñānaṃ te'haṃ savijñānamidaṃ vakṣyāmyaśeṣataḥ\nyajjñātvā neha bhūyo'nyajjñātavyamavaśiṣyate","gs":"જ્ઞાનં તેઽહં સવિજ્ઞાનમિદં વક્ષ્યામ્યશેષતઃ ।\nયજ્જ્ઞાત્વા નેહ ભૂયોઽન્યજ્જ્ઞાતવ્યમવશિષ્યતે ॥","en":"I will declare to you in full this knowledge combined with realization, after knowing which nothing else remains to be known here.","hi":"तेरे लिये मैं विज्ञानसहित ज्ञान सम्पूर्णतासे कहूँगा, जिसको जाननेके बाद फिर यहाँ कुछ भी जानना बाकी नहीं रहेगा।"},{"c":7,"v":3,"sp":"krishna","sa":"मनुष्याणां सहस्रेषु कश्िचद्यतति सिद्धये ।\nयततामपि सिद्धानां कश्िचन्मां वेत्ति तत्त्वतः ॥","tr":"manuṣyāṇāṃ sahasreṣu kaśicadyatati siddhaye\nyatatāmapi siddhānāṃ kaśicanmāṃ vetti tattvataḥ","gs":"મનુષ્યાણાં સહસ્રેષુ કશ્િચદ્યતતિ સિદ્ધયે ।\nયતતામપિ સિદ્ધાનાં કશ્િચન્માં વેત્તિ તત્ત્વતઃ ॥","en":"Among thousands of men, one may perchance strive for perfection; even among those successful strivers, only one may perchance know Me in essence.","hi":"हजारों मनुष्योंमें कोई एक वास्तविक सिद्धिके लिये यत्न करता है और उन यत्न करनेवाले सिद्धोंमें कोई एक ही मुझे तत्त्वसे जानता है।"},{"c":7,"v":4,"sp":"krishna","sa":"भूमिरापोऽनलो वायुः खं मनो बुद्धिरेव च ।\nअहङ्कार इतीयं मे भिन्ना प्रकृतिरष्टधा ॥","tr":"bhūmirāpo'nalo vāyuḥ khaṃ mano buddhireva ca\nahaṅkāra itīyaṃ me bhinnā prakṛtiraṣṭadhā","gs":"ભૂમિરાપોઽનલો વાયુઃ ખં મનો બુદ્ધિરેવ ચ ।\nઅહઙ્કાર ઇતીયં મે ભિન્ના પ્રકૃતિરષ્ટધા ॥","en":"Earth, water, fire, air, ether, mind, intellect, and egoism—thus is My Nature divided eightfold.","hi":"।।7.4 -- 7.5।। पृथ्वी, जल, तेज, वायु, आकाश -- ये पञ्चमहाभूत और मन, बुद्धि तथा अहंकार -- यह आठ प्रकारके भेदोंवाली मेरी 'अपरा' प्रकृति है। हे महाबाहो ! इस अपरा प्रकृतिसे भिन्न जीवरूप बनी हुई मेरी 'परा' प्रकृतिको जान, जिसके द्वारा यह जगत् धारण किया जाता है।"},{"c":7,"v":5,"sp":"krishna","sa":"अपरेयमितस्त्वन्यां प्रकृतिं विद्धि मे पराम् ।\nजीवभूतां महाबाहो ययेदं धार्यते जगत् ॥","tr":"apareyamitastvanyāṃ prakṛtiṃ viddhi me parām\njīvabhūtāṃ mahābāho yayedaṃ dhāryate jagat","gs":"અપરેયમિતસ્ત્વન્યાં પ્રકૃતિં વિદ્ધિ મે પરામ્ ।\nજીવભૂતાં મહાબાહો યયેદં ધાર્યતે જગત્ ॥","en":"O mighty-armed Arjuna, this is the inferior Prakriti; know it as distinct from My higher Prakriti, the very life-element, by which this world is upheld.","hi":"।।7.4 -- 7.5।। पृथ्वी, जल, तेज, वायु, आकाश -- ये पञ्चमहाभूत और मन, बुद्धि तथा अहंकार -- यह आठ प्रकारके भेदोंवाली मेरी अपरा प्रकृति है। हे महाबाहो ! इस 'अपरा' प्रकृतिसे भिन्न मेरी जीवरूपा बनी हुुई मेरी 'परा' प्रकृतिको जान, जिसके द्वारा यह जगत् धारण किया जाता है।"},{"c":7,"v":6,"sp":"krishna","sa":"एतद्योनीनि भूतानि सर्वाणीत्युपधारय ।\nअहं कृत्स्नस्य जगतः प्रभवः प्रलयस्तथा ॥","tr":"etadyonīni bhūtāni sarvāṇītyupadhāraya\nahaṃ kṛtsnasya jagataḥ prabhavaḥ pralayastathā","gs":"એતદ્યોનીનિ ભૂતાનિ સર્વાણીત્યુપધારય ।\nઅહં કૃત્સ્નસ્ય જગતઃ પ્રભવઃ પ્રલયસ્તથા ॥","en":"Know that these two are the womb of all beings; thus, I am the source and dissolution of the whole universe.","hi":"अपरा और परा -- इन दोनों प्रकृतियोंके संयोगसे ही सम्पूर्ण प्राणी उत्पन्न होते हैं, ऐसा तुम समझो। मैं सम्पूर्ण जगत् का प्रभव तथा प्रलय हूँ।"},{"c":7,"v":7,"sp":"krishna","sa":"मत्तः परतरं नान्यत्किञ्चिदस्ति धनञ्जय ।\nमयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव ॥","tr":"mattaḥ parataraṃ nānyatkiñcidasti dhanañjaya\nmayi sarvamidaṃ protaṃ sūtre maṇigaṇā iva","gs":"મત્તઃ પરતરં નાન્યત્કિઞ્ચિદસ્તિ ધનઞ્જય ।\nમયિ સર્વમિદં પ્રોતં સૂત્રે મણિગણા ઇવ ॥","en":"There is nothing higher than Me, O Arjuna. All this is strung on Me, like clusters of gems on a string.","hi":"हे धनञ्जय ! मेरे बढ़कर (इस जगत् का) दूसरा कोई किञ्चिन्मात्र भी कारण नहीं है। जैसे सूतकी मणियाँ सूतके धागेमें पिरोयी हुई होती हैं, ऐसे ही यह सम्पूर्ण जगत् मेरेमें ही ओत-प्रोत है।"},{"c":7,"v":8,"sp":"krishna","sa":"रसोऽहमप्सु कौन्तेय प्रभास्मि शशिसूर्ययोः ।\nप्रणवः सर्ववेदेषु शब्दः खे पौरुषं नृषु ॥","tr":"raso'hamapsu kaunteya prabhāsmi śaśisūryayoḥ\npraṇavaḥ sarvavedeṣu śabdaḥ khe pauruṣaṃ nṛṣu","gs":"રસોઽહમપ્સુ કૌન્તેય પ્રભાસ્મિ શશિસૂર્યયોઃ ।\nપ્રણવઃ સર્વવેદેષુ શબ્દઃ ખે પૌરુષં નૃષુ ॥","en":"I am the flavor in water, O Arjuna; I am the light in the moon and the sun; I am the syllable Om in all the Vedas, sound in the ether and virility in men.","hi":"हे कुन्तीनन्दन ! जलोंमें रस मैं हूँ, चन्द्रमा और सूर्यमें प्रभा (प्रकाश) मैं हूँ, सम्पूर्ण वेदोंमें प्रणव (ओंकार) मैं हूँ, आकाशमें शब्द और मनुष्योंमें पुरुषार्थ मैं हूँ।"},{"c":7,"v":9,"sp":"krishna","sa":"पुण्यो गन्धः पृथिव्यां च तेजश्चास्मि विभावसौ ।\nजीवनं सर्वभूतेषु तपश्चास्मि तपस्विषु ॥","tr":"puṇyo gandhaḥ pṛthivyāṃ ca tejaścāsmi vibhāvasau\njīvanaṃ sarvabhūteṣu tapaścāsmi tapasviṣu","gs":"પુણ્યો ગન્ધઃ પૃથિવ્યાં ચ તેજશ્ચાસ્મિ વિભાવસૌ ।\nજીવનં સર્વભૂતેષુ તપશ્ચાસ્મિ તપસ્વિષુ ॥","en":"I am the sweet fragrance in the earth and the brilliance in the fire, the life in all beings, and I am the austerity of ascetics.","hi":"पृथ्वीमें पवित्र गन्ध मैं हूँ, और अग्निमें तेज मैं हूँ, तथा सम्पूर्ण प्राणियोंमें जीवनीशक्ति मैं हूँ और तपस्वियोंमें तपस्या मैं हूँ।"},{"c":7,"v":10,"sp":"krishna","sa":"बीजं मां सर्वभूतानां विद्धि पार्थ सनातनम् ।\nबुद्धिर्बुद्धिमतामस्मि तेजस्तेजस्विनामहम् ॥","tr":"bījaṃ māṃ sarvabhūtānāṃ viddhi pārtha sanātanam\nbuddhirbuddhimatāmasmi tejastejasvināmaham","gs":"બીજં માં સર્વભૂતાનાં વિદ્ધિ પાર્થ સનાતનમ્ ।\nબુદ્ધિર્બુદ્ધિમતામસ્મિ તેજસ્તેજસ્વિનામહમ્ ॥","en":"Know Me, O Arjuna, as the eternal seed of all beings; I am the intelligence of the intelligent, and the splendour of the splendid objects.","hi":"हे पृथानन्दन ! सम्पूर्ण प्राणियोंका अनादि बीज मुझे जान। बुद्धिमानोंमें बुद्धि और तेजस्वियोंमें तेज मैं हूँ।"},{"c":7,"v":11,"sp":"krishna","sa":"बलं बलवतां चाहं कामरागविवर्जितम् ।\nधर्माविरुद्धो भूतेषु कामोऽस्मि भरतर्षभ ॥","tr":"balaṃ balavatāṃ cāhaṃ kāmarāgavivarjitam\ndharmāviruddho bhūteṣu kāmo'smi bharatarṣabha","gs":"બલં બલવતાં ચાહં કામરાગવિવર્જિતમ્ ।\nધર્માવિરુદ્ધો ભૂતેષુ કામોઽસ્મિ ભરતર્ષભ ॥","en":"Of the strong, I am the strength devoid of desire and attachment, and in all beings, I am the desire in accordance with Dharma, O Arjuna.","hi":"हे भरतवंशियोंमें श्रेष्ठ अर्जुन ! बलवालोंमें काम और रागसे रहित बल मैं हूँ। मनुषयोंमें धर्मसे अविरुद्ध (धर्मयुक्त) काम मैं हूँ।"},{"c":7,"v":12,"sp":"krishna","sa":"ये चैव सात्त्विका भावा राजसास्तामसाश्च ये ।\nमत्त एवेति तान्विद्धि नत्वहं तेषु ते मयि ॥","tr":"ye caiva sāttvikā bhāvā rājasāstāmasāśca ye\nmatta eveti tānviddhi natvahaṃ teṣu te mayi","gs":"યે ચૈવ સાત્ત્વિકા ભાવા રાજસાસ્તામસાશ્ચ યે ।\nમત્ત એવેતિ તાન્વિદ્ધિ નત્વહં તેષુ તે મયિ ॥","en":"Whatever beings (and objects) that are pure, active, and inert, know that they proceed from Me. They are in Me, yet I am not in them.","hi":"(और तो क्या कहूँ) जितने भी सात्त्विक, राजस और तामस भाव हैं, वे सब मुझ से ही होते हैं -- ऐसा समझो। पर मैं उनमें और वे मेरेमें नहीं हैं।"},{"c":7,"v":13,"sp":"krishna","sa":"त्रिभिर्गुणमयैर्भावैरेभिः सर्वमिदं जगत् ।\nमोहितं नाभिजानाति मामेभ्यः परमव्ययम् ॥","tr":"tribhirguṇamayairbhāvairebhiḥ sarvamidaṃ jagat\nmohitaṃ nābhijānāti māmebhyaḥ paramavyayam","gs":"ત્રિભિર્ગુણમયૈર્ભાવૈરેભિઃ સર્વમિદં જગત્ ।\nમોહિતં નાભિજાનાતિ મામેભ્યઃ પરમવ્યયમ્ ॥","en":"Deluded by these Natures, composed of the three qualities of Nature, all this world does not know Me as distinct from them and immutable.","hi":"किन्तु - इन तीनों गुणरूप भावोंसे मोहित यह सब जगत् इन गुणोंसे अतीत अविनाशी मुझे नहीं जानता।"},{"c":7,"v":14,"sp":"krishna","sa":"दैवी ह्येषा गुणमयी मम माया दुरत्यया ।\nमामेव ये प्रपद्यन्ते मायामेतां तरन्ति ते ॥","tr":"daivī hyeṣā guṇamayī mama māyā duratyayā\nmāmeva ye prapadyante māyāmetāṃ taranti te","gs":"દૈવી હ્યેષા ગુણમયી મમ માયા દુરત્યયા ।\nમામેવ યે પ્રપદ્યન્તે માયામેતાં તરન્તિ તે ॥","en":"Verily, this divine illusion of Mine, composed of the three qualities, is difficult to cross over; those who take refuge in Me alone, can cross over this illusion.","hi":"क्योंकि मेरी यह गुणमयी दैवी माया बड़ी दुरत्यय है अर्थात् इससे पार पाना बड़ा कठिन है। जो केवल मेरे ही शरण होते हैं, वे इस मायाको तर जाते हैं।"},{"c":7,"v":15,"sp":"krishna","sa":"न मां दुष्कृतिनो मूढाः प्रपद्यन्ते नराधमाः ।\nमाययापहृतज्ञाना आसुरं भावमाश्रिताः ॥","tr":"na māṃ duṣkṛtino mūḍhāḥ prapadyante narādhamāḥ\nmāyayāpahṛtajñānā āsuraṃ bhāvamāśritāḥ","gs":"ન માં દુષ્કૃતિનો મૂઢાઃ પ્રપદ્યન્તે નરાધમાઃ ।\nમાયયાપહૃતજ્ઞાના આસુરં ભાવમાશ્રિતાઃ ॥","en":"The evil-doers and the deluded, who are the lowest of men, do not seek Me; those whose knowledge is destroyed by illusion follow the ways of demons.","hi":"मायाके द्वारा अपहृत ज्ञानवाले, आसुर भावका आश्रय लेनेवाले और मनुष्योंमें महान् नीच तथा पाप-कर्म करनेवाले मूढ़ मनुष्य मेरे शरण नहीं होते।९"},{"c":7,"v":16,"sp":"krishna","sa":"चतुर्विधा भजन्ते मां जनाः सुकृतिनोऽर्जुन ।\nआर्तो जिज्ञासुरर्थार्थी ज्ञानी च भरतर्षभ ॥","tr":"caturvidhā bhajante māṃ janāḥ sukṛtino'rjuna\nārto jijñāsurarthārthī jñānī ca bharatarṣabha","gs":"ચતુર્વિધા ભજન્તે માં જનાઃ સુકૃતિનોઽર્જુન ।\nઆર્તો જિજ્ઞાસુરર્થાર્થી જ્ઞાની ચ ભરતર્ષભ ॥","en":"Four kinds of virtuous men worship Me, O Arjuna, and they are the distressed, the seekers of knowledge, the seekers of wealth, and the wise, O Lord of the Bharatas.","hi":"हे भरतवंशियोंमें श्रेष्ठ अर्जुनव ! पवित्र कर्म करनेवाले अर्थार्थी, आर्त, जिज्ञासु और ज्ञानी अर्थात् प्रेमी -- ये चार प्रकारके मनुष्य मेरा भजन करते हैं अर्थात् मेरे शरण होते हैं।"},{"c":7,"v":17,"sp":"krishna","sa":"तेषां ज्ञानी नित्ययुक्त एकभक्ितर्विशिष्यते ।\nप्रियो हि ज्ञानिनोऽत्यर्थमहं स च मम प्रियः ॥","tr":"teṣāṃ jñānī nityayukta ekabhakitarviśiṣyate\npriyo hi jñānino'tyarthamahaṃ sa ca mama priyaḥ","gs":"તેષાં જ્ઞાની નિત્યયુક્ત એકભક્િતર્વિશિષ્યતે ।\nપ્રિયો હિ જ્ઞાનિનોઽત્યર્થમહં સ ચ મમ પ્રિયઃ ॥","en":"Of them, the wise who are ever steadfast and devoted to the One, excel; for I am exceedingly dear to the wise, and they are dear to Me.","hi":"उन चार भक्तोंमें मेरेमें निरन्तर लगा हुआ, अनन्यभक्तिवाला ज्ञानी अर्थात् प्रेमी भक्त श्रेष्ठ है; क्योंकि ज्ञानी भक्तको मैं अत्यन्त प्रिय हूँ और वह भी मेरेको अत्यन्त प्रिय है।"},{"c":7,"v":18,"sp":"krishna","sa":"उदाराः सर्व एवैते ज्ञानी त्वात्मैव मे मतम् ।\nआस्थितः स हि युक्तात्मा मामेवानुत्तमां गतिम् ॥","tr":"udārāḥ sarva evaite jñānī tvātmaiva me matam\nāsthitaḥ sa hi yuktātmā māmevānuttamāṃ gatim","gs":"ઉદારાઃ સર્વ એવૈતે જ્ઞાની ત્વાત્મૈવ મે મતમ્ ।\nઆસ્થિતઃ સ હિ યુક્તાત્મા મામેવાનુત્તમાં ગતિમ્ ॥","en":"Indeed, all these are noble; however, I consider the wise man as My very Self; for, he is steadfast in mind and established in Me alone as the supreme goal.","hi":"पहले कहे हुए सब-के-सब भक्त बड़े उदार (श्रेष्ठ भाववाले) हैं। परन्तु ज्ञानी (प्रेमी) तो मेरा स्वरूप ही है -- ऐसा मेरा मत है। कारण कि वह युक्तात्मा है और जिससे श्रेष्ठ दूसरी कोई गति नहीं है, ऐसे मेरेमें ही दृढ़ आस्थावाला है।"},{"c":7,"v":19,"sp":"krishna","sa":"बहूनां जन्मनामन्ते ज्ञानवान्मां प्रपद्यते ।\nवासुदेवः सर्वमिति स महात्मा सुदुर्लभः ॥","tr":"bahūnāṃ janmanāmante jñānavānmāṃ prapadyate\nvāsudevaḥ sarvamiti sa mahātmā sudurlabhaḥ","gs":"બહૂનાં જન્મનામન્તે જ્ઞાનવાન્માં પ્રપદ્યતે ।\nવાસુદેવઃ સર્વમિતિ સ મહાત્મા સુદુર્લભઃ ॥","en":"At the end of many births, the wise man comes to Me, realizing that all this is Vaasudeva (the innermost Self); such a great soul (Mahatma) is very hard to find.","hi":"बहुत जन्मोंके अन्तमें अर्थात् मनुष्यजन्ममें 'सब कुछ परमात्मा ही है', ऐसा जो ज्ञानवान् मेरे शरण होता है, वह महात्मा अत्यन्त दुर्लभ है।"},{"c":7,"v":20,"sp":"krishna","sa":"कामैस्तैस्तैर्हृतज्ञानाः प्रपद्यन्तेऽन्यदेवताः ।\nतं तं नियममास्थाय प्रकृत्या नियताः स्वया ॥","tr":"kāmaistaistairhṛtajñānāḥ prapadyante'nyadevatāḥ\ntaṃ taṃ niyamamāsthāya prakṛtyā niyatāḥ svayā","gs":"કામૈસ્તૈસ્તૈર્હૃતજ્ઞાનાઃ પ્રપદ્યન્તેઽન્યદેવતાઃ ।\nતં તં નિયમમાસ્થાય પ્રકૃત્યા નિયતાઃ સ્વયા ॥","en":"Those whose wisdom has been taken away by this or that desire, go to other gods, following this or that rite, led by their own nature.","hi":"उन-उन कामनाओंसे जिनका ज्ञान अपहृत हो गया है, ऐसे वे मनुष्य अपनी-अपनी प्रकृतिसे नियन्त्रित होकर (देवताओंके) उन-उन नियमोंको धारण करते हुए उन-उन देवताओंके शरण हो जाते हैं।"},{"c":7,"v":21,"sp":"krishna","sa":"यो यो यां यां तनुं भक्तः श्रद्धयार्चितुमिच्छति ।\nतस्य तस्याचलां श्रद्धां तामेव विदधाम्यहम् ॥","tr":"yo yo yāṃ yāṃ tanuṃ bhaktaḥ śraddhayārcitumicchati\ntasya tasyācalāṃ śraddhāṃ tāmeva vidadhāmyaham","gs":"યો યો યાં યાં તનું ભક્તઃ શ્રદ્ધયાર્ચિતુમિચ્છતિ ।\nતસ્ય તસ્યાચલાં શ્રદ્ધાં તામેવ વિદધામ્યહમ્ ॥","en":"Whatever form any devotee desires to worship with faith, I make that same faith of his firm and unflinching.","hi":"जो-जो भक्त जिस-जिस देवताका श्रद्धापूर्वक पूजन करना चाहता है, उस-उस देवताके प्रति मैं उसकी श्रद्धाको दृढ़ कर देता हूँ।"},{"c":7,"v":22,"sp":"krishna","sa":"स तया श्रद्धया युक्तस्तस्याराधनमीहते ।\nलभते च ततः कामान्मयैव विहितान् हि तान् ॥","tr":"sa tayā śraddhayā yuktastasyārādhanamīhate\nlabhate ca tataḥ kāmānmayaiva vihitān hi tān","gs":"સ તયા શ્રદ્ધયા યુક્તસ્તસ્યારાધનમીહતે ।\nલભતે ચ તતઃ કામાન્મયૈવ વિહિતાન્ હિ તાન્ ॥","en":"Endowed with that faith, he engages in the worship of that form and obtains his desired outcome, which is ordained by Me alone.","hi":"उस (मेरे द्वारा दृढ़ की हुई) श्रद्धासे युक्त होकर वह मनुष्य (सकामभावपूर्वक) उस देवताकी उपासना करता है और उसकी वह कामना पूरी भी होती है; परन्तु वह कामना-पूर्ति मेरे द्वारा विहित की हुई होती है।"},{"c":7,"v":23,"sp":"krishna","sa":"अन्तवत्तु फलं तेषां तद्भवत्यल्पमेधसाम् ।\nदेवान्देवयजो यान्ति मद्भक्ता यान्ति मामपि ॥","tr":"antavattu phalaṃ teṣāṃ tadbhavatyalpamedhasām\ndevāndevayajo yānti madbhaktā yānti māmapi","gs":"અન્તવત્તુ ફલં તેષાં તદ્ભવત્યલ્પમેધસામ્ ।\nદેવાન્દેવયજો યાન્તિ મદ્ભક્તા યાન્તિ મામપિ ॥","en":"Verily, the reward (fruit) that accrues to those men of small intelligence is finite. The worshippers of the gods go to them, whereas My devotees come to Me.","hi":"परन्तु उन अल्पबुद्धिवाले मनुष्योंको उन देवताओंकी आराधनाका फल अन्तवाला (नाशवान्) ही मिलता है। देवताओंका पूजन करनेवाले देवताओंको प्राप्त होते हैं और मेरे भक्त मेरे ही प्राप्त होते हैं।"},{"c":7,"v":24,"sp":"krishna","sa":"अव्यक्तं व्यक्ितमापन्नं मन्यन्ते मामबुद्धयः ।\nपरं भावमजानन्तो ममाव्ययमनुत्तमम् ॥","tr":"avyaktaṃ vyakitamāpannaṃ manyante māmabuddhayaḥ\nparaṃ bhāvamajānanto mamāvyayamanuttamam","gs":"અવ્યક્તં વ્યક્િતમાપન્નં મન્યન્તે મામબુદ્ધયઃ ।\nપરં ભાવમજાનન્તો મમાવ્યયમનુત્તમમ્ ॥","en":"The foolish think of Me, the Unmanifest, as having manifestation, not knowing My higher, immutable, and most excellent nature.","hi":"बुद्धिहीन मनुष्य मेरे सर्वश्रेष्ठ अविनाशी परमभावको न जानते हुए अव्यक्त (मन-इन्द्रियोंसे पर) मुझ सच्चिदानन्दघन परमात्माको मनुष्यकी तरह ही शरीर धारण करनेवाला मानते हैं।"},{"c":7,"v":25,"sp":"krishna","sa":"नाहं प्रकाशः सर्वस्य योगमायासमावृतः ।\nमूढोऽयं नाभिजानाति लोको मामजमव्ययम् ॥","tr":"nāhaṃ prakāśaḥ sarvasya yogamāyāsamāvṛtaḥ\nmūḍho'yaṃ nābhijānāti loko māmajamavyayam","gs":"નાહં પ્રકાશઃ સર્વસ્ય યોગમાયાસમાવૃતઃ ।\nમૂઢોઽયં નાભિજાનાતિ લોકો મામજમવ્યયમ્ ॥","en":"I am not manifest to all, veiled as I am by the Yoga-Maya. This deluded world does not know Me, who am unborn and imperishable.","hi":"जो मूढ़ मनुष्य मेरेको अज और अविनाशी ठीक तरहसे नहीं जानते (मानते), उन सबके सामने योगमायासे अच्छी तरहसे आवृत हुआ मैं प्रकट नहीं होता।"},{"c":7,"v":26,"sp":"krishna","sa":"वेदाहं समतीतानि वर्तमानानि चार्जुन ।\nभविष्याणि च भूतानि मां तु वेद न कश्चन ॥","tr":"vedāhaṃ samatītāni vartamānāni cārjuna\nbhaviṣyāṇi ca bhūtāni māṃ tu veda na kaścana","gs":"વેદાહં સમતીતાનિ વર્તમાનાનિ ચાર્જુન ।\nભવિષ્યાણિ ચ ભૂતાનિ માં તુ વેદ ન કશ્ચન ॥","en":"I know, O Arjuna, the beings of the past, the present, and the future; however, no one knows Me.","hi":"हे अर्जुन ! जो प्राणी भूतकालमें हो चुके हैं, तथा जो वर्तमानमें हैं और जो भविष्यमें होंगे, उन सब प्राणियोंको तो मैं जानता हूँ; परन्तु मेरेको कोई (मूढ़ मनुष्य) नहीं जानता।"},{"c":7,"v":27,"sp":"krishna","sa":"इच्छाद्वेषसमुत्थेन द्वन्द्वमोहेन भारत ।\nसर्वभूतानि संमोहं सर्गे यान्ति परन्तप ॥","tr":"icchādveṣasamutthena dvandvamohena bhārata\nsarvabhūtāni saṃmohaṃ sarge yānti parantapa","gs":"ઇચ્છાદ્વેષસમુત્થેન દ્વન્દ્વમોહેન ભારત ।\nસર્વભૂતાનિ સંમોહં સર્ગે યાન્તિ પરન્તપ ॥","en":"O Bharata, all beings are subject to delusion at birth due to the delusion of the pairs of opposites arising from desire and aversion, O Parantapa.","hi":"हे भरतवंशमें उत्पन्न परंतप ! इच्छा (राग) और द्वेषसे उत्पन्न होनेवाले द्वन्द्व-मोहसे मोहित सम्पूर्ण प्राणी संसारमें मूढ़ताको अर्थात् जन्म-मरणको प्राप्त हो रहे हैं।"},{"c":7,"v":28,"sp":"krishna","sa":"येषां त्वन्तगतं पापं जनानां पुण्यकर्मणाम् ।\nते द्वन्द्वमोहनिर्मुक्ता भजन्ते मां दृढव्रताः ॥","tr":"yeṣāṃ tvantagataṃ pāpaṃ janānāṃ puṇyakarmaṇām\nte dvandvamohanirmuktā bhajante māṃ dṛḍhavratāḥ","gs":"યેષાં ત્વન્તગતં પાપં જનાનાં પુણ્યકર્મણામ્ ।\nતે દ્વન્દ્વમોહનિર્મુક્તા ભજન્તે માં દૃઢવ્રતાઃ ॥","en":"But those men of virtuous deeds, whose sins have come to an end and who are freed from the delusion of the pairs of opposites, worship Me steadfastly, with their vows.","hi":"परन्तु जिन पुण्यकर्मा मनुष्योंके पाप नष्ट गये हैं, वे द्वन्द्वमोहसे रहित हुए मनुष्य दृढ़व्रती होकर मेरा भजन करते हैं।"},{"c":7,"v":29,"sp":"krishna","sa":"जरामरणमोक्षाय मामाश्रित्य यतन्ति ये ।\nते ब्रह्म तद्विदुः कृत्स्नमध्यात्मं कर्म चाखिलम् ॥","tr":"jarāmaraṇamokṣāya māmāśritya yatanti ye\nte brahma tadviduḥ kṛtsnamadhyātmaṃ karma cākhilam","gs":"જરામરણમોક્ષાય મામાશ્રિત્ય યતન્તિ યે ।\nતે બ્રહ્મ તદ્વિદુઃ કૃત્સ્નમધ્યાત્મં કર્મ ચાખિલમ્ ॥","en":"Those who strive for liberation from old age and death, taking refuge in Me, realize in full that Brahman, the whole knowledge of the Self, and all action.","hi":"जरा (वृद्धावस्था) और मरण (मृत्यु) से मोक्ष पानेके लिये जो मेरा आश्रय लेकर प्रयत्न करते हैं, वे उस ब्रह्मको, सम्पूर्ण अध्यात्मको और सम्पूर्ण कर्मको भी जान जाते हैं।"},{"c":7,"v":30,"sp":"krishna","sa":"साधिभूताधिदैवं मां साधियज्ञं च ये विदुः ।\nप्रयाणकालेऽपि च मां ते विदुर्युक्तचेतसः ॥","tr":"sādhibhūtādhidaivaṃ māṃ sādhiyajñaṃ ca ye viduḥ\nprayāṇakāle'pi ca māṃ te viduryuktacetasaḥ","gs":"સાધિભૂતાધિદૈવં માં સાધિયજ્ઞં ચ યે વિદુઃ ।\nપ્રયાણકાલેઽપિ ચ માં તે વિદુર્યુક્તચેતસઃ ॥","en":"Those who know Me with the Adhibhuta (pertaining to the elements), Adhidaiva (pertaining to the gods), and the Adhiyajna (pertaining to the sacrifice) know Me even at the time of death, remaining steadfast in mind.","hi":"जो मनुष्य अधिभूत, अधिदैव और अधियज्ञके सहित मुझे जानते हैं, वे युक्तचेता मनुष्य अन्तकालमें भी मुझे ही जानते हैं अर्थात् प्राप्त होते हैं।"},{"c":8,"v":1,"sp":"arjuna","sa":"किं तद्ब्रह्म किमध्यात्मं किं कर्म पुरुषोत्तम ।\nअधिभूतं च किं प्रोक्तमधिदैवं किमुच्यते ॥","tr":"kiṃ tadbrahma kimadhyātmaṃ kiṃ karma puruṣottama\nadhibhūtaṃ ca kiṃ proktamadhidaivaṃ kimucyate","gs":"કિં તદ્બ્રહ્મ કિમધ્યાત્મં કિં કર્મ પુરુષોત્તમ ।\nઅધિભૂતં ચ કિં પ્રોક્તમધિદૈવં કિમુચ્યતે ॥","en":"Arjuna said, \"What is Brahman? What is Adhyatma? What is action, O best among men? What is Adhibhuta declared to be? And, what is Adhidaiva said to be?\"","hi":"।।8.1 -- 8.2।। अर्जुन बोले -- हे पुरुषोत्तम ! वह ब्रह्म क्या है? अध्यात्म क्या है? कर्म क्या है? अधिभूत किसको कहा गया है? और अधिदैव किसको कहा जाता है? यहाँ अधियज्ञ कौन है और वह इस देहमें कैसे है? हे मधूसूदन ! नियतात्मा (वशीभूत अंतःकरण वाले) मनुष्यके द्वारा अन्तकालमें आप कैसे जाननेमें आते हैं?"},{"c":8,"v":2,"sp":"arjuna","sa":"अधियज्ञः कथं कोऽत्र देहेऽस्मिन्मधुसूदन ।\nप्रयाणकाले च कथं ज्ञेयोऽसि नियतात्मभिः ॥","tr":"adhiyajñaḥ kathaṃ ko'tra dehe'sminmadhusūdana\nprayāṇakāle ca kathaṃ jñeyo'si niyatātmabhiḥ","gs":"અધિયજ્ઞઃ કથં કોઽત્ર દેહેઽસ્મિન્મધુસૂદન ।\nપ્રયાણકાલે ચ કથં જ્ઞેયોઽસિ નિયતાત્મભિઃ ॥","en":"Who and how is Adhiyajna here in this body, O destroyer of Madhu? And how, at the time of death, are You to be known by the self-controlled?","hi":"।।8.1 -- 8.2।। अर्जुन बोले -- हे पुरुषोत्तम ! वह ब्रह्म क्या है? अध्यात्म क्या है? कर्म क्या है? अधिभूत किसको कहा गया है? और अधिदैव किसको कहा जाता है? यहाँ अधियज्ञ कौन है और वह इस देहमें कैसे है? हे मधूसूदन ! नियतात्मा (वशीभूत अन्तःकरणवाले) मनुष्यके द्वारा अन्तकालमें आप कैसे जाननेमें आते हैं?"},{"c":8,"v":3,"sp":"krishna","sa":"अक्षरं ब्रह्म परमं स्वभावोऽध्यात्ममुच्यते ।\nभूतभावोद्भवकरो विसर्गः कर्मसंज्ञितः ॥","tr":"akṣaraṃ brahma paramaṃ svabhāvo'dhyātmamucyate\nbhūtabhāvodbhavakaro visargaḥ karmasaṃjñitaḥ","gs":"અક્ષરં બ્રહ્મ પરમં સ્વભાવોઽધ્યાત્મમુચ્યતે ।\nભૂતભાવોદ્ભવકરો વિસર્ગઃ કર્મસંજ્ઞિતઃ ॥","en":"The Blessed Lord said, \"Brahman is the Imperishable, the Supreme; its essential nature is called Self-knowledge; the offering (to the gods) that causes the existence and manifestation of beings and sustains them is called action.\"","hi":"श्रीभगवान् बोले -- परम अक्षर ब्रह्म है और जीवका अपना जो होनापन है, उसको अध्यात्म कहते हैं। प्राणियों का उद्भव (सत्ता को प्रकट) करनेवाला जो त्याग है उसको कर्म कहा जाता है।"},{"c":8,"v":4,"sp":"krishna","sa":"अधिभूतं क्षरो भावः पुरुषश्चाधिदैवतम् ।\nअधियज्ञोऽहमेवात्र देहे देहभृतां वर ॥","tr":"adhibhūtaṃ kṣaro bhāvaḥ puruṣaścādhidaivatam\nadhiyajño'hamevātra dehe dehabhṛtāṃ vara","gs":"અધિભૂતં ક્ષરો ભાવઃ પુરુષશ્ચાધિદૈવતમ્ ।\nઅધિયજ્ઞોઽહમેવાત્ર દેહે દેહભૃતાં વર ॥","en":"Adhibhuta—knowledge of the elements—pertains to My perishable nature, and the Purusha, or the Soul, is the Adhidaiva; I alone am the Adhiyajna here in this body, O best among the embodied.","hi":"हे देहधारियोंमें श्रेष्ठ अर्जुन ! क्षरभाव अर्थात् नाशवान् पदार्थको अधिभूत कहते हैं, पुरुष अर्थात् हिरण्यगर्भ ब्रह्माजी अधिदैव हैं और इस देहमें अन्तर्यामीरूपसे मैं ही अधियज्ञ हूँ।"},{"c":8,"v":5,"sp":"krishna","sa":"अन्तकाले च मामेव स्मरन्मुक्त्वा कलेवरम् ।\nयः प्रयाति स मद्भावं याति नास्त्यत्र संशयः ॥","tr":"antakāle ca māmeva smaranmuktvā kalevaram\nyaḥ prayāti sa madbhāvaṃ yāti nāstyatra saṃśayaḥ","gs":"અન્તકાલે ચ મામેવ સ્મરન્મુક્ત્વા કલેવરમ્ ।\nયઃ પ્રયાતિ સ મદ્ભાવં યાતિ નાસ્ત્યત્ર સંશયઃ ॥","en":"And whoever, leaving their body, goes forth remembering Me alone at the time of death, they will attain My Being; there is no doubt about this.","hi":"जो मनुष्य अन्तकालमें भी मेरा स्मरण करते हुए शरीर छोड़कर जाता है, वह मेरे स्वरुप को ही प्राप्त होता है, इसमें सन्देह नहीं है।"},{"c":8,"v":6,"sp":"krishna","sa":"यं यं वापि स्मरन्भावं त्यजत्यन्ते कलेवरम् ।\nतं तमेवैति कौन्तेय सदा तद्भावभावितः ॥","tr":"yaṃ yaṃ vāpi smaranbhāvaṃ tyajatyante kalevaram\ntaṃ tamevaiti kaunteya sadā tadbhāvabhāvitaḥ","gs":"યં યં વાપિ સ્મરન્ભાવં ત્યજત્યન્તે કલેવરમ્ ।\nતં તમેવૈતિ કૌન્તેય સદા તદ્ભાવભાવિતઃ ॥","en":"Whoever at the end leaves the body, thinking of any being, to that being only does he go, O son of Kunti (Arjuna), due to his constant thought of that being.","hi":"हे कुन्तीपुत्र अर्जुन ! मनुष्य अन्तकाल में जिस-जिस भी भावका स्मरण करते हुए शरीर छोड़ता है वह उस (अन्तकालके) भावसे सदा भावित होता हुआ उस-उसको ही प्राप्त होता है अर्थात् उस-उस योनिमें ही चला जाता है।"},{"c":8,"v":7,"sp":"krishna","sa":"तस्मात्सर्वेषु कालेषु मामनुस्मर युध्य च ।\nमय्यर्पितमनोबुद्धिर्मामेवैष्यस्यसंशयम् ॥","tr":"tasmātsarveṣu kāleṣu māmanusmara yudhya ca\nmayyarpitamanobuddhirmāmevaiṣyasyasaṃśayam","gs":"તસ્માત્સર્વેષુ કાલેષુ મામનુસ્મર યુધ્ય ચ ।\nમય્યર્પિતમનોબુદ્ધિર્મામેવૈષ્યસ્યસંશયમ્ ॥","en":"Therefore, at all times, remember Me only and fight. With your mind and intellect fixed on Me, you will undoubtedly come to Me alone.","hi":"इसलिये तू सब समयमें मेरा स्मरण कर और युद्ध भी कर। मेरेमें मन और बुद्धि अर्पित करनेवाला तू निःसन्देह मेरेको ही प्राप्त होगा।"},{"c":8,"v":8,"sp":"krishna","sa":"अभ्यासयोगयुक्तेन चेतसा नान्यगामिना ।\nपरमं पुरुषं दिव्यं याति पार्थानुचिन्तयन् ॥","tr":"abhyāsayogayuktena cetasā nānyagāminā\nparamaṃ puruṣaṃ divyaṃ yāti pārthānucintayan","gs":"અભ્યાસયોગયુક્તેન ચેતસા નાન્યગામિના ।\nપરમં પુરુષં દિવ્યં યાતિ પાર્થાનુચિન્તયન્ ॥","en":"With the mind not moving towards any other thing, made steadfast through the practice of habitual meditation, and constantly meditating, one goes to the Supreme Person, the Resplendent, O Arjuna.","hi":"हे पृथानन्दन ! अभ्यासयोगसे युक्त और अन्यका चिन्तन न करनेवाले चित्तसे परम दिव्य पुरुषका चिन्तन करता हुआ (शरीर छोड़नेवाला मनुष्य) उसीको प्राप्त हो जाता है।"},{"c":8,"v":9,"sp":"krishna","sa":"कविं पुराणमनुशासितार  मणोरणीयांसमनुस्मरेद्यः ।\nसर्वस्य धातारमचिन्त्यरूप  मादित्यवर्णं तमसः परस्तात् ॥","tr":"kaviṃ purāṇamanuśāsitāra  maṇoraṇīyāṃsamanusmaredyaḥ\nsarvasya dhātāramacintyarūpa  mādityavarṇaṃ tamasaḥ parastāt","gs":"કવિં પુરાણમનુશાસિતાર  મણોરણીયાંસમનુસ્મરેદ્યઃ ।\nસર્વસ્ય ધાતારમચિન્ત્યરૂપ  માદિત્યવર્ણં તમસઃ પરસ્તાત્ ॥","en":"Whosoever meditates on the Omniscient, the Ancient, the Ruler of the whole world, minuter than an atom, the supporter of all, of inconceivable form, effulgent like the sun and beyond the darkness of ignorance.","hi":"जो सर्वज्ञ, पुराण, शासन करनेवाला, सूक्ष्म-से-सूक्ष्म, सबका धारण-पोषण करनेवाला, अज्ञानसे अत्यन्त परे, सूर्यकी तरह प्रकाशस्वरूप -- ऐसे अचिन्त्य स्वरूपका चिन्तन करता है।"},{"c":8,"v":10,"sp":"krishna","sa":"प्रयाणकाले मनसाऽचलेन  भक्त्या युक्तो योगबलेन चैव ।\nभ्रुवोर्मध्ये प्राणमावेश्य सम्यक्  स तं परं पुरुषमुपैति दिव्यम् ॥","tr":"prayāṇakāle manasā'calena  bhaktyā yukto yogabalena caiva\nbhruvormadhye prāṇamāveśya samyak  sa taṃ paraṃ puruṣamupaiti divyam","gs":"પ્રયાણકાલે મનસાઽચલેન  ભક્ત્યા યુક્તો યોગબલેન ચૈવ ।\nભ્રુવોર્મધ્યે પ્રાણમાવેશ્ય સમ્યક્  સ તં પરં પુરુષમુપૈતિ દિવ્યમ્ ॥","en":"At the time of death, with an unwavering mind, endowed with devotion, by the power of Yoga, fixing the whole life-breath in the middle of the two eyebrows, he reaches that resplendent Supreme Person.","hi":"वह भक्तियुक्त मनुष्य अन्तसमयमें अचल मनसे और योगबलके द्वारा भृकुटीके मध्यमें प्राणोंको अच्छी तरहसे प्रविष्ट करके (शरीर छोड़नेपर) उस परम दिव्य पुरुषको ही प्राप्त होता है।"},{"c":8,"v":11,"sp":"krishna","sa":"यदक्षरं वेदविदो वदन्ति  विशन्ति यद्यतयो वीतरागाः ।\nयदिच्छन्तो ब्रह्मचर्यं चरन्ति  तत्ते पदं संग्रहेण प्रवक्ष्ये ॥","tr":"yadakṣaraṃ vedavido vadanti  viśanti yadyatayo vītarāgāḥ\nyadicchanto brahmacaryaṃ caranti  tatte padaṃ saṃgraheṇa pravakṣye","gs":"યદક્ષરં વેદવિદો વદન્તિ  વિશન્તિ યદ્યતયો વીતરાગાઃ ।\nયદિચ્છન્તો બ્રહ્મચર્યં ચરન્તિ  તત્તે પદં સંગ્રહેણ પ્રવક્ષ્યે ॥","en":"That which is declared to be Imperishable by those who know the Vedas, that which the self-controlled (ascetics or Sannyasins) and passion-free enter, that goal, desiring which celibacy is practised, I will declare to thee in brief.","hi":"वेदवेत्ता लोग जिसको अक्षर कहते हैं, वीतराग यति जिसको प्राप्त करते हैं और साधक जिसकी प्राप्तिकी इच्छा करते हुए ब्रह्मचर्यका पालन करते हैं, वह पद मैं तेरे लिये संक्षेपसे कहूँगा।"},{"c":8,"v":12,"sp":"krishna","sa":"सर्वद्वाराणि संयम्य मनो हृदि निरुध्य च ।\nमूर्ध्न्याधायात्मनः प्राणमास्थितो योगधारणाम् ॥","tr":"sarvadvārāṇi saṃyamya mano hṛdi nirudhya ca\nmūrdhnyādhāyātmanaḥ prāṇamāsthito yogadhāraṇām","gs":"સર્વદ્વારાણિ સંયમ્ય મનો હૃદિ નિરુધ્ય ચ ।\nમૂર્ધ્ન્યાધાયાત્મનઃ પ્રાણમાસ્થિતો યોગધારણામ્ ॥","en":"Having closed all the gates, confined the mind in the heart, and fixed the life-breath in the head, engage in the practice of concentration.","hi":"।।8.12 -- 8.13।। (इन्द्रियोंके) सम्पूर्ण द्वारोंको रोककर मनका हृदयमें निरोध करके और अपने प्राणोंको मस्तकमें स्थापित करके योगधारणामें सम्यक् प्रकारसे स्थित हुआ जो 'ऊँ' इस एक अक्षर ब्रह्मका उच्चारण और मेरा स्मरण करता हुआ शरीरको छोड़कर जाता है, वह परमगतिको प्राप्त होता है।"},{"c":8,"v":13,"sp":"krishna","sa":"ओमित्येकाक्षरं ब्रह्म व्याहरन्मामनुस्मरन् ।\nयः प्रयाति त्यजन्देहं स याति परमां गतिम् ॥","tr":"omityekākṣaraṃ brahma vyāharanmāmanusmaran\nyaḥ prayāti tyajandehaṃ sa yāti paramāṃ gatim","gs":"ઓમિત્યેકાક્ષરં બ્રહ્મ વ્યાહરન્મામનુસ્મરન્ ।\nયઃ પ્રયાતિ ત્યજન્દેહં સ યાતિ પરમાં ગતિમ્ ॥","en":"Uttering the one-syllabled Om, the Brahman, and remembering Me, he who departs, leaving the body, attains the Supreme Goal.","hi":"।।8.12 -- 8.13।। (इन्द्रियोंके) सम्पूर्ण द्वारोंको रोककर मनका हृदयमें निरोध करके और अपने प्राणोंको मस्तकमें स्थापित करके योगधारणामें सम्यक् प्रकारसे स्थित हुआ जो साधक 'ऊँ' इस एक अक्षर ब्रह्मका उच्चारण और मेरा स्मरण करता हुआ शरीरको छोड़कर जाता है, वह परमगतिको प्राप्त होता है।"},{"c":8,"v":14,"sp":"krishna","sa":"अनन्यचेताः सततं यो मां स्मरति नित्यशः ।\nतस्याहं सुलभः पार्थ नित्ययुक्तस्य योगिनः ॥","tr":"ananyacetāḥ satataṃ yo māṃ smarati nityaśaḥ\ntasyāhaṃ sulabhaḥ pārtha nityayuktasya yoginaḥ","gs":"અનન્યચેતાઃ સતતં યો માં સ્મરતિ નિત્યશઃ ।\nતસ્યાહં સુલભઃ પાર્થ નિત્યયુક્તસ્ય યોગિનઃ ॥","en":"I am easily attainable by that ever-steadfast yogi who constantly and daily remembers me for a long time, not thinking of anything else with a single-minded or one-pointed focus, O Partha.","hi":"हे पृथानन्दन ! अनन्यचित्तवाला जो मनुष्य मेरा नित्य-निरन्तर स्मरण करता है, उस नित्ययुक्त योगीके लिये मैं सुलभ हूँ अर्थात् उसको सुलभतासे प्राप्त हो जाता हूँ।"},{"c":8,"v":15,"sp":"krishna","sa":"मामुपेत्य पुनर्जन्म दुःखालयमशाश्वतम् ।\nनाप्नुवन्ति महात्मानः संसिद्धिं परमां गताः ॥","tr":"māmupetya punarjanma duḥkhālayamaśāśvatam\nnāpnuvanti mahātmānaḥ saṃsiddhiṃ paramāṃ gatāḥ","gs":"મામુપેત્ય પુનર્જન્મ દુઃખાલયમશાશ્વતમ્ ।\nનાપ્નુવન્તિ મહાત્માનઃ સંસિદ્ધિં પરમાં ગતાઃ ॥","en":"Having attained Me, these great souls do not take birth again here—a place of pain and impermanence—but have reached the highest perfection of liberation.","hi":"महात्मालोग मुझे प्राप्त करके दुःखालय और अशाश्वत पुनर्जन्मको प्राप्त नहीं होते; क्योंकि वे परमसिद्धिको प्राप्त हो गये हैं अर्थात् उनको परम प्रेमकी प्राप्ति हो गयी है।"},{"c":8,"v":16,"sp":"krishna","sa":"आब्रह्मभुवनाल्लोकाः पुनरावर्तिनोऽर्जुन ।\nमामुपेत्य तु कौन्तेय पुनर्जन्म न विद्यते ॥","tr":"ābrahmabhuvanāllokāḥ punarāvartino'rjuna\nmāmupetya tu kaunteya punarjanma na vidyate","gs":"આબ્રહ્મભુવનાલ્લોકાઃ પુનરાવર્તિનોઽર્જુન ।\nમામુપેત્ય તુ કૌન્તેય પુનર્જન્મ ન વિદ્યતે ॥","en":"All the worlds, including the world of Brahma, are subject to return again, O Arjuna; but he who reaches Me, O son of Kunti, has no rebirth.","hi":"हे अर्जुन ! ब्रह्मलोकतक सभी लोक पुनरावर्ती है; परन्तु हे कौन्तेय ! मुझे प्राप्त होनेपर पुनर्जन्म नहीं होता।"},{"c":8,"v":17,"sp":"krishna","sa":"सहस्रयुगपर्यन्तमहर्यद्ब्रह्मणो विदुः ।\nरात्रिं युगसहस्रान्तां तेऽहोरात्रविदो जनाः ॥","tr":"sahasrayugaparyantamaharyadbrahmaṇo viduḥ\nrātriṃ yugasahasrāntāṃ te'horātravido janāḥ","gs":"સહસ્રયુગપર્યન્તમહર્યદ્બ્રહ્મણો વિદુઃ ।\nરાત્રિં યુગસહસ્રાન્તાં તેઽહોરાત્રવિદો જનાઃ ॥","en":"Those who know the day of Brahma, which lasts a thousand Yugas, and the night, which also lasts a thousand Yugas, know day and night.","hi":"जो मनुष्य ब्रह्माके एक हज़ार चतुर्युगीवाले एक दिनको और सहस्त्र चतुर्युगीपर्यन्त एक रातको जानते हैं, वे मनुष्य ब्रह्माके दिन और रातको जाननेवाले हैं।"},{"c":8,"v":18,"sp":"krishna","sa":"अव्यक्ताद्व्यक्तयः सर्वाः प्रभवन्त्यहरागमे ।\nरात्र्यागमे प्रलीयन्ते तत्रैवाव्यक्तसंज्ञके ॥","tr":"avyaktādvyaktayaḥ sarvāḥ prabhavantyaharāgame\nrātryāgame pralīyante tatraivāvyaktasaṃjñake","gs":"અવ્યક્તાદ્વ્યક્તયઃ સર્વાઃ પ્રભવન્ત્યહરાગમે ।\nરાત્ર્યાગમે પ્રલીયન્તે તત્રૈવાવ્યક્તસંજ્ઞકે ॥","en":"From the Unmanifested, all the manifested worlds proceed upon the arrival of the 'day'; upon the arrival of the 'night', they dissolve indeed into that which is known as the Unmanifested.","hi":"ब्रह्माजीके दिनके आरम्भकालमें अव्यक्त- (ब्रह्माजीके सूक्ष्म-शरीर-) से सम्पूर्ण प्राणी पैदा होते हैं और ब्रह्माजीकी रातके आरम्भकालमें उसी अव्यक्तमें सम्पूर्ण प्राणी लीन हो जाते हैं।"},{"c":8,"v":19,"sp":"krishna","sa":"भूतग्रामः स एवायं भूत्वा भूत्वा प्रलीयते ।\nरात्र्यागमेऽवशः पार्थ प्रभवत्यहरागमे ॥","tr":"bhūtagrāmaḥ sa evāyaṃ bhūtvā bhūtvā pralīyate\nrātryāgame'vaśaḥ pārtha prabhavatyaharāgame","gs":"ભૂતગ્રામઃ સ એવાયં ભૂત્વા ભૂત્વા પ્રલીયતે ।\nરાત્ર્યાગમેઽવશઃ પાર્થ પ્રભવત્યહરાગમે ॥","en":"This same multitude of beings, being born again and again, helplessly dissolves, O Arjuna, into the Unmanifested at the coming of the night and comes forth at the coming of the day.","hi":"हे पार्थ ! वही यह प्राणिसमुदाय उत्पन्न हो-होकर प्रकृतिके परवश हुआ ब्रह्माके दिनके समय उत्पन्न होता है और ब्रह्माकी रात्रिके समय लीन होता है।"},{"c":8,"v":20,"sp":"krishna","sa":"परस्तस्मात्तु भावोऽन्योऽव्यक्तोऽव्यक्तात्सनातनः ।\nयः स सर्वेषु भूतेषु नश्यत्सु न विनश्यति ॥","tr":"parastasmāttu bhāvo'nyo'vyakto'vyaktātsanātanaḥ\nyaḥ sa sarveṣu bhūteṣu naśyatsu na vinaśyati","gs":"પરસ્તસ્માત્તુ ભાવોઽન્યોઽવ્યક્તોઽવ્યક્તાત્સનાતનઃ ।\nયઃ સ સર્વેષુ ભૂતેષુ નશ્યત્સુ ન વિનશ્યતિ ॥","en":"But verily, there exists higher than this Unmanifested, another Unmanifested Eternal, which is not destroyed even when all beings are destroyed.","hi":"परन्तु उस अव्यक्त- (ब्रह्माजीके सूक्ष्म-शरीर-) से अन्य अनादि सर्वश्रेष्ठ भावरूप जो अव्यक्त है, उसका सम्पूर्ण प्राणियोंके नष्ट होनेपर भी नाश नहीं होता।"},{"c":8,"v":21,"sp":"krishna","sa":"अव्यक्तोऽक्षर इत्युक्तस्तमाहुः परमां गतिम् ।\nयं प्राप्य न निवर्तन्ते तद्धाम परमं मम ॥","tr":"avyakto'kṣara ityuktastamāhuḥ paramāṃ gatim\nyaṃ prāpya na nivartante taddhāma paramaṃ mama","gs":"અવ્યક્તોઽક્ષર ઇત્યુક્તસ્તમાહુઃ પરમાં ગતિમ્ ।\nયં પ્રાપ્ય ન નિવર્તન્તે તદ્ધામ પરમં મમ ॥","en":"What is known as the Unmanifested and the Imperishable, That is said to be the highest goal. Those who reach It do not return (to this Samsara). That is My supreme abode (place or state).","hi":"उसीको अव्यक्त और अक्षर कहा गया है और उसीको परमगति कहा गया है तथा जिसको प्राप्त होनेपर जीव फिर लौटकर नहीं आते, वह मेरा परमधाम है।"},{"c":8,"v":22,"sp":"krishna","sa":"पुरुषः स परः पार्थ भक्त्या लभ्यस्त्वनन्यया ।\nयस्यान्तःस्थानि भूतानि येन सर्वमिदं ततम् ॥","tr":"puruṣaḥ sa paraḥ pārtha bhaktyā labhyastvananyayā\nyasyāntaḥsthāni bhūtāni yena sarvamidaṃ tatam","gs":"પુરુષઃ સ પરઃ પાર્થ ભક્ત્યા લભ્યસ્ત્વનન્યયા ।\nયસ્યાન્તઃસ્થાનિ ભૂતાનિ યેન સર્વમિદં તતમ્ ॥","en":"That highest Purusha, O Arjuna, is attainable by unswerving devotion to Him alone, within Whom all beings dwell and by Whom all this is pervaded.","hi":"हे पृथानन्दन अर्जुन ! सम्पूर्ण प्राणी जिसके अन्तर्गत हैं और जिससे यह सम्पूर्ण संसार व्याप्त है, वह परम पुरुष परमात्मा तो अनन्यभक्तिसे प्राप्त होनेयोग्य है।"},{"c":8,"v":23,"sp":"krishna","sa":"यत्र काले त्वनावृत्तिमावृत्तिं चैव योगिनः ।\nप्रयाता यान्ति तं कालं वक्ष्यामि भरतर्षभ ॥","tr":"yatra kāle tvanāvṛttimāvṛttiṃ caiva yoginaḥ\nprayātā yānti taṃ kālaṃ vakṣyāmi bharatarṣabha","gs":"યત્ર કાલે ત્વનાવૃત્તિમાવૃત્તિં ચૈવ યોગિનઃ ।\nપ્રયાતા યાન્તિ તં કાલં વક્ષ્યામિ ભરતર્ષભ ॥","en":"Now I will tell you, O chief of the Bharatas, the times of departure at which the Yogis will return or not return.","hi":"हे भरतवंशियोंमें श्रेष्ठ अर्जुन ! जिस काल अर्थात् मार्गमें शरीर छोड़कर गये हुए योगी अनावृत्तिको प्राप्त होते हैं अर्थात् पीछे लौटकर नहीं आते और (जिस मार्गमें गये हुए) आवृत्तिको प्राप्त होते हैं अर्थात् पीछे लौटकर आते हैं, उस कालको अर्थात् दोनों मार्गोंको मैं कहूँगा।"},{"c":8,"v":24,"sp":"krishna","sa":"अग्निर्ज्योतिरहः शुक्लः षण्मासा उत्तरायणम् ।\nतत्र प्रयाता गच्छन्ति ब्रह्म ब्रह्मविदो जनाः ॥","tr":"agnirjyo
