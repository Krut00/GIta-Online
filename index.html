 स्थिति; सात्त्विक दान; इन्द्रियोंका दमन; यज्ञ; स्वाध्याय; कर्तव्य-पालनके लिये कष्ट सहना; शरीर-मन-वाणीकी सरलता।"},{"c":16,"v":2,"sp":"krishna","sa":"अहिंसा सत्यमक्रोधस्त्यागः शान्तिरपैशुनम् ।\nदया भूतेष्वलोलुप्त्वं मार्दवं ह्रीरचापलम् ॥","tr":"ahiṃsā satyamakrodhastyāgaḥ śāntirapaiśunam\ndayā bhūteṣvaloluptvaṃ mārdavaṃ hrīracāpalam","gs":"અહિંસા સત્યમક્રોધસ્ત્યાગઃ શાન્તિરપૈશુનમ્ ।\nદયા ભૂતેષ્વલોલુપ્ત્વં માર્દવં હ્રીરચાપલમ્ ॥","en":"Harmlessness, truth, absence of anger, renunciation, peacefulness, absence of crookedness, compassion for beings, non-covetousness, gentleness, modesty, and absence of fickleness.","hi":"अहिंसा, सत्यभाषण; क्रोध न करना; संसारकी कामनाका त्याग; अन्तःकरणमें राग-द्वेषजनित हलचलका न होना; चुगली न करना; प्राणियोंपर दया करना सांसारिक विषयोंमें न ललचाना; अन्तःकरणकी कोमलता; अकर्तव्य करनेमें लज्जा; चपलताका अभाव।"},{"c":16,"v":3,"sp":"krishna","sa":"तेजः क्षमा धृतिः शौचमद्रोहो नातिमानिता ।\nभवन्ति सम्पदं दैवीमभिजातस्य भारत ॥","tr":"tejaḥ kṣamā dhṛtiḥ śaucamadroho nātimānitā\nbhavanti sampadaṃ daivīmabhijātasya bhārata","gs":"તેજઃ ક્ષમા ધૃતિઃ શૌચમદ્રોહો નાતિમાનિતા ।\nભવન્તિ સમ્પદં દૈવીમભિજાતસ્ય ભારત ॥","en":"Vigor, forgiveness, fortitude, purity, absence of hatred, absence of pride—these belong to one born for a divine state, O Arjuna.","hi":"तेज (प्रभाव), क्षमा, धैर्य, शरीरकी शुद्धि, वैरभावका न रहना और मानको न चाहना, हे भरतवंशी अर्जुन ! ये सभी दैवी सम्पदाको प्राप्त हुए मनुष्यके लक्षण हैं।"},{"c":16,"v":4,"sp":"krishna","sa":"दम्भो दर्पोऽभिमानश्च क्रोधः पारुष्यमेव च ।\nअज्ञानं चाभिजातस्य पार्थ सम्पदमासुरीम् ॥","tr":"dambho darpo'bhimānaśca krodhaḥ pāruṣyameva ca\najñānaṃ cābhijātasya pārtha sampadamāsurīm","gs":"દમ્ભો દર્પોઽભિમાનશ્ચ ક્રોધઃ પારુષ્યમેવ ચ ।\nઅજ્ઞાનં ચાભિજાતસ્ય પાર્થ સમ્પદમાસુરીમ્ ॥","en":"Hypocrisy, arrogance, and self-conceit, anger, harshness, and ignorance—these belong to one who is born for a demoniacal state, O Partha.","hi":"हे पृथानन्दन ! दम्भ करना, घमण्ड करना, अभिमान करना, क्रोध करना, कठोरता रखना और अविवेकका होना भी -- ये सभी आसुरीसम्पदाको प्राप्त हुए मनुष्यके लक्षण हैं।"},{"c":16,"v":5,"sp":"krishna","sa":"दैवी सम्पद्विमोक्षाय निबन्धायासुरी मता ।\nमा शुचः सम्पदं दैवीमभिजातोऽसि पाण्डव ॥","tr":"daivī sampadvimokṣāya nibandhāyāsurī matā\nmā śucaḥ sampadaṃ daivīmabhijāto'si pāṇḍava","gs":"દૈવી સમ્પદ્વિમોક્ષાય નિબન્ધાયાસુરી મતા ।\nમા શુચઃ સમ્પદં દૈવીમભિજાતોઽસિ પાણ્ડવ ॥","en":"The divine nature is deemed conducive to liberation, and the demonic to bondage. Grieve not, O Arjuna, for you are born with divine endowments.","hi":"दैवी-सम्पत्ति मुक्तिके लिये और आसुरी-सम्पत्ति बन्धनके लिये है। हे पाण्डव तुम दैवी-सम्पत्तिको प्राप्त हुए हो, इसलिये तुम्हें शोक (चिन्ता) नहीं करना चाहिये।"},{"c":16,"v":6,"sp":"krishna","sa":"द्वौ भूतसर्गौ लोकेऽस्मिन् दैव आसुर एव च ।\nदैवो विस्तरशः प्रोक्त आसुरं पार्थ मे श्रृणु ॥","tr":"dvau bhūtasargau loke'smin daiva āsura eva ca\ndaivo vistaraśaḥ prokta āsuraṃ pārtha me śrṛṇu","gs":"દ્વૌ ભૂતસર્ગૌ લોકેઽસ્મિન્ દૈવ આસુર એવ ચ ।\nદૈવો વિસ્તરશઃ પ્રોક્ત આસુરં પાર્થ મે શ્રૃણુ ॥","en":"There are two types of beings in this world: the divine and the demoniacal. The divine has been described at length; hear from Me, O Arjuna, about the demoniacal.","hi":"इस लोकमें दो तरहके प्राणियोंकी सृष्टि है -- दैवी और आसुरी। दैवीका तो मैंने विस्तारसे वर्णन कर दिया, अब हे पार्थ ! तुम मेरेसे आसुरीका विस्तार सुनो।"},{"c":16,"v":7,"sp":"krishna","sa":"प्रवृत्तिं च निवृत्तिं च जना न विदुरासुराः ।\nन शौचं नापि चाचारो न सत्यं तेषु विद्यते ॥","tr":"pravṛttiṃ ca nivṛttiṃ ca janā na vidurāsurāḥ\nna śaucaṃ nāpi cācāro na satyaṃ teṣu vidyate","gs":"પ્રવૃત્તિં ચ નિવૃત્તિં ચ જના ન વિદુરાસુરાઃ ।\nન શૌચં નાપિ ચાચારો ન સત્યં તેષુ વિદ્યતે ॥","en":"The demoniacal do not know what to do and what to refrain from; they have neither purity, nor right conduct, nor truth.","hi":"आसुरी प्रकृतिवाले मनुष्य प्रवृत्ति और निवृत्तिको नहीं जानते और उनमें न बाह्यशुद्धि, न श्रेष्ठ आचरण तथा न सत्य-पालन ही होता है।"},{"c":16,"v":8,"sp":"krishna","sa":"असत्यमप्रतिष्ठं ते जगदाहुरनीश्वरम् ।\nअपरस्परसम्भूतं किमन्यत्कामहैतुकम् ॥","tr":"asatyamapratiṣṭhaṃ te jagadāhuranīśvaram\naparasparasambhūtaṃ kimanyatkāmahaitukam","gs":"અસત્યમપ્રતિષ્ઠં તે જગદાહુરનીશ્વરમ્ ।\nઅપરસ્પરસમ્ભૂતં કિમન્યત્કામહૈતુકમ્ ॥","en":"They say, \"This universe is without truth, without a moral basis, without a God, brought about by mutual union, with lust as its cause; what else?\"","hi":"वे कहा करते हैं कि संसार असत्य, अप्रतिष्ठित और बिना ईश्वरके अपने-आप केवल स्त्री-पुरुषके संयोगसे पैदा हुआ है। इसलिये काम ही इसका कारण है, और कोई कारण नहीं है।"},{"c":16,"v":9,"sp":"krishna","sa":"एतां दृष्टिमवष्टभ्य नष्टात्मानोऽल्पबुद्धयः ।\nप्रभवन्त्युग्रकर्माणः क्षयाय जगतोऽहिताः ॥","tr":"etāṃ dṛṣṭimavaṣṭabhya naṣṭātmāno'lpabuddhayaḥ\nprabhavantyugrakarmāṇaḥ kṣayāya jagato'hitāḥ","gs":"એતાં દૃષ્ટિમવષ્ટભ્ય નષ્ટાત્માનોઽલ્પબુદ્ધયઃ ।\nપ્રભવન્ત્યુગ્રકર્માણઃ ક્ષયાય જગતોઽહિતાઃ ॥","en":"Holding this view, these ruined souls of small intellect and fierce deeds come forth as enemies of the world, intent on its destruction.","hi":"उपर्युक्त (नास्तिक) दृष्टिका आश्रय लेनेवाले जो मनुष्य अपने नित्य स्वरूपको नहीं मानते, जिनकी बुद्धि तुच्छ है, जो उग्रकर्मा और संसारके शत्रु हैं, उन मनुष्योंकी सामर्थ्यका उपयोग जगत्का नाश करनेके लिये ही होता है।"},{"c":16,"v":10,"sp":"krishna","sa":"काममाश्रित्य दुष्पूरं दम्भमानमदान्विताः ।\nमोहाद्गृहीत्वासद्ग्राहान्प्रवर्तन्तेऽशुचिव्रताः ॥","tr":"kāmamāśritya duṣpūraṃ dambhamānamadānvitāḥ\nmohādgṛhītvāsadgrāhānpravartante'śucivratāḥ","gs":"કામમાશ્રિત્ય દુષ્પૂરં દમ્ભમાનમદાન્વિતાઃ ।\nમોહાદ્ગૃહીત્વાસદ્ગ્રાહાન્પ્રવર્તન્તેઽશુચિવ્રતાઃ ॥","en":"Filled with insatiable desires, full of hypocrisy, pride, and arrogance, holding evil ideas due to delusion, they work with impure intentions.","hi":"कभी पूरी न होनेवाली कामनाओंका आश्रय लेकर दम्भ, अभिमान और मदमें चूर रहनेवाले तथा अपवित्र व्रत धारण करनेवाले मनुष्य मोहके कारण दुराग्रहोंको धारण करके संसारमें विचरते रहते हैं।"},{"c":16,"v":11,"sp":"krishna","sa":"चिन्तामपरिमेयां च प्रलयान्तामुपाश्रिताः ।\nकामोपभोगपरमा एतावदिति निश्िचताः ॥","tr":"cintāmaparimeyāṃ ca pralayāntāmupāśritāḥ\nkāmopabhogaparamā etāvaditi niśicatāḥ","gs":"ચિન્તામપરિમેયાં ચ પ્રલયાન્તામુપાશ્રિતાઃ ।\nકામોપભોગપરમા એતાવદિતિ નિશ્િચતાઃ ॥","en":"Giving themselves over to immeasurable cares that end only with death, regarding the gratification of lust as their highest aim, and feeling sure that that is all.","hi":"वे मृत्युपर्यन्त रहनेवाली अपार चिन्ताओंका आश्रय लेनेवाले, पदार्थोंका संग्रह और उनका भोग करनेमें ही लगे रहनेवाले और 'जो कुछ है, वह इतना ही है' -- ऐसा निश्चय करनेवाले होते हैं।"},{"c":16,"v":12,"sp":"krishna","sa":"आशापाशशतैर्बद्धाः कामक्रोधपरायणाः ।\nईहन्ते कामभोगार्थमन्यायेनार्थसञ्चयान् ॥","tr":"āśāpāśaśatairbaddhāḥ kāmakrodhaparāyaṇāḥ\nīhante kāmabhogārthamanyāyenārthasañcayān","gs":"આશાપાશશતૈર્બદ્ધાઃ કામક્રોધપરાયણાઃ ।\nઈહન્તે કામભોગાર્થમન્યાયેનાર્થસઞ્ચયાન્ ॥","en":"Bound by a hundred ties of hope, given over to lust and anger, they strive to obtain hoards of wealth by unlawful means for sensual enjoyment.","hi":"वे आशाकी सैकड़ों फाँसियोंसे बँधे हुए मनुष्य काम-क्रोधके परायण होकर पदार्थोंका भोग करनेके लिये अन्यायपूर्वक धन-संचय करनेकी चेष्टा करते रहते हैं।"},{"c":16,"v":13,"sp":"krishna","sa":"इदमद्य मया लब्धमिमं प्राप्स्ये मनोरथम् ।\nइदमस्तीदमपि मे भविष्यति पुनर्धनम् ॥","tr":"idamadya mayā labdhamimaṃ prāpsye manoratham\nidamastīdamapi me bhaviṣyati punardhanam","gs":"ઇદમદ્ય મયા લબ્ધમિમં પ્રાપ્સ્યે મનોરથમ્ ।\nઇદમસ્તીદમપિ મે ભવિષ્યતિ પુનર્ધનમ્ ॥","en":"\"I have gained this today; I will fulfill this desire of mine; this is mine, and this wealth will be mine in the future.\"","hi":"इतनी वस्तुएँ तो हमने आज प्राप्त कर लीं और अब इस मनोरथको प्राप्त (पूरा) कर लेंगे।,इतना धन तो हमारे पास है ही, इतना धन फिर हो जायगा।"},{"c":16,"v":14,"sp":"krishna","sa":"असौ मया हतः शत्रुर्हनिष्ये चापरानपि ।\nईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी ॥","tr":"asau mayā hataḥ śatrurhaniṣye cāparānapi\nīśvaro'hamahaṃ bhogī siddho'haṃ balavānsukhī","gs":"અસૌ મયા હતઃ શત્રુર્હનિષ્યે ચાપરાનપિ ।\nઈશ્વરોઽહમહં ભોગી સિદ્ધોઽહં બલવાન્સુખી ॥","en":"\"I have slain that enemy, and I shall slay others too. I am the Lord; I enjoy, I am perfect, powerful, and happy.\"","hi":"वह शत्रु तो हमारे द्वारा मारा गया और उन दूसरे शत्रुओंको भी हम मार डालेंगे। हम सर्वसमर्थ हैं। हमारे पास भोग-सामग्री बहुत है। हम सिद्ध हैं। हम बड़े बलवान् और सुखी हैं।"},{"c":16,"v":15,"sp":"krishna","sa":"आढ्योऽभिजनवानस्मि कोऽन्योऽस्ति सदृशो मया ।\nयक्ष्ये दास्यामि मोदिष्य इत्यज्ञानविमोहिताः ॥","tr":"āḍhyo'bhijanavānasmi ko'nyo'sti sadṛśo mayā\nyakṣye dāsyāmi modiṣya ityajñānavimohitāḥ","gs":"આઢ્યોઽભિજનવાનસ્મિ કોઽન્યોઽસ્તિ સદૃશો મયા ।\nયક્ષ્યે દાસ્યામિ મોદિષ્ય ઇત્યજ્ઞાનવિમોહિતાઃ ॥","en":"\"I am wealthy and born into a noble family. Who is my equal? I shall perform sacrifices, give charity, and rejoice,\" thus deluded by ignorance.","hi":"हम धनवान् हैं, बहुत-से मनुष्य हमारे पास हैं, हमारे समान और कौन है? हम खूब यज्ञ करेंगे, दान देंगे और मौज करेंगे -- इस तरह वे अज्ञानसे मोहित रहते हैं।"},{"c":16,"v":16,"sp":"krishna","sa":"अनेकचित्तविभ्रान्ता मोहजालसमावृताः ।\nप्रसक्ताः कामभोगेषु पतन्ति नरकेऽशुचौ ॥","tr":"anekacittavibhrāntā mohajālasamāvṛtāḥ\nprasaktāḥ kāmabhogeṣu patanti narake'śucau","gs":"અનેકચિત્તવિભ્રાન્તા મોહજાલસમાવૃતાઃ ।\nપ્રસક્તાઃ કામભોગેષુ પતન્તિ નરકેઽશુચૌ ॥","en":"Bewildered by many fancies, entangled in the snare of delusion, addicted to the gratification of lust, they fall into a foul hell.","hi":"कामनाओंके कारण तरह-तरहसे भ्रमित चित्तवाले, मोह-जालमें अच्छी तरहसे फँसे हुए तथा पदार्थों और भोगोंमें अत्यन्त आसक्त रहनेवाले मनुष्य भयङ्कर नरकोंमें गिरते हैं।"},{"c":16,"v":17,"sp":"krishna","sa":"आत्मसम्भाविताः स्तब्धा धनमानमदान्विताः ।\nयजन्ते नामयज्ञैस्ते दम्भेनाविधिपूर्वकम् ॥","tr":"ātmasambhāvitāḥ stabdhā dhanamānamadānvitāḥ\nyajante nāmayajñaiste dambhenāvidhipūrvakam","gs":"આત્મસમ્ભાવિતાઃ સ્તબ્ધા ધનમાનમદાન્વિતાઃ ।\nયજન્તે નામયજ્ઞૈસ્તે દમ્ભેનાવિધિપૂર્વકમ્ ॥","en":"Self-conceited, stubborn, filled with pride and intoxication of wealth, they perform sacrifices in name only for ostentation, contrary to scriptural ordinances.","hi":"अपनेको सबसे अधिक पूज्य माननेवाले, अकड़ रखनेवाले तथा धन और मानके मदमें चूर रहनेवाले वे मनुष्य दम्भसे अविधिपूर्वक नाममात्रके यज्ञोंसे यजन करते हैं।"},{"c":16,"v":18,"sp":"krishna","sa":"अहङ्कारं बलं दर्पं कामं क्रोधं च संश्रिताः ।\nमामात्मपरदेहेषु प्रद्विषन्तोऽभ्यसूयकाः ॥","tr":"ahaṅkāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ ca saṃśritāḥ\nmāmātmaparadeheṣu pradviṣanto'bhyasūyakāḥ","gs":"અહઙ્કારં બલં દર્પં કામં ક્રોધં ચ સંશ્રિતાઃ ।\nમામાત્મપરદેહેષુ પ્રદ્વિષન્તોઽભ્યસૂયકાઃ ॥","en":"Given over to egoism, power, haughtiness, lust, and anger, these malicious people hate Me in their own bodies and in the bodies of others.","hi":"वे अहङ्कार, हठ, घमण्ड, कामना और क्रोधका आश्रय लेनेवाले मनुष्य अपने और दूसरोंके शरीरमें रहनेवाले मुझ अन्तर्यामीके साथ द्वेष करते हैं तथा (मेरे और दूसरोंके गुणोंमें) दोष-दृष्टि रखते हैं।"},{"c":16,"v":19,"sp":"krishna","sa":"तानहं द्विषतः क्रूरान्संसारेषु नराधमान् ।\nक्षिपाम्यजस्रमशुभानासुरीष्वेव योनिषु ॥","tr":"tānahaṃ dviṣataḥ krūrānsaṃsāreṣu narādhamān\nkṣipāmyajasramaśubhānāsurīṣveva yoniṣu","gs":"તાનહં દ્વિષતઃ ક્રૂરાન્સંસારેષુ નરાધમાન્ ।\nક્ષિપામ્યજસ્રમશુભાનાસુરીષ્વેવ યોનિષુ ॥","en":"Those cruel haters, the worst among men in the world, I hurl those evil-doers into the wombs of demons only.","hi":"उन द्वेष करनेवाले, क्रूर स्वभाववाले और संसारमें महान् नीच, अपवित्र मनुष्योंको मैं बार-बार आसुरी योनियोंमें गिराता ही रहता हूँ।"},{"c":16,"v":20,"sp":"krishna","sa":"असुरीं योनिमापन्ना मूढा जन्मनि जन्मनि ।\nमामप्राप्यैव कौन्तेय ततो यान्त्यधमां गतिम् ॥","tr":"asurīṃ yonimāpannā mūḍhā janmani janmani\nmāmaprāpyaiva kaunteya tato yāntyadhamāṃ gatim","gs":"અસુરીં યોનિમાપન્ના મૂઢા જન્મનિ જન્મનિ ।\nમામપ્રાપ્યૈવ કૌન્તેય તતો યાન્ત્યધમાં ગતિમ્ ॥","en":"Entering into demoniacal wombs and deluded, birth after birth, they do not attain Me, thus falling, O Arjuna, into a condition still lower than that.","hi":"हे कुन्तीनन्दन ! वे मूढ मनुष्य मेरेको प्राप्त न करके ही जन्म-जन्मान्तरमें आसुरी योनिको प्राप्त होते हैं, फिर उससे भी अधिक अधम गतिमें अर्थात् भयङ्कर नरकोंमें चले जाते हैं।"},{"c":16,"v":21,"sp":"krishna","sa":"त्रिविधं नरकस्येदं द्वारं नाशनमात्मनः ।\nकामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत् ॥","tr":"trividhaṃ narakasyedaṃ dvāraṃ nāśanamātmanaḥ\nkāmaḥ krodhastathā lobhastasmādetattrayaṃ tyajet","gs":"ત્રિવિધં નરકસ્યેદં દ્વારં નાશનમાત્મનઃ ।\nકામઃ ક્રોધસ્તથા લોભસ્તસ્માદેતત્ત્રયં ત્યજેત્ ॥","en":"There are three gates to this hell, destructive of the self: lust, anger, and greed; therefore, one should abandon these three.","hi":"काम, क्रोध और लोभ -- ये तीन प्रकारके नरकके दरवाजे जीवात्माका पतन करनेवाले हैं, इसलिये इन तीनोंका त्याग कर देना चाहिये।"},{"c":16,"v":22,"sp":"krishna","sa":"एतैर्विमुक्तः कौन्तेय तमोद्वारैस्त्रिभिर्नरः ।\nआचरत्यात्मनः श्रेयस्ततो याति परां गतिम् ॥","tr":"etairvimuktaḥ kaunteya tamodvāraistribhirnaraḥ\nācaratyātmanaḥ śreyastato yāti parāṃ gatim","gs":"એતૈર્વિમુક્તઃ કૌન્તેય તમોદ્વારૈસ્ત્રિભિર્નરઃ ।\nઆચરત્યાત્મનઃ શ્રેયસ્તતો યાતિ પરાં ગતિમ્ ॥","en":"A person who is liberated from these three gates of darkness, O Arjuna, practices what is beneficial for them and thus goes to the Supreme Goal.","hi":"हे कुन्तीनन्दन ! इन नरकके तीनों दरवाजोंसे रहित हुआ जो मनुष्य अपने कल्याणका आचरण करता है, वह परमगतिको प्राप्त हो जाता है।"},{"c":16,"v":23,"sp":"krishna","sa":"यः शास्त्रविधिमुत्सृज्य वर्तते कामकारतः ।\nन स सिद्धिमवाप्नोति न सुखं न परां गतिम् ॥","tr":"yaḥ śāstravidhimutsṛjya vartate kāmakārataḥ\nna sa siddhimavāpnoti na sukhaṃ na parāṃ gatim","gs":"યઃ શાસ્ત્રવિધિમુત્સૃજ્ય વર્તતે કામકારતઃ ।\nન સ સિદ્ધિમવાપ્નોતિ ન સુખં ન પરાં ગતિમ્ ॥","en":"He who, having cast aside the ordinances of the scriptures, acts under the impulse of desire, does not attain perfection, nor happiness, nor the Supreme Goal.","hi":"जो मनुष्य शास्त्रविधिको छोड़कर अपनी इच्छासे मनमाना आचरण करता है, वह न सिद्धि-(अन्तःकरणकी शुद्धि-) को, न सुखको और न परमगतिको ही प्राप्त होता है।"},{"c":16,"v":24,"sp":"krishna","sa":"तस्माच्छास्त्रं प्रमाणं ते कार्याकार्यव्यवस्थितौ ।\nज्ञात्वा शास्त्रविधानोक्तं कर्म कर्तुमिहार्हसि ॥","tr":"tasmācchāstraṃ pramāṇaṃ te kāryākāryavyavasthitau\njñātvā śāstravidhānoktaṃ karma kartumihārhasi","gs":"તસ્માચ્છાસ્ત્રં પ્રમાણં તે કાર્યાકાર્યવ્યવસ્થિતૌ ।\nજ્ઞાત્વા શાસ્ત્રવિધાનોક્તં કર્મ કર્તુમિહાર્હસિ ॥","en":"Therefore, let the scripture be thy authority in determining what ought to be done and what ought not to be done. Having known what is said in the ordinance of the scriptures, thou shouldst act in this world.","hi":"अतः तेरे लिये कर्तव्य-अकर्तव्यकी व्यवस्थामें शास्त्र ही प्रमाण है -- ऐसा जानकर तू इस लोकमें शास्त्र-विधिसे नियत कर्तव्य कर्म करनेयोग्य है।"},{"c":17,"v":1,"sp":"arjuna","sa":"ये शास्त्रविधिमुत्सृज्य यजन्ते श्रद्धयाऽन्विताः ।\nतेषां निष्ठा तु का कृष्ण सत्त्वमाहो रजस्तमः ॥","tr":"ye śāstravidhimutsṛjya yajante śraddhayā'nvitāḥ\nteṣāṃ niṣṭhā tu kā kṛṣṇa sattvamāho rajastamaḥ","gs":"યે શાસ્ત્રવિધિમુત્સૃજ્ય યજન્તે શ્રદ્ધયાઽન્વિતાઃ ।\nતેષાં નિષ્ઠા તુ કા કૃષ્ણ સત્ત્વમાહો રજસ્તમઃ ॥","en":"Arjuna said, \"What is the condition of those who, disregarding the injunctions of the scriptures, perform sacrifice with faith—is it Sattva, Rajas, or Tamas, O Krishna?\"","hi":"अर्जुन बोले -- हे कृष्ण ! जो मनुष्य शास्त्र-विधिका त्याग करके श्रद्धापूर्वक देवता आदिका पूजन करते हैं, उनकी निष्ठा फिर कौन-सी है? सात्त्विकी है अथवा राजसी-तामसी?"},{"c":17,"v":2,"sp":"krishna","sa":"त्रिविधा भवति श्रद्धा देहिनां सा स्वभावजा ।\nसात्त्विकी राजसी चैव तामसी चेति तां श्रृणु ॥","tr":"trividhā bhavati śraddhā dehināṃ sā svabhāvajā\nsāttvikī rājasī caiva tāmasī ceti tāṃ śrṛṇu","gs":"ત્રિવિધા ભવતિ શ્રદ્ધા દેહિનાં સા સ્વભાવજા ।\nસાત્ત્વિકી રાજસી ચૈવ તામસી ચેતિ તાં શ્રૃણુ ॥","en":"The Blessed Lord said, \"There are threefold faiths inherent in the nature of the embodied: the sattvic (pure), the rajasic (passionate), and the tamasic (dark). Hear of them.\"","hi":"श्रीभगवान् बोले -- मनुष्योंकी वह स्वभावसे उत्पन्न हुई श्रद्धा सात्त्विकी तथा राजसी और तामसी -- ऐसे तीन तरहकी ही होती है, उसको तुम मेरेसे सुनो।"},{"c":17,"v":3,"sp":"krishna","sa":"सत्त्वानुरूपा सर्वस्य श्रद्धा भवति भारत ।\nश्रद्धामयोऽयं पुरुषो यो यच्छ्रद्धः स एव सः ॥","tr":"sattvānurūpā sarvasya śraddhā bhavati bhārata\nśraddhāmayo'yaṃ puruṣo yo yacchraddhaḥ sa eva saḥ","gs":"સત્ત્વાનુરૂપા સર્વસ્ય શ્રદ્ધા ભવતિ ભારત ।\nશ્રદ્ધામયોઽયં પુરુષો યો યચ્છ્રદ્ધઃ સ એવ સઃ ॥","en":"The faith of each is in accordance with their nature, O Arjuna. People consist of their faith; as a person's faith is, so are they.","hi":"हे भारत ! सभी मनुष्योंकी श्रद्धा अन्तःकरणके अनुरूप होती है। यह मनुष्य श्रद्धामय है। इसलिये जो जैसी श्रद्धावाला है, वही उसका स्वरूप है अर्थात् वही उसकी निष्ठा -- स्थिति है।"},{"c":17,"v":4,"sp":"krishna","sa":"यजन्ते सात्त्विका देवान्यक्षरक्षांसि राजसाः ।\nप्रेतान्भूतगणांश्चान्ये यजन्ते तामसा जनाः ॥","tr":"yajante sāttvikā devānyakṣarakṣāṃsi rājasāḥ\npretānbhūtagaṇāṃścānye yajante tāmasā janāḥ","gs":"યજન્તે સાત્ત્વિકા દેવાન્યક્ષરક્ષાંસિ રાજસાઃ ।\nપ્રેતાન્ભૂતગણાંશ્ચાન્યે યજન્તે તામસા જનાઃ ॥","en":"The sattvic, or pure, men worship the gods; the rajasic, or passionate, worship the yakshas and rakshasas; the others, the tamasic or deluded people, worship ghosts and hosts of nature-spirits.","hi":"सात्त्विक मनुष्य देवताओंका पूजन करते हैं, राजस मनुष्य यक्षों और राक्षसोंका और दूसरे जो तामस मनुष्य हैं, वे प्रेतों और भूतगणोंका पूजन करते हैं।"},{"c":17,"v":5,"sp":"krishna","sa":"अशास्त्रविहितं घोरं तप्यन्ते ये तपो जनाः ।\nदम्भाहङ्कारसंयुक्ताः कामरागबलान्विताः ॥","tr":"aśāstravihitaṃ ghoraṃ tapyante ye tapo janāḥ\ndambhāhaṅkārasaṃyuktāḥ kāmarāgabalānvitāḥ","gs":"અશાસ્ત્રવિહિતં ઘોરં તપ્યન્તે યે તપો જનાઃ ।\nદમ્ભાહઙ્કારસંયુક્તાઃ કામરાગબલાન્વિતાઃ ॥","en":"Those men who practice terrific austerities not prescribed by the scriptures, given to hypocrisy and egoism, driven by the force of lust and attachment.","hi":"जो मनुष्य शास्त्रविधिसे रहित घोर तप करते हैं; जो दम्भ और अहङ्कारसे अच्छी तरह युक्त हैं; जो भोग-पदार्थ, आसक्ति और हठसे युक्त हैं; जो शरीरमें स्थित पाँच भूतोंको अर्थात् पाञ्चभौतिक शरीरको तथा अन्तःकरणमें स्थित मुझ परमात्माको भी कृश करनेवाले हैं उन अज्ञानियोंको तू आसुर निश्चयवाले (आसुरी सम्पदावाले) समझ।"},{"c":17,"v":6,"sp":"krishna","sa":"कर्षयन्तः शरीरस्थं भूतग्राममचेतसः ।\nमां चैवान्तःशरीरस्थं तान्विद्ध्यासुरनिश्चयान् ॥","tr":"karṣayantaḥ śarīrasthaṃ bhūtagrāmamacetasaḥ\nmāṃ caivāntaḥśarīrasthaṃ tānviddhyāsuraniścayān","gs":"કર્ષયન્તઃ શરીરસ્થં ભૂતગ્રામમચેતસઃ ।\nમાં ચૈવાન્તઃશરીરસ્થં તાન્વિદ્ધ્યાસુરનિશ્ચયાન્ ॥","en":"Know thou these to be of demonical resolves, senselessly torturing all the elements in the body and Me who dwell in the body.","hi":"जो मनुष्य शास्त्रविधिसे रहित घोर तप करते हैं; जो दम्भ और अहङ्कारसे अच्छी तरह युक्त हैं; जो भोग-पदार्थ, आसक्ति और हठसे युक्त हैं; जो शरीरमें स्थित पाँच भूतोंको अर्थात् पाञ्चभौतिक शरीरको तथा अन्तःकरणमें स्थित मुझ परमात्माको भी कृश करनेवाले हैं उन अज्ञानियोंको तू आसुर निश्चयवाले (आसुरी सम्पदावाले) समझ।"},{"c":17,"v":7,"sp":"krishna","sa":"आहारस्त्वपि सर्वस्य त्रिविधो भवति प्रियः ।\nयज्ञस्तपस्तथा दानं तेषां भेदमिमं श्रृणु ॥","tr":"āhārastvapi sarvasya trividho bhavati priyaḥ\nyajñastapastathā dānaṃ teṣāṃ bhedamimaṃ śrṛṇu","gs":"આહારસ્ત્વપિ સર્વસ્ય ત્રિવિધો ભવતિ પ્રિયઃ ।\nયજ્ઞસ્તપસ્તથા દાનં તેષાં ભેદમિમં શ્રૃણુ ॥","en":"The food that is dear to each is threefold, as well as sacrifice, austerity, and almsgiving. Hear the distinction of these.","hi":"आहार भी सबको तीन प्रकारका प्रिय होता है और वैसे ही यज्ञ, दान और तप भी तीन प्रकारके होते हैं अर्थात् शास्त्रीय कर्मोंमें भी तीन प्रकारकी रुचि होती है, तू उनके इस भेदको सुन।"},{"c":17,"v":8,"sp":"krishna","sa":"आयुःसत्त्वबलारोग्यसुखप्रीतिविवर्धनाः ।\nरस्याः स्निग्धाः स्थिरा हृद्या आहाराः सात्त्विकप्रियाः ॥","tr":"āyuḥsattvabalārogyasukhaprītivivardhanāḥ\nrasyāḥ snigdhāḥ sthirā hṛdyā āhārāḥ sāttvikapriyāḥ","gs":"આયુઃસત્ત્વબલારોગ્યસુખપ્રીતિવિવર્ધનાઃ ।\nરસ્યાઃ સ્નિગ્ધાઃ સ્થિરા હૃદ્યા આહારાઃ સાત્ત્વિકપ્રિયાઃ ॥","en":"The foods that increase life, purity, strength, health, joy, and cheerfulness (good appetite), which are savory, oily, substantial, and agreeable, are dear to the Sattvic (pure) people.","hi":"आयु, सत्त्वगुण, बल, आरोग्य, सुख और प्रसन्नता बढ़ानेवाले, स्थिर रहनेवाले, हृदयको शक्ति देनेवाले, रसयुक्त तथा चिकने -- ऐसे आहार अर्थात् भोजन करनेके पदार्थ सात्त्विक मनुष्यको प्रिय होते हैं।"},{"c":17,"v":9,"sp":"krishna","sa":"कट्वम्ललवणात्युष्णतीक्ष्णरूक्षविदाहिनः ।\nआहारा राजसस्येष्टा दुःखशोकामयप्रदाः ॥","tr":"kaṭvamlalavaṇātyuṣṇatīkṣṇarūkṣavidāhinaḥ\nāhārā rājasasyeṣṭā duḥkhaśokāmayapradāḥ","gs":"કટ્વમ્લલવણાત્યુષ્ણતીક્ષ્ણરૂક્ષવિદાહિનઃ ।\nઆહારા રાજસસ્યેષ્ટા દુઃખશોકામયપ્રદાઃ ॥","en":"The foods that are bitter, sour, salty, overly hot, pungent, dry, and burning are liked by the Rajasic and are productive of pain, grief, and disease.","hi":"अति कड़वे, अति खट्टे, अति नमकीन, अति गरम, अति तीखे, अति रूखे और अति दाहकारक आहार अर्थात् भोजनके पदार्थ राजस मनुष्यको प्रिय होते हैं, जो कि दुःख, शोक और रोगोंको देनेवाले हैं।"},{"c":17,"v":10,"sp":"krishna","sa":"यातयामं गतरसं पूति पर्युषितं च यत् ।\nउच्छिष्टमपि चामेध्यं भोजनं तामसप्रियम् ॥","tr":"yātayāmaṃ gatarasaṃ pūti paryuṣitaṃ ca yat\nucchiṣṭamapi cāmedhyaṃ bhojanaṃ tāmasapriyam","gs":"યાતયામં ગતરસં પૂતિ પર્યુષિતં ચ યત્ ।\nઉચ્છિષ્ટમપિ ચામેધ્યં ભોજનં તામસપ્રિયમ્ ॥","en":"That which is stale, tasteless, putrid, rotten, rejected, and impure is the food liked by the Tamasic.","hi":"जो भोजन अधपका, रसरहित, दुर्गन्धित, बासी और उच्छिष्ट है तथा जो महान् अपवित्र भी है, वह तामस मनुष्यको प्रिय होता है।"},{"c":17,"v":11,"sp":"krishna","sa":"अफलाकाङ्क्षिभिर्यज्ञो विधिदृष्टो य इज्यते ।\nयष्टव्यमेवेति मनः समाधाय स सात्त्विकः ॥","tr":"aphalākāṅkṣibhiryajño vidhidṛṣṭo ya ijyate\nyaṣṭavyameveti manaḥ samādhāya sa sāttvikaḥ","gs":"અફલાકાઙ્ક્ષિભિર્યજ્ઞો વિધિદૃષ્ટો ય ઇજ્યતે ।\nયષ્ટવ્યમેવેતિ મનઃ સમાધાય સ સાત્ત્વિકઃ ॥","en":"That sacrifice which is offered by men without desire for reward, as enjoined by the ordinance (scripture), with a firm faith that doing so is their duty, is Sattvic or pure.","hi":"यज्ञ करना कर्तव्य है -- इस तरह मनको समाधान करके फलेच्छारहित मनुष्योंद्वारा जो शास्त्रविधिसे नियत यज्ञ किया जाता है, वह सात्त्विक है।"},{"c":17,"v":12,"sp":"krishna","sa":"अभिसंधाय तु फलं दम्भार्थमपि चैव यत् ।\nइज्यते भरतश्रेष्ठ तं यज्ञं विद्धि राजसम् ॥","tr":"abhisaṃdhāya tu phalaṃ dambhārthamapi caiva yat\nijyate bharataśreṣṭha taṃ yajñaṃ viddhi rājasam","gs":"અભિસંધાય તુ ફલં દમ્ભાર્થમપિ ચૈવ યત્ ।\nઇજ્યતે ભરતશ્રેષ્ઠ તં યજ્ઞં વિદ્ધિ રાજસમ્ ॥","en":"The sacrifice that is offered, O Arjuna, seeking a reward and for show, know that to be a Rajasic Yajna.","hi":"परन्तु हे भरतश्रेष्ठ अर्जुन ! जो यज्ञ फलकी इच्छाको लेकर अथवा दम्भ-(दिखावटीपन-) के लिये भी किया जाता है, उसको तुम राजस समझो।"},{"c":17,"v":13,"sp":"krishna","sa":"विधिहीनमसृष्टान्नं मन्त्रहीनमदक्षिणम् ।\nश्रद्धाविरहितं यज्ञं तामसं परिचक्षते ॥","tr":"vidhihīnamasṛṣṭānnaṃ mantrahīnamadakṣiṇam\nśraddhāvirahitaṃ yajñaṃ tāmasaṃ paricakṣate","gs":"વિધિહીનમસૃષ્ટાન્નં મન્ત્રહીનમદક્ષિણમ્ ।\nશ્રદ્ધાવિરહિતં યજ્ઞં તામસં પરિચક્ષતે ॥","en":"They declare that sacrifice to be Tamasic which is contrary to the ordinances of the scriptures, in which no food is distributed, and which is devoid of mantras, gifts, and faith.","hi":"शास्त्रविधिसे हीन, अन्न-दानसे रहित, बिना मन्त्रोंके, बिना दक्षिणाके और बिना श्रद्धाके किये जानेवाले यज्ञको तामस यज्ञ कहते हैं।"},{"c":17,"v":14,"sp":"krishna","sa":"देवद्विजगुरुप्राज्ञपूजनं शौचमार्जवम् ।\nब्रह्मचर्यमहिंसा च शारीरं तप उच्यते ॥","tr":"devadvijaguruprājñapūjanaṃ śaucamārjavam\nbrahmacaryamahiṃsā ca śārīraṃ tapa ucyate","gs":"દેવદ્વિજગુરુપ્રાજ્ઞપૂજનં શૌચમાર્જવમ્ ।\nબ્રહ્મચર્યમહિંસા ચ શારીરં તપ ઉચ્યતે ॥","en":"Worship of the gods, the twice-born, the teachers, and the wise; purity, straightforwardness, celibacy, and non-injury are all called the austerities of the body.","hi":"देवता, ब्राह्मण, गुरुजन और जीवन्मुक्त महापुरुषका पूजन करना, शुद्धि रखना, सरलता, ब्रह्मचर्यका पालन करना और हिंसा न करना -- यह शरीरसम्बन्धी तप कहा जाता है।"},{"c":17,"v":15,"sp":"krishna","sa":"अनुद्वेगकरं वाक्यं सत्यं प्रियहितं च यत् ।\nस्वाध्यायाभ्यसनं चैव वाङ्मयं तप उच्यते ॥","tr":"anudvegakaraṃ vākyaṃ satyaṃ priyahitaṃ ca yat\nsvādhyāyābhyasanaṃ caiva vāṅmayaṃ tapa ucyate","gs":"અનુદ્વેગકરં વાક્યં સત્યં પ્રિયહિતં ચ યત્ ।\nસ્વાધ્યાયાભ્યસનં ચૈવ વાઙ્મયં તપ ઉચ્યતે ॥","en":"Speech that causes no excitement, is truthful, pleasant, and beneficial; the practice of studying the Vedas is called austerity of speech.","hi":"उद्वेग न करनेवाला, सत्य, प्रिय, हितकारक भाषण तथा स्वाध्याय और अभ्यास करना -- यह वाणी-सम्बन्धी तप कहा जाता है।"},{"c":17,"v":16,"sp":"krishna","sa":"मनःप्रसादः सौम्यत्वं मौनमात्मविनिग्रहः ।\nभावसंशुद्धिरित्येतत्तपो मानसमुच्यते ॥","tr":"manaḥprasādaḥ saumyatvaṃ maunamātmavinigrahaḥ\nbhāvasaṃśuddhirityetattapo mānasamucyate","gs":"મનઃપ્રસાદઃ સૌમ્યત્વં મૌનમાત્મવિનિગ્રહઃ ।\nભાવસંશુદ્ધિરિત્યેતત્તપો માનસમુચ્યતે ॥","en":"Serenity of mind, good-heartedness, self-control, and purity of nature—this is called mental austerity.","hi":"मनकी प्रसन्नता, सौम्य भाव, मननशीलता, मनका निग्रह और भावोंकी शुद्धि -- इस तरह यह मन-सम्बन्धी तप कहा जाता है।"},{"c":17,"v":17,"sp":"krishna","sa":"श्रद्धया परया तप्तं तपस्तत्ित्रविधं नरैः ।\nअफलाकाङ्क्षिभिर्युक्तैः सात्त्विकं परिचक्षते ॥","tr":"śraddhayā parayā taptaṃ tapastatitravidhaṃ naraiḥ\naphalākāṅkṣibhiryuktaiḥ sāttvikaṃ paricakṣate","gs":"શ્રદ્ધયા પરયા તપ્તં તપસ્તત્િત્રવિધં નરૈઃ ।\nઅફલાકાઙ્ક્ષિભિર્યુક્તૈઃ સાત્ત્વિકં પરિચક્ષતે ॥","en":"This threefold austerity, practiced by steadfast men, with the utmost faith, desiring no reward, is called Sattvic.","hi":"परम श्रद्धासे युक्त फलेच्छारहित मनुष्योंके द्वारा तीन प्रकार-(शरीर, वाणी और मन-) का तप किया जाता है, उसको सात्त्विक कहते हैं।"},{"c":17,"v":18,"sp":"krishna","sa":"सत्कारमानपूजार्थं तपो दम्भेन चैव यत् ।\nक्रियते तदिह प्रोक्तं राजसं चलमध्रुवम् ॥","tr":"satkāramānapūjārthaṃ tapo dambhena caiva yat\nkriyate tadiha proktaṃ rājasaṃ calamadhruvam","gs":"સત્કારમાનપૂજાર્થં તપો દમ્ભેન ચૈવ યત્ ।\nક્રિયતે તદિહ પ્રોક્તં રાજસં ચલમધ્રુવમ્ ॥","en":"The austerity that is practiced with the aim of gaining good reception, honor, and worship, and with hypocrisy, is said to be Rajasic, unstable, and transient.","hi":"जो तप सत्कार, मान और पूजाके लिये तथा दिखानेके भावसे किया जाता है, वह इस लोकमें अनिश्चित और नाशवान् फल देनेवाला तप राजस कहा गया है।"},{"c":17,"v":19,"sp":"krishna","sa":"मूढग्राहेणात्मनो यत्पीडया क्रियते तपः ।\nपरस्योत्सादनार्थं वा तत्तामसमुदाहृतम् ॥","tr":"mūḍhagrāheṇātmano yatpīḍayā kriyate tapaḥ\nparasyotsādanārthaṃ vā tattāmasamudāhṛtam","gs":"મૂઢગ્રાહેણાત્મનો યત્પીડયા ક્રિયતે તપઃ ।\nપરસ્યોત્સાદનાર્થં વા તત્તામસમુદાહૃતમ્ ॥","en":"That austerity which is practised out of a foolish notion, with self-torture, or for the purpose of destroying another, is declared to be of the Tamasic nature.","hi":"जो तप मूढ़तापूर्वक हठसे अपनेको पीड़ा देकर अथवा दूसरोंको कष्ट देनेके लिये किया जाता है, वह तप तामस कहा गया है।"},{"c":17,"v":20,"sp":"krishna","sa":"दातव्यमिति यद्दानं दीयतेऽनुपकारिणे ।\nदेशे काले च पात्रे च तद्दानं सात्त्विकं स्मृतम् ॥","tr":"dātavyamiti yaddānaṃ dīyate'nupakāriṇe\ndeśe kāle ca pātre ca taddānaṃ sāttvikaṃ smṛtam","gs":"દાતવ્યમિતિ યદ્દાનં દીયતેઽનુપકારિણે ।\nદેશે કાલે ચ પાત્રે ચ તદ્દાનં સાત્ત્વિકં સ્મૃતમ્ ॥","en":"That gift which is given to one who does nothing in return, knowing it to be a duty to give in a suitable place and time to a worthy person, is held to be Sattvic.","hi":"दान देना कर्तव्य है -- ऐसे भावसे जो दान देश, काल और पात्रके प्राप्त होनेपर अनुपकारीको दिया जाता है, वह दान सात्त्विक कहा गया है।"},{"c":17,"v":21,"sp":"krishna","sa":"यत्तु प्रत्युपकारार्थं फलमुद्दिश्य वा पुनः ।\nदीयते च परिक्लिष्टं तद्दानं राजसं स्मृतम् ॥","tr":"yattu pratyupakārārthaṃ phalamuddiśya vā punaḥ\ndīyate ca parikliṣṭaṃ taddānaṃ rājasaṃ smṛtam","gs":"યત્તુ પ્રત્યુપકારાર્થં ફલમુદ્દિશ્ય વા પુનઃ ।\nદીયતે ચ પરિક્લિષ્ટં તદ્દાનં રાજસં સ્મૃતમ્ ॥","en":"And, that gift which is given with the intention of receiving something in return, or expecting a reward, or begrudgingly, is considered to be Rajasic.","hi":"किन्तु जो दान प्रत्युपकारके लिये अथवा फलप्राप्तिका उद्देश्य बनाकर फिर क्लेशपूर्वक दिया जाता है, वह दान राजस कहा जाता है।"},{"c":17,"v":22,"sp":"krishna","sa":"अदेशकाले यद्दानमपात्रेभ्यश्च दीयते ।\nअसत्कृतमवज्ञातं तत्तामसमुदाहृतम् ॥","tr":"adeśakāle yaddānamapātrebhyaśca dīyate\nasatkṛtamavajñātaṃ tattāmasamudāhṛtam","gs":"અદેશકાલે યદ્દાનમપાત્રેભ્યશ્ચ દીયતે ।\nઅસત્કૃતમવજ્ઞાતં તત્તામસમુદાહૃતમ્ ॥","en":"The gift that is given in the wrong place and at the wrong time, to unworthy persons, without respect or with insult, is declared to be of a Tamasic nature.","hi":"जो दान बिना सत्कारके तथा अवज्ञापूर्वक अयोग्य देश और कालमें कुपात्रको दिया जाता है, वह दान तामस कहा गया है।"},{"c":17,"v":23,"sp":"krishna","sa":"तत्सदिति निर्देशो ब्रह्मणस्त्रिविधः स्मृतः ।\nब्राह्मणास्तेन वेदाश्च यज्ञाश्च विहिताः पुरा ॥","tr":"tatsaditi nirdeśo brahmaṇastrividhaḥ smṛtaḥ\nbrāhmaṇāstena vedāśca yajñāśca vihitāḥ purā","gs":"તત્સદિતિ નિર્દેશો બ્રહ્મણસ્ત્રિવિધઃ સ્મૃતઃ ।\nબ્રાહ્મણાસ્તેન વેદાશ્ચ યજ્ઞાશ્ચ વિહિતાઃ પુરા ॥","en":"\"Om Tat Sat\": This has been declared to be the triple designation of Brahman. By that, the Brahmanas, the Vedas, and the sacrifices were created formerly.","hi":"ऊँ, तत् और सत् -- इन तीनों नामोंसे जिस परमात्माका निर्देश किया गया है, उसी परमात्माने सृष्टिके आदिमें वेदों, ब्राह्मणों और यज्ञोंकी रचना की है।"},{"c":17,"v":24,"sp":"krishna","sa":"तस्मादोमित्युदाहृत्य यज्ञदानतपःक्रियाः ।\nप्रवर्तन्ते विधानोक्ताः सततं ब्रह्मवादिनाम् ॥","tr":"tasmādomityudāhṛtya yajñadānatapaḥkriyāḥ\npravartante vidhānoktāḥ satataṃ brahmavādinām","gs":"તસ્માદોમિત્યુદાહૃત્ય યજ્ઞદાનતપઃક્રિયાઃ ।\nપ્રવર્તન્તે વિધાનોક્તાઃ સતતં બ્રહ્મવાદિનામ્ ॥","en":"Therefore, with the utterance of \"Om,\" the acts of sacrifice, gift, and austerity, as enjoined in the scriptures, are always begun by the students of Brahman.","hi":"इसलिये वैदिक सिद्धान्तोंको माननेवाले पुरुषोंकी शास्त्रविधिसे नियत यज्ञ, दान और तपरूप क्रियाएँ सदा 'ऊँ' इस परमात्माके नामका उच्चारण करके ही आरम्भ होती हैं।"},{"c":17,"v":25,"sp":"krishna","sa":"तदित्यनभिसन्धाय फलं यज्ञतपःक्रियाः ।\nदानक्रियाश्च विविधाः क्रियन्ते मोक्षकाङ्क्षि ॥","tr":"tadityanabhisandhāya phalaṃ yajñatapaḥkriyāḥ\ndānakriyāśca vividhāḥ kriyante mokṣakāṅkṣi","gs":"તદિત્યનભિસન્ધાય ફલં યજ્ઞતપઃક્રિયાઃ ।\nદાનક્રિયાશ્ચ વિવિધાઃ ક્રિયન્તે મોક્ષકાઙ્ક્ષિ ॥","en":"Uttering \"Tat,\" without aiming for the fruits, are the acts of sacrifice, austerity, and the various acts of gifts performed by those seeking liberation.","hi":"'तत्' नामसे कहे जानेवाले परमात्माके लिये ही सब कुछ है -- ऐसा मानकर मुक्ति चाहनेवाले मनुष्योंद्वारा फलकी इच्छासे रहित होकर अनेक प्रकारकी यज्ञ और तपरूप क्रियाएँ तथा दानरूप क्रियाएँ की जाती हैं।"},{"c":17,"v":26,"sp":"krishna","sa":"सद्भावे साधुभावे च सदित्येतत्प्रयुज्यते ।\nप्रशस्ते कर्मणि तथा सच्छब्दः पार्थ युज्यते ॥","tr":"sadbhāve sādhubhāve ca sadityetatprayujyate\npraśaste karmaṇi tathā sacchabdaḥ pārtha yujyate","gs":"સદ્ભાવે સાધુભાવે ચ સદિત્યેતત્પ્રયુજ્યતે ।\nપ્રશસ્તે કર્મણિ તથા સચ્છબ્દઃ પાર્થ યુજ્યતે ॥","en":"The word \"Sat\" is used to refer to reality and goodness; likewise, O Arjuna, the word \"Sat\" is used to refer to an auspicious act.","hi":"हे पार्थ ! परमात्माके 'सत्'--इस नामका सत्तामात्रमें और श्रेष्ठ भावमें प्रयोग किया जाता है तथा प्रशंसनीय कर्मके साथ 'सत्' शब्द जोड़ा जाता है।"},{"c":17,"v":27,"sp":"krishna","sa":"यज्ञे तपसि दाने च स्थितिः सदिति चोच्यते ।\nकर्म चैव तदर्थीयं सदित्येवाभिधीयते ॥","tr":"yajñe tapasi dāne ca sthitiḥ saditi cocyate\nkarma caiva tadarthīyaṃ sadityevābhidhīyate","gs":"યજ્ઞે તપસિ દાને ચ સ્થિતિઃ સદિતિ ચોચ્યતે ।\nકર્મ ચૈવ તદર્થીયં સદિત્યેવાભિધીયતે ॥","en":"Steadfastness in sacrifice, austerity, and gift is also called 'Sat', and action in connection with these, or for the sake of the Supreme, is also called 'Sat'.","hi":"यज्ञ, तप और दानरूप क्रियामें जो स्थिति (निष्ठा) है, वह भी 'सत्' -- ऐसे कही जाती है और उस परमात्माके निमित्त किया जानेवाला कर्म भी 'सत्' -- ऐसा ही कहा जाता है।"},{"c":17,"v":28,"sp":"krishna","sa":"अश्रद्धया हुतं दत्तं तपस्तप्तं कृतं च यत् ।\nअसदित्युच्यते पार्थ न च तत्प्रेत्य नो इह ॥","tr":"aśraddhayā hutaṃ dattaṃ tapastaptaṃ kṛtaṃ ca yat\nasadityucyate pārtha na ca tatpretya no iha","gs":"અશ્રદ્ધયા હુતં દત્તં તપસ્તપ્તં કૃતં ચ યત્ ।\nઅસદિત્યુચ્યતે પાર્થ ન ચ તત્પ્રેત્ય નો ઇહ ॥","en":"Whatever is sacrificed, given, or performed, and whatever austerity is practiced without faith, it is called 'Asat', O Arjuna; it is of no value here or hereafter (after death).","hi":"हे पार्थ ! अश्रद्धासे किया हुआ हवन, दिया हुआ दान और तपा हुआ तप तथा और भी जो,कुछ किया जाय, वह सब 'असत्' -- ऐसा कहा जाता है। उसका फल न यहाँ होता है, न मरनेके बाद ही होता है अर्थात् उसका कहीं भी सत् फल नहीं होता।"},{"c":18,"v":1,"sp":"arjuna","sa":"संन्यासस्य महाबाहो तत्त्वमिच्छामि वेदितुम् ।\nत्यागस्य च हृषीकेश पृथक्केशिनिषूदन ॥","tr":"saṃnyāsasya mahābāho tattvamicchāmi veditum\ntyāgasya ca hṛṣīkeśa pṛthakkeśiniṣūdana","gs":"સંન્યાસસ્ય મહાબાહો તત્ત્વમિચ્છામિ વેદિતુમ્ ।\nત્યાગસ્ય ચ હૃષીકેશ પૃથક્કેશિનિષૂદન ॥","en":"Arjuna said, \"O mighty-armed Hrishikesa, I desire to know the essence or truth of renunciation and abandonment severally, O slayer of Kesi.\"","hi":"अर्जुन बोले -- हे महाबाहो ! हे हृषीकेश ! हे केशिनिषूदन ! मैं संन्यास और त्यागका तत्त्व अलग-अलग जानना चाहता हूँ।"},{"c":18,"v":2,"sp":"krishna","sa":"काम्यानां कर्मणां न्यासं संन्यासं कवयो विदुः ।\nसर्वकर्मफलत्यागं प्राहुस्त्यागं विचक्षणाः ॥","tr":"kāmyānāṃ karmaṇāṃ nyāsaṃ saṃnyāsaṃ kavayo viduḥ\nsarvakarmaphalatyāgaṃ prāhustyāgaṃ vicakṣaṇāḥ","gs":"કામ્યાનાં કર્મણાં ન્યાસં સંન્યાસં કવયો વિદુઃ ।\nસર્વકર્મફલત્યાગં પ્રાહુસ્ત્યાગં વિચક્ષણાઃ ॥","en":"The Blessed Lord said, \"The sages understand sannyasa to be the renunciation of action with desire; the wise declare the abandonment of the fruits of all actions to be tyaga.\"","hi":"Hindi Translation By Swami Ramsukhdas"},{"c":18,"v":3,"sp":"krishna","sa":"त्याज्यं दोषवदित्येके कर्म प्राहुर्मनीषिणः ।\nयज्ञदानतपःकर्म न त्याज्यमिति चापरे ॥","tr":"tyājyaṃ doṣavadityeke karma prāhurmanīṣiṇaḥ\nyajñadānatapaḥkarma na tyājyamiti cāpare","gs":"ત્યાજ્યં દોષવદિત્યેકે કર્મ પ્રાહુર્મનીષિણઃ ।\nયજ્ઞદાનતપઃકર્મ ન ત્યાજ્યમિતિ ચાપરે ॥","en":"Some philosophers declare that actions should be abandoned as evil; while others declare that acts of sacrifice, gift, and austerity should not be relinquished.","hi":"श्रीभगवान् बोले -- कई विद्वान् काम्य-कर्मोंके त्यागको संन्यास कहते हैं और कई विद्वान् सम्पूर्ण कर्मोंके फलके त्यागको त्याग कहते हैं। कई विद्वान् कहते हैं कि कर्मोंको दोषकी तरह छोड़ देना चाहिये और कई विद्वान् कहते हैं कि यज्ञ, दान और तप-रूप कर्मोंका त्याग नहीं करना चाहिये।"},{"c":18,"v":4,"sp":"krishna","sa":"निश्चयं श्रृणु मे तत्र त्यागे भरतसत्तम ।\nत्यागो हि पुरुषव्याघ्र त्रिविधः संप्रकीर्तितः ॥","tr":"niścayaṃ śrṛṇu me tatra tyāge bharatasattama\ntyāgo hi puruṣavyāghra trividhaḥ saṃprakīrtitaḥ","gs":"નિશ્ચયં શ્રૃણુ મે તત્ર ત્યાગે ભરતસત્તમ ।\nત્યાગો હિ પુરુષવ્યાઘ્ર ત્રિવિધઃ સંપ્રકીર્તિતઃ ॥","en":"Hear from Me the conclusion or the final truth about this abandonment, O best of the Bharatas; abandonment, indeed, O best of men, has been declared to be of three kinds.","hi":"हे भरतवंशियोंमें श्रेष्ठ अर्जुन ! तू संन्यास और त्याग -- इन दोनोंमेंसे पहले त्यागके विषयमें मेरा निश्चय सुन; क्योंकि हे पुरुषश्रेष्ठ ! त्याग तीन प्रकारका कहा गया है।"},{"c":18,"v":5,"sp":"krishna","sa":"यज्ञदानतपःकर्म न त्याज्यं कार्यमेव तत् ।\nयज्ञो दानं तपश्चैव पावनानि मनीषिणाम् ॥","tr":"yajñadānatapaḥkarma na tyājyaṃ kāryameva tat\nyajño dānaṃ tapaścaiva pāvanāni manīṣiṇām","gs":"યજ્ઞદાનતપઃકર્મ ન ત્યાજ્યં કાર્યમેવ તત્ ।\nયજ્ઞો દાનં તપશ્ચૈવ પાવનાનિ મનીષિણામ્ ॥","en":"Acts of sacrifice, gift, and austerity should not be abandoned, but should be performed; for sacrifice, gift, and austerity are the purifiers of the wise.","hi":"यज्ञ, दान और तपरूप कर्मोंका त्याग नहीं करना चाहिये, प्रत्युत उनको तो करना ही चाहिये क्योंकि यज्ञ, दान और तप -- ये तीनों ही कर्म मनीषियोंको पवित्र करनेवाले हैं।"},{"c":18,"v":6,"sp":"krishna","sa":"एतान्यपि तु कर्माणि सङ्गं त्यक्त्वा फलानि च ।\nकर्तव्यानीति मे पार्थ निश्िचतं मतमुत्तमम् ॥","tr":"etānyapi tu karmāṇi saṅgaṃ tyaktvā phalāni ca\nkartavyānīti me pārtha niśicataṃ matamuttamam","gs":"એતાન્યપિ તુ કર્માણિ સઙ્ગં ત્યક્ત્વા ફલાનિ ચ ।\nકર્તવ્યાનીતિ મે પાર્થ નિશ્િચતં મતમુત્તમમ્ ॥","en":"But even these actions should be performed, leaving aside attachment and the desire for rewards, O Arjuna; this is my certain and most assured conviction.","hi":"हे पार्थ ! (पूर्वोक्त यज्ञ, दान और तप -- ) इन कर्मोंको तथा दूसरे भी कर्मोंको आसक्ति और फलोंका त्याग करके करना चाहिये -- यह मेरा निश्चित किया हुआ उत्तम मत है।"},{"c":18,"v":7,"sp":"krishna","sa":"नियतस्य तु संन्यासः कर्मणो नोपपद्यते ।\nमोहात्तस्य परित्यागस्तामसः परिकीर्तितः ॥","tr":"niyatasya tu saṃnyāsaḥ karmaṇo nopapadyate\nmohāttasya parityāgastāmasaḥ parikīrtitaḥ","gs":"નિયતસ્ય તુ સંન્યાસઃ કર્મણો નોપપદ્યતે ।\nમોહાત્તસ્ય પરિત્યાગસ્તામસઃ પરિકીર્તિતઃ ॥","en":"Verily, the renunciation of obligatory action is not proper; the abandonment of the same out of delusion is declared to be Tamasic.","hi":"नियत कर्मका तो त्याग करना उचित नहीं है। उसका मोहपूर्वक त्याग करना तामस कहा गया है।"},{"c":18,"v":8,"sp":"krishna","sa":"दुःखमित्येव यत्कर्म कायक्लेशभयात्त्यजेत् ।\nस कृत्वा राजसं त्यागं नैव त्यागफलं लभेत् ॥","tr":"duḥkhamityeva yatkarma kāyakleśabhayāttyajet\nsa kṛtvā rājasaṃ tyāgaṃ naiva tyāgaphalaṃ labhet","gs":"દુઃખમિત્યેવ યત્કર્મ કાયક્લેશભયાત્ત્યજેત્ ।\nસ કૃત્વા રાજસં ત્યાગં નૈવ ત્યાગફલં લભેત્ ॥","en":"He who abandons action out of fear of bodily trouble (because it is painful), does not obtain the merit of renunciation by performing such Rajasic renunciation.","hi":"जो कुछ कर्म है, वह दुःखरूप ही है -- ऐसा समझकर कोई शारीरिक क्लेशके भयसे उसका त्याग कर दे, तो वह राजस त्याग करके भी त्यागके फलको नहीं पाता।"},{"c":18,"v":9,"sp":"krishna","sa":"कार्यमित्येव यत्कर्म नियतं क्रियतेऽर्जुन ।\nसङ्गं त्यक्त्वा फलं चैव स त्यागः सात्त्विको मतः ॥","tr":"kāryamityeva yatkarma niyataṃ kriyate'rjuna\nsaṅgaṃ tyaktvā phalaṃ caiva sa tyāgaḥ sāttviko mataḥ","gs":"કાર્યમિત્યેવ યત્કર્મ નિયતં ક્રિયતેઽર્જુન ।\nસઙ્ગં ત્યક્ત્વા ફલં ચૈવ સ ત્યાગઃ સાત્ત્વિકો મતઃ ॥","en":"Whatever obligatory action is done, O Arjuna, merely because it ought to be done, abandoning attachment and also the desire for reward, that renunciation is regarded as sattvic (pure).","hi":"हे अर्जुन ! 'केवल कर्तव्यमात्र करना है' -- ऐसा समझकर जो नियत कर्म आसक्ति और फलका त्याग करके किया जाता है, वही सात्त्विक त्याग माना गया है।"},{"c":18,"v":10,"sp":"krishna","sa":"न द्वेष्ट्यकुशलं कर्म कुशले नानुषज्जते ।\nत्यागी सत्त्वसमाविष्टो मेधावी छिन्नसंशयः ॥","tr":"na dveṣṭyakuśalaṃ karma kuśale nānuṣajjate\ntyāgī sattvasamāviṣṭo medhāvī chinnasaṃśayaḥ","gs":"ન દ્વેષ્ટ્યકુશલં કર્મ કુશલે નાનુષજ્જતે ।\nત્યાગી સત્ત્વસમાવિષ્ટો મેધાવી છિન્નસંશયઃ ॥","en":"The man of renunciation, pervaded by purity, intelligent, and with his doubts cut asunder, does not hate an unpleasant task nor is he attached to a pleasant one.","hi":"जो अकुशल कर्मसे द्वेष नहीं करता और कुशल कर्ममें आसक्त नहीं होता, वह त्यागी, बुद्धिमान्, सन्देहरहित और अपने स्वरूपमें स्थित है।"},{"c":18,"v":11,"sp":"krishna","sa":"न हि देहभृता शक्यं त्यक्तुं कर्माण्यशेषतः ।\nयस्तु कर्मफलत्यागी स त्यागीत्यभिधीयते ॥","tr":"na hi dehabhṛtā śakyaṃ tyaktuṃ karmāṇyaśeṣataḥ\nyastu karmaphalatyāgī sa tyāgītyabhidhīyate","gs":"ન હિ દેહભૃતા શક્યં ત્યક્તું કર્માણ્યશેષતઃ ।\nયસ્તુ કર્મફલત્યાગી સ ત્યાગીત્યભિધીયતે ॥","en":"Indeed, it is not possible for an embodied being to completely abandon actions; however, he who relinquishes the rewards of actions is truly called a man of renunciation.","hi":"कारण कि देहधारी मनुष्यके द्वारा सम्पूर्ण कर्मोंका त्याग करना सम्भव नहीं है। इसलिये जो कर्मफलका त्यागी है, वही त्यागी है -- ऐसा कहा जाता है।"},{"c":18,"v":12,"sp":"krishna","sa":"अनिष्टमिष्टं मिश्रं च त्रिविधं कर्मणः फलम् ।\nभवत्यत्यागिनां प्रेत्य न तु संन्यासिनां क्वचित् ॥","tr":"aniṣṭamiṣṭaṃ miśraṃ ca trividhaṃ karmaṇaḥ phalam\nbhavatyatyāgināṃ pretya na tu saṃnyāsināṃ kvacit","gs":"અનિષ્ટમિષ્ટં મિશ્રં ચ ત્રિવિધં કર્મણઃ ફલમ્ ।\nભવત્યત્યાગિનાં પ્રેત્ય ન તુ સંન્યાસિનાં ક્વચિત્ ॥","en":"The threefold fruit of action (evil, good, and mixed) accrues after death to those who do not abandon it, but never to those who do.","hi":"कर्मफलका त्याग न करनेवाले मनुष्योंको कर्मोंका इष्ट, अनिष्ट और मिश्रित -- ऐसे तीन प्रकारका फल मरनेके बाद भी होता है; परन्तु कर्मफलका त्याग करनेवालोंको कहीं भी नहीं होता।"},{"c":18,"v":13,"sp":"krishna","sa":"पञ्चैतानि महाबाहो कारणानि निबोध मे ।\nसांख्ये कृतान्ते प्रोक्तानि सिद्धये सर्वकर्मणाम् ॥","tr":"pañcaitāni mahābāho kāraṇāni nibodha me\nsāṃkhye kṛtānte proktāni siddhaye sarvakarmaṇām","gs":"પઞ્ચૈતાનિ મહાબાહો કારણાનિ નિબોધ મે ।\nસાંખ્યે કૃતાન્તે પ્રોક્તાનિ સિદ્ધયે સર્વકર્મણામ્ ॥","en":"Learn from Me, O mighty-armed Arjuna, these five causes, as declared in the Sankhya system, for the accomplishment of all actions.","hi":"हे महाबाहो ! कर्मोंका अन्त करनेवाले सांख्यसिद्धान्तमें सम्पूर्ण कर्मोंकी सिद्धिके लिये ये पाँच कारण बताये गये हैं, इनको तू मेरेसे समझ।"},{"c":18,"v":14,"sp":"krishna","sa":"अधिष्ठानं तथा कर्ता करणं च पृथग्विधम् ।\nविविधाश्च पृथक्चेष्टा दैवं चैवात्र पञ्चमम् ॥","tr":"adhiṣṭhānaṃ tathā kartā karaṇaṃ ca pṛthagvidham\nvividhāśca pṛthakceṣṭā daivaṃ caivātra pañcamam","gs":"અધિષ્ઠાનં તથા કર્તા કરણં ચ પૃથગ્વિધમ્ ।\nવિવિધાશ્ચ પૃથક્ચેષ્ટા દૈવં ચૈવાત્ર પઞ્ચમમ્ ॥","en":"The body, the doer, the various senses, the different functions of various kinds, and the presiding deity—the fifth.","hi":"इसमें (कर्मोंकी सिद्धिमें) अधिष्ठान तथा कर्ता और अनेक प्रकारके करण एवं विविध प्रकारकी अलग-अलग चेष्टाएँ और वैसे ही पाँचवाँ कारण दैव (संस्कार) है।"},{"c":18,"v":15,"sp":"krishna","sa":"शरीरवाङ्मनोभिर्यत्कर्म प्रारभते नरः ।\nन्याय्यं वा विपरीतं वा पञ्चैते तस्य हेतवः ॥","tr":"śarīravāṅmanobhiryatkarma prārabhate naraḥ\nnyāyyaṃ vā viparītaṃ vā pañcaite tasya hetavaḥ","gs":"શરીરવાઙ્મનોભિર્યત્કર્મ પ્રારભતે નરઃ ।\nન્યાય્યં વા વિપરીતં વા પઞ્ચૈતે તસ્ય હેતવઃ ॥","en":"Whatever action a person performs with their body, speech, and mind, whether right or wrong, these five are its causes.","hi":"मनुष्य, शरीर वाणी और मनके द्वारा शास्त्रविहित अथवा शास्त्रविरुद्ध जो कुछ भी कर्म आरम्भ करता है, उसके ये (पूर्वोक्त) पाँचों हेतु होते हैं।"},{"c":18,"v":16,"sp":"krishna","sa":"तत्रैवं सति कर्तारमात्मानं केवलं तु यः ।\nपश्यत्यकृतबुद्धित्वान्न स पश्यति दुर्मतिः ॥","tr":"tatraivaṃ sati kartāramātmānaṃ kevalaṃ tu yaḥ\npaśyatyakṛtabuddhitvānna sa paśyati durmatiḥ","gs":"તત્રૈવં સતિ કર્તારમાત્માનં કેવલં તુ યઃ ।\nપશ્યત્યકૃતબુદ્ધિત્વાન્ન સ પશ્યતિ દુર્મતિઃ ॥","en":"Now, such being the case, verily he who, owing to an untrained understanding, looks upon his Self, which is isolated, as the agent, he of perverted intelligence does not see.","hi":"परन्तु ऐसे पाँच हेतुओंके होनेपर भी जो उस (कर्मोंके) विषयमें केवल (शुद्ध) आत्माको कर्ता मानता है, वह दुर्मति ठीक नहीं समझता; क्योंकि उसकी बुद्धि शुद्ध नहीं है।"},{"c":18,"v":17,"sp":"krishna","sa":"यस्य नाहंकृतो भावो बुद्धिर्यस्य न लिप्यते ।\nहत्वापि स इमाँल्लोकान्न हन्ति न निबध्यते ॥","tr":"yasya nāhaṃkṛto bhāvo buddhiryasya na lipyate\nhatvāpi sa imā~llokānna hanti na nibadhyate","gs":"યસ્ય નાહંકૃતો ભાવો બુદ્ધિર્યસ્ય ન લિપ્યતે ।\nહત્વાપિ સ ઇમાઁલ્લોકાન્ન હન્તિ ન નિબધ્યતે ॥","en":"He who is free from the egoistic notion, whose intelligence is not tainted by good or evil, though he slays these people, he does not slay, nor is he bound by the action.","hi":"जिसका अहंकृतभाव नहीं है और जिसकी बुद्धि लिप्त नहीं होती, वह इन सम्पूर्ण प्राणियोंको मारकर भी न मारता है और न बँधता है।"},{"c":18,"v":18,"sp":"krishna","sa":"ज्ञानं ज्ञेयं परिज्ञाता त्रिविधा कर्मचोदना ।\nकरणं कर्म कर्तेति त्रिविधः कर्मसंग्रहः ॥","tr":"jñānaṃ jñeyaṃ parijñātā trividhā karmacodanā\nkaraṇaṃ karma karteti trividhaḥ karmasaṃgrahaḥ","gs":"જ્ઞાનં જ્ઞેયં પરિજ્ઞાતા ત્રિવિધા કર્મચોદના ।\nકરણં કર્મ કર્તેતિ ત્રિવિધઃ કર્મસંગ્રહઃ ॥","en":"Knowledge, the knowable, and the knower form the threefold impulse for action; the organ, the action, and the agent form the threefold basis of action.","hi":"ज्ञान, ज्ञेय और परिज्ञाता -- इन तीनोंसे कर्मप्रेरणा होती है तथा करण, कर्म और कर्ता -- इन तीनोंसे कर्मसंग्रह होता है।"},{"c":18,"v":19,"sp":"krishna","sa":"ज्ञानं कर्म च कर्ता च त्रिधैव गुणभेदतः ।\nप्रोच्यते गुणसंख्याने यथावच्छृणु तान्यपि ॥","tr":"jñānaṃ karma ca kartā ca tridhaiva guṇabhedataḥ\nprocyate guṇasaṃkhyāne yathāvacchṛṇu tānyapi","gs":"જ્ઞાનં કર્મ ચ કર્તા ચ ત્રિધૈવ ગુણભેદતઃ ।\nપ્રોચ્યતે ગુણસંખ્યાને યથાવચ્છૃણુ તાન્યપિ ॥","en":"Knowledge, action, and actor are declared in the science of the Gunas (Sankhya philosophy) to be of three kinds only, according to the distinction of the Gunas. Of these, hear duly.","hi":"गुणसंख्यान (गुणोंके सम्बन्धसे प्रत्येक पदार्थके भिन्न-भिन्न भेदोंकी गणना करनेवाले) शास्त्रमें गुणोंके भेदसे ज्ञान और कर्म तथा कर्ता तीन-तीन प्रकारसे ही कहे जाते हैं, उनको भी तुम यथार्थरूपसे सुनो।"},{"c":18,"v":20,"sp":"krishna","sa":"सर्वभूतेषु येनैकं भावमव्ययमीक्षते ।\nअविभक्तं विभक्तेषु तज्ज्ञानं विद्धि सात्त्विकम् ॥","tr":"sarvabhūteṣu yenaikaṃ bhāvamavyayamīkṣate\navibhaktaṃ vibhakteṣu tajjñānaṃ viddhi sāttvikam","gs":"સર્વભૂતેષુ યેનૈકં ભાવમવ્યયમીક્ષતે ।\nઅવિભક્તં વિભક્તેષુ તજ્જ્ઞાનં વિદ્ધિ સાત્ત્વિકમ્ ॥","en":"That by which one sees the indestructible Reality in all beings, not separate in any of them—know that knowledge to be Sattvic.","hi":"जिस ज्ञानके द्वारा साधक सम्पूर्ण विभक्त प्राणियोंमें विभागरहित एक अविनाशी भाव-(सत्ता-) को देखता है, उस ज्ञानको तुम सात्त्विक समझो।"},{"c":18,"v":21,"sp":"krishna","sa":"पृथक्त्वेन तु यज्ज्ञानं नानाभावान्पृथग्विधान् ।\nवेत्ति सर्वेषु भूतेषु तज्ज्ञानं विद्धि राजसम् ॥","tr":"pṛthaktvena tu yajjñānaṃ nānābhāvānpṛthagvidhān\nvetti sarveṣu bhūteṣu tajjñānaṃ viddhi rājasam","gs":"પૃથક્ત્વેન તુ યજ્જ્ઞાનં નાનાભાવાન્પૃથગ્વિધાન્ ।\nવેત્તિ સર્વેષુ ભૂતેષુ તજ્જ્ઞાનં વિદ્ધિ રાજસમ્ ॥","en":"But that knowledge which sees in all beings various entities of distinct kinds as being distinct from one another, know thou that knowledge to be Rajasic.","hi":"परन्तु जो ज्ञान अर्थात् जिस ज्ञानके द्वारा मनुष्य सम्पूर्ण प्राणियोंमें अलग-अलग अनेक भावोंको अलग-अलग रूपसे जानता है, उस ज्ञानको तुम राजस समझो।"},{"c":18,"v":22,"sp":"krishna","sa":"यत्तु कृत्स्नवदेकस्मिन्कार्ये सक्तमहैतुकम् ।\nअतत्त्वार्थवदल्पं च तत्तामसमुदाहृतम् ॥","tr":"yattu kṛtsnavadekasminkārye saktamahaitukam\natattvārthavadalpaṃ ca tattāmasamudāhṛtam","gs":"યત્તુ કૃત્સ્નવદેકસ્મિન્કાર્યે સક્તમહૈતુકમ્ ।\nઅતત્ત્વાર્થવદલ્પં ચ તત્તામસમુદાહૃતમ્ ॥","en":"But that which clings to one single effect as if it were the whole, without reason, without any foundation in Truth, and is trivial—that is declared to be Tamasic.","hi":"किंतु जो (ज्ञान) एक कार्यरूप शरीरमें ही सम्पूर्णके तरह आसक्त है तथा जो युक्तिरहित, वास्तविक ज्ञानसे रहित और तुच्छ है, वह तामस कहा गया है।"},{"c":18,"v":23,"sp":"krishna","sa":"नियतं सङ्गरहितमरागद्वेषतः कृतम् ।\nअफलप्रेप्सुना कर्म यत्तत्सात्त्विकमुच्यते ॥","tr":"niyataṃ saṅgarahitamarāgadveṣataḥ kṛtam\naphalaprepsunā karma yattatsāttvikamucyate","gs":"નિયતં સઙ્ગરહિતમરાગદ્વેષતઃ કૃતમ્ ।\nઅફલપ્રેપ્સુના કર્મ યત્તત્સાત્ત્વિકમુચ્યતે ॥","en":"An action that is ordained, free from attachment, done without love or hatred, and without desire for reward is declared to be Sattvic.","hi":"जो कर्म शास्त्रविधिसे नियत किया हुआ और कर्तृत्वाभिमानसे रहित हो तथा फलेच्छारहित मनुष्यके द्वारा बिना राग-द्वेषके किया हुआ हो, वह सात्त्विक कहा जाता है।"},{"c":18,"v":24,"sp":"krishna","sa":"यत्तु कामेप्सुना कर्म साहङ्कारेण वा पुनः ।\nक्रियते बहुलायासं तद्राजसमुदाहृतम् ॥","tr":"yattu kāmepsunā karma sāhaṅkāreṇa vā punaḥ\nkriyate bahulāyāsaṃ tadrājasamudāhṛtam","gs":"યત્તુ કામેપ્સુના કર્મ સાહઙ્કારેણ વા પુનઃ ।\nક્રિયતે બહુલાયાસં તદ્રાજસમુદાહૃતમ્ ॥","en":"But that action which is done by one longing for the fulfillment of desires or gain with egotism or with much effort is declared to be Rajasic (passionate).","hi":"परन्तु जो कर्म भोगोंको चाहनेवाले मनुष्यके द्वारा अहंकार अथवा परिश्रमपूर्वक किया जाता है, वह राजस कहा गया है।"},{"c":18,"v":25,"sp":"krishna","sa":"अनुबन्धं क्षयं हिंसामनपेक्ष्य च पौरुषम् ।\nमोहादारभ्यते कर्म यत्तत्तामसमुच्यते ॥","tr":"anubandhaṃ kṣayaṃ hiṃsāmanapekṣya ca pauruṣam\nmohādārabhyate karma yattattāmasamucyate","gs":"અનુબન્ધં ક્ષયં હિંસામનપેક્ષ્ય ચ પૌરુષમ્ ।\nમોહાદારભ્યતે કર્મ યત્તત્તામસમુચ્યતે ॥","en":"That action which is undertaken from delusion, without regard for the consequences, loss, injury, and one's own ability, is declared to be Tamasic (dark).","hi":"जो कर्म परिणाम, हानि, हिंसा और सामर्थ्यको न देखकर मोहपूर्वक आरम्भ किया जाता है, वह तामस कहा जाता है।"},{"c":18,"v":26,"sp":"krishna","sa":"मुक्तसङ्गोऽनहंवादी धृत्युत्साहसमन्वितः ।\nसिद्ध्यसिद्ध्योर्निर्विकारः कर्ता सात्त्विक उच्यते ॥","tr":"muktasaṅgo'nahaṃvādī dhṛtyutsāhasamanvitaḥ\nsiddhyasiddhyornirvikāraḥ kartā sāttvika ucyate","gs":"મુક્તસઙ્ગોઽનહંવાદી ધૃત્યુત્સાહસમન્વિતઃ ।\nસિદ્ધ્યસિદ્ધ્યોર્નિર્વિકારઃ કર્તા સાત્ત્વિક ઉચ્યતે ॥","en":"An agent who is free from attachment, non-egoistic, endowed with firmness and enthusiasm, and unaffected by success or failure, is considered to be of a Sattvic (pure) nature.","hi":"जो कर्ता रागरहित, अनहंवादी, धैर्य और उत्साहयुक्त तथा सिद्धि और असिद्धिमें निर्विकार है, वह सात्त्विक कहा जाता है।"},{"c":18,"v":27,"sp":"krishna","sa":"रागी कर्मफलप्रेप्सुर्लुब्धो हिंसात्मकोऽशुचिः ।\nहर्षशोकान्वितः कर्ता राजसः परिकीर्तितः ॥","tr":"rāgī karmaphalaprepsurlubdho hiṃsātmako'śuciḥ\nharṣaśokānvitaḥ kartā rājasaḥ parikīrtitaḥ","gs":"રાગી કર્મફલપ્રેપ્સુર્લુબ્ધો હિંસાત્મકોઽશુચિઃ ।\nહર્ષશોકાન્વિતઃ કર્તા રાજસઃ પરિકીર્તિતઃ ॥","en":"Passionate, desiring to obtain the reward of their actions, greedy, cruel, impure, moved by joy and sorrow, such an agent is said to be Rajasic.","hi":"जो कर्ता रागी, कर्मफलकी इच्छावाला, लोभी, हिंसाके स्वभाववाला, अशुद्ध और हर्षशोकसे युक्त है, वह राजस कहा गया है।"},{"c":18,"v":28,"sp":"krishna","sa":"अयुक्तः प्राकृतः स्तब्धः शठो नैष्कृतिकोऽलसः ।\nविषादी दीर्घसूत्री च कर्ता तामस उच्यते ॥","tr":"ayuktaḥ prākṛtaḥ stabdhaḥ śaṭho naiṣkṛtiko'lasaḥ\nviṣādī dīrghasūtrī ca kartā tāmasa ucyate","gs":"અયુક્તઃ પ્રાકૃતઃ સ્તબ્ધઃ શઠો નૈષ્કૃતિકોઽલસઃ ।\nવિષાદી દીર્ઘસૂત્રી ચ કર્તા તામસ ઉચ્યતે ॥","en":"Unsteady, vulgar, inflexible, deceitful, malicious, lazy, despondent, and procrastinating—such an agent is called Tamasic.","hi":"जो कर्ता असावधान, अशिक्षित, ऐंठ-अकड़वाला, जिद्दी, उपकारीका अपकार करनेवाला, आलसी, विषादी और दीर्घसूत्री है, वह तामस कहा जाता है।"},{"c":18,"v":29,"sp":"krishna","sa":"बुद्धेर्भेदं धृतेश्चैव गुणतस्त्रिविधं श्रृणु ।\nप्रोच्यमानमशेषेण पृथक्त्वेन धनञ्जय ॥","tr":"buddherbhedaṃ dhṛteścaiva guṇatastrividhaṃ śrṛṇu\nprocyamānamaśeṣeṇa pṛthaktvena dhanañjaya","gs":"બુદ્ધેર્ભેદં ધૃતેશ્ચૈવ ગુણતસ્ત્રિવિધં શ્રૃણુ ।\nપ્રોચ્યમાનમશેષેણ પૃથક્ત્વેન ધનઞ્જય ॥","en":"Hear thou the threefold division of intellect and firmness, according to the Gunas, as I declare them fully and distinctly, O Arjuna.","hi":"हे धनञ्जय ! अब तू गुणोंके अनुसार बुद्धि और धृतिके भी तीन प्रकारके भेद अलग-अलगरूपसे सुन, जो कि मेरे द्वारा पूर्णरूपसे कहे जा रहे हैं।"},{"c":18,"v":30,"sp":"krishna","sa":"प्रवृत्तिं च निवृत्तिं च कार्याकार्ये भयाभये ।\nबन्धं मोक्षं च या वेत्ति बुद्धिः सा पार्थ सात्त्विकी ॥","tr":"pravṛttiṃ ca nivṛttiṃ ca kāryākārye bhayābhaye\nbandhaṃ mokṣaṃ ca yā vetti buddhiḥ sā pārtha sāttvikī","gs":"પ્રવૃત્તિં ચ નિવૃત્તિં ચ કાર્યાકાર્યે ભયાભયે ।\nબન્ધં મોક્ષં ચ યા વેત્તિ બુદ્ધિઃ સા પાર્થ સાત્ત્વિકી ॥","en":"The intellect which knows the path of work and renunciation, what should be done and what should not be done, fear and fearlessness, bondage and liberation—that intellect is Sattvic (pure), O Arjuna.","hi":"हे पृथानन्दन ! जो बुद्धि प्रवृत्ति और निवृत्तिको, कर्तव्य और अकर्तव्यको, भय और अभयको तथा बन्धन और मोक्षको जानती है, वह बुद्धि सात्त्विकी है।"},{"c":18,"v":31,"sp":"krishna","sa":"यया धर्ममधर्मं च कार्यं चाकार्यमेव च ।\nअयथावत्प्रजानाति बुद्धिः सा पार्थ राजसी ॥","tr":"yayā dharmamadharmaṃ ca kāryaṃ cākāryameva ca\nayathāvatprajānāti buddhiḥ sā pārtha rājasī","gs":"યયા ધર્મમધર્મં ચ કાર્યં ચાકાર્યમેવ ચ ।\nઅયથાવત્પ્રજાનાતિ બુદ્ધિઃ સા પાર્થ રાજસી ॥","en":"That by which one wrongly understands dharma and adharma, and also what ought to be done and what ought not to be done—that intellect, O Arjuna, is rajasic (passionate).","hi":"हे पार्थ ! मनुष्य जिसके द्वारा धर्म और अधर्मको, कर्तव्य और अकर्तव्यको भी ठीक तरहसे नहीं जानता, वह बुद्धि राजसी है।"},{"c":18,"v":32,"sp":"krishna","sa":"अधर्मं धर्ममिति या मन्यते तमसाऽऽवृता ।\nसर्वार्थान्विपरीतांश्च बुद्धिः सा पार्थ तामसी ॥","tr":"adharmaṃ dharmamiti yā manyate tamasā''vṛtā\nsarvārthānviparītāṃśca buddhiḥ sā pārtha tāmasī","gs":"અધર્મં ધર્મમિતિ યા મન્યતે તમસાઽઽવૃતા ।\nસર્વાર્થાન્વિપરીતાંશ્ચ બુદ્ધિઃ સા પાર્થ તામસી ॥","en":"That intellect, O Arjuna, which is enveloped in darkness and sees Adharma as Dharma and all things perverted, is Tamasic (dark).","hi":"हे पृथानन्दन ! तमोगुणसे घिरी हुई जो बुद्धि अधर्मको धर्म और सम्पूर्ण चीजोंको उलटा मान लेती है, वह तामसी है।"},{"c":18,"v":33,"sp":"krishna","sa":"धृत्या यया धारयते मनःप्राणेन्द्रियक्रियाः ।\nयोगेनाव्यभिचारिण्या धृतिः सा पार्थ सात्त्विकी ॥","tr":"dhṛtyā yayā dhārayate manaḥprāṇendriyakriyāḥ\nyogenāvyabhicāriṇyā dhṛtiḥ sā pārtha sāttvikī","gs":"ધૃત્યા યયા ધારયતે મનઃપ્રાણેન્દ્રિયક્રિયાઃ ।\nયોગેનાવ્યભિચારિણ્યા ધૃતિઃ સા પાર્થ સાત્ત્વિકી ॥","en":"The unwavering firmness, through which Yoga restrains the functions of the mind, life-force, and senses—that firmness, O Arjuna, is Sattvic (pure).","hi":"हे पार्थ ! समतासे युक्त जिस अव्यभिचारिणी धृतिके द्वारा मनुष्य मन, प्राण और इन्द्रियोंकी क्रियाओंको धारण करता है, वह धृति सात्त्विकी है।"},{"c":18,"v":34,"sp":"krishna","sa":"यया तु धर्मकामार्थान् धृत्या धारयतेऽर्जुन ।\nप्रसङ्गेन फलाकाङ्क्षी धृतिः सा पार्थ राजसी ॥","tr":"yayā tu dharmakāmārthān dhṛtyā dhārayate'rjuna\nprasaṅgena phalākāṅkṣī dhṛtiḥ sā pārtha rājasī","gs":"યયા તુ ધર્મકામાર્થાન્ ધૃત્યા ધારયતેઽર્જુન ।\nપ્રસઙ્ગેન ફલાકાઙ્ક્ષી ધૃતિઃ સા પાર્થ રાજસી ॥","en":"But that, O Arjuna, by which one holds fast to Dharma (duty), enjoyment of pleasures, and earning of wealth, on account of attachment and desire for reward—that firmness, O Arjuna, is Rajasic (passionate).","hi":"हे पृथानन्दन अर्जुन ! फलकी इच्छावाला मनुष्य जिस धृतिके द्वारा धर्म, काम (भोग) और अर्थको अत्यन्त आसक्तिपूर्वक धारण करता है, वह धृति राजसी है।"},{"c":18,"v":35,"sp":"krishna","sa":"यया स्वप्नं भयं शोकं विषादं मदमेव च ।\nन विमुञ्चति दुर्मेधा धृतिः सा पार्थ तामसी ॥","tr":"yayā svapnaṃ bhayaṃ śokaṃ viṣādaṃ madameva ca\nna vimuñcati durmedhā dhṛtiḥ sā pārtha tāmasī","gs":"યયા સ્વપ્નં ભયં શોકં વિષાદં મદમેવ ચ ।\nન વિમુઞ્ચતિ દુર્મેધા ધૃતિઃ સા પાર્થ તામસી ॥","en":"That firmness, O Arjuna, by which a stupid man does not abandon sleep, fear, grief, despair, and conceit, is Tamasic.","hi":"हे पार्थ ! दुष्ट बुद्धिवाला मनुष्य जिस धृतिके द्वारा निद्रा, भय, चिन्ता, दुःख और घमण्डको भी नहीं छोड़ता, वह धृति तामसी है।"},{"c":18,"v":36,"sp":"krishna","sa":"सुखं त्विदानीं त्रिविधं श्रृणु मे भरतर्षभ ।\nअभ्यासाद्रमते यत्र दुःखान्तं च निगच्छति ॥","tr":"sukhaṃ tvidānīṃ trividhaṃ śrṛṇu me bharatarṣabha\nabhyāsādramate yatra duḥkhāntaṃ ca nigacchati","gs":"સુખં ત્વિદાનીં ત્રિવિધં શ્રૃણુ મે ભરતર્ષભ ।\nઅભ્યાસાદ્રમતે યત્ર દુઃખાન્તં ચ નિગચ્છતિ ॥","en":"And now, O Arjuna, hear from Me of the threefold pleasure, in which one rejoices through practice and surely comes to the end of pain.","hi":"हे भरतवंशियोंमें श्रेष्ठ अर्जुन ! अब तीन प्रकारके सुखको भी तुम मेरेसे सुनो। जिसमें अभ्याससे रमण होता है और जिससे दुःखोंका अन्त हो जाता है, ऐसा वह परमात्मविषयक बुद्धिकी प्रसन्नतासे पैदा होनेवाला जो सुख (सांसारिक आसक्तिके कारण) आरम्भमें विषकी तरह और परिणाममें अमृतकी तरह होता है, वह सुख सात्त्विक कहा गया है।"},{"c":18,"v":37,"sp":"krishna","sa":"यत्तदग्रे विषमिव परिणामेऽमृतोपमम् ।\nतत्सुखं सात्त्विकं प्रोक्तमात्मबुद्धिप्रसादजम् ॥","tr":"yattadagre viṣamiva pariṇāme'mṛtopamam\ntatsukhaṃ sāttvikaṃ proktamātmabuddhiprasādajam","gs":"યત્તદગ્રે વિષમિવ પરિણામેઽમૃતોપમમ્ ।\nતત્સુખં સાત્ત્વિકં પ્રોક્તમાત્મબુદ્ધિપ્રસાદજમ્ ॥","en":"That which is like poison at first but in the end like nectar—that happiness is declared to be sattvic, born of the purity of one's own mind due to self-realization.","hi":"हे भरतवंशियोंमें श्रेष्ठ अर्जुन ! अब तीन प्रकारके सुखको भी तुम मेरेसे सुनो। जिसमें अभ्याससे रमण होता है और जिससे दुःखोंका अन्त हो जाता है, ऐसा वह परमात्मविषयक बुद्धिकी प्रसन्नतासे पैदा होनेवाला जो सुख (सांसारिक आसक्तिके कारण) आरम्भमें विषकी तरह और परिणाममें अमृतकी तरह होता है, वह सुख सात्त्विक कहा गया है।"},{"c":18,"v":38,"sp":"krishna","sa":"विषयेन्द्रियसंयोगाद्यत्तदग्रेऽमृतोपमम् ।\nपरिणामे विषमिव तत्सुखं राजसं स्मृतम् ॥","tr":"viṣayendriyasaṃyogādyattadagre'mṛtopamam\npariṇāme viṣamiva tatsukhaṃ rājasaṃ smṛtam","gs":"વિષયેન્દ્રિયસંયોગાદ્યત્તદગ્રેઽમૃતોપમમ્ ।\nપરિણામે વિષમિવ તત્સુખં રાજસં સ્મૃતમ્ ॥","en":"That happiness which arises from the contact of the senses with the objects, which is initially like nectar but eventually like poison, is said to be Rajasic.","hi":"जो सुख इन्द्रियों और विषयोंके संयोगसे आरम्भमें अमृतकी तरह और परिणाममें विषकी तरह होता है, वह सुख राजस कहा गया है।"},{"c":18,"v":39,"sp":"krishna","sa":"यदग्रे चानुबन्धे च सुखं मोहनमात्मनः ।\nनिद्रालस्यप्रमादोत्थं तत्तामसमुदाहृतम् ॥","tr":"yadagre cānubandhe ca sukhaṃ mohanamātmanaḥ\nnidrālasyapramādotthaṃ tattāmasamudāhṛtam","gs":"યદગ્રે ચાનુબન્ધે ચ સુખં મોહનમાત્મનઃ ।\nનિદ્રાલસ્યપ્રમાદોત્થં તત્તામસમુદાહૃતમ્ ॥","en":"That happiness which at first, as well as in the end, deludes the self, and which arises from sleep, indolence, and heedlessness—that is declared to be Tamasic.","hi":"निद्रा, आलस्य और प्रमादसे उत्पन्न होनेवाला जो सुख आरम्भमें और परिणाममें अपनेको मोहित करनेवाला है, वह सुख तामस कहा गया है।"},{"c":18,"v":40,"sp":"krishna","sa":"न तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः ।\nसत्त्वं प्रकृतिजैर्मुक्तं यदेभिः स्यात्ित्रभिर्गुणैः ॥","tr":"na tadasti pṛthivyāṃ vā divi deveṣu vā punaḥ\nsattvaṃ prakṛtijairmuktaṃ yadebhiḥ syātitrabhirguṇaiḥ","gs":"ન તદસ્તિ પૃથિવ્યાં વા દિવિ દેવેષુ વા પુનઃ ।\nસત્ત્વં પ્રકૃતિજૈર્મુક્તં યદેભિઃ સ્યાત્િત્રભિર્ગુણૈઃ ॥","en":"There is no being on earth or in heaven among the gods that is liberated from the three qualities born of Nature.","hi":"पृथ्वीमें या स्वर्गमें अथवा देवताओंमें तथा इनके सिवाय और कहीं भी वह ऐसी कोई वस्तु नहीं है, जो प्रकृतिसे उत्पन्न इन तीनों गुणोंसे रहित हो।"},{"c":18,"v":41,"sp":"krishna","sa":"ब्राह्मणक्षत्रियविशां शूद्राणां च परंतप ।\nकर्माणि प्रविभक्तानि स्वभावप्रभवैर्गुणैः ॥","tr":"brāhmaṇakṣatriyaviśāṃ śūdrāṇāṃ ca paraṃtapa\nkarmāṇi pravibhaktāni svabhāvaprabhavairguṇaiḥ","gs":"બ્રાહ્મણક્ષત્રિયવિશાં શૂદ્રાણાં ચ પરંતપ ।\nકર્માણિ પ્રવિભક્તાનિ સ્વભાવપ્રભવૈર્ગુણૈઃ ॥","en":"Of Brahmanas, Kshatriyas, Vaisyas, and Sudras, O Arjuna, the duties are distributed according to the qualities born of their own nature.","hi":"हे परंतप ! ब्राह्मण, क्षत्रिय, वैश्य और शूद्रोंके कर्म स्वभावसे उत्पन्न हुए तीनों गुणोंके द्वारा विभक्त किये गये हैं।"},{"c":18,"v":42,"sp":"krishna","sa":"शमो दमस्तपः शौचं क्षान्तिरार्जवमेव च ।\nज्ञानं विज्ञानमास्तिक्यं ब्रह्मकर्म स्वभावजम् ॥","tr":"śamo damastapaḥ śaucaṃ kṣāntirārjavameva ca\njñānaṃ vijñānamāstikyaṃ brahmakarma svabhāvajam","gs":"શમો દમસ્તપઃ શૌચં ક્ષાન્તિરાર્જવમેવ ચ ।\nજ્ઞાનં વિજ્ઞાનમાસ્તિક્યં બ્રહ્મકર્મ સ્વભાવજમ્ ॥","en":"Serenity, self-restraint, austerity, purity, forgiveness, and uprightness, as well as knowledge, realization, and belief in God, are the duties of Brahmanas, born of their own nature.","hi":"मनका निग्रह करना इन्द्रियोंको वशमें करना; धर्मपालनके लिये कष्ट सहना; बाहर-भीतरसे शुद्ध रहना; दूसरोंके अपराधको क्षमा करना; शरीर, मन आदिमें सरलता रखना; वेद, शास्त्र आदिका ज्ञान होना; यज्ञविधिको अनुभवमें लाना; और परमात्मा, वेद आदिमें आस्तिक भाव रखना -- ये सब-के-सब ब्राह्मणके स्वाभाविक कर्म हैं।"},{"c":18,"v":43,"sp":"krishna","sa":"शौर्यं तेजो धृतिर्दाक्ष्यं युद्धे चाप्यपलायनम् ।\nदानमीश्वरभावश्च क्षात्रं कर्म स्वभावजम् ॥","tr":"śauryaṃ tejo dhṛtirdākṣyaṃ yuddhe cāpyapalāyanam\ndānamīśvarabhāvaśca kṣātraṃ karma svabhāvajam","gs":"શૌર્યં તેજો ધૃતિર્દાક્ષ્યં યુદ્ધે ચાપ્યપલાયનમ્ ।\nદાનમીશ્વરભાવશ્ચ ક્ષાત્રં કર્મ સ્વભાવજમ્ ॥","en":"Prowess, splendor, firmness, dexterity, and not fleeing from battle, generosity, and lordliness are the duties of the Kshatriyas, born of their own nature.","hi":"शूरवीरता, तेज, धैर्य, प्रजाके संचालन आदिकी विशेष चतुरता, युद्धमें कभी पीठ न दिखाना, दान करना और शासन करनेका भाव -- ये सबकेसब क्षत्रियके स्वाभाविक कर्म हैं।"},{"c":18,"v":44,"sp":"krishna","sa":"कृषिगौरक्ष्यवाणिज्यं वैश्यकर्म स्वभावजम् ।\nपरिचर्यात्मकं कर्म शूद्रस्यापि स्वभावजम् ॥","tr":"kṛṣigaurakṣyavāṇijyaṃ vaiśyakarma svabhāvajam\nparicaryātmakaṃ karma śūdrasyāpi svabhāvajam","gs":"કૃષિગૌરક્ષ્યવાણિજ્યં વૈશ્યકર્મ સ્વભાવજમ્ ।\nપરિચર્યાત્મકં કર્મ શૂદ્રસ્યાપિ સ્વભાવજમ્ ॥","en":"Agriculture, cattle-rearing, and trade are the duties of the Vaisya (merchant), born of their own nature; and service is the duty of the Sudra (servant-class), born of their own nature.","hi":"खेती करना, गायोंकी रक्षा करना और शुद्ध व्यापार करना -- ये सब-के-सब वैश्यके स्वाभाविक कर्म हैं, तथा चारों वर्णोंकी सेवा करना शूद्रका भी स्वाभाविक कर्म है।"},{"c":18,"v":45,"sp":"krishna","sa":"स्वे स्वे कर्मण्यभिरतः संसिद्धिं लभते नरः ।\nस्वकर्मनिरतः सिद्धिं यथा विन्दति तच्छृणु ॥","tr":"sve sve karmaṇyabhirataḥ saṃsiddhiṃ labhate naraḥ\nsvakarmanirataḥ siddhiṃ yathā vindati tacchṛṇu","gs":"સ્વે સ્વે કર્મણ્યભિરતઃ સંસિદ્ધિં લભતે નરઃ ।\nસ્વકર્મનિરતઃ સિદ્ધિં યથા વિન્દતિ તચ્છૃણુ ॥","en":"Each person devoted to their own duty attains perfection. How they attain perfection while being engaged in their own duty, hear now.","hi":"अपने-अपने कर्ममें तत्परतापूर्वक लगा हुआ मनुष्य सम्यक् सिद्धि-(परमात्मा-)को प्राप्त कर लेता है। अपने कर्ममें लगा हुआ मनुष्य जिस प्रकार सिद्धिको प्राप्त होता है? उस प्रकारको तू मेरेसे सुन।"},{"c":18,"v":46,"sp":"krishna","sa":"यतः प्रवृत्तिर्भूतानां येन सर्वमिदं ततम् ।\nस्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः ॥","tr":"yataḥ pravṛttirbhūtānāṃ yena sarvamidaṃ tatam\nsvakarmaṇā tamabhyarcya siddhiṃ vindati mānavaḥ","gs":"યતઃ પ્રવૃત્તિર્ભૂતાનાં યેન સર્વમિદં તતમ્ ।\nસ્વકર્મણા તમભ્યર્ચ્ય સિદ્ધિં વિન્દતિ માનવઃ ॥","en":"He from whom all the beings have evolved and by whom all this is pervaded, worshipping Him with his own duty, one attains perfection.","hi":"जिस परमात्मासे सम्पूर्ण प्राणियोंकी उत्पत्ति होती है और जिससे यह सम्पूर्ण संसार व्याप्त है, उस परमात्माका अपने कर्मके द्वारा पूजन करके मनुष्य सिद्धिको प्राप्त हो जाता है।"},{"c":18,"v":47,"sp":"krishna","sa":"श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् ।\nस्वभावनियतं कर्म कुर्वन्नाप्नोति किल्बिषम् ॥","tr":"śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt\nsvabhāvaniyataṃ karma kurvannāpnoti kilbiṣam","gs":"શ્રેયાન્સ્વધર્મો વિગુણઃ પરધર્માત્સ્વનુષ્ઠિતાત્ ।\nસ્વભાવનિયતં કર્મ કુર્વન્નાપ્નોતિ કિલ્બિષમ્ ॥","en":"Better is one's own duty, even if it is destitute of merits, than the duty of another well performed. He who does the duty ordained by his own nature incurs no sin.","hi":"अच्छी तरहसे अनुष्ठान किये हुए परधर्मसे गुणरहित अपना धर्म श्रेष्ठ है। कारण कि स्वभावसे नियत किये हुए स्वधर्मरूप कर्मको करता हुआ मनुष्य पापको प्राप्त नहीं होता।"},{"c":18,"v":48,"sp":"krishna","sa":"सहजं कर्म कौन्तेय सदोषमपि न त्यजेत् ।\nसर्वारम्भा हि दोषेण धूमेनाग्निरिवावृताः ॥","tr":"sahajaṃ karma kaunteya sadoṣamapi na tyajet\nsarvārambhā hi doṣeṇa dhūmenāgnirivāvṛtāḥ","gs":"સહજં કર્મ કૌન્તેય સદોષમપિ ન ત્યજેત્ ।\nસર્વારમ્ભા હિ દોષેણ ધૂમેનાગ્નિરિવાવૃતાઃ ॥","en":"One should not, O Arjuna, abandon the duty to which one is born, though it may be faulty; for, all undertakings are enveloped by evil, just as fire is by smoke.","hi":"हे कुन्तीनन्दन ! दोषयुक्त होनेपर भी सहज कर्मका त्याग नहीं करना चाहिये; क्योंकि सम्पूर्ण कर्म धुएँसे अग्निकी तरह किसी-न-किसी दोषसे युक्त हैं।"},{"c":18,"v":49,"sp":"krishna","sa":"असक्तबुद्धिः सर्वत्र जितात्मा विगतस्पृहः ।\nनैष्कर्म्यसिद्धिं परमां संन्यासेनाधिगच्छति ॥","tr":"asaktabuddhiḥ sarvatra jitātmā vigataspṛhaḥ\nnaiṣkarmyasiddhiṃ paramāṃ saṃnyāsenādhigacchati","gs":"અસક્તબુદ્ધિઃ સર્વત્ર જિતાત્મા વિગતસ્પૃહઃ ।\nનૈષ્કર્મ્યસિદ્ધિં પરમાં સંન્યાસેનાધિગચ્છતિ ॥","en":"He whose intellect is unattached everywhere, who has subdued his self, from whom desire has fled, he attains the supreme state of freedom from action through renunciation.","hi":"जिसकी बुद्धि सब जगह आसक्तिरहित है, जिसने शरीरको वशमें कर रखा है, जो स्पृहारहित है, वह मनुष्य सांख्ययोगके द्वारा नैष्कर्म्य-सिद्धिको प्राप्त हो जाता है।"},{"c":18,"v":50,"sp":"krishna","sa":"सिद्धिं प्राप्तो यथा ब्रह्म तथाप्नोति निबोध मे ।\nसमासेनैव कौन्तेय निष्ठा ज्ञानस्य या परा ॥","tr":"siddhiṃ prāpto yathā brahma tathāpnoti nibodha me\nsamāsenaiva kaunteya niṣṭhā jñānasya yā parā","gs":"સિદ્ધિં પ્રાપ્તો યથા બ્રહ્મ તથાપ્નોતિ નિબોધ મે ।\nસમાસેનૈવ કૌન્તેય નિષ્ઠા જ્ઞાનસ્ય યા પરા ॥","en":"Learn from Me, O Arjuna, in brief how one who has attained perfection reaches Brahman—the Eternal, that supreme state of knowledge.","hi":"हे कौन्तेय ! सिद्धि-(अन्तःकरणकी शुद्धि-) को प्राप्त हुआ साधक ब्रह्मको, जो कि ज्ञानकी परा निष्ठा है, जिस प्रकारसे प्राप्त होता है, उस प्रकारको तुम मुझसे संक्षेपमें ही समझो।"},{"c":18,"v":51,"sp":"krishna","sa":"बुद्ध्या विशुद्धया युक्तो धृत्याऽऽत्मानं नियम्य च ।\nशब्दादीन् विषयांस्त्यक्त्वा रागद्वेषौ व्युदस्य च ॥","tr":"buddhyā viśuddhayā yukto dhṛtyā''tmānaṃ niyamya ca\nśabdādīn viṣayāṃstyaktvā rāgadveṣau vyudasya ca","gs":"બુદ્ધ્યા વિશુદ્ધયા યુક્તો ધૃત્યાઽઽત્માનં નિયમ્ય ચ ।\nશબ્દાદીન્ વિષયાંસ્ત્યક્ત્વા રાગદ્વેષૌ વ્યુદસ્ય ચ ॥","en":"Endowed with a pure intellect, controlling the self through firmness, relinquishing sound and other objects and abandoning attraction and hatred.","hi":"जो विशुद्ध (सात्त्विकी) बुद्धिसे युक्त, वैराग्यके आश्रित, एकान्तका सेवन करनेवाला और नियमित भोजन करनेवाला साधक धैर्यपूर्वक इन्द्रियोंका नियमन करके, शरीर-वाणी-मनको वशमें करके, शब्दादि विषयोंका त्याग करके और राग-द्वेषको छोड़कर निरन्तर ध्यानयोगके परायण हो जाता है, वह अहंकार, बल, दर्प, काम, क्रोध और परिग्रहका त्याग करके एवं निर्मम तथा शान्त होकर ब्रह्मप्राप्तिका पात्र हो जाता है।"},{"c":18,"v":52,"sp":"krishna","sa":"विविक्तसेवी लघ्वाशी यतवाक्कायमानसः ।\nध्यानयोगपरो नित्यं वैराग्यं समुपाश्रितः ॥","tr":"viviktasevī laghvāśī yatavākkāyamānasaḥ\ndhyānayogaparo nityaṃ vairāgyaṃ samupāśritaḥ","gs":"વિવિક્તસેવી લઘ્વાશી યતવાક્કાયમાનસઃ ।\nધ્યાનયોગપરો નિત્યં વૈરાગ્યં સમુપાશ્રિતઃ ॥","en":"Dwelling in solitude, eating sparingly, with speech, body, and mind subdued, always engaged in meditation and concentration, and resorting to dispassion.","hi":"जो विशुद्ध (सात्त्विकी) बुद्धिसे युक्त, वैराग्यके आश्रित, एकान्तका सेवन करनेवाला और नियमित भोजन करनेवाला साधक धैर्यपूर्वक इन्द्रियोंका नियमन करके, शरीर-वाणी-मनको वशमें करके, शब्दादि विषयोंका त्याग करके और राग-द्वेषको छोड़कर निरन्तर ध्यानयोगके परायण हो जाता है, वह अहंकार, बल, दर्प, काम, क्रोध और परिग्रहका त्याग करके एवं निर्मम तथा शान्त होकर ब्रह्मप्राप्तिका पात्र हो जाता है।"},{"c":18,"v":53,"sp":"krishna","sa":"अहङ्कारं बलं दर्पं कामं क्रोधं परिग्रहम् ।\nविमुच्य निर्ममः शान्तो ब्रह्मभूयाय कल्पते ॥","tr":"ahaṅkāraṃ balaṃ darpaṃ kāmaṃ krodhaṃ parigraham\nvimucya nirmamaḥ śānto brahmabhūyāya kalpate","gs":"અહઙ્કારં બલં દર્પં કામં ક્રોધં પરિગ્રહમ્ ।\nવિમુચ્ય નિર્મમઃ શાન્તો બ્રહ્મભૂયાય કલ્પતે ॥","en":"Having abandoned egoism, strength, arrogance, desire, anger, and covetousness, and being free from the notion of 'mine' and peaceful, he is fit for becoming Brahman.","hi":"जो विशुद्ध (सात्त्विकी) बुद्धिसे युक्त, वैराग्यके आश्रित, एकान्तका सेवन करनेवाला और नियमित भोजन करनेवाला साधक धैर्यपूर्वक इन्द्रियोंका नियमन करके, शरीर-वाणी-मनको वशमें करके, शब्दादि विषयोंका त्याग करके और राग-द्वेषको छोड़कर निरन्तर ध्यानयोगके परायण हो जाता है, वह अहंकार, बल, दर्प, काम, क्रोध और परिग्रहका त्याग करके एवं निर्मम तथा शान्त होकर ब्रह्मप्राप्तिका पात्र हो जाता है।"},{"c":18,"v":54,"sp":"krishna","sa":"ब्रह्मभूतः प्रसन्नात्मा न शोचति न काङ्क्षति ।\nसमः सर्वेषु भूतेषु मद्भक्तिं लभते पराम् ॥","tr":"brahmabhūtaḥ prasannātmā na śocati na kāṅkṣati\nsamaḥ sarveṣu bhūteṣu madbhaktiṃ labhate parām","gs":"બ્રહ્મભૂતઃ પ્રસન્નાત્મા ન શોચતિ ન કાઙ્ક્ષતિ ।\nસમઃ સર્વેષુ ભૂતેષુ મદ્ભક્તિં લભતે પરામ્ ॥","en":"Becoming Brahman, serene in the Self, he neither grieves nor desires; he is the same to all beings, and obtains supreme devotion to Me.","hi":"वह ब्रह्मभूत-अवस्थाको प्राप्त प्रसन्न मनवाला साधक न तो किसीके लिये शोक करता है और न किसीकी इच्छा करता है। ऐसा सम्पूर्ण प्राणियोंमें समभाववाला साधक मेरी पराभक्तिको प्राप्त हो जाता है।"},{"c":18,"v":55,"sp":"krishna","sa":"भक्त्या मामभिजानाति यावान्यश्चास्मि तत्त्वतः ।\nततो मां तत्त्वतो ज्ञात्वा विशते तदनन्तरम् ॥","tr":"bhaktyā māmabhijānāti yāvānyaścāsmi tattvataḥ\ntato māṃ tattvato jñātvā viśate tadanantaram","gs":"ભક્ત્યા મામભિજાનાતિ યાવાન્યશ્ચાસ્મિ તત્ત્વતઃ ।\nતતો માં તત્ત્વતો જ્ઞાત્વા વિશતે તદનન્તરમ્ ॥","en":"By devotion, he knows Me in truth, who and what I am; then, having known Me in truth, he immediately enters into the Supreme.","hi":"उस पराभक्तिसे मेरेको, मैं जितना हूँ और जो हूँ -- इसको तत्त्वसे जान लेता है तथा मेरेको तत्त्वसे जानकर फिर तत्काल मेरेमें प्रविष्ट हो जाता है।"},{"c":18,"v":56,"sp":"krishna","sa":"सर्वकर्माण्यपि सदा कुर्वाणो मद्व्यपाश्रयः ।\nमत्प्रसादादवाप्नोति शाश्वतं पदमव्ययम् ॥","tr":"sarvakarmāṇyapi sadā kurvāṇo madvyapāśrayaḥ\nmatprasādādavāpnoti śāśvataṃ padamavyayam","gs":"સર્વકર્માણ્યપિ સદા કુર્વાણો મદ્વ્યપાશ્રયઃ ।\nમત્પ્રસાદાદવાપ્નોતિ શાશ્વતં પદમવ્યયમ્ ॥","en":"Having taken refuge in Me and doing all actions, by My grace he obtains the eternal, indestructible state of being.","hi":"मेरा आश्रय लेनेवाला भक्त सदा सब कर्म करता हुआ भी मेरी कृपासे शाश्वत अविनाशी पदको प्राप्त हो जाता है।"},{"c":18,"v":57,"sp":"krishna","sa":"चेतसा सर्वकर्माणि मयि संन्यस्य मत्परः ।\nबुद्धियोगमुपाश्रित्य मच्चित्तः सततं भव ॥","tr":"cetasā sarvakarmāṇi mayi saṃnyasya matparaḥ\nbuddhiyogamupāśritya maccittaḥ satataṃ bhava","gs":"ચેતસા સર્વકર્માણિ મયિ સંન્યસ્ય મત્પરઃ ।\nબુદ્ધિયોગમુપાશ્રિત્ય મચ્ચિત્તઃ સતતં ભવ ॥","en":"Mentally renouncing all actions in Me, having Me as the highest goal, and resorting to the yoga of discrimination, do thou ever fix thy mind on Me.","hi":"चित्तसे सम्पूर्ण कर्म मुझमें अर्पण करके, मेरे परायण होकर तथा समताका आश्रय लेकर निरन्तर मुझमें चित्तवाला हो जा।"},{"c":18,"v":58,"sp":"krishna","sa":"मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि ।\nअथ चेत्त्वमहङ्कारान्न श्रोष्यसि विनङ्क्ष्यसि ॥","tr":"maccittaḥ sarvadurgāṇi matprasādāttariṣyasi\natha cettvamahaṅkārānna śroṣyasi vinaṅkṣyasi","gs":"મચ્ચિત્તઃ સર્વદુર્ગાણિ મત્પ્રસાદાત્તરિષ્યસિ ।\nઅથ ચેત્ત્વમહઙ્કારાન્ન શ્રોષ્યસિ વિનઙ્ક્ષ્યસિ ॥","en":"Fixing your mind on Me, you shall, by My grace, overcome all obstacles; but if you will not hear Me due to egoism, you shall perish.","hi":"मेरेमें चित्तवाला होकर तू मेरी कृपासे सम्पूर्ण विघ्नोंको तर जायगा और यदि तू अहंकारके कारण मेरी बात नहीं सुनेगा तो तेरा पतन हो जायगा।"},{"c":18,"v":59,"sp":"krishna","sa":"यदहङ्कारमाश्रित्य न योत्स्य इति मन्यसे ।\nमिथ्यैष व्यवसायस्ते प्रकृतिस्त्वां नियोक्ष्यति ॥","tr":"yadahaṅkāramāśritya na yotsya iti manyase\nmithyaiṣa vyavasāyaste prakṛtistvāṃ niyokṣyati","gs":"યદહઙ્કારમાશ્રિત્ય ન યોત્સ્ય ઇતિ મન્યસે ।\nમિથ્યૈષ વ્યવસાયસ્તે પ્રકૃતિસ્ત્વાં નિયોક્ષ્યતિ ॥","en":"If, filled with egoism, thou thinkest, \"I will not fight,\" then thy resolve is vain; nature will compel thee.","hi":"अहंकारका आश्रय लेकर तू जो ऐसा मान रहा है कि मैं युद्ध नहीं करूँगा, तेरा यह निश्चय मिथ्या (झूठा) है; क्योंकि तेरी क्षात्र-प्रकृति तेरेको युद्धमें लगा देगी।"},{"c":18,"v":60,"sp":"krishna","sa":"स्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा ।\nकर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोऽपि तत् ॥","tr":"svabhāvajena kaunteya nibaddhaḥ svena karmaṇā\nkartuṃ necchasi yanmohātkariṣyasyavaśo'pi tat","gs":"સ્વભાવજેન કૌન્તેય નિબદ્ધઃ સ્વેન કર્મણા ।\nકર્તું નેચ્છસિ યન્મોહાત્કરિષ્યસ્યવશોઽપિ તત્ ॥","en":"O Arjuna, bound by your own Karma (action) born of your own nature, that which from delusion you wish not to do, even that you shall do helplessly.","hi":"हे कुन्तीनन्दन ! अपने स्वभावजन्य कर्मसे बँधा हुआ तू मोहके कारण जो नहीं करना चाहता, उसको तू (क्षात्र-प्रकृतिके) परवश होकर करेगा।"},{"c":18,"v":61,"sp":"krishna","sa":"ईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति ।\nभ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया ॥","tr":"īśvaraḥ sarvabhūtānāṃ hṛddeśe'rjuna tiṣṭhati\nbhrāmayansarvabhūtāni yantrārūḍhāni māyayā","gs":"ઈશ્વરઃ સર્વભૂતાનાં હૃદ્દેશેઽર્જુન તિષ્ઠતિ ।\nભ્રામયન્સર્વભૂતાનિ યન્ત્રારૂઢાનિ માયયા ॥","en":"The Lord dwells in the hearts of all beings, O Arjuna, causing all beings, by His illusory power, to revolve as if mounted on a machine.","hi":"हे अर्जुन ! ईश्वर सम्पूर्ण प्राणियोंके हृदयमें रहता है और अपनी मायासे शरीररूपी यन्त्रपर आरूढ़ हुए सम्पूर्ण प्राणियोंको (उनके स्वभावके अनुसार) भ्रमण कराता रहता है।"},{"c":18,"v":62,"sp":"krishna","sa":"तमेव शरणं गच्छ सर्वभावेन भारत ।\nतत्प्रसादात्परां शान्तिं स्थानं प्राप्स्यसि शाश्वतम् ॥","tr":"tameva śaraṇaṃ gaccha sarvabhāvena bhārata\ntatprasādātparāṃ śāntiṃ sthānaṃ prāpsyasi śāśvatam","gs":"તમેવ શરણં ગચ્છ સર્વભાવેન ભારત ।\nતત્પ્રસાદાત્પરાં શાન્તિં સ્થાનં પ્રાપ્સ્યસિ શાશ્વતમ્ ॥","en":"Fly to Him for refuge with all your being, O Arjuna; by His grace you will obtain supreme peace and the eternal abode.","hi":"हे भरतवंशोद्भव अर्जुन ! तू सर्वभावसे उस ईश्वरकी ही शरणमें चला जा। उसकी कृपासे तू परमशान्ति-(संसारसे सर्वथा उपरति-) को और अविनाशी परमपदको प्राप्त हो जायगा।"},{"c":18,"v":63,"sp":"krishna","sa":"इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया ।\nविमृश्यैतदशेषेण यथेच्छसि तथा कुरु ॥","tr":"iti te jñānamākhyātaṃ guhyādguhyataraṃ mayā\nvimṛśyaitadaśeṣeṇa yathecchasi tathā kuru","gs":"ઇતિ તે જ્ઞાનમાખ્યાતં ગુહ્યાદ્ગુહ્યતરં મયા ।\nવિમૃશ્યૈતદશેષેણ યથેચ્છસિ તથા કુરુ ॥","en":"Thus, wisdom more secret than secrecy itself has been declared to you by me. Reflect on it fully, then act as you wish.","hi":"यह गुह्यसे भी गुह्यतर (शरणागतिरूप) ज्ञान मैंने तुझे कह दिया। अब तू इसपर अच्छी तरहसे विचार करके जैसा चाहता है, वैसा कर।"},{"c":18,"v":64,"sp":"krishna","sa":"सर्वगुह्यतमं भूयः श्रृणु मे परमं वचः ।\nइष्टोऽसि मे दृढमिति ततो वक्ष्यामि ते हितम् ॥","tr":"sarvaguhyatamaṃ bhūyaḥ śrṛṇu me paramaṃ vacaḥ\niṣṭo'si me dṛḍhamiti tato vakṣyāmi te hitam","gs":"સર્વગુહ્યતમં ભૂયઃ શ્રૃણુ મે પરમં વચઃ ।\nઇષ્ટોઽસિ મે દૃઢમિતિ તતો વક્ષ્યામિ તે હિતમ્ ॥","en":"Hear again My supreme word, most secret of all; for you are dearly beloved of Me, I will tell you what is good.","hi":"सबसे अत्यन्त गोपनीय वचन तू फिर मेरेसे सुन। तू मेरा अत्यन्त प्रिय है, इसलिये मैं तेरे हितकी बात कहूँगा।"},{"c":18,"v":65,"sp":"krishna","sa":"मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु ।\nमामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे ॥","tr":"manmanā bhava madbhakto madyājī māṃ namaskuru\nmāmevaiṣyasi satyaṃ te pratijāne priyo'si me","gs":"મન્મના ભવ મદ્ભક્તો મદ્યાજી માં નમસ્કુરુ ।\nમામેવૈષ્યસિ સત્યં તે પ્રતિજાને પ્રિયોઽસિ મે ॥","en":"Fix your mind on Me, be devoted to Me, sacrifice to Me, bow down to Me. You will come to Me; I truly promise you this, for you are dear to Me.","hi":"तू मेरा भक्त हो जा, मेरेमें मनवाला हो जा, मेरा पूजन करनेवाला हो जा और मेरेको नमस्कार कर। ऐसा करनेसे तू मेरेको ही प्राप्त हो जायगा -- यह मैं तेरे सामने सत्य प्रतिज्ञा करता हूँ; क्योंकि तू मेरा अत्यन्त प्रिय है।"},{"c":18,"v":66,"sp":"krishna","sa":"सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज ।\nअहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः ॥","tr":"sarvadharmānparityajya māmekaṃ śaraṇaṃ vraja\nahaṃ tvā sarvapāpebhyo mokṣayiṣyāmi mā śucaḥ","gs":"સર્વધર્માન્પરિત્યજ્ય મામેકં શરણં વ્રજ ।\nઅહં ત્વા સર્વપાપેભ્યો મોક્ષયિષ્યામિ મા શુચઃ ॥","en":"Abandon all duties and take refuge in Me alone; I will liberate you from all sins; do not grieve.","hi":"सम्पूर्ण धर्मोंका आश्रय छोड़कर तू केवल मेरी शरणमें आ जा। मैं तुझे सम्पूर्ण पापोंसे मुक्त कर दूँगा, चिन्ता मत कर।"},{"c":18,"v":67,"sp":"krishna","sa":"इदं ते नातपस्काय नाभक्ताय कदाचन ।\nन चाशुश्रूषवे वाच्यं न च मां योऽभ्यसूयति ॥","tr":"idaṃ te nātapaskāya nābhaktāya kadācana\nna cāśuśrūṣave vācyaṃ na ca māṃ yo'bhyasūyati","gs":"ઇદં તે નાતપસ્કાય નાભક્તાય કદાચન ।\nન ચાશુશ્રૂષવે વાચ્યં ન ચ માં યોઽભ્યસૂયતિ ॥","en":"Never speak this to one who is devoid of austerities or devotion, who does not render service, who does not desire to listen, or who cavils at Me.","hi":"यह सर्वगुह्यतम वचन अतपस्वीको मत कहना; अभक्तको कभी मत कहना; जो सुनना नहीं चाहता, उसको मत कहना; और जो मेरेमें दोषदृष्टि करता है, उससे भी मत कहना।"},{"c":18,"v":68,"sp":"krishna","sa":"य इमं परमं गुह्यं मद्भक्तेष्वभिधास्यति ।\nभक्ितं मयि परां कृत्वा मामेवैष्यत्यसंशयः ॥","tr":"ya imaṃ paramaṃ guhyaṃ madbhakteṣvabhidhāsyati\nbhakitaṃ mayi parāṃ kṛtvā māmevaiṣyatyasaṃśayaḥ","gs":"ય ઇમં પરમં ગુહ્યં મદ્ભક્તેષ્વભિધાસ્યતિ ।\nભક્િતં મયિ પરાં કૃત્વા મામેવૈષ્યત્યસંશયઃ ॥","en":"He who, with supreme devotion to Me, teaches this supreme secret to My devotees, shall undoubtedly come to Me.","hi":"मेरेमें पराभक्ति करके जो इस परम गोपनीय संवाद-(गीता-ग्रन्थ) को मेरे भक्तोंमें कहेगा, वह मुझे ही प्राप्त होगा -- इसमें कोई सन्देह नहीं है।"},{"c":18,"v":69,"sp":"krishna","sa":"न च तस्मान्मनुष्येषु कश्िचन्मे प्रियकृत्तमः ।\nभविता न च मे तस्मादन्यः प्रियतरो भुवि ॥","tr":"na ca tasmānmanuṣyeṣu kaśicanme priyakṛttamaḥ\nbhavitā na ca me tasmādanyaḥ priyataro bhuvi","gs":"ન ચ તસ્માન્મનુષ્યેષુ કશ્િચન્મે પ્રિયકૃત્તમઃ ।\nભવિતા ન ચ મે તસ્માદન્યઃ પ્રિયતરો ભુવિ ॥","en":"There is no one among men who does service dearer to Me, nor shall there be anyone on earth dearer to Me than him.","hi":"उसके समान मेरा अत्यन्त प्रिय कार्य करनेवाला मनुष्योंमें कोई भी नहीं है और इस भूमण्डलपर उसके समान मेरा दूसरा कोई प्रियतर होगा भी नहीं।"},{"c":18,"v":70,"sp":"krishna","sa":"अध्येष्यते च य इमं धर्म्यं संवादमावयोः ।\nज्ञानयज्ञेन तेनाहमिष्टः स्यामिति मे मतिः ॥","tr":"adhyeṣyate ca ya imaṃ dharmyaṃ saṃvādamāvayoḥ\njñānayajñena tenāhamiṣṭaḥ syāmiti me matiḥ","gs":"અધ્યેષ્યતે ચ ય ઇમં ધર્મ્યં સંવાદમાવયોઃ ।\nજ્ઞાનયજ્ઞેન તેનાહમિષ્ટઃ સ્યામિતિ મે મતિઃ ॥","en":"And he who studies this sacred dialogue of ours, by him I shall have been worshipped through the sacrifice of wisdom; such is my conviction.","hi":"जो मनुष्य हम दोनोंके इस धर्ममय संवादका अध्ययन करेगा, उसके द्वारा भी मैं ज्ञानयज्ञसे पूजित होऊँगा -- ऐसा मेरा मत है।"},{"c":18,"v":71,"sp":"krishna","sa":"श्रद्धावाननसूयश्च श्रृणुयादपि यो नरः ।\nसोऽपि मुक्तः शुभाँल्लोकान्प्राप्नुयात्पुण्यकर्मणाम् ॥","tr":"śraddhāvānanasūyaśca śrṛṇuyādapi yo naraḥ\nso'pi muktaḥ śubhā~llokānprāpnuyātpuṇyakarmaṇām","gs":"શ્રદ્ધાવાનનસૂયશ્ચ શ્રૃણુયાદપિ યો નરઃ ।\nસોઽપિ મુક્તઃ શુભાઁલ્લોકાન્પ્રાપ્નુયાત્પુણ્યકર્મણામ્ ॥","en":"Also, the man who hears this, full of faith and free from malice, shall attain to the happy worlds of those of righteous deeds, and be liberated.","hi":"श्रद्धावान् और दोषदृष्टिसे रहित जो मनुष्य इस गीता-ग्रन्थको सुन भी लेगा, वह भी सम्पूर्ण पापोंसे मुक्त होकर पुण्यकारियोंके शुभ लोकोंको प्राप्त हो जायगा।"},{"c":18,"v":72,"sp":"krishna","sa":"कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा ।\nकच्चिदज्ञानसंमोहः प्रनष्टस्ते धनञ्जय ॥","tr":"kaccidetacchrutaṃ pārtha tvayaikāgreṇa cetasā\nkaccidajñānasaṃmohaḥ pranaṣṭaste dhanañjaya","gs":"કચ્ચિદેતચ્છ્રુતં પાર્થ ત્વયૈકાગ્રેણ ચેતસા ।\nકચ્ચિદજ્ઞાનસંમોહઃ પ્રનષ્ટસ્તે ધનઞ્જય ॥","en":"Has this been heard, O Arjuna, with one-pointed focus? Has the delusion of your ignorance been destroyed, O Dhananjaya?","hi":"हे पृथानन्दन ! क्या तुमने एकाग्र-चित्तसे इसको सुना ?और हे धनञ्जय ! क्या तुम्हारा अज्ञानसे उत्पन्न मोह नष्ट हुआ ?"},{"c":18,"v":73,"sp":"arjuna","sa":"नष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाच्युत ।\nस्थितोऽस्मि गतसन्देहः करिष्ये वचनं तव ॥","tr":"naṣṭo mohaḥ smṛtirlabdhā tvatprasādānmayācyuta\nsthito'smi gatasandehaḥ kariṣye vacanaṃ tava","gs":"નષ્ટો મોહઃ સ્મૃતિર્લબ્ધા ત્વત્પ્રસાદાન્મયાચ્યુત ।\nસ્થિતોઽસ્મિ ગતસન્દેહઃ કરિષ્યે વચનં તવ ॥","en":"Arjuna said, \"My delusion has been destroyed, for I have gained my knowledge (memory) through Your grace, O Krishna. I am now free from doubts. I will act according to Your word.\"","hi":"अर्जुन बोले -- हे अच्युत ! आपकी कृपासे मेरा मोह नष्ट हो गया है और स्मृति प्राप्त हो गयी है। मैं सन्देहरहित होकर स्थित हूँ। अब मैं आपकी आज्ञाका पालन करूँगा।"},{"c":18,"v":74,"sp":"sanjaya","sa":"इत्यहं वासुदेवस्य पार्थस्य च महात्मनः ।\nसंवादमिममश्रौषमद्भुतं रोमहर्षणम् ॥","tr":"ityahaṃ vāsudevasya pārthasya ca mahātmanaḥ\nsaṃvādamimamaśrauṣamadbhutaṃ romaharṣaṇam","gs":"ઇત્યહં વાસુદેવસ્ય પાર્થસ્ય ચ મહાત્મનઃ ।\nસંવાદમિમમશ્રૌષમદ્ભુતં રોમહર્ષણમ્ ॥","en":"Sanjaya said, Thus, I have heard this wonderful dialogue between Krishna and the high-souled Arjuna, which causes one's hair to stand on end.","hi":"सञ्जय बोले -- इस प्रकार मैंने भगवान् वासुदेव और महात्मा पृथानन्दन अर्जुनका यह रोमाञ्चित करनेवाला अद्भुत संवाद सुना।"},{"c":18,"v":75,"sp":"sanjaya","sa":"व्यासप्रसादाच्छ्रुतवानेतद्गुह्यमहं परम् ।\nयोगं योगेश्वरात्कृष्णात्साक्षात्कथयतः स्वयम् ॥","tr":"vyāsaprasādācchrutavānetadguhyamahaṃ param\nyogaṃ yogeśvarātkṛṣṇātsākṣātkathayataḥ svayam","gs":"વ્યાસપ્રસાદાચ્છ્રુતવાનેતદ્ગુહ્યમહં પરમ્ ।\nયોગં યોગેશ્વરાત્કૃષ્ણાત્સાક્ષાત્કથયતઃ સ્વયમ્ ॥","en":"Through the grace of Vyasa, I have heard this supreme and most secret Yoga, directly from Krishna, the Lord of Yoga, Himself declaring it.","hi":"व्यासजीकी कृपासे मैंने स्वयं इस परम गोपनीय योग (गीता-ग्रन्थ) को कहते हुए साक्षात् योगेश्वर भगवान् श्रीकृष्णसे सुना है।"},{"c":18,"v":76,"sp":"sanjaya","sa":"राजन्संस्मृत्य संस्मृत्य संवादमिममद्भुतम् ।\nकेशवार्जुनयोः पुण्यं हृष्यामि च मुहुर्मुहुः ॥","tr":"rājansaṃsmṛtya saṃsmṛtya saṃvādamimamadbhutam\nkeśavārjunayoḥ puṇyaṃ hṛṣyāmi ca muhurmuhuḥ","gs":"રાજન્સંસ્મૃત્ય સંસ્મૃત્ય સંવાદમ
