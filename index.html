e, the Being, the non-being, and That which is supreme—that which is beyond the Being and the non-being.","hi":"हे महात्मन् ! गुरुओंके भी गुरु और ब्रह्माके भी आदिकर्ता आपके लिये (वे सिद्धगण) नमस्कार क्यों नहीं करें? क्योंकि हे अनन्त ! हे देवेश ! हे जगन्निवास ! आप अक्षरस्वरूप हैं; आप सत् भी हैं, असत् भी हैं, और सत्-असत् से पर भी जो कुछ है, वह भी आप ही हैं।"},{"c":11,"v":38,"sp":"arjuna","sa":"त्वमादिदेवः पुरुषः पुराण  स्त्वमस्य विश्वस्य परं निधानम् ।\nवेत्तासि वेद्यं च परं च धाम  त्वया ततं विश्वमनन्तरूप ॥","tr":"tvamādidevaḥ puruṣaḥ purāṇa  stvamasya viśvasya paraṃ nidhānam\nvettāsi vedyaṃ ca paraṃ ca dhāma  tvayā tataṃ viśvamanantarūpa","gs":"ત્વમાદિદેવઃ પુરુષઃ પુરાણ  સ્ત્વમસ્ય વિશ્વસ્ય પરં નિધાનમ્ ।\nવેત્તાસિ વેદ્યં ચ પરં ચ ધામ  ત્વયા તતં વિશ્વમનન્તરૂપ ॥","en":"You are the primal God, the ancient Purusha, the supreme refuge of this universe, the knower, the knowable, and the supreme Abode. Through You, the universe is pervaded, O Being of infinite forms.","hi":"आप ही आदिदेव और पुराणपुरुष हैं तथा आप ही इस संसारके परम आश्रय हैं। आप ही सबको जाननेवाले, जाननेयोग्य और परमधाम हैं। हे अनन्तरूप ! आपसे ही सम्पूर्ण संसार व्याप्त है।"},{"c":11,"v":39,"sp":"arjuna","sa":"वायुर्यमोऽग्निर्वरुणः शशाङ्कः  प्रजापतिस्त्वं प्रपितामहश्च ।\nनमो नमस्तेऽस्तु सहस्रकृत्वः  पुनश्च भूयोऽपि नमो नमस्ते ॥","tr":"vāyuryamo'gnirvaruṇaḥ śaśāṅkaḥ  prajāpatistvaṃ prapitāmahaśca\nnamo namaste'stu sahasrakṛtvaḥ  punaśca bhūyo'pi namo namaste","gs":"વાયુર્યમોઽગ્નિર્વરુણઃ શશાઙ્કઃ  પ્રજાપતિસ્ત્વં પ્રપિતામહશ્ચ ।\nનમો નમસ્તેઽસ્તુ સહસ્રકૃત્વઃ  પુનશ્ચ ભૂયોઽપિ નમો નમસ્તે ॥","en":"You are Vayu, Yama, Agni, Varuna, the moon, the Creator, and the great-grandfather. I offer my salutations to You a thousand times, and again I offer my salutations to You.","hi":"आप ही वायु, यमराज, अग्नि, वरुण, चन्द्रमा, दक्ष आदि प्रजापति और प्रपितामह (ब्रह्माजीके भी पिता) हैं। आपको हजारों बार नमस्कार हो! नमस्कार हो ! ! और फिर भी आपको बार-बार नमस्कार हो ! नमस्कार हो !"},{"c":11,"v":40,"sp":"arjuna","sa":"नमः पुरस्तादथ पृष्ठतस्ते  नमोऽस्तु ते सर्वत एव सर्व ।\nअनन्तवीर्यामितविक्रमस्त्वं  सर्वं समाप्नोषि ततोऽसि सर्वः ॥","tr":"namaḥ purastādatha pṛṣṭhataste  namo'stu te sarvata eva sarva\nanantavīryāmitavikramastvaṃ  sarvaṃ samāpnoṣi tato'si sarvaḥ","gs":"નમઃ પુરસ્તાદથ પૃષ્ઠતસ્તે  નમોઽસ્તુ તે સર્વત એવ સર્વ ।\nઅનન્તવીર્યામિતવિક્રમસ્ત્વં  સર્વં સમાપ્નોષિ તતોઽસિ સર્વઃ ॥","en":"Salutations to You in front and behind! Salutations to You on every side! O All! You, infinite in power and prowess, pervade all; therefore You are all.","hi":"हे सर्व ! आपको आगेसे भी नमस्कार हो ! पीछेसे भी नमस्कार हो ! सब ओरसे ही नमस्कार हो ! हे अनन्तवीर्य ! अमित विक्रमवाले आपने सबको समावृत कर रखा है; अतः सब कुछ आप ही हैं।"},{"c":11,"v":41,"sp":"arjuna","sa":"सखेति मत्वा प्रसभं यदुक्तं  हे कृष्ण हे यादव हे सखेति ।\nअजानता महिमानं तवेदं  मया प्रमादात्प्रणयेन वापि ॥","tr":"sakheti matvā prasabhaṃ yaduktaṃ  he kṛṣṇa he yādava he sakheti\najānatā mahimānaṃ tavedaṃ  mayā pramādātpraṇayena vāpi","gs":"સખેતિ મત્વા પ્રસભં યદુક્તં  હે કૃષ્ણ હે યાદવ હે સખેતિ ।\nઅજાનતા મહિમાનં તવેદં  મયા પ્રમાદાત્પ્રણયેન વાપિ ॥","en":"Whatever I have presumptuously said from carelessness or love, addressing You as O Krishna! O Yadava! O Friend! regarding You merely as a friend, unknowing of Your greatness.","hi":"।।11.41 -- 11.42।। आपकी महिमा और स्वरूपको न जानते हुए 'मेरे सखा हैं' ऐसा मानकर मैंने प्रमादसे अथवा प्रेमसे हठपूर्वक (बिना सोचे-समझे) 'हे कृष्ण ! हे यादव ! हे सखे !' इस प्रकार जो कुछ कहा है; और हे अच्युत ! हँसी-दिल्लगीमें, चलते-फिरते, सोते-जागते, उठते-बैठते, खाते-पीते समयमें अकेले अथवा उन सखाओं, कुटुम्बियों आदिके सामने मेरे द्वारा आपका जो कुछ तिरस्कार किया गया है; वह सब अप्रमेयस्वरुप आपसे मैं क्षमा माँगता हूँ।"},{"c":11,"v":42,"sp":"arjuna","sa":"यच्चावहासार्थमसत्कृतोऽसि  विहारशय्यासनभोजनेषु ।\nएकोऽथवाप्यच्युत तत्समक्षं  तत्क्षामये त्वामहमप्रमेयम् ॥","tr":"yaccāvahāsārthamasatkṛto'si  vihāraśayyāsanabhojaneṣu\neko'thavāpyacyuta tatsamakṣaṃ  tatkṣāmaye tvāmahamaprameyam","gs":"યચ્ચાવહાસાર્થમસત્કૃતોઽસિ  વિહારશય્યાસનભોજનેષુ ।\nએકોઽથવાપ્યચ્યુત તત્સમક્ષં  તત્ક્ષામયે ત્વામહમપ્રમેયમ્ ॥","en":"In whatever way I may have insulted You for the sake of fun, while at play, reposing, sitting, or at meals, when alone (with You), O Krishna, or in company, that I implore You, immeasurable one, to forgive.","hi":"।।11.41 -- 11.42।। आपकी महिमा और स्वरूपको न जानते हुए 'मेरे सखा हैं' ऐसा मानकर मैंने प्रमादसे अथवा प्रेमसे भी हठपूर्वक (बिना सोचे-समझे) 'हे कृष्ण ! हे यादव ! हे सखे !' इस प्रकार जो कुछ कहा है; और हे अच्युत ! हँसी-दिल्लगीमें, चलते-फिरते, सोते-जागते, उठते-बैठते, खाते-पीते समयमें अकेले अथवा उन सखाओं, कुटुम्बियों आदिके सामने मेरे द्वारा आपका जो कुछ तिरस्कार किया गया है, वह सब अप्रमेस्वरूप आपसे मैं क्षमा करवाता हूँ ।"},{"c":11,"v":43,"sp":"arjuna","sa":"पितासि लोकस्य चराचरस्य  त्वमस्य पूज्यश्च गुरुर्गरीयान् ।\nन त्वत्समोऽस्त्यभ्यधिकः कुतोऽन्यो  लोकत्रयेऽप्यप्रतिमप्रभाव ॥","tr":"pitāsi lokasya carācarasya  tvamasya pūjyaśca gururgarīyān\nna tvatsamo'styabhyadhikaḥ kuto'nyo  lokatraye'pyapratimaprabhāva","gs":"પિતાસિ લોકસ્ય ચરાચરસ્ય  ત્વમસ્ય પૂજ્યશ્ચ ગુરુર્ગરીયાન્ ।\nન ત્વત્સમોઽસ્ત્યભ્યધિકઃ કુતોઽન્યો  લોકત્રયેઽપ્યપ્રતિમપ્રભાવ ॥","en":"Thou art the Father of this world, both moving and unmoving. Thou art to be adored by this world; Thou, the greatest Guru; for none exists who is equal to Thee; how then could there be another superior to Thee in the three worlds, O Being of unrivaled power?","hi":"आप ही इस चराचर संसारके पिता हैं, आप ही पूजनीय हैं और आप ही गुरुओंके महान् गुरु हैं। हे अनन्त प्रभावशाली भगवन् ! इस त्रिलोकीमें आपके समान भी दूसरा कोई नहीं है, फिर अधिक तो हो ही कैसे सकता है !"},{"c":11,"v":44,"sp":"arjuna","sa":"तस्मात्प्रणम्य प्रणिधाय कायं  प्रसादये त्वामहमीशमीड्यम् ।\nपितेव पुत्रस्य सखेव सख्युः  प्रियः प्रियायार्हसि देव सोढुम् ॥","tr":"tasmātpraṇamya praṇidhāya kāyaṃ  prasādaye tvāmahamīśamīḍyam\npiteva putrasya sakheva sakhyuḥ  priyaḥ priyāyārhasi deva soḍhum","gs":"તસ્માત્પ્રણમ્ય પ્રણિધાય કાયં  પ્રસાદયે ત્વામહમીશમીડ્યમ્ ।\nપિતેવ પુત્રસ્ય સખેવ સખ્યુઃ  પ્રિયઃ પ્રિયાયાર્હસિ દેવ સોઢુમ્ ॥","en":"Therefore, bowing down and prostrating my body, I crave Thy forgiveness, O adorable Lord. As a father forgives his son, a friend his dear friend, a lover his beloved, even so may Thou forgive me, O God.","hi":"इसलिये शरीरसे लम्बा पड़कर स्तुति करनेयोग्य आप ईश्वरको मैं प्रणाम करके प्रसन्न करना चाहता हूँ। जैसे पिता पुत्रके, मित्र मित्रके और पति पत्नीके अपमानको सह लेता है, ऐसे ही हे देव ! आप मेरे द्वारा किया गया अपमान सहनेमें समर्थ हैं।"},{"c":11,"v":45,"sp":"arjuna","sa":"अदृष्टपूर्वं हृषितोऽस्मि दृष्ट्वा  भयेन च प्रव्यथितं मनो मे ।\nतदेव मे दर्शय देव रूपं  प्रसीद देवेश जगन्निवास ॥","tr":"adṛṣṭapūrvaṃ hṛṣito'smi dṛṣṭvā  bhayena ca pravyathitaṃ mano me\ntadeva me darśaya deva rūpaṃ  prasīda deveśa jagannivāsa","gs":"અદૃષ્ટપૂર્વં હૃષિતોઽસ્મિ દૃષ્ટ્વા  ભયેન ચ પ્રવ્યથિતં મનો મે ।\nતદેવ મે દર્શય દેવ રૂપં  પ્રસીદ દેવેશ જગન્નિવાસ ॥","en":"I am delighted, having seen something never seen before; yet my mind is distressed with fear. Show me that form only, O God; have mercy, O God of gods, O Abode of the universe.","hi":"मैंने ऐसा रुप पहले कभी नहीं देखा। इस रूपको देखकर मैं हर्षित हो रहा हूँ और (साथ-ही-साथ) भयसे मेरा मन अत्यन्त व्यथित हो रहा है। अतः आप मुझे अपने उसी देवरूपको (सौम्य विष्णुरूपको) दिखाइये। हे देवेश ! हे जगन्निवास ! आप प्रसन्न होइये।"},{"c":11,"v":46,"sp":"arjuna","sa":"किरीटिनं गदिनं चक्रहस्त  मिच्छामि त्वां द्रष्टुमहं तथैव ।\nतेनैव रूपेण चतुर्भुजेन  सहस्रबाहो भव विश्वमूर्ते ॥","tr":"kirīṭinaṃ gadinaṃ cakrahasta  micchāmi tvāṃ draṣṭumahaṃ tathaiva\ntenaiva rūpeṇa caturbhujena  sahasrabāho bhava viśvamūrte","gs":"કિરીટિનં ગદિનં ચક્રહસ્ત  મિચ્છામિ ત્વાં દ્રષ્ટુમહં તથૈવ ।\nતેનૈવ રૂપેણ ચતુર્ભુજેન  સહસ્રબાહો ભવ વિશ્વમૂર્તે ॥","en":"I desire to see You as before, crowned, bearing a mace, with the discus in hand, in Your former form only, having four arms, O thousand-armed, Cosmic Being.","hi":"मैं आपको वैसे ही किरीटधारी, गदाधारी और हाथमें चक्र लिये हुए देखना चाहता हूँ। इसलिये हे सहस्रबाहो ! हे विश्वमूर्ते ! आप उसी चतुर्भुजरूपसे हो जाइये।"},{"c":11,"v":47,"sp":"krishna","sa":"मया प्रसन्नेन तवार्जुनेदं  रूपं परं दर्शितमात्मयोगात् ।\nतेजोमयं विश्वमनन्तमाद्यं  यन्मे त्वदन्येन न दृष्टपूर्वम् ॥","tr":"mayā prasannena tavārjunedaṃ  rūpaṃ paraṃ darśitamātmayogāt\ntejomayaṃ viśvamanantamādyaṃ  yanme tvadanyena na dṛṣṭapūrvam","gs":"મયા પ્રસન્નેન તવાર્જુનેદં  રૂપં પરં દર્શિતમાત્મયોગાત્ ।\nતેજોમયં વિશ્વમનન્તમાદ્યં  યન્મે ત્વદન્યેન ન દૃષ્ટપૂર્વમ્ ॥","en":"The Blessed Lord said, \"O Arjuna, this Cosmic Form has graciously been shown to you by Me through My own Yogic power. It is full of splendour, primeval, and infinite; this Cosmic Form of Mine has never been seen before by anyone other than you.\"","hi":"श्रीभगवान् बोले -- हे अर्जुन ! मैंने प्रसन्न होकर अपनी सामर्थ्यसे यह अत्यन्त श्रेष्ठ, तेजोमय, सबका आदि और अनन्त विश्वरूप तुझे दिखाया है, जिसको तुम्हारे सिवाय पहले किसीने नहीं देखा है।"},{"c":11,"v":48,"sp":"krishna","sa":"न वेदयज्ञाध्ययनैर्न दानै  र्न च क्रियाभिर्न तपोभिरुग्रैः ।\nएवंरूपः शक्य अहं नृलोके  द्रष्टुं त्वदन्येन कुरुप्रवीर ॥","tr":"na vedayajñādhyayanairna dānai  rna ca kriyābhirna tapobhirugraiḥ\nevaṃrūpaḥ śakya ahaṃ nṛloke  draṣṭuṃ tvadanyena kurupravīra","gs":"ન વેદયજ્ઞાધ્યયનૈર્ન દાનૈ  ર્ન ચ ક્રિયાભિર્ન તપોભિરુગ્રૈઃ ।\nએવંરૂપઃ શક્ય અહં નૃલોકે  દ્રષ્ટું ત્વદન્યેન કુરુપ્રવીર ॥","en":"Neither by the study of the Vedas, nor by gifts, nor by sacrifices, nor by severe austerities, can I be seen in this form in the world of men by any other than yourself, O great hero of the Kurus (Arjuna).","hi":"हे कुरुप्रवीर! मनुष्यलोकमें इस प्रकारके विश्वरूपवाला मैं न वेदोंके पढ़नेसे, न यज्ञोंके अनुष्ठानसे, न दानसे, न उग्र तपोंसे और न मात्र क्रियाओंसे तेरे (कृपापात्रके) सिवाय और किसीके द्वारा देखा जाना शक्य हूँ।"},{"c":11,"v":49,"sp":"krishna","sa":"मा ते व्यथा मा च विमूढभावो  दृष्ट्वा रूपं घोरमीदृङ्ममेदम् ।\nव्यपेतभीः प्रीतमनाः पुनस्त्वं  तदेव मे रूपमिदं प्रपश्य ॥","tr":"mā te vyathā mā ca vimūḍhabhāvo  dṛṣṭvā rūpaṃ ghoramīdṛṅmamedam\nvyapetabhīḥ prītamanāḥ punastvaṃ  tadeva me rūpamidaṃ prapaśya","gs":"મા તે વ્યથા મા ચ વિમૂઢભાવો  દૃષ્ટ્વા રૂપં ઘોરમીદૃઙ્મમેદમ્ ।\nવ્યપેતભીઃ પ્રીતમનાઃ પુનસ્ત્વં  તદેવ મે રૂપમિદં પ્રપશ્ય ॥","en":"Do not be afraid, nor be bewildered on seeing such a terrible form of Mine; with your fear dispelled and with a gladdened heart, now behold again this former form of Mine.","hi":"यह इस प्रकारका मेरा घोररूप देखकर तेरेको व्यथा नहीं होनी चाहिये और मूढ़भाव भी नहीं होना चाहिये। अब निर्भय और प्रसन्न मनवाला होकर तू फिर उसी मेरे इस (चतुर्भुज) रूपको अच्छी तरह देख ले।"},{"c":11,"v":50,"sp":"sanjaya","sa":"इत्यर्जुनं वासुदेवस्तथोक्त्वा  स्वकं रूपं दर्शयामास भूयः ।\nआश्वासयामास च भीतमेनं  भूत्वा पुनः सौम्यवपुर्महात्मा ॥","tr":"ityarjunaṃ vāsudevastathoktvā  svakaṃ rūpaṃ darśayāmāsa bhūyaḥ\nāśvāsayāmāsa ca bhītamenaṃ  bhūtvā punaḥ saumyavapurmahātmā","gs":"ઇત્યર્જુનં વાસુદેવસ્તથોક્ત્વા  સ્વકં રૂપં દર્શયામાસ ભૂયઃ ।\nઆશ્વાસયામાસ ચ ભીતમેનં  ભૂત્વા પુનઃ સૌમ્યવપુર્મહાત્મા ॥","en":"Sanjaya said, Having thus spoken to Arjuna, Krishna again showed His own form. The great Soul, assuming His gentle form, then consoled Arjuna, who was terrified.","hi":"सञ्जय बोले -- वासुदेवभगवान् ने अर्जुनसे ऐसा कहकर फिर उसी प्रकारसे अपना रूप (देवरूप) दिखाया और महात्मा श्रीकृष्णने पुनः सौम्यवपु (द्विभुजरूप) होकर इस भयभीत अर्जुनको आश्वासन दिया।"},{"c":11,"v":51,"sp":"arjuna","sa":"दृष्ट्वेदं मानुषं रूपं तवसौम्यं जनार्दन ।\nइदानीमस्मि संवृत्तः सचेताः प्रकृतिं गतः ॥","tr":"dṛṣṭvedaṃ mānuṣaṃ rūpaṃ tavasaumyaṃ janārdana\nidānīmasmi saṃvṛttaḥ sacetāḥ prakṛtiṃ gataḥ","gs":"દૃષ્ટ્વેદં માનુષં રૂપં તવસૌમ્યં જનાર્દન ।\nઇદાનીમસ્મિ સંવૃત્તઃ સચેતાઃ પ્રકૃતિં ગતઃ ॥","en":"Arjuna said, \"Having seen this Thy gentle human form, O Krishna, now I am composed and have been restored to my own nature.\"","hi":"अर्जुन बोले -- हे जनार्दन ! आपके इस सौम्य मनुष्यरूपको देखकर मैं इस समय स्थिरचित्त हो गया हूँ और अपनी स्वाभाविक स्थितिको प्राप्त हो गया हूँ।"},{"c":11,"v":52,"sp":"krishna","sa":"सुदुर्दर्शमिदं रूपं दृष्टवानसि यन्मम ।\nदेवा अप्यस्य रूपस्य नित्यं दर्शनकाङ्क्षिणः ॥","tr":"sudurdarśamidaṃ rūpaṃ dṛṣṭavānasi yanmama\ndevā apyasya rūpasya nityaṃ darśanakāṅkṣiṇaḥ","gs":"સુદુર્દર્શમિદં રૂપં દૃષ્ટવાનસિ યન્મમ ।\nદેવા અપ્યસ્ય રૂપસ્ય નિત્યં દર્શનકાઙ્ક્ષિણઃ ॥","en":"The Blessed Lord said, \"It is very hard indeed to see this form of Mine which thou hast seen; even the gods are ever longing to behold it.\"","hi":"श्रीभगवान् बोले -- मेरा यह जो रूप तुमने देखा है, इसके दर्शन अत्यन्त ही दुर्लभ हैं। इस रूपको देखनेके लिये देवता भी नित्य लालायित रहते हैं।"},{"c":11,"v":53,"sp":"krishna","sa":"नाहं वेदैर्न तपसा न दानेन न चेज्यया ।\nशक्य एवंविधो द्रष्टुं दृष्टवानसि मां यथा ॥","tr":"nāhaṃ vedairna tapasā na dānena na cejyayā\nśakya evaṃvidho draṣṭuṃ dṛṣṭavānasi māṃ yathā","gs":"નાહં વેદૈર્ન તપસા ન દાનેન ન ચેજ્યયા ।\nશક્ય એવંવિધો દ્રષ્ટું દૃષ્ટવાનસિ માં યથા ॥","en":"Neither by the Vedas, nor by austerity, nor by gift, nor by sacrifice can I be seen in this form as thou hast seen Me so easily.","hi":"जिस प्रकार तुमने मुझे देखा है, इस प्रकारका (चतुर्भुजरूपवाला) मैं न तो वेदोंसे, न तपसे, न दानसे और न यज्ञसे ही देखा जा सकता हूँ।"},{"c":11,"v":54,"sp":"krishna","sa":"भक्त्या त्वनन्यया शक्यमहमेवंविधोऽर्जुन ।\nज्ञातुं दृष्टुं च तत्त्वेन प्रवेष्टुं च परंतप ॥","tr":"bhaktyā tvananyayā śakyamahamevaṃvidho'rjuna\njñātuṃ dṛṣṭuṃ ca tattvena praveṣṭuṃ ca paraṃtapa","gs":"ભક્ત્યા ત્વનન્યયા શક્યમહમેવંવિધોઽર્જુન ।\nજ્ઞાતું દૃષ્ટું ચ તત્ત્વેન પ્રવેષ્ટું ચ પરંતપ ॥","en":"But by single-minded devotion, I can be known, seen, and entered into in reality, O Arjuna.","hi":"परन्तु हे शत्रुतापन अर्जुन ! इस प्रकार (चतुर्भुजरूपवाला) मैं अनन्यभक्तिसे ही तत्त्वसे जाननेमें, सगुणरूपसे देखनेमें और प्राप्त करनेमें शक्य हूँ।"},{"c":11,"v":55,"sp":"krishna","sa":"मत्कर्मकृन्मत्परमो मद्भक्तः सङ्गवर्जितः ।\nनिर्वैरः सर्वभूतेषु यः स मामेति पाण्डव ॥","tr":"matkarmakṛnmatparamo madbhaktaḥ saṅgavarjitaḥ\nnirvairaḥ sarvabhūteṣu yaḥ sa māmeti pāṇḍava","gs":"મત્કર્મકૃન્મત્પરમો મદ્ભક્તઃ સઙ્ગવર્જિતઃ ।\nનિર્વૈરઃ સર્વભૂતેષુ યઃ સ મામેતિ પાણ્ડવ ॥","en":"He who does all actions for Me, who regards Me as the Supreme, who is devoted to Me, who is free from attachment, who bears no enmity towards any creature, he comes to Me, O Arjuna.","hi":"हे पाण्डवन ! जो मेरे लिये ही कर्म करनेवाला, मेरे ही परायण और मेरा ही भक्त है तथा सर्वथा आसक्तिरहित और प्राणिमात्रके साथ निर्वैर है, वह भक्त मेरेको प्राप्त होता है।"},{"c":12,"v":1,"sp":"arjuna","sa":"एवं सततयुक्ता ये भक्तास्त्वां पर्युपासते ।\nयेचाप्यक्षरमव्यक्तं तेषां के योगवित्तमाः ॥","tr":"evaṃ satatayuktā ye bhaktāstvāṃ paryupāsate\nyecāpyakṣaramavyaktaṃ teṣāṃ ke yogavittamāḥ","gs":"એવં સતતયુક્તા યે ભક્તાસ્ત્વાં પર્યુપાસતે ।\nયેચાપ્યક્ષરમવ્યક્તં તેષાં કે યોગવિત્તમાઃ ॥","en":"Arjuna said, \"Which of them are better versed in Yoga—those who steadfastly worship You, or those who worship the imperishable and the unmanifested?\"","hi":"जो भक्त इस प्रकार निरन्तर आपमें लगे रहकर आप-(सगुण भगवान्-) की उपासना करते हैं और जो अविनाशी निराकारकी ही उपासना करते हैं, उनमेंसे उत्तम योगवेत्ता कौन हैं?"},{"c":12,"v":2,"sp":"krishna","sa":"मय्यावेश्य मनो ये मां नित्ययुक्ता उपासते ।\nश्रद्धया परयोपेतास्ते मे युक्ततमा मताः ॥","tr":"mayyāveśya mano ye māṃ nityayuktā upāsate\nśraddhayā parayopetāste me yuktatamā matāḥ","gs":"મય્યાવેશ્ય મનો યે માં નિત્યયુક્તા ઉપાસતે ।\nશ્રદ્ધયા પરયોપેતાસ્તે મે યુક્તતમા મતાઃ ॥","en":"The Blessed Lord said, \"In My opinion, those who fix their minds on Me, worship Me ever steadfastly, and are endowed with supreme faith, are the best in Yoga.\"","hi":"मेरेमें मनको लगाकर नित्य-निरन्तर मेरेमें लगे हुए जो भक्त परम श्रद्धासे युक्त होकर मेरी उपासना करते हैं, वे मेरे मतमें सर्वश्रेष्ठ योगी हैं।"},{"c":12,"v":3,"sp":"krishna","sa":"ये त्वक्षरमनिर्देश्यमव्यक्तं पर्युपासते ।\nसर्वत्रगमचिन्त्यं च कूटस्थमचलं ध्रुवम् ॥","tr":"ye tvakṣaramanirdeśyamavyaktaṃ paryupāsate\nsarvatragamacintyaṃ ca kūṭasthamacalaṃ dhruvam","gs":"યે ત્વક્ષરમનિર્દેશ્યમવ્યક્તં પર્યુપાસતે ।\nસર્વત્રગમચિન્ત્યં ચ કૂટસ્થમચલં ધ્રુવમ્ ॥","en":"Those who worship the imperishable, the indefinable, the unmanifest, the omnipresent, the unthinkable, the immovable, and the eternal.","hi":"जो अपनी इन्द्रियोंको वशमें करके अचिन्त्य, सब जगह परिपूर्ण, अनिर्देश्य, कूटस्थ, अचल, ध्रुव, अक्षर और अव्यक्तकी उपासना करते हैं, वे प्राणिमात्रके हितमें रत और सब जगह समबुद्धिवाले मनुष्य मुझे ही प्राप्त होते हैं।"},{"c":12,"v":4,"sp":"krishna","sa":"संनियम्येन्द्रियग्रामं सर्वत्र समबुद्धयः ।\nते प्राप्नुवन्ति मामेव सर्वभूतहिते रताः ॥","tr":"saṃniyamyendriyagrāmaṃ sarvatra samabuddhayaḥ\nte prāpnuvanti māmeva sarvabhūtahite ratāḥ","gs":"સંનિયમ્યેન્દ્રિયગ્રામં સર્વત્ર સમબુદ્ધયઃ ।\nતે પ્રાપ્નુવન્તિ મામેવ સર્વભૂતહિતે રતાઃ ॥","en":"Having restrained all the senses, being even-minded everywhere, and intent on the welfare of all beings, they verily come unto Me.","hi":"जो अपनी इन्द्रियोंको वशमें करके अचिन्त्य, सब जगह परिपूर्ण, अनिर्देश्य, कूटस्थ, अचल, ध्रुव, अक्षर और अव्यक्तकी उपासना करते हैं, वे प्राणिमात्रके हितमें रत और सब जगह समबुद्धिवाले मनुष्य मुझे ही प्राप्त होते हैं।"},{"c":12,"v":5,"sp":"krishna","sa":"क्लेशोऽधिकतरस्तेषामव्यक्तासक्तचेतसाम् ।\nअव्यक्ता हि गतिर्दुःखं देहवद्भिरवाप्यते ॥","tr":"kleśo'dhikatarasteṣāmavyaktāsaktacetasām\navyaktā hi gatirduḥkhaṃ dehavadbhiravāpyate","gs":"ક્લેશોઽધિકતરસ્તેષામવ્યક્તાસક્તચેતસામ્ ।\nઅવ્યક્તા હિ ગતિર્દુઃખં દેહવદ્ભિરવાપ્યતે ॥","en":"Greater is their trouble whose minds are set on the unmanifested, for the goal of the unmanifested is very hard for the embodied to reach.","hi":"अव्यक्तमें आसक्त चित्तवाले उन साधकोंको (अपने साधनमें) कष्ट अधिक होता है; क्योंकि देहाभिमानियोंके द्वारा अव्यक्त-विषयक गति कठिनतासे प्राप्त की जाती है।"},{"c":12,"v":6,"sp":"krishna","sa":"ये तु सर्वाणि कर्माणि मयि संन्यस्य मत्पराः ।\nअनन्येनैव योगेन मां ध्यायन्त उपासते ॥","tr":"ye tu sarvāṇi karmāṇi mayi saṃnyasya matparāḥ\nananyenaiva yogena māṃ dhyāyanta upāsate","gs":"યે તુ સર્વાણિ કર્માણિ મયિ સંન્યસ્ય મત્પરાઃ ।\nઅનન્યેનૈવ યોગેન માં ધ્યાયન્ત ઉપાસતે ॥","en":"But to those who worship Me, renouncing all actions in Me, regarding Me as the supreme goal, meditating on Me with single-minded yoga.","hi":"परन्तु जो कर्मोंको मेरे अर्पण करके और मेरे परायण होकर अनन्ययोगसे मेरा ही ध्यान करते हुए मेरी उपासना करते हैं।"},{"c":12,"v":7,"sp":"krishna","sa":"तेषामहं समुद्धर्ता मृत्युसंसारसागरात् ।\nभवामि नचिरात्पार्थ मय्यावेशितचेतसाम् ॥","tr":"teṣāmahaṃ samuddhartā mṛtyusaṃsārasāgarāt\nbhavāmi nacirātpārtha mayyāveśitacetasām","gs":"તેષામહં સમુદ્ધર્તા મૃત્યુસંસારસાગરાત્ ।\nભવામિ નચિરાત્પાર્થ મય્યાવેશિતચેતસામ્ ॥","en":"To those whose minds are set on Me, O Arjuna, verily I soon become the savior out of the ocean of Samsara.","hi":"हे पार्थ ! मेरेमें आविष्ट चित्तवाले उन भक्तोंका मैं मृत्युरूप संसार-समुद्रसे शीघ्र ही उद्धार करनेवाला बन जाता हूँ।"},{"c":12,"v":8,"sp":"krishna","sa":"मय्येव मन आधत्स्व मयि बुद्धिं निवेशय ।\nनिवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः ॥","tr":"mayyeva mana ādhatsva mayi buddhiṃ niveśaya\nnivasiṣyasi mayyeva ata ūrdhvaṃ na saṃśayaḥ","gs":"મય્યેવ મન આધત્સ્વ મયિ બુદ્ધિં નિવેશય ।\nનિવસિષ્યસિ મય્યેવ અત ઊર્ધ્વં ન સંશયઃ ॥","en":"Fix your mind on Me, and your intellect in Me. Then you will certainly live in Me alone hereafter.","hi":"तू मेरेमें मनको लगा और मेरेमें ही बुद्धिको लगा; इसके बाद तू मेरेमें ही निवास करेगा -- इसमें संशय नहीं है।"},{"c":12,"v":9,"sp":"krishna","sa":"अथ चित्तं समाधातुं न शक्नोषि मयि स्थिरम् ।\nअभ्यासयोगेन ततो मामिच्छाप्तुं धनञ्जय ॥","tr":"atha cittaṃ samādhātuṃ na śaknoṣi mayi sthiram\nabhyāsayogena tato māmicchāptuṃ dhanañjaya","gs":"અથ ચિત્તં સમાધાતું ન શક્નોષિ મયિ સ્થિરમ્ ।\nઅભ્યાસયોગેન તતો મામિચ્છાપ્તું ધનઞ્જય ॥","en":"If you are unable to fix your mind steadily on Me, then seek to reach Me through the yoga of constant practice, O Arjuna.","hi":"अगर तू मनको मेरेमें अचलभावसे स्थिर (अर्पण) करनेमें समर्थ नहीं है, तो हे धनञ्जय ! अभ्यासयोगके द्वारा तू मेरी प्राप्तिकी इच्छा कर।"},{"c":12,"v":10,"sp":"krishna","sa":"अभ्यासेऽप्यसमर्थोऽसि मत्कर्मपरमो भव ।\nमदर्थमपि कर्माणि कुर्वन् सिद्धिमवाप्स्यसि ॥","tr":"abhyāse'pyasamartho'si matkarmaparamo bhava\nmadarthamapi karmāṇi kurvan siddhimavāpsyasi","gs":"અભ્યાસેઽપ્યસમર્થોઽસિ મત્કર્મપરમો ભવ ।\nમદર્થમપિ કર્માણિ કુર્વન્ સિદ્ધિમવાપ્સ્યસિ ॥","en":"If you are unable to practice even this Abhyasa Yoga, be intent on doing actions for My sake; even by doing actions for My sake, you will attain perfection.","hi":"अगर तू अभ्यास-(योग-) में भी असमर्थ है, तो मेरे लिये कर्म करनेके परायण हो जा। मेरे लिये कर्मोंको करता हुआ भी तू सिद्धिको प्राप्त हो जायगा।"},{"c":12,"v":11,"sp":"krishna","sa":"अथैतदप्यशक्तोऽसि कर्तुं मद्योगमाश्रितः ।\nसर्वकर्मफलत्यागं ततः कुरु यतात्मवान् ॥","tr":"athaitadapyaśakto'si kartuṃ madyogamāśritaḥ\nsarvakarmaphalatyāgaṃ tataḥ kuru yatātmavān","gs":"અથૈતદપ્યશક્તોઽસિ કર્તું મદ્યોગમાશ્રિતઃ ।\nસર્વકર્મફલત્યાગં તતઃ કુરુ યતાત્મવાન્ ॥","en":"If you are unable to do even this, then, resort to union with Me and renounce the fruits of all actions with self-control.","hi":"अगर मेरे योग-(समता-) के आश्रित हुआ तू इस(पूर्वश्लोकमें कहे गये साधन-) को भी करनेमें असमर्थ है, तो मन-इन्द्रियोंको वशमें करके सम्पूर्ण कर्मोंके फलका त्याग कर।"},{"c":12,"v":12,"sp":"krishna","sa":"श्रेयो हि ज्ञानमभ्यासाज्ज्ञानाद्ध्यानं विशिष्यते ।\nध्यानात्कर्मफलत्यागस्त्यागाच्छान्तिरनन्तरम् ॥","tr":"śreyo hi jñānamabhyāsājjñānāddhyānaṃ viśiṣyate\ndhyānātkarmaphalatyāgastyāgācchāntiranantaram","gs":"શ્રેયો હિ જ્ઞાનમભ્યાસાજ્જ્ઞાનાદ્ધ્યાનં વિશિષ્યતે ।\nધ્યાનાત્કર્મફલત્યાગસ્ત્યાગાચ્છાન્તિરનન્તરમ્ ॥","en":"Better indeed is knowledge than practice; better than knowledge is meditation; better than meditation is the renunciation of the fruits of actions: peace immediately follows renunciation.","hi":"अभ्याससे शास्त्रज्ञान श्रेष्ठ है, शास्त्रज्ञानसे ध्यान श्रेष्ठ है और ध्यानसे भी सब कर्मोंके फलका त्याग श्रेष्ठ है। कर्मफलत्यागसे तत्काल ही परमशान्ति प्राप्त हो जाती है।"},{"c":12,"v":13,"sp":"krishna","sa":"अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च ।\nनिर्ममो निरहङ्कारः समदुःखसुखः क्षमी ॥","tr":"adveṣṭā sarvabhūtānāṃ maitraḥ karuṇa eva ca\nnirmamo nirahaṅkāraḥ samaduḥkhasukhaḥ kṣamī","gs":"અદ્વેષ્ટા સર્વભૂતાનાં મૈત્રઃ કરુણ એવ ચ ।\nનિર્મમો નિરહઙ્કારઃ સમદુઃખસુખઃ ક્ષમી ॥","en":"He who hates no creature, is friendly and compassionate to all, is free from attachment and egoism, is balanced in pleasure and pain, and is forgiving.","hi":"सब प्राणियोंमें द्वेषभावसे रहित, सबका मित्र (प्रेमी) और दयालु, ममतारहित, अहंकाररहित, सुखदुःखकी प्राप्तिमें सम, क्षमाशील, निरन्तर सन्तुष्ट, योगी, शरीरको वशमें किये हुए, दृढ़ निश्चयवाला? मेरेमें अर्पित मनबुद्धिवाला जो मेरा भक्त है, वह मेरेको प्रिय है।"},{"c":12,"v":14,"sp":"krishna","sa":"सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः ।\nमय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः ॥","tr":"santuṣṭaḥ satataṃ yogī yatātmā dṛḍhaniścayaḥ\nmayyarpitamanobuddhiryo madbhaktaḥ sa me priyaḥ","gs":"સન્તુષ્ટઃ સતતં યોગી યતાત્મા દૃઢનિશ્ચયઃ ।\nમય્યર્પિતમનોબુદ્ધિર્યો મદ્ભક્તઃ સ મે પ્રિયઃ ॥","en":"Ever content, steady in meditation, self-controlled, possessing firm conviction, with the mind and intellect dedicated to Me, he, My devotee, is dear to Me.","hi":"सब प्राणियोंमें द्वेषभावसे रहित, सबका मित्र (प्रेमी) और दयालु, ममतारहित, अहंकाररहित, सुखदुःखकी प्राप्तिमें सम, क्षमाशील, निरन्तर सन्तुष्ट,योगी, शरीरको वशमें किये हुए, दृढ़ निश्चयवाला, मेरेमें अर्पित मन-बुद्धिवाला जो मेरा भक्त है, वह मेरेको प्रिय है।"},{"c":12,"v":15,"sp":"krishna","sa":"यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः ।\nहर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः ॥","tr":"yasmānnodvijate loko lokānnodvijate ca yaḥ\nharṣāmarṣabhayodvegairmukto yaḥ sa ca me priyaḥ","gs":"યસ્માન્નોદ્વિજતે લોકો લોકાન્નોદ્વિજતે ચ યઃ ।\nહર્ષામર્ષભયોદ્વેગૈર્મુક્તો યઃ સ ચ મે પ્રિયઃ ॥","en":"He whom the world does not agitate, and who cannot be agitated by the world, and who is freed from joy, anger, fear, and anxiety—he is dear to Me.","hi":"जिससे किसी प्राणीको उद्वेग नहीं होता और जिसको खुद भी किसी प्राणीसे उद्वेग नहीं होता तथा जो हर्ष, अमर्ष (ईर्ष्या), भय और उद्वेगसे रहित है, वह मुझे प्रिय है।"},{"c":12,"v":16,"sp":"krishna","sa":"अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः ।\nसर्वारम्भपरित्यागी यो मद्भक्तः स मे प्रियः ॥","tr":"anapekṣaḥ śucirdakṣa udāsīno gatavyathaḥ\nsarvārambhaparityāgī yo madbhaktaḥ sa me priyaḥ","gs":"અનપેક્ષઃ શુચિર્દક્ષ ઉદાસીનો ગતવ્યથઃ ।\nસર્વારમ્ભપરિત્યાગી યો મદ્ભક્તઃ સ મે પ્રિયઃ ॥","en":"He who is free from wants, pure, expert, unconcerned, and free from pain, renouncing all undertakings and commencements, he who is devoted to Me is dear to Me.","hi":"जो आकाङ्क्षासे रहित, बाहर-भीतरसे पवित्र, दक्ष, उदासीन, व्यथासे रहित और सभी आरम्भोंका अर्थात् नये-नये कर्मोंके आरम्भका सर्वथा त्यागी है, वह मेरा भक्त मुझे प्रिय है।"},{"c":12,"v":17,"sp":"krishna","sa":"यो न हृष्यति न द्वेष्टि न शोचति न काङ्क्षति ।\nशुभाशुभपरित्यागी भक्ितमान्यः स मे प्रियः ॥","tr":"yo na hṛṣyati na dveṣṭi na śocati na kāṅkṣati\nśubhāśubhaparityāgī bhakitamānyaḥ sa me priyaḥ","gs":"યો ન હૃષ્યતિ ન દ્વેષ્ટિ ન શોચતિ ન કાઙ્ક્ષતિ ।\nશુભાશુભપરિત્યાગી ભક્િતમાન્યઃ સ મે પ્રિયઃ ॥","en":"He who neither rejoices nor hates, nor grieves nor desires, renouncing both good and evil, and who is full of devotion, is dear to Me.","hi":"जो न कभी हर्षित होता है, न द्वेष करता है, न शोक करता है, न कामना करता है और जो शुभ-अशुभ कर्मोंमें राग-द्वेषका त्यागी है, वह भक्तिमान् मनुष्य मुझे प्रिय है।"},{"c":12,"v":18,"sp":"krishna","sa":"समः शत्रौ च मित्रे च तथा मानापमानयोः ।\nशीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः ॥","tr":"samaḥ śatrau ca mitre ca tathā mānāpamānayoḥ\nśītoṣṇasukhaduḥkheṣu samaḥ saṅgavivarjitaḥ","gs":"સમઃ શત્રૌ ચ મિત્રે ચ તથા માનાપમાનયોઃ ।\nશીતોષ્ણસુખદુઃખેષુ સમઃ સઙ્ગવિવર્જિતઃ ॥","en":"He who is the same to foe and friend, and also in honor and dishonor, who is the same in cold and heat, in pleasure and pain, and who is free from attachment.","hi":"जो शत्रु और मित्रमें तथा मान-अपमानमें सम है और शीत-उष्ण (अनुकूलता-प्रतिकूलता) तथा सुख-दुःखमें सम है एवं आसक्तिसे रहित है, और जो निन्दास्तुतिको समान समझनेवाला, मननशील, जिस-किसी प्रकारसे भी (शरीरका निर्वाह होनेमें) संतुष्ट, रहनेके स्थान तथा शरीरमें ममता-आसक्तिसे रहित और स्थिर बुद्धिवाला है, वह भक्तिमान् मनुष्य मुझे प्रिय है।"},{"c":12,"v":19,"sp":"krishna","sa":"तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येनकेनचित् ।\nअनिकेतः स्थिरमतिर्भक्ितमान्मे प्रियो नरः ॥","tr":"tulyanindāstutirmaunī santuṣṭo yenakenacit\naniketaḥ sthiramatirbhakitamānme priyo naraḥ","gs":"તુલ્યનિન્દાસ્તુતિર્મૌની સન્તુષ્ટો યેનકેનચિત્ ।\nઅનિકેતઃ સ્થિરમતિર્ભક્િતમાન્મે પ્રિયો નરઃ ॥","en":"He to whom censure and praise are equal, who is silent, content with anything, homeless, of a steady mind, and full of devotion; that man is dear to me.","hi":"जो शत्रु और मित्रमें तथा मान-अपमानमें सम है और शीतउष्ण (अनुकूलता-प्रतिकूलता) तथा सुख-दुःखमें सम है एवं आसक्तिसे रहित है, और जो निन्दा-स्तुतिको समान समझनेवाला, मननशील, जिस-किसी प्रकारसे भी (शरीरका निर्वाह होनेमें) संतुष्ट, रहनेके स्थान तथा शरीरमें ममता-आसक्तिसे रहित और स्थिर बुद्धिवाला है, वह भक्तिमान् मनुष्य मुझे प्रिय है।"},{"c":12,"v":20,"sp":"krishna","sa":"ये तु धर्म्यामृतमिदं यथोक्तं पर्युपासते ।\nश्रद्दधाना मत्परमा भक्तास्तेऽतीव मे प्रियाः ॥","tr":"ye tu dharmyāmṛtamidaṃ yathoktaṃ paryupāsate\nśraddadhānā matparamā bhaktāste'tīva me priyāḥ","gs":"યે તુ ધર્મ્યામૃતમિદં યથોક્તં પર્યુપાસતે ।\nશ્રદ્દધાના મત્પરમા ભક્તાસ્તેઽતીવ મે પ્રિયાઃ ॥","en":"They who follow this immortal Dharma, endowed with faith and regarding Me as their supreme goal, are exceedingly dear to Me.","hi":"जो मेरेमें श्रद्धा रखनेवाले और मेरे परायण हुए भक्त पहले कहे हुए इस धर्ममय अमृतका अच्छी तरहसे सेवन करते हैं, वे मुझे अत्यन्त प्रिय हैं।"},{"c":13,"v":1,"sp":"arjuna","sa":"प्रकृतिं पुरुषं चैव क्षेत्रं क्षेत्रज्ञमेव च ।\nएतद्वेदितुमिच्छामि ज्ञानं ज्ञेयं च केशव ॥","tr":"prakṛtiṃ puruṣaṃ caiva kṣetraṃ kṣetrajñameva ca\netadveditumicchāmi jñānaṃ jñeyaṃ ca keśava","gs":"પ્રકૃતિં પુરુષં ચૈવ ક્ષેત્રં ક્ષેત્રજ્ઞમેવ ચ ।\nએતદ્વેદિતુમિચ્છામિ જ્ઞાનં જ્ઞેયં ચ કેશવ ॥","en":"Arjuna said, \"I wish to learn about Nature and the Spirit, the field and the knower of the field, knowledge and that which ought to be known, O Kesava.\"","hi":"No Translation"},{"c":13,"v":2,"sp":"krishna","sa":"इदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते ।\nएतद्यो वेत्ति तं प्राहुः क्षेत्रज्ञ इति तद्विदः ॥","tr":"idaṃ śarīraṃ kaunteya kṣetramityabhidhīyate\netadyo vetti taṃ prāhuḥ kṣetrajña iti tadvidaḥ","gs":"ઇદં શરીરં કૌન્તેય ક્ષેત્રમિત્યભિધીયતે ।\nએતદ્યો વેત્તિ તં પ્રાહુઃ ક્ષેત્રજ્ઞ ઇતિ તદ્વિદઃ ॥","en":"The Blessed Lord said, \"O Arjuna, this body is called the field; he who knows it is called the knower of the field by those who know them.\"","hi":"श्रीभगवान् बोले -- हे कुन्तीपुत्र अर्जुन ! 'यह' -- रूपसे कहे जानेवाले शरीरको 'क्षेत्र' कहते हैं और इस क्षेत्रको जो जानता है, उसको ज्ञानीलोग 'क्षेत्रज्ञ' नामसे कहते हैं।"},{"c":13,"v":3,"sp":"krishna","sa":"क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत ।\nक्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम ॥","tr":"kṣetrajñaṃ cāpi māṃ viddhi sarvakṣetreṣu bhārata\nkṣetrakṣetrajñayorjñānaṃ yattajjñānaṃ mataṃ mama","gs":"ક્ષેત્રજ્ઞં ચાપિ માં વિદ્ધિ સર્વક્ષેત્રેષુ ભારત ।\nક્ષેત્રક્ષેત્રજ્ઞયોર્જ્ઞાનં યત્તજ્જ્ઞાનં મતં મમ ॥","en":"Do thou also know Me as the knower of the field in all fields, O Arjuna. Knowledge of both the field and the knower of the field is considered by Me to be the knowledge.","hi":"हे भरतवंशोद्भव अर्जुन ! तू सम्पूर्ण क्षेत्रोंमें क्षेत्रज्ञ मेरेको ही समझ; और क्षेत्र-क्षेत्रज्ञका जो ज्ञान है, वही मेरे मतमें ज्ञान है।"},{"c":13,"v":4,"sp":"krishna","sa":"तत्क्षेत्रं यच्च यादृक् च यद्विकारि यतश्च यत् ।\nस च यो यत्प्रभावश्च तत्समासेन मे श्रृणु ॥","tr":"tatkṣetraṃ yacca yādṛk ca yadvikāri yataśca yat\nsa ca yo yatprabhāvaśca tatsamāsena me śrṛṇu","gs":"તત્ક્ષેત્રં યચ્ચ યાદૃક્ ચ યદ્વિકારિ યતશ્ચ યત્ ।\nસ ચ યો યત્પ્રભાવશ્ચ તત્સમાસેન મે શ્રૃણુ ॥","en":"Hear from Me in brief what the field is, of what nature it is, what its modifications are, whence it is, who He is, and what His powers are.","hi":"वह क्षेत्र जो है, जैसा है, जिन विकारोंवाला है और जिससे जो पैदा हुआ है; तथा वह क्षेत्रज्ञ भी जो है और जिस प्रभाववाला है, वह सब संक्षेपमें मेरेसे सुन।"},{"c":13,"v":5,"sp":"krishna","sa":"ऋषिभिर्बहुधा गीतं छन्दोभिर्विविधैः पृथक् ।\nब्रह्मसूत्रपदैश्चैव हेतुमद्भिर्विनिश्िचतैः ॥","tr":"ṛṣibhirbahudhā gītaṃ chandobhirvividhaiḥ pṛthak\nbrahmasūtrapadaiścaiva hetumadbhirviniśicataiḥ","gs":"ઋષિભિર્બહુધા ગીતં છન્દોભિર્વિવિધૈઃ પૃથક્ ।\nબ્રહ્મસૂત્રપદૈશ્ચૈવ હેતુમદ્ભિર્વિનિશ્િચતૈઃ ॥","en":"Sages have sung in many ways, with various distinctive chants and also with suggestive words indicative of the Absolute, full of reasoning and decisive.","hi":"(यह क्षेत्रक्षेत्रज्ञका तत्त्व) ऋषियोंके द्वारा बहुत विस्तारसे कहा गया है तथा वेदोंकी ऋचाओं-द्वारा बहुत प्रकारसे कहा गया है और युक्तियुक्त एवं निश्चित किये हुए ब्रह्मसूत्रके पदोंद्वारा भी कहा गया है।"},{"c":13,"v":6,"sp":"krishna","sa":"महाभूतान्यहङ्कारो बुद्धिरव्यक्तमेव च ।\nइन्द्रियाणि दशैकं च पञ्च चेन्द्रियगोचराः ॥","tr":"mahābhūtānyahaṅkāro buddhiravyaktameva ca\nindriyāṇi daśaikaṃ ca pañca cendriyagocarāḥ","gs":"મહાભૂતાન્યહઙ્કારો બુદ્ધિરવ્યક્તમેવ ચ ।\nઇન્દ્રિયાણિ દશૈકં ચ પઞ્ચ ચેન્દ્રિયગોચરાઃ ॥","en":"The great elements, egoism, intellect, and also the Unmanifested Nature, the ten senses, and one mind, and the five objects of the senses.","hi":"मूल प्रकृति, समष्टि बुद्धि (महत्तत्त्व), समष्टि अहंकार, पाँच महाभूत और दस इन्द्रियाँ, एक मन तथा पाँचों इन्द्रियोंके पाँच विषय ( -- यह चौबीस तत्त्वोंवाला क्षेत्र है)।"},{"c":13,"v":7,"sp":"krishna","sa":"इच्छा द्वेषः सुखं दुःखं सङ्घातश्चेतनाधृतिः ।\nएतत्क्षेत्रं समासेन सविकारमुदाहृतम् ॥","tr":"icchā dveṣaḥ sukhaṃ duḥkhaṃ saṅghātaścetanādhṛtiḥ\netatkṣetraṃ samāsena savikāramudāhṛtam","gs":"ઇચ્છા દ્વેષઃ સુખં દુઃખં સઙ્ઘાતશ્ચેતનાધૃતિઃ ।\nએતત્ક્ષેત્રં સમાસેન સવિકારમુદાહૃતમ્ ॥","en":"Desire, hatred, pleasure, pain, the aggregate (body), intelligence, and fortitude—the field has thus been briefly described with its modifications.","hi":"इच्छा, द्वेष, सुख, दुःख, संघात, चेतना (प्राणशक्ति) और धृति -- इन विकारोंसहित यह क्षेत्र संक्षेपसे कहा गया है।"},{"c":13,"v":8,"sp":"krishna","sa":"अमानित्वमदम्भित्वमहिंसा क्षान्तिरार्जवम् ।\nआचार्योपासनं शौचं स्थैर्यमात्मविनिग्रहः ॥","tr":"amānitvamadambhitvamahiṃsā kṣāntirārjavam\nācāryopāsanaṃ śaucaṃ sthairyamātmavinigrahaḥ","gs":"અમાનિત્વમદમ્ભિત્વમહિંસા ક્ષાન્તિરાર્જવમ્ ।\nઆચાર્યોપાસનં શૌચં સ્થૈર્યમાત્મવિનિગ્રહઃ ॥","en":"Humility, unpretentiousness, non-injury, forgiveness, uprightness, service to the teacher, purity, steadfastness, and self-control.","hi":"मानित्व-(अपनेमें श्रेष्ठताके भाव-) का न होना, दम्भित्व-(दिखावटीपन-) का न होना, अहिंसा, क्षमा, सरलता, गुरुकी सेवा, बाहर-भीतरकी शुद्धि, स्थिरता और मनका वशमें होना।"},{"c":13,"v":9,"sp":"krishna","sa":"इन्द्रियार्थेषु वैराग्यमनहङ्कार एव च ।\nजन्ममृत्युजराव्याधिदुःखदोषानुदर्शनम् ॥","tr":"indriyārtheṣu vairāgyamanahaṅkāra eva ca\njanmamṛtyujarāvyādhiduḥkhadoṣānudarśanam","gs":"ઇન્દ્રિયાર્થેષુ વૈરાગ્યમનહઙ્કાર એવ ચ ।\nજન્મમૃત્યુજરાવ્યાધિદુઃખદોષાનુદર્શનમ્ ॥","en":"Indifference to the objects of the senses and also absence of egoism; perceiving the evil in birth, death, old age, sickness, and pain.","hi":"इन्द्रियोंके विषयोंमें वैराग्यका होना, अहंकारका भी न होना और जन्म, मृत्यु, वृद्धावस्था तथा व्याधियोंमें दुःखरूप दोषोंको बार-बार देखना।"},{"c":13,"v":10,"sp":"krishna","sa":"असक्ितरनभिष्वङ्गः पुत्रदारगृहादिषु ।\nनित्यं च समचित्तत्वमिष्टानिष्टोपपत्तिषु ॥","tr":"asakitaranabhiṣvaṅgaḥ putradāragṛhādiṣu\nnityaṃ ca samacittatvamiṣṭāniṣṭopapattiṣu","gs":"અસક્િતરનભિષ્વઙ્ગઃ પુત્રદારગૃહાદિષુ ।\nનિત્યં ચ સમચિત્તત્વમિષ્ટાનિષ્ટોપપત્તિષુ ॥","en":"Non-attachment, non-identification of the Self with son, wife, home, and the rest, and constant even-mindedness in the face of the attainment of both desirable and undesirable.","hi":"आसक्तिरहित होना; पुत्र, स्त्री, घर आदिमें एकात्मता (घनिष्ठ सम्बन्ध) न होना और अनुकूलता-प्रतिकूलताकी प्राप्तिमें चित्तका नित्य सम रहना।"},{"c":13,"v":11,"sp":"krishna","sa":"मयि चानन्ययोगेन भक्ितरव्यभिचारिणी ।\nविविक्तदेशसेवित्वमरतिर्जनसंसदि ॥","tr":"mayi cānanyayogena bhakitaravyabhicāriṇī\nviviktadeśasevitvamaratirjanasaṃsadi","gs":"મયિ ચાનન્યયોગેન ભક્િતરવ્યભિચારિણી ।\nવિવિક્તદેશસેવિત્વમરતિર્જનસંસદિ ॥","en":"Unswerving devotion to Me through the Yoga of non-separation, resorting to solitary places, and a distaste for the company of people.","hi":"मेरेमें अनन्ययोगके द्वारा अव्यभिचारिणी भक्तिका होना, एकान्त स्थानमें रहनेका स्वभाव होना और जन-समुदायमें प्रीतिका न होना।"},{"c":13,"v":12,"sp":"krishna","sa":"अध्यात्मज्ञाननित्यत्वं तत्त्वज्ञानार्थदर्शनम् ।\nएतज्ज्ञानमिति प्रोक्तमज्ञानं यदतोन्यथा ॥","tr":"adhyātmajñānanityatvaṃ tattvajñānārthadarśanam\netajjñānamiti proktamajñānaṃ yadatonyathā","gs":"અધ્યાત્મજ્ઞાનનિત્યત્વં તત્ત્વજ્ઞાનાર્થદર્શનમ્ ।\nએતજ્જ્ઞાનમિતિ પ્રોક્તમજ્ઞાનં યદતોન્યથા ॥","en":"Constancy in Self-knowledge, the perception of the end of true knowledge—this is declared to be knowledge, and what is opposed to it is ignorance.","hi":"अध्यात्मज्ञानमें नित्य-निरन्तर रहना, तत्त्वज्ञानके अर्थरूप परमात्माको सब जगह देखना -- यह (पूर्वोक्त साधन-समुदाय) तो ज्ञान है; और जो इसके विपरीत है वह अज्ञान है -- ऐसा कहा गया है।"},{"c":13,"v":13,"sp":"krishna","sa":"ज्ञेयं यत्तत्प्रवक्ष्यामि यज्ज्ञात्वाऽमृतमश्नुते ।\nअनादिमत्परं ब्रह्म न सत्तन्नासदुच्यते ॥","tr":"jñeyaṃ yattatpravakṣyāmi yajjñātvā'mṛtamaśnute\nanādimatparaṃ brahma na sattannāsaducyate","gs":"જ્ઞેયં યત્તત્પ્રવક્ષ્યામિ યજ્જ્ઞાત્વાઽમૃતમશ્નુતે ।\nઅનાદિમત્પરં બ્રહ્મ ન સત્તન્નાસદુચ્યતે ॥","en":"I will declare that which is to be known, knowing which one attains immortality; the beginningless Supreme Brahman, which is neither being nor non-being.","hi":"जो ज्ञेय है, उस-(परमात्मतत्त्व-) को मैं अच्छी तरहसे कहूँगा, जिसको जानकर मनुष्य अमरताका अनुभव कर लेता है। वह (ज्ञेय-तत्त्व) अनादि और परम ब्रह्म है। उसको न सत् कहा जा सकता है और न असत् ही कहा जा सकता है।"},{"c":13,"v":14,"sp":"krishna","sa":"सर्वतः पाणिपादं तत्सर्वतोऽक्षिशिरोमुखम् ।\nसर्वतः श्रुतिमल्लोके सर्वमावृत्य तिष्ठति ॥","tr":"sarvataḥ pāṇipādaṃ tatsarvato'kṣiśiromukham\nsarvataḥ śrutimalloke sarvamāvṛtya tiṣṭhati","gs":"સર્વતઃ પાણિપાદં તત્સર્વતોઽક્ષિશિરોમુખમ્ ।\nસર્વતઃ શ્રુતિમલ્લોકે સર્વમાવૃત્ય તિષ્ઠતિ ॥","en":"With hands and feet everywhere, with eyes, heads, and mouths everywhere, with ears everywhere, He exists in the worlds, enveloping all.","hi":"वे (परमात्मा) सब जगह हाथों और पैरोंवाले, सब जगह नेत्रों, सिरों और मुखोंवाले तथा सब जगह कानोंवाले हैं। वे संसारमें सबको व्याप्त करके स्थित हैं।"},{"c":13,"v":15,"sp":"krishna","sa":"सर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितम् ।\nअसक्तं सर्वभृच्चैव निर्गुणं गुणभोक्तृ च ॥","tr":"sarvendriyaguṇābhāsaṃ sarvendriyavivarjitam\nasaktaṃ sarvabhṛccaiva nirguṇaṃ guṇabhoktṛ ca","gs":"સર્વેન્દ્રિયગુણાભાસં સર્વેન્દ્રિયવિવર્જિતમ્ ।\nઅસક્તં સર્વભૃચ્ચૈવ નિર્ગુણં ગુણભોક્તૃ ચ ॥","en":"Shining by the functions of all the senses, yet without being attached to them; unattached, yet supporting all; devoid of qualities, yet the experiencer of them.","hi":"वे (परमात्मा) सम्पूर्ण इन्द्रियोंसे रहित हैं और सम्पूर्ण इन्द्रियोंके विषयोंको प्रकाशित करनेवाले हैं; आसक्तिरहित हैं और सम्पूर्ण संसारका भरण-पोषण करनेवाले हैं; तथा गुणोंसे रहित हैं और सम्पूर्ण गुणोंके भोक्ता हैं।"},{"c":13,"v":16,"sp":"krishna","sa":"बहिरन्तश्च भूतानामचरं चरमेव च ।\nसूक्ष्मत्वात्तदविज्ञेयं दूरस्थं चान्तिके च तत् ॥","tr":"bahirantaśca bhūtānāmacaraṃ carameva ca\nsūkṣmatvāttadavijñeyaṃ dūrasthaṃ cāntike ca tat","gs":"બહિરન્તશ્ચ ભૂતાનામચરં ચરમેવ ચ ।\nસૂક્ષ્મત્વાત્તદવિજ્ઞેયં દૂરસ્થં ચાન્તિકે ચ તત્ ॥","en":"It is within and without all beings, both the unmoving and the moving; It is subtle and unknowable, and It is near and far away.","hi":"वे परमात्मा सम्पूर्ण प्राणियोंके बाहर-भीतर परिपूर्ण हैं और चर-अचर प्राणियोंके रूपमें भी वे ही हैं एवं दूर-से-दूर तथा नजदीक-से-नजदीक भी वे ही हैं। वे अत्यन्त सूक्ष्म होनेसे जाननेका विषय नहीं हैं।"},{"c":13,"v":17,"sp":"krishna","sa":"अविभक्तं च भूतेषु विभक्तमिव च स्थितम् ।\nभूतभर्तृ च तज्ज्ञेयं ग्रसिष्णु प्रभविष्णु च ॥","tr":"avibhaktaṃ ca bhūteṣu vibhaktamiva ca sthitam\nbhūtabhartṛ ca tajjñeyaṃ grasiṣṇu prabhaviṣṇu ca","gs":"અવિભક્તં ચ ભૂતેષુ વિભક્તમિવ ચ સ્થિતમ્ ।\nભૂતભર્તૃ ચ તજ્જ્ઞેયં ગ્રસિષ્ણુ પ્રભવિષ્ણુ ચ ॥","en":"Undivided yet, It exists as if divided in beings; It is to be known as the supporter of beings; It devours and It generates.","hi":"वे परमात्मा स्वयं विभागरहित होते हुए भी सम्पूर्ण प्राणियोंमें विभक्तकी तरह स्थित हैं। वे जाननेयोग्य परमात्मा ही सम्पूर्ण प्राणियोंको उत्पन्न करनेवाले, उनका भरण-पोषण करनेवाले और संहार करनेवाले हैं।"},{"c":13,"v":18,"sp":"krishna","sa":"ज्योतिषामपि तज्ज्योतिस्तमसः परमुच्यते ।\nज्ञानं ज्ञेयं ज्ञानगम्यं हृदि सर्वस्य विष्ठितम् ॥","tr":"jyotiṣāmapi tajjyotistamasaḥ paramucyate\njñānaṃ jñeyaṃ jñānagamyaṃ hṛdi sarvasya viṣṭhitam","gs":"જ્યોતિષામપિ તજ્જ્યોતિસ્તમસઃ પરમુચ્યતે ।\nજ્ઞાનં જ્ઞેયં જ્ઞાનગમ્યં હૃદિ સર્વસ્ય વિષ્ઠિતમ્ ॥","en":"That Light of all lights is said to be beyond darkness: knowledge, the knowable, and the goal of knowledge, seated in the hearts of all.","hi":"वह परमात्मा सम्पूर्ण ज्योतियोंका भी ज्योति और अज्ञानसे अत्यन्त परे कहा गया है। वह ज्ञानस्वरूप, जाननेयोग्य, ज्ञान(साधन-समुदाय) से प्राप्त करनेयोग्य और सबके हृदयमें विराजमान है।"},{"c":13,"v":19,"sp":"krishna","sa":"इति क्षेत्रं तथा ज्ञानं ज्ञेयं चोक्तं समासतः ।\nमद्भक्त एतद्विज्ञाय मद्भावायोपपद्यते ॥","tr":"iti kṣetraṃ tathā jñānaṃ jñeyaṃ coktaṃ samāsataḥ\nmadbhakta etadvijñāya madbhāvāyopapadyate","gs":"ઇતિ ક્ષેત્રં તથા જ્ઞાનં જ્ઞેયં ચોક્તં સમાસતઃ ।\nમદ્ભક્ત એતદ્વિજ્ઞાય મદ્ભાવાયોપપદ્યતે ॥","en":"Thus, the field, as well as knowledge and the knowable, have been briefly stated. My devotee, knowing this, enters into My being.","hi":"इस प्रकार क्षेत्र, ज्ञान और ज्ञेयको संक्षेपसे कहा गया। मेरा भक्त इसको तत्त्वसे जानकर मेरे भावको प्राप्त हो जाता है।"},{"c":13,"v":20,"sp":"krishna","sa":"प्रकृतिं पुरुषं चैव विद्ध्यनादी उभावपि ।\nविकारांश्च गुणांश्चैव विद्धि प्रकृतिसंभवान् ॥","tr":"prakṛtiṃ puruṣaṃ caiva viddhyanādī ubhāvapi\nvikārāṃśca guṇāṃścaiva viddhi prakṛtisaṃbhavān","gs":"પ્રકૃતિં પુરુષં ચૈવ વિદ્ધ્યનાદી ઉભાવપિ ।\nવિકારાંશ્ચ ગુણાંશ્ચૈવ વિદ્ધિ પ્રકૃતિસંભવાન્ ॥","en":"Know that Nature (matter) and the Spirit are both beginningless, and know also that all modifications and qualities are born from Nature.","hi":"प्रकृति और पुरुष -- दोनोंको ही तुम अनादि समझो और विकारों तथा गुणोंको भी प्रकृतिसे ही उत्पन्न समझो। कार्य और करणके द्वारा होनेवाली क्रियाओंको उत्पन्न करनेमें प्रकृति हेतु कही जाती है और सुख-दुःखोंके भोक्तापनमें पुरुष हेतु कहा जाता है।"},{"c":13,"v":21,"sp":"krishna","sa":"कार्यकारणकर्तृत्वे हेतुः प्रकृतिरुच्यते ।\nपुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते ॥","tr":"kāryakāraṇakartṛtve hetuḥ prakṛtirucyate\npuruṣaḥ sukhaduḥkhānāṃ bhoktṛtve heturucyate","gs":"કાર્યકારણકર્તૃત્વે હેતુઃ પ્રકૃતિરુચ્યતે ।\nપુરુષઃ સુખદુઃખાનાં ભોક્તૃત્વે હેતુરુચ્યતે ॥","en":"In the production of the effect and the cause, Nature (matter) is said to be the cause; in the experience of pleasure and pain, the soul is said to be the one responsible.","hi":"प्रकृति और पुरुष -- दोनोंको ही तुम अनादि समझो और विकारों तथा गुणोंको भी प्रकृतिसे ही उत्पन्न समझो। कार्य और करणके द्वारा होनेवाली क्रियाओंको उत्पन्न करनेमें प्रकृति हेतु कही जाती है और सुखदुःखोंके भोक्तापनमें पुरुष हेतु कहा जाता है।"},{"c":13,"v":22,"sp":"krishna","sa":"पुरुषः प्रकृतिस्थो हि भुङ्क्ते प्रकृतिजान्गुणान् ।\nकारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु ॥","tr":"puruṣaḥ prakṛtistho hi bhuṅkte prakṛtijānguṇān\nkāraṇaṃ guṇasaṅgo'sya sadasadyonijanmasu","gs":"પુરુષઃ પ્રકૃતિસ્થો હિ ભુઙ્ક્તે પ્રકૃતિજાન્ગુણાન્ ।\nકારણં ગુણસઙ્ગોઽસ્ય સદસદ્યોનિજન્મસુ ॥","en":"The soul seated in Nature experiences the qualities born of Nature; attachment to the qualities is the cause of its birth in good and evil wombs.","hi":"प्रकृतिमें स्थित पुरुष ही प्रकृतिजन्य गुणोंका भोक्ता बनता है और गुणोंका सङ्ग ही उसके ऊँच-नीच योनियोंमें जन्म लेनेका कारण बनता है।"},{"c":13,"v":23,"sp":"krishna","sa":"उपद्रष्टाऽनुमन्ता च भर्ता भोक्ता महेश्वरः ।\nपरमात्मेति चाप्युक्तो देहेऽस्मिन्पुरुषः परः ॥","tr":"upadraṣṭā'numantā ca bhartā bhoktā maheśvaraḥ\nparamātmeti cāpyukto dehe'sminpuruṣaḥ paraḥ","gs":"ઉપદ્રષ્ટાઽનુમન્તા ચ ભર્તા ભોક્તા મહેશ્વરઃ ।\nપરમાત્મેતિ ચાપ્યુક્તો દેહેઽસ્મિન્પુરુષઃ પરઃ ॥","en":"The Supreme Soul in this body is also called the observer, the permitter, the sustainer, the enjoyer, the great Lord, and the Supreme Self.","hi":"यह पुरुष प्रकृति-(शरीर-) के साथ सम्बन्ध रखनेसे 'उपद्रष्टा', उसके साथ मिलकर सम्मति, अनुमति देनेसे 'अनुमन्ता', अपनेको उसका भरणपोषण करनेवाला माननेसे 'भर्ता', उसके सङ्गसे सुखदुःख भोगनेसे 'भोक्ता', और अपनेको उसका स्वामी माननेसे 'महेश्वर' बन जाता है। परन्तु स्वरूपसे यह पुरुष 'परमात्मा' कहा जाता है। यह देहमें रहता हुआ भी देहसे पर (सम्बन्ध-रहित) ही है।"},{"c":13,"v":24,"sp":"krishna","sa":"य एवं वेत्ति पुरुषं प्रकृतिं च गुणैःसह ।\nसर्वथा वर्तमानोऽपि न स भूयोऽभिजायते ॥","tr":"ya evaṃ vetti puruṣaṃ prakṛtiṃ ca guṇaiḥsaha\nsarvathā vartamāno'pi na sa bhūyo'bhijāyate","gs":"ય એવં વેત્તિ પુરુષં પ્રકૃતિં ચ ગુણૈઃસહ ।\nસર્વથા વર્તમાનોઽપિ ન સ ભૂયોઽભિજાયતે ॥","en":"He who thus knows the Spirit and Matter together with their qualities, in whatever condition he may be, he is not reborn.","hi":"इस प्रकार पुरुषको और गुणोंके सहित प्रकृतिको जो मनुष्य अलग-अलग जानता है, वह सब तरहका बर्ताव करता हुआ भी फिर जन्म नहीं लेता।"},{"c":13,"v":25,"sp":"krishna","sa":"ध्यानेनात्मनि पश्यन्ति केचिदात्मानमात्मना ।\nअन्ये सांख्येन योगेन कर्मयोगेन चापरे ॥","tr":"dhyānenātmani paśyanti kecidātmānamātmanā\nanye sāṃkhyena yogena karmayogena cāpare","gs":"ધ્યાનેનાત્મનિ પશ્યન્તિ કેચિદાત્માનમાત્મના ।\nઅન્યે સાંખ્યેન યોગેન કર્મયોગેન ચાપરે ॥","en":"Some behold the Self within themselves through meditation, others through the Yoga of knowledge, and still others through the Yoga of action.","hi":"कई मनुष्य ध्यानयोगके द्वारा, कई सांख्ययोगके द्वारा और कई कर्मयोगके द्वारा अपने-आपसे अपने-आपमें परमात्मतत्त्वका अनुभव करते हैं।"},{"c":13,"v":26,"sp":"krishna","sa":"अन्ये त्वेवमजानन्तः श्रुत्वाऽन्येभ्य उपासते ।\nतेऽपि चातितरन्त्येव मृत्युं श्रुतिपरायणाः ॥","tr":"anye tvevamajānantaḥ śrutvā'nyebhya upāsate\nte'pi cātitarantyeva mṛtyuṃ śrutiparāyaṇāḥ","gs":"અન્યે ત્વેવમજાનન્તઃ શ્રુત્વાઽન્યેભ્ય ઉપાસતે ।\nતેઽપિ ચાતિતરન્ત્યેવ મૃત્યું શ્રુતિપરાયણાઃ ॥","en":"Others, too, who do not know thus, worship, having heard of It from others; they, too, cross beyond death, regarding what they have heard as the supreme refuge.","hi":"दूसरे मनुष्य इस प्रकार (ध्यानयोग, सांख्ययोग, कर्मयोग, आदि साधनोंको) नहीं जानते, केवल (जीवन्मुक्त महापुरुषोंसे) सुनकर उपासना करते हैं, ऐसे वे सुननेके परायण मनुष्य भी मृत्युको तर जाते हैं।"},{"c":13,"v":27,"sp":"krishna","sa":"यावत्सञ्जायते किञ्चित्सत्त्वं स्थावरजङ्गमम् ।\nक्षेत्रक्षेत्रज्ञसंयोगात्तद्विद्धि भरतर्षभ ॥","tr":"yāvatsañjāyate kiñcitsattvaṃ sthāvarajaṅgamam\nkṣetrakṣetrajñasaṃyogāttadviddhi bharatarṣabha","gs":"યાવત્સઞ્જાયતે કિઞ્ચિત્સત્ત્વં સ્થાવરજઙ્ગમમ્ ।\nક્ષેત્રક્ષેત્રજ્ઞસંયોગાત્તદ્વિદ્ધિ ભરતર્ષભ ॥","en":"Wherever a being is born, whether unmoving or moving, know thou, O best of the Bharatas (Arjuna), that it is from the union of the field and its knower.","hi":"हे भरतवंशियोंमें श्रेष्ठ अर्जुन ! स्थावर और जंगम जितने भी प्राणी पैदा होते हैं, उनको तुम क्षेत्र और क्षेत्रज्ञके संयोगसे उत्पन्न हुए समझो।"},{"c":13,"v":28,"sp":"krishna","sa":"समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम् ।\nविनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति ॥","tr":"samaṃ sarveṣu bhūteṣu tiṣṭhantaṃ parameśvaram\nvinaśyatsvavinaśyantaṃ yaḥ paśyati sa paśyati","gs":"સમં સર્વેષુ ભૂતેષુ તિષ્ઠન્તં પરમેશ્વરમ્ ।\nવિનશ્યત્સ્વવિનશ્યન્તં યઃ પશ્યતિ સ પશ્યતિ ॥","en":"He who sees the Supreme Lord existing truly in all beings, the imperishable within the perishable, sees indeed.","hi":"जो नष्ट होते हुए सम्पूर्ण प्राणियोंमें परमात्माको नाशरहित और समरूपसे स्थित देखता है, वही वास्तवमें सही देखता है।"},{"c":13,"v":29,"sp":"krishna","sa":"समं पश्यन्हि सर्वत्र समवस्थितमीश्वरम् ।\nन हिनस्त्यात्मनाऽऽत्मानं ततो याति परां गतिम् ॥","tr":"samaṃ paśyanhi sarvatra samavasthitamīśvaram\nna hinastyātmanā''tmānaṃ tato yāti parāṃ gatim","gs":"સમં પશ્યન્હિ સર્વત્ર સમવસ્થિતમીશ્વરમ્ ।\nન હિનસ્ત્યાત્મનાઽઽત્માનં તતો યાતિ પરાં ગતિમ્ ॥","en":"For he who truly sees the same Lord dwelling everywhere does not destroy the Self by the self; rather, he attains the highest goal.","hi":"क्योंकि सब जगह समरूपसे स्थित ईश्वरको समरूपसे देखनेवाला मनुष्य अपने-आपसे अपनी हिंसा नहीं करता, इसलिये वह परमगतिको प्राप्त हो जाता है।"},{"c":13,"v":30,"sp":"krishna","sa":"प्रकृत्यैव च कर्माणि क्रियमाणानि सर्वशः ।\nयः पश्यति तथाऽऽत्मानमकर्तारं स पश्यति ॥","tr":"prakṛtyaiva ca karmāṇi kriyamāṇāni sarvaśaḥ\nyaḥ paśyati tathā''tmānamakartāraṃ sa paśyati","gs":"પ્રકૃત્યૈવ ચ કર્માણિ ક્રિયમાણાનિ સર્વશઃ ।\nયઃ પશ્યતિ તથાઽઽત્માનમકર્તારં સ પશ્યતિ ॥","en":"He sees, who sees that all actions are performed solely by Nature and that the Self is without action.","hi":"जो सम्पूर्ण क्रियाओंको सब प्रकारसे प्रकृतिके द्वारा ही की जाती हुई देखता है और अपने-आपको अकर्ता देखता (अनुभव करता) है, वही यथार्थ देखता है।"},{"c":13,"v":31,"sp":"krishna","sa":"यदा भूतपृथग्भावमेकस्थमनुपश्यति ।\nतत एव च विस्तारं ब्रह्म सम्पद्यते तदा ॥","tr":"yadā bhūtapṛthagbhāvamekasthamanupaśyati\ntata eva ca vistāraṃ brahma sampadyate tadā","gs":"યદા ભૂતપૃથગ્ભાવમેકસ્થમનુપશ્યતિ ।\nતત એવ ચ વિસ્તારં બ્રહ્મ સમ્પદ્યતે તદા ॥","en":"When a person sees all beings as resting in the One and emanating from the One alone, they then become Brahman.","hi":"जिस कालमें साधक प्राणियोंके अलग-अलग भावोंको एक प्रकृतिमें ही स्थित देखता है और उस प्रकृतिसे ही उन सबका विस्तार देखता है, उस कालमें वह ब्रह्मको प्राप्त हो जाता है।"},{"c":13,"v":32,"sp":"krishna","sa":"अनादित्वान्निर्गुणत्वात्परमात्मायमव्ययः ।\nशरीरस्थोऽपि कौन्तेय न करोति न लिप्यते ॥","tr":"anāditvānnirguṇatvātparamātmāyamavyayaḥ\nśarīrastho'pi kaunteya na karoti na lipyate","gs":"અનાદિત્વાન્નિર્ગુણત્વાત્પરમાત્માયમવ્યયઃ ।\nશરીરસ્થોઽપિ કૌન્તેય ન કરોતિ ન લિપ્યતે ॥","en":"Being without beginning, devoid of any qualities, the Supreme Self, imperishable, though dwelling in the body, O Arjuna, neither acts nor is tainted.","hi":"हे कुन्तीनन्दन ! यह पुरुष स्वयं अनादि और गुणोंसे रहित होनेसे अविनाशी परमात्मस्वरूप ही है। यह शरीरमें रहता हुआ भी न करता है और न लिप्त होता है।"},{"c":13,"v":33,"sp":"krishna","sa":"यथा सर्वगतं सौक्ष्म्यादाकाशं नोपलिप्यते ।\nसर्वत्रावस्थितो देहे तथाऽऽत्मा नोपलिप्यते ॥","tr":"yathā sarvagataṃ saukṣmyādākāśaṃ nopalipyate\nsarvatrāvasthito dehe tathā''tmā nopalipyate","gs":"યથા સર્વગતં સૌક્ષ્મ્યાદાકાશં નોપલિપ્યતે ।\nસર્વત્રાવસ્થિતો દેહે તથાઽઽત્મા નોપલિપ્યતે ॥","en":"As the all-pervading ether is not tainted, due to its subtlety, so the Self seated everywhere in the body is not tainted either.","hi":"जैसे सब जगह व्याप्त आकाश अत्यन्त सूक्ष्म होनेसे कहीं भी लिप्त नहीं होता, ऐसे ही सब जगह परिपूर्ण आत्मा किसी भी देहमें लिप्त नहीं होता।"},{"c":13,"v":34,"sp":"krishna","sa":"यथा प्रकाशयत्येकः कृत्स्नं लोकमिमं रविः ।\nक्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत ॥","tr":"yathā prakāśayatyekaḥ kṛtsnaṃ lokamimaṃ raviḥ\nkṣetraṃ kṣetrī tathā kṛtsnaṃ prakāśayati bhārata","gs":"યથા પ્રકાશયત્યેકઃ કૃત્સ્નં લોકમિમં રવિઃ ।\nક્ષેત્રં ક્ષેત્રી તથા કૃત્સ્નં પ્રકાશયતિ ભારત ॥","en":"Just as the one sun illuminates the entire world, so too does the Lord of the field (Supreme Self) illuminate the entire field, O Arjuna.","hi":"हे भरतवंशोद्भव अर्जुन ! जैसे एक ही सूर्य सम्पूर्ण संसारको प्रकाशित करता है, ऐसे ही क्षेत्री (क्षेत्रज्ञ, आत्मा) सम्पूर्ण क्षेत्रको प्रकाशित करता है।"},{"c":13,"v":35,"sp":"krishna","sa":"क्षेत्रक्षेत्रज्ञयोरेवमन्तरं ज्ञानचक्षुषा ।\nभूतप्रकृतिमोक्षं च ये विदुर्यान्ति ते परम् ॥","tr":"kṣetrakṣetrajñayorevamantaraṃ jñānacakṣuṣā\nbhūtaprakṛtimokṣaṃ ca ye viduryānti te param","gs":"ક્ષેત્રક્ષેત્રજ્ઞયોરેવમન્તરં જ્ઞાનચક્ષુષા ।\nભૂતપ્રકૃતિમોક્ષં ચ યે વિદુર્યાન્તિ તે પરમ્ ॥","en":"They who, by the eye of knowledge, perceive the distinction between the field and its knower, as well as the liberation from the Nature of being, go to the Supreme.","hi":"इस प्रकार जो ज्ञानरूपी नेत्रसे क्षेत्र और क्षेत्रज्ञके अन्तर-(विभाग-) को तथा कार्य-कारणसहित प्रकृतिसे स्वयंको अलग जानते हैं, वे परमात्माको प्राप्त हो जाते हैं।"},{"c":14,"v":1,"sp":"krishna","sa":"परं भूयः प्रवक्ष्यामि ज्ञानानां ज्ञानमुत्तमम् ।\nयज्ज्ञात्वा मुनयः सर्वे परां सिद्धिमितो गताः ॥","tr":"paraṃ bhūyaḥ pravakṣyāmi jñānānāṃ jñānamuttamam\nyajjñātvā munayaḥ sarve parāṃ siddhimito gatāḥ","gs":"પરં ભૂયઃ પ્રવક્ષ્યામિ જ્ઞાનાનાં જ્ઞાનમુત્તમમ્ ।\nયજ્જ્ઞાત્વા મુનયઃ સર્વે પરાં સિદ્ધિમિતો ગતાઃ ॥","en":"The Blessed Lord said, \"I will again declare to thee that supreme knowledge, the best of all knowledge, having known which all the sages have gone to supreme perfection after this life.\"","hi":"श्रीभगवान् बोले -- सम्पूर्ण ज्ञानोंमें उत्तम और पर ज्ञानको मैं फिर कहूँगा, जिसको जानकर सब-के-सब मुनिलोग इस संसारसे मुक्त होकर परमसिद्धिको प्राप्त हो गये हैं।"},{"c":14,"v":2,"sp":"krishna","sa":"इदं ज्ञानमुपाश्रित्य मम साधर्म्यमागताः ।\nसर्गेऽपि नोपजायन्ते प्रलये न व्यथन्ति च ॥","tr":"idaṃ jñānamupāśritya mama sādharmyamāgatāḥ\nsarge'pi nopajāyante pralaye na vyathanti ca","gs":"ઇદં જ્ઞાનમુપાશ્રિત્ય મમ સાધર્મ્યમાગતાઃ ।\nસર્ગેઽપિ નોપજાયન્તે પ્રલયે ન વ્યથન્તિ ચ ॥","en":"Those who, having taken refuge in this knowledge, have attained unity with Me, are neither born at the time of creation nor disturbed at the time of dissolution.","hi":"इस ज्ञानका आश्रय लेकर जो मनुष्य मेरी सधर्मताको प्राप्त हो गये हैं, वे महासर्गमें भी पैदा नहीं होते और महाप्रलयमें भी व्यथित नहीं होते।"},{"c":14,"v":3,"sp":"krishna","sa":"मम योनिर्महद्ब्रह्म तस्मिन् गर्भं दधाम्यहम् ।\nसंभवः सर्वभूतानां ततो भवति भारत ॥","tr":"mama yonirmahadbrahma tasmin garbhaṃ dadhāmyaham\nsaṃbhavaḥ sarvabhūtānāṃ tato bhavati bhārata","gs":"મમ યોનિર્મહદ્બ્રહ્મ તસ્મિન્ ગર્ભં દધામ્યહમ્ ।\nસંભવઃ સર્વભૂતાનાં તતો ભવતિ ભારત ॥","en":"My womb is the great Brahma; in it I place the germ; thence, O Arjuna, is the birth of all beings.","hi":"हे भरतवंशोद्भव अर्जुन ! मेरी मूल प्रकृति तो उत्पत्ति-स्थान है और मैं उसमें जीवरूप गर्भका स्थापन करता हूँ। उससे सम्पूर्ण प्राणियोंकी उत्पत्ति होती है।"},{"c":14,"v":4,"sp":"krishna","sa":"सर्वयोनिषु कौन्तेय मूर्तयः सम्भवन्ति याः ।\nतासां ब्रह्म महद्योनिरहं बीजप्रदः पिता ॥","tr":"sarvayoniṣu kaunteya mūrtayaḥ sambhavanti yāḥ\ntāsāṃ brahma mahadyonirahaṃ bījapradaḥ pitā","gs":"સર્વયોનિષુ કૌન્તેય મૂર્તયઃ સમ્ભવન્તિ યાઃ ।\nતાસાં બ્રહ્મ મહદ્યોનિરહં બીજપ્રદઃ પિતા ॥","en":"Whatever forms are produced, O Arjuna, in any womb whatsoever, the great Brahma is their womb, and I am the seed-giving father.","hi":"हे कुन्तीनन्दन ! सम्पूर्ण योनियोंमें प्राणियोंके जितने शरीर पैदा होते हैं, उन सबकी मूल प्रकृति तो माता है और मैं बीज-स्थापन करनेवाला पिता हूँ।"},{"c":14,"v":5,"sp":"krishna","sa":"सत्त्वं रजस्तम इति गुणाः प्रकृतिसंभवाः ।\nनिबध्नन्ति महाबाहो देहे देहिनमव्ययम् ॥","tr":"sattvaṃ rajastama iti guṇāḥ prakṛtisaṃbhavāḥ\nnibadhnanti mahābāho dehe dehinamavyayam","gs":"સત્ત્વં રજસ્તમ ઇતિ ગુણાઃ પ્રકૃતિસંભવાઃ ।\nનિબધ્નન્તિ મહાબાહો દેહે દેહિનમવ્યયમ્ ॥","en":"These qualities, O Arjuna, born of Nature, bind fast in the body of the embodied, the indestructible: purity, passion, and inertia.","hi":"हे महाबाहो ! प्रकृतिसे उत्पन्न होनेवाले सत्त्व, रज और तम -- ये तीनों गुण अविनाशी देहीको देहमें बाँध देते हैं।"},{"c":14,"v":6,"sp":"krishna","sa":"तत्र सत्त्वं निर्मलत्वात्प्रकाशकमनामयम् ।\nसुखसङ्गेन बध्नाति ज्ञानसङ्गेन चानघ ॥","tr":"tatra sattvaṃ nirmalatvātprakāśakamanāmayam\nsukhasaṅgena badhnāti jñānasaṅgena cānagha","gs":"તત્ર સત્ત્વં નિર્મલત્વાત્પ્રકાશકમનામયમ્ ।\nસુખસઙ્ગેન બધ્નાતિ જ્ઞાનસઙ્ગેન ચાનઘ ॥","en":"Of these, sattva, which is luminous and healthy due to its stainlessness, binds one by attachment to happiness and knowledge, O sinless one.","hi":"हे पापरहित अर्जुन ! उन गुणोंमें सत्त्वगुण निर्मल (स्वच्छ) होनेके कारण प्रकाशक और निर्विकार है। वह सुख और ज्ञानकी आसक्तिसे (देहीको) बाँधता है।"},{"c":14,"v":7,"sp":"krishna","sa":"रजो रागात्मकं विद्धि तृष्णासङ्गसमुद्भवम् ।\nतन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम् ॥","tr":"rajo rāgātmakaṃ viddhi tṛṣṇāsaṅgasamudbhavam\ntannibadhnāti kaunteya karmasaṅgena dehinam","gs":"રજો રાગાત્મકં વિદ્ધિ તૃષ્ણાસઙ્ગસમુદ્ભવમ્ ।\nતન્નિબધ્નાતિ કૌન્તેય કર્મસઙ્ગેન દેહિનમ્ ॥","en":"Know, O Arjuna, that Rajas is of the nature of passion, the source of thirst and attachment; it binds fast the embodied one by attachment to action.","hi":"हे कुन्तीनन्दन ! तृष्णा और आसक्तिको पैदा करनेवाले रजोगुणको तुम रागस्वरूप समझो। वह कर्मोंकी आसक्तिसे शरीरधारीको बाँधता है।"},{"c":14,"v":8,"sp":"krishna","sa":"तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम् ।\nप्रमादालस्यनिद्राभिस्तन्निबध्नाति भारत ॥","tr":"tamastvajñānajaṃ viddhi mohanaṃ sarvadehinām\npramādālasyanidrābhistannibadhnāti bhārata","gs":"તમસ્ત્વજ્ઞાનજં વિદ્ધિ મોહનં સર્વદેહિનામ્ ।\nપ્રમાદાલસ્યનિદ્રાભિસ્તન્નિબધ્નાતિ ભારત ॥","en":"But know thou Tamas to be born of ignorance, deluding all embodied beings; it binds fast, O Arjuna, through heedlessness, indolence, and sleep.","hi":"हे भरतवंशी अर्जुन ! सम्पूर्ण देहधारियोंको मोहित करनेवाले तमोगुणको तुम अज्ञानसे उत्पन्न होनेवाला समझो। वह प्रमाद, आलस्य और निद्राके द्वारा देहधारियोंको बाँधता है।"},{"c":14,"v":9,"sp":"krishna","sa":"सत्त्वं सुखे सञ्जयति रजः कर्मणि भारत ।\nज्ञानमावृत्य तु तमः प्रमादे सञ्जयत्युत ॥","tr":"sattvaṃ sukhe sañjayati rajaḥ karmaṇi bhārata\njñānamāvṛtya tu tamaḥ pramāde sañjayatyuta","gs":"સત્ત્વં સુખે સઞ્જયતિ રજઃ કર્મણિ ભારત ।\nજ્ઞાનમાવૃત્ય તુ તમઃ પ્રમાદે સઞ્જયત્યુત ॥","en":"Sattva attaches to happiness, Rajas to action, O Arjuna, while Tamas, verily shrouding knowledge, attaches to heedlessness.","hi":"हे भरतवंशोद्भव अर्जुन ! सत्त्वगुण सुखमें और रजोगुण कर्ममें लगाकर मनुष्यपर विजय करता है तथा तमोगुण ज्ञानको ढककर एवं प्रमादमें भी लगाकर मनुष्यपर विजंय करता है।"},{"c":14,"v":10,"sp":"krishna","sa":"रजस्तमश्चाभिभूय सत्त्वं भवति भारत ।\nरजः सत्त्वं तमश्चैव तमः सत्त्वं रजस्तथा ॥","tr":"rajastamaścābhibhūya sattvaṃ bhavati bhārata\nrajaḥ sattvaṃ tamaścaiva tamaḥ sattvaṃ rajastathā","gs":"રજસ્તમશ્ચાભિભૂય સત્ત્વં ભવતિ ભારત ।\nરજઃ સત્ત્વં તમશ્ચૈવ તમઃ સત્ત્વં રજસ્તથા ॥","en":"Now, O Arjuna, Sattva prevails, having overpowered Rajas and Tamas; then Rajas, having overpowered Sattva and Tamas; and then Tamas, having overpowered Sattva and Rajas.","hi":"हे भरतवंशोद्भव अर्जुन ! रजोगुण और तमोगुणको दबाकर सत्त्वगुण सत्त्वगुण, और तमोगुणको दबाकर रजोगुण, वैसे ही सत्त्वगुण और रजोगुणको दबाकर तमोगुण बढ़ता है।"},{"c":14,"v":11,"sp":"krishna","sa":"सर्वद्वारेषु देहेऽस्मिन्प्रकाश उपजायते ।\nज्ञानं यदा तदा विद्याद्विवृद्धं सत्त्वमित्युत ॥","tr":"sarvadvāreṣu dehe'sminprakāśa upajāyate\njñānaṃ yadā tadā vidyādvivṛddhaṃ sattvamityuta","gs":"સર્વદ્વારેષુ દેહેઽસ્મિન્પ્રકાશ ઉપજાયતે ।\nજ્ઞાનં યદા તદા વિદ્યાદ્વિવૃદ્ધં સત્ત્વમિત્યુત ॥","en":"When the wisdom-light shines through every gate of this body, then it may be known that Sattva is predominant.","hi":"जब इस मनुष्यशरीरमें सब द्वारों-(इन्द्रियों और अन्तःकरण-) में प्रकाश (स्वच्छता) और ज्ञान (विवेक) प्रकट हो जाता है, तब जानना चाहिये कि सत्त्वगुण बढ़ा हुआ है।"},{"c":14,"v":12,"sp":"krishna","sa":"लोभः प्रवृत्तिरारम्भः कर्मणामशमः स्पृहा ।\nरजस्येतानि जायन्ते विवृद्धे भरतर्षभ ॥","tr":"lobhaḥ pravṛttirārambhaḥ karmaṇāmaśamaḥ spṛhā\nrajasyetāni jāyante vivṛddhe bharatarṣabha","gs":"લોભઃ પ્રવૃત્તિરારમ્ભઃ કર્મણામશમઃ સ્પૃહા ।\nરજસ્યેતાનિ જાયન્તે વિવૃદ્ધે ભરતર્ષભ ॥","en":"Greed, activity, the undertaking of actions, restlessness, and longing—these arise when Rajas is predominant, O Arjuna.","hi":"हे भरतवंशमें श्रेष्ठ अर्जुन ! रजोगुणके बढ़नेपर लोभ, प्रवृत्ति, कर्मोंका आरम्भ, अशान्ति और स्पृहा -- ये वृत्तियाँ पैदा होती हैं।"},{"c":14,"v":13,"sp":"krishna","sa":"अप्रकाशोऽप्रवृत्तिश्च प्रमादो मोह एव च ।\nतमस्येतानि जायन्ते विवृद्धे कुरुनन्दन ॥","tr":"aprakāśo'pravṛttiśca pramādo moha eva ca\ntamasyetāni jāyante vivṛddhe kurunandana","gs":"અપ્રકાશોઽપ્રવૃત્તિશ્ચ પ્રમાદો મોહ એવ ચ ।\nતમસ્યેતાનિ જાયન્તે વિવૃદ્ધે કુરુનન્દન ॥","en":"Darkness, inertia, carelessness, and delusion—these arise when Tamas is predominant, O Arjuna.","hi":"हे कुरुनन्दन ! तमोगुणके बढ़नेपर अप्रकाश, अप्रवृत्ति, प्रमाद और मोह -- ये वृत्तियाँ भी पैदा होती हैं।"},{"c":14,"v":14,"sp":"krishna","sa":"यदा सत्त्वे प्रवृद्धे तु प्रलयं याति देहभृत् ।\nतदोत्तमविदां लोकानमलान्प्रतिपद्यते ॥","tr":"yadā sattve pravṛddhe tu pralayaṃ yāti dehabhṛt\ntadottamavidāṃ lokānamalānpratipadyate","gs":"યદા સત્ત્વે પ્રવૃદ્ધે તુ પ્રલયં યાતિ દેહભૃત્ ।\nતદોત્તમવિદાં લોકાનમલાન્પ્રતિપદ્યતે ॥","en":"If the embodied one meets death when Sattva is predominant, then they attain the spotless worlds of the knowers of the Highest.","hi":"जिस समय सत्त्वगुण बढ़ा हो, उस समय यदि देहधारी मनुष्य मर जाता है, तो वह,उत्तमवेत्ताओंके निर्मल लोकोंमें जाता है।"},{"c":14,"v":15,"sp":"krishna","sa":"रजसि प्रलयं गत्वा कर्मसङ्गिषु जायते ।\nतथा प्रलीनस्तमसि मूढयोनिषु जायते ॥","tr":"rajasi pralayaṃ gatvā karmasaṅgiṣu jāyate\ntathā pralīnastamasi mūḍhayoniṣu jāyate","gs":"રજસિ પ્રલયં ગત્વા કર્મસઙ્ગિષુ જાયતે ।\nતથા પ્રલીનસ્તમસિ મૂઢયોનિષુ જાયતે ॥","en":"Meeting death in Rajas, he is born among those who are attached to action; and dying in Tamas, he is born in the womb of the thoughtless.","hi":"रजोगुणके बढ़नेपर मरनेवाला प्राणी मनुष्ययोनिमें जन्म लेता है तथा तमोगुणके बढ़नेपर मरनेवाला मूढ़योनियोंमें जन्म लेता है।"},{"c":14,"v":16,"sp":"krishna","sa":"कर्मणः सुकृतस्याहुः सात्त्विकं निर्मलं फलम् ।\nरजसस्तु फलं दुःखमज्ञानं तमसः फलम् ॥","tr":"karmaṇaḥ sukṛtasyāhuḥ sāttvikaṃ nirmalaṃ phalam\nrajasastu phalaṃ duḥkhamajñānaṃ tamasaḥ phalam","gs":"કર્મણઃ સુકૃતસ્યાહુઃ સાત્ત્વિકં નિર્મલં ફલમ્ ।\nરજસસ્તુ ફલં દુઃખમજ્ઞાનં તમસઃ ફલમ્ ॥","en":"They say that the fruit of good action is Sattvic and pure; indeed, the fruit of Rajas is pain, and the fruit of Tamas is ignorance.","hi":"(विवेकी पुरुषोंने) शुभ-कर्मका तो सात्त्विक निर्मल फल कहा है, राजस कर्मका फल दुःख कहा है और तामस कर्मका फल अज्ञान (मूढ़ता) कहा है।"},{"c":14,"v":17,"sp":"krishna","sa":"सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च ।\nप्रमादमोहौ तमसो भवतोऽज्ञानमेव च ॥","tr":"sattvātsañjāyate jñānaṃ rajaso lobha eva ca\npramādamohau tamaso bhavato'jñānameva ca","gs":"સત્ત્વાત્સઞ્જાયતે જ્ઞાનં રજસો લોભ એવ ચ ।\nપ્રમાદમોહૌ તમસો ભવતોઽજ્ઞાનમેવ ચ ॥","en":"From Sattva arises knowledge, and greed from Rajas; heedlessness and delusion arise from Tamas, and also ignorance.","hi":"सत्त्वगुणसे ज्ञान और रजोगुणसे लोभ आदि ही उत्पन्न होते हैं; तमोगुणसे प्रमाद, मोह एवं अज्ञान भी उत्पन्न होता है।"},{"c":14,"v":18,"sp":"krishna","sa":"ऊर्ध्वं गच्छन्ति सत्त्वस्था मध्ये तिष्ठन्ति राजसाः ।\nजघन्यगुणवृत्तिस्था अधो गच्छन्ति तामसाः ॥","tr":"ūrdhvaṃ gacchanti sattvasthā madhye tiṣṭhanti rājasāḥ\njaghanyaguṇavṛttisthā adho gacchanti tāmasāḥ","gs":"ઊર્ધ્વં ગચ્છન્તિ સત્ત્વસ્થા મધ્યે તિષ્ઠન્તિ રાજસાઃ ।\nજઘન્યગુણવૃત્તિસ્થા અધો ગચ્છન્તિ તામસાઃ ॥","en":"Those seated in Sattva ascend; those of Rajasic nature dwell in the middle; and those of Tamasic nature, abiding in the function of the lowest Guna, descend.","hi":"सत्त्वगुणमें स्थित मनुष्य ऊर्ध्वलोकोंमें जाते हैं, रजोगुणमें स्थित मनुष्य मृत्युलोकमें जन्म लेते हैं और निन्दनीय तमोगुणकी वृत्तिमें स्थित मनुष्य अधोगतिमें जाते हैं।"},{"c":14,"v":19,"sp":"krishna","sa":"नान्यं गुणेभ्यः कर्तारं यदा द्रष्टानुपश्यति ।\nगुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति ॥","tr":"nānyaṃ guṇebhyaḥ kartāraṃ yadā draṣṭānupaśyati\nguṇebhyaśca paraṃ vetti madbhāvaṃ so'dhigacchati","gs":"નાન્યં ગુણેભ્યઃ કર્તારં યદા દ્રષ્ટાનુપશ્યતિ ।\nગુણેભ્યશ્ચ પરં વેત્તિ મદ્ભાવં સોઽધિગચ્છતિ ॥","en":"When the seer beholds no agent other than the Gunas and knows that which is higher than them, he attains to My Being.","hi":"जब विवेकी (विचारकुशल) मनुष्य तीनों गुणोंके सिवाय अन्य किसीको कर्ता नहीं देखता और अपनेको गुणोंसे पर अनुभव करता है, तब वह मेरे स्वरूपको प्राप्त हो जाता है।"},{"c":14,"v":20,"sp":"krishna","sa":"गुणानेतानतीत्य त्रीन्देही देहसमुद्भवान् ।\nजन्ममृत्युजरादुःखैर्विमुक्तोऽमृतमश्नुते ॥","tr":"guṇānetānatītya trīndehī dehasamudbhavān\njanmamṛtyujarāduḥkhairvimukto'mṛtamaśnute","gs":"ગુણાનેતાનતીત્ય ત્રીન્દેહી દેહસમુદ્ભવાન્ ।\nજન્મમૃત્યુજરાદુઃખૈર્વિમુક્તોઽમૃતમશ્નુતે ॥","en":"The embodied one, having crossed beyond these three Gunas from which the body is evolved, is freed from birth, death, decay, and pain, and attains immortality.","hi":"देहधारी (विवेकी मनुष्य) देहको उत्पन्न करनेवाले इन तीनों गुणोंका अतिक्रमण करके जन्म, मृत्यु और वृद्धावस्थारूप दुःखोंसे रहित हुआ अमरताका अनुभव करता है।"},{"c":14,"v":21,"sp":"arjuna","sa":"कैर्लिंगैस्त्रीन्गुणानेतानतीतो भवति प्रभो ।\nकिमाचारः कथं चैतांस्त्रीन्गुणानतिवर्तते ॥","tr":"kairliṃgaistrīnguṇānetānatīto bhavati prabho\nkimācāraḥ kathaṃ caitāṃstrīnguṇānativartate","gs":"કૈર્લિંગૈસ્ત્રીન્ગુણાનેતાનતીતો ભવતિ પ્રભો ।\nકિમાચારઃ કથં ચૈતાંસ્ત્રીન્ગુણાનતિવર્તતે ॥","en":"Arjuna said, \"What are the marks of one who has transcended the three qualities, O Lord? What is their conduct, and how do they go beyond these three qualities?\"","hi":"अर्जुन बोले -- हे प्रभो ! इन तीनों गुणोंसे अतीत हुआ मनुष्य किन लक्षणोंसे युक्त होता है? उसके आचरण कैसे होते हैं? और इन तीनों गुणोंका अतिक्रमण कैसे किया जा सकता है?"},{"c":14,"v":22,"sp":"krishna","sa":"प्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव ।\nन द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति ॥","tr":"prakāśaṃ ca pravṛttiṃ ca mohameva ca pāṇḍava\nna dveṣṭi sampravṛttāni na nivṛttāni kāṅkṣati","gs":"પ્રકાશં ચ પ્રવૃત્તિં ચ મોહમેવ ચ પાણ્ડવ ।\nન દ્વેષ્ટિ સમ્પ્રવૃત્તાનિ ન નિવૃત્તાનિ કાઙ્ક્ષતિ ॥","en":"The Blessed Lord said, \"When light, activity, and delusion are present, he does not hate them, nor does he long for them when they are absent.","hi":"श्रीभगवान् बोले -- हे पाण्डव ! प्रकाश, प्रवृत्ति तथा मोह -- ये सभी अच्छी तरहसे प्रवृत्त हो जायँ तो भी गुणातीत मनुष्य इनसे द्वेष नहीं करता, और ये सभी निवृत्त हो जायँ तो इनकी इच्छा नहीं करता।"},{"c":14,"v":23,"sp":"krishna","sa":"उदासीनवदासीनो गुणैर्यो न विचाल्यते ।\nगुणा वर्तन्त इत्येव योऽवतिष्ठति नेङ्गते ॥","tr":"udāsīnavadāsīno guṇairyo na vicālyate\nguṇā vartanta ityeva yo'vatiṣṭhati neṅgate","gs":"ઉદાસીનવદાસીનો ગુણૈર્યો ન વિચાલ્યતે ।\nગુણા વર્તન્ત ઇત્યેવ યોઽવતિષ્ઠતિ નેઙ્ગતે ॥","en":"He who, seated like one unconcerned, is not moved by the dualities, and who, knowing that the dualities are active, is self-centered and does not move.","hi":"जो उदासीनकी तरह स्थित है और जो गुणोंके द्वारा विचलित नहीं किया जा सकता तथा गुण ही (गुणोंमें) बरत रहे हैं -- इस भावसे जो अपने स्वरूपमें ही स्थित रहता है और स्वयं कोई भी चेष्टा नहीं करता।"},{"c":14,"v":24,"sp":"krishna","sa":"समदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः ।\nतुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः ॥","tr":"samaduḥkhasukhaḥ svasthaḥ samaloṣṭāśmakāñcanaḥ\ntulyapriyāpriyo dhīrastulyanindātmasaṃstutiḥ","gs":"સમદુઃખસુખઃ સ્વસ્થઃ સમલોષ્ટાશ્મકાઞ્ચનઃ ।\nતુલ્યપ્રિયાપ્રિયો ધીરસ્તુલ્યનિન્દાત્મસંસ્તુતિઃ ॥","en":"Who is the same in pleasure and pain, who dwells in the Self, to whom a clod of earth, a stone, and gold are all alike, who is the same to the dear and the unfriendly, who is firm, and to whom censure and praise are one and the same.","hi":"जो धीर मनुष्य सुख-दुःखमें सम तथा अपने स्वरूपमें स्थित रहता है; जो मिट्टीके ढेले, पत्थर और सोनेमें सम रहता है जो प्रिय-अप्रियमें तथा अपनी निन्दा-स्तुतिमें सम रहता है; जो मान-अपमानमें तथा मित्र-शत्रुके पक्षमें सम रहता है जो सम्पूर्ण कर्मोंके आरम्भका त्यागी है, वह मनुष्य गुणातीत कहा जाता है।"},{"c":14,"v":25,"sp":"krishna","sa":"मानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः ।\nसर्वारम्भपरित्यागी गुणातीतः स उच्यते ॥","tr":"mānāpamānayostulyastulyo mitrāripakṣayoḥ\nsarvārambhaparityāgī guṇātītaḥ sa ucyate","gs":"માનાપમાનયોસ્તુલ્યસ્તુલ્યો મિત્રારિપક્ષયોઃ ।\nસર્વારમ્ભપરિત્યાગી ગુણાતીતઃ સ ઉચ્યતે ॥","en":"Who is the same in honor and dishonor, the same to friend and foe, abandoning all undertakings, he is said to have transcended the dualities.","hi":"जो धीर मनुष्य सुख-दुःखमें सम तथा अपने स्वरूपमें स्थित रहता है; जो मिट्टीके ढेले, पत्थर और सोनेमें सम रहता है जो प्रिय-अप्रियमें तथा अपनी निन्दा-स्तुतिमें सम रहता है जो मान-अपमानमें तथा मित्र-शत्रुके पक्षमें सम रहता है; जो सम्पूर्ण कर्मोंके आरम्भका त्यागी है, वह मनुष्य गुणातीत कहा जाता है।"},{"c":14,"v":26,"sp":"krishna","sa":"मां च योऽव्यभिचारेण भक्ितयोगेन सेवते ।\nस गुणान्समतीत्यैतान् ब्रह्मभूयाय कल्पते ॥","tr":"māṃ ca yo'vyabhicāreṇa bhakitayogena sevate\nsa guṇānsamatītyaitān brahmabhūyāya kalpate","gs":"માં ચ યોઽવ્યભિચારેણ ભક્િતયોગેન સેવતે ।\nસ ગુણાન્સમતીત્યૈતાન્ બ્રહ્મભૂયાય કલ્પતે ॥","en":"And he who serves Me with unwavering devotion, he, crossing beyond the dualities, is fit for becoming Brahman.","hi":"जो मनुष्य अव्यभिचारी भक्तियोगके द्वारा मेरा सेवन करता है, वह इन गुणोंका अतिक्रमण करके ब्रह्मप्राप्तिका पात्र हो जाता है।"},{"c":14,"v":27,"sp":"krishna","sa":"ब्रह्मणो हि प्रतिष्ठाऽहममृतस्याव्ययस्य च ।\nशाश्वतस्य च धर्मस्य सुखस्यैकान्तिकस्य च ॥","tr":"brahmaṇo hi pratiṣṭhā'hamamṛtasyāvyayasya ca\nśāśvatasya ca dharmasya sukhasyaikāntikasya ca","gs":"બ્રહ્મણો હિ પ્રતિષ્ઠાઽહમમૃતસ્યાવ્યયસ્ય ચ ।\nશાશ્વતસ્ય ચ ધર્મસ્ય સુખસ્યૈકાન્તિકસ્ય ચ ॥","en":"For I am the abode of Brahman, the immortal, immutable, and everlasting Dharma, and absolute bliss.","hi":"क्योंकि ब्रह्म, अविनाशी अमृत, शाश्वत धर्म और ऐकान्तिक सुखका आश्रय मैं ही हूँ।"},{"c":15,"v":1,"sp":"krishna","sa":"ऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम् ।\nछन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित् ॥","tr":"ūrdhvamūlamadhaḥśākhamaśvatthaṃ prāhuravyayam\nchandāṃsi yasya parṇāni yastaṃ veda sa vedavit","gs":"ઊર્ધ્વમૂલમધઃશાખમશ્વત્થં પ્રાહુરવ્યયમ્ ।\nછન્દાંસિ યસ્ય પર્ણાનિ યસ્તં વેદ સ વેદવિત્ ॥","en":"The Blessed Lord said: They (the wise) speak of the indestructible peepul tree, with its roots above and branches below, whose leaves are the meters or hymns; he who knows it is a knower of the Vedas.","hi":"श्रीभगवान् बोले -- ऊपरकी ओर मूलवाले तथा नीचेकी ओर शाखावाले जिस संसाररूप अश्वत्थवृक्षको अव्यय कहते हैं और वेद जिसके पत्ते हैं, उस संसारवृक्षको जो जानता है, वह सम्पूर्ण वेदोंको जाननेवाला है।"},{"c":15,"v":2,"sp":"krishna","sa":"अधश्चोर्ध्वं प्रसृतास्तस्य शाखा     गुणप्रवृद्धा विषयप्रवालाः ।\nअधश्च मूलान्यनुसन्ततानि     कर्मानुबन्धीनि मनुष्यलोके ॥","tr":"adhaścordhvaṃ prasṛtāstasya śākhā     guṇapravṛddhā viṣayapravālāḥ\nadhaśca mūlānyanusantatāni     karmānubandhīni manuṣyaloke","gs":"અધશ્ચોર્ધ્વં પ્રસૃતાસ્તસ્ય શાખા     ગુણપ્રવૃદ્ધા વિષયપ્રવાલાઃ ।\nઅધશ્ચ મૂલાન્યનુસન્તતાનિ     કર્માનુબન્ધીનિ મનુષ્યલોકે ॥","en":"Its branches spread below and above, nourished by the Gunas; its buds are sense-objects, and its roots stretch forth below in the world of men, originating action.","hi":"उस संसारवृक्षकी गुणों-(सत्त्व, रज और तम-) के द्वारा बढ़ी हुई तथा विषयरूप कोंपलोंवाली शाखाएँ नीचे, मध्यमें और ऊपर सब जगह फैली हुई हैं। मनुष्यलोकमें कर्मोंके अनुसार बाँधनेवाले मूल भी नीचे और ऊपर (सभी लोकोंमें) व्याप्त हो रहे हैं।"},{"c":15,"v":3,"sp":"krishna","sa":"न रूपमस्येह तथोपलभ्यते    नान्तो न चादिर्न च संप्रतिष्ठा ।\nअश्वत्थमेनं सुविरूढमूल    मसङ्गशस्त्रेण दृढेन छित्त्वा ॥","tr":"na rūpamasyeha tathopalabhyate    nānto na cādirna ca saṃpratiṣṭhā\naśvatthamenaṃ suvirūḍhamūla    masaṅgaśastreṇa dṛḍhena chittvā","gs":"ન રૂપમસ્યેહ તથોપલભ્યતે    નાન્તો ન ચાદિર્ન ચ સંપ્રતિષ્ઠા ।\nઅશ્વત્થમેનં સુવિરૂઢમૂલ    મસઙ્ગશસ્ત્રેણ દૃઢેન છિત્ત્વા ॥","en":"Its form is not perceived here as such, nor its end, origin, foundation, or resting place; having cut asunder this firmly rooted peepul tree with the strong axe of non-attachment.","hi":"इस संसारवृक्षका जैसा रूप देखनेमें आता है, वैसा यहाँ (विचार करनेपर) मिलता नहीं; क्योंकि इसका न तो आदि है, न अन्त है और न स्थिति ही है। इसलिये इस दृढ़ मूलोंवाले संसाररूप अश्वत्थवृक्षको दृढ़ असङ्गतारूप शस्त्रके द्वारा काटकर --"},{"c":15,"v":4,"sp":"krishna","sa":"ततः पदं तत्परिमार्गितव्य    यस्मिन्गता न निवर्तन्ति भूयः ।\nतमेव चाद्यं पुरुषं प्रपद्ये    यतः प्रवृत्तिः प्रसृता पुराणी ॥","tr":"tataḥ padaṃ tatparimārgitavya    yasmingatā na nivartanti bhūyaḥ\ntameva cādyaṃ puruṣaṃ prapadye    yataḥ pravṛttiḥ prasṛtā purāṇī","gs":"તતઃ પદં તત્પરિમાર્ગિતવ્ય    યસ્મિન્ગતા ન નિવર્તન્તિ ભૂયઃ ।\nતમેવ ચાદ્યં પુરુષં પ્રપદ્યે    યતઃ પ્રવૃત્તિઃ પ્રસૃતા પુરાણી ॥","en":"Then, that goal should be sought for, to which, having gone, none returns again. I seek refuge in that Primeval Purusha, from whence streamed forth the ancient activity or energy.","hi":"उसके बाद उस परमपद-(परमात्मा-) की खोज करनी चाहिये जिसको प्राप्त होनेपर मनुष्य फिर लौटकर संसारमें नहीं आते और जिससे अनादिकालसे चली आनेवाली यह सृष्टि विस्तारको प्राप्त हुई है, उस आदिपुरुष परमात्माके ही मैं शरण हूँ।"},{"c":15,"v":5,"sp":"krishna","sa":"निर्मानमोहा जितसङ्गदोषा    अध्यात्मनित्या विनिवृत्तकामाः ।\nद्वन्द्वैर्विमुक्ताः सुखदुःखसंज्ञै    र्गच्छन्त्यमूढाः पदमव्ययं तत् ॥","tr":"nirmānamohā jitasaṅgadoṣā    adhyātmanityā vinivṛttakāmāḥ\ndvandvairvimuktāḥ sukhaduḥkhasaṃjñai    rgacchantyamūḍhāḥ padamavyayaṃ tat","gs":"નિર્માનમોહા જિતસઙ્ગદોષા    અધ્યાત્મનિત્યા વિનિવૃત્તકામાઃ ।\nદ્વન્દ્વૈર્વિમુક્તાઃ સુખદુઃખસંજ્ઞૈ    ર્ગચ્છન્ત્યમૂઢાઃ પદમવ્યયં તત્ ॥","en":"Free from pride and delusion, victorious over the evil of attachment, dwelling constantly in the Self, their desires having completely turned away, freed from the pairs of opposites known as pleasure and pain, they, the undeluded, reach the eternal goal.","hi":"जो मान और मोहसे रहित हो गये हैं, जिन्होंने आसक्तिसे होनेवाले दोषोंको जीत लिया है, जो नित्य-निरन्तर परमात्मामें ही लगे हुए हैं, जो (अपनी दृष्टिसे) सम्पूर्ण कामनाओंसे रहित हो गये हैं, जो सुख-दुःखरूप द्वन्द्वोंसे मुक्त हो गये हैं, ऐसे (ऊँची स्थितिवाले) मोहरहित साधक भक्त उस अविनाशी परमपद-(परमात्मा-) को प्राप्त होते हैं।"},{"c":15,"v":6,"sp":"krishna","sa":"न तद्भासयते सूर्यो न शशाङ्को न पावकः ।\nयद्गत्वा न निवर्तन्ते तद्धाम परमं मम ॥","tr":"na tadbhāsayate sūryo na śaśāṅko na pāvakaḥ\nyadgatvā na nivartante taddhāma paramaṃ mama","gs":"ન તદ્ભાસયતે સૂર્યો ન શશાઙ્કો ન પાવકઃ ।\nયદ્ગત્વા ન નિવર્તન્તે તદ્ધામ પરમં મમ ॥","en":"Neither does the sun illuminate there, nor the moon, nor the fire; having gone there, they do not return; that is My supreme abode.","hi":"उस-(परमपद-) को न सूर्य, न चन्द्र और न अग्नि ही प्रकाशित कर सकती है; और जिसको प्राप्त होकर जीव लौटकर (संसारमें) नहीं आते, वही मेरा परमधाम है।"},{"c":15,"v":7,"sp":"krishna","sa":"ममैवांशो जीवलोके जीवभूतः सनातनः ।\nमनःषष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति ॥","tr":"mamaivāṃśo jīvaloke jīvabhūtaḥ sanātanaḥ\nmanaḥṣaṣṭhānīndriyāṇi prakṛtisthāni karṣati","gs":"મમૈવાંશો જીવલોકે જીવભૂતઃ સનાતનઃ ।\nમનઃષષ્ઠાનીન્દ્રિયાણિ પ્રકૃતિસ્થાનિ કર્ષતિ ॥","en":"An eternal portion of Myself having become a living soul in the world of life, draws to itself the five senses, with the mind as the sixth, abiding in Nature.","hi":"इस संसारमें जीव बना हुआ आत्मा मेरा ही सनातन अंश है; परन्तु वह प्रकृतिमें स्थित मन और पाँचों इन्द्रियोंको आकर्षित करता है (अपना मान लेता है)।"},{"c":15,"v":8,"sp":"krishna","sa":"शरीरं यदवाप्नोति यच्चाप्युत्क्रामतीश्वरः ।\nगृहीत्वैतानि संयाति वायुर्गन्धानिवाशयात् ॥","tr":"śarīraṃ yadavāpnoti yaccāpyutkrāmatīśvaraḥ\ngṛhītvaitāni saṃyāti vāyurgandhānivāśayāt","gs":"શરીરં યદવાપ્નોતિ યચ્ચાપ્યુત્ક્રામતીશ્વરઃ ।\nગૃહીત્વૈતાનિ સંયાતિ વાયુર્ગન્ધાનિવાશયાત્ ॥","en":"When the Lord, as the individual soul, obtains a body and when He leaves it, He takes these with Him, just as the wind takes the scents from their seats (flowers, etc.).","hi":"जैसे वायु गन्धके स्थानसे गन्धको ग्रहण करके ले जाती है, ऐसे ही शरीरादिका स्वामी बना हुआ जीवात्मा भी जिस शरीरको छोड़ता है, वहाँसे मनसहित इन्द्रियोंको ग्रहण करके फिर जिस शरीरको प्राप्त होता है, उसमें चला जाता है।"},{"c":15,"v":9,"sp":"krishna","sa":"श्रोत्रं चक्षुः स्पर्शनं च रसनं घ्राणमेव च ।\nअधिष्ठाय मनश्चायं विषयानुपसेवते ॥","tr":"śrotraṃ cakṣuḥ sparśanaṃ ca rasanaṃ ghrāṇameva ca\nadhiṣṭhāya manaścāyaṃ viṣayānupasevate","gs":"શ્રોત્રં ચક્ષુઃ સ્પર્શનં ચ રસનં ઘ્રાણમેવ ચ ।\nઅધિષ્ઠાય મનશ્ચાયં વિષયાનુપસેવતે ॥","en":"Presiding over the ears, eyes, touch, taste, smell, and mind, it enjoys the objects of the senses.","hi":"यह जीवात्मा मनका आश्रय लेकर श्रोत्र, नेत्र, त्वचा, रसना और घ्राण -- इन पाँचों इन्द्रियोंके द्वारा विषयोंका सेवन करता है।"},{"c":15,"v":10,"sp":"krishna","sa":"उत्क्रामन्तं स्थितं वापि भुञ्जानं वा गुणान्वितम् ।\nविमूढा नानुपश्यन्ति पश्यन्ति ज्ञानचक्षुषः ॥","tr":"utkrāmantaṃ sthitaṃ vāpi bhuñjānaṃ vā guṇānvitam\nvimūḍhā nānupaśyanti paśyanti jñānacakṣuṣaḥ","gs":"ઉત્ક્રામન્તં સ્થિતં વાપિ ભુઞ્જાનં વા ગુણાન્વિતમ્ ।\nવિમૂઢા નાનુપશ્યન્તિ પશ્યન્તિ જ્ઞાનચક્ષુષઃ ॥","en":"The deluded do not see Him who departs, stays, and enjoys; but those who possess the eye of knowledge behold Him.","hi":"शरीरको छोड़कर जाते हुए या दूसरे शरीरमें स्थित हुए अथवा विषयोंको भोगते हुए भी गुणोंसे युक्त जीवात्माके स्वरूपको मूढ़ मनुष्य नहीं जानते, ज्ञानरूपी नेत्रोंवाले ज्ञानी मनुष्य ही जानते हैं।"},{"c":15,"v":11,"sp":"krishna","sa":"यतन्तो योगिनश्चैनं पश्यन्त्यात्मन्यवस्थितम् ।\nयतन्तोऽप्यकृतात्मानो नैनं पश्यन्त्यचेतसः ॥","tr":"yatanto yoginaścainaṃ paśyantyātmanyavasthitam\nyatanto'pyakṛtātmāno nainaṃ paśyantyacetasaḥ","gs":"યતન્તો યોગિનશ્ચૈનં પશ્યન્ત્યાત્મન્યવસ્થિતમ્ ।\nયતન્તોઽપ્યકૃતાત્માનો નૈનં પશ્યન્ત્યચેતસઃ ॥","en":"The yogis striving for perfection behold Him dwelling in the Self; but, the unrefined and unintelligent, even though striving, do not see Him.","hi":"यत्न करनेवाले योगीलोग अपने-आपमें स्थित इस परमात्मतत्त्वका अनुभव करते हैं। परन्तु जिन्होंने अपना अन्तःकरण शुद्ध नहीं किया है, ऐसे अविवेकी मनुष्य यत्न करनेपर भी इस तत्त्वका अनुभव नहीं करते।"},{"c":15,"v":12,"sp":"krishna","sa":"यदादित्यगतं तेजो जगद्भासयतेऽखिलम् ।\nयच्चन्द्रमसि यच्चाग्नौ तत्तेजो विद्धि मामकम् ॥","tr":"yadādityagataṃ tejo jagadbhāsayate'khilam\nyaccandramasi yaccāgnau tattejo viddhi māmakam","gs":"યદાદિત્યગતં તેજો જગદ્ભાસયતેઽખિલમ્ ।\nયચ્ચન્દ્રમસિ યચ્ચાગ્નૌ તત્તેજો વિદ્ધિ મામકમ્ ॥","en":"That light which resides in the sun, illuminating the whole world; that which is in the moon and in the fire—know that light to be Mine.","hi":"सूर्यमें आया हुआ जो तेज सम्पूर्ण जगत् को प्रकाशित करता है और जो तेज चन्द्रमामें है तथा जो तेज अग्निमें है, उस तेजको मेरा ही जान।"},{"c":15,"v":13,"sp":"krishna","sa":"गामाविश्य च भूतानि धारयाम्यहमोजसा ।\nपुष्णामि चौषधीः सर्वाः सोमो भूत्वा रसात्मकः ॥","tr":"gāmāviśya ca bhūtāni dhārayāmyahamojasā\npuṣṇāmi cauṣadhīḥ sarvāḥ somo bhūtvā rasātmakaḥ","gs":"ગામાવિશ્ય ચ ભૂતાનિ ધારયામ્યહમોજસા ।\nપુષ્ણામિ ચૌષધીઃ સર્વાઃ સોમો ભૂત્વા રસાત્મકઃ ॥","en":"Permeating the earth, I support all beings with My energy; and having become the watery moon, I nourish all herbs.","hi":"मैं ही पृथ्वीमें प्रविष्ट होकर अपनी शक्तिसे समस्त प्राणियोंको धारण करता हूँ; और मैं ही रसमय चन्द्रमाके रूपमें समस्त ओषधियों-(वनस्पतियों-) को पुष्ट करता हूँ।"},{"c":15,"v":14,"sp":"krishna","sa":"अहं वैश्वानरो भूत्वा प्राणिनां देहमाश्रितः ।\nप्राणापानसमायुक्तः पचाम्यन्नं चतुर्विधम् ॥","tr":"ahaṃ vaiśvānaro bhūtvā prāṇināṃ dehamāśritaḥ\nprāṇāpānasamāyuktaḥ pacāmyannaṃ caturvidham","gs":"અહં વૈશ્વાનરો ભૂત્વા પ્રાણિનાં દેહમાશ્રિતઃ ।\nપ્રાણાપાનસમાયુક્તઃ પચામ્યન્નં ચતુર્વિધમ્ ॥","en":"Having become the fire Vaisvanara, I abide in the bodies of living beings and, associated with the Prana and the Apana, digest the fourfold food.","hi":"प्राणियोंके शरीरमें रहनेवाला मैं प्राण-अपानसे युक्त वैश्वानर होकर चार प्रकारके अन्नको पचाता हूँ।"},{"c":15,"v":15,"sp":"krishna","sa":"सर्वस्य चाहं हृदि सन्निविष्टो    मत्तः स्मृतिर्ज्ञानमपोहनं च ।\nवेदैश्च सर्वैरहमेव वेद्यो    वेदान्तकृद्वेदविदेव चाहम् ॥","tr":"sarvasya cāhaṃ hṛdi sanniviṣṭo    mattaḥ smṛtirjñānamapohanaṃ ca\nvedaiśca sarvairahameva vedyo    vedāntakṛdvedavideva cāham","gs":"સર્વસ્ય ચાહં હૃદિ સન્નિવિષ્ટો    મત્તઃ સ્મૃતિર્જ્ઞાનમપોહનં ચ ।\nવેદૈશ્ચ સર્વૈરહમેવ વેદ્યો    વેદાન્તકૃદ્વેદવિદેવ ચાહમ્ ॥","en":"And I am seated in the hearts of all; from Me come memory and knowledge, as well as their absence. I am verily That which has to be known by all the Vedas; I am indeed the author of the Vedanta and the knower of the Vedas.","hi":"मैं सम्पूर्ण प्राणियोंके हृदयमें स्थित हूँ। मेरेसे ही स्मृति, ज्ञान और अपोहन (संशय आदि दोषोंका नाश) होता है। सम्पूर्ण वेदोंके द्वारा मैं ही जाननेयोग्य हूँ। वेदोंके तत्त्वका निर्णय करनेवाला और वेदोंको जाननेवाला भी मैं ही हूँ।"},{"c":15,"v":16,"sp":"krishna","sa":"द्वाविमौ पुरुषौ लोके क्षरश्चाक्षर एव च ।\nक्षरः सर्वाणि भूतानि कूटस्थोऽक्षर उच्यते ॥","tr":"dvāvimau puruṣau loke kṣaraścākṣara eva ca\nkṣaraḥ sarvāṇi bhūtāni kūṭastho'kṣara ucyate","gs":"દ્વાવિમૌ પુરુષૌ લોકે ક્ષરશ્ચાક્ષર એવ ચ ।\nક્ષરઃ સર્વાણિ ભૂતાનિ કૂટસ્થોઽક્ષર ઉચ્યતે ॥","en":"Two Purushas there are in this world: the perishable and the imperishable. All beings are perishable, and the Kutastha—the unchanging—is called the imperishable.","hi":"इस संसारमें क्षर (नाशवान्) और अक्षर (अविनाशी) -- ये दो प्रकारके पुरुष हैं। सम्पूर्ण प्राणियोंके शरीर नाशवान् और कूटस्थ (जीवात्मा) अविनाशी कहा जाता है।"},{"c":15,"v":17,"sp":"krishna","sa":"उत्तमः पुरुषस्त्वन्यः परमात्मेत्युदाहृतः ।\nयो लोकत्रयमाविश्य बिभर्त्यव्यय ईश्वरः ॥","tr":"uttamaḥ puruṣastvanyaḥ paramātmetyudāhṛtaḥ\nyo lokatrayamāviśya bibhartyavyaya īśvaraḥ","gs":"ઉત્તમઃ પુરુષસ્ત્વન્યઃ પરમાત્મેત્યુદાહૃતઃ ।\nયો લોકત્રયમાવિશ્ય બિભર્ત્યવ્યય ઈશ્વરઃ ॥","en":"But distinct is the Supreme Purusha, called the highest Self, indestructible and Lord, who pervades the three worlds and sustains them.","hi":"उत्तम पुरुष तो अन्य ही है, जो परमात्मा नामसे कहा गया है। वही अविनाशी ईश्वर तीनों लोकोंमें प्रविष्ट होकर सबका भरण-पोषण करता है।"},{"c":15,"v":18,"sp":"krishna","sa":"यस्मात्क्षरमतीतोऽहमक्षरादपि चोत्तमः ।\nअतोऽस्मि लोके वेदे च प्रथितः पुरुषोत्तमः ॥","tr":"yasmātkṣaramatīto'hamakṣarādapi cottamaḥ\nato'smi loke vede ca prathitaḥ puruṣottamaḥ","gs":"યસ્માત્ક્ષરમતીતોઽહમક્ષરાદપિ ચોત્તમઃ ।\nઅતોઽસ્મિ લોકે વેદે ચ પ્રથિતઃ પુરુષોત્તમઃ ॥","en":"As I transcend the perishable and am even higher than the imperishable, I am declared to be the highest Purusha in the world and in the Vedas.","hi":"मैं क्षरसे अतीत हूँ और अक्षरसे भी उत्तम हूँ, इसलिये लोकमें और वेदमें पुरुषोत्तम नामसे प्रसिद्ध हूँ।"},{"c":15,"v":19,"sp":"krishna","sa":"यो मामेवमसम्मूढो जानाति पुरुषोत्तमम् ।\nस सर्वविद्भजति मां सर्वभावेन भारत ॥","tr":"yo māmevamasammūḍho jānāti puruṣottamam\nsa sarvavidbhajati māṃ sarvabhāvena bhārata","gs":"યો મામેવમસમ્મૂઢો જાનાતિ પુરુષોત્તમમ્ ।\nસ સર્વવિદ્ભજતિ માં સર્વભાવેન ભારત ॥","en":"He who, undeluded, knows Me as the highest Purusha, he, knowing all, worships Me with his whole being (heart), O Arjuna.","hi":"हे भरतवंशी अर्जुन ! इस प्रकार जो मोहरहित मनुष्य मुझे पुरुषोत्तम जानता है, वह सर्वज्ञ सब प्रकारसे मेरा ही भजन करता है।"},{"c":15,"v":20,"sp":"krishna","sa":"इति गुह्यतमं शास्त्रमिदमुक्तं मयाऽनघ ।\nएतद्बुद्ध्वा बुद्धिमान्स्यात्कृतकृत्यश्च भारत ॥","tr":"iti guhyatamaṃ śāstramidamuktaṃ mayā'nagha\netadbuddhvā buddhimānsyātkṛtakṛtyaśca bhārata","gs":"ઇતિ ગુહ્યતમં શાસ્ત્રમિદમુક્તં મયાઽનઘ ।\nએતદ્બુદ્ધ્વા બુદ્ધિમાન્સ્યાત્કૃતકૃત્યશ્ચ ભારત ॥","en":"Thus, I have imparted to you this most secret science, O sinless one; by knowing this, one becomes wise, and all their duties are accomplished, O Arjuna.","hi":"हे निष्पाप अर्जुन ! इस प्रकार यह अत्यन्त गोपनीय शास्त्र मेरे द्वारा कहा गया है। हे भरतवंशी अर्जुन ! इसको जानकर मनुष्य ज्ञानवान् (तथा प्राप्त-प्राप्तव्य) और कृतकृत्य हो जाता है।"},{"c":16,"v":1,"sp":"krishna","sa":"अभयं सत्त्वसंशुद्धिः ज्ञानयोगव्यवस्थितिः ।\nदानं दमश्च यज्ञश्च स्वाध्यायस्तप आर्जवम् ॥","tr":"abhayaṃ sattvasaṃśuddhiḥ jñānayogavyavasthitiḥ\ndānaṃ damaśca yajñaśca svādhyāyastapa ārjavam","gs":"અભયં સત્ત્વસંશુદ્ધિઃ જ્ઞાનયોગવ્યવસ્થિતિઃ ।\nદાનં દમશ્ચ યજ્ઞશ્ચ સ્વાધ્યાયસ્તપ આર્જવમ્ ॥","en":"The Blessed Lord said: Fearlessness, purity of heart, steadfastness in knowledge and yoga, almsgiving, control of the senses, sacrifice, study of scriptures, austerity, and straightforwardness.","hi":"श्रीभगवान् बोले -- भयका सर्वथा अभाव; अन्तःकरणकी शुद्धि; ज्ञानके लिये योगमें दृढ़
