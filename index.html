ुतसी क्रियाओंका वर्णन करनेवाली है।"},{"c":2,"v":44,"sp":"krishna","sa":"भोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम् ।\nव्यवसायात्मिका बुद्धिः समाधौ न विधीयते ॥","tr":"bhogaiśvaryaprasaktānāṃ tayāpahṛtacetasām\nvyavasāyātmikā buddhiḥ samādhau na vidhīyate","gs":"ભોગૈશ્વર્યપ્રસક્તાનાં તયાપહૃતચેતસામ્ ।\nવ્યવસાયાત્મિકા બુદ્ધિઃ સમાધૌ ન વિધીયતે ॥","en":"For those who are attached to pleasure and power, whose minds are drawn away by such teachings, their determinate reason is not formed which is steadily bent on meditation and Samadhi (superconscious state).","hi":"उस पुष्पित वाणीसे जिसका अन्तःकरण हर लिया गया है अर्थात् भोगोंकी तरफ खिंच गया है और जो भोग तथा ऐश्वर्यमें अत्यन्त आसक्त हैं, उन मनुष्योंकी परमात्मामें निश्चयात्मिका बुद्धि नहीं होती।"},{"c":2,"v":45,"sp":"krishna","sa":"त्रैगुण्यविषया वेदा निस्त्रैगुण्यो भवार्जुन ।\nनिर्द्वन्द्वो नित्यसत्त्वस्थो निर्योगक्षेम आत्मवान् ॥","tr":"traiguṇyaviṣayā vedā nistraiguṇyo bhavārjuna\nnirdvandvo nityasattvastho niryogakṣema ātmavān","gs":"ત્રૈગુણ્યવિષયા વેદા નિસ્ત્રૈગુણ્યો ભવાર્જુન ।\nનિર્દ્વન્દ્વો નિત્યસત્ત્વસ્થો નિર્યોગક્ષેમ આત્મવાન્ ॥","en":"The Vedas deal with the three attributes; be thou above these three attributes. O Arjuna, free yourself from the pairs of opposites and ever remain in the quality of Sattva, freed from acquisition and preservation, and be established in the Self.","hi":"वेद तीनों गुणोंके कार्यका ही वर्णन करनेवाले हैं; हे अर्जुन! तू तीनों गुणोंसे रहित हो जा, निर्द्वन्द्व हो जा, निरन्तर नित्य वस्तु परमात्मा में स्थित हो जा, योगक्षेमकी चाहना भी मत रख और परमात्मपरायण हो जा।"},{"c":2,"v":46,"sp":"krishna","sa":"यावानर्थ उदपाने सर्वतः संप्लुतोदके ।\nतावान्सर्वेषु वेदेषु ब्राह्मणस्य विजानतः ॥","tr":"yāvānartha udapāne sarvataḥ saṃplutodake\ntāvānsarveṣu vedeṣu brāhmaṇasya vijānataḥ","gs":"યાવાનર્થ ઉદપાને સર્વતઃ સંપ્લુતોદકે ।\nતાવાન્સર્વેષુ વેદેષુ બ્રાહ્મણસ્ય વિજાનતઃ ॥","en":"To the Brahmana who has known the Self, all the Vedas are of as much use as a reservoir of water would be in a place where there is a flood.","hi":"सब तरफसे परिपूर्ण महान् जलाशयके प्राप्त होनेपर छोटे गड्ढों में भरे जल में मनुष्यका जितना प्रयोजन रहता है अर्थात् कुछ भी प्रयोजन नहीं रहता, वेदों और शास्त्रोंको तत्त्वसे जाननेवाले ब्रह्मज्ञानीका सम्पूर्ण वेदोंमें उतना ही प्रयोजन रहता है अर्थात् कुछ भी प्रयोजन नहीं रहता।"},{"c":2,"v":47,"sp":"krishna","sa":"कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥","tr":"karmaṇyevādhikāraste mā phaleṣu kadācana\nmā karmaphalaheturbhūrmā te saṅgo'stvakarmaṇi","gs":"કર્મણ્યેવાધિકારસ્તે મા ફલેષુ કદાચન ।\nમા કર્મફલહેતુર્ભૂર્મા તે સઙ્ગોઽસ્ત્વકર્મણિ ॥","en":"Your right is only to work, but not to its results; do not let the results of action be your motive, nor let your attachment be to inaction.","hi":"कर्तव्य-कर्म करनेमें ही तेरा अधिकार है, फलोंमें कभी नहीं। अतः तू कर्मफलका हेतु भी मत बन और तेरी अकर्मण्यतामें भी आसक्ति न हो।"},{"c":2,"v":48,"sp":"krishna","sa":"योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय ।\nसिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते ॥","tr":"yogasthaḥ kuru karmāṇi saṅgaṃ tyaktvā dhanañjaya\nsiddhyasiddhyoḥ samo bhūtvā samatvaṃ yoga ucyate","gs":"યોગસ્થઃ કુરુ કર્માણિ સઙ્ગં ત્યક્ત્વા ધનઞ્જય ।\nસિદ્ધ્યસિદ્ધ્યોઃ સમો ભૂત્વા સમત્વં યોગ ઉચ્યતે ॥","en":"Perform action, O Arjuna, being steadfast in Yoga, abandoning attachment and balanced in success and failure; evenness of mind is called Yoga.","hi":"हे धनञ्जय ! तू आसक्तिका त्याग करके सिद्धि-असिद्धिमें सम होकर योगमें स्थित हुआ कर्मोंको कर; क्योंकि समत्व ही योग कहा जाता है।"},{"c":2,"v":49,"sp":"krishna","sa":"दूरेण ह्यवरं कर्म बुद्धियोगाद्धनञ्जय ।\nबुद्धौ शरणमन्विच्छ कृपणाः फलहेतवः ॥","tr":"dūreṇa hyavaraṃ karma buddhiyogāddhanañjaya\nbuddhau śaraṇamanviccha kṛpaṇāḥ phalahetavaḥ","gs":"દૂરેણ હ્યવરં કર્મ બુદ્ધિયોગાદ્ધનઞ્જય ।\nબુદ્ધૌ શરણમન્વિચ્છ કૃપણાઃ ફલહેતવઃ ॥","en":"Far lower than the Yoga of wisdom is action, O Arjuna. Seek thou refuge in wisdom; wretched are those whose motive is the fruit.","hi":"बुद्धियोग-(समता) की अपेक्षा सकामकर्म दूरसे (अत्यन्त) ही निकृष्ट है। अतः हे धनञ्जय ! तू बुद्धि (समता) का आश्रय ले; क्योंकि फलके हेतु बननेवाले अत्यन्त दीन हैं।"},{"c":2,"v":50,"sp":"krishna","sa":"बुद्धियुक्तो जहातीह उभे सुकृतदुष्कृते ।\nतस्माद्योगाय युज्यस्व योगः कर्मसु कौशलम् ॥","tr":"buddhiyukto jahātīha ubhe sukṛtaduṣkṛte\ntasmādyogāya yujyasva yogaḥ karmasu kauśalam","gs":"બુદ્ધિયુક્તો જહાતીહ ઉભે સુકૃતદુષ્કૃતે ।\nતસ્માદ્યોગાય યુજ્યસ્વ યોગઃ કર્મસુ કૌશલમ્ ॥","en":"Endowed with wisdom and evenness of mind, one casts off in this life both good and evil deeds; therefore, devote yourself to Yoga; Yoga is skill in action.","hi":"बुद्धि-(समता) से युक्त मनुष्य यहाँ जीवित अवस्थामें ही पुण्य और पाप दोनोंका त्याग कर देता है। अतः तू योग-(समता-) में लग जा, क्योंकि योग ही कर्मोंमें कुशलता है।"},{"c":2,"v":51,"sp":"krishna","sa":"कर्मजं बुद्धियुक्ता हि फलं त्यक्त्वा मनीषिणः ।\nजन्मबन्धविनिर्मुक्ताः पदं गच्छन्त्यनामयम् ॥","tr":"karmajaṃ buddhiyuktā hi phalaṃ tyaktvā manīṣiṇaḥ\njanmabandhavinirmuktāḥ padaṃ gacchantyanāmayam","gs":"કર્મજં બુદ્ધિયુક્તા હિ ફલં ત્યક્ત્વા મનીષિણઃ ।\nજન્મબન્ધવિનિર્મુક્તાઃ પદં ગચ્છન્ત્યનામયમ્ ॥","en":"The wise, possessing knowledge, having abandoned the fruits of their actions, and being freed from the bonds of birth, go to the place which is beyond all evil.","hi":"समतायुक्त मनीषी साधक कर्मजन्य फलका त्याग करके जन्मरूप बन्धनसे मुक्त होकर निर्विकार पदको प्राप्त हो जाते हैं।"},{"c":2,"v":52,"sp":"krishna","sa":"यदा ते मोहकलिलं बुद्धिर्व्यतितरिष्यति ।\nतदा गन्तासि निर्वेदं श्रोतव्यस्य श्रुतस्य च ॥","tr":"yadā te mohakalilaṃ buddhirvyatitariṣyati\ntadā gantāsi nirvedaṃ śrotavyasya śrutasya ca","gs":"યદા તે મોહકલિલં બુદ્ધિર્વ્યતિતરિષ્યતિ ।\nતદા ગન્તાસિ નિર્વેદં શ્રોતવ્યસ્ય શ્રુતસ્ય ચ ॥","en":"When your intellect passes beyond the mire of delusion, then you will attain indifference to what has been heard and what has yet to be heard.","hi":"जिस समय तेरी बुद्धि मोहरूपी दलदलको तर जायगी, उसी समय तू सुने हुए और सुननेमें आनेवाले भोगोंसे वैराग्यको प्राप्त हो जायगा।"},{"c":2,"v":53,"sp":"krishna","sa":"श्रुतिविप्रतिपन्ना ते यदा स्थास्यति निश्चला ।\nसमाधावचला बुद्धिस्तदा योगमवाप्स्यसि ॥","tr":"śrutivipratipannā te yadā sthāsyati niścalā\nsamādhāvacalā buddhistadā yogamavāpsyasi","gs":"શ્રુતિવિપ્રતિપન્ના તે યદા સ્થાસ્યતિ નિશ્ચલા ।\nસમાધાવચલા બુદ્ધિસ્તદા યોગમવાપ્સ્યસિ ॥","en":"When your intellect, which is perplexed by the Vedic texts you have read, stands immovable and steady in the Self, then you will attain Self-realization.","hi":"जिस कालमें शास्त्रीय मतभेदोंसे विचलित हुई तेरी बुद्धि निश्चल हो जायगी और परमात्मामें अचल हो जायगी, उस कालमें तू योगको प्राप्त हो जायगा।"},{"c":2,"v":54,"sp":"arjuna","sa":"स्थितप्रज्ञस्य का भाषा समाधिस्थस्य केशव ।\nस्थितधीः किं प्रभाषेत किमासीत व्रजेत किम् ॥","tr":"sthitaprajñasya kā bhāṣā samādhisthasya keśava\nsthitadhīḥ kiṃ prabhāṣeta kimāsīta vrajeta kim","gs":"સ્થિતપ્રજ્ઞસ્ય કા ભાષા સમાધિસ્થસ્ય કેશવ ।\nસ્થિતધીઃ કિં પ્રભાષેત કિમાસીત વ્રજેત કિમ્ ॥","en":"Arjuna said, \"O Krishna, what is the description of one who has steady wisdom and is merged in the superconscious state? How does one of steady wisdom speak, how do they sit, and how do they walk?\"","hi":"अर्जुन बोले - हे केशव ! परमात्मामें स्थित स्थिर बुद्धिवाले मनुष्यके क्या लक्षण होते हैं? वह स्थिर बुद्धिवाला मनुष्य कैसे बोलता है, कैसे बैठता है और कैसे चलता है?"},{"c":2,"v":55,"sp":"krishna","sa":"प्रजहाति यदा कामान् सर्वान् पार्थ मनोगतान् ।\nआत्मन्येवात्मना तुष्टः स्थितप्रज्ञस्तदोच्यते ॥","tr":"prajahāti yadā kāmān sarvān pārtha manogatān\nātmanyevātmanā tuṣṭaḥ sthitaprajñastadocyate","gs":"પ્રજહાતિ યદા કામાન્ સર્વાન્ પાર્થ મનોગતાન્ ।\nઆત્મન્યેવાત્મના તુષ્ટઃ સ્થિતપ્રજ્ઞસ્તદોચ્યતે ॥","en":"The Blessed Lord said, \"When a man completely casts off, O Arjuna, all the desires of the mind and is satisfied in the Self by the Self, then he is said to be one of steady wisdom.\"","hi":"श्रीभगवान् बोले - हे पृथानन्दन ! जिस कालमें साधक मनोगत सम्पूर्ण कामनाओंका अच्छी तरह त्याग कर देता है और अपने-आपसे अपने-आपमें ही सन्तुष्ट रहता है, उस कालमें वह स्थितप्रज्ञ कहा जाता है।"},{"c":2,"v":56,"sp":"krishna","sa":"दुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः ।\nवीतरागभयक्रोधः स्थितधीर्मुनिरुच्यते ॥","tr":"duḥkheṣvanudvignamanāḥ sukheṣu vigataspṛhaḥ\nvītarāgabhayakrodhaḥ sthitadhīrmunirucyate","gs":"દુઃખેષ્વનુદ્વિગ્નમનાઃ સુખેષુ વિગતસ્પૃહઃ ।\nવીતરાગભયક્રોધઃ સ્થિતધીર્મુનિરુચ્યતે ॥","en":"He whose mind is not shaken by adversity, who does not long for pleasures, and is free from attachment, fear, and anger, is called a sage of steady wisdom.","hi":"दुःखोंकी प्राप्ति होनेपर जिसके मनमें उद्वेग नहीं होता और सुखोंकी प्राप्ति होनेपर जिसके मनमें स्पृहा नहीं होती तथा जो राग, भय और क्रोधसे सर्वथा रहित हो गया है, वह मननशील मनुष्य स्थिरबुद्धि कहा जाता है।"},{"c":2,"v":57,"sp":"krishna","sa":"यः सर्वत्रानभिस्नेहस्तत्तत्प्राप्य शुभाशुभम् ।\nनाभिनन्दति न द्वेष्टि तस्य प्रज्ञा प्रतिष्ठिता ॥","tr":"yaḥ sarvatrānabhisnehastattatprāpya śubhāśubham\nnābhinandati na dveṣṭi tasya prajñā pratiṣṭhitā","gs":"યઃ સર્વત્રાનભિસ્નેહસ્તત્તત્પ્રાપ્ય શુભાશુભમ્ ।\nનાભિનન્દતિ ન દ્વેષ્ટિ તસ્ય પ્રજ્ઞા પ્રતિષ્ઠિતા ॥","en":"He who is everywhere without attachment, upon encountering anything good or bad, neither rejoices nor hastens; his wisdom is firm.","hi":"सब जगह आसक्तिरहित हुआ जो मनुष्य उस-उस शुभ-अशुभको प्राप्त करके न तो अभिनन्दित होता है और न द्वेष करता है, उसकी बुद्धि प्रतिष्ठित है।"},{"c":2,"v":58,"sp":"krishna","sa":"यदा संहरते चायं कूर्मोऽङ्गानीव सर्वशः ।\nइन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता ॥","tr":"yadā saṃharate cāyaṃ kūrmo'ṅgānīva sarvaśaḥ\nindriyāṇīndriyārthebhyastasya prajñā pratiṣṭhitā","gs":"યદા સંહરતે ચાયં કૂર્મોઽઙ્ગાનીવ સર્વશઃ ।\nઇન્દ્રિયાણીન્દ્રિયાર્થેભ્યસ્તસ્ય પ્રજ્ઞા પ્રતિષ્ઠિતા ॥","en":"When, like the tortoise which withdraws all its limbs on all sides, he withdraws his senses from the sense-objects, then his wisdom becomes steady.","hi":"जिस तरह कछुआ अपने अङ्गोंको सब ओरसे समेट लेता है, ऐसे ही जिस कालमें यह कर्मयोगी इन्द्रियोंके विषयोंसे इन्द्रियोंको सब प्रकारसे समेट लेता (हटा लेता) है, तब उसकी बुद्धि प्रतिष्ठित हो जाती है।"},{"c":2,"v":59,"sp":"krishna","sa":"विषया विनिवर्तन्ते निराहारस्य देहिनः ।\nरसवर्जं रसोऽप्यस्य परं दृष्ट्वा निवर्तते ॥","tr":"viṣayā vinivartante nirāhārasya dehinaḥ\nrasavarjaṃ raso'pyasya paraṃ dṛṣṭvā nivartate","gs":"વિષયા વિનિવર્તન્તે નિરાહારસ્ય દેહિનઃ ।\nરસવર્જં રસોઽપ્યસ્ય પરં દૃષ્ટ્વા નિવર્તતે ॥","en":"The objects of the senses turn away from the abstinent man, leaving the longing behind; but his longing also turns away upon seeing the Supreme.","hi":"निराहारी (इन्द्रियोंको विषयोंसे हटानेवाले) मनुष्यके भी विषय तो निवृत्त हो जाते हैं, पर रस निवृत्त नहीं होता। परन्तु इस स्थितप्रज्ञ मनुष्यका तो रस भी परमात्मतत्त्वका अनुभव होनेसे निवृत्त हो जाता है।"},{"c":2,"v":60,"sp":"krishna","sa":"यततो ह्यपि कौन्तेय पुरुषस्य विपश्चितः ।\nइन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः ॥","tr":"yatato hyapi kaunteya puruṣasya vipaścitaḥ\nindriyāṇi pramāthīni haranti prasabhaṃ manaḥ","gs":"યતતો હ્યપિ કૌન્તેય પુરુષસ્ય વિપશ્ચિતઃ ।\nઇન્દ્રિયાણિ પ્રમાથીનિ હરન્તિ પ્રસભં મનઃ ॥","en":"The turbulent senses, O Arjuna, can violently carry away the mind of a wise person, even though they are striving to control them.","hi":"हे कुन्तीनन्दन! (रसबुद्धि रहनेसे) यत्न करते हुए विद्वान् मनुष्यकी भी प्रमथनशील इन्द्रियाँ उसके मनको बलपूर्वक हर लेती हैं।"},{"c":2,"v":61,"sp":"krishna","sa":"तानि सर्वाणि संयम्य युक्त आसीत मत्परः ।\nवशे हि यस्येन्द्रियाणि तस्य प्रज्ञा प्रतिष्ठिता ॥","tr":"tāni sarvāṇi saṃyamya yukta āsīta matparaḥ\nvaśe hi yasyendriyāṇi tasya prajñā pratiṣṭhitā","gs":"તાનિ સર્વાણિ સંયમ્ય યુક્ત આસીત મત્પરઃ ।\nવશે હિ યસ્યેન્દ્રિયાણિ તસ્ય પ્રજ્ઞા પ્રતિષ્ઠિતા ॥","en":"Having restrained them all, he should sit steadfast, intent on Me; his wisdom is steady whose senses are under control.","hi":"कर्मयोगी साधक उन सम्पूर्ण इन्द्रियोंको वशमें करके मेरे परायण होकर बैठे; क्योंकि जिसकी इन्द्रियाँ वशमें हैं, उसकी बुद्धि प्रतिष्ठित है।"},{"c":2,"v":62,"sp":"krishna","sa":"ध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते ।\nसङ्गात् संजायते कामः कामात्क्रोधोऽभिजायते ॥","tr":"dhyāyato viṣayānpuṃsaḥ saṅgasteṣūpajāyate\nsaṅgāt saṃjāyate kāmaḥ kāmātkrodho'bhijāyate","gs":"ધ્યાયતો વિષયાન્પુંસઃ સઙ્ગસ્તેષૂપજાયતે ।\nસઙ્ગાત્ સંજાયતે કામઃ કામાત્ક્રોધોઽભિજાયતે ॥","en":"When one thinks of objects, attachment to them arises; from attachment, desire is born; from desire, anger arises.","hi":"।।2.62 -- 2.63।। विषयोंका चिन्तन करनेवाले मनुष्यकी उन विषयोंमें आसक्ति पैदा हो जाती है। आसक्तिसे कामना पैदा होती है। कामनासे क्रोध पैदा होता है। क्रोध होनेपर सम्मोह (मूढ़भाव) हो जाता है। सम्मोहसे स्मृति भ्रष्ट हो जाती है। स्मृति भ्रष्ट होनेपर बुद्धिका नाश हो जाता है। बुद्धिका नाश होनेपर मनुष्यका पतन हो जाता है।"},{"c":2,"v":63,"sp":"krishna","sa":"क्रोधाद्भवति संमोहः संमोहात्स्मृतिविभ्रमः ।\nस्मृतिभ्रंशाद् बुद्धिनाशो बुद्धिनाशात्प्रणश्यति ॥","tr":"krodhādbhavati saṃmohaḥ saṃmohātsmṛtivibhramaḥ\nsmṛtibhraṃśād buddhināśo buddhināśātpraṇaśyati","gs":"ક્રોધાદ્ભવતિ સંમોહઃ સંમોહાત્સ્મૃતિવિભ્રમઃ ।\nસ્મૃતિભ્રંશાદ્ બુદ્ધિનાશો બુદ્ધિનાશાત્પ્રણશ્યતિ ॥","en":"Anger leads to delusion, which causes loss of memory; this, in turn, leads to the destruction of discrimination, resulting in destruction.","hi":"।।2.62 -- 2.63।। विषयोंका चिन्तन करनेवाले मनुष्यकी उन विषयोंमें आसक्ति पैदा हो जाती है। आसक्तिसे कामना पैदा होती है। कामनासे क्रोध पैदा होता है। क्रोध होनेपर सम्मोह (मूढ़भाव) हो जाता है। सम्मोहसे स्मृति भ्रष्ट हो जाती है। स्मृति भ्रष्ट होनेपर बुद्धिका नाश हो जाता है। बुद्धिका नाश होनेपर मनुष्यका पतन हो जाता है।"},{"c":2,"v":64,"sp":"krishna","sa":"रागद्वेषवियुक्तैस्तु विषयानिन्द्रियैश्चरन् ।\nआत्मवश्यैर्विधेयात्मा प्रसादमधिगच्छति ॥","tr":"rāgadveṣaviyuktaistu viṣayānindriyaiścaran\nātmavaśyairvidheyātmā prasādamadhigacchati","gs":"રાગદ્વેષવિયુક્તૈસ્તુ વિષયાનિન્દ્રિયૈશ્ચરન્ ।\nઆત્મવશ્યૈર્વિધેયાત્મા પ્રસાદમધિગચ્છતિ ॥","en":"But the self-controlled man, moving among objects with the senses restrained and free from attraction and repulsion, attains peace.","hi":"।।2.64 -- 2.65।। वशीभूत अन्तःकरणवाला कर्मयोगी साधक रागद्वेषसे रहित अपने वशमें की हुई इन्द्रियोंके द्वारा विषयोंका सेवन करता हुआ अन्तःकरणकी निर्मलता को प्राप्त हो जाता है। निर्मलता प्राप्त होनेपर साधकके सम्पूर्ण दुःखोंका नाश हो जाता है और ऐसे शुद्ध चित्तवाले साधककी बुद्धि निःसन्देह बहुत जल्दी परमात्मामें स्थिर हो जाती है।"},{"c":2,"v":65,"sp":"krishna","sa":"प्रसादे सर्वदुःखानां हानिरस्योपजायते ।\nप्रसन्नचेतसो ह्याशु बुद्धिः पर्यवतिष्ठते ॥","tr":"prasāde sarvaduḥkhānāṃ hānirasyopajāyate\nprasannacetaso hyāśu buddhiḥ paryavatiṣṭhate","gs":"પ્રસાદે સર્વદુઃખાનાં હાનિરસ્યોપજાયતે ।\nપ્રસન્નચેતસો હ્યાશુ બુદ્ધિઃ પર્યવતિષ્ઠતે ॥","en":"In that peace, all pains are destroyed; for the intellect of the tranquil-minded soon becomes steady.","hi":"।।2.64 -- 2.65।। वशीभूत अन्तःकरणवाला कर्मयोगी साधक रागद्वेषसे रहित अपने वशमें की हुई इन्द्रियोंके द्वारा विषयोंका सेवन करता हुआ अन्तःकरणकी निर्मलता को प्राप्त हो जाता है। निर्मलता प्राप्त होनेपर साधकके सम्पूर्ण दुःखोंका नाश हो जाता है और ऐसे शुद्ध चित्तवाले साधककी बुद्धि निःसन्देह बहुत जल्दी परमात्मामें स्थिर हो जाती है।"},{"c":2,"v":66,"sp":"krishna","sa":"नास्ति बुद्धिरयुक्तस्य न चायुक्तस्य भावना ।\nन चाभावयतः शान्तिरशान्तस्य कुतः सुखम् ॥","tr":"nāsti buddhirayuktasya na cāyuktasya bhāvanā\nna cābhāvayataḥ śāntiraśāntasya kutaḥ sukham","gs":"નાસ્તિ બુદ્ધિરયુક્તસ્ય ન ચાયુક્તસ્ય ભાવના ।\nન ચાભાવયતઃ શાન્તિરશાન્તસ્ય કુતઃ સુખમ્ ॥","en":"There is no knowledge of the Self for the unsteady, and no meditation is possible for the unsteady, and no peace for the unmeditative, and how can there be happiness for one who has no peace?","hi":"जिसके मन-इन्द्रियाँ संयमित नहीं हैं, ऐसे मनुष्यकी व्यवसायात्मिका बुद्धि नहीं होती और व्यवसायात्मिका बुद्धि न होनेसे उसमें कर्तव्यपरायणताकी भावना नहीं होती। ऐसी भावना न होनेसे उसको शान्ति नहीं मिलती। फिर शान्तिरहित मनुष्यको सुख कैसे मिल सकता है?"},{"c":2,"v":67,"sp":"krishna","sa":"इन्द्रियाणां हि चरतां यन्मनोऽनुविधीयते ।\nतदस्य हरति प्रज्ञां वायुर्नावमिवाम्भसि ॥","tr":"indriyāṇāṃ hi caratāṃ yanmano'nuvidhīyate\ntadasya harati prajñāṃ vāyurnāvamivāmbhasi","gs":"ઇન્દ્રિયાણાં હિ ચરતાં યન્મનોઽનુવિધીયતે ।\nતદસ્ય હરતિ પ્રજ્ઞાં વાયુર્નાવમિવામ્ભસિ ॥","en":"For the mind, which follows in the wake of the wandering senses, carries away his discrimination, as the wind carries away a boat on the waters.","hi":"अपने-अपने विषयोंमें विचरती हुई इन्द्रियोंमेंसे एक ही इन्द्रिय जिस मनको अपना अनुगामी बना लेती है, वह अकेला मन जलमें नौकाको वायुकी तरह इसकी बुद्धिको हर लेता है।"},{"c":2,"v":68,"sp":"krishna","sa":"तस्माद्यस्य महाबाहो निगृहीतानि सर्वशः ।\nइन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता ॥","tr":"tasmādyasya mahābāho nigṛhītāni sarvaśaḥ\nindriyāṇīndriyārthebhyastasya prajñā pratiṣṭhitā","gs":"તસ્માદ્યસ્ય મહાબાહો નિગૃહીતાનિ સર્વશઃ ।\nઇન્દ્રિયાણીન્દ્રિયાર્થેભ્યસ્તસ્ય પ્રજ્ઞા પ્રતિષ્ઠિતા ॥","en":"Therefore, O mighty-armed Arjuna, his knowledge is steady whose senses are completely restrained from sense objects.","hi":"इसलिये हे महाबाहो ! जिस मनुष्यकी इन्द्रियाँ इन्द्रियोंके विषयोंसे सर्वथा निगृहीत (वशमें की हुई) हैं, उसकी बुद्धि स्थिर है।"},{"c":2,"v":69,"sp":"krishna","sa":"या निशा सर्वभूतानां तस्यां जागर्ति संयमी ।\nयस्यां जाग्रति भूतानि सा निशा पश्यतो मुनेः ॥","tr":"yā niśā sarvabhūtānāṃ tasyāṃ jāgarti saṃyamī\nyasyāṃ jāgrati bhūtāni sā niśā paśyato muneḥ","gs":"યા નિશા સર્વભૂતાનાં તસ્યાં જાગર્તિ સંયમી ।\nયસ્યાં જાગ્રતિ ભૂતાનિ સા નિશા પશ્યતો મુનેઃ ॥","en":"That which is night to all beings, in that the self-controlled man is awake; when all beings are awake, that is night for the sage who sees.","hi":"सम्पूर्ण प्राणियों की जो रात (परमात्मासे विमुखता) है, उसमें संयमी मनुष्य जागता है, और जिसमें सब प्राणी जागते हैं (भोग और संग्रहमें लगे रहते हैं), वह तत्त्वको जाननेवाले मुनिकी दृष्टिमें रात है।"},{"c":2,"v":70,"sp":"krishna","sa":"आपूर्यमाणमचलप्रतिष्ठं  समुद्रमापः प्रविशन्ति यद्वत् ।\nतद्वत्कामा यं प्रविशन्ति सर्वे  स शान्तिमाप्नोति न कामकामी ॥","tr":"āpūryamāṇamacalapratiṣṭhaṃ  samudramāpaḥ praviśanti yadvat\ntadvatkāmā yaṃ praviśanti sarve  sa śāntimāpnoti na kāmakāmī","gs":"આપૂર્યમાણમચલપ્રતિષ્ઠં  સમુદ્રમાપઃ પ્રવિશન્તિ યદ્વત્ ।\nતદ્વત્કામા યં પ્રવિશન્તિ સર્વે  સ શાન્તિમાપ્નોતિ ન કામકામી ॥","en":"He attains peace into whom all desires enter, just as waters enter the ocean which, filled from all sides, remains unmoved; but not the man who is full of desires.","hi":"जैसे सम्पूर्ण नदियोंका जल चारों ओरसे जलद्वारा परिपूर्ण समुद्रमें आकर मिलता है, पर समुद्र अपनी मर्यादामें अचल प्रतिष्ठित रहता है ऐसे ही सम्पूर्ण भोग-पदार्थ जिस संयमी मनुष्य को विकार उत्पन्न किये बिना ही उसको प्राप्त होते हैं, वही मनुष्य परमशान्तिको प्राप्त होता है, भोगोंकी कामनावाला नहीं।"},{"c":2,"v":71,"sp":"krishna","sa":"विहाय कामान्यः सर्वान्पुमांश्चरति निःस्पृहः ।\nनिर्ममो निरहंकारः स शांतिमधिगच्छति ॥","tr":"vihāya kāmānyaḥ sarvānpumāṃścarati niḥspṛhaḥ\nnirmamo nirahaṃkāraḥ sa śāṃtimadhigacchati","gs":"વિહાય કામાન્યઃ સર્વાન્પુમાંશ્ચરતિ નિઃસ્પૃહઃ ।\nનિર્મમો નિરહંકારઃ સ શાંતિમધિગચ્છતિ ॥","en":"That person attains peace who, abandoning all desires, moves about without longing, without the sense of ownership, and without egoism.","hi":"जो मनुष्य सम्पूर्ण कामनाओंका त्याग करके स्पृहारहित, ममतारहित और अहंकाररहित होकर आचरण करता है, वह शान्तिको प्राप्त होता है।"},{"c":2,"v":72,"sp":"krishna","sa":"एषा ब्राह्मी स्थितिः पार्थ नैनां प्राप्य विमुह्यति ।\nस्थित्वाऽस्यामन्तकालेऽपि ब्रह्मनिर्वाणमृच्छति ॥","tr":"eṣā brāhmī sthitiḥ pārtha naināṃ prāpya vimuhyati\nsthitvā'syāmantakāle'pi brahmanirvāṇamṛcchati","gs":"એષા બ્રાહ્મી સ્થિતિઃ પાર્થ નૈનાં પ્રાપ્ય વિમુહ્યતિ ।\nસ્થિત્વાઽસ્યામન્તકાલેઽપિ બ્રહ્મનિર્વાણમૃચ્છતિ ॥","en":"O son of Pritha, this is the eternal state, the Brahmic seat. Attaining this, one is not deluded. Being established in it, one attains oneness with Brahman even at the end of life.","hi":"हे पृथानन्दन ! यह ब्राह्मी स्थिति है। इसको प्राप्त होकर कभी कोई मोहित नहीं होता। इस स्थितिमें यदि अन्तकालमें भी स्थित हो जाय, तो निर्वाण (शान्त) ब्रह्मकी प्राप्ति हो जाती है।"},{"c":3,"v":1,"sp":"arjuna","sa":"ज्यायसी चेत्कर्मणस्ते मता बुद्धिर्जनार्दन ।\nतत्किं कर्मणि घोरे मां नियोजयसि केशव ॥","tr":"jyāyasī cetkarmaṇaste matā buddhirjanārdana\ntatkiṃ karmaṇi ghore māṃ niyojayasi keśava","gs":"જ્યાયસી ચેત્કર્મણસ્તે મતા બુદ્ધિર્જનાર્દન ।\nતત્કિં કર્મણિ ઘોરે માં નિયોજયસિ કેશવ ॥","en":"Arjuna said: If Thou thinkest that knowledge is superior to action, O Krishna, why then, O Kesava, doest Thou ask me to engage in this terrible action?","hi":"।।3.1 -- 3.2।। अर्जुन बोले -- हे जनार्दन! अगर आप कर्मसे बुद्धि- (ज्ञान-) को श्रेष्ठ मानते हैं, तो फिर हे केशव ! मुझे घोर कर्ममें क्यों लगाते हैं ? आप अपने मिले हुए-से वचनोंसे मेरी बुद्धिको मोहित-सी कर रहे हैं। अतः आप निश्चय करके उस एक बात को कहिये, जिससे मैं कल्याणको प्राप्त हो जाऊँ।"},{"c":3,"v":2,"sp":"arjuna","sa":"व्यामिश्रेणेव वाक्येन बुद्धिं मोहयसीव मे ।\nतदेकं वद निश्िचत्य येन श्रेयोऽहमाप्नुयाम् ॥","tr":"vyāmiśreṇeva vākyena buddhiṃ mohayasīva me\ntadekaṃ vada niśicatya yena śreyo'hamāpnuyām","gs":"વ્યામિશ્રેણેવ વાક્યેન બુદ્ધિં મોહયસીવ મે ।\nતદેકં વદ નિશ્િચત્ય યેન શ્રેયોઽહમાપ્નુયામ્ ॥","en":"With this seemingly perplexing speech, you seem to be confusing my understanding; therefore, tell me one certain way by which I may attain bliss.","hi":"।।3.1 -- 3.2।। अर्जुन बोले -- हे जनार्दन! अगर आप कर्मसे बुद्धि- (ज्ञान-) को श्रेष्ठ मानते हैं, तो फिर हे केशव! मुझे घोर कर्ममें क्यों लगाते हैं ? आप अपने मिले हुए-से वचनोंसे मेरी बुद्धिको मोहित-सी कर रहे हैं। अतः आप निश्चय करके एक बात को कहिये, जिससे मैं कल्याणको प्राप्त हो जाऊँ।"},{"c":3,"v":3,"sp":"krishna","sa":"लोकेऽस्मिन्द्विविधा निष्ठा पुरा प्रोक्ता मयानघ ।\nज्ञानयोगेन सांख्यानां कर्मयोगेन योगिनाम् ॥","tr":"loke'smindvividhā niṣṭhā purā proktā mayānagha\njñānayogena sāṃkhyānāṃ karmayogena yoginām","gs":"લોકેઽસ્મિન્દ્વિવિધા નિષ્ઠા પુરા પ્રોક્તા મયાનઘ ।\nજ્ઞાનયોગેન સાંખ્યાનાં કર્મયોગેન યોગિનામ્ ॥","en":"The Blessed Lord said, \"In this world, there is a twofold path, as I said before, O sinless one: the path of knowledge of the Sankhyas and the path of action of the Yogins.\"","hi":"श्रीभगवान् बोले - हे निष्पाप अर्जुन! इस मनुष्यलोकमें दो प्रकारसे होनेवाली निष्ठा मेरे द्वारा पहले कही गयी है। उनमें ज्ञानियोंकी निष्ठा ज्ञानयोगसे और योगियोंकी निष्ठा कर्मयोगसे होती है।"},{"c":3,"v":4,"sp":"krishna","sa":"न कर्मणामनारम्भान्नैष्कर्म्यं पुरुषोऽश्नुते ।\nन च संन्यसनादेव सिद्धिं समधिगच्छति ॥","tr":"na karmaṇāmanārambhānnaiṣkarmyaṃ puruṣo'śnute\nna ca saṃnyasanādeva siddhiṃ samadhigacchati","gs":"ન કર્મણામનારમ્ભાન્નૈષ્કર્મ્યં પુરુષોઽશ્નુતે ।\nન ચ સંન્યસનાદેવ સિદ્ધિં સમધિગચ્છતિ ॥","en":"Man does not reach actionlessness by not performing actions; nor does he attain perfection by mere renunciation.","hi":"मनुष्य न तो कर्मोंका आरम्भ किये बिना निष्कर्मताको प्राप्त होता है और न कर्मोंके त्यागमात्रसे सिद्धिको ही प्राप्त होता है।"},{"c":3,"v":5,"sp":"krishna","sa":"न हि कश्िचत्क्षणमपि जातु तिष्ठत्यकर्मकृत् ।\nकार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः ॥","tr":"na hi kaśicatkṣaṇamapi jātu tiṣṭhatyakarmakṛt\nkāryate hyavaśaḥ karma sarvaḥ prakṛtijairguṇaiḥ","gs":"ન હિ કશ્િચત્ક્ષણમપિ જાતુ તિષ્ઠત્યકર્મકૃત્ ।\nકાર્યતે હ્યવશઃ કર્મ સર્વઃ પ્રકૃતિજૈર્ગુણૈઃ ॥","en":"Verily, no one can remain for even a moment without performing action; for everyone is made to act helplessly, indeed, by the qualities born of Nature.","hi":"कोई भी मनुष्य किसी भी अवस्थामें क्षणमात्र भी कर्म किये बिना नहीं रह सकता; क्योंकि (प्रकृतिके) परवश हुए सब प्राणियोंसे प्रकृतिजन्य गुण कर्म कराते हैं।"},{"c":3,"v":6,"sp":"krishna","sa":"कर्मेन्द्रियाणि संयम्य य आस्ते मनसा स्मरन् ।\nइन्द्रियार्थान्विमूढात्मा मिथ्याचारः स उच्यते ॥","tr":"karmendriyāṇi saṃyamya ya āste manasā smaran\nindriyārthānvimūḍhātmā mithyācāraḥ sa ucyate","gs":"કર્મેન્દ્રિયાણિ સંયમ્ય ય આસ્તે મનસા સ્મરન્ ।\nઇન્દ્રિયાર્થાન્વિમૂઢાત્મા મિથ્યાચારઃ સ ઉચ્યતે ॥","en":"He who, restraining the organs of action, sits thinking of the sense-objects in his mind, he of deluded understanding is called a hypocrite.","hi":"जो कर्मेन्द्रियों- (सम्पूर्ण इन्द्रियों-) को हठपूर्वक रोककर मनसे इन्द्रियोंके विषयोंका चिन्तन करता रहता है, वह मूढ़ बुद्धिवाला मनुष्य मिथ्याचारी (मिथ्या आचरण करनेवाला) कहा जाता है।"},{"c":3,"v":7,"sp":"krishna","sa":"यस्त्विन्द्रियाणि मनसा नियम्यारभतेऽर्जुन ।\nकर्मेन्द्रियैः कर्मयोगमसक्तः स विशिष्यते ॥","tr":"yastvindriyāṇi manasā niyamyārabhate'rjuna\nkarmendriyaiḥ karmayogamasaktaḥ sa viśiṣyate","gs":"યસ્ત્વિન્દ્રિયાણિ મનસા નિયમ્યારભતેઽર્જુન ।\nકર્મેન્દ્રિયૈઃ કર્મયોગમસક્તઃ સ વિશિષ્યતે ॥","en":"But whoever, controlling the senses by the mind, O Arjuna, engages himself in Karma Yoga with the organs of action, without attachment, he excels.","hi":"हे अर्जुन! जो मनुष्य मनसे इन्द्रियोंपर नियन्त्रण करके आसक्तिरहित होकर (निष्काम भावसे) समस्त इन्द्रियोंके द्वारा कर्मयोगका आचरण करता है, वही श्रेष्ठ है।"},{"c":3,"v":8,"sp":"krishna","sa":"नियतं कुरु कर्म त्वं कर्म ज्यायो ह्यकर्मणः ।\nशरीरयात्रापि च ते न प्रसिद्ध्येदकर्मणः ॥","tr":"niyataṃ kuru karma tvaṃ karma jyāyo hyakarmaṇaḥ\nśarīrayātrāpi ca te na prasiddhyedakarmaṇaḥ","gs":"નિયતં કુરુ કર્મ ત્વં કર્મ જ્યાયો હ્યકર્મણઃ ।\nશરીરયાત્રાપિ ચ તે ન પ્રસિદ્ધ્યેદકર્મણઃ ॥","en":"Perform your bounden duty, for action is superior to inaction, and even the maintenance of the body would not be possible for you through inaction.","hi":"तू शास्त्रविधिसे नियत किये हुए कर्तव्य-कर्म कर; क्योंकि कर्म न करनेकी अपेक्षा कर्म करना श्रेष्ठ है तथा कर्म न करनेसे तेरा शरीर-निर्वाह भी सिद्ध नहीं होगा।"},{"c":3,"v":9,"sp":"krishna","sa":"यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः ।\nतदर्थं कर्म कौन्तेय मुक्तसंगः समाचर ॥","tr":"yajñārthātkarmaṇo'nyatra loko'yaṃ karmabandhanaḥ\ntadarthaṃ karma kaunteya muktasaṃgaḥ samācara","gs":"યજ્ઞાર્થાત્કર્મણોઽન્યત્ર લોકોઽયં કર્મબન્ધનઃ ।\nતદર્થં કર્મ કૌન્તેય મુક્તસંગઃ સમાચર ॥","en":"The world is bound by actions other than those performed for the sake of sacrifice; do thou, therefore, O son of Kunti (Arjuna), perform actions for that sake alone, free from attachment.","hi":"यज्ञ (कर्तव्यपालन) के लिये किये जानेवाले कर्मोंसे अन्यत्र (अपने लिये किये जानेवाले) कर्मोंमें लगा हुआ यह मनुष्य-समुदाय कर्मोंसे बँधता है, इसलिये हे कुन्तीनन्दन ! तू आसक्ति-रहित होकर उस यज्ञके लिये ही कर्तव्य-कर्म कर।"},{"c":3,"v":10,"sp":"krishna","sa":"सहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः ।\nअनेन प्रसविष्यध्वमेष वोऽस्त्विष्टकामधुक् ॥","tr":"sahayajñāḥ prajāḥ sṛṣṭvā purovāca prajāpatiḥ\nanena prasaviṣyadhvameṣa vo'stviṣṭakāmadhuk","gs":"સહયજ્ઞાઃ પ્રજાઃ સૃષ્ટ્વા પુરોવાચ પ્રજાપતિઃ ।\nઅનેન પ્રસવિષ્યધ્વમેષ વોઽસ્ત્વિષ્ટકામધુક્ ॥","en":"The Creator, having in the beginning created mankind together with sacrifice, said, \"By this shall you propagate; let this be the milch cow of your desires—the cow that yields all the desired objects.\"","hi":"।।3.10 -- 3.11।। प्रजापति ब्रह्माजीने सृष्टिके आदिकालमें कर्तव्य-कर्मोंके विधानसहित प्रजा-(मनुष्य आदि-) की रचना करके उनसे (प्रधानतया मनुष्योंसे) कहा कि तुमलोग इस कर्तव्यके द्वारा सबकी वृद्धि करो और वह कर्तव्य-कर्म-रूप यज्ञ तुमलोगोंको कर्तव्य-पालनकी आवश्यक सामग्री प्रदान करनेवाला हो। अपने कर्तव्य-कर्मके द्वारा तुमलोग देवताओंको उन्नत करो और वे देवतालोग अपने कर्तव्यके द्वारा तुमलोगोंको उन्नत करें। इस प्रकार एक-दूसरेको उन्नत करते हुए तुमलोग परम कल्याणको प्राप्त हो जाओगे।"},{"c":3,"v":11,"sp":"krishna","sa":"देवान्भावयतानेन ते देवा भावयन्तु वः ।\nपरस्परं भावयन्तः श्रेयः परमवाप्स्यथ ॥","tr":"devānbhāvayatānena te devā bhāvayantu vaḥ\nparasparaṃ bhāvayantaḥ śreyaḥ paramavāpsyatha","gs":"દેવાન્ભાવયતાનેન તે દેવા ભાવયન્તુ વઃ ।\nપરસ્પરં ભાવયન્તઃ શ્રેયઃ પરમવાપ્સ્યથ ॥","en":"With this, nourish the gods, and may the gods nourish you; thus, nourishing each other, you shall attain the highest good.","hi":"।।3.10 -- 3.11।। प्रजापति ब्रह्माजीने सृष्टिके आदिकालमें कर्तव्य-कर्मोंके विधानसहित प्रजा-(मनुष्य आदि-) की रचना करके (उनसे, प्रधानतया मनुष्योंसे) कहा कि तुमलोग इस कर्तव्यके द्वारा सबकी वृद्धि करो और वह कर्तव्य-कर्म-रूप यज्ञ तुमलोगोंको कर्तव्य-पालनकी आवश्यक सामग्री प्रदान करनेवाला हो। अपने कर्तव्य-कर्मके द्वारा तुमलोग देवताओंको उन्नत करो और वे देवतालोग अपने कर्तव्यके द्वारा तुमलोगोंको उन्नत करें। इस प्रकार एक-दूसरेको उन्नत करते हुए तुमलोग परम कल्याणको प्राप्त हो जाओगे।"},{"c":3,"v":12,"sp":"krishna","sa":"इष्टान्भोगान्हि वो देवा दास्यन्ते यज्ञभाविताः ।\nतैर्दत्तानप्रदायैभ्यो यो भुङ्क्ते स्तेन एव सः ॥","tr":"iṣṭānbhogānhi vo devā dāsyante yajñabhāvitāḥ\ntairdattānapradāyaibhyo yo bhuṅkte stena eva saḥ","gs":"ઇષ્ટાન્ભોગાન્હિ વો દેવા દાસ્યન્તે યજ્ઞભાવિતાઃ ।\nતૈર્દત્તાનપ્રદાયૈભ્યો યો ભુઙ્ક્તે સ્તેન એવ સઃ ॥","en":"The gods, nourished by the sacrifice, will give you the desired objects. So, he who enjoys the objects given by the gods without offering anything in return is indeed a thief.","hi":"यज्ञसे भावित (पुष्ट) हुए देवता भी तुमलोगोंको (बिना माँगे ही) कर्तव्य-पालनकी आवश्यक सामग्री देते रहेंगे। इस प्रकार उन देवताओंसे प्राप्त हुई सामग्रीको दूसरोंकी सेवामें लगाये बिना जो मनुष्य स्वयं ही उसका उपभोग करता है, वह चोर ही है।"},{"c":3,"v":13,"sp":"krishna","sa":"यज्ञशिष्टाशिनः सन्तो मुच्यन्ते सर्वकिल्बिषैः ।\nभुञ्जते ते त्वघं पापा ये पचन्त्यात्मकारणात् ॥","tr":"yajñaśiṣṭāśinaḥ santo mucyante sarvakilbiṣaiḥ\nbhuñjate te tvaghaṃ pāpā ye pacantyātmakāraṇāt","gs":"યજ્ઞશિષ્ટાશિનઃ સન્તો મુચ્યન્તે સર્વકિલ્બિષૈઃ ।\nભુઞ્જતે તે ત્વઘં પાપા યે પચન્ત્યાત્મકારણાત્ ॥","en":"The righteous who eat the remnants of the sacrifice are freed from all sins; but those sinful ones who cook food solely for their own sake indeed consume sin.","hi":"यज्ञशेष- (योग-) का अनुभव करनेवाले श्रेष्ठ मनुष्य सम्पूर्ण पापोंसे मुक्त हो जाते हैं। परन्तु जो केवल अपने लिये ही पकाते अर्थात् सब कर्म करते हैं, वे पापीलोग तो पापका ही भक्षण करते हैं।"},{"c":3,"v":14,"sp":"krishna","sa":"अन्नाद्भवन्ति भूतानि पर्जन्यादन्नसम्भवः ।\nयज्ञाद्भवति पर्जन्यो यज्ञः कर्मसमुद्भवः ॥","tr":"annādbhavanti bhūtāni parjanyādannasambhavaḥ\nyajñādbhavati parjanyo yajñaḥ karmasamudbhavaḥ","gs":"અન્નાદ્ભવન્તિ ભૂતાનિ પર્જન્યાદન્નસમ્ભવઃ ।\nયજ્ઞાદ્ભવતિ પર્જન્યો યજ્ઞઃ કર્મસમુદ્ભવઃ ॥","en":"From food come forth beings; from rain, food is produced; from sacrifice arises rain, and sacrifice is born of action.","hi":"।।3.14 -- 3.15।। सम्पूर्ण प्राणी अन्नसे उत्पन्न होते हैं। अन्न वर्षासे होती है। वर्षा यज्ञसे होती है। यज्ञ कर्मोंसे निष्पन्न होता है। कर्मोंको तू वेदसे उत्पन्न जान और वेदको अक्षरब्रह्मसे प्रकट हुआ जान। इसलिये वह सर्वव्यापी परमात्मा यज्ञ (कर्तव्य-कर्म) में नित्य प्रतिष्ठित है।"},{"c":3,"v":15,"sp":"krishna","sa":"कर्म ब्रह्मोद्भवं विद्धि ब्रह्माक्षरसमुद्भवम् ।\nतस्मात्सर्वगतं ब्रह्म नित्यं यज्ञे प्रतिष्ठितम् ॥","tr":"karma brahmodbhavaṃ viddhi brahmākṣarasamudbhavam\ntasmātsarvagataṃ brahma nityaṃ yajñe pratiṣṭhitam","gs":"કર્મ બ્રહ્મોદ્ભવં વિદ્ધિ બ્રહ્માક્ષરસમુદ્ભવમ્ ।\nતસ્માત્સર્વગતં બ્રહ્મ નિત્યં યજ્ઞે પ્રતિષ્ઠિતમ્ ॥","en":"Know that action comes from Brahma, and Brahma comes from the Imperishable. Therefore, the all-pervasive Brahma ever rests in sacrifice.","hi":"।।3.14 -- 3.15।। सम्पूर्ण प्राणी अन्नसे उत्पन्न होते हैं। अन्न वर्षासे होती है। वर्षा यज्ञसे होती है। यज्ञ कर्मोंसे निष्पन्न होता है। कर्मोंको तू वेदसे उत्पन्न जान और वेदको अक्षरब्रह्मसे प्रकट हुआ जान। इसलिये वह सर्वव्यापी परमात्मा यज्ञ (कर्तव्य-कर्म) में नित्य प्रतिष्ठित है।"},{"c":3,"v":16,"sp":"krishna","sa":"एवं प्रवर्तितं चक्रं नानुवर्तयतीह यः ।\nअघायुरिन्द्रियारामो मोघं पार्थ स जीवति ॥","tr":"evaṃ pravartitaṃ cakraṃ nānuvartayatīha yaḥ\naghāyurindriyārāmo moghaṃ pārtha sa jīvati","gs":"એવં પ્રવર્તિતં ચક્રં નાનુવર્તયતીહ યઃ ।\nઅઘાયુરિન્દ્રિયારામો મોઘં પાર્થ સ જીવતિ ॥","en":"He who does not follow the wheel thus set in motion, who is of sinful life, rejoicing in the senses, lives in vain, O Arjuna.","hi":"हे पार्थ! जो मनुष्य इस लोकमें इस प्रकार परम्परासे प्रचलित सृष्टिचक्रके अनुसार नहीं चलता, वह इन्द्रियोंके द्वारा भोगोंमें रमण करनेवाला अघायु (पापमय जीवन बितानेवाला) मनुष्य संसारमें व्यर्थ ही जीता है।"},{"c":3,"v":17,"sp":"krishna","sa":"यस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः ।\nआत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते ॥","tr":"yastvātmaratireva syādātmatṛptaśca mānavaḥ\nātmanyeva ca santuṣṭastasya kāryaṃ na vidyate","gs":"યસ્ત્વાત્મરતિરેવ સ્યાદાત્મતૃપ્તશ્ચ માનવઃ ।\nઆત્મન્યેવ ચ સન્તુષ્ટસ્તસ્ય કાર્યં ન વિદ્યતે ॥","en":"But for that man who rejoices only in the Self, who is satisfied with the Self and is content in the Self alone, indeed there is nothing to do.","hi":"जो मनुष्य अपने-आपमें ही रमण करनेवाला और अपने-आपमें ही तृप्त तथा अपने-आपमें ही संतुष्ट है, उसके लिये कोई कर्तव्य नहीं है।"},{"c":3,"v":18,"sp":"krishna","sa":"नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन ।\nन चास्य सर्वभूतेषु कश्िचदर्थव्यपाश्रयः ॥","tr":"naiva tasya kṛtenārtho nākṛteneha kaścana\nna cāsya sarvabhūteṣu kaśicadarthavyapāśrayaḥ","gs":"નૈવ તસ્ય કૃતેનાર્થો નાકૃતેનેહ કશ્ચન ।\nન ચાસ્ય સર્વભૂતેષુ કશ્િચદર્થવ્યપાશ્રયઃ ॥","en":"For him, there is no interest whatsoever in what is done or not done; nor does he depend on any being for any purpose.","hi":"उस (कर्मयोगसे सिद्ध हुए) महापुरुषका इस संसारमें न तो कर्म करनेसे कोई प्रयोजन रहता है, और न कर्म न करनेसे ही कोई प्रयोजन रहता है, तथा सम्पूर्ण प्राणियोंमें (किसी भी प्राणीके साथ) इसका किञ्चिन्मात्र भी स्वार्थका सम्बन्ध नहीं रहता।"},{"c":3,"v":19,"sp":"krishna","sa":"तस्मादसक्तः सततं कार्यं कर्म समाचर ।\nअसक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः ॥","tr":"tasmādasaktaḥ satataṃ kāryaṃ karma samācara\nasakto hyācarankarma paramāpnoti pūruṣaḥ","gs":"તસ્માદસક્તઃ સતતં કાર્યં કર્મ સમાચર ।\nઅસક્તો હ્યાચરન્કર્મ પરમાપ્નોતિ પૂરુષઃ ॥","en":"Therefore, without attachment, always perform the actions that should be done; for by performing actions without attachment, one reaches the Supreme.","hi":"इसलिये तू निरन्तर आसक्तिरहित होकर कर्तव्य-कर्मका भलीभाँति आचरण कर; क्योंकि आसक्तिरहित होकर कर्म करता हुआ मनुष्य परमात्माको प्राप्त हो जाता है।"},{"c":3,"v":20,"sp":"krishna","sa":"कर्मणैव हि संसिद्धिमास्थिता जनकादयः ।\nलोकसंग्रहमेवापि संपश्यन्कर्तुमर्हसि ॥","tr":"karmaṇaiva hi saṃsiddhimāsthitā janakādayaḥ\nlokasaṃgrahamevāpi saṃpaśyankartumarhasi","gs":"કર્મણૈવ હિ સંસિદ્ધિમાસ્થિતા જનકાદયઃ ।\nલોકસંગ્રહમેવાપિ સંપશ્યન્કર્તુમર્હસિ ॥","en":"Janaka and others attained perfection indeed through action alone; even with the intention of protecting the masses, you should perform action.","hi":"राजा जनक-जैसे अनेक महापुरुष भी कर्मके द्वारा ही परमसिद्धिको प्राप्त हुए हैं। इसलिये लोकसंग्रहको देखते हुए भी तू (निष्कामभावसे) कर्म करनेके योग्य है।"},{"c":3,"v":21,"sp":"krishna","sa":"यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः ।\nस यत्प्रमाणं कुरुते लोकस्तदनुवर्तते ॥","tr":"yadyadācarati śreṣṭhastattadevetaro janaḥ\nsa yatpramāṇaṃ kurute lokastadanuvartate","gs":"યદ્યદાચરતિ શ્રેષ્ઠસ્તત્તદેવેતરો જનઃ ।\nસ યત્પ્રમાણં કુરુતે લોકસ્તદનુવર્તતે ॥","en":"Whatever a great man does, others also do; whatever he establishes as the standard, the world follows.","hi":"श्रेष्ठ मनुष्य जो-जो आचरण करता है, दूसरे मनुष्य वैसा-वैसा ही आचरण करते हैं। वह जो कुछ प्रमाण देता है, दूसरे मनुष्य उसीके अनुसार आचरण करते हैं।"},{"c":3,"v":22,"sp":"krishna","sa":"न मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किञ्चन ।\nनानवाप्तमवाप्तव्यं वर्त एव च कर्मणि ॥","tr":"na me pārthāsti kartavyaṃ triṣu lokeṣu kiñcana\nnānavāptamavāptavyaṃ varta eva ca karmaṇi","gs":"ન મે પાર્થાસ્તિ કર્તવ્યં ત્રિષુ લોકેષુ કિઞ્ચન ।\nનાનવાપ્તમવાપ્તવ્યં વર્ત એવ ચ કર્મણિ ॥","en":"There is nothing in the three worlds, O Arjuna, that needs to be done by Me, nor is there anything unattained that needs to be attained; yet I engage Myself in action.","hi":"हे पार्थ! मुझे तीनों लोकोंमें न तो कुछ कर्तव्य है और न कोई प्राप्त करनेयोग्य वस्तु अप्राप्त है, फिर भी मैं कर्तव्यकर्ममें ही लगा रहता हूँ।"},{"c":3,"v":23,"sp":"krishna","sa":"यदि ह्यहं न वर्तेयं जातु कर्मण्यतन्द्रितः ।\nमम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः ॥","tr":"yadi hyahaṃ na varteyaṃ jātu karmaṇyatandritaḥ\nmama vartmānuvartante manuṣyāḥ pārtha sarvaśaḥ","gs":"યદિ હ્યહં ન વર્તેયં જાતુ કર્મણ્યતન્દ્રિતઃ ।\nમમ વર્ત્માનુવર્તન્તે મનુષ્યાઃ પાર્થ સર્વશઃ ॥","en":"For, should I not ever engage myself in action, unwearied, people would in every way follow my path, O Arjuna.","hi":"।।3.23 -- 3.24।। हे पार्थ! अगर मैं किसी समय सावधान होकर कर्तव्यकर्म न करूँ तो बड़ी हानि हो जाय; क्योंकि मनुष्य सब प्रकारसे मेरे ही मार्गका अनुसरण करते हैं। यदि मैं कर्म न करूँ, तो ये सब मनुष्य नष्ट-भ्रष्ट हो जायँ और मैं वर्णसंकरताको करनेवाला होऊँ तथा इस समस्त प्रजाको नष्ट करनेवाला बनूँ।"},{"c":3,"v":24,"sp":"krishna","sa":"उत्सीदेयुरिमे लोका न कुर्यां कर्म चेदहम् ।\nसङ्करस्य च कर्ता स्यामुपहन्यामिमाः प्रजाः ॥","tr":"utsīdeyurime lokā na kuryāṃ karma cedaham\nsaṅkarasya ca kartā syāmupahanyāmimāḥ prajāḥ","gs":"ઉત્સીદેયુરિમે લોકા ન કુર્યાં કર્મ ચેદહમ્ ।\nસઙ્કરસ્ય ચ કર્તા સ્યામુપહન્યામિમાઃ પ્રજાઃ ॥","en":"These worlds would perish if I did not perform action; I would be the author of confusion of castes and destruction of these beings.","hi":"।।3.23 -- 3.24।। हे पार्थ ! अगर मैं किसी समय सावधान होकर कर्तव्य-कर्म न करूँ (तो बड़ी हानि हो जाय; क्योंकि) मनुष्य सब प्रकारसे मेरे ही मार्गका अनुसरण करते हैं। यदि मैं कर्म न करूँ, तो ये सब मनुष्य नष्ट-भ्रष्ट हो जायँ और मैं वर्णसंकरताको करनेवाला तथा इस समस्त प्रजाको नष्ट करनेवाला बनूँ।"},{"c":3,"v":25,"sp":"krishna","sa":"सक्ताः कर्मण्यविद्वांसो यथा कुर्वन्ति भारत ।\nकुर्याद्विद्वांस्तथासक्तश्िचकीर्षुर्लोकसंग्रहम् ॥","tr":"saktāḥ karmaṇyavidvāṃso yathā kurvanti bhārata\nkuryādvidvāṃstathāsaktaśicakīrṣurlokasaṃgraham","gs":"સક્તાઃ કર્મણ્યવિદ્વાંસો યથા કુર્વન્તિ ભારત ।\nકુર્યાદ્વિદ્વાંસ્તથાસક્તશ્િચકીર્ષુર્લોકસંગ્રહમ્ ॥","en":"As the ignorant act out of attachment to action, O Bharata, so should the wise act without attachment, wishing for the welfare of the world.","hi":"।।3.25 -- 3.26।। हे भरतवंशोद्भव अर्जुन! कर्ममें आसक्त हुए अज्ञानीजन जिस प्रकार कर्म करते हैं, आसक्तिरहित विद्वान भी लोकसंग्रह करना चाहता हुआ उसी प्रकार कर्म करे। तत्त्वज्ञ महापुरुष कर्मोंमें आसक्तिवाले अज्ञानी मनुष्योंकी बुद्धिमें भ्रम उत्पन्न न करे, प्रत्युत स्वयं समस्त कर्मोंको अच्छी तरहसे करता हुआ उनसे भी वैसे ही करवाये।"},{"c":3,"v":26,"sp":"krishna","sa":"न बुद्धिभेदं जनयेदज्ञानां कर्मसङ्गिनाम् ।\nजोषयेत्सर्वकर्माणि विद्वान् युक्तः समाचरन् ॥","tr":"na buddhibhedaṃ janayedajñānāṃ karmasaṅginām\njoṣayetsarvakarmāṇi vidvān yuktaḥ samācaran","gs":"ન બુદ્ધિભેદં જનયેદજ્ઞાનાં કર્મસઙ્ગિનામ્ ।\nજોષયેત્સર્વકર્માણિ વિદ્વાન્ યુક્તઃ સમાચરન્ ॥","en":"Let no wise man unsettle the minds of ignorant people who are attached to action; he should engage them in all actions, himself fulfilling them with devotion.","hi":"।।3.25 -- 3.26।। हे भरतवंशोद्भव अर्जुन! कर्ममें आसक्त हुए अज्ञानीजन जिस प्रकार कर्म करते हैं आसक्तिरहित विद्वान भी लोकसंग्रह करना चाहता हुआ उसी प्रकार कर्म करे। सावधान तत्त्वज्ञ महापुरुष कर्मोंमें आसक्तिवाले अज्ञानी मनुष्योंकी बुद्धिमें भ्रम उत्पन्न न करे, प्रत्युत स्वयं समस्त कर्मोंको अच्छी तरहसे करता हुआ उनसे भी वैसे ही करवाये।"},{"c":3,"v":27,"sp":"krishna","sa":"प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः ।\nअहङ्कारविमूढात्मा कर्ताऽहमिति मन्यते ॥","tr":"prakṛteḥ kriyamāṇāni guṇaiḥ karmāṇi sarvaśaḥ\nahaṅkāravimūḍhātmā kartā'hamiti manyate","gs":"પ્રકૃતેઃ ક્રિયમાણાનિ ગુણૈઃ કર્માણિ સર્વશઃ ।\nઅહઙ્કારવિમૂઢાત્મા કર્તાઽહમિતિ મન્યતે ॥","en":"All actions are wrought in all cases by the qualities of Nature alone. He whose mind is deluded by egoism thinks, \"I am the doer.\"","hi":"सम्पूर्ण कर्म सब प्रकारसे प्रकृतिके गुणोंद्वारा किये जाते हैं; परन्तु अहंकारसे मोहित अन्तःकरणवाला अज्ञानी मनुष्य 'मैं कर्ता हूँ' -- ऐसा मानता है।"},{"c":3,"v":28,"sp":"krishna","sa":"तत्त्ववित्तु महाबाहो गुणकर्मविभागयोः ।\nगुणा गुणेषु वर्तन्त इति मत्वा न सज्जते ॥","tr":"tattvavittu mahābāho guṇakarmavibhāgayoḥ\nguṇā guṇeṣu vartanta iti matvā na sajjate","gs":"તત્ત્વવિત્તુ મહાબાહો ગુણકર્મવિભાગયોઃ ।\nગુણા ગુણેષુ વર્તન્ત ઇતિ મત્વા ન સજ્જતે ॥","en":"But he who knows the Truth, O mighty-armed Arjuna, about the divisions of the qualities and their functions, knowing that the Gunas, as senses, move amidst the Gunas, as the sense-objects, is not attached.","hi":"हे महाबाहो! गुण-विभाग और कर्म-विभागको तत्त्वसे जाननेवाला महापुरुष 'सम्पूर्ण गुण ही गुणोंमें बरत रहे हैं' -- ऐसा मानकर उनमें आसक्त नहीं होता।"},{"c":3,"v":29,"sp":"krishna","sa":"प्रकृतेर्गुणसम्मूढाः सज्जन्ते गुणकर्मसु ।\nतानकृत्स्नविदो मन्दान्कृत्स्नविन्न विचालयेत् ॥","tr":"prakṛterguṇasammūḍhāḥ sajjante guṇakarmasu\ntānakṛtsnavido mandānkṛtsnavinna vicālayet","gs":"પ્રકૃતેર્ગુણસમ્મૂઢાઃ સજ્જન્તે ગુણકર્મસુ ।\nતાનકૃત્સ્નવિદો મન્દાન્કૃત્સ્નવિન્ન વિચાલયેત્ ॥","en":"Those deluded by the qualities of Nature are attached to the functions of the qualities. The man of perfect knowledge should not unsettle the foolish one who is of imperfect knowledge.","hi":"प्रकृतिजन्य गुणोंसे अत्यन्त मोहित हुए अज्ञानी मनुष्य गुणों और कर्मोंमें आसक्त रहते हैं। उन पूर्णतया न समझनेवाले मन्दबुद्धि अज्ञानियोंको पूर्णतया जाननेवाला ज्ञानी मनुष्य विचलित न करे।"},{"c":3,"v":30,"sp":"krishna","sa":"मयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा ।\nनिराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः ॥","tr":"mayi sarvāṇi karmāṇi saṃnyasyādhyātmacetasā\nnirāśīrnirmamo bhūtvā yudhyasva vigatajvaraḥ","gs":"મયિ સર્વાણિ કર્માણિ સંન્યસ્યાધ્યાત્મચેતસા ।\nનિરાશીર્નિર્મમો ભૂત્વા યુધ્યસ્વ વિગતજ્વરઃ ॥","en":"Renouncing all actions in Me, with the mind centered on the Self, free from hope and egoism, and from mental fever, fight thou.","hi":"तू विवेकवती बुद्धिके द्वारा सम्पूर्ण कर्तव्य-कर्मोंको मेरे अर्पण करके कामना, ममता और संताप-रहित होकर युद्धरूप कर्तव्य-कर्मको कर।"},{"c":3,"v":31,"sp":"krishna","sa":"ये मे मतमिदं नित्यमनुतिष्ठन्ति मानवाः ।\nश्रद्धावन्तोऽनसूयन्तो मुच्यन्ते तेऽपि कर्मभिः ॥","tr":"ye me matamidaṃ nityamanutiṣṭhanti mānavāḥ\nśraddhāvanto'nasūyanto mucyante te'pi karmabhiḥ","gs":"યે મે મતમિદં નિત્યમનુતિષ્ઠન્તિ માનવાઃ ।\nશ્રદ્ધાવન્તોઽનસૂયન્તો મુચ્યન્તે તેઽપિ કર્મભિઃ ॥","en":"Those who constantly practice this teaching of Mine with faith and without caviling, they too are freed from actions.","hi":"जो मनुष्य दोष-दृष्टिसे रहित होकर श्रद्धापूर्वक मेरे इस (पूर्वश्लोकमें वर्णित) मतका सदा अनुसरण करते हैं, वे भी कर्मोंके बन्धनसे मुक्त हो जाते हैं।"},{"c":3,"v":32,"sp":"krishna","sa":"ये त्वेतदभ्यसूयन्तो नानुतिष्ठन्ति मे मतम् ।\nसर्वज्ञानविमूढांस्तान्विद्धि नष्टानचेतसः ॥","tr":"ye tvetadabhyasūyanto nānutiṣṭhanti me matam\nsarvajñānavimūḍhāṃstānviddhi naṣṭānacetasaḥ","gs":"યે ત્વેતદભ્યસૂયન્તો નાનુતિષ્ઠન્તિ મે મતમ્ ।\nસર્વજ્ઞાનવિમૂઢાંસ્તાન્વિદ્ધિ નષ્ટાનચેતસઃ ॥","en":"But those who criticize My teaching and do not practice it, deprived of all knowledge and lacking discernment, know them to be doomed to destruction.","hi":"परन्तु जो मनुष्य मेरे इस मतमें दोष-दृष्टि करते हुए इसका अनुष्ठान नहीं करते, उन सम्पूर्ण ज्ञानोंमें मोहित और अविवेकी मनुष्योंको नष्ट हुए ही समझो।"},{"c":3,"v":33,"sp":"krishna","sa":"सदृशं चेष्टते स्वस्याः प्रकृतेर्ज्ञानवानपि ।\nप्रकृतिं यान्ति भूतानि निग्रहः किं करिष्यति ॥","tr":"sadṛśaṃ ceṣṭate svasyāḥ prakṛterjñānavānapi\nprakṛtiṃ yānti bhūtāni nigrahaḥ kiṃ kariṣyati","gs":"સદૃશં ચેષ્ટતે સ્વસ્યાઃ પ્રકૃતેર્જ્ઞાનવાનપિ ।\nપ્રકૃતિં યાન્તિ ભૂતાનિ નિગ્રહઃ કિં કરિષ્યતિ ॥","en":"Even a wise man acts in accordance with his own nature; beings will follow their nature; what can restraint do?","hi":"सम्पूर्ण प्राणी प्रकृतिको प्राप्त होते हैं। ज्ञानी महापुरुष भी अपनी प्रकृतिके अनुसार चेष्टा करता है। फिर इसमें किसीका हठ क्या करेगा?"},{"c":3,"v":34,"sp":"krishna","sa":"इन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ ।\nतयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ ॥","tr":"indriyasyendriyasyārthe rāgadveṣau vyavasthitau\ntayorna vaśamāgacchettau hyasya paripanthinau","gs":"ઇન્દ્રિયસ્યેન્દ્રિયસ્યાર્થે રાગદ્વેષૌ વ્યવસ્થિતૌ ।\nતયોર્ન વશમાગચ્છેત્તૌ હ્યસ્ય પરિપન્થિનૌ ॥","en":"Attachment and aversion for the objects of the senses abide in the senses; let no one come under their sway; for, they are his enemies.","hi":"इन्द्रिय-इन्द्रियके अर्थमें (प्रत्येक इन्द्रियके प्रत्येक विषयमें) मनुष्यके राग और द्वेष व्यवस्थासे (अनुकूलता और प्रतिकूलताको लेकर) स्थित हैं। मनुष्यको उन दोनोंके वशमें नहीं होना चाहिये; क्योंकि वे दोनों ही इसके (पारमार्थिक मार्गमें विघ्न डालनेवाले) शत्रु हैं।"},{"c":3,"v":35,"sp":"krishna","sa":"श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् ।\nस्वधर्मे निधनं श्रेयः परधर्मो भयावहः ॥","tr":"śreyānsvadharmo viguṇaḥ paradharmātsvanuṣṭhitāt\nsvadharme nidhanaṃ śreyaḥ paradharmo bhayāvahaḥ","gs":"શ્રેયાન્સ્વધર્મો વિગુણઃ પરધર્માત્સ્વનુષ્ઠિતાત્ ।\nસ્વધર્મે નિધનં શ્રેયઃ પરધર્મો ભયાવહઃ ॥","en":"Better is one's own duty, though devoid of merit, than the duty of another well discharged. Better is death in one's own duty; the duty of another is fraught with fear.","hi":"अच्छी तरह आचरणमें लाये हुए दूसरेके धर्मसे गुणोंकी कमीवाला अपना धर्म श्रेष्ठ है। अपने धर्ममें तो मरना भी कल्याणकारक है और दूसरेका धर्म भयको देनेवाला है।"},{"c":3,"v":36,"sp":"arjuna","sa":"अथ केन प्रयुक्तोऽयं पापं चरति पूरुषः ।\nअनिच्छन्नपि वार्ष्णेय बलादिव नियोजितः ॥","tr":"atha kena prayukto'yaṃ pāpaṃ carati pūruṣaḥ\nanicchannapi vārṣṇeya balādiva niyojitaḥ","gs":"અથ કેન પ્રયુક્તોઽયં પાપં ચરતિ પૂરુષઃ ।\nઅનિચ્છન્નપિ વાર્ષ્ણેય બલાદિવ નિયોજિતઃ ॥","en":"Arjuna said, \"But what compels man to commit sin, even against his wishes, O Varshneya (Krishna), as if constrained by force?\"","hi":"अर्जुन बोले - हे वार्ष्णेय ! फिर यह मनुष्य न चाहता हुआ भी जबर्दस्ती लगाये हुएकी तरह किससे प्रेरित होकर पापका आचरण करता है?"},{"c":3,"v":37,"sp":"krishna","sa":"काम एष क्रोध एष रजोगुणसमुद्भवः ।\nमहाशनो महापाप्मा विद्ध्येनमिह वैरिणम् ॥","tr":"kāma eṣa krodha eṣa rajoguṇasamudbhavaḥ\nmahāśano mahāpāpmā viddhyenamiha vairiṇam","gs":"કામ એષ ક્રોધ એષ રજોગુણસમુદ્ભવઃ ।\nમહાશનો મહાપાપ્મા વિદ્ધ્યેનમિહ વૈરિણમ્ ॥","en":"The Blessed Lord said, \"It is desire and it is anger, both of the quality of Rajas, all-devouring and all-sinful; know this as the foe here in this world.\"","hi":"श्रीभगवान् बोले - रजोगुणसे उत्पन्न हुआ यह काम ही क्रोध है। यह बहुत खानेवाला और महापापी है। इस विषयमें तू इसको ही वैरी जान।"},{"c":3,"v":38,"sp":"krishna","sa":"धूमेनाव्रियते वह्निर्यथाऽऽदर्शो मलेन च ।\nयथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम् ॥","tr":"dhūmenāvriyate vahniryathā''darśo malena ca\nyatholbenāvṛto garbhastathā tenedamāvṛtam","gs":"ધૂમેનાવ્રિયતે વહ્નિર્યથાઽઽદર્શો મલેન ચ ।\nયથોલ્બેનાવૃતો ગર્ભસ્તથા તેનેદમાવૃતમ્ ॥","en":"As fire is enveloped by smoke, as a mirror is covered by dust, and as an embryo is surrounded by the amniotic sac, so is this enveloped by that.","hi":"जैसे धुएँसे अग्नि और मैलसे दर्पण ढक जाता है तथा जैसे जेरसे गर्भ ढका रहता है, ऐसे ही उस कामके द्वारा यह ज्ञान ( विवेक) ढका हुआ है।"},{"c":3,"v":39,"sp":"krishna","sa":"आवृतं ज्ञानमेतेन ज्ञानिनो नित्यवैरिणा ।\nकामरूपेण कौन्तेय दुष्पूरेणानलेन च ॥","tr":"āvṛtaṃ jñānametena jñānino nityavairiṇā\nkāmarūpeṇa kaunteya duṣpūreṇānalena ca","gs":"આવૃતં જ્ઞાનમેતેન જ્ઞાનિનો નિત્યવૈરિણા ।\nકામરૂપેણ કૌન્તેય દુષ્પૂરેણાનલેન ચ ॥","en":"O Arjuna, wisdom is enveloped by this constant enemy of the wise, in the form of desire, which is insatiable like fire.","hi":"और हे कुन्तीनन्दन ! इस अग्निके समान कभी तृप्त न होनेवाले और विवेकियोंके नित्य वैरी इस कामके द्वारा मनुष्यका विवेक ढका हुआ है।"},{"c":3,"v":40,"sp":"krishna","sa":"इन्द्रियाणि मनो बुद्धिरस्याधिष्ठानमुच्यते ।\nएतैर्विमोहयत्येष ज्ञानमावृत्य देहिनम् ॥","tr":"indriyāṇi mano buddhirasyādhiṣṭhānamucyate\netairvimohayatyeṣa jñānamāvṛtya dehinam","gs":"ઇન્દ્રિયાણિ મનો બુદ્ધિરસ્યાધિષ્ઠાનમુચ્યતે ।\nએતૈર્વિમોહયત્યેષ જ્ઞાનમાવૃત્ય દેહિનમ્ ॥","en":"The senses, the mind, and the intellect are said to be its seat; through these, it deludes the embodied one, veiling their wisdom.","hi":"इन्द्रियाँ, मन और बुद्धि इस कामके वास-स्थान कहे गये हैं। यह काम इन- (इन्द्रियाँ, मन और बुद्धि-) के द्वारा ज्ञानको ढककर देहाभिमानी मनुष्यको मोहित करता है।"},{"c":3,"v":41,"sp":"krishna","sa":"तस्मात्त्वमिन्द्रियाण्यादौ नियम्य भरतर्षभ ।\nपाप्मानं प्रजहि ह्येनं ज्ञानविज्ञाननाशनम् ॥","tr":"tasmāttvamindriyāṇyādau niyamya bharatarṣabha\npāpmānaṃ prajahi hyenaṃ jñānavijñānanāśanam","gs":"તસ્માત્ત્વમિન્દ્રિયાણ્યાદૌ નિયમ્ય ભરતર્ષભ ।\nપાપ્માનં પ્રજહિ હ્યેનં જ્ઞાનવિજ્ઞાનનાશનમ્ ॥","en":"Therefore, O best of the Bharatas, control your senses first and then kill this sinful thing, which destroys knowledge and realization.","hi":"इसलिये हे भरतवंशियोंमें श्रेष्ठ अर्जुन ! तू सबसे पहले इन्द्रियोंको वशमें करके इस ज्ञान और विज्ञानका नाश करनेवाले महान् पापी कामको अवश्य ही बलपूर्वक मार डाल।"},{"c":3,"v":42,"sp":"krishna","sa":"इन्द्रियाणि पराण्याहुरिन्द्रियेभ्यः परं मनः ।\nमनसस्तु परा बुद्धिर्यो बुद्धेः परतस्तु सः ॥","tr":"indriyāṇi parāṇyāhurindriyebhyaḥ paraṃ manaḥ\nmanasastu parā buddhiryo buddheḥ paratastu saḥ","gs":"ઇન્દ્રિયાણિ પરાણ્યાહુરિન્દ્રિયેભ્યઃ પરં મનઃ ।\nમનસસ્તુ પરા બુદ્ધિર્યો બુદ્ધેઃ પરતસ્તુ સઃ ॥","en":"They say that the senses are superior to the body; the mind is superior to the senses; the intellect is superior to the mind; and He (the Self) is superior even to the intellect.","hi":"।।3.42 -- 3.43।। इन्द्रियोंको (स्थूलशरीरसे) पर (श्रेष्ठ, सबल, प्रकाशक, व्यापक तथा सूक्ष्म) कहते हैं। इन्द्रियोंसे पर मन है, मनसे भी पर बुद्धि है औऱ जो बुद्धिसे भी पर है, वह (काम) है। इस तरह बुद्धिसे पर - (काम-) को जानकर अपने द्वारा अपने-आपको वशमें करके हे महाबाहो ! तू इस कामरूप दुर्जय शत्रुको मार डाल।"},{"c":3,"v":43,"sp":"krishna","sa":"एवं बुद्धेः परं बुद्ध्वा संस्तभ्यात्मानमात्मना ।\nजहि शत्रुं महाबाहो कामरूपं दुरासदम् ॥","tr":"evaṃ buddheḥ paraṃ buddhvā saṃstabhyātmānamātmanā\njahi śatruṃ mahābāho kāmarūpaṃ durāsadam","gs":"એવં બુદ્ધેઃ પરં બુદ્ધ્વા સંસ્તભ્યાત્માનમાત્મના ।\nજહિ શત્રું મહાબાહો કામરૂપં દુરાસદમ્ ॥","en":"Thus, knowing Him who is superior to the intellect and restraining the self by the Self, slay thou, O mighty-armed Arjuna, the enemy in the form of desire, hard to conquer.","hi":"।।3.42 -- 3.43।। इन्द्रियोंको (स्थूलशरीरसे) पर (श्रेष्ठ, सबल, प्रकाशक, व्यापक तथा सूक्ष्म) कहते हैं। इन्द्रियोंसे पर मन है, मनसे भी पर बुद्धि है औऱ जो बुद्धिसे भी पर है वह (काम) है। इस तरह बुद्धिसे पर - (काम-) को जानकर अपने द्वारा अपने-आपको वशमें करके हे महाबाहो ! तू इस कामरूप दुर्जय शत्रुको मार डाल।"},{"c":4,"v":1,"sp":"krishna","sa":"इमं विवस्वते योगं प्रोक्तवानहमव्ययम् ।\nविवस्वान् मनवे प्राह मनुरिक्ष्वाकवेऽब्रवीत् ॥","tr":"imaṃ vivasvate yogaṃ proktavānahamavyayam\nvivasvān manave prāha manurikṣvākave'bravīt","gs":"ઇમં વિવસ્વતે યોગં પ્રોક્તવાનહમવ્યયમ્ ।\nવિવસ્વાન્ મનવે પ્રાહ મનુરિક્ષ્વાકવેઽબ્રવીત્ ॥","en":"The Blessed Lord said, \"I taught this imperishable Yoga to Vivasvan; he then told it to Manu; Manu proclaimed it to Ikshvaku.","hi":"श्रीभगवान् बोले - मैंने इस अविनाशी योगको सूर्यसे कहा था। फिर सूर्यने (अपने पुत्र) वैवस्वत मनुसे कहा और मनुने (अपने पुत्र) राजा इक्ष्वाकुसे कहा।"},{"c":4,"v":2,"sp":"krishna","sa":"एवं परम्पराप्राप्तमिमं राजर्षयो विदुः ।\nस कालेनेह महता योगो नष्टः परन्तप ॥","tr":"evaṃ paramparāprāptamimaṃ rājarṣayo viduḥ\nsa kāleneha mahatā yogo naṣṭaḥ parantapa","gs":"એવં પરમ્પરાપ્રાપ્તમિમં રાજર્ષયો વિદુઃ ।\nસ કાલેનેહ મહતા યોગો નષ્ટઃ પરન્તપ ॥","en":"This, handed down in regular succession by the royal sages, was known. This Yoga, however, has been lost here over time, O Parantapa (burner of the foes).","hi":"हे परंतप ! इस तरह परम्परासे प्राप्त इस कर्मयोग को राजर्षियोंने जाना। परन्तु बहुत समय बीत जानेके कारण वह योग इस मनुष्यलोकमें लुप्तप्राय हो गया।"},{"c":4,"v":3,"sp":"krishna","sa":"स एवायं मया तेऽद्य योगः प्रोक्तः पुरातनः ।\nभक्तोऽसि मे सखा चेति रहस्यं ह्येतदुत्तमम् ॥","tr":"sa evāyaṃ mayā te'dya yogaḥ proktaḥ purātanaḥ\nbhakto'si me sakhā ceti rahasyaṃ hyetaduttamam","gs":"સ એવાયં મયા તેઽદ્ય યોગઃ પ્રોક્તઃ પુરાતનઃ ।\nભક્તોઽસિ મે સખા ચેતિ રહસ્યં હ્યેતદુત્તમમ્ ॥","en":"That same ancient yoga has been today taught to you by me, for you are my devotee and my friend; it is the supreme secret.","hi":"तू मेरा भक्त और प्रिय सखा है, इसलिये वही यह पुरातन योग आज मैंने तुझसे कहा है; क्योंकि यह बड़ा उत्तम रहस्य है।"},{"c":4,"v":4,"sp":"arjuna","sa":"अपरं भवतो जन्म परं जन्म विवस्वतः ।\nकथमेतद्विजानीयां त्वमादौ प्रोक्तवानिति ॥","tr":"aparaṃ bhavato janma paraṃ janma vivasvataḥ\nkathametadvijānīyāṃ tvamādau proktavāniti","gs":"અપરં ભવતો જન્મ પરં જન્મ વિવસ્વતઃ ।\nકથમેતદ્વિજાનીયાં ત્વમાદૌ પ્રોક્તવાનિતિ ॥","en":"Arjuna said, \"Later was Thy birth, and prior to it was the birth of Vivasvan (the Sun); how am I to understand that Thou hast taught this Yoga from the beginning?\"","hi":"अर्जुन बोले - आपका जन्म तो अभीका है और सूर्यका जन्म बहुत पुराना है; अतः आपने ही सृष्टिके आदिमें सूर्यसे यह योग कहा था - यह बात मैं कैसे समझूँ?"},{"c":4,"v":5,"sp":"krishna","sa":"बहूनि मे व्यतीतानि जन्मानि तव चार्जुन ।\nतान्यहं वेद सर्वाणि न त्वं वेत्थ परन्तप ॥","tr":"bahūni me vyatītāni janmāni tava cārjuna\ntānyahaṃ veda sarvāṇi na tvaṃ vettha parantapa","gs":"બહૂનિ મે વ્યતીતાનિ જન્માનિ તવ ચાર્જુન ।\nતાન્યહં વેદ સર્વાણિ ન ત્વં વેત્થ પરન્તપ ॥","en":"The Blessed Lord said, \"Many births of Mine have passed, as well as of thine, O Arjuna; I know them all, but thou knowest not, O Parantapa (scorcher of foes).\"","hi":"श्रीभगवान् बोले -- हे परन्तप अर्जुन ! मेरे और तेरे बहुत-से जन्म हो चुके हैं। उन सबको मैं जानता हूँ, पर तू नहीं जानता।"},{"c":4,"v":6,"sp":"krishna","sa":"अजोऽपि सन्नव्ययात्मा भूतानामीश्वरोऽपि सन् ।\nप्रकृतिं स्वामधिष्ठाय संभवाम्यात्ममायया ॥","tr":"ajo'pi sannavyayātmā bhūtānāmīśvaro'pi san\nprakṛtiṃ svāmadhiṣṭhāya saṃbhavāmyātmamāyayā","gs":"અજોઽપિ સન્નવ્યયાત્મા ભૂતાનામીશ્વરોઽપિ સન્ ।\nપ્રકૃતિં સ્વામધિષ્ઠાય સંભવામ્યાત્મમાયયા ॥","en":"Though I am unborn and of imperishable nature, and though I am the Lord of all beings, yet, governing my own nature, I am born by my own Maya.","hi":"मैं अजन्मा और अविनाशी-स्वरूप होते हुए भी तथा सम्पूर्ण प्राणियोंका ईश्वर होते हुए भी अपनी प्रकृतिको अधीन करके अपनी योगमायासे प्रकट होता हूँ।"},{"c":4,"v":7,"sp":"krishna","sa":"यदा यदा हि धर्मस्य ग्लानिर्भवति भारत ।\nअभ्युत्थानमधर्मस्य तदाऽऽत्मानं सृजाम्यहम् ॥","tr":"yadā yadā hi dharmasya glānirbhavati bhārata\nabhyutthānamadharmasya tadā''tmānaṃ sṛjāmyaham","gs":"યદા યદા હિ ધર્મસ્ય ગ્લાનિર્ભવતિ ભારત ।\nઅભ્યુત્થાનમધર્મસ્ય તદાઽઽત્માનં સૃજામ્યહમ્ ॥","en":"Whenever there is a decline of righteousness and an increase of unrighteousness, O Arjuna, then I manifest Myself.","hi":"हे भरतवंशी अर्जुन! जब-जब धर्मकी हानि और अधर्मकी वृद्धि होती है, तब-तब ही मैं अपने-आपको साकाररूपसे प्रकट करता हूँ।"},{"c":4,"v":8,"sp":"krishna","sa":"परित्राणाय साधूनां विनाशाय च दुष्कृताम् ।\nधर्मसंस्थापनार्थाय संभवामि युगे युगे ॥","tr":"paritrāṇāya sādhūnāṃ vināśāya ca duṣkṛtām\ndharmasaṃsthāpanārthāya saṃbhavāmi yuge yuge","gs":"પરિત્રાણાય સાધૂનાં વિનાશાય ચ દુષ્કૃતામ્ ।\nધર્મસંસ્થાપનાર્થાય સંભવામિ યુગે યુગે ॥","en":"For the protection of the good, for the destruction of the wicked, and for the establishment of righteousness, I am born in every age.","hi":"साधुओं-(भक्तों-) की रक्षा करनेके लिये, पापकर्म करनेवालोंका विनाश करनेके लिये और धर्मकी भलीभाँति स्थापना करनेके लिये मैं युग-युगमें प्रकट हुआ करता हूँ।"},{"c":4,"v":9,"sp":"krishna","sa":"जन्म कर्म च मे दिव्यमेवं यो वेत्ति तत्त्वतः ।\nत्यक्त्वा देहं पुनर्जन्म नैति मामेति सोऽर्जुन ॥","tr":"janma karma ca me divyamevaṃ yo vetti tattvataḥ\ntyaktvā dehaṃ punarjanma naiti māmeti so'rjuna","gs":"જન્મ કર્મ ચ મે દિવ્યમેવં યો વેત્તિ તત્ત્વતઃ ।\nત્યક્ત્વા દેહં પુનર્જન્મ નૈતિ મામેતિ સોઽર્જુન ॥","en":"He who thus knows, in their true light, My divine birth and actions, having abandoned the body, is not born again; he comes to Me, O Arjuna.","hi":"हे अर्जुन ! मेरे जन्म और कर्म दिव्य हैं। इस प्रकार (मेरे जन्म और कर्मको) जो मनुष्य तत्त्वसे जान लेता अर्थात् दृढ़तापूर्वक मान लेता है, वह शरीरका त्याग करके पुनर्जन्मको प्राप्त नहीं होता, प्रत्युत मुझे प्राप्त होता है।"},{"c":4,"v":10,"sp":"krishna","sa":"वीतरागभयक्रोधा मन्मया मामुपाश्रिताः ।\nबहवो ज्ञानतपसा पूता मद्भावमागताः ॥","tr":"vītarāgabhayakrodhā manmayā māmupāśritāḥ\nbahavo jñānatapasā pūtā madbhāvamāgatāḥ","gs":"વીતરાગભયક્રોધા મન્મયા મામુપાશ્રિતાઃ ।\nબહવો જ્ઞાનતપસા પૂતા મદ્ભાવમાગતાઃ ॥","en":"Freed from attachment, fear, and anger, absorbed in Me, taking refuge in Me, purified by the fire of knowledge, many have attained My Being.","hi":"राग, भय और क्रोधसे सर्वथा रहित, मेरेमें ही तल्लीन, मेरे ही आश्रित तथा ज्ञानरूप तपसे पवित्र हुए बहुत-से भक्त मेरे भाव- (स्वरूप-) को प्राप्त हो चुके हैं।"},{"c":4,"v":11,"sp":"krishna","sa":"ये यथा मां प्रपद्यन्ते तांस्तथैव भजाम्यहम् ।\nमम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः ॥","tr":"ye yathā māṃ prapadyante tāṃstathaiva bhajāmyaham\nmama vartmānuvartante manuṣyāḥ pārtha sarvaśaḥ","gs":"યે યથા માં પ્રપદ્યન્તે તાંસ્તથૈવ ભજામ્યહમ્ ।\nમમ વર્ત્માનુવર્તન્તે મનુષ્યાઃ પાર્થ સર્વશઃ ॥","en":"In whatever way men approach Me, even so do I reward them; My path do men tread in all ways, O Arjuna.","hi":"हे पृथानन्दन ! जो भक्त जिस प्रकार मेरी शरण लेते हैं, मैं उन्हें उसी प्रकार आश्रय देता हूँ; क्योंकि सभी मनुष्य सब प्रकारसे मेरे मार्गका अनुकरण करते हैं।"},{"c":4,"v":12,"sp":"krishna","sa":"काङ्क्षन्तः कर्मणां सिद्धिं यजन्त इह देवताः ।\nक्षिप्रं हि मानुषे लोके सिद्धिर्भवति कर्मजा ॥","tr":"kāṅkṣantaḥ karmaṇāṃ siddhiṃ yajanta iha devatāḥ\nkṣipraṃ hi mānuṣe loke siddhirbhavati karmajā","gs":"કાઙ્ક્ષન્તઃ કર્મણાં સિદ્ધિં યજન્ત ઇહ દેવતાઃ ।\nક્ષિપ્રં હિ માનુષે લોકે સિદ્ધિર્ભવતિ કર્મજા ॥","en":"Those who long for success in action in this world sacrifice to the gods; for success is quickly attained by men through action.","hi":"कर्मोंकी सिद्धि (फल) चाहनेवाले मनुष्य देवताओंकी उपासना किया करते हैं; क्योंकि इस मनुष्यलोकमें कर्मोंसे उत्पन्न होनेवाली सिद्धि जल्दी मिल जाती है।"},{"c":4,"v":13,"sp":"krishna","sa":"चातुर्वर्ण्यं मया सृष्टं गुणकर्मविभागशः ।\nतस्य कर्तारमपि मां विद्ध्यकर्तारमव्ययम् ॥","tr":"cāturvarṇyaṃ mayā sṛṣṭaṃ guṇakarmavibhāgaśaḥ\ntasya kartāramapi māṃ viddhyakartāramavyayam","gs":"ચાતુર્વર્ણ્યં મયા સૃષ્ટં ગુણકર્મવિભાગશઃ ।\nતસ્ય કર્તારમપિ માં વિદ્ધ્યકર્તારમવ્યયમ્ ॥","en":"The fourfold caste has been created by Me according to the differentiation of Guna and Karma; though I am the author of it, know Me as non-doer and immutable.","hi":"।।4.13 -- 4.14।। मेरे द्वारा गुणों और कर्मोंके विभागपूर्वक चारों वर्णोंकी रचना की गयी है। उस-(सृष्टि-रचना आदि-) का कर्ता होनेपर भी मुझ अव्यय रमेश्वरको तू अकर्ता जान। कारण कि कर्मोंके फलमें मेरी स्पृहा नहीं है, इसलिये मुझे कर्म लिप्त नहीं करते। इस प्रकार जो मुझे तत्त्वसे जान लेता है, वह भी कर्मोंसे नहीं बँधता।"},{"c":4,"v":14,"sp":"krishna","sa":"न मां कर्माणि लिम्पन्ति न मे कर्मफले स्पृहा ।\nइति मां योऽभिजानाति कर्मभिर्न स बध्यते ॥","tr":"na māṃ karmāṇi limpanti na me karmaphale spṛhā\niti māṃ yo'bhijānāti karmabhirna sa badhyate","gs":"ન માં કર્માણિ લિમ્પન્તિ ન મે કર્મફલે સ્પૃહા ।\nઇતિ માં યોઽભિજાનાતિ કર્મભિર્ન સ બધ્યતે ॥","en":"Actions do not taint Me, nor do I have a desire for the fruit of actions. He who knows Me thus is not bound by actions.","hi":"।।4.13 -- 4.14।। मेरे द्वारा गुणों और कर्मोंके विभागपूर्वक चारों वर्णोंकी रचना की गयी है। उस-(सृष्टि-रचना आदि-) का कर्ता होनेपर भी मुझ अव्यय परमेश्वरको तू अकर्ता जान। कारण कि कर्मोंके फलमें मेरी स्पृहा नहीं है, इसलिये मुझे कर्म लिप्त नहीं करते। इस प्रकार जो मुझे तत्त्वसे जान लेता है, वह भी कर्मोंसे नहीं बँधता।"},{"c":4,"v":15,"sp":"krishna","sa":"एवं ज्ञात्वा कृतं कर्म पूर्वैरपि मुमुक्षुभिः ।\nकुरु कर्मैव तस्मात्त्वं पूर्वैः पूर्वतरं कृतम् ॥","tr":"evaṃ jñātvā kṛtaṃ karma pūrvairapi mumukṣubhiḥ\nkuru karmaiva tasmāttvaṃ pūrvaiḥ pūrvataraṃ kṛtam","gs":"એવં જ્ઞાત્વા કૃતં કર્મ પૂર્વૈરપિ મુમુક્ષુભિઃ ।\nકુરુ કર્મૈવ તસ્માત્ત્વં પૂર્વૈઃ પૂર્વતરં કૃતમ્ ॥","en":"Having known this, the ancient seekers of freedom also performed action; therefore, do thou also perform action, as the ancients did in days of yore.","hi":"पूर्वकालके मुमुक्षुओंने भी इस प्रकार जानकर कर्म किये हैं, इसलिये तू भी पूर्वजोंके द्वारा सदासे किये जानेवाले कर्मोंको ही (उन्हींकी तरह) कर।"},{"c":4,"v":16,"sp":"krishna","sa":"किं कर्म किमकर्मेति कवयोऽप्यत्र मोहिताः ।\nतत्ते कर्म प्रवक्ष्यामि यज्ज्ञात्वा मोक्ष्यसेऽशुभात् ॥","tr":"kiṃ karma kimakarmeti kavayo'pyatra mohitāḥ\ntatte karma pravakṣyāmi yajjñātvā mokṣyase'śubhāt","gs":"કિં કર્મ કિમકર્મેતિ કવયોઽપ્યત્ર મોહિતાઃ ।\nતત્તે કર્મ પ્રવક્ષ્યામિ યજ્જ્ઞાત્વા મોક્ષ્યસેઽશુભાત્ ॥","en":"What is action? What is inaction? Even the wise are confused about this. Therefore, I shall teach you the nature of action and inaction, by knowing which you will be liberated from the evil of Samsara, the wheel of birth and death.","hi":"कर्म क्या है और अकर्म क्या है -- इस प्रकार इस विषयमें विद्वान् भी मोहित हो जाते हैं। अतः वह कर्म-तत्त्व मैं तुम्हें भलीभाँति कहूँगा, जिसको जानकर तू अशुभ- (संसार-बन्धन-) से मुक्त हो जायगा।"},{"c":4,"v":17,"sp":"krishna","sa":"कर्मणो ह्यपि बोद्धव्यं बोद्धव्यं च विकर्मणः ।\nअकर्मणश्च बोद्धव्यं गहना कर्मणो गतिः ॥","tr":"karmaṇo hyapi boddhavyaṃ boddhavyaṃ ca vikarmaṇaḥ\nakarmaṇaśca boddhavyaṃ gahanā karmaṇo gatiḥ","gs":"કર્મણો હ્યપિ બોદ્ધવ્યં બોદ્ધવ્યં ચ વિકર્મણઃ ।\nઅકર્મણશ્ચ બોદ્ધવ્યં ગહના કર્મણો ગતિઃ ॥","en":"For verily, the true nature of action enjoined by the scriptures should be known, as well as that of forbidden or unlawful action, and of inaction; the nature of action is hard to understand.","hi":"कर्मका तत्त्व भी जानना चाहिये और अकर्मका तत्त्व भी जानना चाहिये तथा विकर्मका तत्त्व भी जानना चाहिये; क्योंकि कर्मकी गति गहन है।"},{"c":4,"v":18,"sp":"krishna","sa":"कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः ।\nस बुद्धिमान् मनुष्येषु स युक्तः कृत्स्नकर्मकृत् ॥","tr":"karmaṇyakarma yaḥ paśyedakarmaṇi ca karma yaḥ\nsa buddhimān manuṣyeṣu sa yuktaḥ kṛtsnakarmakṛt","gs":"કર્મણ્યકર્મ યઃ પશ્યેદકર્મણિ ચ કર્મ યઃ ।\nસ બુદ્ધિમાન્ મનુષ્યેષુ સ યુક્તઃ કૃત્સ્નકર્મકૃત્ ॥","en":"He who sees inaction in action and action in inaction, he is wise among men; he is a yogi and performer of all actions.","hi":"जो मनुष्य कर्ममें अकर्म देखता है और जो अकर्ममें कर्म देखता है, वह मनुष्योंमें बुद्धिमान् है, योगी है और सम्पूर्ण कर्मोंको करनेवाला है।"},{"c":4,"v":19,"sp":"krishna","sa":"यस्य सर्वे समारम्भाः कामसङ्कल्पवर्जिताः ।\nज्ञानाग्निदग्धकर्माणं तमाहुः पण्डितं बुधाः ॥","tr":"yasya sarve samārambhāḥ kāmasaṅkalpavarjitāḥ\njñānāgnidagdhakarmāṇaṃ tamāhuḥ paṇḍitaṃ budhāḥ","gs":"યસ્ય સર્વે સમારમ્ભાઃ કામસઙ્કલ્પવર્જિતાઃ ।\nજ્ઞાનાગ્નિદગ્ધકર્માણં તમાહુઃ પણ્ડિતં બુધાઃ ॥","en":"He whose undertakings are all devoid of desires and selfish purposes, and whose actions have been burned by the fire of knowledge, the wise call him a sage.","hi":"जिसके सम्पूर्ण कर्मोंके आरम्भ संकल्प और कामनासे रहित हैं तथा जिसके सम्पूर्ण कर्म ज्ञानरूपी अग्निसे जल गये हैं, उसको ज्ञानिजन भी पण्डित (बुद्धिमान्) कहते हैं।"},{"c":4,"v":20,"sp":"krishna","sa":"त्यक्त्वा कर्मफलासङ्गं नित्यतृप्तो निराश्रयः ।\nकर्मण्यभिप्रवृत्तोऽपि नैव किञ्चित्करोति सः ॥","tr":"tyaktvā karmaphalāsaṅgaṃ nityatṛpto nirāśrayaḥ\nkarmaṇyabhipravṛtto'pi naiva kiñcitkaroti saḥ","gs":"ત્યક્ત્વા કર્મફલાસઙ્ગં નિત્યતૃપ્તો નિરાશ્રયઃ ।\nકર્મણ્યભિપ્રવૃત્તોઽપિ નૈવ કિઞ્ચિત્કરોતિ સઃ ॥","en":"Having abandoned attachment to the fruits of the action, ever content, depending on nothing, he does not do anything even while being engaged in activity.","hi":"जो कर्म और फलकी आसक्तिका त्याग करके आश्रयसे रहित और सदा तृप्त है, वह कर्मोंमें अच्छी तरह लगा हुआ भी वास्तवमें कुछ भी नहीं करता।"},{"c":4,"v":21,"sp":"krishna","sa":"निराशीर्यतचित्तात्मा त्यक्तसर्वपरिग्रहः ।\nशारीरं केवलं कर्म कुर्वन्नाप्नोति किल्बिषम् ॥","tr":"nirāśīryatacittātmā tyaktasarvaparigrahaḥ\nśārīraṃ kevalaṃ karma kurvannāpnoti kilbiṣam","gs":"નિરાશીર્યતચિત્તાત્મા ત્યક્તસર્વપરિગ્રહઃ ।\nશારીરં કેવલં કર્મ કુર્વન્નાપ્નોતિ કિલ્બિષમ્ ॥","en":"Without hope, controlling the mind and the self, having abandoned all covetousness, and performing only bodily actions, one incurs no sin.","hi":"जिसका शरीर और अन्तःकरण अच्छी तरहसे वशमें किया हुआ है, जिसने सब प्रकारके संग्रहका परित्याग कर दिया है, ऐसा आशारहित कर्मयोगी केवल शरीर-सम्बन्धी कर्म करता हुआ भी पापको प्राप्त नहीं होता।"},{"c":4,"v":22,"sp":"krishna","sa":"यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः ।\nसमः सिद्धावसिद्धौ च कृत्वापि न निबध्यते ॥","tr":"yadṛcchālābhasantuṣṭo dvandvātīto vimatsaraḥ\nsamaḥ siddhāvasiddhau ca kṛtvāpi na nibadhyate","gs":"યદૃચ્છાલાભસન્તુષ્ટો દ્વન્દ્વાતીતો વિમત્સરઃ ।\nસમઃ સિદ્ધાવસિદ્ધૌ ચ કૃત્વાપિ ન નિબધ્યતે ॥","en":"Content with what comes to him without effort, free from the pairs of opposites and envy, even-minded in success and failure, he acts yet is not bound.","hi":"जो (कर्मयोगी) फल की इच्छा के बिना, अपने-आप जो कुछ मिल जाय, उसमें सन्तुष्ट रहता है और जो ईर्ष्यासे रहित, द्वन्द्वोंसे अतीत तथा सिद्धि और असिद्धिमें सम है, वह कर्म करते हुए भी उससे नहीं बँधता।"},{"c":4,"v":23,"sp":"krishna","sa":"गतसङ्गस्य मुक्तस्य ज्ञानावस्थितचेतसः ।\nयज्ञायाचरतः कर्म समग्रं प्रविलीयते ॥","tr":"gatasaṅgasya muktasya jñānāvasthitacetasaḥ\nyajñāyācarataḥ karma samagraṃ pravilīyate","gs":"ગતસઙ્ગસ્ય મુક્તસ્ય જ્ઞાનાવસ્થિતચેતસઃ ।\nયજ્ઞાયાચરતઃ કર્મ સમગ્રં પ્રવિલીયતે ॥","en":"To one who is devoid of attachment, who is liberated, whose mind is established in knowledge, and who works for the sake of sacrifice (for the sake of God), the whole action is dissolved.","hi":"जिसकी आसक्ति सर्वथा मिट गयी है, जो मुक्त हो गया है, जिसकी बुद्धि स्वरूपके ज्ञानमें स्थित है, ऐसे केवल यज्ञके लिये कर्म करनेवाले मनुष्यके सम्पूर्ण कर्म विलीन हो जाते हैं।"},{"c":4,"v":24,"sp":"krishna","sa":"ब्रह्मार्पणं ब्रह्महविर्ब्रह्माग्नौ ब्रह्मणा हुतम् ।\nब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना ॥","tr":"brahmārpaṇaṃ brahmahavirbrahmāgnau brahmaṇā hutam\nbrahmaiva tena gantavyaṃ brahmakarmasamādhinā","gs":"બ્રહ્માર્પણં બ્રહ્મહવિર્બ્રહ્માગ્નૌ બ્રહ્મણા હુતમ્ ।\nબ્રહ્મૈવ તેન ગન્તવ્યં બ્રહ્મકર્મસમાધિના ॥","en":"Brahman is the oblation; Brahman is the melted butter (ghee); by Brahman is the oblation poured into the fire of Brahman; Brahman indeed shall be attained by one who always sees Brahman in action.","hi":"जिस यज्ञमें अर्पण भी ब्रह्म है, हवी भी ब्रह्म है और ब्रह्मरूप कर्ताके द्वारा ब्रह्मरूप अग्निमें आहुति देनारूप क्रिया भी ब्रह्म है, (ऐसे यज्ञको करनेवाले) जिस मनुष्यकी ब्रह्ममें ही कर्म-समाधि हो गयी है, उसके द्वारा प्राप्त करनेयोग्य फल भी ब्रह्म ही है।"},{"c":4,"v":25,"sp":"krishna","sa":"दैवमेवापरे यज्ञं योगिनः पर्युपासते ।\nब्रह्माग्नावपरे यज्ञं यज्ञेनैवोपजुह्वति ॥","tr":"daivamevāpare yajñaṃ yoginaḥ paryupāsate\nbrahmāgnāvapare yajñaṃ yajñenaivopajuhvati","gs":"દૈવમેવાપરે યજ્ઞં યોગિનઃ પર્યુપાસતે ।\nબ્રહ્માગ્નાવપરે યજ્ઞં યજ્ઞેનૈવોપજુહ્વતિ ॥","en":"Some yogis perform sacrifice to the gods alone; while others, who have realized the Self, offer the Self as sacrifice in the fire of Brahman alone.","hi":"अन्य योगीलोग भगवदर्पणरूप यज्ञका ही अनुष्ठान करते हैं और दूसरे योगीलोग ब्रह्मरूप अग्निमें विचाररूप यज्ञके द्वारा ही जीवात्मारूप यज्ञका हवन करते हैं।"},{"c":4,"v":26,"sp":"krishna","sa":"श्रोत्रादीनीन्द्रियाण्यन्ये संयमाग्निषु जुह्वति ।\nशब्दादीन्विषयानन्य इन्द्रियाग्निषु जुह्वति ॥","tr":"śrotrādīnīndriyāṇyanye saṃyamāgniṣu juhvati\nśabdādīnviṣayānanya indriyāgniṣu juhvati","gs":"શ્રોત્રાદીનીન્દ્રિયાણ્યન્યે સંયમાગ્નિષુ જુહ્વતિ ।\nશબ્દાદીન્વિષયાનન્ય ઇન્દ્રિયાગ્નિષુ જુહ્વતિ ॥","en":"Some again offer the organ of hearing and other senses as a sacrifice in the fire of restraint; others offer sound and other objects of the senses as a sacrifice in the fire of the senses.","hi":"अन्य योगीलोग श्रोत्रादि समस्त इन्द्रियोंका संयमरूप अग्नियोंमें हवन किया करते हैं और दूसरे योगीलोग शब्दादि विषयोंका इन्द्रियरूप अग्नियोंमें हवन किया करते हैं।"},{"c":4,"v":27,"sp":"krishna","sa":"सर्वाणीन्द्रियकर्माणि प्राणकर्माणि चापरे ।\nआत्मसंयमयोगाग्नौ जुह्वति ज्ञानदीपिते ॥","tr":"sarvāṇīndriyakarmāṇi prāṇakarmāṇi cāpare\nātmasaṃyamayogāgnau juhvati jñānadīpite","gs":"સર્વાણીન્દ્રિયકર્માણિ પ્રાણકર્માણિ ચાપરે ।\nઆત્મસંયમયોગાગ્નૌ જુહ્વતિ જ્ઞાનદીપિતે ॥","en":"Others again sacrifice all the functions of the senses and those of the breath (vital energy, or Prana) in the fire of the Yoga of self-restraint, kindled by knowledge.","hi":"अन्य योगीलोग सम्पूर्ण इन्द्रियोंकी क्रियाओंको और प्राणोंकी क्रियाओंको ज्ञानसे प्रकाशित आत्मसंयमयोगरूप अग्निमें हवन किया करते हैं।"},{"c":4,"v":28,"sp":"krishna","sa":"द्रव्ययज्ञास्तपोयज्ञा योगयज्ञास्तथापरे ।\nस्वाध्यायज्ञानयज्ञाश्च यतयः संशितव्रताः ॥","tr":"dravyayajñāstapoyajñā yogayajñāstathāpare\nsvādhyāyajñānayajñāśca yatayaḥ saṃśitavratāḥ","gs":"દ્રવ્યયજ્ઞાસ્તપોયજ્ઞા યોગયજ્ઞાસ્તથાપરે ।\nસ્વાધ્યાયજ્ઞાનયજ્ઞાશ્ચ યતયઃ સંશિતવ્રતાઃ ॥","en":"Others again offer wealth, austerity, and Yoga as sacrifice, while ascetics of self-restraint and rigid vows offer the study of scriptures and knowledge as sacrifice.","hi":"दूसरे कितने ही तीक्ष्ण व्रत करनेवाले प्रयत्नशील साधक द्रव्य-सम्बन्धी यज्ञ करनेवाले हैं, और कितने ही तपोयज्ञ करनेवाले हैं, और दूसरे कितने ही योगयज्ञ करनेवाले हैं, तथा कितने ही स्वाध्यायरूप ज्ञानयज्ञ करनेवाले हैं।"},{"c":4,"v":29,"sp":"krishna","sa":"अपाने जुह्वति प्राण प्राणेऽपानं तथाऽपरे ।\nप्राणापानगती रुद्ध्वा प्राणायामपरायणाः ॥","tr":"apāne juhvati prāṇa prāṇe'pānaṃ tathā'pare\nprāṇāpānagatī ruddhvā prāṇāyāmaparāyaṇāḥ","gs":"અપાને જુહ્વતિ પ્રાણ પ્રાણેઽપાનં તથાઽપરે ।\nપ્રાણાપાનગતી રુદ્ધ્વા પ્રાણાયામપરાયણાઃ ॥","en":"Others offer as sacrifice the outgoing breath into the incoming, and the incoming into the outgoing, restraining the flow of the outgoing and the incoming breaths, solely absorbed in the restraint of the breath.","hi":"।।4.29 -- 4.30।। दूसरे कितने ही प्राणायामके परायण हुए योगीलोग अपानमें प्राणका पूरक करके, प्राण और अपानकी गति रोककर फिर प्राणमें अपानका हवन करते हैं; तथा अन्य कितने ही नियमित आहार करनेवाले प्राणोंका प्राणोंमें हवन किया करते हैं। ये सभी साधक यज्ञोंद्वारा पापोंका नाश करनेवाले और यज्ञोंको जाननेवाले हैं।"},{"c":4,"v":30,"sp":"krishna","sa":"अपरे नियताहाराः प्राणान्प्राणेषु जुह्वति ।\nसर्वेऽप्येते यज्ञविदो यज्ञक्षपितकल्मषाः ॥","tr":"apare niyatāhārāḥ prāṇānprāṇeṣu juhvati\nsarve'pyete yajñavido yajñakṣapitakalmaṣāḥ","gs":"અપરે નિયતાહારાઃ પ્રાણાન્પ્રાણેષુ જુહ્વતિ ।\nસર્વેઽપ્યેતે યજ્ઞવિદો યજ્ઞક્ષપિતકલ્મષાઃ ॥","en":"Others who regulate their diet offer life-breaths in each life-breath. All these are knowers of sacrifice, whose sins are destroyed through sacrifice.","hi":"।।4.29 -- 4.30।। दूसरे कितने ही प्राणायामके परायण हुए योगीलोग अपानमें प्राणका पूरक करके, प्राण और अपानकी गति रोककर फिर प्राणमें अपानका हवन करते हैं; तथा अन्य कितने ही नियमित आहार करनेवाले प्राणोंका प्राणोंमें हवन किया करते हैं। ये सभी साधक यज्ञोंद्वारा पापोंका नाश करनेवाले और यज्ञोंको जाननेवाले हैं।"},{"c":4,"v":31,"sp":"krishna","sa":"यज्ञशिष्टामृतभुजो यान्ति ब्रह्म सनातनम् ।\nनायं लोकोऽस्त्ययज्ञस्य कुतो़ऽन्यः कुरुसत्तम ॥","tr":"yajñaśiṣṭāmṛtabhujo yānti brahma sanātanam\nnāyaṃ loko'styayajñasya kuto़'nyaḥ kurusattama","gs":"યજ્ઞશિષ્ટામૃતભુજો યાન્તિ બ્રહ્મ સનાતનમ્ ।\nનાયં લોકોઽસ્ત્યયજ્ઞસ્ય કુતો़ઽન્યઃ કુરુસત્તમ ॥","en":"Those who eat the remnants of the sacrifice, which are like nectar, go to the eternal Brahman. This world is not for the one who does not perform sacrifice; how then can they have the other, O Arjuna?","hi":"हे कुरुवंशियोंमें श्रेष्ठ अर्जुन ! यज्ञसे बचे हुए अमृतका अनुभव करनेवाले सनातन परब्रह्म परमात्माको प्राप्त होते हैं। यज्ञ न करनेवाले मनुष्यके लिये यह मनुष्यलोक भी सुखदायक नहीं है, फिर परलोक कैसे सुखदायक होगा?"},{"c":4,"v":32,"sp":"krishna","sa":"एवं बहुविधा यज्ञा वितता ब्रह्मणो मुखे ।\nकर्मजान्विद्धि तान्सर्वानेवं ज्ञात्वा विमोक्ष्यसे ॥","tr":"evaṃ bahuvidhā yajñā vitatā brahmaṇo mukhe\nkarmajānviddhi tānsarvānevaṃ jñātvā vimokṣyase","gs":"એવં બહુવિધા યજ્ઞા વિતતા બ્રહ્મણો મુખે ।\nકર્મજાન્વિદ્ધિ તાન્સર્વાનેવં જ્ઞાત્વા વિમોક્ષ્યસે ॥","en":"Thus, manifold sacrifices are spread out before Brahman at the face of Brahman. Know them all to be born of action, and thus knowing, you shall be liberated.","hi":"इस प्रकार और भी बहुत तरहके यज्ञ वेदकी वाणीमें विस्तारसे कहे गये हैं। उन सब यज्ञोंको तू कर्मजन्य जान। इस प्रकार जानकर यज्ञ करनेसे तू (कर्मबन्धनसे) मुक्त हो जायगा।"},{"c":4,"v":33,"sp":"krishna","sa":"श्रेयान्द्रव्यमयाद्यज्ञाज्ज्ञानयज्ञः परन्तप ।\nसर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते ॥","tr":"śreyāndravyamayādyajñājjñānayajñaḥ parantapa\nsarvaṃ karmākhilaṃ pārtha jñāne parisamāpyate","gs":"શ્રેયાન્દ્રવ્યમયાદ્યજ્ઞાજ્જ્ઞાનયજ્ઞઃ પરન્તપ ।\nસર્વં કર્માખિલં પાર્થ જ્ઞાને પરિસમાપ્યતે ॥","en":"Superior is wisdom-sacrifice to the sacrifice with objects, O Parantapa (scorcher of the foes). All actions in their entirety, O Arjuna, culminate in knowledge.","hi":"हे परन्तप अर्जुन ! द्रव्यमय यज्ञसे ज्ञानयज्ञ श्रेष्ठ है। सम्पूर्ण कर्म और पदार्थ ज्ञान-(तत्त्वज्ञान-) में समाप्त हो जाते हैं।"},{"c":4,"v":34,"sp":"krishna","sa":"तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया ।\nउपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः ॥","tr":"tadviddhi praṇipātena paripraśnena sevayā\nupadekṣyanti te jñānaṃ jñāninastattvadarśinaḥ","gs":"તદ્વિદ્ધિ પ્રણિપાતેન પરિપ્રશ્નેન સેવયા ।\nઉપદેક્ષ્યન્તિ તે જ્ઞાનં જ્ઞાનિનસ્તત્ત્વદર્શિનઃ ॥","en":"Know that the wise who have realized the truth will instruct thee in that knowledge through long prostration, supplication, and service.","hi":"उस- (तत्त्वज्ञान-) को (तत्त्वदर्शी ज्ञानी महापुरुषोंके पास जाकर) समझ। उनको साष्टाङ्ग दण्डवत् प्रणाम करनेसे, उनकी सेवा करनेसे और सरलतापूर्वक प्रश्न करनेसे वे तत्त्वदर्शी ज्ञानी महापुरुष तुझे उस तत्त्वज्ञानका उपदेश देंगे।"},{"c":4,"v":35,"sp":"krishna","sa":"यज्ज्ञात्वा न पुनर्मोहमेवं यास्यसि पाण्डव ।\nयेन भूतान्यशेषेण द्रक्ष्यस्यात्मन्यथो मयि ॥","tr":"yajjñātvā na punarmohamevaṃ yāsyasi pāṇḍava\nyena bhūtānyaśeṣeṇa drakṣyasyātmanyatho mayi","gs":"યજ્જ્ઞાત્વા ન પુનર્મોહમેવં યાસ્યસિ પાણ્ડવ ।\nયેન ભૂતાન્યશેષેણ દ્રક્ષ્યસ્યાત્મન્યથો મયિ ॥","en":"Knowing that thou shalt not, O Arjuna, again be deluded like this; and by that thou shalt see all beings in thyself and also in me.","hi":"जिस- (तत्त्वज्ञान-) का अनुभव करनेके बाद तू फिर इस प्रकार मोहको नहीं प्राप्त होगा, और हे अर्जुन ! जिस- (तत्त्वज्ञान-) से तू सम्पूर्ण प्राणियोंको निःशेषभावसे पहले अपनेमें और उसके बाद मुझ सच्चिदानन्दघन परमात्मामें देखेगा।"},{"c":4,"v":36,"sp":"krishna","sa":"अपि चेदसि पापेभ्यः सर्वेभ्यः पापकृत्तमः ।\nसर्वं ज्ञानप्लवेनैव वृजिनं सन्तरिष्यसि ॥","tr":"api cedasi pāpebhyaḥ sarvebhyaḥ pāpakṛttamaḥ\nsarvaṃ jñānaplavenaiva vṛjinaṃ santariṣyasi","gs":"અપિ ચેદસિ પાપેભ્યઃ સર્વેભ્યઃ પાપકૃત્તમઃ ।\nસર્વં જ્ઞાનપ્લવેનૈવ વૃજિનં સન્તરિષ્યસિ ॥","en":"Even if thou art the most sinful of all sinners, yet thou shalt surely cross over all sins by the raft of knowledge.","hi":"अगर तू सब पापियोंसे भी अधिक पापी है, तो भी तू ज्ञानरूपी नौकाके द्वारा निःसन्देह सम्पूर्ण पापसमुद्रसे अच्छी तरह तर जायगा।"},{"c":4,"v":37,"sp":"krishna","sa":"यथैधांसि समिद्धोऽग्निर्भस्मसात्कुरुतेऽर्जुन ।\nज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा ॥","tr":"yathaidhāṃsi samiddho'gnirbhasmasātkurute'rjuna\njñānāgniḥ sarvakarmāṇi bhasmasātkurute tathā","gs":"યથૈધાંસિ સમિદ્ધોઽગ્નિર્ભસ્મસાત્કુરુતેઽર્જુન ।\nજ્ઞાનાગ્નિઃ સર્વકર્માણિ ભસ્મસાત્કુરુતે તથા ॥","en":"As the blazing fire reduces fuel to ashes, O Arjuna, so does the fire of knowledge reduce all actions to ash.","hi":"हे अर्जुन ! जैसे प्रज्वलित अग्नि ईंधनोंको सर्वथा भस्म कर देती है, ऐसे ही ज्ञानरूपी अग्नि सम्पूर्ण कर्मोंको सर्वथा भस्म कर देती है।"},{"c":4,"v":38,"sp":"krishna","sa":"न हि ज्ञानेन सदृशं पवित्रमिह विद्यते ।\nतत्स्वयं योगसंसिद्धः कालेनात्मनि विन्दति ॥","tr":"na hi jñānena sadṛśaṃ pavitramiha vidyate\ntatsvayaṃ yogasaṃsiddhaḥ kālenātmani vindati","gs":"ન હિ જ્ઞાનેન સદૃશં પવિત્રમિહ વિદ્યતે ।\nતત્સ્વયં યોગસંસિદ્ધઃ કાલેનાત્મનિ વિન્દતિ ॥","en":"Verily, there is no purifier in this world like knowledge. He who is perfected in Yoga finds it within the Self in due time.","hi":"इस मनुष्यलोकमें ज्ञानके समान पवित्र करनेवाला निःसन्देह दूसरा कोई साधन नहीं है। जिसका योग भली-भाँति सिद्ध हो गया है, वह (कर्मयोगी) उस तत्त्वज्ञानको अवश्य ही स्वयं अपने-आपमें पा लेता है।"},{"c":4,"v":39,"sp":"krishna","sa":"श्रद्धावाँल्लभते ज्ञानं तत्परः संयतेन्द्रियः ।\nज्ञानं लब्ध्वा परां शान्तिमचिरेणाधिगच्छति ॥","tr":"śraddhāvā~llabhate jñānaṃ tatparaḥ saṃyatendriyaḥ\njñānaṃ labdhvā parāṃ śāntimacireṇādhigacchati","gs":"શ્રદ્ધાવાઁલ્લભતે જ્ઞાનં તત્પરઃ સંયતેન્દ્રિયઃ ।\nજ્ઞાનં લબ્ધ્વા પરાં શાન્તિમચિરેણાધિગચ્છતિ ॥","en":"The one who is full of faith, devoted to it, and has subdued their senses obtains this knowledge; and upon obtaining the knowledge, they attain the supreme peace immediately.","hi":"जो जितेन्द्रिय तथा साधन-परायण है, ऐसा श्रद्धावान् मनुष्य ज्ञानको प्राप्त होता है और ज्ञानको प्राप्त होकर वह तत्काल परम शान्तिको प्राप्त हो जाता है।"},{"c":4,"v":40,"sp":"krishna","sa":"अज्ञश्चाश्रद्दधानश्च संशयात्मा विनश्यति ।\nनायं लोकोऽस्ति न परो न सुखं संशयात्मनः ॥","tr":"ajñaścāśraddadhānaśca saṃśayātmā vinaśyati\nnāyaṃ loko'sti na paro na sukhaṃ saṃśayātmanaḥ","gs":"અજ્ઞશ્ચાશ્રદ્દધાનશ્ચ સંશયાત્મા વિનશ્યતિ ।\nનાયં લોકોઽસ્તિ ન પરો ન સુખં સંશયાત્મનઃ ॥","en":"The ignorant, the faithless, and the doubting self go to destruction; there is neither this world nor the other, nor happiness for the doubting one.","hi":"विवेकहीन और श्रद्धारहित संशयात्मा मनुष्यका पतन हो जाता है। ऐसे संशयात्मा मनुष्यके लिये न यह लोक है न परलोक है और न सुख ही है।"},{"c":4,"v":41,"sp":"krishna","sa":"योगसंन्यस्तकर्माणं ज्ञानसंछिन्नसंशयम् ।\nआत्मवन्तं न कर्माणि निबध्नन्ति धनञ्जय ॥","tr":"yogasaṃnyastakarmāṇaṃ jñānasaṃchinnasaṃśayam\nātmavantaṃ na karmāṇi nibadhnanti dhanañjaya","gs":"યોગસંન્યસ્તકર્માણં જ્ઞાનસંછિન્નસંશયમ્ ।\nઆત્મવન્તં ન કર્માણિ નિબધ્નન્તિ ધનઞ્જય ॥","en":"He who has renounced actions through Yoga, whose doubts have been dispelled by knowledge, and who is self-possessed—such a one is not bound by actions, O Arjuna.","hi":"हे धनञ्जय ! योग- (समता-) के द्वारा जिसका सम्पूर्ण कर्मोंसे सम्बन्ध-विच्छेद हो गया है और ज्ञानके द्वारा जिसके सम्पूर्ण संशयोंका नाश हो गया है, ऐसे स्वरूप-परायण मनुष्यको कर्म नहीं बाँधते।"},{"c":4,"v":42,"sp":"krishna","sa":"तस्मादज्ञानसंभूतं हृत्स्थं ज्ञानासिनाऽऽत्मनः ।\nछित्त्वैनं संशयं योगमातिष्ठोत्तिष्ठ भारत ॥","tr":"tasmādajñānasaṃbhūtaṃ hṛtsthaṃ jñānāsinā''tmanaḥ\nchittvainaṃ saṃśayaṃ yogamātiṣṭhottiṣṭha bhārata","gs":"તસ્માદજ્ઞાનસંભૂતં હૃત્સ્થં જ્ઞાનાસિનાઽઽત્મનઃ ।\nછિત્ત્વૈનં સંશયં યોગમાતિષ્ઠોત્તિષ્ઠ ભારત ॥","en":"Therefore, with the sword of knowledge (of the Self), cut asunder the doubt of the self, born of ignorance, residing in your heart, and take refuge in Yoga. Arise, O Arjuna!","hi":"इसलिये हे भरतवंशी अर्जुन ! हृदयमें स्थित इस अज्ञानसे उत्पन्न अपने संशयका ज्ञानरूप तलवारसे छेदन करके योग -(समता-) में स्थित हो जा, (और युद्धके लिये) खड़ा हो जा।"},{"c":5,"v":1,"sp":"arjuna","sa":"संन्यासं कर्मणां कृष्ण पुनर्योगं च शंससि ।\nयच्छ्रेय एतयोरेकं तन्मे ब्रूहि सुनिश्िचतम् ॥","tr":"saṃnyāsaṃ karmaṇāṃ kṛṣṇa punaryogaṃ ca śaṃsasi\nyacchreya etayorekaṃ tanme brūhi suniśicatam","gs":"સંન્યાસં કર્મણાં કૃષ્ણ પુનર્યોગં ચ શંસસિ ।\nયચ્છ્રેય એતયોરેકં તન્મે બ્રૂહિ સુનિશ્િચતમ્ ॥","en":"Arjuna said, \"O Krishna, you praise renunciation of actions and also yoga. Please tell me conclusively which is better of the two.\"","hi":"अर्जुन बोले -- हे कृष्ण ! आप कर्मोंका स्वरूपसे त्याग करनेकी और फिर कर्मयोगकी प्रशंसा करते हैं। अतः इन दोनों साधनोंमें जो एक निश्चितरूपसे कल्याणकारक हो, उसको मेरे लिये कहिये।"},{"c":5,"v":2,"sp":"krishna","sa":"संन्यासः कर्मयोगश्च निःश्रेयसकरावुभौ ।\nतयोस्तु कर्मसंन्यासात्कर्मयोगो विशिष्यते ॥","tr":"saṃnyāsaḥ karmayogaśca niḥśreyasakarāvubhau\ntayostu karmasaṃnyāsātkarmayogo viśiṣyate","gs":"સંન્યાસઃ કર્મયોગશ્ચ નિઃશ્રેયસકરાવુભૌ ।\nતયોસ્તુ કર્મસંન્યાસાત્કર્મયોગો વિશિષ્યતે ॥","en":"The Blessed Lord said, \"Renunciation and the Yoga of action both lead to the highest bliss; but of the two, the Yoga of action is superior to the renunciation of action.\"","hi":"श्रीभगवान् बोले -- संन्यास (सांख्ययोग) और कर्मयोग दोनों ही कल्याण करनेवाले हैं। परन्तु उन दोनोंमें भी कर्मसंन्यास- (सांख्ययोग-) से कर्मयोग श्रेष्ठ है।"},{"c":5,"v":3,"sp":"krishna","sa":"ज्ञेयः स नित्यसंन्यासी यो न द्वेष्टि न काङ्क्षति ।\nनिर्द्वन्द्वो हि महाबाहो सुखं बन्धात्प्रमुच्यते ॥","tr":"jñeyaḥ sa nityasaṃnyāsī yo na dveṣṭi na kāṅkṣati\nnirdvandvo hi mahābāho sukhaṃ bandhātpramucyate","gs":"જ્ઞેયઃ સ નિત્યસંન્યાસી યો ન દ્વેષ્ટિ ન કાઙ્ક્ષતિ ।\nનિર્દ્વન્દ્વો હિ મહાબાહો સુખં બન્ધાત્પ્રમુચ્યતે ॥","en":"He should be known as a perpetual Sannyasi who neither hates nor desires; for, free from the pairs of opposites, O mighty-armed Arjuna, he is easily freed from bondage.","hi":"हे महाबाहो ! जो मनुष्य न किसीसे द्वेष करता है और न किसीकी आकाङ्क्षा करता है; वह (कर्मयोगी) सदा संन्यासी समझनेयोग्य है; क्योंकि द्वन्द्वोंसे रहित मनुष्य सुखपूर्वक संसार-बन्धनसे मुक्त हो जाता है।"},{"c":5,"v":4,"sp":"krishna","sa":"सांख्ययोगौ पृथग्बालाः प्रवदन्ति न पण्डिताः ।\nएकमप्यास्थितः सम्यगुभयोर्विन्दते फलम् ॥","tr":"sāṃkhyayogau pṛthagbālāḥ pravadanti na paṇḍitāḥ\nekamapyāsthitaḥ samyagubhayorvindate phalam","gs":"સાંખ્યયોગૌ પૃથગ્બાલાઃ પ્રવદન્તિ ન પણ્ડિતાઃ ।\nએકમપ્યાસ્થિતઃ સમ્યગુભયોર્વિન્દતે ફલમ્ ॥","en":"Children, not the wise, speak of knowledge and the Yoga of action, or the performance of action, as though they are distinct and different; he who is truly established in one, obtains the fruits of both.","hi":"बेसमझ लोग सांख्ययोग और कर्मयोगको अलग-अलग फलवाले कहते हैं, न कि पण्डितजन; क्योंकि इन दोनोंमेंसे एक साधनमें भी अच्छी तरहसे स्थित मनुष्य दोनोंके फलरूप परमात्माको प्राप्त कर लेता है।"},{"c":5,"v":5,"sp":"krishna","sa":"यत्सांख्यैः प्राप्यते स्थानं तद्योगैरपि गम्यते ।\nएकं सांख्यं च योगं च यः पश्यति स पश्यति ॥","tr":"yatsāṃkhyaiḥ prāpyate sthānaṃ tadyogairapi gamyate\nekaṃ sāṃkhyaṃ ca yogaṃ ca yaḥ paśyati sa paśyati","gs":"યત્સાંખ્યૈઃ પ્રાપ્યતે સ્થાનં તદ્યોગૈરપિ ગમ્યતે ।\nએકં સાંખ્યં ચ યોગં ચ યઃ પશ્યતિ સ પશ્યતિ ॥","en":"That place which is reached by the Sankhyas or the Jnanis is also reached by the Yogis (Karma Yogis). He who sees knowledge and the performance of action (Karma Yoga) as one, sees truly.","hi":"सांख्ययोगियोंके द्वारा जो तत्त्व प्राप्त किया जाता है, कर्मयोगियोंके द्वारा भी वही प्राप्त किया जाता है। अतः जो मनुष्य सांख्ययोग और कर्मयोगको (फलरूपमें) एक देखता है, वही ठीक देखता है।"},{"c":5,"v":6,"sp":"krishna","sa":"संन्यासस्तु महाबाहो दुःखमाप्तुमयोगतः ।\nयोगयुक्तो मुनिर्ब्रह्म नचिरेणाधिगच्छत
