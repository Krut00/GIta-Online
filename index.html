पछताएँगे, फिर भी न उठना।","diff":"तमस आराम नहीं है; स्वस्थ आराम ताज़गी देता है, तमस सुस्त करता है।"},"gu":{"name":"તમસ","def":"જડતા, અંધકાર અને પ્રમાદનો ગુણ.","deep":"તમસ અજ્ઞાનમાંથી જન્મે છે અને પ્રમાદ, આળસ અને નિદ્રાથી બાંધે છે (14.8). તામસિક ભોજન વાસી અને અશુદ્ધ છે (17.10); તામસિક કર્મ બીજાના નુકસાનની પરવા કરતું નથી (18.25).","ex":"મોડી રાત સુધી કલાકો સ્ક્રોલ કરતા રહેવું, એ જાણતાં કે પસ્તાશો, છતાં ન ઊઠવું.","diff":"તમસ આરામ નથી; સ્વસ્થ આરામ તાજગી આપે છે, તમસ સુસ્ત બનાવે છે."}},{"id":"ahamkara","sa":"अहङ्कार","pron":"uh-HUNG-kaa-ruh","refs":["3.27","7.4","18.17","18.58"],"en":{"name":"Ahamkara","def":"Ego; the sense of 'I am the doer'.","deep":"Literally 'I-maker'. It is one of the eight elements of lower nature (7.4). The deluded think 'I am the doer' when actions are really done by the gunas (3.27). One free of this sense is not bound even by action (18.17).","ex":"Taking every team failure as a personal insult, or every success as purely your own doing.","diff":"Not the same as pride, though it can cause pride. It is the basic sense of separate 'me-ness'."},"hi":{"name":"अहंकार","def":"अहं; 'मैं कर्ता हूँ' का भाव।","deep":"शाब्दिक अर्थ 'मैं बनाने वाला'। यह अपरा प्रकृति के आठ तत्त्वों में से एक है (7.4)। मोहित व्यक्ति सोचता है 'मैं कर्ता हूँ', जबकि कर्म वास्तव में गुणों द्वारा होते हैं (3.27)। जो इस भाव से मुक्त है वह कर्म से भी नहीं बँधता (18.17)।","ex":"टीम की हर असफलता को निजी अपमान मानना, या हर सफलता को केवल अपनी उपलब्धि मानना।","diff":"यह घमंड जैसा नहीं, हालाँकि घमंड का कारण बन सकता है। यह अलग 'मैं-पन' का मूल भाव है।"},"gu":{"name":"અહંકાર","def":"અહં; 'હું કર્તા છું'નો ભાવ.","deep":"શાબ્દિક અર્થ 'હું બનાવનાર'. તે અપરા પ્રકૃતિનાં આઠ તત્ત્વોમાંનું એક છે (7.4). મોહિત વ્યક્તિ વિચારે છે 'હું કર્તા છું', જ્યારે કર્મ ખરેખર ગુણો દ્વારા થાય છે (3.27). જે આ ભાવથી મુક્ત છે તે કર્મથી પણ બંધાતો નથી (18.17).","ex":"ટીમની દરેક નિષ્ફળતાને અંગત અપમાન માનવું, કે દરેક સફળતાને ફક્ત પોતાની સિદ્ધિ માનવી.","diff":"આ ઘમંડ જેવું નથી, જોકે ઘમંડનું કારણ બની શકે. તે અલગ 'હું-પણા'નો મૂળ ભાવ છે."}},{"id":"buddhi","sa":"बुद्धि","pron":"BOOD-dhee","refs":["2.41","2.49","2.63","3.42","18.30"],"en":{"name":"Buddhi","def":"Intellect; the faculty that decides and discriminates.","deep":"In Chapter 2, buddhi yoga means steadying the intellect so it is one-pointed (2.41). When memory is lost, buddhi is destroyed, and one is ruined (2.63). 3.42 ranks it: senses, then mind, then buddhi, then the self beyond it.","ex":"Pausing before replying to an angry message and asking 'What outcome do I actually want?' is buddhi at work.","diff":"Buddhi decides; manas wavers and processes impressions."},"hi":{"name":"बुद्धि","def":"बुद्धि; निर्णय और विवेक करने वाली शक्ति।","deep":"अध्याय 2 में बुद्धियोग का अर्थ है बुद्धि को एकाग्र और स्थिर करना (2.41)। स्मृति नष्ट होने से बुद्धि नष्ट होती है, और व्यक्ति का पतन होता है (2.63)। 3.42 क्रम बताता है: इंद्रियाँ, फिर मन, फिर बुद्धि, फिर उससे परे आत्मा।","ex":"ग़ुस्से वाले संदेश का जवाब देने से पहले रुककर पूछना 'मुझे असल में क्या परिणाम चाहिए?' — यह बुद्धि का काम है।","diff":"बुद्धि निर्णय करती है; मन डगमगाता है और अनुभवों को ग्रहण करता है।"},"gu":{"name":"બુદ્ધિ","def":"બુદ્ધિ; નિર્ણય અને વિવેક કરનારી શક્તિ.","deep":"અધ્યાય 2માં બુદ્ધિયોગનો અર્થ બુદ્ધિને એકાગ્ર અને સ્થિર કરવી છે (2.41). સ્મૃતિ નાશ પામવાથી બુદ્ધિ નાશ પામે છે, અને વ્યક્તિનું પતન થાય છે (2.63). 3.42 ક્રમ બતાવે છે: ઇન્દ્રિયો, પછી મન, પછી બુદ્ધિ, પછી તેનાથી પર આત્મા.","ex":"ગુસ્સાવાળા સંદેશનો જવાબ આપતાં પહેલાં થોભીને પૂછવું 'મારે ખરેખર કયું પરિણામ જોઈએ છે?' — આ બુદ્ધિનું કામ છે.","diff":"બુદ્ધિ નિર્ણય કરે છે; મન ડગમગે છે અને અનુભવો ગ્રહણ કરે છે."}},{"id":"manas","sa":"मनस्","pron":"MUH-nus","refs":["6.5","6.26","6.34","6.35"],"en":{"name":"Manas","def":"Mind; the faculty of thought, feeling and attention.","deep":"Arjuna calls it restless, turbulent, strong and as hard to control as the wind (6.34). Krishna agrees and gives the method: practice and detachment (6.35). Whenever it wanders, bring it back (6.26).","ex":"Trying to study and finding yourself thinking about lunch, an old argument and a song, all within a minute.","diff":"Manas receives and reacts; buddhi evaluates and decides."},"hi":{"name":"मन","def":"मन; विचार, भावना और ध्यान की शक्ति।","deep":"अर्जुन इसे चंचल, प्रमथन करने वाला, बलवान और हवा की तरह वश में करने में कठिन बताते हैं (6.34)। कृष्ण सहमत होते हैं और विधि बताते हैं: अभ्यास और वैराग्य (6.35)। जब भी यह भटके, इसे वापस लाओ (6.26)।","ex":"पढ़ने की कोशिश करना और एक ही मिनट में ख़ुद को खाने, पुरानी बहस और किसी गाने के बारे में सोचते पाना।","diff":"मन ग्रहण करता है और प्रतिक्रिया देता है; बुद्धि आँकती है और निर्णय करती है।"},"gu":{"name":"મન","def":"મન; વિચાર, લાગણી અને ધ્યાનની શક્તિ.","deep":"અર્જુન તેને ચંચળ, વલોવી નાખનારું, બળવાન અને પવનની જેમ વશ કરવામાં અઘરું કહે છે (6.34). કૃષ્ણ સહમત થાય છે અને રીત બતાવે છે: અભ્યાસ અને વૈરાગ્ય (6.35). જ્યારે પણ તે ભટકે, તેને પાછું લાવો (6.26).","ex":"વાંચવાનો પ્રયાસ કરવો અને એક જ મિનિટમાં પોતાને જમવા, જૂના ઝઘડા અને કોઈ ગીત વિશે વિચારતા જોવા.","diff":"મન ગ્રહણ કરે છે અને પ્રતિક્રિયા આપે છે; બુદ્ધિ મૂલવે છે અને નિર્ણય કરે છે."}},{"id":"shraddha","sa":"श्रद्धा","pron":"SHRUD-dhaa","refs":["4.39","6.47","17.2","17.3"],"en":{"name":"Shraddha","def":"Faith; trust and conviction that shape one's life.","deep":"'A person is made of faith; as one's faith is, so one is' (17.3). Faith comes in three kinds according to the gunas (17.2). The one with faith gains knowledge (4.39).","ex":"Faith that hard work matters keeps a student studying through a bad semester.","diff":"Shraddha is not blind belief. In the Gita it is paired with self-control and inquiry (4.34, 4.39)."},"hi":{"name":"श्रद्धा","def":"श्रद्धा; विश्वास और दृढ़ भाव जो जीवन को आकार देते हैं।","deep":"'मनुष्य श्रद्धामय है; जैसी जिसकी श्रद्धा, वैसा ही वह है' (17.3)। गुणों के अनुसार श्रद्धा तीन प्रकार की होती है (17.2)। श्रद्धावान को ज्ञान मिलता है (4.39)।","ex":"मेहनत का महत्त्व है, यह श्रद्धा एक विद्यार्थी को कठिन सेमेस्टर में भी पढ़ाई जारी रखने देती है।","diff":"श्रद्धा अंधविश्वास नहीं है। गीता में यह संयम और जिज्ञासा के साथ आती है (4.34, 4.39)।"},"gu":{"name":"શ્રદ્ધા","def":"શ્રદ્ધા; વિશ્વાસ અને દૃઢ ભાવ જે જીવનને ઘડે છે.","deep":"'માણસ શ્રદ્ધામય છે; જેવી જેની શ્રદ્ધા, તેવો જ તે છે' (17.3). ગુણો પ્રમાણે શ્રદ્ધા ત્રણ પ્રકારની હોય છે (17.2). શ્રદ્ધાવાનને જ્ઞાન મળે છે (4.39).","ex":"મહેનતનું મહત્ત્વ છે, આ શ્રદ્ધા એક વિદ્યાર્થીને અઘરા સેમેસ્ટરમાં પણ ભણવાનું ચાલુ રાખવા દે છે.","diff":"શ્રદ્ધા અંધવિશ્વાસ નથી. ગીતામાં તે સંયમ અને જિજ્ઞાસા સાથે આવે છે (4.34, 4.39)."}},{"id":"samatvam","sa":"समत्वम्","pron":"suh-MUT-vum","refs":["2.38","2.48","5.18","6.9","12.18"],"en":{"name":"Samatvam","def":"Evenness of mind; equanimity.","deep":"'Samatvam yoga uchyate' — evenness is called yoga (2.48). It means staying the same in pleasure and pain, gain and loss, victory and defeat (2.38), and seeing all beings with equal regard (5.18, 6.9).","ex":"Receiving both praise and criticism of your work, and taking useful points from each without being thrown off.","diff":"Not emotional flatness. You still feel; you are just not pushed around by what you feel."},"hi":{"name":"समत्व","def":"मन की समता; समभाव।","deep":"'समत्वं योग उच्यते' — समता को ही योग कहते हैं (2.48)। इसका अर्थ है सुख-दुःख, लाभ-हानि, जय-पराजय में एक-सा रहना (2.38), और सब प्राणियों को समान दृष्टि से देखना (5.18, 6.9)।","ex":"अपने काम की प्रशंसा और आलोचना दोनों सुनना, और बिना विचलित हुए दोनों से काम की बातें लेना।","diff":"यह भावशून्यता नहीं है। आप महसूस करते हैं; बस जो महसूस करते हैं वह आपको इधर-उधर नहीं धकेलता।"},"gu":{"name":"સમત્વ","def":"મનની સમતા; સમભાવ.","deep":"'સમત્વં યોગ ઉચ્યતે' — સમતાને જ યોગ કહેવાય છે (2.48). તેનો અર્થ સુખ-દુઃખ, લાભ-હાનિ, જય-પરાજયમાં એક સરખા રહેવું (2.38), અને બધા જીવોને સમાન દૃષ્ટિથી જોવા (5.18, 6.9).","ex":"પોતાના કામની પ્રશંસા અને ટીકા બંને સાંભળવી, અને વિચલિત થયા વગર બંનેમાંથી કામની વાત લેવી.","diff":"આ ભાવશૂન્યતા નથી. તમે અનુભવો છો; ફક્ત જે અનુભવો છો તે તમને આમતેમ ધકેલતું નથી."}},{"id":"yajna","sa":"यज्ञ","pron":"YUG-nyuh","refs":["3.9","3.10","3.13","4.23","4.33","17.11"],"en":{"name":"Yajna","def":"Sacrifice; action offered for a larger good.","deep":"Originally the Vedic fire ritual. The Gita widens it: action done as yajna does not bind (3.9); there are sacrifices of wealth, austerity, study and knowledge (4.28), and the sacrifice of knowledge is highest (4.33). Those who eat the remains of sacrifice are freed from sin (3.13).","ex":"Cooking for your family, a community kitchen, or sharing your skills freely can all be yajna when done as offering.","diff":"Yajna is the act of offering; tyaga is letting go of its fruit."},"hi":{"name":"यज्ञ","def":"यज्ञ; बड़े हित के लिए अर्पित कर्म।","deep":"मूल रूप से वैदिक अग्निकर्म। गीता इसे व्यापक बनाती है: यज्ञ रूप कर्म नहीं बाँधता (3.9); धन, तप, स्वाध्याय और ज्ञान के यज्ञ होते हैं (4.28), और ज्ञानयज्ञ श्रेष्ठ है (4.33)। यज्ञ से बचा अन्न खाने वाले पापों से छूट जाते हैं (3.13)।","ex":"परिवार के लिए खाना बनाना, सामुदायिक रसोई, या अपना हुनर मुफ़्त बाँटना — अर्पण भाव से किया जाए तो सब यज्ञ हो सकता है।","diff":"यज्ञ अर्पण का कर्म है; त्याग उसके फल को छोड़ना है।"},"gu":{"name":"યજ્ઞ","def":"યજ્ઞ; મોટા હિત માટે અર્પણ કરેલું કર્મ.","deep":"મૂળ રૂપે વૈદિક અગ્નિકર્મ. ગીતા તેને વ્યાપક બનાવે છે: યજ્ઞરૂપ કર્મ બાંધતું નથી (3.9); ધન, તપ, સ્વાધ્યાય અને જ્ઞાનના યજ્ઞ હોય છે (4.28), અને જ્ઞાનયજ્ઞ શ્રેષ્ઠ છે (4.33). યજ્ઞમાંથી બચેલું અન્ન ખાનારા પાપોમાંથી છૂટે છે (3.13).","ex":"કુટુંબ માટે રસોઈ, સામૂહિક રસોડું, કે પોતાની આવડત મફત વહેંચવી — અર્પણભાવે થાય તો બધું યજ્ઞ બની શકે.","diff":"યજ્ઞ અર્પણનું કર્મ છે; ત્યાગ તેના ફળને છોડવું છે."}}],"themes":[{"id":"fear","refs":["2.40","4.10","16.1","18.30","18.66"],"en":{"t":"How to overcome fear?","intro":"The Gita does not say fear is shameful. It shows fear dissolving through understanding, steady effort and trust.","n":["Even a little of this practice protects from great fear.","Free from attachment, fear and anger, many reached Krishna's state.","Fearlessness heads the list of divine qualities.","A clear intellect knows what to fear and what not to fear.","Krishna's final reassurance: do not grieve, I will free you."]},"hi":{"t":"भय पर कैसे विजय पाएँ?","intro":"गीता भय को शर्म की बात नहीं कहती। वह दिखाती है कि समझ, निरंतर प्रयास और भरोसे से भय कैसे घुलता है।","n":["इस साधना का थोड़ा-सा अंश भी बड़े भय से बचाता है।","राग, भय और क्रोध से मुक्त होकर बहुत लोगों ने कृष्ण का भाव पाया।","दैवी गुणों की सूची अभय से शुरू होती है।","स्पष्ट बुद्धि जानती है कि किससे डरना है और किससे नहीं।","कृष्ण का अंतिम आश्वासन: शोक मत करो, मैं तुम्हें मुक्त करूँगा।"]},"gu":{"t":"ભય પર કેવી રીતે વિજય મેળવવો?","intro":"ગીતા ભયને શરમની વાત નથી કહેતી. તે બતાવે છે કે સમજ, સતત પ્રયત્ન અને વિશ્વાસથી ભય કેવી રીતે ઓગળે છે.","n":["આ સાધનાનો થોડો અંશ પણ મોટા ભયથી બચાવે છે.","રાગ, ભય અને ક્રોધથી મુક્ત થઈને ઘણા લોકોએ કૃષ્ણનો ભાવ પામ્યો.","દૈવી ગુણોની યાદી અભયથી શરૂ થાય છે.","સ્પષ્ટ બુદ્ધિ જાણે છે કે શાનાથી ડરવું અને શાનાથી નહીં.","કૃષ્ણનું અંતિમ આશ્વાસન: શોક ન કરો, હું તમને મુક્ત કરીશ."]}},{"id":"anger","refs":["2.62","2.63","3.37","5.23","16.21"],"en":{"t":"How to control anger?","intro":"The Gita traces anger back to desire and gives a way to catch it early.","n":["Dwelling on objects creates attachment, then desire, then anger.","Anger leads to delusion, loss of memory, loss of judgement and ruin.","Desire and anger, born of rajas, are the real enemy.","One who can withstand the force of desire and anger before death is happy.","Desire, anger and greed are the three gates to self-destruction."]},"hi":{"t":"क्रोध पर नियंत्रण कैसे करें?","intro":"गीता क्रोध की जड़ कामना में बताती है और उसे शुरू में ही पकड़ने का तरीक़ा देती है।","n":["विषयों का चिंतन आसक्ति लाता है, फिर कामना, फिर क्रोध।","क्रोध से मोह, स्मृति-भ्रंश, बुद्धि-नाश और पतन होता है।","रजोगुण से उत्पन्न काम और क्रोध ही असली शत्रु हैं।","जो शरीर छूटने से पहले काम-क्रोध के वेग को सह लेता है, वही सुखी है।","काम, क्रोध और लोभ आत्मनाश के तीन द्वार हैं।"]},"gu":{"t":"ક્રોધ પર નિયંત્રણ કેવી રીતે કરવું?","intro":"ગીતા ક્રોધનું મૂળ કામનામાં બતાવે છે અને તેને શરૂઆતમાં જ પકડવાની રીત આપે છે.","n":["વિષયોનું ચિંતન આસક્તિ લાવે છે, પછી કામના, પછી ક્રોધ.","ક્રોધમાંથી મોહ, સ્મૃતિભ્રંશ, બુદ્ધિનાશ અને પતન થાય છે.","રજોગુણમાંથી જન્મેલા કામ અને ક્રોધ જ સાચા શત્રુ છે.","જે શરીર છૂટતાં પહેલાં કામ-ક્રોધનો વેગ સહન કરે છે, તે જ સુખી છે.","કામ, ક્રોધ અને લોભ આત્મનાશનાં ત્રણ દ્વાર છે."]}},{"id":"overthinking","refs":["2.41","6.26","6.34","6.35","2.66"],"en":{"t":"How to deal with overthinking?","intro":"Arjuna himself complains the mind is like the wind. Krishna's answer is practical: one direction, repeated return, and patience.","n":["The resolute intellect is one-pointed; the irresolute is many-branched.","Whenever the mind wanders, bring it back.","Arjuna: the mind is restless and hard to hold, like the wind.","Krishna: yes, but it is held by practice and detachment.","Without steadiness there is no peace, and without peace, no happiness."]},"hi":{"t":"ज़रूरत से ज़्यादा सोचने से कैसे निपटें?","intro":"अर्जुन ख़ुद कहते हैं कि मन हवा जैसा है। कृष्ण का उत्तर व्यावहारिक है: एक दिशा, बार-बार लौटना, और धैर्य।","n":["निश्चयात्मक बुद्धि एक होती है; अनिश्चयी की बुद्धि अनेक शाखाओं वाली।","जब भी मन भटके, उसे वापस लाओ।","अर्जुन: मन चंचल है और हवा की तरह पकड़ में नहीं आता।","कृष्ण: हाँ, पर अभ्यास और वैराग्य से वश में आता है।","स्थिरता के बिना शांति नहीं, और शांति के बिना सुख नहीं।"]},"gu":{"t":"વધુ પડતું વિચારવા સાથે કેવી રીતે કામ લેવું?","intro":"અર્જુન પોતે કહે છે કે મન પવન જેવું છે. કૃષ્ણનો જવાબ વ્યવહારુ છે: એક દિશા, વારંવાર પાછા આવવું, અને ધીરજ.","n":["નિશ્ચયાત્મક બુદ્ધિ એક હોય છે; અનિશ્ચયીની બુદ્ધિ અનેક શાખાવાળી.","જ્યારે પણ મન ભટકે, તેને પાછું લાવો.","અર્જુન: મન ચંચળ છે અને પવનની જેમ પકડમાં આવતું નથી.","કૃષ્ણ: હા, પણ અભ્યાસ અને વૈરાગ્યથી વશ થાય છે.","સ્થિરતા વગર શાંતિ નથી, અને શાંતિ વગર સુખ નથી."]}},{"id":"failure","refs":["2.47","2.48","6.40","18.47","4.18"],"en":{"t":"How to handle failure?","intro":"The Gita separates your effort from the result, so failure becomes information rather than a verdict on you.","n":["Your right is to the action, not its fruits.","Be even in success and failure.","No one who does good comes to a bad end; effort is not lost.","Do your own work, even imperfectly.","Wise action looks past appearances of success and failure."]},"hi":{"t":"असफलता को कैसे संभालें?","intro":"गीता आपके प्रयास को परिणाम से अलग करती है, जिससे असफलता आप पर फ़ैसला नहीं, एक जानकारी बन जाती है।","n":["तुम्हारा अधिकार कर्म में है, फल में नहीं।","सफलता और असफलता में समान रहो।","भलाई करने वाले की दुर्गति नहीं होती; प्रयास व्यर्थ नहीं जाता।","अपना काम करो, कमियों के साथ भी।","बुद्धिमान कर्म सफलता-असफलता के दिखावे से परे देखता है।"]},"gu":{"t":"નિષ્ફળતાને કેવી રીતે સંભાળવી?","intro":"ગીતા તમારા પ્રયત્નને પરિણામથી અલગ કરે છે, જેથી નિષ્ફળતા તમારા પર ચુકાદો નહીં, એક માહિતી બને છે.","n":["તમારો અધિકાર કર્મમાં છે, ફળમાં નહીં.","સફળતા અને નિષ્ફળતામાં સમાન રહો.","ભલું કરનારની દુર્ગતિ થતી નથી; પ્રયત્ન વ્યર્થ જતો નથી.","પોતાનું કામ કરો, ખામીઓ સાથે પણ.","સમજદાર કર્મ સફળતા-નિષ્ફળતાના દેખાવથી પર જુએ છે."]}},{"id":"attachment","refs":["2.62","3.19","5.10","15.3","18.6"],"en":{"t":"How to overcome attachment?","intro":"The Gita does not ask you to stop caring. It asks you to act fully without clinging.","n":["Attachment starts with dwelling on things.","Do your work without attachment and you reach the highest.","Act like a lotus leaf that water does not wet.","Cut the tree of worldly attachment with the axe of detachment.","Even good acts should be done without attachment to results."]},"hi":{"t":"आसक्ति से कैसे मुक्त हों?","intro":"गीता परवाह छोड़ने को नहीं कहती। वह चिपके बिना पूरी तरह कर्म करने को कहती है।","n":["आसक्ति विषयों के चिंतन से शुरू होती है।","आसक्ति के बिना कर्म करो, तो परम को पाओगे।","कमल के पत्ते की तरह कर्म करो, जिसे पानी नहीं भिगोता।","संसार की आसक्ति के वृक्ष को वैराग्य की कुल्हाड़ी से काटो।","अच्छे कर्म भी फल की आसक्ति के बिना करने चाहिए।"]},"gu":{"t":"આસક્તિમાંથી કેવી રીતે મુક્ત થવું?","intro":"ગીતા પરવા છોડવાનું નથી કહેતી. તે વળગ્યા વગર પૂરેપૂરું કર્મ કરવાનું કહે છે.","n":["આસક્તિ વિષયોના ચિંતનથી શરૂ થાય છે.","આસક્તિ વગર કર્મ કરો, તો પરમને પામશો.","કમળના પાનની જેમ કર્મ કરો, જેને પાણી ભીંજવતું નથી.","જગતની આસક્તિના વૃક્ષને વૈરાગ્યની કુહાડીથી કાપો.","સારાં કર્મ પણ ફળની આસક્તિ વગર કરવાં જોઈએ."]}},{"id":"death","refs":["2.13","2.20","2.22","2.27","8.5"],"en":{"t":"How to understand death?","intro":"Krishna's first answer to Arjuna's grief is a teaching on death: the body ends, the self does not.","n":["As the self passes through childhood, youth and old age, so it passes to another body.","The self is not born and does not die.","As a person discards old clothes and puts on new ones, the self takes new bodies.","Death is certain for the born; grieving the inevitable does not help.","What one remembers at the end, one attains."]},"hi":{"t":"मृत्यु को कैसे समझें?","intro":"अर्जुन के शोक का कृष्ण का पहला उत्तर मृत्यु पर उपदेश है: शरीर समाप्त होता है, आत्मा नहीं।","n":["जैसे आत्मा बचपन, जवानी और बुढ़ापे से गुज़रती है, वैसे ही दूसरे शरीर में जाती है।","आत्मा न जन्मती है न मरती है।","जैसे मनुष्य पुराने कपड़े छोड़कर नए पहनता है, आत्मा नए शरीर लेती है।","जन्मे की मृत्यु निश्चित है; अटल बात पर शोक से लाभ नहीं।","अंत में जिसका स्मरण हो, वही प्राप्त होता है।"]},"gu":{"t":"મૃત્યુને કેવી રીતે સમજવું?","intro":"અર્જુનના શોકનો કૃષ્ણનો પહેલો જવાબ મૃત્યુ પરનો ઉપદેશ છે: શરીર પૂરું થાય છે, આત્મા નહીં.","n":["જેમ આત્મા બાળપણ, યુવાની અને ઘડપણમાંથી પસાર થાય છે, તેમ બીજા શરીરમાં જાય છે.","આત્મા જન્મતો નથી અને મરતો નથી.","જેમ માણસ જૂનાં કપડાં છોડીને નવાં પહેરે છે, તેમ આત્મા નવાં શરીર લે છે.","જન્મેલાનું મૃત્યુ નિશ્ચિત છે; અનિવાર્ય વાત પર શોકથી લાભ નથી.","અંતે જેનું સ્મરણ થાય, તે જ પ્રાપ્ત થાય છે."]}},{"id":"purpose","refs":["3.8","3.35","18.45","18.46","6.5"],"en":{"t":"How to find purpose?","intro":"The Gita locates purpose in doing one's own work well, as an offering, and in raising oneself.","n":["Do your prescribed work; action is better than inaction.","Your own path, even imperfect, is better than imitating someone else's.","Devoted to their own work, people reach perfection.","Worship the source of all through your own work.","Lift yourself by your own effort."]},"hi":{"t":"जीवन का उद्देश्य कैसे खोजें?","intro":"गीता उद्देश्य को अपना काम अच्छी तरह, अर्पण भाव से करने और ख़ुद को ऊपर उठाने में बताती है।","n":["अपना नियत कर्म करो; कर्म न करने से कर्म करना बेहतर है।","अपना मार्ग, कमियों वाला भी, दूसरे की नक़ल से बेहतर है।","अपने कर्म में लगे लोग सिद्धि पाते हैं।","अपने कर्म से सबके मूल की पूजा करो।","अपने प्रयास से ख़ुद को ऊपर उठाओ।"]},"gu":{"t":"જીવનનો હેતુ કેવી રીતે શોધવો?","intro":"ગીતા હેતુને પોતાનું કામ સારી રીતે, અર્પણભાવે કરવામાં અને પોતાને ઉપર ઉઠાવવામાં બતાવે છે.","n":["તમારું નિયત કર્મ કરો; કર્મ ન કરવા કરતાં કરવું સારું.","પોતાનો માર્ગ, ખામીવાળો પણ, બીજાની નકલ કરતાં સારો.","પોતાના કર્મમાં લાગેલા લોકો સિદ્ધિ પામે છે.","પોતાના કર્મથી બધાના મૂળની પૂજા કરો.","પોતાના પ્રયત્નથી પોતાને ઉપર ઉઠાવો."]}},{"id":"duty","refs":["2.31","3.19","3.35","18.47","18.48"],"en":{"t":"How to perform duties?","intro":"Duty in the Gita is done fully, without attachment, and without waiting for perfect conditions.","n":["For a warrior there is nothing better than a righteous fight (Arjuna's context).","Do what must be done, without attachment.","Better one's own duty imperfectly than another's well.","No sin is incurred doing one's duty according to one's nature.","Do not give up natural work even if it has flaws, as fire has smoke."]},"hi":{"t":"कर्तव्य कैसे निभाएँ?","intro":"गीता में कर्तव्य पूरी तरह, आसक्ति के बिना, और आदर्श परिस्थितियों का इंतज़ार किए बिना निभाया जाता है।","n":["क्षत्रिय के लिए धर्मयुद्ध से बढ़कर कुछ नहीं (अर्जुन का संदर्भ)।","जो करना है वह आसक्ति के बिना करो।","दूसरे का धर्म अच्छे से निभाने से अपना धर्म कमी के साथ निभाना बेहतर।","स्वभाव के अनुसार कर्तव्य करने से पाप नहीं लगता।","स्वाभाविक कर्म को दोष होने पर भी मत छोड़ो, जैसे आग के साथ धुआँ होता है।"]},"gu":{"t":"ફરજ કેવી રીતે નિભાવવી?","intro":"ગીતામાં ફરજ પૂરેપૂરી, આસક્તિ વગર, અને આદર્શ સંજોગોની રાહ જોયા વગર નિભાવાય છે.","n":["ક્ષત્રિય માટે ધર્મયુદ્ધથી ચડિયાતું કંઈ નથી (અર્જુનનો સંદર્ભ).","જે કરવાનું છે તે આસક્તિ વગર કરો.","બીજાનો ધર્મ સારી રીતે નિભાવવા કરતાં પોતાનો ધર્મ ખામી સાથે નિભાવવો સારો.","સ્વભાવ પ્રમાણે ફરજ કરવાથી પાપ લાગતું નથી.","સ્વાભાવિક કર્મને દોષ હોય તોપણ ન છોડો, જેમ અગ્નિ સાથે ધુમાડો હોય છે."]}},{"id":"uncertainty","refs":["2.7","2.14","4.40","18.63","18.73"],"en":{"t":"How to deal with uncertainty?","intro":"The Gita begins in total uncertainty. It models asking for help, enduring passing states, and deciding after reflection.","n":["Arjuna admits confusion and asks for guidance.","Pleasure and pain come and go; endure them patiently.","The doubting mind finds no happiness here or beyond.","Reflect fully, then decide.","Arjuna's doubt is resolved through understanding, not orders."]},"hi":{"t":"अनिश्चितता से कैसे निपटें?","intro":"गीता पूरी अनिश्चितता से शुरू होती है। वह मदद माँगना, आते-जाते भावों को सहना, और सोच-विचार के बाद फ़ैसला लेना सिखाती है।","n":["अर्जुन उलझन स्वीकार कर मार्गदर्शन माँगते हैं।","सुख-दुःख आते-जाते हैं; उन्हें धैर्य से सहो।","संशय वाले मन को न यहाँ सुख है न परलोक में।","पूरा विचार करो, फिर निर्णय लो।","अर्जुन का संशय आदेश से नहीं, समझ से दूर होता है।"]},"gu":{"t":"અનિશ્ચિતતા સાથે કેવી રીતે કામ લેવું?","intro":"ગીતા પૂરી અનિશ્ચિતતાથી શરૂ થાય છે. તે મદદ માગવી, આવતા-જતા ભાવો સહન કરવા, અને વિચાર કર્યા પછી નિર્ણય લેવો શીખવે છે.","n":["અર્જુન મૂંઝવણ સ્વીકારીને માર્ગદર્શન માગે છે.","સુખ-દુઃખ આવે-જાય છે; તેમને ધીરજથી સહન કરો.","શંકાવાળા મનને ન અહીં સુખ છે ન પરલોકમાં.","પૂરો વિચાર કરો, પછી નિર્ણય લો.","અર્જુનની શંકા હુકમથી નહીં, સમજથી દૂર થાય છે."]}},{"id":"desire","refs":["2.70","3.37","3.39","3.43","5.22"],"en":{"t":"How to control desires?","intro":"Desires are not evil in themselves, but unmanaged desire covers judgement. The Gita offers both a diagnosis and a method.","n":["Like the ocean that stays still as rivers enter it, the wise stay steady as desires come.","Desire is the enemy that covers wisdom.","Desire is an insatiable fire.","Know the self beyond the intellect, and conquer this hard-to-grasp enemy.","Pleasures from contact begin and end; the wise do not delight in them."]},"hi":{"t":"कामनाओं पर नियंत्रण कैसे करें?","intro":"कामनाएँ अपने आप में बुरी नहीं, पर बेलगाम कामना विवेक को ढक देती है। गीता निदान और उपाय दोनों देती है।","n":["जैसे नदियाँ समा जाने पर भी समुद्र शांत रहता है, वैसे ही ज्ञानी कामनाओं के आने पर स्थिर रहता है।","कामना वह शत्रु है जो ज्ञान को ढकता है।","कामना कभी न बुझने वाली आग है।","बुद्धि से परे आत्मा को जानकर इस कठिन शत्रु को जीतो।","संपर्क से मिले सुख आते-जाते हैं; ज्ञानी उनमें नहीं रमते।"]},"gu":{"t":"કામનાઓ પર નિયંત્રણ કેવી રીતે કરવું?","intro":"કામનાઓ પોતે ખરાબ નથી, પણ બેલગામ કામના વિવેકને ઢાંકી દે છે. ગીતા નિદાન અને ઉપાય બંને આપે છે.","n":["જેમ નદીઓ સમાઈ જાય છતાં સમુદ્ર શાંત રહે છે, તેમ જ્ઞાની કામનાઓ આવે ત્યારે સ્થિર રહે છે.","કામના એ શત્રુ છે જે જ્ઞાનને ઢાંકે છે.","કામના ક્યારેય ન બુઝાતી આગ છે.","બુદ્ધિથી પર આત્માને જાણીને આ અઘરા શત્રુને જીતો.","સંપર્કથી મળતાં સુખ આવે-જાય છે; જ્ઞાની તેમાં રમતો નથી."]}},{"id":"balance","refs":["2.38","2.48","2.56","6.7","12.18"],"en":{"t":"How to maintain mental balance?","intro":"Equanimity (samatvam) is the Gita's core psychological ideal.","n":["Treat pleasure and pain, gain and loss alike.","Evenness of mind is yoga.","The sage is undisturbed in sorrow and free of craving in joy.","The self-controlled stay calm in heat and cold, honour and dishonour.","The same toward friend and foe, honour and insult."]},"hi":{"t":"मानसिक संतुलन कैसे बनाए रखें?","intro":"समत्व गीता का मुख्य मनोवैज्ञानिक आदर्श है।","n":["सुख-दुःख, लाभ-हानि को समान समझो।","मन की समता ही योग है।","मुनि दुःख में विचलित नहीं होता और सुख में लालसा नहीं रखता।","संयमी सर्दी-गर्मी, मान-अपमान में शांत रहता है।","मित्र-शत्रु और मान-अपमान में एक-सा।"]},"gu":{"t":"માનસિક સંતુલન કેવી રીતે જાળવવું?","intro":"સમત્વ ગીતાનો મુખ્ય મનોવૈજ્ઞાનિક આદર્શ છે.","n":["સુખ-દુઃખ, લાભ-હાનિને સમાન ગણો.","મનની સમતા એ જ યોગ છે.","મુનિ દુઃખમાં વિચલિત થતો નથી અને સુખમાં ઝંખના રાખતો નથી.","સંયમી ઠંડી-ગરમી, માન-અપમાનમાં શાંત રહે છે.","મિત્ર-શત્રુ અને માન-અપમાનમાં એક સરખો."]}},{"id":"discipline","refs":["6.16","6.17","17.14","17.15","17.16"],"en":{"t":"How to develop discipline?","intro":"Discipline in the Gita is moderate, not extreme: right habits of body, speech and mind.","n":["Yoga is not for one who eats or sleeps too much or too little.","It is for one moderate in food, recreation, effort, sleep and waking.","Austerity of the body: cleanliness, straightforwardness, restraint, non-violence.","Austerity of speech: truthful, pleasant, helpful words; regular study.","Austerity of mind: calm, gentle, quiet, self-controlled, pure in intent."]},"hi":{"t":"अनुशासन कैसे विकसित करें?","intro":"गीता का अनुशासन संतुलित है, अतिवादी नहीं: शरीर, वाणी और मन की सही आदतें।","n":["योग उसके लिए नहीं जो बहुत ज़्यादा या बहुत कम खाता या सोता है।","यह उसके लिए है जो आहार, विहार, प्रयास, नींद और जागने में संतुलित है।","शरीर का तप: शुद्धता, सरलता, संयम, अहिंसा।","वाणी का तप: सत्य, प्रिय, हितकर वचन; नियमित स्वाध्याय।","मन का तप: प्रसन्नता, सौम्यता, मौन, आत्म-संयम, भावों की शुद्धि।"]},"gu":{"t":"શિસ્ત કેવી રીતે કેળવવી?","intro":"ગીતાની શિસ્ત સંતુલિત છે, અતિરેકી નહીં: શરીર, વાણી અને મનની સાચી ટેવો.","n":["યોગ એના માટે નથી જે બહુ વધારે કે બહુ ઓછું ખાય કે ઊંઘે.","તે એના માટે છે જે આહાર, વિહાર, પ્રયત્ન, ઊંઘ અને જાગરણમાં સંતુલિત છે.","શરીરનું તપ: શુદ્ધતા, સરળતા, સંયમ, અહિંસા.","વાણીનું તપ: સાચાં, પ્રિય, હિતકારી વચન; નિયમિત સ્વાધ્યાય.","મનનું તપ: પ્રસન્નતા, સૌમ્યતા, મૌન, આત્મસંયમ, ભાવોની શુદ્ધિ."]}},{"id":"relationships","refs":["1.28","5.18","6.9","6.32","12.13"],"en":{"t":"How to understand relationships?","intro":"The Gita starts with love for family and ends with equal regard for all beings. It asks us to keep love without letting it blind us.","n":["Arjuna's love for his family is real and moving.","See the same self in all, regardless of status.","Equal regard for well-wishers, friends, foes and the neutral.","Feel others' joy and pain as your own.","Be without hatred, friendly and compassionate to all."]},"hi":{"t":"संबंधों को कैसे समझें?","intro":"गीता परिवार के प्रेम से शुरू होती है और सब प्राणियों के प्रति समभाव पर समाप्त होती है। वह प्रेम को बनाए रखने, पर उसे अंधा न होने देने को कहती है।","n":["अर्जुन का अपने परिवार के प्रति प्रेम सच्चा और मार्मिक है।","हैसियत देखे बिना सबमें एक ही आत्मा देखो।","हितैषी, मित्र, शत्रु और उदासीन, सबके प्रति समभाव।","दूसरों के सुख-दुःख को अपना अनुभव करो।","सबके प्रति द्वेष रहित, मैत्रीपूर्ण और करुणामय रहो।"]},"gu":{"t":"સંબંધોને કેવી રીતે સમજવા?","intro":"ગીતા કુટુંબના પ્રેમથી શરૂ થાય છે અને બધા જીવો પ્રત્યેના સમભાવ પર પૂરી થાય છે. તે પ્રેમ જાળવવા, પણ તેને આંધળો ન થવા દેવા કહે છે.","n":["અર્જુનનો પોતાના કુટુંબ પ્રત્યેનો પ્રેમ સાચો અને હૃદયસ્પર્શી છે.","દરજ્જો જોયા વગર બધામાં એક જ આત્મા જુઓ.","હિતેચ્છુ, મિત્ર, શત્રુ અને તટસ્થ, બધા પ્રત્યે સમભાવ.","બીજાનાં સુખ-દુઃખને પોતાનાં અનુભવો.","બધા પ્રત્યે દ્વેષ વગરના, મૈત્રીભર્યા અને કરુણાવાન રહો."]}},{"id":"ethics","refs":["3.21","16.1","16.24","17.15","18.25"],"en":{"t":"How to make ethical decisions?","intro":"The Gita does not give a rule for every case. It gives questions: what is my role, what does it cost others, what is my motive, and what does sound guidance say?","n":["Remember others will follow your example.","Start from qualities like honesty, non-violence and compassion.","When unsure, consult reliable guidance rather than impulse.","Speak truthfully and without causing needless pain.","Before acting, weigh consequences and harm to others."]},"hi":{"t":"नैतिक निर्णय कैसे लें?","intro":"गीता हर स्थिति का नियम नहीं देती। वह प्रश्न देती है: मेरी भूमिका क्या है, दूसरों पर इसका क्या असर है, मेरा उद्देश्य क्या है, और सही मार्गदर्शन क्या कहता है?","n":["याद रखो कि दूसरे तुम्हारे उदाहरण का अनुसरण करेंगे।","ईमानदारी, अहिंसा और करुणा जैसे गुणों से शुरू करो।","संशय हो तो आवेग के बजाय विश्वसनीय मार्गदर्शन लो।","सच बोलो और बेवजह दुःख न पहुँचाओ।","कर्म से पहले परिणाम और दूसरों की हानि को तौलो।"]},"gu":{"t":"નૈતિક નિર્ણય કેવી રીતે લેવા?","intro":"ગીતા દરેક પરિસ્થિતિનો નિયમ નથી આપતી. તે પ્રશ્નો આપે છે: મારી ભૂમિકા શું છે, બીજા પર તેની શી અસર છે, મારો હેતુ શો છે, અને યોગ્ય માર્ગદર્શન શું કહે છે?","n":["યાદ રાખો કે બીજા તમારા ઉદાહરણને અનુસરશે.","પ્રામાણિકતા, અહિંસા અને કરુણા જેવા ગુણોથી શરૂ કરો.","શંકા હોય તો આવેગને બદલે વિશ્વસનીય માર્ગદર્શન લો.","સાચું બોલો અને વગર કારણે દુઃખ ન પહોંચાડો.","કર્મ પહેલાં પરિણામ અને બીજાને થતું નુકસાન તોલો."]}},{"id":"success","refs":["2.48","3.27","12.18","16.4","18.17"],"en":{"t":"How to handle success without arrogance?","intro":"Success is a test as much as failure. The Gita's remedy is remembering that many forces produce results, and that pride is a demonic quality.","n":["Stay even in success too.","The deluded ego thinks 'I am the doer', though nature does the work.","Same in honour and dishonour.","Arrogance and pride are among demonic qualities.","One free of the sense of 'I did it' is not bound by action."]},"hi":{"t":"सफलता में अहंकार से कैसे बचें?","intro":"सफलता भी असफलता जितनी ही परीक्षा है। गीता का उपाय है याद रखना कि परिणाम कई शक्तियों से बनते हैं, और घमंड आसुरी गुण है।","n":["सफलता में भी समान रहो।","मोहित अहंकार सोचता है 'मैं कर्ता हूँ', जबकि काम प्रकृति करती है।","मान-अपमान में एक-सा।","दंभ और घमंड आसुरी गुणों में हैं।","जिसमें 'मैंने किया' का भाव नहीं, वह कर्म से नहीं बँधता।"]},"gu":{"t":"સફળતામાં અહંકારથી કેવી રીતે બચવું?","intro":"સફળતા પણ નિષ્ફળતા જેટલી જ પરીક્ષા છે. ગીતાનો ઉપાય છે યાદ રાખવું કે પરિણામ ઘણી શક્તિઓથી બને છે, અને ઘમંડ આસુરી ગુણ છે.","n":["સફળતામાં પણ સમાન રહો.","મોહિત અહંકાર વિચારે છે 'હું કર્તા છું', જ્યારે કામ પ્રકૃતિ કરે છે.","માન-અપમાનમાં એક સરખા.","દંભ અને ઘમંડ આસુરી ગુણોમાં છે.","જેનામાં 'મેં કર્યું'નો ભાવ નથી, તે કર્મથી બંધાતો નથી."]}}],"questions":[{"id":"violence","refs":["2.31","2.38","11.33","18.25","16.2"],"en":{"q":"Does the Gita justify violence?","a":"The Gita is set on a battlefield, and Krishna does urge Arjuna to fight a war he considers righteous (2.31, 2.38). Some readers, historically and today, take it as a teaching about duty in a just war. Others, including Gandhi, read the battle as an allegory for inner struggle and see ahimsa (16.2, 17.14) as the deeper principle. The text also condemns action done without regard for harm to others (18.25). Both readings draw on the text; the setting itself is not allegorical in the epic."},"hi":{"q":"क्या गीता हिंसा को उचित ठहराती है?","a":"गीता युद्धभूमि पर है, और कृष्ण अर्जुन को उस युद्ध में लड़ने को कहते हैं जिसे वे धर्मयुद्ध मानते हैं (2.31, 2.38)। कुछ पाठक, इतिहास में और आज भी, इसे न्यायपूर्ण युद्ध में कर्तव्य का उपदेश मानते हैं। गांधी जी सहित अन्य लोग युद्ध को भीतरी संघर्ष का रूपक मानते हैं और अहिंसा (16.2, 17.14) को गहरा सिद्धांत। पाठ दूसरों की हानि की परवाह किए बिना किए गए कर्म की निंदा भी करता है (18.25)। दोनों पाठ गीता पर आधारित हैं; महाकाव्य में यह युद्ध स्वयं रूपक नहीं है।"},"gu":{"q":"શું ગીતા હિંસાને યોગ્ય ઠેરવે છે?","a":"ગીતા યુદ્ધભૂમિ પર છે, અને કૃષ્ણ અર્જુનને એ યુદ્ધમાં લડવા કહે છે જેને તેઓ ધર્મયુદ્ધ માને છે (2.31, 2.38). કેટલાક વાચકો, ઇતિહાસમાં અને આજે પણ, તેને ન્યાયી યુદ્ધમાં ફરજનો ઉપદેશ માને છે. ગાંધીજી સહિત બીજા લોકો યુદ્ધને અંદરના સંઘર્ષનું રૂપક માને છે અને અહિંસા (16.2, 17.14)ને ઊંડો સિદ્ધાંત. લખાણ બીજાના નુકસાનની પરવા કર્યા વગરના કર્મની નિંદા પણ કરે છે (18.25). બંને અર્થઘટન ગીતા પર આધારિત છે; મહાકાવ્યમાં આ યુદ્ધ પોતે રૂપક નથી."}},{"id":"caste","refs":["4.13","5.18","9.32","18.41"],"en":{"q":"Does the Gita support caste by birth?","a":"4.13 and 18.41 say the four varnas are divided by guna (qualities) and karma (actions). Whether this means birth or nature is disputed. Traditional commentators often assumed birth-based varna. Many modern interpreters, such as Vivekananda, Gandhi, Aurobindo and others, read it as aptitude and work. Critics such as B. R. Ambedkar argued the Gita was used to defend the caste order. 5.18 and 9.32 speak of equal vision and open access to the highest goal. Readers should weigh all of these."},"hi":{"q":"क्या गीता जन्म से जाति का समर्थन करती है?","a":"4.13 और 18.41 कहते हैं कि चार वर्ण गुण और कर्म के अनुसार बँटे हैं। इसका अर्थ जन्म है या स्वभाव, इस पर विवाद है। पारंपरिक टीकाकार अक्सर जन्म आधारित वर्ण मानते थे। विवेकानंद, गांधी जी, अरविंद आदि कई आधुनिक व्याख्याकार इसे योग्यता और कर्म मानते हैं। डॉ. बी. आर. आंबेडकर जैसे आलोचकों ने कहा कि गीता का उपयोग जाति व्यवस्था के बचाव में हुआ। 5.18 और 9.32 समदृष्टि और परम लक्ष्य तक सबकी पहुँच की बात करते हैं। पाठक इन सबको तौलें।"},"gu":{"q":"શું ગીતા જન્મથી જાતિનું સમર્થન કરે છે?","a":"4.13 અને 18.41 કહે છે કે ચાર વર્ણ ગુણ અને કર્મ પ્રમાણે વહેંચાયા છે. તેનો અર્થ જન્મ છે કે સ્વભાવ, તે વિશે વિવાદ છે. પરંપરાગત ટીકાકારો ઘણી વાર જન્મ આધારિત વર્ણ માનતા. વિવેકાનંદ, ગાંધીજી, અરવિંદ વગેરે ઘણા આધુનિક અર્થઘટનકારો તેને યોગ્યતા અને કર્મ માને છે. ડૉ. બી. આર. આંબેડકર જેવા ટીકાકારોએ કહ્યું કે ગીતાનો ઉપયોગ જાતિ વ્યવસ્થાના બચાવમાં થયો. 5.18 અને 9.32 સમદૃષ્ટિ અને પરમ લક્ષ્ય સુધી બધાની પહોંચની વાત કરે છે. વાચકો આ બધું તોલે."}},{"id":"free-will","refs":["3.27","11.33","18.61","18.63"],"en":{"q":"Do we have free will in the Gita?","a":"Some verses stress that nature (prakriti) does all actions (3.27) and that God moves all beings (18.61). Others stress choice: 'reflect, then do as you wish' (18.63), and 'lift yourself by yourself' (6.5). Commentators reconcile these differently. A common reading is that we cannot control outcomes or the forces in us, but we can choose our attitude, effort and identification."},"hi":{"q":"क्या गीता में स्वतंत्र इच्छा है?","a":"कुछ श्लोक कहते हैं कि सब कर्म प्रकृति करती है (3.27) और ईश्वर सब प्राणियों को चलाते हैं (18.61)। दूसरे चुनाव पर ज़ोर देते हैं: 'विचार करो, फिर जैसा चाहो करो' (18.63), और 'अपना उद्धार स्वयं करो' (6.5)। टीकाकार इन्हें अलग-अलग ढंग से मिलाते हैं। एक आम व्याख्या है कि हम परिणाम या अपने भीतर की शक्तियों को नियंत्रित नहीं कर सकते, पर अपना दृष्टिकोण, प्रयास और किससे ख़ुद को जोड़ें, यह चुन सकते हैं।"},"gu":{"q":"શું ગીતામાં સ્વતંત્ર ઇચ્છા છે?","a":"કેટલાક શ્લોક કહે છે કે બધાં કર્મ પ્રકૃતિ કરે છે (3.27) અને ઈશ્વર બધા જીવોને ચલાવે છે (18.61). બીજા પસંદગી પર ભાર મૂકે છે: 'વિચાર કરો, પછી જેમ ઇચ્છો તેમ કરો' (18.63), અને 'પોતાનો ઉદ્ધાર પોતે કરો' (6.5). ટીકાકારો આમને જુદી રીતે જોડે છે. એક સામાન્ય અર્થઘટન છે કે આપણે પરિણામ કે આપણી અંદરની શક્તિઓને નિયંત્રિત ન કરી શકીએ, પણ પોતાનો દૃષ્ટિકોણ, પ્રયત્ન અને પોતાને શાની સાથે જોડવા તે પસંદ કરી શકીએ."}},{"id":"meat-alcohol","refs":["17.10","18.25","18.35","14.8","6.32"],"en":{"q":"What does the Gita say about eating meat and drinking alcohol?","a":"No verse in the Gita names meat (mamsa) or alcohol (sura/madya). The closest verses are: 17.10, which calls stale, putrid, leftover and 'impure' (amedhyam) food tamasic; 18.25, which calls action done without regard for injury (himsa) tamasic; 18.35, which calls clinging to mada (intoxication/arrogance) tamasic; 14.8 on pramada (heedlessness); and 6.32 on feeling others' pain as one's own. Many traditions, especially Vaishnava ones, conclude vegetarianism and abstinence from these verses. Explicit prohibitions are found in other texts such as the Manusmriti and the Bhagavata Purana, not in the Gita itself."},"hi":{"q":"गीता मांस खाने और मदिरा पीने के बारे में क्या कहती है?","a":"गीता के किसी श्लोक में मांस या मदिरा (सुरा/मद्य) का नाम नहीं है। निकटतम श्लोक हैं: 17.10, जो बासी, सड़े, जूठे और 'अमेध्य' भोजन को तामसिक कहता है; 18.25, जो हिंसा की परवाह किए बिना किए कर्म को तामसिक कहता है; 18.35, जो मद को न छोड़ने वाली धृति को तामसिक कहता है; 14.8, प्रमाद पर; और 6.32, दूसरों के दुःख को अपना मानने पर। कई परंपराएँ, विशेषकर वैष्णव, इन श्लोकों से शाकाहार और इनसे परहेज़ का निष्कर्ष निकालती हैं। स्पष्ट निषेध मनुस्मृति और भागवत पुराण जैसे अन्य ग्रंथों में हैं, स्वयं गीता में नहीं।"},"gu":{"q":"ગીતા માંસ ખાવા અને દારૂ પીવા વિશે શું કહે છે?","a":"ગીતાના કોઈ શ્લોકમાં માંસ કે મદિરા (સુરા/મદ્ય)નું નામ નથી. નજીકના શ્લોકો છે: 17.10, જે વાસી, સડેલું, એંઠું અને 'અમેધ્ય' ભોજન તામસિક કહે છે; 18.25, જે હિંસાની પરવા કર્યા વગરના કર્મને તામસિક કહે છે; 18.35, જે મદને ન છોડતી ધૃતિને તામસિક કહે છે; 14.8, પ્રમાદ પર; અને 6.32, બીજાના દુઃખને પોતાનું માનવા પર. ઘણી પરંપરાઓ, ખાસ કરીને વૈષ્ણવ, આ શ્લોકોમાંથી શાકાહાર અને પરહેજનો નિષ્કર્ષ કાઢે છે. સ્પષ્ટ નિષેધ મનુસ્મૃતિ અને ભાગવત પુરાણ જેવા બીજા ગ્રંથોમાં છે, ગીતામાં પોતે નહીં."}},{"id":"one-god","refs":["7.21","9.23","10.20","18.66"],"en":{"q":"Does the Gita say other gods or paths are wrong?","a":"Krishna says those who worship other gods with faith are really worshipping him, though 'not in the prescribed way' (9.23), and that he steadies their faith (7.21). Some read this as inclusive, others as placing Krishna above all. Advaita reads all deities as forms of the one Brahman. The Gita does not discuss non-Indian religions."},"hi":{"q":"क्या गीता अन्य देवताओं या मार्गों को ग़लत कहती है?","a":"कृष्ण कहते हैं कि जो श्रद्धा से अन्य देवताओं को पूजते हैं वे वास्तव में उन्हीं को पूजते हैं, 'अविधिपूर्वक' (9.23), और वे उनकी श्रद्धा को स्थिर करते हैं (7.21)। कुछ इसे समावेशी मानते हैं, कुछ कृष्ण को सबसे ऊपर रखने वाला। अद्वैत सभी देवताओं को एक ब्रह्म के रूप मानता है। गीता भारत से बाहर के धर्मों की चर्चा नहीं करती।"},"gu":{"q":"શું ગીતા બીજા દેવો કે માર્ગોને ખોટા કહે છે?","a":"કૃષ્ણ કહે છે કે જે શ્રદ્ધાથી બીજા દેવોને પૂજે છે તે ખરેખર તેમને જ પૂજે છે, 'અવિધિપૂર્વક' (9.23), અને તેઓ તેમની શ્રદ્ધાને સ્થિર કરે છે (7.21). કેટલાક તેને સમાવેશી માને છે, કેટલાક કૃષ્ણને સૌથી ઉપર મૂકનાર. અદ્વૈત બધા દેવોને એક બ્રહ્મનાં રૂપ માને છે. ગીતા ભારત બહારના ધર્મોની ચર્ચા કરતી નથી."}},{"id":"family","refs":["1.31","3.20","12.16","18.73"],"en":{"q":"Does the Gita ask us to detach from family?","a":"Not in the sense of abandoning them. Krishna asks Arjuna to act rightly even when it is painful to his family, and praises detachment from results and possessiveness, not from love or responsibility. Krishna also points to public welfare (lokasangraha, 3.20) as a reason to act. Reading it as permission to neglect family takes the text out of context."},"hi":{"q":"क्या गीता परिवार से विरक्त होने को कहती है?","a":"उन्हें छोड़ देने के अर्थ में नहीं। कृष्ण अर्जुन से कहते हैं कि परिवार के लिए कष्टदायक होने पर भी सही कर्म करें, और फल और ममत्व से अनासक्ति की प्रशंसा करते हैं, प्रेम या ज़िम्मेदारी से नहीं। कृष्ण लोकसंग्रह (3.20) को भी कर्म का कारण बताते हैं। इसे परिवार की उपेक्षा की अनुमति मानना पाठ को संदर्भ से बाहर ले जाना है।"},"gu":{"q":"શું ગીતા કુટુંબથી વિરક્ત થવાનું કહે છે?","a":"તેમને છોડી દેવાના અર્થમાં નહીં. કૃષ્ણ અર્જુનને કહે છે કે કુટુંબ માટે દુઃખદાયક હોય તોપણ સાચું કર્મ કરો, અને ફળ અને મમત્વથી અનાસક્તિની પ્રશંસા કરે છે, પ્રેમ કે જવાબદારીથી નહીં. કૃષ્ણ લોકસંગ્રહ (3.20)ને પણ કર્મનું કારણ ગણાવે છે. તેને કુટુંબની ઉપેક્ષાની પરવાનગી માનવી એ લખાણને સંદર્ભની બહાર લઈ જવું છે."}}],"expKeys":["1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", "1.9", "1.10", "1.11", "1.12", "1.13", "1.14", "1.15", "1.16", "1.17", "1.18", "1.19", "1.20", "1.21", "1.22", "1.23", "1.24", "1.25", "1.26", "1.27", "1.28", "1.29", "1.30", "1.31", "1.32", "1.33", "1.34", "1.35", "1.36", "1.37", "1.38", "1.39", "1.40", "1.41", "1.42", "1.43", "1.44", "1.45", "1.46", "1.47", "2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8", "2.9", "2.10", "2.11", "2.12", "2.13", "2.14", "2.15", "2.16", "2.17", "2.18", "2.19", "2.20", "2.21", "2.22", "2.23", "2.24", "2.25", "2.26", "2.27", "2.28", "2.29", "2.30", "2.31", "2.32", "2.33", "2.34", "2.35", "2.36", "2.37", "2.38", "2.39", "2.40", "2.41", "2.42", "2.43", "2.44", "2.45", "2.46", "2.47", "2.48", "2.49", "2.50", "2.51", "2.52", "2.53", "2.54", "2.55", "2.56", "2.57", "2.58", "2.59", "2.60", "2.61", "2.62", "2.63", "2.64", "2.65", "2.66", "2.67", "2.68", "2.69", "2.70", "2.71", "2.72", "3.1", "3.2", "3.3", "3.4", "3.5", "3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.16", "3.17", "3.18", "3.19", "3.20", "3.21", "3.22", "3.23", "3.24", "3.25", "3.26", "3.27", "3.28", "3.29", "3.30", "3.31", "3.32", "3.33", "3.34", "3.35", "3.36", "3.37", "3.38", "3.39", "3.40", "3.41", "3.42", "3.43", "4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "4.8", "4.9", "4.10", "4.11", "4.12", "4.13", "4.14", "4.15", "4.16", "4.17", "4.18", "4.19", "4.20", "4.21", "4.22", "4.23", "4.24", "4.25", "4.26", "4.27", "4.28", "4.29", "4.30", "4.31", "4.32", "4.33", "4.34", "4.35", "4.36", "4.37", "4.38", "4.39", "4.40", "4.41", "4.42", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "5.7", "5.8", "5.9", "5.10", "5 en:["Gita Pathshala is an independent learning site. It does not represent any sect, organisation or guru.","Sanskrit text: the 701-verse Devanagari text from the open Bhagavad Gita dataset (github.com/gita/gita, released into the public domain). This edition includes Arjuna's opening question in Chapter 13, so Chapter 13 has 35 verses and its later verse numbers are one higher than in 700-verse editions.","Transliteration: generated in IAST from the Devanagari text. A Gujarati-script reading aid is generated the same way.","Published translations: English by Swami Sivananda; Hindi by Swami Ramsukhdas (Gita Press tradition). Both are shown with attribution and kept separate from our own explanations.","Explanations, lessons, glossary, themes and quizzes were written for this site with AI assistance (Claude) and checked against the verse text. The Hindi and Gujarati explanations are written to read naturally, not machine-translated line by line, but they have not yet had independent human scholarly review. Treat them as study material, and check important points against a teacher or a recognised commentary.","On-demand 'AI explanations' and 'Ask the Gita' answers are generated live and are clearly labelled. They are grounded in the verses shown but can still contain mistakes.","Where traditions disagree (Advaita, Vishishtadvaita, Dvaita and modern readers), the site describes each view rather than choosing one.","Progress, bookmarks and notes are stored only in your browser."],
hi:["गीता पाठशाला एक स्वतंत्र अध्ययन साइट है। यह किसी संप्रदाय, संस्था या गुरु का प्रतिनिधित्व नहीं करती।","संस्कृत पाठ: खुले भगवद्गीता डेटासेट (github.com/gita/gita, सार्वजनिक डोमेन) का 701 श्लोकों वाला देवनागरी पाठ। इस संस्करण में अध्याय 13 में अर्जुन का आरंभिक प्रश्न शामिल है, इसलिए अध्याय 13 में 35 श्लोक हैं और आगे के क्रमांक 700 वाले संस्करणों से एक ज़्यादा हैं।","लिप्यंतरण: देवनागरी पाठ से IAST में बनाया गया। गुजराती लिपि वाला पठन सहायक भी इसी तरह बनाया गया है।","प्रकाशित अनुवाद: अंग्रेज़ी में स्वामी शिवानंद; हिंदी में स्वामी रामसुखदास (गीता प्रेस परंपरा)। दोनों नाम सहित दिखाए गए हैं और हमारी व्याख्याओं से अलग रखे गए हैं।","व्याख्याएँ, पाठ, शब्दकोश, विषय और प्रश्नोत्तरी इस साइट के लिए AI (Claude) की सहायता से लिखे गए और श्लोक के पाठ से मिलाए गए। हिंदी और गुजराती व्याख्याएँ स्वाभाविक भाषा में लिखी गई हैं, पंक्ति-दर-पंक्ति मशीनी अनुवाद नहीं, पर अभी उनकी स्वतंत्र विद्वत समीक्षा नहीं हुई है। इन्हें अध्ययन सामग्री मानें, और महत्त्वपूर्ण बातें किसी गुरु या मान्य टीका से जाँचें।","माँगने पर बनने वाली 'AI व्याख्या' और 'गीता से पूछें' के उत्तर उसी समय बनते हैं और स्पष्ट रूप से चिह्नित हैं। वे दिखाए गए श्लोकों पर आधारित हैं पर उनमें ग़लती हो सकती है।","जहाँ परंपराओं में मतभेद है (अद्वैत, विशिष्टाद्वैत, द्वैत और आधुनिक पाठक), साइट हर मत बताती है, किसी एक को नहीं चुनती।","प्रगति, बुकमार्क और नोट्स केवल आपके ब्राउज़र में रहते हैं।"],
gu:["ગીતા પાઠશાળા એક સ્વતંત્ર અભ્યાસ સાઇટ છે. તે કોઈ સંપ્રદાય, સંસ્થા કે ગુરુનું પ્રતિનિધિત્વ કરતી નથી.","સંસ્કૃત લખાણ: ખુલ્લા ભગવદ્ગીતા ડેટાસેટ (github.com/gita/gita, સાર્વજનિક ડોમેન)નું 701 શ્લોકવાળું દેવનાગરી લખાણ. આ આવૃત્તિમાં અધ્યાય 13માં અર્જુનનો પ્રારંભિક પ્રશ્ન સામેલ છે, એટલે અધ્યાય 13માં 35 શ્લોક છે અને પછીના ક્રમાંક 700 વાળી આવૃત્તિઓ કરતાં એક વધારે છે.","લિપ્યંતરણ: દેવનાગરી લખાણમાંથી IASTમાં બનાવેલું. ગુજરાતી લિપિનું વાંચન સહાયક પણ આ જ રીતે બનાવ્યું છે.","પ્રકાશિત અનુવાદ: અંગ્રેજીમાં સ્વામી શિવાનંદ; હિંદીમાં સ્વામી રામસુખદાસ (ગીતા પ્રેસ પરંપરા). બંને નામ સાથે બતાવ્યા છે અને અમારી સમજૂતીઓથી અલગ રાખ્યા છે. ગુજરાતી પ્રકાશિત અનુવાદ હજુ ઉમેરાયો નથી.","સમજૂતીઓ, પાઠ, શબ્દકોશ, વિષયો અને પ્રશ્નોત્તરી આ સાઇટ માટે AI (Claude)ની મદદથી લખાયાં અને શ્લોકના લખાણ સાથે સરખાવાયાં. હિંદી અને ગુજરાતી સમજૂતીઓ સ્વાભાવિક ભાષામાં લખાઈ છે, લીટીએ લીટીએ મશીની અનુવાદ નહીં, પણ હજુ તેમની સ્વતંત્ર વિદ્વત સમીક્ષા થઈ નથી. તેમને અભ્યાસ સામગ્રી ગણો, અને મહત્ત્વની વાતો કોઈ ગુરુ કે માન્ય ટીકા સાથે તપાસો.","માગવાથી બનતી 'AI સમજૂતી' અને 'ગીતાને પૂછો'ના જવાબો એ જ સમયે બને છે અને સ્પષ્ટ રીતે ચિહ્નિત છે. તે બતાવેલા શ્લોકો પર આધારિત છે પણ તેમાં ભૂલ હોઈ શકે.","જ્યાં પરંપરાઓમાં મતભેદ છે (અદ્વૈત, વિશિષ્ટાદ્વૈત, દ્વૈત અને આધુનિક વાચકો), સાઇટ દરેક મત બતાવે છે, કોઈ એક પસંદ કરતી નથી.","પ્રગતિ, બુકમાર્ક અને નોંધો ફક્ત તમારા બ્રાઉઝરમાં રહે છે."]

<script>(function(){
"use strict";
const VERSES=JSON.parse(document.getElementById('VDATA').textContent);
const C=JSON.parse(document.getElementById('CDATA').textContent);
const VMAP={};VERSES.forEach((v,i)=>{v.k=v.c+'.'+v.v;v.i=i;VMAP[v.k]=v;});
const CH=C.chapters, GL={};C.glossary.forEach(g=>GL[g.id]=g);
const TH={};C.themes.forEach(t=>TH[t.id]=t);
const EXPSET=new Set(C.expKeys);
const EXPKEYS=C.expKeys.slice().sort((a,b)=>VMAP[a].i-VMAP[b].i);
const EXP={};               /* filled per chapter from exp/chN.json */
const COMM={};              /* filled per chapter from comm/chN.json */

/* ---------- storage (per-viewer convenience; wrapped) ---------- */
const KEY='gita-pathshala-v1';
let S={lang:'en',done:{},bm:{},notes:{},last:null,quiz:{},ai:{},read:false,gs:true,days:{},autoAI:false};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
S.days=S.days||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

let L=S.lang||'en';
const t=()=>UI[L];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=o=>o?(o[L]||o.en):null;
const linkRefs=s=>esc(s).replace(/(^|[^\d.])(\d{1,2})\.(\d{1,2})(?![\d]|\.\d)/g,(m,p,c,v)=>VMAP[c+'.'+v]?`${p}<a href="#v-${c}-${v}">${c}.${v}</a>`:m);
const chName=c=>pick(c).title;
function setLang(l){L=LANGS.includes(l)?l:'en';S.lang=L;save();document.documentElement.lang=L;document.getElementById('langSel').value=L;}

/* ---------- data loading ---------- */
const loading={};
function loadJSON(path){return fetch(path).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});}
function loadExp(c){
  if(!loading['e'+c])loading['e'+c]=loadJSON('exp/ch'+c+'.json').then(d=>{Object.assign(EXP,d);}).catch(()=>{delete loading['e'+c];});
  return loading['e'+c];
}
function loadComm(c){
  if(!loading['c'+c])loading['c'+c]=loadJSON('comm/ch'+c+'.json').then(d=>{Object.assign(COMM,d);}).catch(()=>{delete loading['c'+c];});
  return loading['c'+c];
}
const expOf=k=>EXP[k]?Object.assign({w:EXP[k].w},pick(EXP[k])):null;

/* ---------- art: peacock feather + bansuri (generated SVG) ---------- */
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function feather(id,w,h,opts){
  opts=opts||{};const r=rnd(opts.seed||7);
  /* rachis: gentle curve from bottom (shaft) to top (eye) */
  const P=(t)=>{const x=w*0.5+Math.sin(t*1.25)*w*0.12-(t*t)*w*0.05;const y=h*(0.98-t*0.92);return [x,y];};
  let barbs='';const N=opts.n||70;
  for(let i=0;i<N;i++){
    const tt=0.12+i/N*0.78;const [x,y]=P(tt);
    const prof=Math.sin(Math.PI*Math.min(1,(tt-0.08)/0.86))*0.95+0.05;
    const len=w*0.42*prof*(0.85+r()*0.3);
    for(const side of [-1,1]){
      const ang=(-0.95+side*0.0)+side*(0.55+r()*0.12);
      const ex=x+Math.sin(ang)*len*side*side*(side), ey=y-Math.cos(Math.abs(ang))*len*0.55;
      const cx=x+side*len*0.45, cy=y-len*0.05;
      const col=tt>0.7?'url(#'+id+'b2)':'url(#'+id+'b1)';
      barbs+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${(x+side*len).toFixed(1)} ${(ey).toFixed(1)}" stroke="${col}" stroke-width="${(0.7+r()*0.6).toFixed(2)}" fill="none" opacity="${(0.55+r()*0.4).toFixed(2)}"/>`;
    }
  }
  const [ex,ey]=P(0.86);
  const eye=`<g transform="translate(${ex.toFixed(1)} ${ey.toFixed(1)}) rotate(${opts.eyeRot||-6})">
    <ellipse rx="${w*0.30}" ry="${w*0.40}" fill="url(#${id}g1)"/>
    <ellipse rx="${w*0.22}" ry="${w*0.30}" cy="${w*0.03}" fill="#2E7D4F"/>
    <ellipse rx="${w*0.165}" ry="${w*0.225}" cy="${w*0.04}" fill="#1C8C8C"/>
    <path d="M0 ${-w*0.12} C ${w*0.12} ${-w*0.12} ${w*0.13} ${w*0.07} 0 ${w*0.17} C ${-w*0.13} ${w*0.07} ${-w*0.12} ${-w*0.12} 0 ${-w*0.12}Z" fill="#1B2A6B"/>
    <ellipse rx="${w*0.04}" ry="${w*0.05}" cy="${w*0.02}" fill="#6F5320" opacity=".8"/></g>`;
  const pts=[];for(let i=0;i<=40;i++)pts.push(P(i/40*0.9).map(n=>n.toFixed(1)).join(' '));
  return `<svg class="${opts.cls||''}" viewBox="0 0 ${w} ${h}" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="${id}b1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8C7A3A"/><stop offset=".6" stop-color="#6E9A4B"/><stop offset="1" stop-color="#3E8E6E"/></linearGradient>
    <linearGradient id="${id}b2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5E9A55"/><stop offset="1" stop-color="#B9A54A"/></linearGradient>
    <radialGradient id="${id}g1"><stop offset=".55" stop-color="#C9B44E"/><stop offset=".8" stop-color="#8FA13F"/><stop offset="1" stop-color="#8FA13F" stop-opacity="0"/></radialGradient></defs>
    ${barbs}<polyline points="${pts.join(' ')}" fill="none" stroke="#C8B98A" stroke-width="${w*0.012}" stroke-linecap="round"/>${eye}</svg>`;
}
function flute(cls){
  const holes=[0.48,0.55,0.62,0.69,0.76,0.83].map(x=>`<ellipse cx="${x*600}" cy="30" rx="6" ry="4.2" fill="#3A2510"/>`).join('');
  const band=(x)=>`<rect x="${x}" y="17" width="14" height="26" rx="2" fill="#8E2B2B"/><rect x="${x+3}" y="17" width="2" height="26" fill="#D7B55A"/><rect x="${x+9}" y="17" width="2" height="26" fill="#D7B55A"/>`;
  return `<svg class="${cls||''}" viewBox="0 0 640 90" aria-hidden="true" focusable="false"><defs>
   <linearGradient id="bam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7C27A"/><stop offset=".45" stop-color="#C8923F"/><stop offset="1" stop-color="#8A5A22"/></linearGradient></defs>
   <rect x="20" y="18" width="580" height="24" rx="12" fill="url(#bam)"/>
   <rect x="20" y="20" width="580" height="5" rx="2.5" fill="#F4DDA6" opacity=".55"/>
   <ellipse cx="96" cy="30" rx="7" ry="5" fill="#3A2510"/>${holes}${band(40)}${band(150)}${band(560)}
   <path d="M600 34 C 612 50 606 62 616 76" stroke="#8E2B2B" stroke-width="2" fill="none"/><path d="M600 34 C 620 46 622 58 630 70" stroke="#D7B55A" stroke-width="1.6" fill="none"/>
   <circle cx="617" cy="78" r="5" fill="#8E2B2B"/><circle cx="630" cy="72" r="4" fill="#D7B55A"/></svg>`;
}
const FEATHER_SM=()=>feather('fs'+Math.random().toString(36).slice(2,6),60,150,{n:34,cls:'orn-f',seed:11});
function divider(){return `<div class="divider" aria-hidden="true"><span></span>${FEATHER_SM()}<span></span></div>`;}

/* ---------- bansuri sound (WebAudio, starts only on click) ---------- */
let AC=null,playing=null;
function playFlute(btn){
  try{
    if(playing){playing.stop();return;}
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const ctx=AC,now=ctx.currentTime+0.05;
    const master=ctx.createGain();master.gain.value=0.22;master.connect(ctx.destination);
    const osc=ctx.createOscillator();osc.type='sine';
    const osc2=ctx.createOscillator();osc2.type='triangle';
    const g2=ctx.createGain();g2.gain.value=0.12;osc2.connect(g2);
    const vib=ctx.createOscillator();vib.frequency.value=5.2;const vg=ctx.createGain();vg.gain.value=4;vib.connect(vg);vg.connect(osc.frequency);vg.connect(osc2.frequency);
    const amp=ctx.createGain();amp.gain.value=0;osc.connect(amp);g2.connect(amp);amp.connect(master);
    /* breath noise */
    const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const noise=ctx.createBufferSource();noise.buffer=nb;noise.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;const ng=ctx.createGain();ng.gain.value=0;noise.connect(bp);bp.connect(ng);ng.connect(master);
    /* raga Bhupali phrase: Sa Re Ga Pa Dha Sa' ... (Sa = G4) */
    const sa=392,ratio={S:1,R:9/8,G:5/4,P:3/2,D:5/3,S2:2},seq=[['S',.6],['R',.45],['G',.9],['P',.45],['D',.6],['S2',1.2],['D',.45],['P',.45],['G',.9],['R',.45],['G',.45],['R',.45],['S',1.6]];
    let tm=now;osc.frequency.setValueAtTime(sa,tm);osc2.frequency.setValueAtTime(sa*2,tm);
    seq.forEach(([n,d],i)=>{const f=sa*ratio[n];
      osc.frequency.setTargetAtTime(f,tm,0.035);osc2.frequency.setTargetAtTime(f*2,tm,0.035);bp.frequency.setValueAtTime(f*2.2,tm);
      amp.gain.setTargetAtTime(i===0?0.9:0.8,tm,0.06);ng.gain.setTargetAtTime(0.05,tm,0.05);
      amp.gain.setTargetAtTime(0.62,tm+d*0.6,0.12);tm+=d;});
    amp.gain.setTargetAtTime(0,tm,0.25);ng.gain.setTargetAtTime(0,tm,0.2);
    [osc,osc2,vib,noise].forEach(n=>n.start(now));
    const end=tm+1.2;const all=[osc,osc2,vib,noise];
    const finish=()=>{try{all.forEach(n=>n.stop());}catch(e){}playing=null;document.querySelectorAll('[data-flute]').forEach(b=>{b.classList.remove('on');b.querySelector('span').textContent=t().flute;});document.body.classList.remove('fluting');};
    const timer=setTimeout(finish,(end-ctx.currentTime)*1000);
    playing={stop:()=>{clearTimeout(timer);amp.gain.setTargetAtTime(0,ctx.currentTime,0.05);ng.gain.setTargetAtTime(0,ctx.currentTime,0.05);setTimeout(finish,200);}};
    document.querySelectorAll('[data-flute]').forEach(b=>{b.classList.add('on');b.querySelector('span').textContent=t().fluteStop;});
    document.body.classList.add('fluting');
  }catch(e){}
}

/* ---------- listen (speech synthesis, optional) ---------- */
const canSpeak=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
function speak(text,btn){
  try{
    if(speechSynthesis.speaking){speechSynthesis.cancel();btn.querySelector('span').textContent=t().listen;return;}
    const u=new SpeechSynthesisUtterance(text.replace(/[।॥]/g,', '));u.lang='hi-IN';u.rate=0.82;
    const vs=speechSynthesis.getVoices();const hv=vs.find(v=>/hi[-_]IN/i.test(v.lang))||vs.find(v=>/^hi/i.test(v.lang));if(hv)u.voice=hv;
    u.onend=()=>{btn.querySelector('span').textContent=t().listen;};
    btn.querySelector('span').textContent=t().stopListen;speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- nav ---------- */
const NAV=[['home','home'],['start','start'],['story','story'],['chapters','chapters'],['themes','themes'],['glossary','glossary'],['ask','ask'],['navRevise','revise'],['dash','dashboard'],['about','about']];
function renderChrome(route){
  document.getElementById('brandName').textContent=t().brand;
  const base=route.split('-')[0];
  const map={ch:'chapters',v:'chapters',g:'glossary',t:'themes',questions:'themes'};
  const cur=map[base]||route;
  document.getElementById('nav').innerHTML=NAV.map(([k,r])=>`<a href="#${r}"${cur===r?' aria-current="page"':''}>${esc(t().nav[k]||t()[k])}</a>`).join('');
  document.getElementById('readBtn').title=t().reading;
  document.getElementById('searchBtn').title=t().search;
  document.getElementById('foot').innerHTML=`<div class="footart">${flute('foot-flute')}</div><div class="row" style="justify-content:space-between"><span>${esc(t().brand)} · ${esc(t().sources)}: <a href="https://github.com/gita/gita" target="_blank" rel="noopener">gita/gita</a> · ${esc(t().trBy.en)} (EN) · ${esc(t().trBy.hi)} (HI)</span><a href="#about">${esc(t().nav.about)}</a></div>`;
}

/* ---------- progress helpers ---------- */
const doneCount=()=>Object.keys(S.done).length;
const chDone=n=>VERSES.filter(v=>v.c===n&&S.done[v.k]).length;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(S.days[k]){n++;d.setDate(d.getDate()-1);}else break;}return n;}
function ringSVG(){
  const total=VERSES.length,cx=160,cy=160,R=118,w=26,gap=0.012;let a0=-Math.PI/2,out='';
  CH.forEach(c=>{
    const frac=c.count/total, a1=a0+frac*Math.PI*2, s=a0+gap, e=a1-gap;
    const arc=(r,x0,x1)=>{const p=(a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [sx,sy]=p(x0),[ex,ey]=p(x1);return `M${sx.toFixed(2)} ${sy.toFixed(2)} A${r} ${r} 0 ${(x1-x0)>Math.PI?1:0} 1 ${ex.toFixed(2)} ${ey.toFixed(2)}`;};
    const d=chDone(c.n)/c.count, fe=s+(e-s)*d;
    const mid=(s+e)/2, lx=cx+(R+w/2+12)*Math.cos(mid), ly=cy+(R+w/2+12)*Math.sin(mid);
    out+=`<a href="#ch-${c.n}" class="ring-seg"><title>${esc(t().chapter)} ${c.n}: ${esc(chName(c))} · ${chDone(c.n)}/${c.count}</title>`+
      `<path class="bg" d="${arc(R,s,e)}" stroke="var(--line)" stroke-width="${w}" fill="none"/>`+
      (d>0?`<path d="${arc(R,s,Math.max(s+0.001,fe))}" stroke="var(--peacock)" stroke-width="${w}" fill="none"/>`:'')+
      `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="Hind,sans-serif" fill="var(--muted)">${c.n}</text></a>`;
    a0=a1;
  });
  const dc=doneCount();
  out+=`<text x="${cx}" y="${cy-8}" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="40" font-weight="600" fill="var(--ink)">${dc}</text>`+
    `<text x="${cx}" y="${cy+20}" text-anchor="middle" font-family="Hind,sans-serif" font-size="12" fill="var(--muted)">${esc(t().ofLbl==='of'?'of '+total:total+' '+t().ofLbl)}</text>`+
    `<text x="${cx}" y="${cy+38}" text-anchor="middle" font-family="Hind,sans-serif" font-size="12" fill="var(--muted)">${esc(t().progressLbl)}</text>`;
  return `<svg class="ring" viewBox="0 0 320 320" role="img" aria-label="${esc(t().progressLbl)}: ${dc}/${total}">${out}</svg>`;
}
function journeySVG(){
  /* winding path through 18 chapter stops */
  const W=900,H=260,pts=[];
  for(let i=0;i<18;i++){const x=40+i*(W-80)/17;const y=H/2+Math.sin(i*0.85)*80;pts.push([x,y]);}
  let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<18;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const mx=(x0+x1)/2;d+=` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`;}
  const nodes=pts.map(([x,y],i)=>{const c=CH[i],f=chDone(c.n)/c.count;return `<a href="#ch-${c.n}" class="jn"><title>${c.n}. ${esc(chName(c))} · ${chDone(c.n)}/${c.count}</title>
    <circle cx="${x}" cy="${y}" r="17" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <circle cx="${x}" cy="${y}" r="17" fill="none" stroke="var(--peacock)" stroke-width="3" stroke-dasharray="${(f*106.8).toFixed(1)} 106.8" transform="rotate(-90 ${x} ${y})"/>
    ${f>=1?`<circle cx="${x}" cy="${y}" r="9" fill="var(--peacock)"/><circle cx="${x}" cy="${y}" r="5" fill="var(--eye)"/>`:''}
    <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" font-family="Hind,sans-serif" fill="${f>=1?'#fff':'var(--ink)'}">${f>=1?'':c.n}</text></a>`;}).join('');
  return `<div class="journey"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t().journey)}"><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>${nodes}</svg></div>`;
}
function verseChip(k,extra){const v=VMAP[k];return `<a class="chip" href="#v-${v.c}-${v.v}">${extra||''}${k}</a>`;}

/* ---------- search ---------- */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let IDX=null;
function buildIndex(){IDX=VERSES.map(v=>({k:v.k,txt:norm(v.tr+' '+v.en)+' '+v.hi+' '+v.sa+' '+v.gs}));}
function situThemes(q){const lq=q.toLowerCase();return SITU.filter(([id,ws])=>ws.some(w=>lq.includes(w.toLowerCase()))).map(([id])=>id);}
function doSearch(q){
  q=q.trim();if(!q)return null;if(!IDX)buildIndex();
  const out={verses:[],gloss:[],themes:[],chapters:[]};
  const m=q.match(/^(?:bg\s*)?(\d{1,2})[.:\s-](\d{1,2})$/i);
  if(m&&VMAP[m[1]+'.'+m[2]])out.verses.push(m[1]+'.'+m[2]);
  const toks=norm(q).split(/[\s,?!.।]+/).filter(w=>w.length>1);
  if(toks.length){
    const sc=IDX.map(x=>({k:x.k,s:toks.reduce((a,w)=>a+(x.txt.includes(w)?1:0),0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||VMAP[a.k].i-VMAP[b.k].i);
    sc.slice(0,40).forEach(x=>{if(!out.verses.includes(x.k))out.verses.push(x.k);});
    C.glossary.forEach(g=>{const hay=norm(LANGS.map(l=>g[l].name+' '+g[l].def).join(' ')+' '+g.id+' '+g.sa);if(toks.some(w=>hay.includes(w)))out.gloss.push(g.id);});
    C.themes.forEach(th=>{const hay=norm(LANGS.map(l=>th[l].t+' '+th[l].intro).join(' '));if(toks.some(w=>hay.includes(w)))out.themes.push(th.id);});
    CH.forEach(c=>{const hay=norm(LANGS.map(l=>c[l].title).join(' ')+' '+c.sa+' '+c.iast);if(toks.some(w=>hay.includes(w)))out.chapters.push(c.n);});
  }
  situThemes(q).forEach(id=>{if(!out.themes.includes(id))out.themes.unshift(id);});
  return out;
}

let samplePromise=null;
function getSample(){if(!samplePromise){samplePromise=(window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null);}return samplePromise;}
const LNAME={en:'English',hi:'Hindi (simple, natural Hindi in Devanagari; avoid heavy Sanskritised words)',gu:'Gujarati (simple, natural Gujarati in Gujarati script; avoid overly formal words)'};
function detectLang(s){if(/[઀-૿]/.test(s))return 'gu';if(/[ऀ-ॿ]/.test(s))return 'hi';return 'en';}
function retrieve(q){
  if(!IDX)buildIndex();
  const scores={};const add=(k,s)=>{if(VMAP[k])scores[k]=(scores[k]||0)+s;};
  situThemes(q).forEach(id=>TH[id].refs.forEach((k,i)=>add(k,6-i*0.5)));
  const toks=norm(q).split(/[\s,?!.।]+/).filter(w=>w.length>2&&!/^(what|does|how|the|should|about|and|for|why|say|krishna|gita|with|from|that|this|कृष्ण|श्रीकृष्ण|गीता|क्या|कैसे|ગીતા|કૃષ્ણ|શું|કેવી)$/.test(w));
  IDX.forEach(x=>{const s=toks.reduce((a,w)=>a+(x.txt.includes(w)?1:0),0);if(s)add(x.k,s);});
  C.glossary.forEach(g=>{const hay=norm(LANGS.map(l=>g[l].name).join(' ')+' '+g.id);if(toks.some(w=>hay.includes(w)))g.refs.forEach(k=>add(k,2));});
  return Object.keys(scores).sort((a,b)=>scores[b]-scores[a]).slice(0,10).sort((a,b)=>VMAP[a].i-VMAP[b].i);
}
function sourceBlock(keys){
  return keys.map(k=>{const v=VMAP[k],e=EXP[k];return `[BG ${k}] (speaker: ${v.sp})\nSanskrit: ${v.sa}\nTransliteration: ${v.tr}\nEnglish (Swami Sivananda): ${v.en}\nHindi (Swami Ramsukhdas): ${v.hi}`+(e?`\nSite explanation: ${e.en.deep} Context: ${e.en.ctx}`:'');}).join('\n\n');
}
function md(s){
  const lines=esc(s).split('\n');let h='',inList=false,quote=[];
  const flushQ=()=>{if(quote.length){h+=`<blockquote>${quote.join('\n')}</blockquote>`;quote=[];}};
  lines.forEach(raw=>{const l=raw.trimEnd();
    if(/^&gt;\s?/.test(l)){if(inList){h+='</ul>';inList=false;}quote.push(l.replace(/^&gt;\s?/,''));return;}
    flushQ();
    if(/^#{1,4}\s/.test(l)){if(inList){h+='</ul>';inList=false;}h+=`<h4>${l.replace(/^#{1,4}\s/,'')}</h4>`;return;}
    if(/^\s*[-*•]\s/.test(l)){if(!inList){h+='<ul>';inList=true;}h+=`<li>${l.replace(/^\s*[-*•]\s/,'')}</li>`;return;}
    if(!l.trim()){if(inList){h+='</ul>';inList=false;}return;}
    if(inList){h+='</ul>';inList=false;}h+=`<p>${l}</p>`;});
  flushQ();if(inList)h+='</ul>';
  return h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^\d.\w])(BG\s)?(\d{1,2})\.(\d{1,2})(?![\d]|\.\d)/g,(m,p,b,c,v)=>VMAP[c+'.'+v]?`${p}<a href="#v-${c}-${v}">${b||''}${c}.${v}</a>`:m);
}

RULES
1. Use the Bhagavad Gita as the primary source. Cite verses as BG chapter.verse (e.g. BG 2.47). Cite ONLY verses that appear in SOURCES below; never invent a verse, a quotation or a reference. The SOURCES use a 701-verse edition (Chapter 13 includes Arjuna's opening question).
2. For the 1–3 most relevant verses: give the reference, quote the Sanskrit exactly as given in SOURCES on lines starting with "> ", explain it in simple words, and give its context (who is speaking and why).

4. If the Gita does not directly address the question, say that plainly first, then give the closest relevant verses. If the question is beyond the Gita's scope, say so.

SOURCES
${sourceBlock(keys)}
${hist?`\nEARLIER IN THIS CONVERSATION\n${hist}\n`:''}
LEARNER'S QUESTION
${q}`;

  const cm=COMM[v.k]||{};
  const prev=VERSES[v.i-1],next=VERSES[v.i+1];
  const prompt=`You are writing a study page for one verse of the Bhagavad Gita on a neutral educational website. Do not promote any sect. Do not invent other verses or quotations; refer to other verses only by number if you are sure of them. Mark interpretations as interpretations.

VERSE BG ${v.k} (speaker: ${v.sp}; 701-verse numbering)
Sanskrit: ${v.sa}
Transliteration: ${v.tr}
English translation (Swami Sivananda): ${v.en}
Hindi translation (Swami Ramsukhdas): ${v.hi}
Previous verse BG ${prev?prev.k+': '+prev.en:'none'}
Next verse BG ${next?next.k+': '+next.en:'none'}

TRADITIONAL COMMENTARIES (original Sanskrit; base the "interp" field on these, summarised in your own words)
Shankara (Advaita): ${(cm.sh||'not available').slice(0,1400)}
Ramanuja (Vishishtadvaita): ${(cm.ra||'not available').slice(0,1200)}
Madhva (Dvaita): ${(cm.ma||'not available').slice(0,800)}

Write everything (except the Sanskrit words in "w") in ${LNAME[ln]}. Return ONLY a JSON object with these keys:
"w": array of the verse's Sanskrit words or short word groups in IAST, in order;
"wm": array of the same length with the simple meaning of each item;
"tr": a clear, simple translation;
"simple": explanation for a complete beginner (3-4 sentences);
"deep": the philosophical significance (3-4 sentences);
"ctx": what is happening, what came just before, and how it links to the surrounding verses (3-4 sentences);
"ex": array of exactly 2 short modern real-life examples;
"apply": one concrete practical action;
"mis": what the verse does NOT mean (common misreadings);
"interp": array of [school, view] pairs for the schools above ONLY where they genuinely differ; otherwise one pair saying they broadly agree;
"rq": one reflection question;
"take": one-sentence key takeaway.`;
  try{
    const r=await sample.json(prompt,{modelTier:'default'});
    if(!r||!Array.isArray(r.w)||!r.tr)throw {code:'bad'};
    r.k=v.k;r.wm=Array.isArray(r.wm)?r.wm:[];r.ex=Array.isArray(r.ex)?r.ex:[];r.interp=Array.isArray(r.interp)?r.interp:[];
    S.ai[ln+':'+v.k]=r;S.autoAI=true;save();
    if(L===ln&&location.hash.endsWith('v-'+v.c+'-'+v.v))route();
  }catch(e){
    const b=document.getElementById('aibox');
    if(b)b.innerHTML=`<p class="meta">${esc(e&&e.code==='not_granted'?u.askNo:u.aiFail)}</p><button class="btn" id="aiBtn" type="button" style="margin-top:.5rem">${esc(u.aiBtn)}</button>`;
  }finally{aiBusy=null;}
}

function vAbout(){
  const u=t();
  return `<div class="col stack" style="gap:1rem"><h1>${esc(u.aboutTitle)}</h1>${(ABOUT[L]||ABOUT.en).map(p=>`<p>${esc(p)}</p>`).join('')}
  <div class="card"><div class="eyebrow">${esc(u.status)}</div><p style="margin-top:.4rem">${esc(u.statusText(EXPKEYS.length,VERSES.length))}</p><div class="bar" style="margin-top:.8rem"><i style="width:${EXPKEYS.length/VERSES.length*100}%"></i></div></div>${progTable()}</div>`;
}
function progTable(){
  const lb={en:['Chapter','Verses','Explained','Left','Total'],hi:['अध्याय','श्लोक','व्याख्या सहित','बाकी','कुल'],gu:['અધ્યાય','શ્લોક','સમજૂતી સાથે','બાકી','કુલ']}[L]||['Chapter','Verses','Explained','Left','Total'];
  const tt={en:'Explanation progress by chapter',hi:'अध्याय के अनुसार व्याख्या की प्रगति',gu:'અધ્યાય મુજબ સમજૂતીની પ્રગતિ'}[L]||'Explanation progress by chapter';
  let T=0,X=0;
  const rows=CH.map(c=>{const n=c.count,x=EXPKEYS.filter(k=>VMAP[k].c===c.n).length;T+=n;X+=x;const left=n-x;
    return `<tr><td><a href="#ch-${c.n}">${c.n}. ${esc(chName(c))}</a></td><td>${n}</td><td>${x}</td><td style="${left?'color:var(--saffron);font-weight:600':'color:var(--ok)'}">${left?left:'✓'}</td></tr>`;}).join('');
  return `<div class="card" id="progress"><div class="eyebrow">${esc(tt)}</div><div style="overflow-x:auto;margin-top:.6rem"><table class="ptab"><thead><tr><th>${lb[0]}</th><th>${lb[1]}</th><th>${lb[2]}</th><th>${lb[3]}</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th>${lb[4]}</th><th>${T}</th><th>${X}</th><th>${T-X}</th></tr></tfoot></table></div></div>`;
}
function vNotFound(){return `<div class="col stack"><h1>404</h1><a class="btn" href="#home">${esc(t().nav.home)}</a></div>`;}

/* ---------- router ---------- */
let routeSeq=0;
async function route(){
  const seq=++routeSeq;
  let h=(location.hash||'').replace(/^#/,'');
  const lm=h.match(/^(en|hi|gu)(?:-(.*))?$/);
  if(lm){setLang(lm[1]);h=lm[2]||'home';}
  if(!h)h='home';
  let m;
  /* load explanation data needed for this view */
  const need=new Set();
  if((m=h.match(/^v-(\d{1,2})-(\d{1,2})$/)))need.add(+m[1]);
  else if(h==='home')need.add(VMAP[dailyKey()].c);
  else if((m=h.match(/^t-([a-z-]+)$/))&&TH[m[1]])TH[m[1]].refs.forEach(k=>need.add(VMAP[k].c));
  else if(h==='revise'){if(!RV.list.length)RV.list=reviseList();const k=RV.list[RV.i%RV.list.length];if(k)need.add(VMAP[k].c);}
  const pend=[...need].filter(c=>!loading['e'+c]||!EXP_LOADED[c]);
  if(pend.length){app.setAttribute('aria-busy','true');await Promise.all(pend.map(c=>loadExp(c).then(()=>{EXP_LOADED[c]=1;})));app.removeAttribute('aria-busy');}
  if(seq!==routeSeq)return;
  let html='';
  if(h==='home')html=vHome();
  else if(h==='start')html=vStart();
  else if(h==='story')html=vStory();
  else if(h==='chapters')html=vChapters();
  else if((m=h.match(/^ch-(\d{1,2})$/)))html=vChapter(+m[1]);
  else if((m=h.match(/^v-(\d{1,2})-(\d{1,2})$/)))html=vVerse(+m[1],+m[2]);
  else if(h==='themes')html=vThemes();
  else if((m=h.match(/^t-([a-z-]+)$/)))html=vTheme(m[1]);
  else if(h==='questions')html=vQuestions();
  else if(h==='glossary')html=vGlossary();
  else if((m=h.match(/^g-([a-z-]+)$/)))html=vGloss(m[1]);
  else if(h==='ask')html=vAsk();
  else if(h==='search')html=vSearch();
  else if(h==='revise')html=vRevise();
  else if(h==='dashboard')html=vDash();
  else if(h==='about')html=vAbout();
  else html=vNotFound();
  renderChrome(h);
  app.innerHTML=html;
  const titles={home:'',start:t().startTitle,story:t().storyTitle,chapters:t().nav.chapters,ask:t().askTitle,glossary:t().glossTitle,themes:t().themesTitle,dashboard:t().dashTitle,search:t().searchTitle,about:t().aboutTitle,revise:t().reviseTitle};
  let sub=titles[h];if(sub===undefined){if((m=h.match(/^v-(\d+)-(\d+)$/)))sub='BG '+m[1]+'.'+m[2];else if((m=h.match(/^ch-(\d+)$/))&&CH[m[1]-1])sub=chName(CH[m[1]-1]);}
  document.title=sub?`${sub} · ${t().brand}`:t().brand;
  if(!window.__keepScroll)window.scrollTo(0,0);window.__keepScroll=false;
  if(h==='search'){const q=document.getElementById('q');q.focus();renderResults(q.value);}
  if(h==='ask'){getSample().then(s=>{const o=document.getElementById('askOff');if(o)o.hidden=!!s;});}
  if((m=h.match(/^v-(\d{1,2})-(\d{1,2})$/))){
    const v=VMAP[m[1]+'.'+m[2]];
    if(v&&!EXP[v.k]&&!S.ai[L+':'+v.k]&&S.autoAI)aiExplain(v);
  }
}
const EXP_LOADED={};
window.addEventListener('hashchange',route);

/* ---------- events (delegated) ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-scroll]');if(!el)return;
  if(el.dataset.scroll){const tg=document.getElementById(el.dataset.scroll);if(tg)tg.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
  if(el.hasAttribute('data-flute')){playFlute(el);return;}
  const vm=location.hash.match(/v-(\d+)-(\d+)/);const v=vm&&VMAP[vm[1]+'.'+vm[2]];
  if(el.id==='doneBtn'&&v){if(S.done[v.k])delete S.done[v.k];else{S.done[v.k]=Date.now();S.days[today()]=1;}save();const u=t();el.classList.toggle('on',!!S.done[v.k]);el.setAttribute('aria-pressed',!!S.done[v.k]);el.textContent=S.done[v.k]?'✓ '+u.done:u.markDone;if(S.done[v.k])burst(el);}
  else if(el.id==='bmBtn'&&v){if(S.bm[v.k])delete S.bm[v.k];else S.bm[v.k]=Date.now();save();const u=t();el.classList.toggle('on',!!S.bm[v.k]);el.setAttribute('aria-pressed',!!S.bm[v.k]);el.textContent=S.bm[v.k]?'★ '+u.bookmarked:'☆ '+u.bookmark;}
  else if(el.id==='aiBtn'&&v){aiExplain(v);}
  else if(el.id==='listenBtn'&&v){speak(v.sa,el);}
  else if(el.id==='drawBtn'){const card=document.getElementById('drawCard');const k=VERSES[Math.floor(Math.random()*VERSES.length)];if(card){card.classList.add('spin');setTimeout(()=>{location.hash=`v-${k.c}-${k.v}`;},matchMedia('(prefers-reduced-motion: reduce)').matches?0:650);}else location.hash=`v-${k.c}-${k.v}`;}
  else if(el.id==='flash'){el.classList.toggle('flipped');}
  else if(el.id==='rvNext'){RV.i=(RV.i+1)%RV.list.length;window.__keepScroll=true;route();}
  else if(el.id==='rvPrev'){RV.i=(RV.i-1+RV.list.length)%RV.list.length;window.__keepScroll=true;route();}
  else if(el.id==='rvShuf'){RV.list.sort(()=>Math.random()-0.5);RV.i=0;window.__keepScroll=true;route();}
  else if(el.dataset.ask){const i=document.getElementById('askIn');ask(el.dataset.ask);i.value='';}
  else if(el.id==='askGo'&&el.dataset.stop){e.preventDefault();askCtl&&askCtl.abort();}
  else if(el.id==='resetBtn'){const u=t();document.getElementById('resetArea').innerHTML=`<span class="confirmbox"><span>${esc(u.resetQ)}</span><button class="btn" id="resetYes" type="button">${esc(u.confirm)}</button><button class="btn" id="resetNo" type="button">${esc(u.cancel)}</button></span>`;}
  else if(el.id==='resetYes'){S.done={};S.bm={};S.notes={};S.quiz={};S.days={};S.last=null;save();route();}
  else if(el.id==='resetNo'){route();}
  else if(el.id==='readBtn'){S.read=!S.read;save();applyRead();}
});
document.addEventListener('toggle',e=>{
  if(e.target.id==='commWrap'&&e.target.open){const vm=location.hash.match(/v-(\d+)-(\d+)/);if(!vm)return;loadComm(+vm[1]).then(()=>renderComm(vm[1]+'.'+vm[2]));}
},true);
function burst(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){const s=document.createElement('span');s.className='petal';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';
    const a=Math.random()*Math.PI*2,d=40+Math.random()*50;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d-30+'px');s.style.background=['var(--peacock)','var(--eye)','var(--gold)','var(--saffron)'][i%4];
    document.body.appendChild(s);setTimeout(()=>s.remove(),900);}
}
document.addEventListener('submit',e=>{
  if(e.target.id==='askForm'){e.preventDefault();const i=document.getElementById('askIn');if(document.getElementById('askGo').dataset.stop){askCtl&&askCtl.abort();return;}const q=i.value;i.value='';ask(q);}
  else if(e.target.classList.contains('quiz')){
    e.preventDefault();const f=e.target,n=+f.dataset.ch,q=pick(CH[n-1]).quiz;let s=0;
    q.forEach(([qq,opts,a],i)=>{const sel=f.querySelector(`input[name="q${n}_${i}"]:checked`);
      f.querySelectorAll(`input[name="q${n}_${i}"]`).forEach(inp=>{const lab=inp.closest('label');lab.classList.remove('right','wrong');if(+inp.value===a)lab.classList.add('right');else if(inp.checked)lab.classList.add('wrong');});
      if(sel&&+sel.value===a)s++;});
    S.quiz[n]=s;save();f.querySelector('.qres').textContent=t().score(s,q.length);
    if(s===q.length)burst(f.querySelector('button[type=submit]'));
  }
});
let noteTimer;
document.addEventListener('input',e=>{
  if(e.target.id==='noteBox'){const vm=location.hash.match(/v-(\d+)-(\d+)/);if(!vm)return;const k=vm[1]+'.'+vm[2];clearTimeout(noteTimer);noteTimer=setTimeout(()=>{const val=e.target.value.trim();if(val)S.notes[k]=e.target.value;else delete S.notes[k];save();const s=document.getElementById('noteSaved');if(s)s.textContent=t().saved;},400);}
  else if(e.target.id==='q'){window.__lastQ=e.target.value;renderResults(e.target.value);}
});
document.addEventListener('change',e=>{
  if(e.target.id==='langSel'){setLang(e.target.value);const h=location.hash.replace(/^#(en|hi|gu)-?/,'#');if(h!==location.hash&&h!=='#'){location.hash=h;}else route();}
  else if(e.target.id==='gsToggle'){S.gs=e.target.checked;save();window.__keepScroll=true;route();}
});
function stepVerse(d){const vm=location.hash.match(/^#v-(\d+)-(\d+)$/);if(!vm)return;const v=VMAP[vm[1]+'.'+vm[2]];const n=VERSES[v.i+d];if(n)location.hash=`v-${n.c}-${n.v}`;}
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select'))return;
  if(e.key==='ArrowRight')stepVerse(1);
  if(e.key==='ArrowLeft')stepVerse(-1);
});
let tx0=null,ty0=null;
app.addEventListener('touchstart',e=>{if(e.target.closest('textarea,input,.vgrid,.journey'))return;tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
app.addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;tx0=null;if(Math.abs(dx)>80&&Math.abs(dy)<50)stepVerse(dx<0?1:-1);},{passive:true});
function applyRead(){document.body.classList.toggle('reading',!!S.read);const b=document.getElementById('readBtn');b.setAttribute('aria-pressed',!!S.read);}

setLang(L);applyRead();route();
getSample();
})();
</script>

</body></html>
