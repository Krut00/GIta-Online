tirahaḥ śuklaḥ ṣaṇmāsā uttarāyaṇam\ntatra prayātā gacchanti brahma brahmavido janāḥ","gs":"અગ્નિર્જ્યોતિરહઃ શુક્લઃ ષણ્માસા ઉત્તરાયણમ્ ।\nતત્ર પ્રયાતા ગચ્છન્તિ બ્રહ્મ બ્રહ્મવિદો જનાઃ ॥","en":"Fire, light, daytime, the bright fortnight, the six months of the northern path of the sun (the northern solstice) departing, then men who know Brahman go to Brahman.","hi":"जिस मार्गमें प्रकाशस्वरूप अग्निका अधिपति देवता, दिनका अधिपति देवता, शुक्लपक्षका अधिपति देवता, और छः महीनोंवाले उत्तरायणका अधिपति देवता है, शरीर छोड़कर उस मार्गसे गये हुए ब्रह्मवेत्ता पुरुष (पहले ब्रह्मलोकको प्राप्त होकर पीछे ब्रह्माजीके साथ) ब्रह्मको प्राप्त हो जाते हैं।"},{"c":8,"v":25,"sp":"krishna","sa":"धूमो रात्रिस्तथा कृष्णः षण्मासा दक्षिणायनम् ।\nतत्र चान्द्रमसं ज्योतिर्योगी प्राप्य निवर्तते ॥","tr":"dhūmo rātristathā kṛṣṇaḥ ṣaṇmāsā dakṣiṇāyanam\ntatra cāndramasaṃ jyotiryogī prāpya nivartate","gs":"ધૂમો રાત્રિસ્તથા કૃષ્ણઃ ષણ્માસા દક્ષિણાયનમ્ ।\nતત્ર ચાન્દ્રમસં જ્યોતિર્યોગી પ્રાપ્ય નિવર્તતે ॥","en":"Attaining the lunar light through smoke, night time, the dark fortnight, and the six months of the southern path of the sun (the southern solstice), the yogi returns.","hi":"जिस मार्गमें धूमका अधिपति देवता, रात्रिका अधिपति देवता, कृष्णपक्षका अधिपति देवता और छः महीनोंवाले दक्षिणायनका अधिपति देवता है, शरीर छोड़कर उस मार्गसे गया हुआ योगी (सकाम मनुष्य) चन्द्रमाकी ज्योतिको प्राप्त होकर लौट आता है अर्थात् जन्म-मरणको प्राप्त होता है।"},{"c":8,"v":26,"sp":"krishna","sa":"शुक्लकृष्णे गती ह्येते जगतः शाश्वते मते ।\nएकया यात्यनावृत्तिमन्ययाऽऽवर्तते पुनः ॥","tr":"śuklakṛṣṇe gatī hyete jagataḥ śāśvate mate\nekayā yātyanāvṛttimanyayā''vartate punaḥ","gs":"શુક્લકૃષ્ણે ગતી હ્યેતે જગતઃ શાશ્વતે મતે ।\nએકયા યાત્યનાવૃત્તિમન્યયાઽઽવર્તતે પુનઃ ॥","en":"The bright and dark paths of the world are thought to be eternal; one leads to no return, and the other leads to return.","hi":"क्योंकि शुक्ल और कृष्ण -- ये दोनों गतियाँ अनादिकालसे जगत्-(प्राणिमात्र-) के साथ सम्बन्ध रखनेवाली मानी गई हैं। इनमेंसे एक गतिमें जानेवालेको लौटना नहीं पड़ता और दूसरी गतिमें जानेवालेको लौटना पड़ता है।"},{"c":8,"v":27,"sp":"krishna","sa":"नैते सृती पार्थ जानन्योगी मुह्यति कश्चन ।\nतस्मात्सर्वेषु कालेषु योगयुक्तो भवार्जुन ॥","tr":"naite sṛtī pārtha jānanyogī muhyati kaścana\ntasmātsarveṣu kāleṣu yogayukto bhavārjuna","gs":"નૈતે સૃતી પાર્થ જાનન્યોગી મુહ્યતિ કશ્ચન ।\nતસ્માત્સર્વેષુ કાલેષુ યોગયુક્તો ભવાર્જુન ॥","en":"Knowing these paths, O Arjuna, no yogi is deluded; therefore, at all times, be steadfast in yoga.","hi":"हे पृथानन्दन ! इन दोनों मार्गोंको जाननेवाला कोई भी योगी मोहित नहीं होता। अतः हे अर्जुन ! तू सब समयमें योगयुक्त हो जा।"},{"c":8,"v":28,"sp":"krishna","sa":"वेदेषु यज्ञेषु तपःसु चैव  दानेषु यत्पुण्यफलं प्रदिष्टम् ।\nअत्येति तत्सर्वमिदं विदित्वा  योगी परं स्थानमुपैति चाद्यम् ॥","tr":"vedeṣu yajñeṣu tapaḥsu caiva  dāneṣu yatpuṇyaphalaṃ pradiṣṭam\natyeti tatsarvamidaṃ viditvā  yogī paraṃ sthānamupaiti cādyam","gs":"વેદેષુ યજ્ઞેષુ તપઃસુ ચૈવ  દાનેષુ યત્પુણ્યફલં પ્રદિષ્ટમ્ ।\nઅત્યેતિ તત્સર્વમિદં વિદિત્વા  યોગી પરં સ્થાનમુપૈતિ ચાદ્યમ્ ॥","en":"Whatever fruit of merit is declared (in the scriptures) to accrue from (the study of) the Vedas, (the performance of) sacrifices, (the practice of) austerities, and gifts, beyond all this goes the Yogi, having known this; and he attains to the Supreme, Primeval (first or ancient) Abode.","hi":"योगी इसको (शुक्ल और कृष्णमार्गके रहस्यको) जानकर वेदोंमें, यज्ञोंमें, तपोंमें तथा दानमें जो-जो पुण्यफल कहे गये हैं, उन सभी पुण्यफलोंका अतिक्रमण कर जाता है और आदिस्थान परमात्माको प्राप्त हो जाता है।"},{"c":9,"v":1,"sp":"krishna","sa":"इदं तु ते गुह्यतमं प्रवक्ष्याम्यनसूयवे ।\nज्ञानं विज्ञानसहितं यज्ज्ञात्वा मोक्ष्यसेऽशुभात् ॥","tr":"idaṃ tu te guhyatamaṃ pravakṣyāmyanasūyave\njñānaṃ vijñānasahitaṃ yajjñātvā mokṣyase'śubhāt","gs":"ઇદં તુ તે ગુહ્યતમં પ્રવક્ષ્યામ્યનસૂયવે ।\nજ્ઞાનં વિજ્ઞાનસહિતં યજ્જ્ઞાત્વા મોક્ષ્યસેઽશુભાત્ ॥","en":"The Blessed Lord said, \"I shall now declare to thee, who does not cavil, the greatest secret—the knowledge combined with experience (Self-realisation). Having known this, thou shalt be free from evil.\"","hi":"श्रीभगवान् बोले -- यह अत्यन्त गोपनीय विज्ञानसहित ज्ञान दोषदृष्टिरहित तेरे लिये तो मैं फिर अच्छी तरहसे कहूँगा, जिसको जानकर तू अशुभसे अर्थात् जन्म-मरणरूप संसारसे मुक्त हो जायगा।"},{"c":9,"v":2,"sp":"krishna","sa":"राजविद्या राजगुह्यं पवित्रमिदमुत्तमम् ।\nप्रत्यक्षावगमं धर्म्यं सुसुखं कर्तुमव्ययम् ॥","tr":"rājavidyā rājaguhyaṃ pavitramidamuttamam\npratyakṣāvagamaṃ dharmyaṃ susukhaṃ kartumavyayam","gs":"રાજવિદ્યા રાજગુહ્યં પવિત્રમિદમુત્તમમ્ ।\nપ્રત્યક્ષાવગમં ધર્મ્યં સુસુખં કર્તુમવ્યયમ્ ॥","en":"This is the royal science, the royal secret, the supreme purifier, realizable by direct intuitive knowledge, according to righteousness, very easy to perform and imperishable.","hi":"यह सम्पूर्ण विद्याओंका और सम्पूर्ण गोपनीयोंका राजा है। यह अति पवित्र तथा अतिश्रेष्ठ है और इसका फल भी प्रत्यक्ष है। यह धर्ममय है, अविनाशी है और करनेमें बहुत सुगम है अर्थात् इसको प्राप्त करना बहुत सुगम है।"},{"c":9,"v":3,"sp":"krishna","sa":"अश्रद्दधानाः पुरुषा धर्मस्यास्य परन्तप ।\nअप्राप्य मां निवर्तन्ते मृत्युसंसारवर्त्मनि ॥","tr":"aśraddadhānāḥ puruṣā dharmasyāsya parantapa\naprāpya māṃ nivartante mṛtyusaṃsāravartmani","gs":"અશ્રદ્દધાનાઃ પુરુષા ધર્મસ્યાસ્ય પરન્તપ ।\nઅપ્રાપ્ય માં નિવર્તન્તે મૃત્યુસંસારવર્ત્મનિ ॥","en":"Those who have no faith in this Dharma, O Parantapa, return to the path of this world without attaining Me.","hi":"हे परंतप! इस धर्मकी महिमापर श्रद्धा न रखनेवाले मनुष्य मेरे प्राप्त न होकर मृत्युरूप संसारके मार्गमें लौटते रहते हैं अर्थात् बार-बार जन्मते-मरते रहते हैं।"},{"c":9,"v":4,"sp":"krishna","sa":"मया ततमिदं सर्वं जगदव्यक्तमूर्तिना ।\nमत्स्थानि सर्वभूतानि न चाहं तेष्ववस्थितः ॥","tr":"mayā tatamidaṃ sarvaṃ jagadavyaktamūrtinā\nmatsthāni sarvabhūtāni na cāhaṃ teṣvavasthitaḥ","gs":"મયા તતમિદં સર્વં જગદવ્યક્તમૂર્તિના ।\nમત્સ્થાનિ સર્વભૂતાનિ ન ચાહં તેષ્વવસ્થિતઃ ॥","en":"All of this world is pervaded by Me in My unmanifest aspect; all beings exist within Me, but I do not dwell within them.","hi":"।।9.4 -- 9.5।। यह सब संसार मेरे निराकार स्वरूपसे व्याप्त है। सम्पूर्ण प्राणी मेरेमें स्थित हैं; परन्तु मैं उनमें स्थित नहीं हूँ तथा वे प्राणी भी मुझ में स्थित नहीं हैं -- मेरे इस ईश्वर-सम्बन्धी योग-(सामर्थ्य-) को देख ! सम्पूर्ण प्राणियोंको उत्पन्न करनेवाला और उनका धारण, भरण-पोषण करनेवाला मेरा स्वरूप उन प्राणियोंमें स्थित नहीं है।"},{"c":9,"v":5,"sp":"krishna","sa":"न च मत्स्थानि भूतानि पश्य मे योगमैश्वरम् ।\nभूतभृन्न च भूतस्थो ममात्मा भूतभावनः ॥","tr":"na ca matsthāni bhūtāni paśya me yogamaiśvaram\nbhūtabhṛnna ca bhūtastho mamātmā bhūtabhāvanaḥ","gs":"ન ચ મત્સ્થાનિ ભૂતાનિ પશ્ય મે યોગમૈશ્વરમ્ ।\nભૂતભૃન્ન ચ ભૂતસ્થો મમાત્મા ભૂતભાવનઃ ॥","en":"Nor do beings exist in Me (in reality); behold, My divine Yoga, which supports all beings, but does not dwell in them, is My Self, the efficient cause of beings.","hi":"।।9.4 -- 9.5।। यह सब संसार मेरे निराकार स्वरूपसे व्याप्त है। सम्पूर्ण प्राणी मुझ में स्थित हैं; परन्तु मैं उनमें स्थित नहीं हूँ तथा वे प्राणी भी मेरेमें स्थित नहीं हैं -- मेरे इस ईश्वर-सम्बन्धी योग-(सामर्थ्य-) को देख ! सम्पूर्ण प्राणियोंको उत्पन्न करनेवाला और उनका धारण, भरण-पोषण करनेवाला मेरा स्वरूप उन प्राणियोंमें स्थित नहीं है।"},{"c":9,"v":6,"sp":"krishna","sa":"यथाऽऽकाशस्थितो नित्यं वायुः सर्वत्रगो महान् ।\nतथा सर्वाणि भूतानि मत्स्थानीत्युपधारय ॥","tr":"yathā''kāśasthito nityaṃ vāyuḥ sarvatrago mahān\ntathā sarvāṇi bhūtāni matsthānītyupadhāraya","gs":"યથાઽઽકાશસ્થિતો નિત્યં વાયુઃ સર્વત્રગો મહાન્ ।\nતથા સર્વાણિ ભૂતાનિ મત્સ્થાનીત્યુપધારય ॥","en":"As the mighty wind, moving everywhere, always rests in the ether, so too, know that all beings rest in Me.","hi":"जैसे सब जगह विचरनेवाली महान् वायु नित्य ही आकाशमें स्थित रहती है, ऐसे ही सम्पूर्ण प्राणी मुझमें ही स्थित रहते हैं -- ऐसा तुम मान लो।"},{"c":9,"v":7,"sp":"krishna","sa":"सर्वभूतानि कौन्तेय प्रकृतिं यान्ति मामिकाम् ।\nकल्पक्षये पुनस्तानि कल्पादौ विसृजाम्यहम् ॥","tr":"sarvabhūtāni kaunteya prakṛtiṃ yānti māmikām\nkalpakṣaye punastāni kalpādau visṛjāmyaham","gs":"સર્વભૂતાનિ કૌન્તેય પ્રકૃતિં યાન્તિ મામિકામ્ ।\nકલ્પક્ષયે પુનસ્તાનિ કલ્પાદૌ વિસૃજામ્યહમ્ ॥","en":"All beings, O Arjuna, go into My Nature at the end of a Kalpa; I send them forth again at the beginning of the next Kalpa.","hi":"हे कुन्तीनन्दन ! कल्पोंका क्षय होनेपर सम्पूर्ण प्राणी मेरी प्रकृतिको प्राप्त होते हैं और कल्पोंके आदिमें मैं फिर उनकी रचना करता हूँ।"},{"c":9,"v":8,"sp":"krishna","sa":"प्रकृतिं स्वामवष्टभ्य विसृजामि पुनः पुनः ।\nभूतग्राममिमं कृत्स्नमवशं प्रकृतेर्वशात् ॥","tr":"prakṛtiṃ svāmavaṣṭabhya visṛjāmi punaḥ punaḥ\nbhūtagrāmamimaṃ kṛtsnamavaśaṃ prakṛtervaśāt","gs":"પ્રકૃતિં સ્વામવષ્ટભ્ય વિસૃજામિ પુનઃ પુનઃ ।\nભૂતગ્રામમિમં કૃત્સ્નમવશં પ્રકૃતેર્વશાત્ ॥","en":"Animating My Nature, I again and again send forth all this multitude of beings, helpless under the force of Nature.","hi":"प्रकृतिके वशमें होनेसे परतन्त्र हुए इस सम्पूर्ण प्राणिसमुदायको मैं (कल्पोंके आदिमें) अपनी प्रकृतिको वशमें करके बार-बार रचता हूँ।"},{"c":9,"v":9,"sp":"krishna","sa":"न च मां तानि कर्माणि निबध्नन्ति धनञ्जय ।\nउदासीनवदासीनमसक्तं तेषु कर्मसु ॥","tr":"na ca māṃ tāni karmāṇi nibadhnanti dhanañjaya\nudāsīnavadāsīnamasaktaṃ teṣu karmasu","gs":"ન ચ માં તાનિ કર્માણિ નિબધ્નન્તિ ધનઞ્જય ।\nઉદાસીનવદાસીનમસક્તં તેષુ કર્મસુ ॥","en":"These acts do not bind Me, O Arjuna, sitting as one indifferent, unattached to those acts.","hi":"हे धनञ्जय ! उन (सृष्टि-रचना आदि) कर्मोंमें अनासक्त और उदासीनकी तरह रहते हुए मेरेको वे कर्म नहीं बाँधते।"},{"c":9,"v":10,"sp":"krishna","sa":"मयाऽध्यक्षेण प्रकृतिः सूयते सचराचरम् ।\nहेतुनाऽनेन कौन्तेय जगद्विपरिवर्तते ॥","tr":"mayā'dhyakṣeṇa prakṛtiḥ sūyate sacarācaram\nhetunā'nena kaunteya jagadviparivartate","gs":"મયાઽધ્યક્ષેણ પ્રકૃતિઃ સૂયતે સચરાચરમ્ ।\nહેતુનાઽનેન કૌન્તેય જગદ્વિપરિવર્તતે ॥","en":"Under Me, as supervisor, Nature produces the moving and the unmoving; therefore, O Arjuna, the world revolves.","hi":"प्रकृति मेरी अध्यक्षतामें सम्पूर्ण चराचर जगत् को रचती है। हे कुन्तीनन्दन ! इसी हेतुसे जगत् का विविध प्रकारसे परिवर्तन होता है।"},{"c":9,"v":11,"sp":"krishna","sa":"अवजानन्ति मां मूढा मानुषीं तनुमाश्रितम् ।\nपरं भावमजानन्तो मम भूतमहेश्वरम् ॥","tr":"avajānanti māṃ mūḍhā mānuṣīṃ tanumāśritam\nparaṃ bhāvamajānanto mama bhūtamaheśvaram","gs":"અવજાનન્તિ માં મૂઢા માનુષીં તનુમાશ્રિતમ્ ।\nપરં ભાવમજાનન્તો મમ ભૂતમહેશ્વરમ્ ॥","en":"Fools disregard Me, clad in human form, not knowing My higher Being as the great Lord of all beings.","hi":"मूर्खलोग मेरे सम्पूर्ण प्राणियोंके महान् ईश्वररूप परमभावको न जानते हुए मुझे मनुष्यशरीरके आश्रित मानकर अर्थात् साधारण मनुष्य मानकर मेरी अवज्ञा करते हैं।"},{"c":9,"v":12,"sp":"krishna","sa":"मोघाशा मोघकर्माणो मोघज्ञाना विचेतसः ।\nराक्षसीमासुरीं चैव प्रकृतिं मोहिनीं श्रिताः ॥","tr":"moghāśā moghakarmāṇo moghajñānā vicetasaḥ\nrākṣasīmāsurīṃ caiva prakṛtiṃ mohinīṃ śritāḥ","gs":"મોઘાશા મોઘકર્માણો મોઘજ્ઞાના વિચેતસઃ ।\nરાક્ષસીમાસુરીં ચૈવ પ્રકૃતિં મોહિનીં શ્રિતાઃ ॥","en":"They are possessed of the deceitful nature of demons and undivine beings, filled with vain hopes, vain actions, and vain knowledge that is senseless.","hi":"जिनकी सब आशाएँ व्यर्थ होती हैं, सब शुभ-कर्म व्यर्थ होते हैं और सब ज्ञान व्यर्थ होते हैं अर्थात् जिनकी आशाएँ, कर्म और ज्ञान सत्-फल देनेवाले नहीं होते, ऐसे अविवेकी मनुष्य आसुरी, राक्षसी और मोहिनी फकृतिका आश्रय लेते हैं।"},{"c":9,"v":13,"sp":"krishna","sa":"महात्मानस्तु मां पार्थ दैवीं प्रकृतिमाश्रिताः ।\nभजन्त्यनन्यमनसो ज्ञात्वा भूतादिमव्ययम् ॥","tr":"mahātmānastu māṃ pārtha daivīṃ prakṛtimāśritāḥ\nbhajantyananyamanaso jñātvā bhūtādimavyayam","gs":"મહાત્માનસ્તુ માં પાર્થ દૈવીં પ્રકૃતિમાશ્રિતાઃ ।\nભજન્ત્યનન્યમનસો જ્ઞાત્વા ભૂતાદિમવ્યયમ્ ॥","en":"But the great souls, O Arjuna, partaking of My divine nature, worship Me with a single-minded devotion, knowing Me as the imperishable source of all beings.","hi":"परन्तु हे पृथानन्दन ! दैवी प्रकृतिके आश्रित अनन्यमनवाले महात्मालोग मुझे सम्पूर्ण प्राणियोंका आदि और अविनाशी समझकर मेरा भजन करते हैं।"},{"c":9,"v":14,"sp":"krishna","sa":"सततं कीर्तयन्तो मां यतन्तश्च दृढव्रताः ।\nनमस्यन्तश्च मां भक्त्या नित्ययुक्ता उपासते ॥","tr":"satataṃ kīrtayanto māṃ yatantaśca dṛḍhavratāḥ\nnamasyantaśca māṃ bhaktyā nityayuktā upāsate","gs":"સતતં કીર્તયન્તો માં યતન્તશ્ચ દૃઢવ્રતાઃ ।\nનમસ્યન્તશ્ચ માં ભક્ત્યા નિત્યયુક્તા ઉપાસતે ॥","en":"Always glorifying Me, striving, firm in their vows, prostrating themselves before Me, they worship Me with steadfast devotion.","hi":"नित्य- (मेरेमें) युक्त मनुष्य दृढ़व्रती होकर लगनपूर्वक साधनमें लगे हुए और भक्तिपूर्वक कीर्तन करते हुए तथा नमस्कार करते हुये निरन्तर मेरी उपासना करते हैं।"},{"c":9,"v":15,"sp":"krishna","sa":"ज्ञानयज्ञेन चाप्यन्ये यजन्तो मामुपासते ।\nएकत्वेन पृथक्त्वेन बहुधा विश्वतोमुखम् ॥","tr":"jñānayajñena cāpyanye yajanto māmupāsate\nekatvena pṛthaktvena bahudhā viśvatomukham","gs":"જ્ઞાનયજ્ઞેન ચાપ્યન્યે યજન્તો મામુપાસતે ।\nએકત્વેન પૃથક્ત્વેન બહુધા વિશ્વતોમુખમ્ ॥","en":"Others also, sacrificing with the wisdom-sacrifice, worship Me, the All-Faced, as one, distinct, and manifold.","hi":"दूसरे साधक ज्ञानयज्ञके द्वारा एकीभावसे (अभेद-भावसे) मेरा पूजन करते हुए मेरी उपासना करते हैं और दूसरे कई साधक अपनेको पृथक् मानकर चारों तरफ मुखवाले मेरे विराट्ररुपकी अर्थात् संसारको मेरा विराट्ररुप मानकर (सेव्य-सेवकभावसे) मेरी अनेक प्रकारसे उपासना करते हैं।"},{"c":9,"v":16,"sp":"krishna","sa":"अहं क्रतुरहं यज्ञः स्वधाऽहमहमौषधम् ।\nमंत्रोऽहमहमेवाज्यमहमग्निरहं हुतम् ॥","tr":"ahaṃ kraturahaṃ yajñaḥ svadhā'hamahamauṣadham\nmaṃtro'hamahamevājyamahamagnirahaṃ hutam","gs":"અહં ક્રતુરહં યજ્ઞઃ સ્વધાઽહમહમૌષધમ્ ।\nમંત્રોઽહમહમેવાજ્યમહમગ્નિરહં હુતમ્ ॥","en":"I am Kratu; I am Yajna; I am the offering to the manes; I am the medicinal herbs and all plants; I am the Mantra; I am also the ghee or melted butter; I am the fire; I am the oblation.","hi":"।।9.16 -- 9.18।। क्रतु मैं हूँ, यज्ञ मैं हूँ, स्वधा मैं हूँ, औषध मैं हूँ, मन्त्र मैं हूँ, घृत मैं हूँ, अग्नि मैं हूँ और हवनरूप क्रिया भी मैं हूँ। जाननेयोग्य पवित्र, ओंकार, ऋग्वेद, सामवेद और यजुर्वेद भी मैं ही हूँ। इस सम्पूर्ण जगत्का पिता, धाता, माता, पितामह, गति, भर्ता, प्रभु, साक्षी, निवास, आश्रय, सुहृद्, उत्पत्ति, प्रलय, स्थान, निधान तथा अविनाशी बीज भी मैं ही हूँ।"},{"c":9,"v":17,"sp":"krishna","sa":"पिताऽहमस्य जगतो माता धाता पितामहः ।\nवेद्यं पवित्रमोंकार ऋक् साम यजुरेव च ॥","tr":"pitā'hamasya jagato mātā dhātā pitāmahaḥ\nvedyaṃ pavitramoṃkāra ṛk sāma yajureva ca","gs":"પિતાઽહમસ્ય જગતો માતા ધાતા પિતામહઃ ।\nવેદ્યં પવિત્રમોંકાર ઋક્ સામ યજુરેવ ચ ॥","en":"I am the father of this world, the mother, the dispenser of the fruits of actions, and the grandfather; the one thing to be known, the purifier, the sacred monosyllable (Om), and also the Rik, Sama, and Yajur Vedas.","hi":"।।9.16 -- 9.18।। क्रतु मैं हूँ, यज्ञ मैं हूँ, स्वधा मैं हूँ, औषध मैं हूँ, मन्त्र मैं हूँ, घृत मैं हूँ, अग्नि मैं हूँ और हवनरूप क्रिया भी मैं हूँ। जाननेयोग्य पवित्र, ओंकार, ऋग्वेद, सामवेद और यजुर्वेद भी मैं ही हूँ। इस सम्पूर्ण जगत् का पिता, धाता, माता, पितामह, गति, भर्ता, प्रभु, साक्षी, निवास, आश्रय, सुहृद्, उत्पत्ति, प्रलय, स्थान, निधान तथा अविनाशी बीज भी मैं ही हूँ।"},{"c":9,"v":18,"sp":"krishna","sa":"गतिर्भर्ता प्रभुः साक्षी निवासः शरणं सुहृत् ।\nप्रभवः प्रलयः स्थानं निधानं बीजमव्ययम् ॥","tr":"gatirbhartā prabhuḥ sākṣī nivāsaḥ śaraṇaṃ suhṛt\nprabhavaḥ pralayaḥ sthānaṃ nidhānaṃ bījamavyayam","gs":"ગતિર્ભર્તા પ્રભુઃ સાક્ષી નિવાસઃ શરણં સુહૃત્ ।\nપ્રભવઃ પ્રલયઃ સ્થાનં નિધાનં બીજમવ્યયમ્ ॥","en":"I am the goal, the supporter, the Lord, the witness, the abode, the shelter, the friend, the origin, the dissolution, the foundation, the treasure-house, and the imperishable seed.","hi":"।।9.16 -- 9.18।। क्रतु मैं हूँ, यज्ञ मैं हूँ, स्वधा मैं हूँ, औषध मैं हूँ, मन्त्र मैं हूँ, घृत मैं हूँ, अग्नि मैं हूँ और हवनरूप क्रिया भी मैं हूँ। जाननेयोग्य पवित्र, ओंकार, ऋग्वेद, सामवेद और यजुर्वेद भी मैं ही हूँ। इस सम्पूर्ण जगत्का पिता, धाता, माता, पितामह, गति, भर्ता, प्रभु, साक्षी, निवास, आश्रय, सुहृद्, उत्पत्ति, प्रलय, स्थान, निधान तथा अविनाशी बीज भी मैं ही हूँ।"},{"c":9,"v":19,"sp":"krishna","sa":"तपाम्यहमहं वर्षं निगृह्णाम्युत्सृजामि च ।\nअमृतं चैव मृत्युश्च सदसच्चाहमर्जुन ॥","tr":"tapāmyahamahaṃ varṣaṃ nigṛhṇāmyutsṛjāmi ca\namṛtaṃ caiva mṛtyuśca sadasaccāhamarjuna","gs":"તપામ્યહમહં વર્ષં નિગૃહ્ણામ્યુત્સૃજામિ ચ ।\nઅમૃતં ચૈવ મૃત્યુશ્ચ સદસચ્ચાહમર્જુન ॥","en":"As the sun, I give heat; I withhold and send forth the rain; I am immortality and also death, existence and non-existence, O Arjuna.","hi":"हे अर्जुन ! (संसारके हितके लिये) मैं ही सूर्यरूपसे तपता हूँ, जलको ग्रहण करता हूँ और फिर उस जलको वर्षारूपसे बरसा देता हूँ। (और तो क्या कहूँ) अमृत और मृत्यु तथा सत् और असत् भी मैं ही हूँ।"},{"c":9,"v":20,"sp":"krishna","sa":"त्रैविद्या मां सोमपाः पूतपापा  यज्ञैरिष्ट्वा स्वर्गतिं प्रार्थयन्ते ।\nते पुण्यमासाद्य सुरेन्द्रलोक  मश्नन्ति दिव्यान्दिवि देवभोगान् ॥","tr":"traividyā māṃ somapāḥ pūtapāpā  yajñairiṣṭvā svargatiṃ prārthayante\nte puṇyamāsādya surendraloka  maśnanti divyāndivi devabhogān","gs":"ત્રૈવિદ્યા માં સોમપાઃ પૂતપાપા  યજ્ઞૈરિષ્ટ્વા સ્વર્ગતિં પ્રાર્થયન્તે ।\nતે પુણ્યમાસાદ્ય સુરેન્દ્રલોક  મશ્નન્તિ દિવ્યાન્દિવિ દેવભોગાન્ ॥","en":"The knowers of the three Vedas, the drinkers of Soma, purified of all sins, worshipping Me through sacrifices, pray for the way to heaven; they reach the holy world of the Lord of the gods and enjoy the divine pleasures of the gods in heaven.","hi":"वेदत्रयीमें कहे हुए सकाम अनुष्ठानको करनेवाले और सोमरसको पीनेवाले जो पापरहित मनुष्य यज्ञोंके द्वारा इन्द्ररूपसे मेरा पूजन करके स्वर्ग-प्राप्तिकी प्रार्थना करते हैं, वे पुण्यके फलस्वरूप इन्द्रलोकको प्राप्त करके वहाँ स्वर्गमें देवताओंके दिव्य भोगोंको भोगते हैं।"},{"c":9,"v":21,"sp":"krishna","sa":"ते तं भुक्त्वा स्वर्गलोकं विशालं  क्षीणे पुण्ये मर्त्यलोकं विशन्ति ।\nएव त्रयीधर्ममनुप्रपन्ना  गतागतं कामकामा लभन्ते ॥","tr":"te taṃ bhuktvā svargalokaṃ viśālaṃ  kṣīṇe puṇye martyalokaṃ viśanti\neva trayīdharmamanuprapannā  gatāgataṃ kāmakāmā labhante","gs":"તે તં ભુક્ત્વા સ્વર્ગલોકં વિશાલં  ક્ષીણે પુણ્યે મર્ત્યલોકં વિશન્તિ ।\nએવ ત્રયીધર્મમનુપ્રપન્ના  ગતાગતં કામકામા લભન્તે ॥","en":"They, having enjoyed the vast heaven, enter the world of mortals when their merit is exhausted; thus abiding by the injunctions of the three (Vedas) and desiring objects of desires, they attain to the state of coming and going.","hi":"वे उस विशाल स्वर्गलोकके भोगोंको भोगकर पुण्य क्षीण होनेपर मृत्युलोकमें आ जाते हैं। इस प्रकार तीनों वेदोंमें कहे हुए सकाम धर्मका आश्रय लिये हुए भोगोंकी कामना करनेवाले मनुष्य आवागमनको प्राप्त होते हैं।"},{"c":9,"v":22,"sp":"krishna","sa":"अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते ।\nतेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम् ॥","tr":"ananyāścintayanto māṃ ye janāḥ paryupāsate\nteṣāṃ nityābhiyuktānāṃ yogakṣemaṃ vahāmyaham","gs":"અનન્યાશ્ચિન્તયન્તો માં યે જનાઃ પર્યુપાસતે ।\nતેષાં નિત્યાભિયુક્તાનાં યોગક્ષેમં વહામ્યહમ્ ॥","en":"For those men who worship Me alone, thinking of no one else, for those ever-united, I secure what they have not already possessed and preserve what they already possess.","hi":"जो अनन्य भक्त मेरा चिन्तन करते हुए मेरी उपासना करते हैं, मेरेमें निरन्तर लगे हुए उन भक्तोंका योगक्षेम (अप्राप्तकी प्राप्ति और प्राप्तकी रक्षा) मैं वहन करता हूँ।"},{"c":9,"v":23,"sp":"krishna","sa":"येऽप्यन्यदेवता भक्ता यजन्ते श्रद्धयाऽन्विताः ।\nतेऽपि मामेव कौन्तेय यजन्त्यविधिपूर्वकम् ॥","tr":"ye'pyanyadevatā bhaktā yajante śraddhayā'nvitāḥ\nte'pi māmeva kaunteya yajantyavidhipūrvakam","gs":"યેઽપ્યન્યદેવતા ભક્તા યજન્તે શ્રદ્ધયાઽન્વિતાઃ ।\nતેઽપિ મામેવ કૌન્તેય યજન્ત્યવિધિપૂર્વકમ્ ॥","en":"Even those devotees who, endowed with faith, worship other gods, worship Me alone, O Arjuna, but by the wrong method.","hi":"हे कुन्तीनन्दन! जो भी भक्त (मनुष्य) श्रद्धापूर्वक अन्य देवताओंका पूजन करते हैं, वे भी करते हैं मेरा ही पूजन, पर करते है अविधिपूर्वक"},{"c":9,"v":24,"sp":"krishna","sa":"अहं हि सर्वयज्ञानां भोक्ता च प्रभुरेव च ।\nन तु मामभिजानन्ति तत्त्वेनातश्च्यवन्ति ते ॥","tr":"ahaṃ hi sarvayajñānāṃ bhoktā ca prabhureva ca\nna tu māmabhijānanti tattvenātaścyavanti te","gs":"અહં હિ સર્વયજ્ઞાનાં ભોક્તા ચ પ્રભુરેવ ચ ।\nન તુ મામભિજાનન્તિ તત્ત્વેનાતશ્ચ્યવન્તિ તે ॥","en":"For I alone am the enjoyer and Lord of all sacrifices; but they do not know Me in reality, and thus they return to this mortal world.","hi":"क्योंकि मैं ही सम्पूर्ण यज्ञोंका भोक्ता और स्वामी भी हूँ; परन्तु वे मेरेको तत्त्वसे नहीं जानते, इसीसे उनका पतन होता है।"},{"c":9,"v":25,"sp":"krishna","sa":"यान्ति देवव्रता देवान् पितृ़न्यान्ति पितृव्रताः ।\nभूतानि यान्ति भूतेज्या यान्ति मद्याजिनोऽपि माम् ॥","tr":"yānti devavratā devān pitṛ़nyānti pitṛvratāḥ\nbhūtāni yānti bhūtejyā yānti madyājino'pi mām","gs":"યાન્તિ દેવવ્રતા દેવાન્ પિતૃ़ન્યાન્તિ પિતૃવ્રતાઃ ।\nભૂતાનિ યાન્તિ ભૂતેજ્યા યાન્તિ મદ્યાજિનોઽપિ મામ્ ॥","en":"The worshippers of the gods go to them; the ancestor-worshippers go to the manes; the worshippers of the deities who preside over the elements go to them; but My devotees come to Me.","hi":"(सकामभावसे) देवताओंका पूजन करनेवाले (शरीर छोड़नेपर) देवताओंको प्राप्त होते हैं। पितरोंका पूजन करनेवाले पितरोंको प्राप्त होते हैं। भूत-प्रेतोंका पूजन करनेवाले भूत-प्रेतोंको प्राप्त होते हैं। परन्तु मेरा पूजन करनेवाले मुझे ही प्राप्त होते हैं।"},{"c":9,"v":26,"sp":"krishna","sa":"पत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति ।\nतदहं भक्त्युपहृतमश्नामि प्रयतात्मनः ॥","tr":"patraṃ puṣpaṃ phalaṃ toyaṃ yo me bhaktyā prayacchati\ntadahaṃ bhaktyupahṛtamaśnāmi prayatātmanaḥ","gs":"પત્રં પુષ્પં ફલં તોયં યો મે ભક્ત્યા પ્રયચ્છતિ ।\nતદહં ભક્ત્યુપહૃતમશ્નામિ પ્રયતાત્મનઃ ॥","en":"Whoever offers Me with devotion a leaf, a flower, a fruit, or a little water, that, so offered devotedly by the pure-minded, I accept.","hi":"जो भक्त पत्र, पुष्प, फल, जल आदि (यथासाध्य प्राप्त वस्तु) को भक्तिपूर्वक मेरे अर्पण करता है, उस मेरेमें तल्लीन हुए अन्तःकरणवाले भक्तके द्वारा भक्तिपूर्वक दिये हुए उपहार-(भेंट-) को मैं खा लेता हूँ।"},{"c":9,"v":27,"sp":"krishna","sa":"यत्करोषि यदश्नासि यज्जुहोषि ददासि यत् ।\nयत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम् ॥","tr":"yatkaroṣi yadaśnāsi yajjuhoṣi dadāsi yat\nyattapasyasi kaunteya tatkuruṣva madarpaṇam","gs":"યત્કરોષિ યદશ્નાસિ યજ્જુહોષિ દદાસિ યત્ ।\nયત્તપસ્યસિ કૌન્તેય તત્કુરુષ્વ મદર્પણમ્ ॥","en":"Whatever you do, whatever you eat, whatever you offer in sacrifice, whatever you give, whatever austerity you practice, O Arjuna, do it as an offering to Me.","hi":"हे कुन्तीपुत्र ! तू जो कुछ करता है, जो कुछ खाता है, जो कुछ यज्ञ करता है, जो कुछ दान देता है और जो कुछ तप करता है, वह सब मेरे अर्पण कर दे।"},{"c":9,"v":28,"sp":"krishna","sa":"शुभाशुभफलैरेवं मोक्ष्यसे कर्मबन्धनैः ।\nसंन्यासयोगयुक्तात्मा विमुक्तो मामुपैष्यसि ॥","tr":"śubhāśubhaphalairevaṃ mokṣyase karmabandhanaiḥ\nsaṃnyāsayogayuktātmā vimukto māmupaiṣyasi","gs":"શુભાશુભફલૈરેવં મોક્ષ્યસે કર્મબન્ધનૈઃ ।\nસંન્યાસયોગયુક્તાત્મા વિમુક્તો મામુપૈષ્યસિ ॥","en":"Thus, you shall be freed from the bonds of actions yielding good and evil fruits; with the mind steadfast in the Yoga of renunciation, and liberated, you shall come to Me.","hi":"इस प्रकार मेरे अर्पण करनेसे जिनसे कर्मबन्धन होता है, ऐसे शुभ (विहित) और अशुभ (निषिद्ध) सम्पूर्ण कर्मोंके फलोंसे तू मुक्त हो जायगा। ऐसे अपनेसहित सब कुछ मेरे अर्पण करनेवाला और सबसे मुक्त हुआ तू मेरेको प्राप्त हो जायगा।"},{"c":9,"v":29,"sp":"krishna","sa":"समोऽहं सर्वभूतेषु न मे द्वेष्योऽस्ति न प्रियः ।\nये भजन्ति तु मां भक्त्या मयि ते तेषु चाप्यहम् ॥","tr":"samo'haṃ sarvabhūteṣu na me dveṣyo'sti na priyaḥ\nye bhajanti tu māṃ bhaktyā mayi te teṣu cāpyaham","gs":"સમોઽહં સર્વભૂતેષુ ન મે દ્વેષ્યોઽસ્તિ ન પ્રિયઃ ।\nયે ભજન્તિ તુ માં ભક્ત્યા મયિ તે તેષુ ચાપ્યહમ્ ॥","en":"I am the same to all beings; there is none hateful or dear to Me; but those who worship Me with devotion are in Me, and I am also in them.","hi":"मैं सम्पूर्ण प्राणियोंमें समान हूँ। उन प्राणियोंमें न तो कोई मेरा द्वेषी है और न कोई प्रिय है। परन्तु जो भक्तिपूर्वक मेरा भजन करते हैं, वे मेरेमें हैं और मैं उनमें हूँ।"},{"c":9,"v":30,"sp":"krishna","sa":"अपि चेत्सुदुराचारो भजते मामनन्यभाक् ।\nसाधुरेव स मन्तव्यः सम्यग्व्यवसितो हि सः ॥","tr":"api cetsudurācāro bhajate māmananyabhāk\nsādhureva sa mantavyaḥ samyagvyavasito hi saḥ","gs":"અપિ ચેત્સુદુરાચારો ભજતે મામનન્યભાક્ ।\nસાધુરેવ સ મન્તવ્યઃ સમ્યગ્વ્યવસિતો હિ સઃ ॥","en":"Even if the most sinful worships Me, with devotion to no one else, he should indeed be regarded as righteous, for he has rightly resolved.","hi":"अगर कोई दुराचारी-से-दुराचारी भी अनन्यभावसे मेरा भजन करता है, तो उसको साधु ही मानना चाहिये। कारण कि उसने निश्चय बहुत अच्छी तरह कर लिया है।"},{"c":9,"v":31,"sp":"krishna","sa":"क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति ।\nकौन्तेय प्रतिजानीहि न मे भक्तः प्रणश्यति ॥","tr":"kṣipraṃ bhavati dharmātmā śaśvacchāntiṃ nigacchati\nkaunteya pratijānīhi na me bhaktaḥ praṇaśyati","gs":"ક્ષિપ્રં ભવતિ ધર્માત્મા શશ્વચ્છાન્તિં નિગચ્છતિ ।\nકૌન્તેય પ્રતિજાનીહિ ન મે ભક્તઃ પ્રણશ્યતિ ॥","en":"Soon he becomes righteous and attains eternal peace; O Arjuna, proclaim thou for certain that My devotee never perishes.","hi":"वह तत्काल (उसी क्षण) धर्मात्मा हो जाता है और निरन्तर रहनेवाली शान्तिको प्राप्त हो जाता है। हे कुन्तीनन्दन ! तुम प्रतिज्ञा करो कि मेरे भक्तका विनाश (पतन) नहीं होता।"},{"c":9,"v":32,"sp":"krishna","sa":"मां हि पार्थ व्यपाश्रित्य येऽपि स्युः पापयोनयः ।\nस्त्रियो वैश्यास्तथा शूद्रास्तेऽपि यान्ति परां गतिम् ॥","tr":"māṃ hi pārtha vyapāśritya ye'pi syuḥ pāpayonayaḥ\nstriyo vaiśyāstathā śūdrāste'pi yānti parāṃ gatim","gs":"માં હિ પાર્થ વ્યપાશ્રિત્ય યેઽપિ સ્યુઃ પાપયોનયઃ ।\nસ્ત્રિયો વૈશ્યાસ્તથા શૂદ્રાસ્તેઽપિ યાન્તિ પરાં ગતિમ્ ॥","en":"For, taking refuge in Me, they who, O Arjuna, may be of a sinful birth—women, Vaisyas, and Sudras—attain the Supreme Goal.","hi":"हे पृथानन्दन ! जो भी पापयोनिवाले हों तथा जो भी स्त्रियाँ, वैश्य और शूद्र हों, वे भी सर्वथा मेरे शरण होकर निःसन्देह परमगतिको प्राप्त हो जाते हैं।"},{"c":9,"v":33,"sp":"krishna","sa":"किं पुनर्ब्राह्मणाः पुण्या भक्ता राजर्षयस्तथा ।\nअनित्यमसुखं लोकमिमं प्राप्य भजस्व माम् ॥","tr":"kiṃ punarbrāhmaṇāḥ puṇyā bhaktā rājarṣayastathā\nanityamasukhaṃ lokamimaṃ prāpya bhajasva mām","gs":"કિં પુનર્બ્રાહ્મણાઃ પુણ્યા ભક્તા રાજર્ષયસ્તથા ।\nઅનિત્યમસુખં લોકમિમં પ્રાપ્ય ભજસ્વ મામ્ ॥","en":"How much more easily, then, do Brahmins and devoted royal saints attain the goal? Having come to this impermanent and unhappy world, do thou worship Me.","hi":"जो पवित्र आचरणवाले ब्राह्मण और ऋषिस्वरूप क्षत्रिय भगवान् के भक्त हों, वे परमगतिको प्राप्त हो जायँ, इसमें तो कहना ही क्या है। इसलिये इस अनित्य और सुखरहित शरीरको प्राप्त करके तू मेरा भजन कर।"},{"c":9,"v":34,"sp":"krishna","sa":"मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु ।\nमामेवैष्यसि युक्त्वैवमात्मानं मत्परायणः ॥","tr":"manmanā bhava madbhakto madyājī māṃ namaskuru\nmāmevaiṣyasi yuktvaivamātmānaṃ matparāyaṇaḥ","gs":"મન્મના ભવ મદ્ભક્તો મદ્યાજી માં નમસ્કુરુ ।\nમામેવૈષ્યસિ યુક્ત્વૈવમાત્માનં મત્પરાયણઃ ॥","en":"Fix your mind on Me; be devoted to Me; sacrifice to Me; bow down to Me; having thus united your whole self to Me, taking Me as the supreme goal, you will come to Me.","hi":"तू मेरा भक्त हो जा, मेरेमें मनवाला हो जा, मेरा पूजन करनेवाला हो जा और मेरेको नमस्कार कर। इस प्रकार मेरे साथ अपने-आपको लगाकर, मेरे परायण हुआ तू मेरेको ही प्राप्त होगा। ,"},{"c":10,"v":1,"sp":"krishna","sa":"भूय एव महाबाहो श्रृणु मे परमं वचः ।\nयत्तेऽहं प्रीयमाणाय वक्ष्यामि हितकाम्यया ॥","tr":"bhūya eva mahābāho śrṛṇu me paramaṃ vacaḥ\nyatte'haṃ prīyamāṇāya vakṣyāmi hitakāmyayā","gs":"ભૂય એવ મહાબાહો શ્રૃણુ મે પરમં વચઃ ।\nયત્તેઽહં પ્રીયમાણાય વક્ષ્યામિ હિતકામ્યયા ॥","en":"The Blessed Lord said, Again, O mighty-armed Arjuna, listen to my supreme word which I will declare to you, who are beloved, for your welfare.","hi":"श्रीभगवान् बोले -- हे महाबाहो अर्जुन ! मेरे परम वचनको तुम फिर भी सुनो, जिसे मैं तुम्हारे हितकी कामनासे कहूँगा; क्योंकि तुम मेरेमें अत्यन्त प्रेम रखते हो।"},{"c":10,"v":2,"sp":"krishna","sa":"न मे विदुः सुरगणाः प्रभवं न महर्षयः ।\nअहमादिर्हि देवानां महर्षीणां च सर्वशः ॥","tr":"na me viduḥ suragaṇāḥ prabhavaṃ na maharṣayaḥ\nahamādirhi devānāṃ maharṣīṇāṃ ca sarvaśaḥ","gs":"ન મે વિદુઃ સુરગણાઃ પ્રભવં ન મહર્ષયઃ ।\nઅહમાદિર્હિ દેવાનાં મહર્ષીણાં ચ સર્વશઃ ॥","en":"Neither the hosts of the gods nor the great sages know My origin; for I am the source of all the gods and the great sages in every way.","hi":"मेरे प्रकट होनेको न देवता जानते हैं और न महर्षि; क्योंकि मैं सब प्रकारसे देवताओं और महर्षियोंका आदि हूँ।"},{"c":10,"v":3,"sp":"krishna","sa":"यो मामजमनादिं च वेत्ति लोकमहेश्वरम् ।\nअसम्मूढः स मर्त्येषु सर्वपापैः प्रमुच्यते ॥","tr":"yo māmajamanādiṃ ca vetti lokamaheśvaram\nasammūḍhaḥ sa martyeṣu sarvapāpaiḥ pramucyate","gs":"યો મામજમનાદિં ચ વેત્તિ લોકમહેશ્વરમ્ ।\nઅસમ્મૂઢઃ સ મર્ત્યેષુ સર્વપાપૈઃ પ્રમુચ્યતે ॥","en":"He who knows Me as unborn and beginningless, as the great Lord of the worlds, he among mortals is undeluded and is liberated from all sins.","hi":"जो मनुष्य मुझे अजन्मा, अनादि और सम्पूर्ण लोकोंका महान् ईश्वर जानता है अर्थात् दृढ़तासे मानता है, वह मनुष्योंमें असम्मूढ़ (जानकार) है और वह सम्पूर्ण पापोंसे मुक्त हो जाता है।"},{"c":10,"v":4,"sp":"krishna","sa":"बुद्धिर्ज्ञानमसंमोहः क्षमा सत्यं दमः शमः ।\nसुखं दुःखं भवोऽभावो भयं चाभयमेव च ॥","tr":"buddhirjñānamasaṃmohaḥ kṣamā satyaṃ damaḥ śamaḥ\nsukhaṃ duḥkhaṃ bhavo'bhāvo bhayaṃ cābhayameva ca","gs":"બુદ્ધિર્જ્ઞાનમસંમોહઃ ક્ષમા સત્યં દમઃ શમઃ ।\nસુખં દુઃખં ભવોઽભાવો ભયં ચાભયમેવ ચ ॥","en":"Intellect, wisdom, non-delusion, forgiveness, truth, self-restraint, calmness, happiness, pain, existence or birth, non-existence or death, fear, and also fearlessness.","hi":"।।10.4 -- 10.5।। बुद्धि, ज्ञान, असम्मोह, क्षमा, सत्य, दम, शम, सुख, दुःख, भव, अभाव, भय, अभय, अहिंसा, समता, तुष्टि, तप, दान, यश और अपयश -- प्राणियोंके ये अनेक प्रकारके और अलग-अलग (बीस) भाव मेरेसे ही होते हैं।"},{"c":10,"v":5,"sp":"krishna","sa":"अहिंसा समता तुष्टिस्तपो दानं यशोऽयशः ।\nभवन्ति भावा भूतानां मत्त एव पृथग्विधाः ॥","tr":"ahiṃsā samatā tuṣṭistapo dānaṃ yaśo'yaśaḥ\nbhavanti bhāvā bhūtānāṃ matta eva pṛthagvidhāḥ","gs":"અહિંસા સમતા તુષ્ટિસ્તપો દાનં યશોઽયશઃ ।\nભવન્તિ ભાવા ભૂતાનાં મત્ત એવ પૃથગ્વિધાઃ ॥","en":"Non-injury, equanimity, contentment, austerity, beneficence, fame, and ill-fame—these different qualities of beings arise from Me alone.","hi":"।।10.4 -- 10.5।। बुद्धि, ज्ञान, असम्मोह, क्षमा, सत्य, दम, शम, सुख, दुःख, भव, अभाव, भय, अभय, अहिंसा, समता, तुष्टि, तप, दान, यश और अपयश -- प्राणियोंके ये अनेक प्रकारके और अलग-अलग (बीस) भाव मेरेसे ही होते हैं।"},{"c":10,"v":6,"sp":"krishna","sa":"महर्षयः सप्त पूर्वे चत्वारो मनवस्तथा ।\nमद्भावा मानसा जाता येषां लोक इमाः प्रजाः ॥","tr":"maharṣayaḥ sapta pūrve catvāro manavastathā\nmadbhāvā mānasā jātā yeṣāṃ loka imāḥ prajāḥ","gs":"મહર્ષયઃ સપ્ત પૂર્વે ચત્વારો મનવસ્તથા ।\nમદ્ભાવા માનસા જાતા યેષાં લોક ઇમાઃ પ્રજાઃ ॥","en":"The seven great sages, the ancient four, and the Manus, possessing powers like Mine (due to their minds being fixed on Me), were born from My mind; from them, these creatures have been born in this world.","hi":"सात महर्षि और उनसे भी पूर्वमें होनेवाले चार सनकादि तथा चौदह मनु -- ये सब-के-सब मेरे मनसे पैदा हुए हैं और मेरेमें भाव (श्रद्धाभक्ति) रखनेवाले हैं, जिनकी संसारमें यह सम्पूर्ण प्रजा है।"},{"c":10,"v":7,"sp":"krishna","sa":"एतां विभूतिं योगं च मम यो वेत्ति तत्त्वतः ।\nसोऽविकम्पेन योगेन युज्यते नात्र संशयः ॥","tr":"etāṃ vibhūtiṃ yogaṃ ca mama yo vetti tattvataḥ\nso'vikampena yogena yujyate nātra saṃśayaḥ","gs":"એતાં વિભૂતિં યોગં ચ મમ યો વેત્તિ તત્ત્વતઃ ।\nસોઽવિકમ્પેન યોગેન યુજ્યતે નાત્ર સંશયઃ ॥","en":"He who truly knows these manifold manifestations of My Being and this Yoga-power of Mine, becomes established in unshakable Yoga; there is no doubt about it.","hi":"जो मनुष्य मेरी इस विभूतिको और योगको तत्त्वसे जानता है अर्थात् दृढ़तापूर्वक मानता है, वह अविचल भक्तियोगसे युक्त हो जाता है; इसमें कुछ भी संशय नहीं है।"},{"c":10,"v":8,"sp":"krishna","sa":"अहं सर्वस्य प्रभवो मत्तः सर्वं प्रवर्तते ।\nइति मत्वा भजन्ते मां बुधा भावसमन्विताः ॥","tr":"ahaṃ sarvasya prabhavo mattaḥ sarvaṃ pravartate\niti matvā bhajante māṃ budhā bhāvasamanvitāḥ","gs":"અહં સર્વસ્ય પ્રભવો મત્તઃ સર્વં પ્રવર્તતે ।\nઇતિ મત્વા ભજન્તે માં બુધા ભાવસમન્વિતાઃ ॥","en":"I am the source of all; from me everything evolves; Understanding this, the wise, endowed with meditation, worship me.","hi":"मैं संसारमात्रका प्रभव (मूलकारण) हूँ, और मुझसे ही सारा संसार प्रवृत्त हो रहा है अर्थात् चेष्टा कर रहा है -- ऐसा मेरेको मानकर मेरेमें ही श्रद्धा-प्रेम रखते हुए बुद्धिमान् भक्त मेरा ही भजन करते हैं -- सब प्रकारसे मेरे ही शरण होते हैं।"},{"c":10,"v":9,"sp":"krishna","sa":"मच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम् ।\nकथयन्तश्च मां नित्यं तुष्यन्ति च रमन्ति च ॥","tr":"maccittā madgataprāṇā bodhayantaḥ parasparam\nkathayantaśca māṃ nityaṃ tuṣyanti ca ramanti ca","gs":"મચ્ચિત્તા મદ્ગતપ્રાણા બોધયન્તઃ પરસ્પરમ્ ।\nકથયન્તશ્ચ માં નિત્યં તુષ્યન્તિ ચ રમન્તિ ચ ॥","en":"With their minds and lives wholly absorbed in Me, they enlighten each other and ever speak of Me, being satisfied and delighted.","hi":"। मेरेमें चित्तवाले, मेरेमें प्राणोंको अर्पण करनेवाले भक्तजन आपसमें मेरे गुण, प्रभाव आदिको जानते हुए और उनका कथन करते हुए ही नित्य-निरन्तर सन्तुष्ट रहते हैं और मेरेमें प्रेम करते हैं।"},{"c":10,"v":10,"sp":"krishna","sa":"तेषां सततयुक्तानां भजतां प्रीतिपूर्वकम् ।\nददामि बुद्धियोगं तं येन मामुपयान्ति ते ॥","tr":"teṣāṃ satatayuktānāṃ bhajatāṃ prītipūrvakam\ndadāmi buddhiyogaṃ taṃ yena māmupayānti te","gs":"તેષાં સતતયુક્તાનાં ભજતાં પ્રીતિપૂર્વકમ્ ।\nદદામિ બુદ્ધિયોગં તં યેન મામુપયાન્તિ તે ॥","en":"To those who are ever steadfast, worshipping me with love, I give the yoga of discrimination, by which they come to me.","hi":"उन नित्य-निरन्तर मेरेमें लगे हुए और प्रेमपूर्वक मेरा भजन करनेवाले भक्तोंको मैं वह बुद्धियोग देता हूँ, जिससे उनको मेरी प्राप्ति हो जाती है।"},{"c":10,"v":11,"sp":"krishna","sa":"तेषामेवानुकम्पार्थमहमज्ञानजं तमः ।\nनाशयाम्यात्मभावस्थो ज्ञानदीपेन भास्वता ॥","tr":"teṣāmevānukampārthamahamajñānajaṃ tamaḥ\nnāśayāmyātmabhāvastho jñānadīpena bhāsvatā","gs":"તેષામેવાનુકમ્પાર્થમહમજ્ઞાનજં તમઃ ।\nનાશયામ્યાત્મભાવસ્થો જ્ઞાનદીપેન ભાસ્વતા ॥","en":"Out of mere compassion for them, I, dwelling within their selves, destroy the darkness born of ignorance with the luminous lamp of knowledge.","hi":"उन भक्तोंपर कृपा करनेके लिये ही उनके स्वरूप (होनेपन) में रहनेवाला मैं उनके अज्ञानजन्य अन्धकारको देदीप्यमान ज्ञानरूप दीपकके द्वारा सर्वथा नष्ट कर देता हूँ।"},{"c":10,"v":12,"sp":"arjuna","sa":"परं ब्रह्म परं धाम पवित्रं परमं भवान् ।\nपुरुषं शाश्वतं दिव्यमादिदेवमजं विभुम् ॥","tr":"paraṃ brahma paraṃ dhāma pavitraṃ paramaṃ bhavān\npuruṣaṃ śāśvataṃ divyamādidevamajaṃ vibhum","gs":"પરં બ્રહ્મ પરં ધામ પવિત્રં પરમં ભવાન્ ।\nપુરુષં શાશ્વતં દિવ્યમાદિદેવમજં વિભુમ્ ॥","en":"Arjuna said, \"You are the Supreme Brahman, the supreme abode, the supreme purifier, eternal, divine Person, the primeval God, unborn, and omnipresent.\"","hi":"।।10.12 -- 10.12।। अर्जुन बोले -- परम ब्रह्म, परम धाम और महान् पवित्र आप ही हैं। आप शाश्वत, दिव्य पुरुष, आदिदेव, अजन्मा और विभु (व्यापक) हैं -- ऐसा सब-के-सब ऋषि, देवर्षि नारद, असित, देवल तथा व्यास कहते हैं और स्वयं आप भी मेरे प्रति कहते हैं।"},{"c":10,"v":13,"sp":"arjuna","sa":"आहुस्त्वामृषयः सर्वे देवर्षिर्नारदस्तथा ।\nअसितो देवलो व्यासः स्वयं चैव ब्रवीषि मे ॥","tr":"āhustvāmṛṣayaḥ sarve devarṣirnāradastathā\nasito devalo vyāsaḥ svayaṃ caiva bravīṣi me","gs":"આહુસ્ત્વામૃષયઃ સર્વે દેવર્ષિર્નારદસ્તથા ।\nઅસિતો દેવલો વ્યાસઃ સ્વયં ચૈવ બ્રવીષિ મે ॥","en":"All the sages have thus declared Thee, as also the divine sage Narada; so also Asita, Devala, and Vyasa; and now Thou Thyself dost say so to me.","hi":"।।10.12 -- 10.13।। अर्जुन बोले -- परम ब्रह्म, परम धाम और महान् पवित्र आप ही हैं। आप शाश्वत, दिव्य पुरुष, आदिदेव, अजन्मा और विभु (व्यापक) हैं -- ऐसा सब-के-सब ऋषि, देवर्षि नारद, असित, देवल तथा व्यास कहते हैं और स्वयं आप भी मेरे प्रति कहते हैं।"},{"c":10,"v":14,"sp":"arjuna","sa":"सर्वमेतदृतं मन्ये यन्मां वदसि केशव ।\nन हि ते भगवन् व्यक्ितं विदुर्देवा न दानवाः ॥","tr":"sarvametadṛtaṃ manye yanmāṃ vadasi keśava\nna hi te bhagavan vyakitaṃ vidurdevā na dānavāḥ","gs":"સર્વમેતદૃતં મન્યે યન્માં વદસિ કેશવ ।\nન હિ તે ભગવન્ વ્યક્િતં વિદુર્દેવા ન દાનવાઃ ॥","en":"I believe all that You have said to me to be true, O Krishna; indeed, O blessed Lord! Neither the gods nor the demons know Your manifestation (origin).","hi":"हे केशव ! मेरेसे आप जो कुछ कह रहे हैं, यह सब मैं सत्य मानता हूँ। हे भगवन् ! आपके प्रकट होनेको न तो देवता जानते हैं और न दानव ही जानते हैं।"},{"c":10,"v":15,"sp":"arjuna","sa":"स्वयमेवात्मनाऽत्मानं वेत्थ त्वं पुरुषोत्तम ।\nभूतभावन भूतेश देवदेव जगत्पते ॥","tr":"svayamevātmanā'tmānaṃ vettha tvaṃ puruṣottama\nbhūtabhāvana bhūteśa devadeva jagatpate","gs":"સ્વયમેવાત્મનાઽત્માનં વેત્થ ત્વં પુરુષોત્તમ ।\nભૂતભાવન ભૂતેશ દેવદેવ જગત્પતે ॥","en":"Verily, Thou Thyself knowest Thyself by Thyself, O Supreme Person, O source and Lord of all beings, O God of gods, O ruler of the world!","hi":"हे भूतभावन ! हे भूतेश ! हे देवदेव ! हे जगत्पते ! हे पुरुषोत्तम ! आप स्वयं ही अपने-आपसे अपने-आपको जानते हैं।"},{"c":10,"v":16,"sp":"arjuna","sa":"वक्तुमर्हस्यशेषेण दिव्या ह्यात्मविभूतयः ।\nयाभिर्विभूतिभिर्लोकानिमांस्त्वं व्याप्य तिष्ठसि ॥","tr":"vaktumarhasyaśeṣeṇa divyā hyātmavibhūtayaḥ\nyābhirvibhūtibhirlokānimāṃstvaṃ vyāpya tiṣṭhasi","gs":"વક્તુમર્હસ્યશેષેણ દિવ્યા હ્યાત્મવિભૂતયઃ ।\nયાભિર્વિભૂતિભિર્લોકાનિમાંસ્ત્વં વ્યાપ્ય તિષ્ઠસિ ॥","en":"You should indeed tell, without reserve, of your divine glories by which you exist, pervading all these worlds. (No one else can do so.)","hi":"जिन विभूतियोंसे आप इन सम्पूर्ण लोकोंको व्याप्त करके स्थित हैं, उन सभी अपनी दिव्य विभूतियोंका सम्पूर्णतासे वर्णन करनेमें आप ही समर्थ हैं।"},{"c":10,"v":17,"sp":"arjuna","sa":"कथं विद्यामहं योगिंस्त्वां सदा परिचिन्तयन् ।\nकेषु केषु च भावेषु चिन्त्योऽसि भगवन्मया ॥","tr":"kathaṃ vidyāmahaṃ yogiṃstvāṃ sadā paricintayan\nkeṣu keṣu ca bhāveṣu cintyo'si bhagavanmayā","gs":"કથં વિદ્યામહં યોગિંસ્ત્વાં સદા પરિચિન્તયન્ ।\nકેષુ કેષુ ચ ભાવેષુ ચિન્ત્યોઽસિ ભગવન્મયા ॥","en":"How shall I, ever meditating, know you, O Yogin? In what aspects or things, O blessed Lord, should I think of you?","hi":"हे योगिन् ! हरदम साङ्गोपाङ्ग चिन्तन करता हुआ मैं आपको कैसे जानूँ ? और हे भगवन् ! किन-किन भावोंमें आप मेरे द्वारा चिन्तन किये जा सकते हैं अर्थात् किन-किन भावोंमें मैं आपका चिन्तन करूँ ?"},{"c":10,"v":18,"sp":"arjuna","sa":"विस्तरेणात्मनो योगं विभूतिं च जनार्दन ।\nभूयः कथय तृप्तिर्हि श्रृण्वतो नास्ति मेऽमृतम् ॥","tr":"vistareṇātmano yogaṃ vibhūtiṃ ca janārdana\nbhūyaḥ kathaya tṛptirhi śrṛṇvato nāsti me'mṛtam","gs":"વિસ્તરેણાત્મનો યોગં વિભૂતિં ચ જનાર્દન ।\nભૂયઃ કથય તૃપ્તિર્હિ શ્રૃણ્વતો નાસ્તિ મેઽમૃતમ્ ॥","en":"Tell me again in detail, O Krishna, of your yogic power and glory; for I am not satiated with what I have heard of your life-giving and nectar-like speech.","hi":"हे जनार्दन ! आप अपने योग (सामर्थ्य) को और विभूतियोंको विस्तारसे फिर कहिये; क्योंकि आपके अमृतमय वचन सुनते-सुनते मेरी तृप्ति नहीं हो रही है।"},{"c":10,"v":19,"sp":"krishna","sa":"हन्त ते कथयिष्यामि दिव्या ह्यात्मविभूतयः ।\nप्राधान्यतः कुरुश्रेष्ठ नास्त्यन्तो विस्तरस्य मे ॥","tr":"hanta te kathayiṣyāmi divyā hyātmavibhūtayaḥ\nprādhānyataḥ kuruśreṣṭha nāstyanto vistarasya me","gs":"હન્ત તે કથયિષ્યામિ દિવ્યા હ્યાત્મવિભૂતયઃ ।\nપ્રાધાન્યતઃ કુરુશ્રેષ્ઠ નાસ્ત્યન્તો વિસ્તરસ્ય મે ॥","en":"The Blessed Lord said, \"Very well! Now I will declare to you My divine glories in their prominence, O Arjuna; there is no end to their detailed description.\"","hi":"श्रीभगवान् बोले -- हाँ, ठीक है। मैं अपनी दिव्य विभूतियोंको तेरे लिये प्रधानतासे (संक्षेपसे) कहूँगा; क्योंकि हे कुरुश्रेष्ठ ! मेरी विभूतियोंके विस्तारका अन्त नहीं है।"},{"c":10,"v":20,"sp":"krishna","sa":"अहमात्मा गुडाकेश सर्वभूताशयस्थितः ।\nअहमादिश्च मध्यं च भूतानामन्त एव च ॥","tr":"ahamātmā guḍākeśa sarvabhūtāśayasthitaḥ\nahamādiśca madhyaṃ ca bhūtānāmanta eva ca","gs":"અહમાત્મા ગુડાકેશ સર્વભૂતાશયસ્થિતઃ ।\nઅહમાદિશ્ચ મધ્યં ચ ભૂતાનામન્ત એવ ચ ॥","en":"I am the Self, O Gudakesa, seated in the hearts of all beings; I am the beginning, the middle, and the end of all beings.","hi":"हे नींदको जीतनेवाले अर्जुन ! सम्पूर्ण प्राणियोंके आदि, मध्य तथा अन्तमें भी मैं ही हूँ और प्राणियोंके अन्तःकरणमें आत्मरूपसे भी मैं ही स्थित हूँ।"},{"c":10,"v":21,"sp":"krishna","sa":"आदित्यानामहं विष्णुर्ज्योतिषां रविरंशुमान् ।\nमरीचिर्मरुतामस्मि नक्षत्राणामहं शशी ॥","tr":"ādityānāmahaṃ viṣṇurjyotiṣāṃ raviraṃśumān\nmarīcirmarutāmasmi nakṣatrāṇāmahaṃ śaśī","gs":"આદિત્યાનામહં વિષ્ણુર્જ્યોતિષાં રવિરંશુમાન્ ।\nમરીચિર્મરુતામસ્મિ નક્ષત્રાણામહં શશી ॥","en":"Among the twelve Adityas, I am Vishnu; among luminaries, the radiant sun; among the seven or forty-nine Maruts, I am Marichi; among stars, I am the moon.","hi":"मैं अदितिके पुत्रोंमें विष्णु (वामन) और प्रकाशमान वस्तुओंमें किरणोंवाला सूर्य हूँ। मैं मरुतोंका तेज और नक्षत्रोंका अधिपति चन्द्रमा हूँ।"},{"c":10,"v":22,"sp":"krishna","sa":"वेदानां सामवेदोऽस्मि देवानामस्मि वासवः ।\nइन्द्रियाणां मनश्चास्मि भूतानामस्मि चेतना ॥","tr":"vedānāṃ sāmavedo'smi devānāmasmi vāsavaḥ\nindriyāṇāṃ manaścāsmi bhūtānāmasmi cetanā","gs":"વેદાનાં સામવેદોઽસ્મિ દેવાનામસ્મિ વાસવઃ ।\nઇન્દ્રિયાણાં મનશ્ચાસ્મિ ભૂતાનામસ્મિ ચેતના ॥","en":"Among the Vedas, I am the Sama-Veda; among the gods, I am Vasava; among the senses, I am the mind; and among living beings, I am intelligence.","hi":"मैं वेदोंमें सामवेद हूँ, देवताओंमें इन्द्र हूँ, इन्द्रियोंमें मन हूँ और प्राणियोंकी चेतना हूँ।"},{"c":10,"v":23,"sp":"krishna","sa":"रुद्राणां शङ्करश्चास्मि वित्तेशो यक्षरक्षसाम् ।\nवसूनां पावकश्चास्मि मेरुः शिखरिणामहम् ॥","tr":"rudrāṇāṃ śaṅkaraścāsmi vitteśo yakṣarakṣasām\nvasūnāṃ pāvakaścāsmi meruḥ śikhariṇāmaham","gs":"રુદ્રાણાં શઙ્કરશ્ચાસ્મિ વિત્તેશો યક્ષરક્ષસામ્ ।\nવસૂનાં પાવકશ્ચાસ્મિ મેરુઃ શિખરિણામહમ્ ॥","en":"And among the Rudras, I am Sankara; among the Yakshas and Rakshasas, the Lord of Wealth (Kubera); among the Vasus, I am Pavaka (Fire); and among the seven mountains, I am Meru.","hi":"रुद्रोंमें शंकर और यक्ष-राक्षसोंमें कुबेर मैं हूँ।वसुओंमें पावक (अग्नि) और शिखरवाले पर्वतोंमें सुमेरु मैं हूँ।"},{"c":10,"v":24,"sp":"krishna","sa":"पुरोधसां च मुख्यं मां विद्धि पार्थ बृहस्पतिम् ।\nसेनानीनामहं स्कन्दः सरसामस्मि सागरः ॥","tr":"purodhasāṃ ca mukhyaṃ māṃ viddhi pārtha bṛhaspatim\nsenānīnāmahaṃ skandaḥ sarasāmasmi sāgaraḥ","gs":"પુરોધસાં ચ મુખ્યં માં વિદ્ધિ પાર્થ બૃહસ્પતિમ્ ।\nસેનાનીનામહં સ્કન્દઃ સરસામસ્મિ સાગરઃ ॥","en":"And, among the household priests of kings, O Arjuna, know Me to be the chief, Brihaspati; among the army generals, I am Skanda; among lakes, I am the ocean.","hi":"हे पार्थ ! पुरोहितोंमें मुख्य बृहस्पतिको मेरा स्वरूप समझो। सेनापतियोंमें स्कन्द और जलाशयोंमें समुद्र मैं हूँ।"},{"c":10,"v":25,"sp":"krishna","sa":"महर्षीणां भृगुरहं गिरामस्म्येकमक्षरम् ।\nयज्ञानां जपयज्ञोऽस्मि स्थावराणां हिमालयः ॥","tr":"maharṣīṇāṃ bhṛgurahaṃ girāmasmyekamakṣaram\nyajñānāṃ japayajño'smi sthāvarāṇāṃ himālayaḥ","gs":"મહર્ષીણાં ભૃગુરહં ગિરામસ્મ્યેકમક્ષરમ્ ।\nયજ્ઞાનાં જપયજ્ઞોઽસ્મિ સ્થાવરાણાં હિમાલયઃ ॥","en":"Among the great sages, I am Bhrigu; among words, I am the one syllable (Om); among sacrifices, I am the sacrifice of silent repetition; among the immovable things, I am the Himalayas.","hi":"महर्षियोंमें भृगु और वाणियों-(शब्दों-) में एक अक्षर अर्थात् प्रणव मैं हूँ। सम्पूर्ण यज्ञोंमें जपयज्ञ और स्थिर रहनेवालोंमें हिमालय मैं हूँ।"},{"c":10,"v":26,"sp":"krishna","sa":"अश्वत्थः सर्ववृक्षाणां देवर्षीणां च नारदः ।\nगन्धर्वाणां चित्ररथः सिद्धानां कपिलो मुनिः ॥","tr":"aśvatthaḥ sarvavṛkṣāṇāṃ devarṣīṇāṃ ca nāradaḥ\ngandharvāṇāṃ citrarathaḥ siddhānāṃ kapilo muniḥ","gs":"અશ્વત્થઃ સર્વવૃક્ષાણાં દેવર્ષીણાં ચ નારદઃ ।\nગન્ધર્વાણાં ચિત્રરથઃ સિદ્ધાનાં કપિલો મુનિઃ ॥","en":"Among all the trees, I am the Peepul; among the divine sages, I am Narada; among the Gandharvas, I am Chitraratha; among the perfected, I am the sage Kapila.","hi":"सम्पूर्ण वृक्षोंमें पीपल, देवर्षियोंमें नारद, गन्धर्वोंमें चित्ररथ और सिद्धोंमें कपिल मुनि मैं हूँ।"},{"c":10,"v":27,"sp":"krishna","sa":"उच्चैःश्रवसमश्वानां विद्धि माममृतोद्भवम् ।\nऐरावतं गजेन्द्राणां नराणां च नराधिपम् ॥","tr":"uccaiḥśravasamaśvānāṃ viddhi māmamṛtodbhavam\nairāvataṃ gajendrāṇāṃ narāṇāṃ ca narādhipam","gs":"ઉચ્ચૈઃશ્રવસમશ્વાનાં વિદ્ધિ મામમૃતોદ્ભવમ્ ।\nઐરાવતં ગજેન્દ્રાણાં નરાણાં ચ નરાધિપમ્ ॥","en":"Know Me as Ucchaisravas, born of nectar, among horses; Airavata among lordly elephants; and the king among men.","hi":"घोड़ोंमें अमृतके साथ समुद्रसे प्रकट होनेवाले उच्चैःश्रवा नामक घोड़ेको, श्रेष्ठ हाथियोंमें ऐरावत नामक हाथीको और मनुष्योंमें राजाको मेरी विभूति मानो।"},{"c":10,"v":28,"sp":"krishna","sa":"आयुधानामहं वज्रं धेनूनामस्मि कामधुक् ।\nप्रजनश्चास्मि कन्दर्पः सर्पाणामस्मि वासुकिः ॥","tr":"āyudhānāmahaṃ vajraṃ dhenūnāmasmi kāmadhuk\nprajanaścāsmi kandarpaḥ sarpāṇāmasmi vāsukiḥ","gs":"આયુધાનામહં વજ્રં ધેનૂનામસ્મિ કામધુક્ ।\nપ્રજનશ્ચાસ્મિ કન્દર્પઃ સર્પાણામસ્મિ વાસુકિઃ ॥","en":"Among weapons, I am the thunderbolt; among cows, I am the wish-fulfilling cow called Kamadhenu; I am the progenitor, the god of love; among serpents, I am Vasuki.","hi":"आयुधोंमें वज्र और धेनुओंमें कामधेनु मैं हूँ। सन्तान-उत्पत्तिका हेतु कामदेव मैं हूँ और सर्पोंमें वासुकि मैं हूँ।"},{"c":10,"v":29,"sp":"krishna","sa":"अनन्तश्चास्मि नागानां वरुणो यादसामहम् ।\nपितृ़णामर्यमा चास्मि यमः संयमतामहम् ॥","tr":"anantaścāsmi nāgānāṃ varuṇo yādasāmaham\npitṛ़ṇāmaryamā cāsmi yamaḥ saṃyamatāmaham","gs":"અનન્તશ્ચાસ્મિ નાગાનાં વરુણો યાદસામહમ્ ।\nપિતૃ़ણામર્યમા ચાસ્મિ યમઃ સંયમતામહમ્ ॥","en":"I am Ananta among the Nagas; I am Varuna among water-deities; Aryaman among the Manes; I am Yama among the governors.","hi":"नागोंमें अनन्त (शेषनाग) और जल-जन्तुओंका अधिपति वरुण मैं हूँ। पितरोंमें अर्यमा और शासन करनेवालोंमें यमराज मैं हूँ।"},{"c":10,"v":30,"sp":"krishna","sa":"प्रह्लादश्चास्मि दैत्यानां कालः कलयतामहम् ।\nमृगाणां च मृगेन्द्रोऽहं वैनतेयश्च पक्षिणाम् ॥","tr":"prahlādaścāsmi daityānāṃ kālaḥ kalayatāmaham\nmṛgāṇāṃ ca mṛgendro'haṃ vainateyaśca pakṣiṇām","gs":"પ્રહ્લાદશ્ચાસ્મિ દૈત્યાનાં કાલઃ કલયતામહમ્ ।\nમૃગાણાં ચ મૃગેન્દ્રોઽહં વૈનતેયશ્ચ પક્ષિણામ્ ॥","en":"And I am Prahlada among the demons, I am Time among reckoners, I am the lion among beasts, and Vainateya (Garuda) among birds.","hi":"दैत्योंमें प्रह्लाद और गणना करनेवालोंमें काल मैं हूँ । पशुओंमें सिंह और पक्षियोंमें गरुड मैं हूँ।"},{"c":10,"v":31,"sp":"krishna","sa":"पवनः पवतामस्मि रामः शस्त्रभृतामहम् ।\nझषाणां मकरश्चास्मि स्रोतसामस्मि जाह्नवी ॥","tr":"pavanaḥ pavatāmasmi rāmaḥ śastrabhṛtāmaham\njhaṣāṇāṃ makaraścāsmi srotasāmasmi jāhnavī","gs":"પવનઃ પવતામસ્મિ રામઃ શસ્ત્રભૃતામહમ્ ।\nઝષાણાં મકરશ્ચાસ્મિ સ્રોતસામસ્મિ જાહ્નવી ॥","en":"Among the purifiers, I am the wind; among the warriors, I am Rama; among the fishes, I am the shark; among the streams, I am the Ganga.","hi":"पवित्र करनेवालोंमें वायु और शास्त्रधारियोंमें राम मैं हूँ। जल-जन्तुओंमें मगर मैं हूँ। बहनेवाले स्त्रोतोंमें गङ्गाजी मैं हूँ।"},{"c":10,"v":32,"sp":"krishna","sa":"सर्गाणामादिरन्तश्च मध्यं चैवाहमर्जुन ।\nअध्यात्मविद्या विद्यानां वादः प्रवदतामहम् ॥","tr":"sargāṇāmādirantaśca madhyaṃ caivāhamarjuna\nadhyātmavidyā vidyānāṃ vādaḥ pravadatāmaham","gs":"સર્ગાણામાદિરન્તશ્ચ મધ્યં ચૈવાહમર્જુન ।\nઅધ્યાત્મવિદ્યા વિદ્યાનાં વાદઃ પ્રવદતામહમ્ ॥","en":"Among creations I am the beginning, the middle, and the end, O Arjuna; among the sciences, I am the science of the Self; and I am the logic among controversialists.","hi":"हे अर्जुन ! सम्पूर्ण सर्गोंके आदि, मध्य तथा अन्तमें मैं ही हूँ। विद्याओंमें अध्यात्मविद्या और परस्पर शास्त्रार्थ करनेवालोंका(तत्त्व-निर्णयके लिये किया जानेवाला) वाद मैं हूँ।"},{"c":10,"v":33,"sp":"krishna","sa":"अक्षराणामकारोऽस्मि द्वन्द्वः सामासिकस्य च ।\nअहमेवाक्षयः कालो धाताऽहं विश्वतोमुखः ॥","tr":"akṣarāṇāmakāro'smi dvandvaḥ sāmāsikasya ca\nahamevākṣayaḥ kālo dhātā'haṃ viśvatomukhaḥ","gs":"અક્ષરાણામકારોઽસ્મિ દ્વન્દ્વઃ સામાસિકસ્ય ચ ।\nઅહમેવાક્ષયઃ કાલો ધાતાઽહં વિશ્વતોમુખઃ ॥","en":"Among the letters of the alphabet, I am the letter 'A' and the dual among compounds. I am verily the inexhaustible and everlasting time; I am the dispenser of the fruits of actions, having faces in all directions.","hi":"अक्षरोंमें अकार और समासोंमें द्वन्द्व समास मैं हूँ। अक्षयकाल अर्थात् कालका भी महाकाल तथा सब ओर मुखवाला धाता भी मैं हूँ।"},{"c":10,"v":34,"sp":"krishna","sa":"मृत्युः सर्वहरश्चाहमुद्भवश्च भविष्यताम् ।\nकीर्तिः श्रीर्वाक्च नारीणां स्मृतिर्मेधा धृतिः क्षमा ॥","tr":"mṛtyuḥ sarvaharaścāhamudbhavaśca bhaviṣyatām\nkīrtiḥ śrīrvākca nārīṇāṃ smṛtirmedhā dhṛtiḥ kṣamā","gs":"મૃત્યુઃ સર્વહરશ્ચાહમુદ્ભવશ્ચ ભવિષ્યતામ્ ।\nકીર્તિઃ શ્રીર્વાક્ચ નારીણાં સ્મૃતિર્મેધા ધૃતિઃ ક્ષમા ॥","en":"And I am the all-devouring Death, and the source of prosperity for those who are to be prosperous; among the feminine qualities, I am fame, prosperity, speech, memory, intelligence, firmness, and forgiveness.","hi":"सबका हरण करनेवाली मृत्यु और उत्पन्न होनेवालोंका उभ्दव मैं हूँ तथा स्त्री-जातिमें कीर्ति, श्री, वाक्, स्मृति, मेधा, धृति और क्षमा मैं हूँ।"},{"c":10,"v":35,"sp":"krishna","sa":"बृहत्साम तथा साम्नां गायत्री छन्दसामहम् ।\nमासानां मार्गशीर्षोऽहमृतूनां कुसुमाकरः ॥","tr":"bṛhatsāma tathā sāmnāṃ gāyatrī chandasāmaham\nmāsānāṃ mārgaśīrṣo'hamṛtūnāṃ kusumākaraḥ","gs":"બૃહત્સામ તથા સામ્નાં ગાયત્રી છન્દસામહમ્ ।\nમાસાનાં માર્ગશીર્ષોઽહમૃતૂનાં કુસુમાકરઃ ॥","en":"Among the hymns, I am the Brihatsaman; among meters, I am Gayatri; among months, I am Margasirsha; among seasons, I am the flowery season.","hi":"गायी जानेवाली श्रुतियोंमें बृहत्साम और वैदिक छन्दोंमें गायत्री छन्द मैं हूँ। बारह महीनोंमें मार्गशीर्ष और छः ऋतुओंमें वसन्त मैं हूँ।"},{"c":10,"v":36,"sp":"krishna","sa":"द्यूतं छलयतामस्मि तेजस्तेजस्विनामहम् ।\nजयोऽस्मि व्यवसायोऽस्मि सत्त्वं सत्त्ववतामहम् ॥","tr":"dyūtaṃ chalayatāmasmi tejastejasvināmaham\njayo'smi vyavasāyo'smi sattvaṃ sattvavatāmaham","gs":"દ્યૂતં છલયતામસ્મિ તેજસ્તેજસ્વિનામહમ્ ।\nજયોઽસ્મિ વ્યવસાયોઽસ્મિ સત્ત્વં સત્ત્વવતામહમ્ ॥","en":"I am the gambling of the deceitful; I am the splendor of the splendid; I am victory; I am the resolve of the resolute; I am the goodness of the good.","hi":"छल करनेवालोंमें जूआ और तेजस्वियोंमें तेज मैं हूँ। जीतनेवालोंकी विजय, निश्चय करनेवालोंका निश्चय और सात्त्विक मनुष्योंका सात्त्विक भाव मैं हूँ।"},{"c":10,"v":37,"sp":"krishna","sa":"वृष्णीनां वासुदेवोऽस्मि पाण्डवानां धनंजयः ।\nमुनीनामप्यहं व्यासः कवीनामुशना कविः ॥","tr":"vṛṣṇīnāṃ vāsudevo'smi pāṇḍavānāṃ dhanaṃjayaḥ\nmunīnāmapyahaṃ vyāsaḥ kavīnāmuśanā kaviḥ","gs":"વૃષ્ણીનાં વાસુદેવોઽસ્મિ પાણ્ડવાનાં ધનંજયઃ ।\nમુનીનામપ્યહં વ્યાસઃ કવીનામુશના કવિઃ ॥","en":"Among the Vrishnis, I am Vaasudeva; among the Pandavas, I am Arjuna; among the sages, I am Vyasa; among the poets, I am Usanas, the poet.","hi":"वृष्णिवंशियोंमें वासुदेव और पाण्डवोंमें धनञ्जय मैं हूँ। मुनियोंमें वेदव्यास और कवियोंमें कवि शुक्राचार्य भी मैं हूँ।"},{"c":10,"v":38,"sp":"krishna","sa":"दण्डो दमयतामस्मि नीतिरस्मि जिगीषताम् ।\nमौनं चैवास्मि गुह्यानां ज्ञानं ज्ञानवतामहम् ॥","tr":"daṇḍo damayatāmasmi nītirasmi jigīṣatām\nmaunaṃ caivāsmi guhyānāṃ jñānaṃ jñānavatāmaham","gs":"દણ્ડો દમયતામસ્મિ નીતિરસ્મિ જિગીષતામ્ ।\nમૌનં ચૈવાસ્મિ ગુહ્યાનાં જ્ઞાનં જ્ઞાનવતામહમ્ ॥","en":"Of those who punish, I am the scepter; among those who seek victory, I am statesmanship; and among secrets, I am silence; I am knowledge among knowers.","hi":"दमन करनेवालोंमें दण्डनीति और विजय चाहनेवालोंमें नीति मैं हूँ। गोपनीय भावोंमें मौन और ज्ञानवानोंमें ज्ञान मैं हूँ।"},{"c":10,"v":39,"sp":"krishna","sa":"यच्चापि सर्वभूतानां बीजं तदहमर्जुन ।\nन तदस्ति विना यत्स्यान्मया भूतं चराचरम् ॥","tr":"yaccāpi sarvabhūtānāṃ bījaṃ tadahamarjuna\nna tadasti vinā yatsyānmayā bhūtaṃ carācaram","gs":"યચ્ચાપિ સર્વભૂતાનાં બીજં તદહમર્જુન ।\nન તદસ્તિ વિના યત્સ્યાન્મયા ભૂતં ચરાચરમ્ ॥","en":"And whatever is the seed of all beings, that too am I, O Arjuna; there is no being, be it moving or unmoving, that can exist without Me.","hi":"हे अर्जुन! सम्पूर्ण प्राणियोंका जो बीज है, वह बीज मैं ही हूँ; क्योंकि मेरे बिना कोई भी चर-अचर प्राणी नहीं है अर्थात् चर-अचर सब कुछ मैं ही हूँ।"},{"c":10,"v":40,"sp":"krishna","sa":"नान्तोऽस्ति मम दिव्यानां विभूतीनां परंतप ।\nएष तूद्देशतः प्रोक्तो विभूतेर्विस्तरो मया ॥","tr":"nānto'sti mama divyānāṃ vibhūtīnāṃ paraṃtapa\neṣa tūddeśataḥ prokto vibhūtervistaro mayā","gs":"નાન્તોઽસ્તિ મમ દિવ્યાનાં વિભૂતીનાં પરંતપ ।\nએષ તૂદ્દેશતઃ પ્રોક્તો વિભૂતેર્વિસ્તરો મયા ॥","en":"There is no end to My divine glories, O Arjuna, but this is a brief statement by Me of the particulars of My divine glory.","hi":"हे परंतप अर्जुन ! मेरी दिव्य विभूतियोंका अन्त नहीं है। मैंने तुम्हारे सामने अपनी विभूतियोंका जो विस्तार कहा है, यह तो केवल संक्षेपसे कहा है।"},{"c":10,"v":41,"sp":"krishna","sa":"यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा ।\nतत्तदेवावगच्छ त्वं मम तेजोंऽशसंभवम् ॥","tr":"yadyadvibhūtimatsattvaṃ śrīmadūrjitameva vā\ntattadevāvagaccha tvaṃ mama tejoṃ'śasaṃbhavam","gs":"યદ્યદ્વિભૂતિમત્સત્ત્વં શ્રીમદૂર્જિતમેવ વા ।\nતત્તદેવાવગચ્છ ત્વં મમ તેજોંઽશસંભવમ્ ॥","en":"Whatever being there is glorious, prosperous, or powerful, know that to be a manifestation of a part of My splendor.","hi":"जो-जो ऐश्वर्ययुक्त, शोभायुक्त और बलयुक्त प्राणी तथा वस्तु है, उस-उसको तुम मेरे ही तेज-(योग-) के अंशसे उत्पन्न हुई समझो।"},{"c":10,"v":42,"sp":"krishna","sa":"अथवा बहुनैतेन किं ज्ञातेन तवार्जुन ।\nविष्टभ्याहमिदं कृत्स्नमेकांशेन स्थितो जगत् ॥","tr":"athavā bahunaitena kiṃ jñātena tavārjuna\nviṣṭabhyāhamidaṃ kṛtsnamekāṃśena sthito jagat","gs":"અથવા બહુનૈતેન કિં જ્ઞાતેન તવાર્જુન ।\nવિષ્ટભ્યાહમિદં કૃત્સ્નમેકાંશેન સ્થિતો જગત્ ॥","en":"But, of what avail is the knowledge of all these details to you, O Arjuna? I exist, supporting this whole world with one part of Myself.","hi":"अथवा हे अर्जुन ! तुम्हें इस प्रकार बहुत-सी बातें जाननेकी क्या आवश्यकता है? मैं अपने किसी एक अंशसे सम्पूर्ण जगत् को व्याप्त करके स्थित हूँ।"},{"c":11,"v":1,"sp":"arjuna","sa":"मदनुग्रहाय परमं गुह्यमध्यात्मसंज्ञितम् ।\nयत्त्वयोक्तं वचस्तेन मोहोऽयं विगतो मम ॥","tr":"madanugrahāya paramaṃ guhyamadhyātmasaṃjñitam\nyattvayoktaṃ vacastena moho'yaṃ vigato mama","gs":"મદનુગ્રહાય પરમં ગુહ્યમધ્યાત્મસંજ્ઞિતમ્ ।\nયત્ત્વયોક્તં વચસ્તેન મોહોઽયં વિગતો મમ ॥","en":"Arjuna said, By this explanation of the highest secret concerning the Self which Thou hast spoken, for the sake of blessing me, my delusion has been dispelled.","hi":"अर्जुन बोले -- केवल मेरेपर कृपा करनेके लिये ही आपने जो परम गोपनीय अध्यात्मतत्तव जाननेका वचन कहा, उससे मेरा यह मोह नष्ट हो गया है।"},{"c":11,"v":2,"sp":"arjuna","sa":"भवाप्ययौ हि भूतानां श्रुतौ विस्तरशो मया ।\nत्वत्तः कमलपत्राक्ष माहात्म्यमपि चाव्ययम् ॥","tr":"bhavāpyayau hi bhūtānāṃ śrutau vistaraśo mayā\ntvattaḥ kamalapatrākṣa māhātmyamapi cāvyayam","gs":"ભવાપ્યયૌ હિ ભૂતાનાં શ્રુતૌ વિસ્તરશો મયા ।\nત્વત્તઃ કમલપત્રાક્ષ માહાત્મ્યમપિ ચાવ્યયમ્ ॥","en":"The origin and destruction of beings have been heard in detail from You, O lotus-eyed Lord, and also Your inexhaustible greatness.","hi":"हे कमलनयन ! सम्पूर्ण प्राणियोंकी उत्पत्ति और प्रलय मैंने विस्तारपूर्वक आपसे ही सुना है और आपका अविनाशी माहात्म्य भी सुना है।"},{"c":11,"v":3,"sp":"arjuna","sa":"एवमेतद्यथात्थ त्वमात्मानं परमेश्वर ।\nद्रष्टुमिच्छामि ते रूपमैश्वरं पुरुषोत्तम ॥","tr":"evametadyathāttha tvamātmānaṃ parameśvara\ndraṣṭumicchāmi te rūpamaiśvaraṃ puruṣottama","gs":"એવમેતદ્યથાત્થ ત્વમાત્માનં પરમેશ્વર ।\nદ્રષ્ટુમિચ્છામિ તે રૂપમૈશ્વરં પુરુષોત્તમ ॥","en":"Now, O Supreme Lord, as Thou hast thus described Thyself, O Supreme Person, I wish to behold Thy divine form.","hi":"हे पुरुषोत्तम ! आप अपने-आपको जैसा कहते हैं, यह वास्तवमें ऐसा ही है। हे परमेश्वर ! आपके ईश्वर-सम्बन्धी रूपको मैं देखना चाहता हूँ।"},{"c":11,"v":4,"sp":"arjuna","sa":"मन्यसे यदि तच्छक्यं मया द्रष्टुमिति प्रभो ।\nयोगेश्वर ततो मे त्वं दर्शयाऽत्मानमव्ययम् ॥","tr":"manyase yadi tacchakyaṃ mayā draṣṭumiti prabho\nyogeśvara tato me tvaṃ darśayā'tmānamavyayam","gs":"મન્યસે યદિ તચ્છક્યં મયા દ્રષ્ટુમિતિ પ્રભો ।\nયોગેશ્વર તતો મે ત્વં દર્શયાઽત્માનમવ્યયમ્ ॥","en":"If Thou, O Lord, thinkest it possible for me to see it, do Thou, then, O Lord of the Yogis, show me Thy imperishable Self.","hi":"हे प्रभो ! मेरे द्वारा आपका वह परम ऐश्वर रूप देखा जा सकता है -- ऐसा अगर आप मानते हैं, तो हे योगेश्वर ! आप अपने उस अविनाशी स्वरूपको मुझे दिखा दीजिये।"},{"c":11,"v":5,"sp":"krishna","sa":"पश्य मे पार्थ रूपाणि शतशोऽथ सहस्रशः ।\nनानाविधानि दिव्यानि नानावर्णाकृतीनि च ॥","tr":"paśya me pārtha rūpāṇi śataśo'tha sahasraśaḥ\nnānāvidhāni divyāni nānāvarṇākṛtīni ca","gs":"પશ્ય મે પાર્થ રૂપાણિ શતશોઽથ સહસ્રશઃ ।\nનાનાવિધાનિ દિવ્યાનિ નાનાવર્ણાકૃતીનિ ચ ॥","en":"The Blessed Lord said, \"Behold, O Arjuna, forms of Mine, by the hundreds and thousands, of different sorts, divine, and of various colors and shapes.\"","hi":"श्रीभगवान् बोले -- हे पृथानन्दन ! अब मेरे अनेक तरहके, अनेक अनेक वर्णों और आकृतियोंवाले सैकड़ों-हजारों दिव्यरूपोंको तू देख।"},{"c":11,"v":6,"sp":"krishna","sa":"पश्यादित्यान्वसून्रुद्रानश्िवनौ मरुतस्तथा ।\nबहून्यदृष्टपूर्वाणि पश्याऽश्चर्याणि भारत ॥","tr":"paśyādityānvasūnrudrānaśivanau marutastathā\nbahūnyadṛṣṭapūrvāṇi paśyā'ścaryāṇi bhārata","gs":"પશ્યાદિત્યાન્વસૂન્રુદ્રાનશ્િવનૌ મરુતસ્તથા ।\nબહૂન્યદૃષ્ટપૂર્વાણિ પશ્યાઽશ્ચર્યાણિ ભારત ॥","en":"Behold the Adityas, the Vasus, the Rudras, the two Asvins, and the Maruts; behold many wonders never before seen, O Arjuna.","hi":"हे भरतवंशोद्भव अर्जुन! तू बारह आदित्योंको, आठ वसुओंको, ग्यारह रुद्रोंको और दो अश्विनीकुमारोंको तथा उनचास मरुद्गणोंको देख। जिनको तूने पहले कभी देखा नहीं, ऐसे बहुत-से आश्चर्यजनक रूपोंको भी तू देख।"},{"c":11,"v":7,"sp":"krishna","sa":"इहैकस्थं जगत्कृत्स्नं पश्याद्य सचराचरम् ।\nमम देहे गुडाकेश यच्चान्यद्द्रष्टुमिच्छसि ॥","tr":"ihaikasthaṃ jagatkṛtsnaṃ paśyādya sacarācaram\nmama dehe guḍākeśa yaccānyaddraṣṭumicchasi","gs":"ઇહૈકસ્થં જગત્કૃત્સ્નં પશ્યાદ્ય સચરાચરમ્ ।\nમમ દેહે ગુડાકેશ યચ્ચાન્યદ્દ્રષ્ટુમિચ્છસિ ॥","en":"Now, behold, O Arjuna, in this My body, the entire universe centered in one, including the moving and the unmoving, and whatever else you desire to see.","hi":"हे नींदको जीतनेवाले अर्जुन! मेरे इस शरीरके एक देशमें चराचरसहित सम्पूर्ण जगत् को अभी देख ले। इसके सिवाय तू और भी जो कुछ देखना चाहता है, वह भी देख ले।"},{"c":11,"v":8,"sp":"krishna","sa":"न तु मां शक्यसे द्रष्टुमनेनैव स्वचक्षुषा ।\nदिव्यं ददामि ते चक्षुः पश्य मे योगमैश्वरम् ॥","tr":"na tu māṃ śakyase draṣṭumanenaiva svacakṣuṣā\ndivyaṃ dadāmi te cakṣuḥ paśya me yogamaiśvaram","gs":"ન તુ માં શક્યસે દ્રષ્ટુમનેનૈવ સ્વચક્ષુષા ।\nદિવ્યં દદામિ તે ચક્ષુઃ પશ્ય મે યોગમૈશ્વરમ્ ॥","en":"But you are not able to behold Me with these your own eyes; I give you the divine eye; behold My lordly Yoga.","hi":"परन्तु तू अपनी इस आँखसे अर्थात् चर्मचक्षुसे मेरेको देख ही नहीं सकता, इसलिये मैं तुझे दिव्य चक्षु देता हूँ, जिससे तू मेरी ईश्वर-सम्बन्धी सामर्थ्यको देख।"},{"c":11,"v":9,"sp":"sanjaya","sa":"एवमुक्त्वा ततो राजन्महायोगेश्वरो हरिः ।\nदर्शयामास पार्थाय परमं रूपमैश्वरम् ॥","tr":"evamuktvā tato rājanmahāyogeśvaro hariḥ\ndarśayāmāsa pārthāya paramaṃ rūpamaiśvaram","gs":"એવમુક્ત્વા તતો રાજન્મહાયોગેશ્વરો હરિઃ ।\nદર્શયામાસ પાર્થાય પરમં રૂપમૈશ્વરમ્ ॥","en":"Sanjaya said, Having thus spoken, O king, the great Lord of Yoga, Hari (Krishna), showed Arjuna His supreme form as the Lord.","hi":"सञ्जय बोले -- हे राजन् ! ऐसा कहकर फिर महायोगेश्वर भगवान् श्रीकृष्णने अर्जुनको परम ऐश्वर-रूप दिखाया।"},{"c":11,"v":10,"sp":"sanjaya","sa":"अनेकवक्त्रनयनमनेकाद्भुतदर्शनम् ।\nअनेकदिव्याभरणं दिव्यानेकोद्यतायुधम् ॥","tr":"anekavaktranayanamanekādbhutadarśanam\nanekadivyābharaṇaṃ divyānekodyatāyudham","gs":"અનેકવક્ત્રનયનમનેકાદ્ભુતદર્શનમ્ ।\nઅનેકદિવ્યાભરણં દિવ્યાનેકોદ્યતાયુધમ્ ॥","en":"With numerous mouths and eyes, with numerous wondrous sights, with numerous divine adornments, with numerous divine weapons uplifted, such a form He showed.","hi":"।।11.10 -- 11.11।। जिसके अनेक मुख और नेत्र हैं, अनेक तहरके अद्भुत दर्शन हैं, अनेक दिव्य आभूषण हैं, हाथोंमें उठाये हुए अनेक दिव्य आयुध हैं तथा जिनके गलेमें दिव्य मालाएँ हैं, जो दिव्य वस्त्र पहने हुए हैं, जिनके ललाट तथा शरीरपर दिव्य चन्दन, कुंकुम आदि लगा हुआ है, ऐसे सम्पूर्ण आश्चर्यमय, अनन्तरूपवाले तथा चारों तरफ मुखवाले देव-(अपने दिव्य स्वरूप-) को भगवान् ने दिखाया।"},{"c":11,"v":11,"sp":"sanjaya","sa":"दिव्यमाल्याम्बरधरं दिव्यगन्धानुलेपनम् ।\nसर्वाश्चर्यमयं देवमनन्तं विश्वतोमुखम् ॥","tr":"divyamālyāmbaradharaṃ divyagandhānulepanam\nsarvāścaryamayaṃ devamanantaṃ viśvatomukham","gs":"દિવ્યમાલ્યામ્બરધરં દિવ્યગન્ધાનુલેપનમ્ ।\nસર્વાશ્ચર્યમયં દેવમનન્તં વિશ્વતોમુખમ્ ॥","en":"Wearing divine garlands and apparel, anointed with divine unguents, the all-wonderful, resplendent Being is endless with faces on all sides.","hi":"।।11.10 -- 11.11।। जिसके अनेक मुख और नेत्र हैं, अनेक तहरके अद्भुत दर्शन हैं, अनेक दिव्य आभूषण हैं, हाथोंमें उठाये हुए अनेक दिव्य आयुध हैं तथा जिनके गलेमें दिव्य मालाएँ हैं, जो दिव्य वस्त्र पहने हुए हैं, जिनके ललाट तथा शरीरपर दिव्य चन्दन, कुंकुम आदि लगा हुआ है, ऐसे सम्पूर्ण आश्चर्यमय, अनन्त रूपोंवाले तथा चारों तरफ मुखवाले देव-(अपने दिव्य स्वरूप-) को भगवान् ने दिखाया।"},{"c":11,"v":12,"sp":"sanjaya","sa":"दिवि सूर्यसहस्रस्य भवेद्युगपदुत्थिता ।\nयदि भाः सदृशी सा स्याद्भासस्तस्य महात्मनः ॥","tr":"divi sūryasahasrasya bhavedyugapadutthitā\nyadi bhāḥ sadṛśī sā syādbhāsastasya mahātmanaḥ","gs":"દિવિ સૂર્યસહસ્રસ્ય ભવેદ્યુગપદુત્થિતા ।\nયદિ ભાઃ સદૃશી સા સ્યાદ્ભાસસ્તસ્ય મહાત્મનઃ ॥","en":"If the splendour of a thousand suns were to blaze out simultaneously in the sky, that would be the splendour of that mighty being.","hi":"अगर आकाशमें एक साथ हजारों सूर्य उदित हो जायँ, तो भी उन सबका प्रकाश मिलकर उस महात्मा-(विराट् रूप परमात्मा-) के प्रकाशके समान शायद ही हो।"},{"c":11,"v":13,"sp":"sanjaya","sa":"तत्रैकस्थं जगत्कृत्स्नं प्रविभक्तमनेकधा ।\nअपश्यद्देवदेवस्य शरीरे पाण्डवस्तदा ॥","tr":"tatraikasthaṃ jagatkṛtsnaṃ pravibhaktamanekadhā\napaśyaddevadevasya śarīre pāṇḍavastadā","gs":"તત્રૈકસ્થં જગત્કૃત્સ્નં પ્રવિભક્તમનેકધા ।\nઅપશ્યદ્દેવદેવસ્ય શરીરે પાણ્ડવસ્તદા ॥","en":"There, in the body of the God of gods, Arjuna then saw the entire universe resting in one, with its myriad of divisions.","hi":"उस समय अर्जुनने देवोंके देव भगवान् के उस शरीरमें एक जगह स्थित अनेक प्रकारके विभागोंमें विभक्त सम्पूर्ण जगत् को देखा।"},{"c":11,"v":14,"sp":"sanjaya","sa":"ततः स विस्मयाविष्टो हृष्टरोमा धनञ्जयः ।\nप्रणम्य शिरसा देवं कृताञ्जलिरभाषत ॥","tr":"tataḥ sa vismayāviṣṭo hṛṣṭaromā dhanañjayaḥ\npraṇamya śirasā devaṃ kṛtāñjalirabhāṣata","gs":"તતઃ સ વિસ્મયાવિષ્ટો હૃષ્ટરોમા ધનઞ્જયઃ ।\nપ્રણમ્ય શિરસા દેવં કૃતાઞ્જલિરભાષત ॥","en":"Then, Arjuna, filled with wonder and his hair standing on end, bowed his head to the God and spoke with palms joined.","hi":"भगवान् के विश्वरूपको देखकर अर्जुन बहुत चकित हुए और आश्चर्यके कारण उनका शरीर रोमाञ्चित हो गया। वे हाथ जोड़कर विश्वरूप देवको मस्तकसे प्रणाम करके बोले।"},{"c":11,"v":15,"sp":"arjuna","sa":"पश्यामि देवांस्तव देव देहे  सर्वांस्तथा भूतविशेषसङ्घान् ।\nब्रह्माणमीशं कमलासनस्थ  मृषींश्च सर्वानुरगांश्च दिव्यान् ॥","tr":"paśyāmi devāṃstava deva dehe  sarvāṃstathā bhūtaviśeṣasaṅghān\nbrahmāṇamīśaṃ kamalāsanastha  mṛṣīṃśca sarvānuragāṃśca divyān","gs":"પશ્યામિ દેવાંસ્તવ દેવ દેહે  સર્વાંસ્તથા ભૂતવિશેષસઙ્ઘાન્ ।\nબ્રહ્માણમીશં કમલાસનસ્થ  મૃષીંશ્ચ સર્વાનુરગાંશ્ચ દિવ્યાન્ ॥","en":"Arjuna said, \"O God, I see all the gods in Your body, as well as hosts of various classes of beings, Brahma the Lord seated on the lotus, all the sages, and the celestial serpents.\"","hi":"अर्जुन बोले -- हे देव ! मैं आपके शरीरमें सम्पूर्ण देवताओंको, प्राणियोंके विशेष-विशेष समुदायोंको कमलासनपर बैठे हुए ब्रह्माजीको, शङ्करजीको, सम्पूर्ण ऋषियोंको और सम्पूर्ण दिव्य सर्पोंको देख रहा हूँ।"},{"c":11,"v":16,"sp":"arjuna","sa":"अनेकबाहूदरवक्त्रनेत्रं  पश्यामि त्वां सर्वतोऽनन्तरूपम् ।\nनान्तं न मध्यं न पुनस्तवादिं  पश्यामि विश्वेश्वर विश्वरूप ॥","tr":"anekabāhūdaravaktranetraṃ  paśyāmi tvāṃ sarvato'nantarūpam\nnāntaṃ na madhyaṃ na punastavādiṃ  paśyāmi viśveśvara viśvarūpa","gs":"અનેકબાહૂદરવક્ત્રનેત્રં  પશ્યામિ ત્વાં સર્વતોઽનન્તરૂપમ્ ।\nનાન્તં ન મધ્યં ન પુનસ્તવાદિં  પશ્યામિ વિશ્વેશ્વર વિશ્વરૂપ ॥","en":"I see You with boundless form on every side, with many arms, stomachs, mouths, and eyes; neither the end nor the middle nor the beginning do I see, O Lord of the Universe, O Cosmic Form.","hi":"हे विश्वरूप ! हे विश्वेश्वरव ! आपको मैं अनेक हाथों, पेटों, मुखों और नेत्रोंवाला तथा सब ओरसे अनन्त रूपोंवाला देख रहा हूँ। मैं आपके न आदिको, न मध्यको और न अन्तको ही देख रहा हूँ।"},{"c":11,"v":17,"sp":"arjuna","sa":"किरीटिनं गदिनं चक्रिणं च  तेजोराशिं सर्वतोदीप्तिमन्तम् ।\nपश्यामि त्वां दुर्निरीक्ष्यं समन्ता  द्दीप्तानलार्कद्युतिमप्रमेयम् ॥","tr":"kirīṭinaṃ gadinaṃ cakriṇaṃ ca  tejorāśiṃ sarvatodīptimantam\npaśyāmi tvāṃ durnirīkṣyaṃ samantā  ddīptānalārkadyutimaprameyam","gs":"કિરીટિનં ગદિનં ચક્રિણં ચ  તેજોરાશિં સર્વતોદીપ્તિમન્તમ્ ।\nપશ્યામિ ત્વાં દુર્નિરીક્ષ્યં સમન્તા  દ્દીપ્તાનલાર્કદ્યુતિમપ્રમેયમ્ ॥","en":"I see You with the diadem, club, and discus, a mass of radiance shining everywhere, very hard to look at, blazing all around like a burning fire and the sun, and immeasurable.","hi":"मैं आपको किरीट, गदा, चक्र (तथा शङ्ख और पद्म) धारण किये हुए देख रहा हूँ। आपको तेजकी राशि, सब ओर प्रकाश करनेवाले, देदीप्यमान अग्नि तथा सूर्यके समान कान्तिवाले, नेत्रोंके द्वारा कठिनतासे देखे जानेयोग्य और सब तरफसे अप्रमेयस्वरूप देख रहा हूँ।"},{"c":11,"v":18,"sp":"arjuna","sa":"त्वमक्षरं परमं वेदितव्यं  त्वमस्य विश्वस्य परं निधानम् ।\nत्वमव्ययः शाश्वतधर्मगोप्ता  सनातनस्त्वं पुरुषो मतो मे ॥","tr":"tvamakṣaraṃ paramaṃ veditavyaṃ  tvamasya viśvasya paraṃ nidhānam\ntvamavyayaḥ śāśvatadharmagoptā  sanātanastvaṃ puruṣo mato me","gs":"ત્વમક્ષરં પરમં વેદિતવ્યં  ત્વમસ્ય વિશ્વસ્ય પરં નિધાનમ્ ।\nત્વમવ્યયઃ શાશ્વતધર્મગોપ્તા  સનાતનસ્ત્વં પુરુષો મતો મે ॥","en":"You are the Imperishable, the Supreme Being, worthy of being known. You are the great treasure-house of this universe; You are the imperishable protector of the eternal Dharma; You are the Primal Person, I believe.","hi":"आप ही जाननेयोग्य परम अक्षर (अक्षरब्रह्म) हैं, आप ही इस सम्पूर्ण विश्वके परम आश्रय हैं, आप ही सनातनधर्मके रक्षक हैं और आप ही अविनाशी सनातन पुरुष हैं -- ऐसा मैं मानता हूँ।"},{"c":11,"v":19,"sp":"arjuna","sa":"अनादिमध्यान्तमनन्तवीर्य  मनन्तबाहुं शशिसूर्यनेत्रम् ।\nपश्यामि त्वां दीप्तहुताशवक्त्रम्  स्वतेजसा विश्वमिदं तपन्तम् ॥","tr":"anādimadhyāntamanantavīrya  manantabāhuṃ śaśisūryanetram\npaśyāmi tvāṃ dīptahutāśavaktram  svatejasā viśvamidaṃ tapantam","gs":"અનાદિમધ્યાન્તમનન્તવીર્ય  મનન્તબાહું શશિસૂર્યનેત્રમ્ ।\nપશ્યામિ ત્વાં દીપ્તહુતાશવક્ત્રમ્  સ્વતેજસા વિશ્વમિદં તપન્તમ્ ॥","en":"I see You without beginning, middle, or end, infinite in power, with endless arms, the sun and moon as Your eyes, the burning fire Your mouth, heating the entire universe with Your radiance.","hi":"आपको मैं आदि, मध्य और अन्तसे रहित, अनन्त प्रभावशाली, अनन्त भुजाओंवाले, चन्द्र और सूर्यरूप नेत्रोवाले, प्रज्वलित अग्निके समान मुखोंवाले और अपने तेजसे संसारको संतप्त करते हुए देख रहा हूँ।"},{"c":11,"v":20,"sp":"arjuna","sa":"द्यावापृथिव्योरिदमन्तरं हि  व्याप्तं त्वयैकेन दिशश्च सर्वाः ।\nदृष्ट्वाऽद्भुतं रूपमुग्रं तवेदं  लोकत्रयं प्रव्यथितं महात्मन् ॥","tr":"dyāvāpṛthivyoridamantaraṃ hi  vyāptaṃ tvayaikena diśaśca sarvāḥ\ndṛṣṭvā'dbhutaṃ rūpamugraṃ tavedaṃ  lokatrayaṃ pravyathitaṃ mahātman","gs":"દ્યાવાપૃથિવ્યોરિદમન્તરં હિ  વ્યાપ્તં ત્વયૈકેન દિશશ્ચ સર્વાઃ ।\nદૃષ્ટ્વાઽદ્ભુતં રૂપમુગ્રં તવેદં  લોકત્રયં પ્રવ્યથિતં મહાત્મન્ ॥","en":"This space between the earth and the heavens, and all the quarters, is filled by You alone; having seen this, Your wonderful and terrible form, the three worlds are trembling with fear, O great-souled Being.","hi":"हे महात्मन् ! यह स्वर्ग और पृथ्वीके बीचका अन्तराल और सम्पूर्ण दिशाएँ एक आपसे ही परिपूर्ण हैं। आपके इस अद्भुत और उग्ररूपको देखकर तीनों लोक व्यथित (व्याकुल) हो रहे हैं।"},{"c":11,"v":21,"sp":"arjuna","sa":"अमी हि त्वां सुरसङ्घाः विशन्ति  केचिद्भीताः प्राञ्जलयो गृणन्ति ।\nस्वस्तीत्युक्त्वा महर्षिसिद्धसङ्घाः  स्तुवन्ति त्वां स्तुतिभिः पुष्कलाभिः ॥","tr":"amī hi tvāṃ surasaṅghāḥ viśanti  kecidbhītāḥ prāñjalayo gṛṇanti\nsvastītyuktvā maharṣisiddhasaṅghāḥ  stuvanti tvāṃ stutibhiḥ puṣkalābhiḥ","gs":"અમી હિ ત્વાં સુરસઙ્ઘાઃ વિશન્તિ  કેચિદ્ભીતાઃ પ્રાઞ્જલયો ગૃણન્તિ ।\nસ્વસ્તીત્યુક્ત્વા મહર્ષિસિદ્ધસઙ્ઘાઃ  સ્તુવન્તિ ત્વાં સ્તુતિભિઃ પુષ્કલાભિઃ ॥","en":"Verily, these hosts of gods enter into Thee; some extol Thee with joined palms in fear, saying, 'May it be well!' Bands of great sages and perfected ones praise Thee with complete hymns.","hi":"वे ही देवताओंके समुदाय आपमें प्रविष्ट हो रहे हैं। उनमेंसे कई तो भयभीत होकर हाथ जोड़े हुए आपके नामों और गुणोंका कीर्तन कर रहे हैं। महर्षियों और सिद्धोंके समुदाय 'कल्याण हो ! मङ्गल हो !' ऐसा कहकर उत्तम-उत्तम स्तोत्रोंके द्वारा आपकी स्तुति कर रहे हैं।"},{"c":11,"v":22,"sp":"arjuna","sa":"रुद्रादित्या वसवो ये च साध्या  विश्वेऽश्िवनौ मरुतश्चोष्मपाश्च ।\nगन्धर्वयक्षासुरसिद्धसङ्घा  वीक्षन्ते त्वां विस्मिताश्चैव सर्वे ॥","tr":"rudrādityā vasavo ye ca sādhyā  viśve'śivanau marutaścoṣmapāśca\ngandharvayakṣāsurasiddhasaṅghā  vīkṣante tvāṃ vismitāścaiva sarve","gs":"રુદ્રાદિત્યા વસવો યે ચ સાધ્યા  વિશ્વેઽશ્િવનૌ મરુતશ્ચોષ્મપાશ્ચ ।\nગન્ધર્વયક્ષાસુરસિદ્ધસઙ્ઘા  વીક્ષન્તે ત્વાં વિસ્મિતાશ્ચૈવ સર્વે ॥","en":"The Rudras, Adityas, Vasus, Sadhyas, Visvedevas, the two Asvins, Maruts, the Manus, and the hosts of celestial singers, Yakshas, demons, and the perfected ones, all look upon Thee with great amazement.","hi":"जो ग्यारह रुद्र, बारह आदित्य, आठ वसु, बारह साध्यगण, दस विश्वेदेव और दो अश्विनीकुमार, उनचास मरुद्गण, सात पितृगण तथा गन्धर्व, यक्ष, असुर और सिद्धोंके समुदाय हैं, वे सभी चकित होकर आपको देख रहे हैं।"},{"c":11,"v":23,"sp":"arjuna","sa":"रूपं महत्ते बहुवक्त्रनेत्रं  महाबाहो बहुबाहूरुपादम् ।\nबहूदरं बहुदंष्ट्राकरालं  दृष्ट्वा लोकाः प्रव्यथितास्तथाऽहम् ॥","tr":"rūpaṃ mahatte bahuvaktranetraṃ  mahābāho bahubāhūrupādam\nbahūdaraṃ bahudaṃṣṭrākarālaṃ  dṛṣṭvā lokāḥ pravyathitāstathā'ham","gs":"રૂપં મહત્તે બહુવક્ત્રનેત્રં  મહાબાહો બહુબાહૂરુપાદમ્ ।\nબહૂદરં બહુદંષ્ટ્રાકરાલં  દૃષ્ટ્વા લોકાઃ પ્રવ્યથિતાસ્તથાઽહમ્ ॥","en":"Having seen Your immeasurable form with many mouths and eyes, O mighty-armed one, with many arms, thighs, and feet, with many stomachs and fearsome with many teeth, the worlds are terrified, and so am I.","hi":"हे महाबाहो! आपके बहुत मुखों और नेत्रोंवाले, बहुत भुजाओं, जंघाओं और चरणोंवाले, बहुत उदरोंवाले, बहुत विकराल दाढ़ोंवाले महान् रूपको देखकर सब प्राणी व्यथित हो रहे हैं तथा मैं भी व्यथित हो रहा हूँ।"},{"c":11,"v":24,"sp":"arjuna","sa":"नभःस्पृशं दीप्तमनेकवर्णं  व्यात्ताननं दीप्तविशालनेत्रम् ।\nदृष्ट्वा हि त्वां प्रव्यथितान्तरात्मा  धृतिं न विन्दामि शमं च विष्णो ॥","tr":"nabhaḥspṛśaṃ dīptamanekavarṇaṃ  vyāttānanaṃ dīptaviśālanetram\ndṛṣṭvā hi tvāṃ pravyathitāntarātmā  dhṛtiṃ na vindāmi śamaṃ ca viṣṇo","gs":"નભઃસ્પૃશં દીપ્તમનેકવર્ણં  વ્યાત્તાનનં દીપ્તવિશાલનેત્રમ્ ।\nદૃષ્ટ્વા હિ ત્વાં પ્રવ્યથિતાન્તરાત્મા  ધૃતિં ન વિન્દામિ શમં ચ વિષ્ણો ॥","en":"On seeing Thee, touching the sky, shining in many colors, with mouths wide open, with large fiery eyes, I am terrified at heart and find neither courage nor peace, O Vishnu.","hi":"हे विष्णो ! आपके अनेक देदीप्यमान वर्ण हैं, आप आकाशको स्पर्श कर रहे हैं, आपका मुख फैला हुआ है आपके नेत्र प्रदीप्त और विशाल हैं। ऐसे आपको देखकर भयभीत अन्तःकरणवाला मैं धैर्य और शान्तिको प्राप्त नहीं हो रहा हूँ।"},{"c":11,"v":25,"sp":"arjuna","sa":"दंष्ट्राकरालानि च ते मुखानि  दृष्ट्वैव कालानलसन्निभानि ।\nदिशो न जाने न लभे च शर्म  प्रसीद देवेश जगन्निवास ॥","tr":"daṃṣṭrākarālāni ca te mukhāni  dṛṣṭvaiva kālānalasannibhāni\ndiśo na jāne na labhe ca śarma  prasīda deveśa jagannivāsa","gs":"દંષ્ટ્રાકરાલાનિ ચ તે મુખાનિ  દૃષ્ટ્વૈવ કાલાનલસન્નિભાનિ ।\nદિશો ન જાને ન લભે ચ શર્મ  પ્રસીદ દેવેશ જગન્નિવાસ ॥","en":"Having seen Thy mouths fearful with teeth blazing like the fires of cosmic dissolution, I know not the four quarters, nor do I find peace. Have mercy, O Lord of the gods, O abode of the universe.","hi":"आपके प्रलयकालकी अग्निके समान प्रज्वलित और दाढ़ोंके कारण विकराल (भयानक) मुखोंको देखकर मुझे न तो दिशाओंका ज्ञान हो रहा है और न शान्ति ही मिल रही है। इसलिये हे देवेश ! हे जगन्निवास ! आप प्रसन्न होइये।"},{"c":11,"v":26,"sp":"arjuna","sa":"अमी च त्वां धृतराष्ट्रस्य पुत्राः  सर्वे सहैवावनिपालसङ्घैः ।\nभीष्मो द्रोणः सूतपुत्रस्तथाऽसौ  सहास्मदीयैरपि योधमुख्यैः ॥","tr":"amī ca tvāṃ dhṛtarāṣṭrasya putrāḥ  sarve sahaivāvanipālasaṅghaiḥ\nbhīṣmo droṇaḥ sūtaputrastathā'sau  sahāsmadīyairapi yodhamukhyaiḥ","gs":"અમી ચ ત્વાં ધૃતરાષ્ટ્રસ્ય પુત્રાઃ  સર્વે સહૈવાવનિપાલસઙ્ઘૈઃ ।\nભીષ્મો દ્રોણઃ સૂતપુત્રસ્તથાઽસૌ  સહાસ્મદીયૈરપિ યોધમુખ્યૈઃ ॥","en":"All the sons of Dhritarashtra, along with the hosts of kings of the earth, Bhishma, Drona, and Karna, as well as the chief among our warriors.","hi":"।।11.26 -- 11.27।। हमारे मुख्य योद्धाओंके सहित भीष्म, द्रोण और वह कर्ण भी आपमें प्रविष्ट हो रहे हैं। राजाओंके समुदायोंके सहित धृतराष्ट्रके वे ही सब-के-सब पुत्र आपके विकराल दाढ़ोंके कारण भयंकर मुखोंमें बड़ी तेजीसे प्रविष्ट हो रहे हैं। उनमेंसे कई-एक तो चूर्ण हुए सिरोंसहित आपके दाँतोंके बीचमें फँसे हुए दीख रहे हैं।"},{"c":11,"v":27,"sp":"arjuna","sa":"वक्त्राणि ते त्वरमाणा विशन्ति  दंष्ट्राकरालानि भयानकानि ।\nकेचिद्विलग्ना दशनान्तरेषु  संदृश्यन्ते चूर्णितैरुत्तमाङ्गैः ॥","tr":"vaktrāṇi te tvaramāṇā viśanti  daṃṣṭrākarālāni bhayānakāni\nkecidvilagnā daśanāntareṣu  saṃdṛśyante cūrṇitairuttamāṅgaiḥ","gs":"વક્ત્રાણિ તે ત્વરમાણા વિશન્તિ  દંષ્ટ્રાકરાલાનિ ભયાનકાનિ ।\nકેચિદ્વિલગ્ના દશનાન્તરેષુ  સંદૃશ્યન્તે ચૂર્ણિતૈરુત્તમાઙ્ગૈઃ ॥","en":"Some hurry into Your mouths with their terrible teeth, fearful to behold. Some are found stuck in the gaps between the teeth, their heads crushed to powder.","hi":"।।11.26 -- 11.27।। हमारे मुख्य योद्धाओंके सहित भीष्म, द्रोण और वह कर्ण भी आपमें प्रविष्ट हो रहे हैं। राजाओंके समुदायोंके सहित धृतराष्ट्रके वे ही सब-के-सब पुत्र आपके विकराल दाढ़ोंके कारण भयंकर मुखोंमें बड़ी तेजीसे प्रविष्ट हो रहे हैं। उनमेंसे कईएक तो चूर्ण हुए सिरोंसहित आपके दाँतोंके बीचमें फँसे हुए दीख रहे हैं।"},{"c":11,"v":28,"sp":"arjuna","sa":"यथा नदीनां बहवोऽम्बुवेगाः  समुद्रमेवाभिमुखाः द्रवन्ति ।\nतथा तवामी नरलोकवीरा  विशन्ति वक्त्राण्यभिविज्वलन्ति ॥","tr":"yathā nadīnāṃ bahavo'mbuvegāḥ  samudramevābhimukhāḥ dravanti\ntathā tavāmī naralokavīrā  viśanti vaktrāṇyabhivijvalanti","gs":"યથા નદીનાં બહવોઽમ્બુવેગાઃ  સમુદ્રમેવાભિમુખાઃ દ્રવન્તિ ।\nતથા તવામી નરલોકવીરા  વિશન્તિ વક્ત્રાણ્યભિવિજ્વલન્તિ ॥","en":"Verily, just as many torrents of rivers flow towards the ocean, so too these heroes in the world of men enter Thy flaming mouths.","hi":"जैसे नदियोंके बहुत-से जलके प्रवाह स्वाभाविक ही समुद्रके सम्मुख दौड़ते हैं, ऐसे ही वे संसारके महान् शूरवीर आपके प्रज्वलित मुखोंमें प्रवेश कर रहे हैं।"},{"c":11,"v":29,"sp":"arjuna","sa":"यथा प्रदीप्तं ज्वलनं पतङ्गा  विशन्ति नाशाय समृद्धवेगाः ।\nतथैव नाशाय विशन्ति लोका  स्तवापि वक्त्राणि समृद्धवेगाः ॥","tr":"yathā pradīptaṃ jvalanaṃ pataṅgā  viśanti nāśāya samṛddhavegāḥ\ntathaiva nāśāya viśanti lokā  stavāpi vaktrāṇi samṛddhavegāḥ","gs":"યથા પ્રદીપ્તં જ્વલનં પતઙ્ગા  વિશન્તિ નાશાય સમૃદ્ધવેગાઃ ।\nતથૈવ નાશાય વિશન્તિ લોકા  સ્તવાપિ વક્ત્રાણિ સમૃદ્ધવેગાઃ ॥","en":"As moths hurriedly rush into a blazing fire, leading to their own destruction, so too these creatures hurry into Your mouths, leading to their own destruction.","hi":"जैसे पतंगे मोहवश अपना नाश करनेके लिये बड़े वेगसे दौड़ते हुए प्रज्वलित अग्निमें प्रविष्ट होते हैं, ऐसे ही ये सब लोग भी मोहवश अपना नाश करनेके लिये बड़े वेगसे दौड़ते हुए आपके मुखोंमें प्रविष्ट हो रहे हैं।"},{"c":11,"v":30,"sp":"arjuna","sa":"लेलिह्यसे ग्रसमानः समन्ता  ल्लोकान्समग्रान्वदनैर्ज्वलद्भिः ।\nतेजोभिरापूर्य जगत्समग्रं  भासस्तवोग्राः प्रतपन्ति विष्णो ॥","tr":"lelihyase grasamānaḥ samantā  llokānsamagrānvadanairjvaladbhiḥ\ntejobhirāpūrya jagatsamagraṃ  bhāsastavogrāḥ pratapanti viṣṇo","gs":"લેલિહ્યસે ગ્રસમાનઃ સમન્તા  લ્લોકાન્સમગ્રાન્વદનૈર્જ્વલદ્ભિઃ ।\nતેજોભિરાપૂર્ય જગત્સમગ્રં  ભાસસ્તવોગ્રાઃ પ્રતપન્તિ વિષ્ણો ॥","en":"Thou lickest up, devouring all the worlds on every side with Thy flaming mouths. Thy fierce rays, filling the whole world with radiance, burn, O Vishnu!","hi":"आप अपने प्रज्वलित मुखोंद्वारा सम्पूर्ण लोकोंका ग्रसन करते हुए उन्हें चारों ओरसे बार-बार चाट रहे हैं और हे विष्णो ! आपका उग्र प्रकाश अपने तेजसे सम्पूर्ण जगत् को परिपूर्ण करके सबको तपा रहा है।"},{"c":11,"v":31,"sp":"arjuna","sa":"आख्याहि मे को भवानुग्ररूपो  नमोऽस्तु ते देववर प्रसीद ।\nविज्ञातुमिच्छामि भवन्तमाद्यं  न हि प्रजानामि तव प्रवृत्तिम् ॥","tr":"ākhyāhi me ko bhavānugrarūpo  namo'stu te devavara prasīda\nvijñātumicchāmi bhavantamādyaṃ  na hi prajānāmi tava pravṛttim","gs":"આખ્યાહિ મે કો ભવાનુગ્રરૂપો  નમોઽસ્તુ તે દેવવર પ્રસીદ ।\nવિજ્ઞાતુમિચ્છામિ ભવન્તમાદ્યં  ન હિ પ્રજાનામિ તવ પ્રવૃત્તિમ્ ॥","en":"Tell me, who you are, so fierce of form. I offer my salutations to you, O God Supreme; have mercy on me. I desire to know you, the original Being. I do not indeed know your workings.","hi":"मुझे यह बताइये कि उग्ररूपवाले आप कौन हैं? हे देवताओंमें श्रेष्ठ ! आपको नमस्कार हो। आप प्रसन्न होइये। आदिरूप आपको मैं तत्त्वसे जानना चाहता हूँ; क्योंकि मैं आपकी प्रवृत्तिको नहीं जानता।"},{"c":11,"v":32,"sp":"krishna","sa":"कालोऽस्मि लोकक्षयकृत्प्रवृद्धो  लोकान्समाहर्तुमिह प्रवृत्तः ।\nऋतेऽपि त्वां न भविष्यन्ति सर्वे  येऽवस्थिताः प्रत्यनीकेषु योधाः ॥","tr":"kālo'smi lokakṣayakṛtpravṛddho  lokānsamāhartumiha pravṛttaḥ\nṛte'pi tvāṃ na bhaviṣyanti sarve  ye'vasthitāḥ pratyanīkeṣu yodhāḥ","gs":"કાલોઽસ્મિ લોકક્ષયકૃત્પ્રવૃદ્ધો  લોકાન્સમાહર્તુમિહ પ્રવૃત્તઃ ।\nઋતેઽપિ ત્વાં ન ભવિષ્યન્તિ સર્વે  યેઽવસ્થિતાઃ પ્રત્યનીકેષુ યોધાઃ ॥","en":"The Blessed Lord said, \"I am the full-grown, world-destroying Time, now engaged in destroying the worlds. Even without you, none of the warriors arrayed in the hostile armies will live.\"","hi":"श्रीभगवान् बोले -- मैं सम्पूर्ण लोकोंका क्षय करनेवाला बढ़ा हुआ काल हूँ और इस समय मैं इन सब लोगोंका संहार करनेके लिये यहाँ आया हूँ। तुम्हारे प्रतिपक्षमें जो योद्धालोग खड़े हैं, वे सब तुम्हारे युद्ध किये बिना भी नहीं रहेंगे।"},{"c":11,"v":33,"sp":"krishna","sa":"तस्मात्त्वमुत्तिष्ठ यशो लभस्व  जित्वा शत्रून् भुङ्क्ष्व राज्यं समृद्धम् ।\nमयैवैते निहताः पूर्वमेव  निमित्तमात्रं भव सव्यसाचिन् ॥","tr":"tasmāttvamuttiṣṭha yaśo labhasva  jitvā śatrūn bhuṅkṣva rājyaṃ samṛddham\nmayaivaite nihatāḥ pūrvameva  nimittamātraṃ bhava savyasācin","gs":"તસ્માત્ત્વમુત્તિષ્ઠ યશો લભસ્વ  જિત્વા શત્રૂન્ ભુઙ્ક્ષ્વ રાજ્યં સમૃદ્ધમ્ ।\nમયૈવૈતે નિહતાઃ પૂર્વમેવ  નિમિત્તમાત્રં ભવ સવ્યસાચિન્ ॥","en":"Therefore, stand up and obtain fame. Conquer the enemies and enjoy the unparalleled kingdom. Verily, by Me they have already been slain; be thou a mere instrument, O Arjuna.","hi":"इसलिये तुम युद्धके लिये खड़े हो जाओ और यशको प्राप्त करो तथा शत्रुओंको जीतकर धन-धान्यसे सम्पन्न राज्यको भोगो। ये सभी मेरे द्वारा पहलेसे ही मारे हुए हैं। हे सव्यसाचिन् ! तुम निमित्तमात्र बन जाओ।"},{"c":11,"v":34,"sp":"krishna","sa":"द्रोणं च भीष्मं च जयद्रथं च  कर्णं तथाऽन्यानपि योधवीरान् ।\nमया हतांस्त्वं जहि मा व्यथिष्ठा  युध्यस्व जेतासि रणे सपत्नान् ॥","tr":"droṇaṃ ca bhīṣmaṃ ca jayadrathaṃ ca  karṇaṃ tathā'nyānapi yodhavīrān\nmayā hatāṃstvaṃ jahi mā vyathiṣṭhā  yudhyasva jetāsi raṇe sapatnān","gs":"દ્રોણં ચ ભીષ્મં ચ જયદ્રથં ચ  કર્ણં તથાઽન્યાનપિ યોધવીરાન્ ।\nમયા હતાંસ્ત્વં જહિ મા વ્યથિષ્ઠા  યુધ્યસ્વ જેતાસિ રણે સપત્નાન્ ॥","en":"Drona, Bhishma, Jayadratha, Karna, and other brave warriors have already been slain by Me; do not be distressed with fear; fight and you shall conquer your enemies in battle.","hi":"द्रोण, भीष्म, जयद्रथ और कर्ण तथा अन्य सभी मेरे द्वारा मारे हुए शूरवीरोंको तुम मारो। तुम व्यथा मत करो और युद्ध करो। युद्धमें तुम निःसन्देह वैरियोंको जीतोगे।"},{"c":11,"v":35,"sp":"sanjaya","sa":"एतच्छ्रुत्वा वचनं केशवस्य  कृताञ्जलिर्वेपमानः किरीटी ।\nनमस्कृत्वा भूय एवाह कृष्णं  सगद्गदं भीतभीतः प्रणम्य ॥","tr":"etacchrutvā vacanaṃ keśavasya  kṛtāñjalirvepamānaḥ kirīṭī\nnamaskṛtvā bhūya evāha kṛṣṇaṃ  sagadgadaṃ bhītabhītaḥ praṇamya","gs":"એતચ્છ્રુત્વા વચનં કેશવસ્ય  કૃતાઞ્જલિર્વેપમાનઃ કિરીટી ।\nનમસ્કૃત્વા ભૂય એવાહ કૃષ્ણં  સગદ્ગદં ભીતભીતઃ પ્રણમ્ય ॥","en":"Sanjaya said, Having heard that speech of Lord Krishna, Arjuna, with joined palms, trembling, prostrated himself, again addressing Krishna in a choked voice, bowing down, overwhelmed with fear.","hi":"सञ्जय बोले -- भगवान् केशवका यह वचन सुनकर भयसे कम्पित हुए किरीटी अर्जुन हाथ जोड़कर नमस्कार करके और अत्यन्त भयभीत होकर फिर प्रणाम करके गद्गदं वाणीसे भगवान् कृष्णसे बोले।"},{"c":11,"v":36,"sp":"arjuna","sa":"स्थाने हृषीकेश तव प्रकीर्त्या  जगत् प्रहृष्यत्यनुरज्यते च ।\nरक्षांसि भीतानि दिशो द्रवन्ति  सर्वे नमस्यन्ति च सिद्धसङ्घाः ॥","tr":"sthāne hṛṣīkeśa tava prakīrtyā  jagat prahṛṣyatyanurajyate ca\nrakṣāṃsi bhītāni diśo dravanti  sarve namasyanti ca siddhasaṅghāḥ","gs":"સ્થાને હૃષીકેશ તવ પ્રકીર્ત્યા  જગત્ પ્રહૃષ્યત્યનુરજ્યતે ચ ।\nરક્ષાંસિ ભીતાનિ દિશો દ્રવન્તિ  સર્વે નમસ્યન્તિ ચ સિદ્ધસઙ્ઘાઃ ॥","en":"Arjuna said, \"It is fitting, O Krishna, that the world delights and rejoices in Your praise; demons fly in fear in all directions and the hosts of the perfected ones bow to You.\"","hi":"अर्जुन बोले -- हे अन्तर्यामी भगवन् ! आपके नाम, गुण, लीलाका कीर्तन करनेसे यह सम्पूर्ण जगत् हर्षित हो रहा है और अनुराग(-प्रेम-) को प्राप्त हो रहा है। आपके नाम, गुण आदिके कीर्तनसे भयभीत होकर राक्षसलोग दसों दिशाओंमें भागते हुए जा रहे हैं और सम्पूर्ण सिद्धगण आपको नमस्कार कर रहे हैं। यह सब होना उचित ही है।"},{"c":11,"v":37,"sp":"arjuna","sa":"कस्माच्च ते न नमेरन्महात्मन्  गरीयसे ब्रह्मणोऽप्यादिकर्त्रे ।\nअनन्त देवेश जगन्निवास  त्वमक्षरं सदसत्तत्परं यत् ॥","tr":"kasmācca te na nameranmahātman  garīyase brahmaṇo'pyādikartre\nananta deveśa jagannivāsa  tvamakṣaraṃ sadasattatparaṃ yat","gs":"કસ્માચ્ચ તે ન નમેરન્મહાત્મન્  ગરીયસે બ્રહ્મણોઽપ્યાદિકર્ત્રે ।\nઅનન્ત દેવેશ જગન્નિવાસ  ત્વમક્ષરં સદસત્તત્પરં યત્ ॥","en":"And why should they not, O great Soul, bow to Thee Who art greater than all else, the primal cause even of the Creator (Brahma), O Infinite Being, O Lord of the gods, O Abode of the universe; Thou art the imperishabl
