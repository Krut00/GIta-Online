િમમદ્ભુતમ્ ।\nકેશવાર્જુનયોઃ પુણ્યં હૃષ્યામિ ચ મુહુર્મુહુઃ ॥","en":"O King, remembering this wonderful and holy dialogue between Krishna and Arjuna, I continually rejoice.","hi":"हे राजन् ! भगवान् श्रीकृष्ण और अर्जुनके इस पवित्र और अद्भुत संवादको याद कर-करके मैं बार-बार हर्षित हो रहा हूँ।"},{"c":18,"v":77,"sp":"sanjaya","sa":"तच्च संस्मृत्य संस्मृत्य रूपमत्यद्भुतं हरेः ।\nविस्मयो मे महान् राजन् हृष्यामि च पुनः पुनः ॥","tr":"tacca saṃsmṛtya saṃsmṛtya rūpamatyadbhutaṃ hareḥ\nvismayo me mahān rājan hṛṣyāmi ca punaḥ punaḥ","gs":"તચ્ચ સંસ્મૃત્ય સંસ્મૃત્ય રૂપમત્યદ્ભુતં હરેઃ ।\nવિસ્મયો મે મહાન્ રાજન્ હૃષ્યામિ ચ પુનઃ પુનઃ ॥","en":"And, remembering again and again that most wonderful form of Hari, I am filled with great wonder, O King; and I rejoice again and again.","hi":"हे राजन् ! भगवान् श्रीकृष्णके उस अत्यन्त अद्भुत विराट्रूपको याद कर-करके मेरेको बड़ा भारी आश्चर्य हो रहा है और मैं बार-बार हर्षित हो रहा हूँ।"},{"c":18,"v":78,"sp":"sanjaya","sa":"यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः ।\nतत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम ॥","tr":"yatra yogeśvaraḥ kṛṣṇo yatra pārtho dhanurdharaḥ |\ntatra śrīrvijayo bhūtirdhruvā nītirmatirmama ||","gs":"યત્ર યોગેશ્વરઃ કૃષ્ણો યત્ર પાર્થો ધનુર્ધરઃ ।\nતત્ર શ્રીર્વિજયો ભૂતિર્ધ્રુવા નીતિર્મતિર્મમ ॥","en":"Wherever Krishna, the Lord of Yoga, is; and wherever Arjuna, the wielder of the bow, is; there is prosperity, victory, happiness, and a firm policy; this is my conviction.","hi":"जहाँ योगेश्वर भगवान् श्रीकृष्ण हैं और जहाँ गाण्डीवधनुषधारी अर्जुन हैं, वहाँ ही श्री, विजय, विभूति और अचल नीति है -- ऐसा मेरा मत है।"}]</script>
<script type="application/json" id="CDATA">{"lessons":[{"id":"what-is-gita","refs":["1.1","2.7","18.73"],"en":{"t":"What is the Bhagavad Gita?","p":["The Bhagavad Gita is a conversation of 700 verses between two people: Arjuna, a warrior who has lost his nerve, and Krishna, his friend and charioteer, who helps him think clearly.","It is part of a much bigger epic called the Mahabharata. It sits in the Bhishma Parva (Book 6), chapters 23 to 40 of that book.","It is not a rulebook. It reads more like a long talk between a confused student and a patient teacher. Arjuna asks hard questions about duty, death, action and meaning, and Krishna answers them from many angles."],"faq":[["Is it only for Hindus?","It comes from Hindu tradition, but its questions are universal: what should I do, why should I act, how do I stay steady. People of many faiths and none read it as philosophy."],["Do I need to know Sanskrit?","No. Every verse here has a translation and a plain explanation. The Sanskrit is shown so you can see the original."]]},"hi":{"t":"भगवद्गीता क्या है?","p":["भगवद्गीता 700 श्लोकों की एक बातचीत है। एक ओर हैं अर्जुन — एक योद्धा जिसका हौसला टूट गया है। दूसरी ओर हैं श्रीकृष्ण — उनके मित्र और सारथी, जो उन्हें साफ़ सोचने में मदद करते हैं।","यह महाभारत नाम के बहुत बड़े महाकाव्य का हिस्सा है। यह भीष्म पर्व (छठा पर्व) के अध्याय 23 से 40 में आती है।","यह नियमों की किताब नहीं है। यह एक उलझे हुए शिष्य और धैर्यवान गुरु के बीच लंबी बातचीत जैसी है। अर्जुन कर्तव्य, मृत्यु, कर्म और जीवन के अर्थ पर कठिन सवाल पूछते हैं, और कृष्ण अलग-अलग तरह से उनका उत्तर देते हैं।"],"faq":[["क्या यह केवल हिंदुओं के लिए है?","यह हिंदू परंपरा से आई है, पर इसके सवाल सबके हैं: मुझे क्या करना चाहिए, कर्म क्यों करूँ, मन को स्थिर कैसे रखूँ। हर धर्म के और बिना धर्म वाले लोग भी इसे दर्शन के रूप में पढ़ते हैं।"],["क्या संस्कृत जानना ज़रूरी है?","नहीं। यहाँ हर श्लोक का अनुवाद और सरल व्याख्या है। संस्कृत इसलिए दी गई है ताकि आप मूल पाठ देख सकें।"]]},"gu":{"t":"ભગવદ્ગીતા શું છે?","p":["ભગવદ્ગીતા 700 શ્લોકોની એક વાતચીત છે. એક બાજુ અર્જુન છે — એક યોદ્ધા, જેની હિંમત તૂટી ગઈ છે. બીજી બાજુ શ્રીકૃષ્ણ છે — તેમના મિત્ર અને સારથિ, જે તેમને સ્પષ્ટ વિચારવામાં મદદ કરે છે.","તે મહાભારત નામના વિશાળ મહાકાવ્યનો ભાગ છે. તે ભીષ્મ પર્વ (છઠ્ઠું પર્વ)ના અધ્યાય 23 થી 40માં આવે છે.","આ નિયમોનું પુસ્તક નથી. તે મૂંઝાયેલા શિષ્ય અને ધીરજવાન ગુરુ વચ્ચેની લાંબી વાતચીત જેવી છે. અર્જુન ફરજ, મૃત્યુ, કર્મ અને જીવનના અર્થ વિશે અઘરા પ્રશ્નો પૂછે છે, અને કૃષ્ણ જુદી જુદી રીતે જવાબ આપે છે."],"faq":[["શું તે ફક્ત હિંદુઓ માટે છે?","તે હિંદુ પરંપરામાંથી આવે છે, પણ તેના પ્રશ્નો સૌના છે: મારે શું કરવું, શા માટે કર્મ કરવું, મનને સ્થિર કેવી રીતે રાખવું. દરેક ધર્મના અને કોઈ ધર્મ ન માનનારા લોકો પણ તેને તત્ત્વજ્ઞાન તરીકે વાંચે છે."],["શું સંસ્કૃત જાણવું જરૂરી છે?","ના. અહીં દરેક શ્લોકનો અનુવાદ અને સરળ સમજૂતી છે. સંસ્કૃત એટલા માટે છે કે તમે મૂળ લખાણ જોઈ શકો."]]}},{"id":"name-meaning","refs":[],"en":{"t":"What does the name mean?","p":["'Bhagavad' means 'of the Bhagavan', a title meaning the Blessed or Divine One, used here for Krishna. 'Gita' means 'song'. So the name means 'The Song of the Blessed One'.","It is called a song because it is written in verse, mostly in a metre called anushtubh (four lines of eight syllables). A few passages, especially in Chapter 11, use the longer trishtubh metre.","Each chapter ends with a colophon calling the Gita an Upanishad, a teaching on Brahman (brahma-vidya), and a scripture of yoga (yoga-shastra)."],"faq":[["Why 'Shrimad'?","'Shrimad' is a respectful prefix meaning glorious or auspicious. 'Shrimad Bhagavad Gita' is the formal name."]]},"hi":{"t":"नाम का अर्थ क्या है?","p":["'भगवद्' का अर्थ है 'भगवान का'। भगवान एक उपाधि है जिसका अर्थ है ऐश्वर्यवान या दिव्य, और यहाँ यह कृष्ण के लिए है। 'गीता' का अर्थ है 'गीत'। तो पूरा अर्थ है — 'भगवान का गीत'।","इसे गीत इसलिए कहते हैं क्योंकि यह छंद में लिखी है, ज़्यादातर अनुष्टुप छंद में (आठ-आठ अक्षरों की चार पंक्तियाँ)। कुछ हिस्से, ख़ासकर अध्याय 11 में, लंबे त्रिष्टुप छंद में हैं।","हर अध्याय के अंत में पुष्पिका आती है, जिसमें गीता को उपनिषद, ब्रह्मविद्या और योगशास्त्र कहा गया है।"],"faq":[["'श्रीमद्' क्यों?","'श्रीमद्' सम्मान का शब्द है, जिसका अर्थ है शोभायुक्त या मंगलमय। 'श्रीमद्भगवद्गीता' इसका औपचारिक नाम है।"]]},"gu":{"t":"નામનો અર્થ શું છે?","p":["'ભગવદ્' એટલે 'ભગવાનનું'. ભગવાન એક ઉપાધિ છે જેનો અર્થ દિવ્ય કે ઐશ્વર્યવાન થાય છે, અને અહીં તે કૃષ્ણ માટે છે. 'ગીતા' એટલે 'ગીત'. એટલે આખો અર્થ થાય — 'ભગવાનનું ગીત'.","તેને ગીત કહેવાય છે કારણ કે તે છંદમાં લખાયેલી છે, મોટે ભાગે અનુષ્ટુપ છંદમાં (આઠ-આઠ અક્ષરની ચાર પંક્તિઓ). કેટલાક ભાગ, ખાસ કરીને અધ્યાય 11માં, લાંબા ત્રિષ્ટુપ છંદમાં છે.","દરેક અધ્યાયના અંતે પુષ્પિકા આવે છે, જેમાં ગીતાને ઉપનિષદ, બ્રહ્મવિદ્યા અને યોગશાસ્ત્ર કહેવામાં આવી છે."],"faq":[["'શ્રીમદ્' શા માટે?","'શ્રીમદ્' આદરસૂચક શબ્દ છે, જેનો અર્થ શોભાયુક્ત કે મંગલમય થાય છે. 'શ્રીમદ્ભગવદ્ગીતા' તેનું ઔપચારિક નામ છે."]]}},{"id":"who-krishna","refs":["4.7","4.8","10.20"],"en":{"t":"Who is Shri Krishna?","p":["In the Mahabharata, Krishna is a prince of the Yadava clan from Dwaraka, a cousin and close friend of the Pandava brothers, and a skilled diplomat. Before the war he tries to make peace between the two sides.","He refuses to fight in the war himself and agrees to drive Arjuna's chariot. That is why he is standing next to Arjuna when the Gita is spoken.","In the Gita he speaks as more than a friend. He calls himself the source of all beings (10.8) and says he takes birth from age to age to protect goodness (4.7–4.8). Traditions understand this differently: many Vaishnava schools see Krishna as the Supreme God himself, Advaita sees him as speaking from identity with the one reality (Brahman), and some modern readers treat him as a symbol of the wise inner voice."],"faq":[["Was Krishna a historical person?","Tradition holds that he was. Historians have no independent evidence either way. This site marks that as a matter of belief, not established history."]]},"hi":{"t":"श्रीकृष्ण कौन हैं?","p":["महाभारत में कृष्ण द्वारका के यादव वंश के राजकुमार हैं, पांडवों के ममेरे भाई और घनिष्ठ मित्र, और एक कुशल राजनयिक। युद्ध से पहले वे दोनों पक्षों में शांति कराने की कोशिश करते हैं।","वे युद्ध में ख़ुद हथियार नहीं उठाते, बल्कि अर्जुन का रथ चलाना स्वीकार करते हैं। इसीलिए गीता के समय वे अर्जुन के पास खड़े हैं।","गीता में वे केवल मित्र की तरह नहीं बोलते। वे स्वयं को सभी प्राणियों का स्रोत बताते हैं (10.8) और कहते हैं कि धर्म की रक्षा के लिए वे युग-युग में जन्म लेते हैं (4.7–4.8)। परंपराएँ इसे अलग-अलग समझती हैं: कई वैष्णव संप्रदाय कृष्ण को स्वयं परमेश्वर मानते हैं, अद्वैत मत में वे एक ही सत्य (ब्रह्म) से एकता के भाव से बोलते हैं, और कुछ आधुनिक पाठक उन्हें भीतर की विवेकशील आवाज़ का प्रतीक मानते हैं।"],"faq":[["क्या कृष्ण ऐतिहासिक व्यक्ति थे?","परंपरा मानती है कि थे। इतिहासकारों के पास इसके पक्ष या विपक्ष में स्वतंत्र प्रमाण नहीं हैं। यह साइट इसे आस्था का विषय बताती है, सिद्ध इतिहास नहीं।"]]},"gu":{"t":"શ્રીકૃષ્ણ કોણ છે?","p":["મહાભારતમાં કૃષ્ણ દ્વારકાના યાદવ વંશના રાજકુમાર છે, પાંડવોના મામાના દીકરા ભાઈ અને ગાઢ મિત્ર, અને કુશળ રાજદૂત. યુદ્ધ પહેલાં તેઓ બંને પક્ષ વચ્ચે શાંતિ કરાવવાનો પ્રયાસ કરે છે.","તેઓ યુદ્ધમાં પોતે શસ્ત્ર નથી ઉપાડતા, પણ અર્જુનનો રથ ચલાવવાનું સ્વીકારે છે. એટલે જ ગીતા વખતે તેઓ અર્જુનની બાજુમાં છે.","ગીતામાં તેઓ ફક્ત મિત્ર તરીકે નથી બોલતા. તેઓ પોતાને બધા જીવોનું મૂળ કહે છે (10.8) અને કહે છે કે ધર્મના રક્ષણ માટે તેઓ યુગે યુગે જન્મ લે છે (4.7–4.8). પરંપરાઓ આને જુદી રીતે સમજે છે: ઘણા વૈષ્ણવ સંપ્રદાયો કૃષ્ણને સ્વયં પરમેશ્વર માને છે, અદ્વૈત મતમાં તેઓ એક જ સત્ય (બ્રહ્મ) સાથેની એકતાના ભાવે બોલે છે, અને કેટલાક આધુનિક વાચકો તેમને અંદરના વિવેકી અવાજનું પ્રતીક માને છે."],"faq":[["શું કૃષ્ણ ઐતિહાસિક વ્યક્તિ હતા?","પરંપરા માને છે કે હતા. ઇતિહાસકારો પાસે આના પક્ષે કે વિરુદ્ધ સ્વતંત્ર પુરાવા નથી. આ સાઇટ તેને શ્રદ્ધાનો વિષય ગણાવે છે, સાબિત ઇતિહાસ નહીં."]]}},{"id":"who-arjuna","refs":["1.28","2.7"],"en":{"t":"Who is Arjuna?","p":["Arjuna is the third of the five Pandava brothers and the best archer of his time. He is brave, skilled and respected.","That is what makes the Gita striking. The person who breaks down is not a coward. He is the strongest warrior on his side, and he collapses because he cares about the people he would have to kill.","Arjuna stands for anyone who has to act in a situation where every option causes harm, and who freezes because of it."],"faq":[["Why is he called Partha, Kaunteya, Dhananjaya?","These are his other names. Partha and Kaunteya mean 'son of Pritha/Kunti', his mother. Dhananjaya means 'winner of wealth'. Krishna uses them often in the verses."]]},"hi":{"t":"अर्जुन कौन हैं?","p":["अर्जुन पाँच पांडव भाइयों में तीसरे हैं और अपने समय के सबसे श्रेष्ठ धनुर्धर। वे बहादुर, कुशल और सम्मानित हैं।","इसी बात से गीता ख़ास बनती है। जो टूटता है वह कायर नहीं है। वह अपनी सेना का सबसे बड़ा योद्धा है, और वह इसलिए टूटता है क्योंकि उसे उन लोगों की परवाह है जिन्हें उसे मारना पड़ेगा।","अर्जुन हर उस व्यक्ति का प्रतीक हैं जिसे ऐसी स्थिति में फ़ैसला करना है जहाँ हर रास्ते में किसी न किसी का नुक़सान है, और जो इसी कारण रुक जाता है।"],"faq":[["उन्हें पार्थ, कौन्तेय, धनंजय क्यों कहते हैं?","ये उनके दूसरे नाम हैं। पार्थ और कौन्तेय का अर्थ है 'पृथा/कुंती का पुत्र'। धनंजय का अर्थ है 'धन को जीतने वाला'। कृष्ण श्लोकों में इन नामों का बार-बार प्रयोग करते हैं।"]]},"gu":{"t":"અર્જુન કોણ છે?","p":["અર્જુન પાંચ પાંડવ ભાઈઓમાં ત્રીજા છે અને પોતાના સમયના શ્રેષ્ઠ ધનુર્ધારી. તેઓ બહાદુર, કુશળ અને આદરણીય છે.","આ જ વાત ગીતાને ખાસ બનાવે છે. જે તૂટી પડે છે તે કાયર નથી. તે પોતાની સેનાનો સૌથી મોટો યોદ્ધો છે, અને તે એટલા માટે તૂટે છે કે જે લોકોને તેણે મારવા પડશે તેમની તેને ચિંતા છે.","અર્જુન એવી દરેક વ્યક્તિનું પ્રતીક છે જેને એવી સ્થિતિમાં નિર્ણય લેવાનો છે જ્યાં દરેક રસ્તે કોઈનું નુકસાન છે, અને જે એ કારણે અટકી જાય છે."],"faq":[["તેમને પાર્થ, કૌન્તેય, ધનંજય કેમ કહે છે?","આ તેમનાં બીજાં નામ છે. પાર્થ અને કૌન્તેય એટલે 'પૃથા/કુંતીનો પુત્ર'. ધનંજય એટલે 'ધન જીતનાર'. કૃષ્ણ શ્લોકોમાં આ નામો વારંવાર વાપરે છે."]]}},{"id":"mahabharata","refs":[],"en":{"t":"What is the Mahabharata?","p":["The Mahabharata is one of the two great Sanskrit epics of India (the other is the Ramayana). It has roughly 75,000–100,000 verses depending on the edition, which makes it one of the longest poems in the world.","Tradition credits it to the sage Vyasa. Scholars see it as a text that grew over several centuries, probably taking much of its present shape between about 400 BCE and 400 CE.","Its main story is a family feud over a kingdom that ends in a devastating war. Around that story it holds philosophy, law, ethics, stories within stories, and debates about what is right."],"faq":[["Is the Gita older or younger than the rest?","Scholars debate this. Many date the Gita to roughly the 2nd century BCE to the 2nd century CE. There is no single agreed date."]]},"hi":{"t":"महाभारत क्या है?","p":["महाभारत भारत के दो महान संस्कृत महाकाव्यों में से एक है (दूसरा रामायण है)। संस्करण के अनुसार इसमें लगभग 75,000 से 1,00,000 श्लोक हैं, जिससे यह दुनिया की सबसे लंबी कविताओं में से एक है।","परंपरा इसका रचयिता महर्षि व्यास को मानती है। विद्वानों के अनुसार यह ग्रंथ कई सदियों में बढ़ा, और इसका वर्तमान रूप लगभग 400 ई.पू. से 400 ई. के बीच बना।","इसकी मुख्य कथा एक राज्य को लेकर पारिवारिक झगड़े की है, जिसका अंत एक भयानक युद्ध में होता है। इस कथा के आसपास इसमें दर्शन, नीति, धर्मशास्त्र, कथाओं के भीतर कथाएँ और सही-ग़लत पर बहसें हैं।"],"faq":[["क्या गीता बाक़ी महाभारत से पुरानी है या नई?","इस पर विद्वानों में मतभेद है। कई विद्वान गीता को लगभग दूसरी सदी ई.पू. से दूसरी सदी ई. के बीच रखते हैं। कोई एक सर्वमान्य तिथि नहीं है।"]]},"gu":{"t":"મહાભારત શું છે?","p":["મહાભારત ભારતના બે મહાન સંસ્કૃત મહાકાવ્યોમાંનું એક છે (બીજું રામાયણ છે). આવૃત્તિ પ્રમાણે તેમાં આશરે 75,000 થી 1,00,000 શ્લોક છે, એટલે તે દુનિયાની સૌથી લાંબી કવિતાઓમાંની એક છે.","પરંપરા તેના રચયિતા મહર્ષિ વ્યાસને માને છે. વિદ્વાનોના મતે આ ગ્રંથ ઘણી સદીઓમાં વિકસ્યો, અને તેનું વર્તમાન સ્વરૂપ આશરે ઈ.સ.પૂ. 400 થી ઈ.સ. 400 વચ્ચે ઘડાયું.","તેની મુખ્ય કથા એક રાજ્ય માટેના કૌટુંબિક ઝઘડાની છે, જેનો અંત ભયાનક યુદ્ધમાં આવે છે. આ કથાની આસપાસ તેમાં તત્ત્વજ્ઞાન, નીતિ, ધર્મશાસ્ત્ર, કથામાં કથાઓ અને સાચા-ખોટા વિશેની ચર્ચાઓ છે."],"faq":[["ગીતા બાકીના મહાભારત કરતાં જૂની છે કે નવી?","આ વિશે વિદ્વાનોમાં મતભેદ છે. ઘણા વિદ્વાનો ગીતાને આશરે ઈ.સ.પૂ. બીજી સદીથી ઈ.સ. બીજી સદી વચ્ચે મૂકે છે. કોઈ એક સર્વમાન્ય તારીખ નથી."]]}},{"id":"kurukshetra","refs":["1.1"],"en":{"t":"What is Kurukshetra?","p":["Kurukshetra is the plain where the war is fought. It is identified with the area around the present-day town of Kurukshetra in Haryana.","The very first verse calls it 'dharma-kshetra', the field of dharma. Many readers take this double name as a hint: the battlefield is also a field of moral choice.","Some commentators read Kurukshetra symbolically as the human body or mind, where good and bad tendencies fight. That is an interpretation, not what the text literally says."],"faq":[]},"hi":{"t":"कुरुक्षेत्र क्या है?","p":["कुरुक्षेत्र वह मैदान है जहाँ युद्ध होता है। इसे आज के हरियाणा के कुरुक्षेत्र नगर के आसपास का क्षेत्र माना जाता है।","गीता का पहला श्लोक ही इसे 'धर्मक्षेत्र' कहता है। कई पाठक इस दोहरे नाम को एक संकेत मानते हैं: युद्धभूमि नैतिक फ़ैसले की भूमि भी है।","कुछ टीकाकार कुरुक्षेत्र को प्रतीक के रूप में मनुष्य का शरीर या मन मानते हैं, जहाँ अच्छी और बुरी प्रवृत्तियाँ लड़ती हैं। यह एक व्याख्या है, पाठ का शाब्दिक अर्थ नहीं।"],"faq":[]},"gu":{"t":"કુરુક્ષેત્ર શું છે?","p":["કુરુક્ષેત્ર એ મેદાન છે જ્યાં યુદ્ધ થાય છે. તેને આજના હરિયાણાના કુરુક્ષેત્ર નગરની આસપાસનો વિસ્તાર માનવામાં આવે છે.","ગીતાનો પહેલો શ્લોક જ તેને 'ધર્મક્ષેત્ર' કહે છે. ઘણા વાચકો આ બેવડા નામને સંકેત માને છે: યુદ્ધભૂમિ નૈતિક પસંદગીની ભૂમિ પણ છે.","કેટલાક ટીકાકારો કુરુક્ષેત્રને પ્રતીક તરીકે માણસનું શરીર કે મન માને છે, જ્યાં સારી અને ખરાબ વૃત્તિઓ લડે છે. આ એક અર્થઘટન છે, લખાણનો શાબ્દિક અર્થ નહીં."],"faq":[]}},{"id":"why-conversation","refs":["1.1","1.21","2.7"],"en":{"t":"Why did the conversation happen?","p":["The Gita is told as a report. The blind king Dhritarashtra asks his minister Sanjaya what is happening on the battlefield (1.1). Sanjaya, given divine sight by Vyasa, describes the scene and repeats the conversation word for word.","On the battlefield, Arjuna asks Krishna to drive his chariot between the two armies so he can see who he must fight (1.21–1.23). Seeing his teachers, grandfather, cousins and friends on the other side, he breaks down.","The rest of the Gita is Krishna's response to that crisis. Every teaching starts from one practical problem: a person who no longer knows what the right action is."],"faq":[]},"hi":{"t":"यह बातचीत क्यों हुई?","p":["गीता एक वृत्तांत के रूप में कही गई है। अंधे राजा धृतराष्ट्र अपने मंत्री संजय से युद्धभूमि का हाल पूछते हैं (1.1)। व्यास जी से दिव्य दृष्टि पाए संजय दृश्य का वर्णन करते हैं और पूरी बातचीत शब्दशः सुनाते हैं।","युद्धभूमि में अर्जुन कृष्ण से कहते हैं कि रथ को दोनों सेनाओं के बीच ले चलें, ताकि वे देख सकें कि किससे लड़ना है (1.21–1.23)। दूसरी तरफ़ अपने गुरुओं, दादा, भाइयों और मित्रों को देखकर वे टूट जाते हैं।","बाक़ी गीता इसी संकट का कृष्ण द्वारा दिया उत्तर है। हर उपदेश एक व्यावहारिक समस्या से शुरू होता है: एक व्यक्ति जिसे अब पता नहीं कि सही कर्म क्या है।"],"faq":[]},"gu":{"t":"આ વાતચીત કેમ થઈ?","p":["ગીતા એક અહેવાલ તરીકે કહેવાઈ છે. અંધ રાજા ધૃતરાષ્ટ્ર પોતાના મંત્રી સંજયને યુદ્ધભૂમિના સમાચાર પૂછે છે (1.1). વ્યાસજી પાસેથી દિવ્ય દૃષ્ટિ પામેલા સંજય દૃશ્ય વર્ણવે છે અને આખી વાતચીત શબ્દશઃ કહે છે.","યુદ્ધભૂમિમાં અર્જુન કૃષ્ણને કહે છે કે રથને બંને સેનાની વચ્ચે લઈ જાઓ, જેથી તેઓ જોઈ શકે કે કોની સામે લડવાનું છે (1.21–1.23). સામે પોતાના ગુરુઓ, દાદા, ભાઈઓ અને મિત્રોને જોઈને તેઓ ભાંગી પડે છે.","બાકીની ગીતા આ સંકટનો કૃષ્ણે આપેલો જવાબ છે. દરેક ઉપદેશ એક વ્યવહારુ સમસ્યાથી શરૂ થાય છે: એક વ્યક્તિ જેને હવે ખબર નથી કે સાચું કર્મ શું છે."],"faq":[]}},{"id":"arjuna-dilemma","refs":["1.31","1.36","1.45","2.6"],"en":{"t":"What was Arjuna's dilemma?","p":["Arjuna's problem is a clash between two duties. As a warrior, his duty is to fight an unjust ruler. As a grandson, student and relative, his duty is to protect and respect his elders and family.","He also fears the wider consequences: if the families are destroyed, traditions will collapse and society will fall into disorder (1.40–1.44).","He says it would be better to live by begging than to enjoy a kingdom stained with the blood of his teachers (2.5). He cannot even tell which outcome would be better, winning or losing (2.6)."],"faq":[["Was Arjuna wrong to feel this way?","The text does not mock his feelings. Krishna treats them as real but confused, and spends seventeen chapters helping him see the situation more clearly."]]},"hi":{"t":"अर्जुन की दुविधा क्या थी?","p":["अर्जुन की समस्या दो कर्तव्यों का टकराव है। योद्धा के रूप में उनका कर्तव्य अन्यायी शासक से लड़ना है। पोते, शिष्य और संबंधी के रूप में उनका कर्तव्य बड़ों और परिवार का आदर और रक्षा करना है।","उन्हें बड़े परिणामों का भी डर है: अगर कुल नष्ट हुए तो परंपराएँ टूटेंगी और समाज में अव्यवस्था फैलेगी (1.40–1.44)।","वे कहते हैं कि गुरुओं के ख़ून से सना राज्य भोगने से भीख माँगकर जीना अच्छा है (2.5)। वे यह भी तय नहीं कर पाते कि जीतना अच्छा होगा या हारना (2.6)।"],"faq":[["क्या अर्जुन का ऐसा महसूस करना ग़लत था?","पाठ उनकी भावनाओं का मज़ाक़ नहीं उड़ाता। कृष्ण उन्हें सच्चा पर उलझा हुआ मानते हैं, और सत्रह अध्यायों तक उन्हें स्थिति साफ़ देखने में मदद करते हैं।"]]},"gu":{"t":"અર્જુનની દ્વિધા શું હતી?","p":["અર્જુનની સમસ્યા બે ફરજો વચ્ચેનો ટકરાવ છે. યોદ્ધા તરીકે તેમની ફરજ અન્યાયી શાસક સામે લડવાની છે. પૌત્ર, શિષ્ય અને સગા તરીકે તેમની ફરજ વડીલો અને કુટુંબનો આદર અને રક્ષણ કરવાની છે.","તેમને મોટાં પરિણામોનો પણ ડર છે: જો કુળ નાશ પામે તો પરંપરાઓ તૂટશે અને સમાજમાં અવ્યવસ્થા ફેલાશે (1.40–1.44).","તેઓ કહે છે કે ગુરુઓના લોહીથી ખરડાયેલું રાજ્ય ભોગવવા કરતાં ભિક્ષા માગીને જીવવું સારું (2.5). તેઓ એ પણ નક્કી નથી કરી શકતા કે જીતવું સારું કે હારવું (2.6)."],"faq":[["શું અર્જુનને આવું લાગવું ખોટું હતું?","લખાણ તેમની લાગણીઓની મજાક નથી ઉડાવતું. કૃષ્ણ તેમને સાચી પણ મૂંઝાયેલી માને છે, અને સત્તર અધ્યાય સુધી તેમને સ્થિતિ સ્પષ્ટ જોવામાં મદદ કરે છે."]]}},{"id":"why-refuse","refs":["1.28","1.29","1.47","2.9"],"en":{"t":"Why did Arjuna refuse to fight?","p":["The text gives physical and emotional signs: his limbs give way, his mouth dries, his body trembles, his bow Gandiva slips from his hand (1.28–1.30).","He gives reasons too: killing relatives is a sin, nothing good can come of it, and he would rather be killed unresisting (1.46).","At the end of Chapter 1 he drops his bow and sits down in the chariot, overwhelmed by grief (1.47). In 2.9 he says plainly, 'I will not fight,' and falls silent."],"faq":[]},"hi":{"t":"अर्जुन ने लड़ने से मना क्यों किया?","p":["पाठ शारीरिक और भावनात्मक लक्षण बताता है: उनके अंग शिथिल हो जाते हैं, मुँह सूख जाता है, शरीर काँपने लगता है, गाण्डीव धनुष हाथ से फिसलता है (1.28–1.30)।","वे कारण भी देते हैं: संबंधियों को मारना पाप है, इससे कुछ अच्छा नहीं होगा, और वे बिना विरोध किए मारे जाना पसंद करेंगे (1.46)।","पहले अध्याय के अंत में वे धनुष रखकर शोक से भरे रथ में बैठ जाते हैं (1.47)। 2.9 में वे साफ़ कहते हैं, 'मैं नहीं लड़ूँगा,' और चुप हो जाते हैं।"],"faq":[]},"gu":{"t":"અર્જુને લડવાની ના કેમ પાડી?","p":["લખાણ શારીરિક અને ભાવનાત્મક લક્ષણો આપે છે: તેમનાં અંગ ઢીલાં પડે છે, મોઢું સુકાય છે, શરીર ધ્રૂજે છે, ગાંડીવ ધનુષ્ય હાથમાંથી સરકે છે (1.28–1.30).","તેઓ કારણો પણ આપે છે: સગાંને મારવા પાપ છે, તેમાંથી કંઈ સારું નહીં થાય, અને વિરોધ કર્યા વગર મરી જવું તેમને વધુ ગમશે (1.46).","પહેલા અધ્યાયના અંતે તેઓ ધનુષ્ય મૂકીને શોકમાં રથમાં બેસી જાય છે (1.47). 2.9માં તેઓ સ્પષ્ટ કહે છે, 'હું નહીં લડું,' અને ચૂપ થઈ જાય છે."],"faq":[]}},{"id":"krishna-explaining","refs":["2.11","2.47","18.63","18.66"],"en":{"t":"What was Krishna trying to explain?","p":["Krishna does not simply order Arjuna to fight. He tries to change how Arjuna sees himself and the situation.","He works on three levels. First, who we really are: the self (atman) is not destroyed when the body dies (Ch. 2). Second, how to act: do your duty without being driven by greed for results (Ch. 2–6). Third, what to hold on to: devotion and surrender to the Divine, and knowledge of what is lasting (Ch. 7–18).","At the end he leaves the choice to Arjuna: 'Reflect on this fully, then do as you wish' (18.63). Arjuna answers that his confusion is gone and he will act (18.73)."],"faq":[["Does the Gita glorify war?","Readers disagree. Some read it as a justification for a just war in its setting. Gandhi and others read the battle as a symbol of inner struggle. The text itself is set in a real war, and its central concern is how to act rightly when action is unavoidable."]]},"hi":{"t":"कृष्ण क्या समझाना चाहते थे?","p":["कृष्ण अर्जुन को केवल लड़ने का आदेश नहीं देते। वे यह बदलने की कोशिश करते हैं कि अर्जुन ख़ुद को और स्थिति को कैसे देखते हैं।","वे तीन स्तरों पर बात करते हैं। पहला, हम असल में कौन हैं: शरीर के मरने पर आत्मा नष्ट नहीं होती (अध्याय 2)। दूसरा, कर्म कैसे करें: फल के लोभ से नहीं, कर्तव्य समझकर (अध्याय 2–6)। तीसरा, किसका सहारा लें: ईश्वर के प्रति भक्ति और शरणागति, और जो स्थायी है उसका ज्ञान (अध्याय 7–18)।","अंत में वे फ़ैसला अर्जुन पर छोड़ते हैं: 'इस पर पूरी तरह विचार करो, फिर जैसा चाहो वैसा करो' (18.63)। अर्जुन कहते हैं कि उनका मोह दूर हो गया है और वे कर्म करेंगे (18.73)।"],"faq":[["क्या गीता युद्ध का महिमामंडन करती है?","पाठकों के मत अलग हैं। कुछ इसे अपने संदर्भ में न्यायपूर्ण युद्ध का समर्थन मानते हैं। गांधी जी और अन्य लोगों ने युद्ध को भीतरी संघर्ष का प्रतीक माना। पाठ ख़ुद एक वास्तविक युद्ध के बीच है, और उसकी मुख्य चिंता यह है कि जब कर्म टाला न जा सके तब सही ढंग से कैसे करें।"]]},"gu":{"t":"કૃષ્ણ શું સમજાવવા માગતા હતા?","p":["કૃષ્ણ અર્જુનને ફક્ત લડવાનો હુકમ નથી આપતા. તેઓ એ બદલવાનો પ્રયાસ કરે છે કે અર્જુન પોતાને અને સ્થિતિને કેવી રીતે જુએ છે.","તેઓ ત્રણ સ્તરે વાત કરે છે. પહેલું, આપણે ખરેખર કોણ છીએ: શરીર મરે ત્યારે આત્મા નાશ નથી પામતો (અધ્યાય 2). બીજું, કર્મ કેવી રીતે કરવું: ફળના લોભથી નહીં, ફરજ સમજીને (અધ્યાય 2–6). ત્રીજું, કોનો આધાર લેવો: ઈશ્વર પ્રત્યે ભક્તિ અને શરણાગતિ, અને જે સ્થાયી છે તેનું જ્ઞાન (અધ્યાય 7–18).","અંતે તેઓ નિર્ણય અર્જુન પર છોડે છે: 'આના પર પૂરો વિચાર કરો, પછી જેમ ઇચ્છો તેમ કરો' (18.63). અર્જુન કહે છે કે તેમનો મોહ દૂર થયો છે અને તેઓ કર્મ કરશે (18.73)."],"faq":[["શું ગીતા યુદ્ધનો મહિમા કરે છે?","વાચકોના મત જુદા છે. કેટલાક તેને પોતાના સંદર્ભમાં ન્યાયી યુદ્ધનું સમર્થન માને છે. ગાંધીજી અને બીજા લોકોએ યુદ્ધને અંદરના સંઘર્ષનું પ્રતીક માન્યું. લખાણ પોતે એક વાસ્તવિક યુદ્ધની વચ્ચે છે, અને તેની મુખ્ય ચિંતા એ છે કે કર્મ ટાળી ન શકાય ત્યારે તે સાચી રીતે કેવી રીતે કરવું."]]}},{"id":"key-ideas","refs":["2.22","2.47","3.35","6.23","18.66"],"en":{"t":"Dharma, Karma, Yoga, Moksha, Atman, Brahman","p":["Dharma: what holds things together. For a person it means right conduct and one's proper duty in a role.","Karma: action, and the idea that actions have consequences that shape our future.","Yoga: literally 'joining'. In the Gita it means a disciplined way of living or acting that connects us with what is highest. It does not mean only physical postures.","Moksha: liberation from the cycle of birth and death and from suffering.","Atman: the true self, the conscious witness, which the Gita says is unborn and undying.","Brahman: the one ultimate reality behind everything. Schools disagree on how Atman and Brahman relate. The Glossary has a full page on each."],"faq":[]},"hi":{"t":"धर्म, कर्म, योग, मोक्ष, आत्मा, ब्रह्म","p":["धर्म: जो चीज़ों को संभाले रखता है। व्यक्ति के लिए इसका अर्थ है सही आचरण और अपनी भूमिका का कर्तव्य।","कर्म: क्रिया, और यह विचार कि हर कर्म का परिणाम होता है जो हमारा भविष्य बनाता है।","योग: शाब्दिक अर्थ 'जोड़ना'। गीता में इसका अर्थ है जीने या कर्म करने का एक अनुशासित ढंग जो हमें सर्वोच्च से जोड़ता है। इसका अर्थ केवल आसन नहीं है।","मोक्ष: जन्म-मृत्यु के चक्र और दुःख से मुक्ति।","आत्मा: सच्चा स्वरूप, चेतन साक्षी, जिसे गीता अजन्मा और अमर कहती है।","ब्रह्म: सबके पीछे का एक परम सत्य। आत्मा और ब्रह्म का संबंध क्या है, इस पर संप्रदायों में मतभेद है। शब्दकोश में हर एक पर पूरा पेज है।"],"faq":[]},"gu":{"t":"ધર્મ, કર્મ, યોગ, મોક્ષ, આત્મા, બ્રહ્મ","p":["ધર્મ: જે બધું ટકાવી રાખે છે. વ્યક્તિ માટે તેનો અર્થ સાચું આચરણ અને પોતાની ભૂમિકાની ફરજ થાય છે.","કર્મ: ક્રિયા, અને એ વિચાર કે દરેક કર્મનું પરિણામ આવે છે જે આપણું ભવિષ્ય ઘડે છે.","યોગ: શાબ્દિક અર્થ 'જોડવું'. ગીતામાં તેનો અર્થ જીવવાની કે કર્મ કરવાની એક શિસ્તબદ્ધ રીત છે જે આપણને સર્વોચ્ચ સાથે જોડે છે. તેનો અર્થ ફક્ત આસનો નથી.","મોક્ષ: જન્મ-મરણના ચક્ર અને દુઃખમાંથી મુક્તિ.","આત્મા: સાચું સ્વરૂપ, ચેતન સાક્ષી, જેને ગીતા અજન્મા અને અમર કહે છે.","બ્રહ્મ: બધાની પાછળનું એક પરમ સત્ય. આત્મા અને બ્રહ્મનો સંબંધ શું છે તે વિશે સંપ્રદાયોમાં મતભેદ છે. શબ્દકોશમાં દરેક પર પૂરું પાનું છે."],"faq":[]}},{"id":"upanishads","refs":["2.19","2.20"],"en":{"t":"The Gita and the Upanishads","p":["The Upanishads are older philosophical texts at the end of the Vedas. They explore the self, ultimate reality and liberation.","The Gita draws heavily on them. Some verses closely echo the Katha Upanishad: for example, Gita 2.19–2.20 on the self that neither kills nor is killed closely parallels Katha Upanishad 1.2.18–19.","A traditional verse compares the Upanishads to cows, Krishna to the milker, Arjuna to the calf and the Gita to the milk. Together with the Upanishads and the Brahma Sutras, the Gita forms the 'prasthana traya', the three foundational texts of Vedanta. That is why the great teachers Shankara, Ramanuja and Madhva each wrote a commentary on it."],"faq":[]},"hi":{"t":"गीता और उपनिषद","p":["उपनिषद वेदों के अंत में आने वाले पुराने दार्शनिक ग्रंथ हैं। वे आत्मा, परम सत्य और मुक्ति पर विचार करते हैं।","गीता उनसे बहुत कुछ लेती है। कुछ श्लोक कठोपनिषद से बहुत मिलते हैं: जैसे गीता 2.19–2.20 में आत्मा के न मारने और न मारे जाने की बात कठोपनिषद 1.2.18–19 से मिलती है।","एक पारंपरिक श्लोक कहता है कि उपनिषद गायें हैं, कृष्ण दुहने वाले हैं, अर्जुन बछड़ा है और गीता दूध है। उपनिषदों और ब्रह्मसूत्र के साथ गीता 'प्रस्थानत्रयी' बनाती है — वेदांत के तीन आधार ग्रंथ। इसीलिए शंकराचार्य, रामानुजाचार्य और मध्वाचार्य, तीनों ने इस पर भाष्य लिखा।"],"faq":[]},"gu":{"t":"ગીતા અને ઉપનિષદો","p":["ઉપનિષદો વેદોના અંતે આવતા જૂના તત્ત્વજ્ઞાનના ગ્રંથો છે. તે આત્મા, પરમ સત્ય અને મુક્તિ વિશે વિચારે છે.","ગીતા તેમાંથી ઘણું લે છે. કેટલાક શ્લોક કઠ ઉપનિષદ સાથે ખૂબ મળતા આવે છે: જેમ કે ગીતા 2.19–2.20માં આત્મા ન મારે અને ન મરે તે વાત કઠ ઉપનિષદ 1.2.18–19 સાથે મળતી આવે છે.","એક પરંપરાગત શ્લોક કહે છે કે ઉપનિષદો ગાયો છે, કૃષ્ણ દોહનાર છે, અર્જુન વાછરડું છે અને ગીતા દૂધ છે. ઉપનિષદો અને બ્રહ્મસૂત્ર સાથે ગીતા 'પ્રસ્થાનત્રયી' બનાવે છે — વેદાંતના ત્રણ પાયાના ગ્રંથ. એટલે જ શંકરાચાર્ય, રામાનુજાચાર્ય અને મધ્વાચાર્ય ત્રણેયે તેના પર ભાષ્ય લખ્યું."],"faq":[]}},{"id":"gita-vs-mahabharata","refs":[],"en":{"t":"The Gita vs the Mahabharata","p":["The Mahabharata is the whole story: the family, the feud, the war and what follows. The Gita is a short philosophical pause inside it, about 700 verses out of roughly 100,000.","The Mahabharata is mostly narrative. The Gita is almost entirely teaching.","Reading the Gita without the story risks missing why Arjuna asks what he asks. Reading the story without the Gita misses its most-studied philosophical section."],"faq":[]},"hi":{"t":"गीता और महाभारत में अंतर","p":["महाभारत पूरी कथा है: परिवार, झगड़ा, युद्ध और उसके बाद की घटनाएँ। गीता उसके भीतर एक छोटा दार्शनिक ठहराव है, लगभग 1,00,000 में से 700 श्लोक।","महाभारत ज़्यादातर कथा है। गीता लगभग पूरी उपदेश है।","कथा के बिना गीता पढ़ने पर यह समझना कठिन होता है कि अर्जुन वे सवाल क्यों पूछ रहे हैं। गीता के बिना कथा पढ़ने पर उसका सबसे ज़्यादा पढ़ा जाने वाला दार्शनिक हिस्सा छूट जाता है।"],"faq":[]},"gu":{"t":"ગીતા અને મહાભારતમાં તફાવત","p":["મહાભારત આખી કથા છે: કુટુંબ, ઝઘડો, યુદ્ધ અને પછીની ઘટનાઓ. ગીતા તેની અંદર એક નાનો તાત્ત્વિક વિરામ છે, આશરે 1,00,000માંથી 700 શ્લોક.","મહાભારત મોટે ભાગે કથા છે. ગીતા લગભગ પૂરેપૂરી ઉપદેશ છે.","કથા વગર ગીતા વાંચીએ તો સમજવું અઘરું પડે કે અર્જુન એ પ્રશ્નો કેમ પૂછે છે. ગીતા વગર કથા વાંચીએ તો તેનો સૌથી વધુ અભ્યાસ થતો તાત્ત્વિક ભાગ છૂટી જાય છે."],"faq":[]}},{"id":"structure","refs":[],"en":{"t":"How is the Gita structured?","p":["There are 18 chapters. A common traditional division groups them in three sets of six: Chapters 1–6 emphasise action (karma), 7–12 emphasise devotion (bhakti), and 13–18 emphasise knowledge (jnana). This is a helpful guide, not a strict rule; all three themes run through the whole text.","There are four speakers. Dhritarashtra speaks once (1.1). Sanjaya narrates. Arjuna asks questions. Krishna gives almost all the teaching.","Each chapter has a name ending in 'Yoga', describing its main subject, such as Karma Yoga (the yoga of action)."],"faq":[]},"hi":{"t":"गीता की संरचना कैसी है?","p":["गीता में 18 अध्याय हैं। एक प्रचलित पारंपरिक विभाजन इन्हें छह-छह के तीन समूहों में बाँटता है: अध्याय 1–6 में कर्म पर ज़ोर, 7–12 में भक्ति पर, और 13–18 में ज्ञान पर। यह एक सहायक मार्गदर्शन है, कठोर नियम नहीं; तीनों विषय पूरी गीता में चलते हैं।","इसमें चार वक्ता हैं। धृतराष्ट्र एक बार बोलते हैं (1.1)। संजय वर्णन करते हैं। अर्जुन प्रश्न पूछते हैं। कृष्ण लगभग सारा उपदेश देते हैं।","हर अध्याय का नाम 'योग' पर ख़त्म होता है और उसके मुख्य विषय को बताता है, जैसे कर्मयोग।"],"faq":[]},"gu":{"t":"ગીતાની રચના કેવી છે?","p":["ગીતામાં 18 અધ્યાય છે. એક પ્રચલિત પરંપરાગત વિભાજન તેમને છ-છના ત્રણ જૂથમાં વહેંચે છે: અધ્યાય 1–6માં કર્મ પર ભાર, 7–12માં ભક્તિ પર, અને 13–18માં જ્ઞાન પર. આ એક મદદરૂપ માર્ગદર્શન છે, કડક નિયમ નહીં; ત્રણેય વિષય આખી ગીતામાં ચાલે છે.","તેમાં ચાર વક્તા છે. ધૃતરાષ્ટ્ર એક વાર બોલે છે (1.1). સંજય વર્ણન કરે છે. અર્જુન પ્રશ્નો પૂછે છે. કૃષ્ણ લગભગ બધો ઉપદેશ આપે છે.","દરેક અધ્યાયનું નામ 'યોગ'થી પૂરું થાય છે અને તેનો મુખ્ય વિષય દર્શાવે છે, જેમ કે કર્મયોગ."],"faq":[]}},{"id":"why-700","refs":["13.1"],"en":{"t":"Why 18 chapters and about 700 shlokas?","p":["The number 700 is the count in the standard text that Shankara commented on in the 8th century, and it has been the accepted count since then.","The speakers' share in that count: Krishna about 574, Arjuna about 84, Sanjaya about 41 and Dhritarashtra 1.","Some editions start Chapter 13 with an extra verse in which Arjuna asks about prakriti and purusha. This site follows that edition, so it shows 701 entries and Chapter 13 has 35 verses. Some verse numbers in Chapter 13 are therefore one higher than in 700-verse editions.","The number 18 also appears elsewhere in the Mahabharata: 18 books, 18 armies (akshauhinis) and 18 days of war. Tradition often notes this; it is a pattern, not proof of anything."],"faq":[]},"hi":{"t":"18 अध्याय और लगभग 700 श्लोक क्यों?","p":["700 की संख्या उस मानक पाठ की है जिस पर आठवीं सदी में शंकराचार्य ने भाष्य लिखा, और तब से यही संख्या मान्य है।","इसमें वक्ताओं का हिस्सा: कृष्ण लगभग 574, अर्जुन लगभग 84, संजय लगभग 41 और धृतराष्ट्र 1।","कुछ संस्करणों में अध्याय 13 एक अतिरिक्त श्लोक से शुरू होता है, जिसमें अर्जुन प्रकृति और पुरुष के बारे में पूछते हैं। यह साइट उसी संस्करण को मानती है, इसलिए यहाँ 701 श्लोक हैं और अध्याय 13 में 35 श्लोक हैं। इस कारण अध्याय 13 के कुछ श्लोक-क्रमांक 700 वाले संस्करणों से एक ज़्यादा हैं।","18 की संख्या महाभारत में और जगह भी आती है: 18 पर्व, 18 अक्षौहिणी सेनाएँ और 18 दिन का युद्ध। परंपरा अक्सर इसका उल्लेख करती है; यह एक संयोग-सा पैटर्न है, किसी बात का प्रमाण नहीं।"],"faq":[]},"gu":{"t":"18 અધ્યાય અને આશરે 700 શ્લોક શા માટે?","p":["700ની સંખ્યા એ પ્રમાણભૂત પાઠની છે જેના પર આઠમી સદીમાં શંકરાચાર્યે ભાષ્ય લખ્યું, અને ત્યારથી આ જ સંખ્યા માન્ય છે.","તેમાં વક્તાઓનો હિસ્સો: કૃષ્ણ આશરે 574, અર્જુન આશરે 84, સંજય આશરે 41 અને ધૃતરાષ્ટ્ર 1.","કેટલીક આવૃત્તિઓમાં અધ્યાય 13 એક વધારાના શ્લોકથી શરૂ થાય છે, જેમાં અર્જુન પ્રકૃતિ અને પુરુષ વિશે પૂછે છે. આ સાઇટ એ જ આવૃત્તિને અનુસરે છે, એટલે અહીં 701 શ્લોક છે અને અધ્યાય 13માં 35 શ્લોક છે. આ કારણે અધ્યાય 13ના કેટલાક શ્લોક-ક્રમાંક 700 વાળી આવૃત્તિઓ કરતાં એક વધારે છે.","18ની સંખ્યા મહાભારતમાં બીજે પણ આવે છે: 18 પર્વ, 18 અક્ષૌહિણી સેના અને 18 દિવસનું યુદ્ધ. પરંપરા ઘણી વાર આની નોંધ લે છે; આ એક પેટર્ન છે, કોઈ વાતનો પુરાવો નહીં."],"faq":[]}}],"story":[{"tag":"trad","en":["The Kuru family","King Vichitravirya's sons are Dhritarashtra, born blind, and Pandu. Because of his blindness, Dhritarashtra is passed over and Pandu becomes king."],"hi":["कुरु वंश","राजा विचित्रवीर्य के पुत्र हैं धृतराष्ट्र, जो जन्म से अंधे हैं, और पांडु। अंधेपन के कारण धृतराष्ट्र की जगह पांडु राजा बनते हैं।"],"gu":["કુરુ વંશ","રાજા વિચિત્રવીર્યના પુત્રો છે ધૃતરાષ્ટ્ર, જે જન્મથી અંધ છે, અને પાંડુ. અંધત્વને કારણે ધૃતરાષ્ટ્રને બદલે પાંડુ રાજા બને છે."]},{"tag":"trad","en":["Two sets of cousins","Pandu's five sons are the Pandavas: Yudhishthira, Bhima, Arjuna, Nakula and Sahadeva. Dhritarashtra's hundred sons, led by Duryodhana, are the Kauravas. They grow up together under the teachers Kripa and Drona, with the elder Bhishma watching over the family."],"hi":["दो चचेरे परिवार","पांडु के पाँच पुत्र पांडव हैं: युधिष्ठिर, भीम, अर्जुन, नकुल और सहदेव। धृतराष्ट्र के सौ पुत्र, जिनमें दुर्योधन सबसे बड़ा है, कौरव हैं। वे कृपाचार्य और द्रोणाचार्य से साथ-साथ शिक्षा पाते हैं, और भीष्म पितामह पूरे परिवार की देखरेख करते हैं।"],"gu":["બે પિતરાઈ પરિવાર","પાંડુના પાંચ પુત્રો પાંડવો છે: યુધિષ્ઠિર, ભીમ, અર્જુન, નકુલ અને સહદેવ. ધૃતરાષ્ટ્રના સો પુત્રો, જેમાં દુર્યોધન સૌથી મોટો છે, કૌરવો છે. તેઓ કૃપાચાર્ય અને દ્રોણાચાર્ય પાસે સાથે ભણે છે, અને ભીષ્મ પિતામહ આખા પરિવારનું ધ્યાન રાખે છે."]},{"tag":"trad","en":["Rivalry over the throne","After Pandu's death, Dhritarashtra rules. Duryodhana resents the Pandavas and makes several attempts on their lives, including the house of lac. The kingdom is split, and the Pandavas build their capital at Indraprastha."],"hi":["सिंहासन के लिए होड़","पांडु की मृत्यु के बाद धृतराष्ट्र शासन करते हैं। दुर्योधन पांडवों से जलता है और उन्हें मारने की कई कोशिशें करता है, जैसे लाक्षागृह। राज्य बँटता है और पांडव इंद्रप्रस्थ में अपनी राजधानी बनाते हैं।"],"gu":["સિંહાસન માટે હરીફાઈ","પાંડુના મૃત્યુ પછી ધૃતરાષ્ટ્ર રાજ કરે છે. દુર્યોધન પાંડવોની ઈર્ષા કરે છે અને તેમને મારવાના ઘણા પ્રયાસ કરે છે, જેમ કે લાક્ષાગૃહ. રાજ્ય વહેંચાય છે અને પાંડવો ઇન્દ્રપ્રસ્થમાં રાજધાની બનાવે છે."]},{"tag":"trad","en":["The game of dice","Duryodhana's uncle Shakuni wins everything from Yudhishthira in a rigged dice game: the kingdom, his brothers, himself and their wife Draupadi, who is humiliated in the royal court. The Pandavas are sent into exile for twelve years plus one year in hiding."],"hi":["द्यूत क्रीड़ा","दुर्योधन के मामा शकुनि छल से भरे जुए में युधिष्ठिर से सब कुछ जीत लेते हैं: राज्य, भाई, स्वयं युधिष्ठिर और द्रौपदी, जिनका राजसभा में अपमान होता है। पांडवों को बारह वर्ष के वनवास और एक वर्ष के अज्ञातवास पर भेजा जाता है।"],"gu":["જુગારની રમત","દુર્યોધનના મામા શકુનિ કપટભર્યા જુગારમાં યુધિષ્ઠિર પાસેથી બધું જીતી લે છે: રાજ્ય, ભાઈઓ, યુધિષ્ઠિર પોતે અને દ્રૌપદી, જેનું રાજસભામાં અપમાન થાય છે. પાંડવોને બાર વર્ષના વનવાસ અને એક વર્ષના અજ્ઞાતવાસ પર મોકલવામાં આવે છે."]},{"tag":"trad","en":["Peace talks fail","After the exile, the Pandavas ask for their kingdom back. Krishna goes to Hastinapura as a peace envoy and finally asks for just five villages. Duryodhana refuses to give 'even land the size of a needle's point'. War becomes certain."],"hi":["शांति वार्ता विफल","वनवास के बाद पांडव अपना राज्य वापस माँगते हैं। कृष्ण शांतिदूत बनकर हस्तिनापुर जाते हैं और अंत में केवल पाँच गाँव माँगते हैं। दुर्योधन 'सुई की नोक जितनी भूमि' भी देने से मना कर देता है। युद्ध तय हो जाता है।"],"gu":["શાંતિ મંત્રણા નિષ્ફળ","વનવાસ પછી પાંડવો પોતાનું રાજ્ય પાછું માગે છે. કૃષ્ણ શાંતિદૂત બનીને હસ્તિનાપુર જાય છે અને છેવટે ફક્ત પાંચ ગામ માગે છે. દુર્યોધન 'સોયની અણી જેટલી જમીન' પણ આપવાની ના પાડે છે. યુદ્ધ નક્કી થઈ જાય છે."]},{"tag":"trad","en":["Choosing sides","Both Arjuna and Duryodhana come to Krishna for help. Krishna offers a choice: his large army, or himself unarmed. Duryodhana takes the army. Arjuna chooses Krishna, who becomes his charioteer."],"hi":["पक्ष चुनना","अर्जुन और दुर्योधन दोनों कृष्ण से सहायता माँगने आते हैं। कृष्ण विकल्प देते हैं: उनकी बड़ी सेना, या वे स्वयं बिना शस्त्र के। दुर्योधन सेना लेता है। अर्जुन कृष्ण को चुनते हैं, जो उनके सारथी बनते हैं।"],"gu":["પક્ષ પસંદ કરવો","અર્જુન અને દુર્યોધન બંને કૃષ્ણ પાસે મદદ માગવા આવે છે. કૃષ્ણ વિકલ્પ આપે છે: પોતાની મોટી સેના, અથવા પોતે શસ્ત્ર વગર. દુર્યોધન સેના લે છે. અર્જુન કૃષ્ણને પસંદ કરે છે, જે તેમના સારથિ બને છે."]},{"tag":"text","en":["Sanjaya's divine sight","Before the battle, Vyasa offers the blind Dhritarashtra sight to watch the war. He declines but accepts that his minister Sanjaya be given divine vision to report everything. The Gita is Sanjaya's report (Bhishma Parva)."],"hi":["संजय की दिव्य दृष्टि","युद्ध से पहले व्यास जी अंधे धृतराष्ट्र को युद्ध देखने की दृष्टि देना चाहते हैं। वे मना करते हैं, पर स्वीकार करते हैं कि उनके मंत्री संजय को दिव्य दृष्टि मिले ताकि वे सब बता सकें। गीता संजय का यही वर्णन है (भीष्म पर्व)।"],"gu":["સંજયની દિવ્ય દૃષ્ટિ","યુદ્ધ પહેલાં વ્યાસજી અંધ ધૃતરાષ્ટ્રને યુદ્ધ જોવાની દૃષ્ટિ આપવા માગે છે. તેઓ ના પાડે છે, પણ સ્વીકારે છે કે તેમના મંત્રી સંજયને દિવ્ય દૃષ્ટિ મળે જેથી તેઓ બધું કહી શકે. ગીતા સંજયનું આ જ વર્ણન છે (ભીષ્મ પર્વ)."]},{"tag":"text","en":["Armies at Kurukshetra","Eleven armies (akshauhinis) stand with the Kauravas, led by Bhishma, with Drona, Kripa and others. Duryodhana also names Karna (1.8), though in the epic Karna stays out of battle while Bhishma commands. Seven armies stand with the Pandavas, led by Dhrishtadyumna. Conches sound (1.12–1.19)."],"hi":["कुरुक्षेत्र में सेनाएँ","कौरवों की ओर ग्यारह अक्षौहिणी सेना है, जिसके सेनापति भीष्म हैं, साथ में द्रोण, कृप और अन्य। दुर्योधन कर्ण का नाम भी लेता है (1.8), हालाँकि महाकाव्य में कर्ण भीष्म के सेनापति रहते युद्ध से दूर रहता है। पांडवों की ओर सात अक्षौहिणी सेना है, जिसके सेनापति धृष्टद्युम्न हैं। शंख बजते हैं (1.12–1.19)।"],"gu":["કુરુક્ષેત્રમાં સેનાઓ","કૌરવોની બાજુ અગિયાર અક્ષૌહિણી સેના છે, જેના સેનાપતિ ભીષ્મ છે, સાથે દ્રોણ, કૃપ અને બીજા. દુર્યોધન કર્ણનું નામ પણ લે છે (1.8), જોકે મહાકાવ્યમાં ભીષ્મ સેનાપતિ હોય ત્યાં સુધી કર્ણ યુદ્ધથી દૂર રહે છે. પાંડવોની બાજુ સાત અક્ષૌહિણી સેના છે, જેના સેનાપતિ ધૃષ્ટદ્યુમ્ન છે. શંખ વાગે છે (1.12–1.19)."]},{"tag":"text","en":["Arjuna breaks down","Arjuna asks Krishna to place the chariot between the armies. Seeing his family on both sides, he trembles, drops his bow and refuses to fight (1.20–1.47)."],"hi":["अर्जुन टूट जाते हैं","अर्जुन कृष्ण से रथ दोनों सेनाओं के बीच खड़ा करने को कहते हैं। दोनों ओर अपने परिवार को देखकर वे काँपने लगते हैं, धनुष रख देते हैं और लड़ने से मना कर देते हैं (1.20–1.47)।"],"gu":["અર્જુન ભાંગી પડે છે","અર્જુન કૃષ્ણને રથ બંને સેનાની વચ્ચે ઊભો રાખવા કહે છે. બંને બાજુ પોતાના કુટુંબને જોઈને તેઓ ધ્રૂજવા લાગે છે, ધનુષ્ય મૂકી દે છે અને લડવાની ના પાડે છે (1.20–1.47)."]},{"tag":"text","en":["The Gita begins","Arjuna asks Krishna to teach him as a student (2.7). Krishna begins: 'You grieve for those who should not be grieved for' (2.11). The conversation runs to the end of Chapter 18."],"hi":["गीता का आरंभ","अर्जुन कृष्ण से शिष्य की तरह उपदेश माँगते हैं (2.7)। कृष्ण आरंभ करते हैं: 'तुम उनके लिए शोक करते हो जो शोक के योग्य नहीं हैं' (2.11)। बातचीत अध्याय 18 के अंत तक चलती है।"],"gu":["ગીતાનો આરંભ","અર્જુન કૃષ્ણ પાસે શિષ્ય તરીકે ઉપદેશ માગે છે (2.7). કૃષ્ણ શરૂ કરે છે: 'તમે એમના માટે શોક કરો છો જે શોકને લાયક નથી' (2.11). વાતચીત અધ્યાય 18ના અંત સુધી ચાલે છે."]},{"tag":"hist","en":["What historians say","There is no independent archaeological evidence for the specific events of the war. Some scholars think the story may preserve memories of conflicts among Iron Age clans in north India around 1000 BCE. Traditional dates (such as 3102 BCE) come from astronomical and religious reckoning, not historical records."],"hi":["इतिहासकार क्या कहते हैं","युद्ध की विशेष घटनाओं का कोई स्वतंत्र पुरातात्विक प्रमाण नहीं है। कुछ विद्वानों का मानना है कि कथा में लगभग 1000 ई.पू. के उत्तर भारत के लौह युग के कबीलों के संघर्षों की स्मृतियाँ हो सकती हैं। पारंपरिक तिथियाँ (जैसे 3102 ई.पू.) ज्योतिषीय और धार्मिक गणना से आती हैं, ऐतिहासिक अभिलेखों से नहीं।"],"gu":["ઇતિહાસકારો શું કહે છે","યુદ્ધની ચોક્કસ ઘટનાઓનો કોઈ સ્વતંત્ર પુરાતત્ત્વીય પુરાવો નથી. કેટલાક વિદ્વાનો માને છે કે કથામાં આશરે ઈ.સ.પૂ. 1000ના ઉત્તર ભારતના લોહયુગના કબીલાઓના સંઘર્ષોની સ્મૃતિઓ હોઈ શકે. પરંપરાગત તારીખો (જેમ કે ઈ.સ.પૂ. 3102) જ્યોતિષ અને ધાર્મિક ગણતરીમાંથી આવે છે, ઐતિહાસિક દસ્તાવેજોમાંથી નહીં."]}],"chapters":[{"n":1,"key":["1.1","1.21","1.28","1.31","1.47"],"concepts":["dharma"],"en":{"title":"The Yoga of Arjuna's Despair","intro":"The armies face each other at Kurukshetra. Sanjaya describes the warriors and the sounding of conches. Arjuna asks Krishna to drive between the armies, sees his own family on both sides, and collapses in grief. He lists the harms of the war and refuses to fight.","why":"Krishna says almost nothing in this chapter. It sets up the problem the whole Gita answers: a capable person paralysed by a real moral conflict.","ideas":["A crisis of duty: loyalty to family against duty as a warrior.","Grief clouds judgement, even in a strong person.","The chapter is called a 'yoga' because honest despair is where inquiry begins."],"summary":"Chapter 1 ends with Arjuna sitting down in his chariot, bow dropped, overwhelmed by sorrow (1.47). Every teaching that follows responds to this moment.","lessons":["Admitting confusion is the first step to clarity.","Strong feelings can make one-sided arguments sound convincing.","Big decisions deserve a pause and a trusted adviser."],"qa":[["Is Arjuna's compassion wrong?","No. The problem is not that he cares, but that grief stops him from seeing his duty clearly. Krishna calls it confusion (moha), not compassion."]],"conn":"Chapter 2 opens directly from this scene and gives Krishna's first answer.","quiz":[["Who asks the first question of the Gita?",["Arjuna","Dhritarashtra","Sanjaya","Krishna"],1],["What does Arjuna ask Krishna to do in 1.21?",["Leave the battlefield","Place the chariot between the two armies","Blow his conch","Call Bhishma"],1],["How does Chapter 1 end?",["Arjuna attacks","Krishna shows his cosmic form","Arjuna drops his bow and sits down","The war is cancelled"],2]]},"hi":{"title":"अर्जुन के विषाद का योग","intro":"कुरुक्षेत्र में सेनाएँ आमने-सामने हैं। संजय योद्धाओं और शंखनाद का वर्णन करते हैं। अर्जुन कृष्ण से रथ सेनाओं के बीच ले चलने को कहते हैं, दोनों ओर अपने परिवार को देखते हैं और शोक में डूब जाते हैं। वे युद्ध के नुक़सान गिनाते हैं और लड़ने से मना कर देते हैं।","why":"इस अध्याय में कृष्ण लगभग कुछ नहीं बोलते। यह वह समस्या सामने रखता है जिसका उत्तर पूरी गीता देती है: एक योग्य व्यक्ति जो सच्चे नैतिक संघर्ष के कारण जड़ हो गया है।","ideas":["कर्तव्य का संकट: परिवार के प्रति लगाव बनाम योद्धा का कर्तव्य।","शोक बुद्धि को ढक देता है, बलवान व्यक्ति में भी।","इस अध्याय को 'योग' इसलिए कहते हैं क्योंकि सच्चा विषाद ही जिज्ञासा की शुरुआत है।"],"summary":"अध्याय 1 के अंत में अर्जुन धनुष छोड़कर शोक से भरे रथ में बैठ जाते हैं (1.47)। आगे का हर उपदेश इसी क्षण का उत्तर है।","lessons":["उलझन को स्वीकार करना स्पष्टता का पहला क़दम है।","तीव्र भावनाएँ एकतरफ़ा तर्कों को भी सही दिखा सकती हैं।","बड़े फ़ैसलों से पहले रुकना और भरोसेमंद सलाहकार से बात करना अच्छा है।"],"qa":[["क्या अर्जुन की करुणा ग़लत है?","नहीं। समस्या यह नहीं कि उन्हें परवाह है, बल्कि यह कि शोक उन्हें अपना कर्तव्य साफ़ देखने नहीं देता। कृष्ण इसे करुणा नहीं, मोह कहते हैं।"]],"conn":"अध्याय 2 सीधे इसी दृश्य से शुरू होता है और कृष्ण का पहला उत्तर देता है।","quiz":[["गीता का पहला प्रश्न कौन पूछता है?",["अर्जुन","धृतराष्ट्र","संजय","कृष्ण"],1],["1.21 में अर्जुन कृष्ण से क्या करने को कहते हैं?",["युद्धभूमि छोड़ने को","रथ को दोनों सेनाओं के बीच खड़ा करने को","शंख बजाने को","भीष्म को बुलाने को"],1],["अध्याय 1 कैसे समाप्त होता है?",["अर्जुन आक्रमण करते हैं","कृष्ण विराट रूप दिखाते हैं","अर्जुन धनुष छोड़कर बैठ जाते हैं","युद्ध रद्द हो जाता है"],2]]},"gu":{"title":"અર્જુનના વિષાદનો યોગ","intro":"કુરુક્ષેત્રમાં સેનાઓ સામસામે છે. સંજય યોદ્ધાઓ અને શંખનાદનું વર્ણન કરે છે. અર્જુન કૃષ્ણને રથ સેનાઓની વચ્ચે લઈ જવા કહે છે, બંને બાજુ પોતાના કુટુંબને જુએ છે અને શોકમાં ડૂબી જાય છે. તેઓ યુદ્ધનાં નુકસાન ગણાવે છે અને લડવાની ના પાડે છે.","why":"આ અધ્યાયમાં કૃષ્ણ લગભગ કંઈ નથી બોલતા. તે એ સમસ્યા રજૂ કરે છે જેનો જવાબ આખી ગીતા આપે છે: એક સક્ષમ વ્યક્તિ જે સાચા નૈતિક સંઘર્ષને કારણે જડ થઈ ગઈ છે.","ideas":["ફરજનું સંકટ: કુટુંબ પ્રત્યેની લાગણી વિરુદ્ધ યોદ્ધાની ફરજ.","શોક બુદ્ધિને ઢાંકી દે છે, બળવાન વ્યક્તિમાં પણ.","આ અધ્યાયને 'યોગ' કહેવાય છે કારણ કે સાચો વિષાદ જ જિજ્ઞાસાની શરૂઆત છે."],"summary":"અધ્યાય 1ના અંતે અર્જુન ધનુષ્ય મૂકીને શોકમાં રથમાં બેસી જાય છે (1.47). આગળનો દરેક ઉપદેશ આ ક્ષણનો જવાબ છે.","lessons":["મૂંઝવણ સ્વીકારવી એ સ્પષ્ટતાનું પહેલું પગલું છે.","તીવ્ર લાગણીઓ એકતરફી દલીલોને પણ સાચી દેખાડી શકે છે.","મોટા નિર્ણય પહેલાં થોભવું અને વિશ્વાસુ સલાહકાર સાથે વાત કરવી સારી છે."],"qa":[["શું અર્જુનની કરુણા ખોટી છે?","ના. સમસ્યા એ નથી કે તેમને ચિંતા છે, પણ એ છે કે શોક તેમને પોતાની ફરજ સ્પષ્ટ જોવા નથી દેતો. કૃષ્ણ તેને કરુણા નહીં, મોહ કહે છે."]],"conn":"અધ્યાય 2 સીધો આ દૃશ્યથી શરૂ થાય છે અને કૃષ્ણનો પહેલો જવાબ આપે છે.","quiz":[["ગીતાનો પહેલો પ્રશ્ન કોણ પૂછે છે?",["અર્જુન","ધૃતરાષ્ટ્ર","સંજય","કૃષ્ણ"],1],["1.21માં અર્જુન કૃષ્ણને શું કરવા કહે છે?",["યુદ્ધભૂમિ છોડવા","રથને બંને સેનાની વચ્ચે ઊભો રાખવા","શંખ વગાડવા","ભીષ્મને બોલાવવા"],1],["અધ્યાય 1 કેવી રીતે પૂરો થાય છે?",["અર્જુન હુમલો કરે છે","કૃષ્ણ વિરાટ રૂપ બતાવે છે","અર્જુન ધનુષ્ય મૂકીને બેસી જાય છે","યુદ્ધ રદ થાય છે"],2]]},"sa":"अर्जुनविषादयोग","iast":"Arjun Viṣhād Yog","count":47,"gs":"અર્જુનવિષાદયોગ"},{"n":2,"key":["2.7","2.11","2.20","2.22","2.47","2.48","2.62","2.63","2.70"],"concepts":["atman","nishkama-karma","samatvam","buddhi"],"en":{"title":"The Yoga of Knowledge","intro":"Arjuna asks Krishna to be his teacher. Krishna answers on several levels: the self is eternal and cannot be killed; as a warrior Arjuna has a duty; and there is a way of acting without anxiety about results (karma yoga). The chapter ends with a portrait of the 'sthita-prajna', a person of steady wisdom.","why":"Arjuna's grief rests on the belief that death is the end and that he alone controls outcomes. Krishna addresses both beliefs before teaching anything else.","ideas":["The self (atman) is not born and does not die (2.20).","Act without attachment to the fruits of action (2.47).","Evenness of mind in success and failure is yoga (2.48).","Desire leads to anger, delusion and ruin (2.62–2.63)."],"summary":"Often called a summary of the whole Gita. It moves from metaphysics (who we are) to ethics (what we should do) to psychology (how to stay steady).","lessons":["Separate effort, which you control, from results, which you don't.","Watch the chain from craving to anger before it starts.","Calm is a skill that can be trained."],"qa":[["Does 2.47 mean don't care about results?","No. It means don't make the result your motive or let it control your mind. You can plan for outcomes while acting from duty."],["Why argue for fighting with the immortality of the soul?","Because Arjuna's grief assumes death destroys people. Krishna removes that assumption first, then gives separate arguments from duty."]],"conn":"Chapter 3 begins with Arjuna's question about the apparent contradiction between knowledge and action raised here.","quiz":[["Which verse says your right is to action alone, never to its fruits?",["2.20","2.47","2.62","18.66"],1],["What does Krishna call evenness of mind in 2.48?",["Bhakti","Yoga","Moksha","Tapas"],1],["In 2.62–2.63, what does anger lead to?",["Wisdom","Delusion","Peace","Wealth"],1]]},"hi":{"title":"सांख्य योग — ज्ञान का योग","intro":"अर्जुन कृष्ण से गुरु बनने की प्रार्थना करते हैं। कृष्ण कई स्तरों पर उत्तर देते हैं: आत्मा नित्य है और मारी नहीं जा सकती; योद्धा के रूप में अर्जुन का कर्तव्य है; और फल की चिंता के बिना कर्म करने का एक मार्ग है (कर्मयोग)। अध्याय 'स्थितप्रज्ञ' — स्थिर बुद्धि वाले व्यक्ति — के वर्णन से समाप्त होता है।","why":"अर्जुन का शोक इस धारणा पर टिका है कि मृत्यु अंत है और परिणाम केवल उनके हाथ में हैं। कृष्ण कुछ और सिखाने से पहले इन दोनों धारणाओं को सुलझाते हैं।","ideas":["आत्मा न जन्म लेती है, न मरती है (2.20)।","कर्मफल में आसक्ति के बिना कर्म करो (2.47)।","सफलता और असफलता में समान रहना ही योग है (2.48)।","कामना से क्रोध, मोह और विनाश होता है (2.62–2.63)।"],"summary":"इसे अक्सर पूरी गीता का सार कहा जाता है। यह तत्त्वज्ञान (हम कौन हैं) से नीति (क्या करें) और मनोविज्ञान (स्थिर कैसे रहें) तक जाता है।","lessons":["प्रयास, जो आपके हाथ में है, और परिणाम, जो नहीं है — इन्हें अलग करें।","लालसा से क्रोध तक की श्रृंखला को शुरू होने से पहले पहचानें।","शांति एक कौशल है जिसे साधा जा सकता है।"],"qa":[["क्या 2.47 का अर्थ है कि परिणाम की परवाह न करें?","नहीं। इसका अर्थ है कि परिणाम को अपना उद्देश्य न बनाएँ और उसे मन पर हावी न होने दें। आप परिणामों की योजना बनाते हुए भी कर्तव्य भाव से कर्म कर सकते हैं।"],["लड़ने के पक्ष में आत्मा की अमरता का तर्क क्यों?","क्योंकि अर्जुन का शोक यह मानता है कि मृत्यु व्यक्ति को नष्ट कर देती है। कृष्ण पहले उस धारणा को हटाते हैं, फिर कर्तव्य के अलग तर्क देते हैं।"]],"conn":"अध्याय 3 अर्जुन के इस प्रश्न से शुरू होता है कि यहाँ ज्ञान और कर्म में जो विरोध दिखा उसका क्या अर्थ है।","quiz":[["कौन-सा श्लोक कहता है कि तुम्हारा अधिकार केवल कर्म में है, फल में कभी नहीं?",["2.20","2.47","2.62","18.66"],1],["2.48 में कृष्ण मन की समता को क्या कहते हैं?",["भक्ति","योग","मोक्ष","तप"],1],["2.62–2.63 में क्रोध से क्या होता है?",["ज्ञान","मोह","शांति","धन"],1]]},"gu":{"title":"સાંખ્ય યોગ — જ્ઞાનનો યોગ","intro":"અર્જુન કૃષ્ણને ગુરુ બનવાની વિનંતી કરે છે. કૃષ્ણ અનેક સ્તરે જવાબ આપે છે: આત્મા નિત્ય છે અને મારી શકાતો નથી; યોદ્ધા તરીકે અર્જુનની ફરજ છે; અને ફળની ચિંતા વગર કર્મ કરવાનો એક માર્ગ છે (કર્મયોગ). અધ્યાય 'સ્થિતપ્રજ્ઞ' — સ્થિર બુદ્ધિવાળી વ્યક્તિ — ના વર્ણનથી પૂરો થાય છે.","why":"અર્જુનનો શોક એ માન્યતા પર ટકેલો છે કે મૃત્યુ અંત છે અને પરિણામ ફક્ત તેમના હાથમાં છે. કૃષ્ણ બીજું કંઈ શીખવતા પહેલાં આ બંને માન્યતાઓ ઉકેલે છે.","ideas":["આત્મા જન્મતો નથી અને મરતો નથી (2.20).","કર્મફળની આસક્તિ વગર કર્મ કરો (2.47).","સફળતા અને નિષ્ફળતામાં સમાન રહેવું એ જ યોગ છે (2.48).","કામનામાંથી ક્રોધ, મોહ અને વિનાશ થાય છે (2.62–2.63)."],"summary":"તેને ઘણી વાર આખી ગીતાનો સાર કહેવાય છે. તે તત્ત્વજ્ઞાન (આપણે કોણ છીએ)થી નીતિ (શું કરવું) અને મનોવિજ્ઞાન (સ્થિર કેવી રીતે રહેવું) સુધી જાય છે.","lessons":["પ્રયત્ન, જે તમારા હાથમાં છે, અને પરિણામ, જે નથી — તેમને અલગ પાડો.","ઝંખનાથી ક્રોધ સુધીની સાંકળને શરૂ થતાં પહેલાં ઓળખો.","શાંતિ એક કૌશલ્ય છે જે કેળવી શકાય છે."],"qa":[["શું 2.47નો અર્થ છે કે પરિણામની પરવા ન કરવી?","ના. તેનો અર્થ છે કે પરિણામને પોતાનો હેતુ ન બનાવવો અને તેને મન પર હાવી ન થવા દેવું. તમે પરિણામનું આયોજન કરતાં કરતાં પણ ફરજભાવે કર્મ કરી શકો."],["લડવાના પક્ષે આત્માની અમરતાની દલીલ કેમ?","કારણ કે અર્જુનનો શોક માને છે કે મૃત્યુ વ્યક્તિનો નાશ કરે છે. કૃષ્ણ પહેલાં એ માન્યતા દૂર કરે છે, પછી ફરજની અલગ દલીલો આપે છે."]],"conn":"અધ્યાય 3 અર્જુનના એ પ્રશ્નથી શરૂ થાય છે કે અહીં જ્ઞાન અને કર્મ વચ્ચે જે વિરોધ દેખાયો તેનો શો અર્થ.","quiz":[["કયો શ્લોક કહે છે કે તમારો અધિકાર ફક્ત કર્મમાં છે, ફળમાં ક્યારેય નહીં?",["2.20","2.47","2.62","18.66"],1],["2.48માં કૃષ્ણ મનની સમતાને શું કહે છે?",["ભક્તિ","યોગ","મોક્ષ","તપ"],1],["2.62–2.63માં ક્રોધમાંથી શું થાય છે?",["જ્ઞાન","મોહ","શાંતિ","ધન"],1]]},"sa":"सांख्ययोग","iast":"Sānkhya Yog","count":72,"gs":"સાંખ્યયોગ"},{"n":3,"key":["3.5","3.8","3.9","3.19","3.21","3.27","3.35","3.37"],"concepts":["karma","yajna","dharma","ahamkara"],"en":{"title":"The Yoga of Action","intro":"Arjuna asks: if knowledge is better than action, why push me into this terrible action? Krishna explains that nobody can stay without acting even for a moment, that action done as an offering (yajna) does not bind, and that leaders must act because others follow their example. He ends by naming desire as the real enemy.","why":"Chapter 2 praised both knowledge and action, and Arjuna is confused about which one to follow. Krishna clarifies that withdrawal from action is not the answer.","ideas":["Action is unavoidable; inaction is also a choice (3.5, 3.8).","Work done for a larger good, not only for oneself, frees rather than binds (3.9).","Leaders set the standard others follow (3.21).","Better one's own duty imperfectly than another's well (3.35)."],"summary":"Karma yoga in full: act, but act selflessly, as part of a larger order.","lessons":["Avoiding a task is still a decision with consequences.","Your behaviour teaches the people who look up to you.","Desire disguised as reason is the main obstacle to right action."],"qa":[["What is 'one's own dharma' (svadharma) in 3.35?","Traditionally, duties tied to one's role and stage of life. Modern readers often read it as one's own nature and responsibilities. The text in context refers to Arjuna's role as a warrior."]],"conn":"Chapter 4 explains the history and inner meaning of this teaching.","quiz":[["According to 3.5, can anyone remain without action even for a moment?",["Yes, yogis can","No","Only in sleep","Only after death"],1],["Which verse says what a great person does, others follow?",["3.21","3.35","2.47","4.7"],0],["In 3.37, what does Krishna name as the enemy?",["Fear","Desire and anger born of rajas","Other kings","Ignorance of Sanskrit"],1]]},"hi":{"title":"कर्मयोग — कर्म का योग","intro":"अर्जुन पूछते हैं: अगर ज्ञान कर्म से श्रेष्ठ है, तो मुझे इस भयानक कर्म में क्यों लगाते हो? कृष्ण समझाते हैं कि कोई एक क्षण भी बिना कर्म किए नहीं रह सकता, यज्ञ भाव से किया कर्म नहीं बाँधता, और नेताओं को कर्म करना चाहिए क्योंकि लोग उनका अनुसरण करते हैं। अंत में वे कामना को असली शत्रु बताते हैं।","why":"अध्याय 2 में ज्ञान और कर्म दोनों की प्रशंसा हुई, और अर्जुन उलझ गए कि किसे अपनाएँ। कृष्ण स्पष्ट करते हैं कि कर्म से भागना उत्तर नहीं है।","ideas":["कर्म टाला नहीं जा सकता; कर्म न करना भी एक चुनाव है (3.5, 3.8)।","केवल अपने लिए नहीं, बड़े हित के लिए किया कर्म बाँधता नहीं, मुक्त करता है (3.9)।","श्रेष्ठ व्यक्ति जो करता है, बाक़ी लोग वही करते हैं (3.21)।","दूसरे का धर्म अच्छी तरह निभाने से अपना धर्म कमियों के साथ निभाना बेहतर है (3.35)।"],"summary":"कर्मयोग का पूरा रूप: कर्म करो, पर निःस्वार्थ भाव से, एक बड़ी व्यवस्था के हिस्से के रूप में।","lessons":["किसी काम से बचना भी परिणामों वाला एक फ़ैसला है।","आपका व्यवहार उन्हें सिखाता है जो आपको आदर्श मानते हैं।","तर्क का रूप धरे कामना सही कर्म में सबसे बड़ी बाधा है।"],"qa":[["3.35 में 'स्वधर्म' क्या है?","परंपरा के अनुसार, व्यक्ति की भूमिका और जीवन की अवस्था से जुड़े कर्तव्य। आधुनिक पाठक इसे अक्सर अपना स्वभाव और ज़िम्मेदारियाँ मानते हैं। संदर्भ में यह अर्जुन की योद्धा की भूमिका की बात करता है।"]],"conn":"अध्याय 4 इस उपदेश का इतिहास और भीतरी अर्थ बताता है।","quiz":[["3.5 के अनुसार क्या कोई एक क्षण भी बिना कर्म के रह सकता है?",["हाँ, योगी रह सकते हैं","नहीं","केवल नींद में","केवल मृत्यु के बाद"],1],["कौन-सा श्लोक कहता है कि श्रेष्ठ व्यक्ति जो करता है, दूसरे भी वही करते हैं?",["3.21","3.35","2.47","4.7"],0],["3.37 में कृष्ण किसे शत्रु बताते हैं?",["भय","रजोगुण से पैदा काम और क्रोध","दूसरे राजा","संस्कृत का अज्ञान"],1]]},"gu":{"title":"કર્મયોગ — કર્મનો યોગ","intro":"અર્જુન પૂછે છે: જો જ્ઞાન કર્મ કરતાં શ્રેષ્ઠ છે, તો મને આ ભયાનક કર્મમાં કેમ જોડો છો? કૃષ્ણ સમજાવે છે કે કોઈ એક ક્ષણ પણ કર્મ વગર રહી શકતું નથી, યજ્ઞભાવે કરેલું કર્મ બાંધતું નથી, અને આગેવાનોએ કર્મ કરવું જોઈએ કારણ કે લોકો તેમને અનુસરે છે. અંતે તેઓ કામનાને સાચો શત્રુ ગણાવે છે.","why":"અધ્યાય 2માં જ્ઞાન અને કર્મ બંનેની પ્રશંસા થઈ, અને અર્જુન મૂંઝાયા કે કયું અપનાવવું. કૃષ્ણ સ્પષ્ટ કરે છે કે કર્મથી ભાગવું એ જવાબ નથી.","ideas":["કર્મ ટાળી શકાતું નથી; કર્મ ન કરવું એ પણ એક પસંદગી છે (3.5, 3.8).","ફક્ત પોતાના માટે નહીં, મોટા હિત માટે કરેલું કર્મ બાંધતું નથી, મુક્ત કરે છે (3.9).","શ્રેષ્ઠ વ્યક્તિ જે કરે છે, બીજા પણ તે જ કરે છે (3.21).","બીજાનો ધર્મ સારી રીતે નિભાવવા કરતાં પોતાનો ધર્મ ખામીઓ સાથે નિભાવવો સારો (3.35)."],"summary":"કર્મયોગનું પૂરું સ્વરૂપ: કર્મ કરો, પણ નિઃસ્વાર્થ ભાવે, એક મોટી વ્યવસ્થાના ભાગ તરીકે.","lessons":["કોઈ કામ ટાળવું એ પણ પરિણામો ધરાવતો નિર્ણય છે.","તમારું વર્તન એમને શીખવે છે જે તમને આદર્શ માને છે.","દલીલનું રૂપ ધારણ કરેલી કામના સાચા કર્મમાં સૌથી મોટો અવરોધ છે."],"qa":[["3.35માં 'સ્વધર્મ' શું છે?","પરંપરા પ્રમાણે, વ્યક્તિની ભૂમિકા અને જીવનના તબક્કા સાથે જોડાયેલી ફરજો. આધુનિક વાચકો તેને ઘણી વાર પોતાનો સ્વભાવ અને જવાબદારીઓ માને છે. સંદર્ભમાં તે અર્જુનની યોદ્ધાની ભૂમિકાની વાત કરે છે."]],"conn":"અધ્યાય 4 આ ઉપદેશનો ઇતિહાસ અને અંદરનો અર્થ સમજાવે છે.","quiz":[["3.5 પ્રમાણે શું કોઈ એક ક્ષણ પણ કર્મ વગર રહી શકે?",["હા, યોગીઓ રહી શકે","ના","ફક્ત ઊંઘમાં","ફક્ત મૃત્યુ પછી"],1],["કયો શ્લોક કહે છે કે શ્રેષ્ઠ વ્યક્તિ જે કરે છે, બીજા પણ તે જ કરે છે?",["3.21","3.35","2.47","4.7"],0],["3.37માં કૃષ્ણ કોને શત્રુ ગણાવે છે?",["ભય","રજોગુણમાંથી જન્મેલા કામ અને ક્રોધ","બીજા રાજાઓ","સંસ્કૃતનું અજ્ઞાન"],1]]},"sa":"कर्मयोग","iast":"Karm Yog","count":43,"gs":"કર્મયોગ"},{"n":4,"key":["4.7","4.8","4.13","4.18","4.34","4.38","4.39"],"concepts":["jnana","yajna","karma"],"en":{"title":"Knowledge and the Renunciation of Action","intro":"Krishna says this yoga is ancient and that he taught it long ago. When Arjuna asks how that is possible, Krishna speaks of his repeated births to restore dharma. He explains how to see 'inaction in action', describes many kinds of sacrifice, and praises knowledge as the purest thing in the world.","why":"Arjuna needs to know the teaching is reliable and how action and knowledge fit together. Krishna shows that wise action is free of ego, so it does not bind.","ideas":["The Divine appears age after age to protect goodness (4.7–4.8).","See inaction in action and action in inaction (4.18).","Learn from those who know, with humility and questions (4.34).","Nothing purifies like knowledge (4.38)."],"summary":"Knowledge transforms action: the same deed can bind or free depending on the understanding behind it.","lessons":["Look for teachers and ask real questions.","Busy is not the same as effective, and still is not the same as idle.","Faith with self-control leads to knowledge (4.39)."],"qa":[["Does 4.13 justify caste by birth?","4.13 says the four varnas were created according to guna (qualities) and karma (actions). Readers disagree on whether this supports birth-based caste. Many modern commentators, including Gandhi and Vivekananda, read it as qualities and work, not birth. Others read it in light of the traditional system. The verse itself names qualities and actions."]],"conn":"Chapter 5 takes up Arjuna's next question: renunciation or action, which is better?","quiz":[["Which verses describe the Divine taking birth to protect dharma?",["2.20–2.22","4.7–4.8","11.32–11.33","18.65–18.66"],1],["What does 4.34 advise for gaining knowledge?",["Read alone","Approach the wise with humility, questions and service","Avoid teachers","Fast for long periods"],1],["According to 4.38, what is the greatest purifier?",["Water","Knowledge","Wealth","Silence"],1]]},"hi":{"title":"ज्ञान-कर्म-संन्यास योग","intro":"कृष्ण कहते हैं कि यह योग प्राचीन है और उन्होंने इसे बहुत पहले सिखाया था। अर्जुन पूछते हैं कि यह कैसे संभव है, तो कृष्ण धर्म की स्थापना के लिए अपने बार-बार जन्म की बात करते हैं। वे 'कर्म में अकर्म' देखने की बात समझाते हैं, कई प्रकार के यज्ञ बताते हैं, और ज्ञान को संसार की सबसे पवित्र वस्तु कहते हैं।","why":"अर्जुन को जानना है कि उपदेश विश्वसनीय है और कर्म व ज्ञान कैसे एक साथ चलते हैं। कृष्ण दिखाते हैं कि बुद्धिमानी से किया कर्म अहंकार से मुक्त होता है, इसलिए बाँधता नहीं।","ideas":["भलाई की रक्षा के लिए ईश्वर युग-युग में प्रकट होते हैं (4.7–4.8)।","कर्म में अकर्म और अकर्म में कर्म देखो (4.18)।","जानने वालों से विनम्रता और प्रश्नों के साथ सीखो (4.34)।","ज्ञान के समान पवित्र करने वाला कुछ नहीं (4.38)।"],"summary":"ज्ञान कर्म को बदल देता है: एक ही काम उसके पीछे की समझ के अनुसार बाँध भी सकता है और मुक्त भी कर सकता है।","lessons":["गुरु ढूँढें और सच्चे प्रश्न पूछें।","व्यस्त होना प्रभावी होना नहीं है, और शांत होना आलसी होना नहीं है।","संयम के साथ श्रद्धा ज्ञान तक ले जाती है (4.39)।"],"qa":[["क्या 4.13 जन्म से जाति को सही ठहराता है?","4.13 कहता है कि चार वर्ण गुण और कर्म के अनुसार बनाए गए। इस पर मतभेद है कि यह जन्म आधारित जाति का समर्थन करता है या नहीं। गांधी जी और विवेकानंद सहित कई आधुनिक टीकाकार इसे जन्म नहीं, गुण और कर्म के रूप में पढ़ते हैं। अन्य इसे पारंपरिक व्यवस्था के संदर्भ में पढ़ते हैं। श्लोक स्वयं गुण और कर्म का नाम लेता है।"]],"conn":"अध्याय 5 अर्जुन के अगले प्रश्न को लेता है: संन्यास या कर्म, कौन श्रेष्ठ है?","quiz":[["कौन-से श्लोक धर्म की रक्षा के लिए ईश्वर के जन्म की बात करते हैं?",["2.20–2.22","4.7–4.8","11.32–11.33","18.65–18.66"],1],["4.34 ज्ञान पाने के लिए क्या सलाह देता है?",["अकेले पढ़ो","ज्ञानियों के पास विनम्रता, प्रश्न और सेवा के साथ जाओ","गुरुओं से बचो","लंबे उपवास करो"],1],["4.38 के अनुसार सबसे बड़ा पवित्र करने वाला क्या है?",["जल","ज्ञान","धन","मौन"],1]]},"gu":{"title":"જ્ઞાન-કર્મ-સંન્યાસ યોગ","intro":"કૃષ્ણ કહે છે કે આ યોગ પ્રાચીન છે અને તેમણે તે ઘણા સમય પહેલાં શીખવ્યો હતો. અર્જુન પૂછે છે કે આ કેવી રીતે શક્ય છે, ત્યારે કૃષ્ણ ધર્મની સ્થાપના માટે પોતાના વારંવારના જન્મની વાત કરે છે. તેઓ 'કર્મમાં અકર્મ' જોવાની વાત સમજાવે છે, અનેક પ્રકારના યજ્ઞ વર્ણવે છે, અને જ્ઞાનને જગતની સૌથી પવિત્ર વસ્તુ કહે છે.","why":"અર્જુનને જાણવું છે કે ઉપદેશ વિશ્વસનીય છે અને કર્મ અને જ્ઞાન કેવી રીતે સાથે ચાલે છે. કૃષ્ણ બતાવે છે કે સમજદારીથી કરેલું કર્મ અહંકારથી મુક્ત હોય છે, એટલે બાંધતું નથી.","ideas":["ભલાઈના રક્ષણ માટે ઈશ્વર યુગે યુગે પ્રગટ થાય છે (4.7–4.8).","કર્મમાં અકર્મ અને અકર્મમાં કર્મ જુઓ (4.18).","જાણકારો પાસેથી નમ્રતા અને પ્રશ્નો સાથે શીખો (4.34).","જ્ઞાન જેવું પવિત્ર કરનાર બીજું કંઈ નથી (4.38)."],"summary":"જ્ઞાન કર્મને બદલી નાખે છે: એક જ કામ તેની પાછળની સમજ પ્રમાણે બાંધી પણ શકે અને મુક્ત પણ કરી શકે.","lessons":["ગુરુ શોધો અને સાચા પ્રશ્નો પૂછો.","વ્યસ્ત હોવું એ અસરકારક હોવું નથી, અને શાંત હોવું એ આળસુ હોવું નથી.","સંયમ સાથેની શ્રદ્ધા જ્ઞાન તરફ લઈ જાય છે (4.39)."],"qa":[["શું 4.13 જન્મથી જાતિને યોગ્ય ઠેરવે છે?","4.13 કહે છે કે ચાર વર્ણ ગુણ અને કર્મ પ્રમાણે સર્જાયા. આ જન્મ આધારિત જાતિનું સમર્થન કરે છે કે નહીં તે વિશે મતભેદ છે. ગાંધીજી અને વિવેકાનંદ સહિત ઘણા આધુનિક ટીકાકારો તેને જન્મ નહીં, ગુણ અને કર્મ તરીકે વાંચે છે. બીજા તેને પરંપરાગત વ્યવસ્થાના સંદર્ભમાં વાંચે છે. શ્લોક પોતે ગુણ અને કર્મનું નામ લે છે."]],"conn":"અધ્યાય 5 અર્જુનનો આગળનો પ્રશ્ન લે છે: સંન્યાસ કે કર્મ, કયું શ્રેષ્ઠ?","quiz":[["કયા શ્લોકો ધર્મના રક્ષણ માટે ઈશ્વરના જન્મની વાત કરે છે?",["2.20–2.22","4.7–4.8","11.32–11.33","18.65–18.66"],1],["4.34 જ્ઞાન મેળવવા માટે શું સલાહ આપે છે?",["એકલા વાંચો","જ્ઞાનીઓ પાસે નમ્રતા, પ્રશ્નો અને સેવા સાથે જાઓ","ગુરુઓથી દૂર રહો","લાંબા ઉપવાસ કરો"],1],["4.38 પ્રમાણે સૌથી મોટું પવિત્ર કરનાર શું છે?",["જળ","જ્ઞાન","ધન","મૌન"],1]]},"sa":"ज्ञानकर्मसंन्यासयोग","iast":"Jñāna Karm Sanyās Yog","count":42,"gs":"જ્ઞાનકર્મસંન્યાસયોગ"},{"n":5,"key":["5.2","5.10","5.18","5.22","5.29"],"concepts":["sannyasa","karma","samatvam"],"en":{"title":"The Yoga of Renunciation","intro":"Arjuna asks again: renunciation or action, which is better? Krishna says both lead to the highest good, but action without attachment is easier and better for him. The true renouncer is one who neither hates nor craves, not one who simply stops working.","why":"Arjuna is tempted to escape the battle as a kind of renunciation. Krishna redefines renunciation as an inner state.","ideas":["Karma yoga is superior to mere outer renunciation for most people (5.2).","Act like a lotus leaf in water, untouched (5.10).","The wise see the same in a learned person, a cow, an elephant, a dog and an outcaste (5.18).","Pleasures born of contact have a beginning and an end (5.22)."],"summary":"Renunciation is about letting go of the ego's claims, not about quitting life.","lessons":["Changing your attitude often does more than changing your situation.","Treat people with equal regard regardless of status.","Short-lived pleasures leave short-lived satisfaction."],"qa":[["Does 5.18 mean everyone is treated identically?","It speaks of equal vision (sama-darshana): seeing the same self in all. Commentators agree it rules out contempt; they differ on how far it applies to social practice."]],"conn":"Chapter 6 shows the practice of meditation that steadies the mind described here.","quiz":[["Which does Krishna call better for Arjuna in 5.2?",["Renunciation of action","Karma yoga","Neither","Pilgrimage"],1],["What image does 5.10 use for unattached action?",["A rock","A lotus leaf in water","A burning lamp","A flowing river"],1],["What does 5.18 describe?",["Equal vision of all beings","Ranking of animals","Rules of sacrifice","The cosmic form"],0]]},"hi":{"title":"कर्म-संन्यास योग","intro":"अर्जुन फिर पूछते हैं: संन्यास या कर्म, कौन श्रेष्ठ है? कृष्ण कहते हैं कि दोनों परम कल्याण तक ले जाते हैं, पर आसक्ति रहित कर्म सरल है और उनके लिए बेहतर है। सच्चा संन्यासी वह है जो न द्वेष करता है न कामना, केवल काम छोड़ देने वाला नहीं।","why":"अर्जुन युद्ध से भागने को एक तरह का संन्यास मानने को प्रलोभित हैं। कृष्ण संन्यास को भीतरी अवस्था के रूप में परिभाषित करते हैं।","ideas":["अधिकतर लोगों के लिए केवल बाहरी संन्यास से कर्मयोग श्रेष्ठ है (5.2)।","पानी में कमल के पत्ते की तरह, अछूते रहकर कर्म करो (5.10)।","ज्ञानी विद्वान, गाय, हाथी, कुत्ते और चाण्डाल में एक-सा देखते हैं (5.18)।","इंद्रियों के संपर्क से मिले सुखों का आदि और अंत होता है (5.22)।"],"summary":"संन्यास का अर्थ है अहंकार के दावों को छोड़ना, जीवन को छोड़ना नहीं।","lessons":["अपना दृष्टिकोण बदलना अक्सर अपनी स्थिति बदलने से ज़्यादा काम करता है।","लोगों को उनकी हैसियत देखे बिना समान सम्मान दें।","क्षणिक सुख क्षणिक संतोष ही देते हैं।"],"qa":[["क्या 5.18 का अर्थ है कि सबके साथ हूबहू एक-सा व्यवहार हो?","यह समदर्शन की बात करता है: सबमें एक ही आत्मा देखना। टीकाकार सहमत हैं कि यह तिरस्कार को नकारता है; पर यह सामाजिक व्यवहार पर कितना लागू हो, इस पर मत अलग हैं।"]],"conn":"अध्याय 6 ध्यान का अभ्यास बताता है जो यहाँ बताए मन को स्थिर करता है।","quiz":[["5.2 में कृष्ण अर्जुन के लिए किसे बेहतर बताते हैं?",["कर्म संन्यास","कर्मयोग","कोई नहीं","तीर्थयात्रा"],1],["5.10 आसक्ति रहित कर्म के लिए कौन-सा उदाहरण देता है?",["चट्टान","पानी में कमल का पत्ता","जलता दीपक","बहती नदी"],1],["5.18 किसका वर्णन करता है?",["सभी प्राणियों के प्रति समदृष्टि","पशुओं का क्रम","यज्ञ के नियम","विराट रूप"],0]]},"gu":{"title":"કર્મ-સંન્યાસ યોગ","intro":"અર્જુન ફરી પૂછે છે: સંન્યાસ કે કર્મ, કયું શ્રેષ્ઠ? કૃષ્ણ કહે છે કે બંને પરમ કલ્યાણ તરફ લઈ જાય છે, પણ આસક્તિ વગરનું કર્મ સરળ છે અને તેમના માટે વધુ સારું છે. સાચો સંન્યાસી એ છે જે ન દ્વેષ કરે ન ઝંખના, ફક્ત કામ છોડી દેનાર નહીં.","why":"અર્જુન યુદ્ધથી ભાગવાને એક પ્રકારનો સંન્યાસ માનવા લલચાય છે. કૃષ્ણ સંન્યાસને અંદરની અવસ્થા તરીકે વ્યાખ્યાયિત કરે છે.","ideas":["મોટા ભાગના લોકો માટે ફક્ત બહારના સંન્યાસ કરતાં કર્મયોગ શ્રેષ્ઠ છે (5.2).","પાણીમાં કમળના પાનની જેમ, અસ્પૃશ્ય રહીને કર્મ કરો (5.10).","જ્ઞાની વિદ્વાન, ગાય, હાથી, કૂતરા અને ચાંડાળમાં એક સરખું જુએ છે (5.18).","ઇન્દ્રિયોના સંપર્કથી મળતાં સુખોનો આરંભ અને અંત હોય છે (5.22)."],"summary":"સંન્યાસનો અર્થ અહંકારના દાવા છોડવા છે, જીવન છોડવું નહીં.","lessons":["પોતાનો દૃષ્ટિકોણ બદલવો ઘણી વાર પોતાની સ્થિતિ બદલવા કરતાં વધુ કામ કરે છે.","લોકોને તેમનો દરજ્જો જોયા વગર સમાન આદર આપો.","ક્ષણિક સુખ ક્ષણિક સંતોષ જ આપે છે."],"qa":[["શું 5.18નો અર્થ છે કે બધા સાથે બિલકુલ એક સરખો વ્યવહાર થાય?","તે સમદર્શનની વાત કરે છે: બધામાં એક જ આત્મા જોવો. ટીકાકારો સહમત છે કે તે તિરસ્કારને નકારે છે; પણ તે સામાજિક વ્યવહારમાં કેટલું લાગુ પડે તે વિશે મત જુદા છે."]],"conn":"અધ્યાય 6 ધ્યાનનો અભ્યાસ બતાવે છે જે અહીં વર્ણવેલા મનને સ્થિર કરે છે.","quiz":[["5.2માં કૃષ્ણ અર્જુન માટે કોને વધુ સારું કહે છે?",["કર્મ સંન્યાસ","કર્મયોગ","એકેય નહીં","તીર્થયાત્રા"],1],["5.10 આસક્તિ વગરના કર્મ માટે કયું ઉદાહરણ આપે છે?",["ખડક","પાણીમાં કમળનું પાન","બળતો દીવો","વહેતી નદી"],1],["5.18 શાનું વર્ણન કરે છે?",["બધા જીવો પ્રત્યે સમદૃષ્ટિ","પ્રાણીઓનો ક્રમ","યજ્ઞના નિયમો","વિરાટ રૂપ"],0]]},"sa":"कर्मसंन्यासयोग","iast":"Karm Sanyās Yog","count":29,"gs":"કર્મસંન્યાસયોગ"},{"n":6,"key":["6.5","6.6","6.17","6.19","6.26","6.32","6.35","6.47"],"concepts":["yoga","manas","samatvam"],"en":{"title":"The Yoga of Meditation","intro":"Krishna describes meditation in practical detail: a clean, steady seat, a straight posture, a calm mind, moderation in food and sleep. Arjuna objects that the mind is restless like the wind. Krishna agrees and says it can be trained by practice and detachment. He reassures Arjuna that no sincere effort is ever wasted.","why":"The steady mind praised in earlier chapters needs a method. This chapter gives one.","ideas":["Lift yourself by yourself; you are your own friend and your own enemy (6.5–6.6).","Yoga is for one moderate in eating, sleeping, work and rest (6.16–6.17).","The steady mind is like a lamp in a windless place (6.19).","The mind is controlled by practice (abhyasa) and detachment (vairagya) (6.35)."],"summary":"Meditation is not escape; it is training the mind that must then act in the world.","lessons":["Build small, consistent practices rather than extreme ones.","When your mind wanders, bring it back without self-blame (6.26).","Feel others' joys and sorrows as your own (6.32)."],"qa":[["What happens to someone who fails in yoga?","Arjuna asks this (6.37–6.39). Krishna replies that no one who does good comes to a bad end, and that effort carries forward (6.40–6.45)."]],"conn":"Chapter 7 shifts from practice to knowledge of the Divine, the object of meditation.","quiz":[["According to 6.5–6.6, who is your friend and enemy?",["Your family","Your own self","Your teacher","Fate"],1],["What image describes a steady mind in 6.19?",["A lamp in a windless place","A mountain","A deep lake","A strong chariot"],0],["How does 6.35 say the mind is controlled?",["By force only","By practice and detachment","By fasting","It cannot be controlled"],1]]},"hi":{"title":"ध्यान योग","intro":"कृष्ण ध्यान का व्यावहारिक वर्णन करते हैं: साफ़ और स्थिर आसन, सीधा बैठना, शांत मन, भोजन और नींद में संयम। अर्जुन कहते हैं कि मन हवा की तरह चंचल है। कृष्ण मानते हैं, और कहते हैं कि अभ्यास और वैराग्य से इसे साधा जा सकता है। वे अर्जुन को भरोसा दिलाते हैं कि सच्चा प्रयास कभी व्यर्थ नहीं जाता।","why":"पहले के अध्यायों में जिस स्थिर मन की प्रशंसा हुई, उसके लिए एक विधि चाहिए। यह अध्याय वह देता है।","ideas":["अपना उद्धार स्वयं करो; तुम ही अपने मित्र हो और तुम ही शत्रु (6.5–6.6)।","योग उसके लिए है जो खाने, सोने, काम और आराम में संयमित है (6.16–6.17)।","स्थिर मन हवा रहित जगह में दीपक की तरह है (6.19)।","मन अभ्यास और वैराग्य से वश में होता है (6.35)।"],"summary":"ध्यान भागना नहीं है; यह उस मन का प्रशिक्षण है जिसे फिर संसार में कर्म करना है।","lessons":["अति के बजाय छोटे, नियमित अभ्यास बनाएँ।","मन भटके तो बिना ख़ुद को कोसे उसे वापस लाएँ (6.26)।","दूसरों के सुख-दुःख को अपने जैसा अनुभव करें (6.32)।"],"qa":[["योग में असफल व्यक्ति का क्या होता है?","अर्जुन यही पूछते हैं (6.37–6.39)। कृष्ण कहते हैं कि भलाई करने वाले की कभी दुर्गति नहीं होती, और प्रयास आगे साथ जाता है (6.40–6.45)।"]],"conn":"अध्याय 7 अभ्यास से हटकर ईश्वर के ज्ञान पर आता है, जो ध्यान का लक्ष्य है।","quiz":[["6.5–6.6 के अनुसार तुम्हारा मित्र और शत्रु कौन है?",["तुम्हारा परिवार","तुम स्वयं","तुम्हारा गुरु","भाग्य"],1],["6.19 में स्थिर मन का कौन-सा उदाहरण है?",["हवा रहित स्थान में दीपक","पर्वत","गहरी झील","मज़बूत रथ"],0],["6.35 के अनुसार मन कैसे वश में होता है?",["केवल बल से","अभ्यास और वैराग्य से","उपवास से","वश में नहीं होता"],1]]},"gu":{"title":"ધ્યાન યોગ","intro":"કૃષ્ણ ધ્યાનનું વ્યવહારુ વર્ણન કરે છે: સ્વચ્છ અને સ્થિર આસન, ટટ્ટાર બેસવું, શાંત મન, ખાવા અને ઊંઘવામાં સંયમ. અર્જુન કહે છે કે મન પવન જેવું ચંચળ છે. કૃષ્ણ સ્વીકારે છે, અને કહે છે કે અભ્યાસ અને વૈરાગ્યથી તેને કેળવી શકાય. તેઓ અર્જુનને ખાતરી આપે છે કે સાચો પ્રયત્ન ક્યારેય વ્યર્થ જતો નથી.","why":"અગાઉના અધ્યાયોમાં જે સ્થિર મનની પ્રશંસા થઈ, તેના માટે એક રીત જોઈએ. આ અધ્યાય તે આપે છે.","ideas":["પોતાનો ઉદ્ધાર પોતે કરો; તમે જ તમારા મિત્ર છો અને તમે જ શત્રુ (6.5–6.6).","યોગ એના માટે છે જે ખાવા, ઊંઘવા, કામ અને આરામમાં સંયમી છે (6.16–6.17).","સ્થિર મન પવન વગરની જગ્યાએ દીવા જેવું છે (6.19).","મન અભ્યાસ અને વૈરાગ્યથી વશ થાય છે (6.35)."],"summary":"ધ્યાન ભાગી જવું નથી; તે એ મનની તાલીમ છે જેણે પછી જગતમાં કર્મ કરવાનું છે.","lessons":["અતિરેકને બદલે નાના, નિયમિત અભ્યાસ બનાવો.","મન ભટકે તો પોતાને દોષ દીધા વગર તેને પાછું લાવો (6.26).","બીજાનાં સુખ-દુઃખને પોતાનાં જેવાં અનુભવો (6.32)."],"qa":[["યોગમાં નિષ્ફળ જનારનું શું થાય?","અર્જુન આ જ પૂછે છે (6.37–6.39). કૃષ્ણ કહે છે કે ભલું કરનારની ક્યારેય દુર્ગતિ થતી નથી, અને પ્રયત્ન આગળ સાથે જાય છે (6.40–6.45)."]],"conn":"અધ્યાય 7 અભ્યાસથી ઈશ્વરના જ્ઞાન તરફ વળે છે, જે ધ્યાનનું લક્ષ્ય છે.","quiz":[["6.5–6.6 પ્રમાણે તમારો મિત્ર અને શત્રુ કોણ છે?",["તમારું કુટુંબ","તમે પોતે","તમારા ગુરુ","ભાગ્ય"],1],["6.19માં સ્થિર મનનું કયું ઉદાહરણ છે?",["પવન વગરની જગ્યાએ દીવો","પર્વત","ઊંડું સરોવર","મજબૂત રથ"],0],["6.35 પ્રમાણે મન કેવી રીતે વશ થાય?",["ફક્ત બળથી","અભ્યાસ અને વૈરાગ્યથી","ઉપવાસથી","વશ થતું જ નથી"],1]]},"sa":"ध्यानयोग","iast":"Dhyān Yog","count":47,"gs":"ધ્યાનયોગ"},{"n":7,"key":["7.3","7.4","7.5","7.7","7.14","7.16","7.19"],"concepts":["prakriti","maya","bhakti","jnana"],"en":{"title":"Knowledge and Realisation","intro":"Krishna begins teaching about his own nature. He has a lower nature (the eight elements of matter and mind) and a higher nature (the life principle). Everything is strung on him like pearls on a thread. His maya made of the three gunas is hard to cross, but those who turn to him cross it. Four kinds of people worship him.","why":"Having taught how to act and meditate, Krishna now explains what the seeker is ultimately seeking.","ideas":["Few seek, and of those few truly know (7.3).","Two natures: lower (earth, water, fire, air, space, mind, intellect, ego) and higher (life) (7.4–7.5).","All is strung on the Divine like pearls on a thread (7.7).","Four kinds of devotees: the distressed, the seeker of knowledge, the seeker of wealth, and the wise (7.16)."],"summary":"The Divine is both the material and the conscious ground of the world.","lessons":["Seeking itself is rare; value it.","Notice what kind of seeker you are right now, without judging.","Look for the common thread beneath diversity."],"qa":[["Does 7.16 rank the distressed worshipper as lower?","Krishna calls all four noble (7.18) but says the wise person, who seeks him for himself, is especially dear."]],"conn":"Chapter 8 answers questions Arjuna raises about terms used at the end of this chapter (Brahman, adhyatma, karma, etc.).","quiz":[["How many elements make up Krishna's lower nature in 7.4?",["Five","Eight","Three","Eighteen"],1],["What image does 7.7 use?",["Pearls on a thread","A banyan tree","A wheel","A river"],0],["Which is NOT one of the four kinds of devotees in 7.16?",["The distressed","The seeker of wealth","The wise","The warrior"],3]]},"hi":{"title":"ज्ञान-विज्ञान योग","intro":"कृष्ण अपने स्वरूप के बारे में बताना शुरू करते हैं। उनकी एक अपरा प्रकृति है (भौतिक और मानसिक आठ तत्त्व) और एक परा प्रकृति (जीव तत्त्व)। सब कुछ उनमें धागे में मोतियों की तरह पिरोया है। तीन गुणों वाली उनकी माया को पार करना कठिन है, पर जो उनकी शरण आते हैं वे पार कर जाते हैं। चार प्रकार के लोग उन्हें भजते हैं।","why":"कर्म और ध्यान सिखाने के बाद कृष्ण अब बताते हैं कि साधक अंततः किसे खोज रहा है।","ideas":["कम लोग खोजते हैं, और उनमें भी कम सचमुच जानते हैं (7.3)।","दो प्रकृतियाँ: अपरा (पृथ्वी, जल, अग्नि, वायु, आकाश, मन, बुद्धि, अहंकार) और परा (जीव) (7.4–7.5)।","सब कुछ धागे में मोतियों की तरह ईश्वर में पिरोया है (7.7)।","चार प्रकार के भक्त: आर्त, जिज्ञासु, अर्थार्थी और ज्ञानी (7.16)।"],"summary":"ईश्वर संसार का भौतिक और चेतन दोनों आधार है।","lessons":["खोजना ही दुर्लभ है; इसकी क़द्र करें।","देखें कि आप अभी किस प्रकार के साधक हैं, बिना ख़ुद को आँके।","विविधता के नीचे के साझा धागे को खोजें।"],"qa":[["क्या 7.16 दुःखी भक्त को नीचा मानता है?","कृष्ण चारों को उदार कहते हैं (7.18), पर कहते हैं कि ज्ञानी, जो उन्हें उन्हीं के लिए चाहता है, विशेष प्रिय है।"]],"conn":"अध्याय 8 इस अध्याय के अंत में आए शब्दों (ब्रह्म, अध्यात्म, कर्म आदि) पर अर्जुन के प्रश्नों का उत्तर देता है।","quiz":[["7.4 में कृष्ण की अपरा प्रकृति में कितने तत्त्व हैं?",["पाँच","आठ","तीन","अठारह"],1],["7.7 कौन-सा उदाहरण देता है?",["धागे में मोती","बरगद का पेड़","पहिया","नदी"],0],["7.16 के चार भक्तों में कौन नहीं है?",["आर्त","अर्थार्थी","ज्ञानी","योद्धा"],3]]},"gu":{"title":"જ્ઞાન-વિજ્ઞાન યોગ","intro":"કૃષ્ણ પોતાના સ્વરૂપ વિશે કહેવાનું શરૂ કરે છે. તેમની એક અપરા પ્રકૃતિ છે (ભૌતિક અને માનસિક આઠ તત્ત્વ) અને એક પરા પ્રકૃતિ (જીવ તત્ત્વ). બધું તેમનામાં દોરામાં મોતીની જેમ પરોવાયેલું છે. ત્રણ ગુણવાળી તેમની માયા પાર કરવી અઘરી છે, પણ જે તેમના શરણે આવે છે તે પાર કરી જાય છે. ચાર પ્રકારના લોકો તેમને ભજે છે.","why":"કર્મ અને ધ્યાન શીખવ્યા પછી કૃષ્ણ હવે કહે છે કે સાધક છેવટે શું શોધે છે.","ideas":["થોડા લોકો શોધે છે, અને તેમાંથી પણ થોડા સાચું જાણે છે (7.3).","બે પ્રકૃતિ: અપરા (પૃથ્વી, જળ, અગ્નિ, વાયુ, આકાશ, મન, બુદ્ધિ, અહંકાર) અને પરા (જીવ) (7.4–7.5).","બધું દોરામાં મોતીની જેમ ઈશ્વરમાં પરોવાયેલું છે (7.7).","ચાર પ્રકારના ભક્ત: આર્ત, જિજ્ઞાસુ, અર્થાર્થી અને જ્ઞાની (7.16)."],"summary":"ઈશ્વર જગતનો ભૌતિક અને ચેતન બંને આધાર છે.","lessons":["શોધવું જ દુર્લભ છે; તેની કદર કરો.","જુઓ કે તમે અત્યારે કયા પ્રકારના સાધક છો, પોતાને માપ્યા વગર.","વિવિધતાની નીચેનો સામાન્ય દોરો શોધો."],"qa":[["શું 7.16 દુઃખી ભક્તને નીચો માને છે?","કૃષ્ણ ચારેયને ઉદાર કહે છે (7.18), પણ કહે છે કે જ્ઞાની, જે તેમને તેમના માટે જ ઇચ્છે છે, વિશેષ પ્રિય છે."]],"conn":"અધ્યાય 8 આ અધ્યાયના અંતે આવેલા શબ્દો (બ્રહ્મ, અધ્યાત્મ, કર્મ વગેરે) પર અર્જુનના પ્રશ્નોનો જવાબ આપે છે.","quiz":[["7.4માં કૃષ્ણની અપરા પ્રકૃતિમાં કેટલાં તત્ત્વ છે?",["પાંચ","આઠ","ત્રણ","અઢાર"],1],["7.7 કયું ઉદાહરણ આપે છે?",["દોરામાં મોતી","વડનું ઝાડ","પૈડું","નદી"],0],["7.16ના ચાર ભક્તોમાં કોણ નથી?",["આર્ત","અર્થાર્થી","જ્ઞાની","યોદ્ધો"],3]]},"sa":"ज्ञानविज्ञानयोग","iast":"Jñāna Vijñāna Yog","count":30,"gs":"જ્ઞાનવિજ્ઞાનયોગ"},{"n":8,"key":["8.3","8.5","8.6","8.7","8.15","8.24"],"concepts":["brahman","moksha"],"en":{"title":"The Imperishable Absolute","intro":"Arjuna asks seven questions about terms like Brahman, adhyatma, karma and how the Divine is known at death. Krishna defines them and teaches that what a person remembers at the moment of death shapes their next state. He describes the cosmic cycles of creation and dissolution and the two paths souls take after death.","why":"Chapter 7 ended with technical terms. Arjuna wants them explained, and the topic of death returns.","ideas":["Brahman is the imperishable; adhyatma is one's essential nature (8.3).","What you remember at death, you attain (8.5–8.6).","So remember the Divine at all times, and fight (8.7).","Creation and dissolution happen in vast cycles (8.17–8.19)."],"summary":"Life-long orientation shapes one's final moment; the teaching is to live remembering what is highest.","lessons":["The thoughts you repeat daily become your default.","Practice remembering what matters while doing ordinary work (8.7).","Big-time cycles put daily worries in perspective."],"qa":[["Is 8.24–8.25 (the two paths) literal?","Some traditions read it literally as paths of light and smoke after death. Others, including some Vedantic commentators, read the terms as deities or symbols. The text describes them in cosmological terms."]],"conn":"Chapter 9 continues with the 'royal secret' of devotion.","quiz":[["How many questions does Arjuna ask at the start of Chapter 8?",["One","Three","Seven","Eighteen"],2],["What does 8.7 tell Arjuna to do?",["Remember me and fight","Leave the battle","Meditate forever","Perform rituals"],0],["According to 8.6, what shapes one's next state?",["Wealth","What one remembers at death","Family name","Place of death"],1]]},"hi":{"title":"अक्षर-ब्रह्म योग","intro":"अर्जुन ब्रह्म, अध्यात्म, कर्म जैसे शब्दों और मृत्यु के समय ईश्वर को कैसे जानें, इस पर सात प्रश्न पूछते हैं। कृष्ण इनकी परिभाषा देते हैं और सिखाते हैं कि मृत्यु के समय व्यक्ति जो स्मरण करता है वही उसकी अगली अवस्था तय करता है। वे सृष्टि और
