<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Gita Pathshala (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn the Bhagavad Gita from zero: all 701 verses with Sanskrit, transliteration and translation, plain-language explanations in English, Hindi and Gujarati.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Tiro+Devanagari+Sanskrit:ital@0;1&family=Tiro+Devanagari+Hindi&family=Noto+Serif+Gujarati:wght@400;600&family=Hind:wght@400;500;600&family=Hind+Vadodara:wght@400;500;600&display=swap">
<style>
/* Layout: a calm reading desk — sticky slim nav, one 46rem reading column, wider grid pages; the 18-chapter ring is the signature element. */
:root{
  --paper:#F8F4EB; --card:#FFFDF7; --ink:#1A2340; --ink2:#4B5370; --muted:#767B8E;
  --line:#E5DDCB; --wash:#F1EADB; --saffron:#B8682A; --saffron-soft:#F3E1CC; --gold:#A8873E; --navy:#1E2B55; --ok:#2F7A55; --ok-soft:#DDEFE3;
  --f-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-ui:"Hind","Segoe UI",system-ui,sans-serif;
  --f-sa:"Tiro Devanagari Sanskrit","Noto Serif Devanagari","Nirmala UI",serif;
  --f-hi:"Tiro Devanagari Hindi","Noto Serif Devanagari","Nirmala UI",serif;
  --f-gu:"Noto Serif Gujarati","Nirmala UI",serif;
  --f-gu-ui:"Hind Vadodara","Nirmala UI",sans-serif;
  --r:12px; --peacock:#0E6E6E; --peacock-soft:#D9ECE8; --eye:#1E2F7A; --feather:#6E9A4B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1426; --card:#161D35; --ink:#EDE7D9; --ink2:#C3C0B6; --muted:#9097AC; --line:#2A3253; --wash:#1B2342;
  --saffron:#E39A56; --saffron-soft:#3A2A1E; --gold:#D2B472; --navy:#A9B8E8; --ok:#6CC495; --ok-soft:#173327; --peacock:#4CC3B5; --peacock-soft:#123634; --eye:#8FA6FF; --feather:#9CC77A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1426; --card:#161D35; --ink:#EDE7D9; --ink2:#C3C0B6; --muted:#9097AC; --line:#2A3253; --wash:#1B2342;
  --saffron:#E39A56; --saffron-soft:#3A2A1E; --gold:#D2B472; --navy:#A9B8E8; --ok:#6CC495; --ok-soft:#173327; --peacock:#4CC3B5; --peacock-soft:#123634; --eye:#8FA6FF; --feather:#9CC77A; color-scheme:dark}
html[lang="hi"]{--f-body:var(--f-hi);--f-display:var(--f-hi)}
html[lang="gu"]{--f-body:var(--f-gu);--f-display:var(--f-gu);--f-ui:var(--f-gu-ui)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.65;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--navy);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem);letter-spacing:-.01em}
h2{font-size:clamp(1.35rem,2.6vw,1.7rem)}
h3{font-size:1.2rem}
p{margin:0}
.wrap{max-width:72rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:46rem;margin:0 auto}
.ui,.chip,.btn,nav,.eyebrow,.meta,label,small{font-family:var(--f-ui)}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--saffron);font-weight:600}
html[lang="hi"] .eyebrow,html[lang="gu"] .eyebrow{letter-spacing:.02em;text-transform:none;font-size:.88rem}
.meta{color:var(--muted);font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding-block:.55rem}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.12rem;white-space:nowrap}
.brand svg{flex:none}
.navscroll{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.navscroll::-webkit-scrollbar{display:none}
nav.main{display:flex;gap:.15rem;white-space:nowrap}
nav.main a{padding:.35rem .6rem;border-radius:6px;text-decoration:none;color:var(--ink2);font-size:.93rem}
nav.main a:hover{background:var(--wash)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--saffron-soft)}
.tools{display:flex;gap:.4rem;align-items:center;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;height:34px;min-width:34px;display:inline-grid;place-items:center;cursor:pointer;padding:0 .5rem}
.iconbtn:hover{border-color:var(--gold)}
.iconbtn[aria-pressed="true"]{background:var(--saffron-soft);border-color:var(--saffron)}
select.lang{height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 .4rem;font-family:var(--f-ui)}
@media (max-width:760px){.top .wrap{flex-wrap:wrap;gap:.4rem}.navscroll{order:3;flex-basis:100%}.brand span{font-size:1rem}.tools{margin-left:auto}}

main{padding-block:2rem 4rem;min-height:70vh}
.reading header.top nav.main,.reading .hide-reading{display:none}
.reading main{padding-top:1.2rem}
.reading .vcard .sa{font-size:1.6rem}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.05rem;border-radius:999px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);cursor:pointer;font-weight:500;font-size:.95rem}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
:root[data-theme="dark"] .btn.primary{color:#0F1426}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F1426}}
.btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:999px;font-size:.8rem;border:1px solid var(--line);background:var(--card);color:var(--ink2);text-decoration:none;white-space:nowrap}
a.chip:hover{border-color:var(--gold);color:var(--ink)}
.chip.full{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.spk{background:var(--wash);border-color:transparent}
.chip.sf{background:var(--saffron-soft);border-color:transparent;color:var(--saffron)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.25rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr))}
.grid>*{min-width:0}
a.tile{display:flex;flex-direction:column;gap:.45rem;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.15rem;transition:border-color .15s}
a.tile:hover{border-color:var(--gold)}
a.tile p{color:var(--ink2);font-size:.95rem}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:2.5rem;align-items:center;padding-block:1rem 2.5rem}
.hero h1{font-size:clamp(2.1rem,5vw,3.3rem)}
.hero .lead{font-size:1.15rem;color:var(--ink2);margin-top:1rem;max-width:36rem}
.hero .note{margin-top:1.1rem;padding-left:.9rem;border-left:2px solid var(--gold);color:var(--ink2);font-size:.98rem;max-width:34rem}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:1.5rem}}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.ringbox .ring{width:100%;height:auto}
.ring-seg{cursor:pointer}
.ring-seg:hover .bg{stroke:var(--gold)}

/* verse */
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem;align-items:baseline}
.vref{font-family:var(--f-ui);font-weight:600;color:var(--saffron);font-size:.95rem;letter-spacing:.04em}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.6rem 1.4rem;text-align:center;position:relative}
.vcard::before,.vcard::after{content:"";position:absolute;left:50%;width:42px;height:1px;background:var(--gold);transform:translateX(-50%)}
.vcard::before{top:.8rem}.vcard::after{bottom:.8rem}
.sa{font-family:var(--f-sa);font-size:clamp(1.25rem,3.2vw,1.55rem);line-height:1.9;white-space:pre-line;color:var(--ink)}
.gs{font-family:var(--f-gu);font-size:1.15rem;line-height:1.85;white-space:pre-line;color:var(--ink2);margin-top:.6rem}
.iast{font-family:var(--f-body);font-style:italic;color:var(--ink2);white-space:pre-line;margin-top:.8rem;font-size:1.02rem}
html[lang="hi"] .iast,html[lang="gu"] .iast{font-family:"Source Serif 4",Georgia,serif}
.sec{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:.2rem .8rem;padding-block:1.2rem;border-top:1px solid var(--line)}
.sec .n{font-family:var(--f-ui);font-size:.8rem;color:var(--gold);font-weight:600;padding-top:.25rem;font-variant-numeric:tabular-nums}
.sec h3{font-size:1.1rem;margin-bottom:.45rem}
.sec .body{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.wbw{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:.3rem 1rem;font-size:.98rem}
.wbw dt{font-style:italic;color:var(--saffron);font-family:"Source Serif 4",Georgia,serif}
.wbw dd{margin:0}
@media (max-width:520px){.wbw{grid-template-columns:minmax(0,1fr)}.wbw dd{margin-bottom:.45rem;color:var(--ink2)}}
.ex{display:grid;gap:.7rem}
.ex>div{padding:.8rem 1rem;background:var(--wash);border-radius:8px}
.interp{display:grid;gap:.6rem}
.interp>div{border-left:2px solid var(--gold);padding-left:.85rem}
.interp b{font-family:var(--f-ui);font-size:.92rem;display:block;color:var(--ink)}
.take{font-family:var(--f-display);font-size:1.25rem;color:var(--navy);line-height:1.4}
.reflect{font-style:italic}
.pub{background:var(--wash);border-radius:8px;padding:.9rem 1rem}
.pub .meta{margin-top:.4rem}
.status{display:flex;gap:.7rem;align-items:flex-start;padding:.9rem 1rem;border-radius:8px;background:var(--saffron-soft);color:var(--ink);font-size:.97rem}
.aibox{border:1px dashed var(--gold);border-radius:10px;padding:1rem}
.vactions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem}
textarea.notes{width:100%;min-height:6.5rem;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:.75rem;resize:vertical;font-family:var(--f-body);font-size:1rem}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1.5rem}
.pager a{display:flex;flex-direction:column;gap:.1rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--card);min-width:0}
.pager a:hover{border-color:var(--gold)}
.pager a.next{text-align:right}
.pager span{font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.pager b{font-family:var(--f-ui);font-weight:600}

/* chapter verse grid */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.1rem,1fr));gap:.4rem}
.vgrid a{position:relative;display:grid;place-items:center;height:2.6rem;border-radius:8px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink2);font-family:var(--f-ui);font-size:.92rem;font-variant-numeric:tabular-nums}
.vgrid a:hover{border-color:var(--gold);color:var(--ink)}
.vgrid a.x{border-color:var(--saffron);color:var(--saffron);font-weight:600}
.vgrid a.d{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.vgrid a.b::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:1rem;font-family:var(--f-ui);font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:.3rem}
.bar{height:6px;border-radius:99px;background:var(--wash);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--saffron);border-radius:99px}
ul.clean{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.5rem}
ul.dot{margin:0;padding-left:1.15rem;display:flex;flex-direction:column;gap:.4rem}
details{border-top:1px solid var(--line);padding-block:.8rem}
details summary{cursor:pointer;font-weight:600;font-family:var(--f-display)}
details>div{margin-top:.6rem;color:var(--ink2)}

/* quiz */
.q{display:flex;flex-direction:column;gap:.5rem;padding-block:1rem;border-top:1px solid var(--line)}
.q label{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-family:var(--f-body)}
.q label.right{border-color:var(--ok);background:var(--ok-soft)}
.q label.wrong{border-color:var(--saffron);background:var(--saffron-soft)}

/* timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:1.2rem;padding-left:1.6rem}
.tl::before{content:"";position:absolute;left:.45rem;top:.4rem;bottom:.4rem;width:2px;background:var(--line)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-1.42rem;top:.45rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--paper);border:2px solid var(--gold)}
.tl>div.hist::before{border-color:var(--navy)}
.tl>div.text::before{background:var(--saffron);border-color:var(--saffron)}

/* ask */
.chat{display:flex;flex-direction:column;gap:1rem}
.msg{padding:1rem 1.1rem;border-radius:12px;min-width:0}
.msg.u{background:var(--wash);align-self:flex-end;max-width:85%}
.msg.a{background:var(--card);border:1px solid var(--line)}
.msg.a h4{font-size:1.05rem;margin:.8rem 0 .3rem}
.msg.a h4:first-child{margin-top:0}
.msg.a p{margin:.45rem 0}
.msg.a ul{margin:.4rem 0;padding-left:1.2rem}
.msg.a blockquote{margin:.6rem 0;padding:.5rem .9rem;border-left:2px solid var(--gold);font-family:var(--f-sa);white-space:pre-line;background:var(--wash);border-radius:0 6px 6px 0}
.askform{display:flex;gap:.5rem;align-items:flex-end}
.askform textarea{flex:1;min-width:0;min-height:3rem;max-height:10rem;border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;background:var(--card);resize:vertical;font-family:var(--f-body)}
.searchbox{width:100%;padding:.85rem 1rem;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:1.05rem}
.res a{display:block;padding:.7rem .2rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.res a:hover{background:var(--wash)}
.res .s{font-family:var(--f-sa);color:var(--ink2);font-size:.95rem}
.stat{display:flex;flex-direction:column;gap:.15rem}
.stat b{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.confirmbox{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.8rem 1rem;border:1px solid var(--saffron);border-radius:10px;background:var(--saffron-soft)}
footer{border-top:1px solid var(--line);padding-block:1.6rem 2.5rem;color:var(--muted);font-family:var(--f-ui);font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- v2: peacock & bansuri art, interactivity ---- */
body{background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--peacock) 10%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 30%,color-mix(in srgb,var(--gold) 9%,transparent),transparent 60%),var(--paper);background-attachment:fixed}
.hero{position:relative;isolation:isolate}
.ringbox{position:relative;isolation:isolate;padding:1rem 0}
.hero-art{position:absolute;inset:0;z-index:-1;pointer-events:none}
.ringwrap{width:100%;max-width:300px;border-radius:50%;background:color-mix(in srgb,var(--paper) 78%,transparent);backdrop-filter:blur(2px)}
.ringwrap svg{display:block;width:100%;height:auto}
.hero-feather{position:absolute;right:-4%;top:-12%;height:115%;width:auto;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(14,110,110,.18))}
.hero-flute{position:absolute;left:-12%;bottom:14%;width:115%;height:auto;transform:rotate(-16deg);filter:drop-shadow(0 6px 10px rgba(80,50,10,.22))}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-feather{right:4%;height:105%}.hero-flute{left:-4%;width:105%}}
.hero-text{position:relative}
.hero-text h1{margin-top:.6rem;font-size:clamp(2.1rem,5vw,3.3rem)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.fluting .hero-feather{animation-duration:2.2s}
.fluting .hero-flute{animation:hum .5s ease-in-out infinite}
@keyframes hum{0%,100%{transform:rotate(-16deg) translateY(0)}50%{transform:rotate(-16deg) translateY(-2px)}}

.btn.ghost{background:transparent;border-color:var(--peacock);color:var(--peacock)}
.btn.ghost.on{background:var(--peacock);color:var(--card)}
.btn.small{padding:.35rem .8rem;font-size:.85rem}
.btn.primary{background:linear-gradient(135deg,var(--navy),var(--peacock));border-color:transparent}
.chip.pea{background:var(--peacock-soft);color:var(--peacock);border-color:transparent}
.divider{display:flex;align-items:center;gap:1rem;margin:2.2rem 0 1.4rem}
.divider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider svg{width:22px;height:56px;transform:rotate(90deg);opacity:.9}
.mood h2{font-size:1.5rem}
.moodchip{display:inline-flex;padding:.5rem 1rem;border-radius:999px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-family:var(--f-ui);transition:transform .15s,border-color .15s,background .15s}
.moodchip:hover{border-color:var(--peacock);background:var(--peacock-soft);transform:translateY(-2px)}
a.tile{position:relative;overflow:hidden}
a.tile:hover{border-color:var(--peacock);transform:translateY(-2px);box-shadow:0 10px 24px -14px color-mix(in srgb,var(--peacock) 60%,transparent)}
a.tile{transition:transform .18s,box-shadow .18s,border-color .18s}
.tile.daily{background:linear-gradient(160deg,var(--card),var(--peacock-soft))}
.take-s{color:var(--peacock);font-family:var(--f-display);font-size:1.05rem}
.drawbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.5rem;align-items:center;margin-top:2.5rem;padding:1.4rem;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.drawcard{width:88px;height:128px;border-radius:12px;background:linear-gradient(160deg,var(--peacock),var(--eye));display:grid;place-items:center;box-shadow:0 10px 20px -10px var(--peacock);transition:transform .6s}
.drawcard svg{height:110px}
.drawcard.spin{transform:rotateY(540deg) scale(1.08)}
.chtile .chnum{position:absolute;right:.6rem;top:-.4rem;font-family:var(--f-display);font-size:4.2rem;line-height:1;color:var(--peacock);opacity:.09;pointer-events:none}
.journey{margin-top:1.4rem;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.5rem}
.journey svg{min-width:640px;width:100%;height:auto;display:block}
.jn circle{transition:r .15s}.jn:hover circle:first-child{stroke:var(--peacock)}
.chhead{display:flex;gap:1.2rem;align-items:flex-start}

<script type="application/json" id="VDATA">[{"c":1,"v":1,"sp":"dhritarashtra","sa":"धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः ।\nमामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय ॥","tr":"dharmakṣetre kurukṣetre samavetā yuyutsavaḥ\nmāmakāḥ pāṇḍavāścaiva kimakurvata sañjaya","gs":"ધર્મક્ષેત્રે કુરુક્ષેત્રે સમવેતા યુયુત્સવઃ ।\nમામકાઃ પાણ્ડવાશ્ચૈવ કિમકુર્વત સઞ્જય ॥","en":"Dhritarashtra said, \"What did my people and the sons of Pandu do when they had assembled together, eager for battle, on the holy plain of Kurukshetra, O Sanjaya?\"","hi":"धृतराष्ट्र बोले - हे संजय! धर्मभूमि कुरुक्षेत्र में युद्ध की इच्छा से इकट्ठे हुए मेरेे और पाण्डु के पुत्रों ने भी क्या किया?"},{"c":1,"v":2,"sp":"sanjaya","sa":"दृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा ।\nआचार्यमुपसङ्गम्य राजा वचनमब्रवीत् ॥","tr":"dṛṣṭvā tu pāṇḍavānīkaṃ vyūḍhaṃ duryodhanastadā\nācāryamupasaṅgamya rājā vacanamabravīt","gs":"દૃષ્ટ્વા તુ પાણ્ડવાનીકં વ્યૂઢં દુર્યોધનસ્તદા ।\nઆચાર્યમુપસઙ્ગમ્ય રાજા વચનમબ્રવીત્ ॥","en":"Sanjaya said: Having seen the army of the Pandavas drawn up in battle array, King Duryodhana approached his teacher, Drona, and spoke these words.","hi":"संजय बोले - उस समय वज्रव्यूह-से खड़ी हुई पाण्डव-सेना को देखकर राजा दुर्योधन द्रोणाचार्य के पास जाकर यह वचन बोला।"},{"c":1,"v":3,"sp":"sanjaya","sa":"पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम् ।\nव्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता ॥","tr":"paśyaitāṃ pāṇḍuputrāṇāmācārya mahatīṃ camūm\nvyūḍhāṃ drupadaputreṇa tava śiṣyeṇa dhīmatā","gs":"પશ્યૈતાં પાણ્ડુપુત્રાણામાચાર્ય મહતીં ચમૂમ્ ।\nવ્યૂઢાં દ્રુપદપુત્રેણ તવ શિષ્યેણ ધીમતા ॥","en":"Behold, O Teacher! This mighty army of the sons of Pandu, arrayed by the son of Drupada, thy wise disciple.","hi":"हे आचार्य! आपके बुद्धिमान् शिष्य द्रुपदपुत्र धृष्टद्युम्न के द्वारा व्यूहरचना से खड़ी की हुई पाण्डवों की इस बड़ी भारी सेना को देखिये"},{"c":1,"v":4,"sp":"sanjaya","sa":"अत्र शूरा महेष्वासा भीमार्जुनसमा युधि ।\nयुयुधानो विराटश्च द्रुपदश्च महारथः ॥","tr":"atra śūrā maheṣvāsā bhīmārjunasamā yudhi\nyuyudhāno virāṭaśca drupadaśca mahārathaḥ","gs":"અત્ર શૂરા મહેષ્વાસા ભીમાર્જુનસમા યુધિ ।\nયુયુધાનો વિરાટશ્ચ દ્રુપદશ્ચ મહારથઃ ॥","en":"Here are heroes, mighty archers, equal in battle to Bhima and Arjuna, Yuyudhana (Satyaki), Virata, and Drupada—all mighty warriors.","hi":"।।1.4 -- 1.6।। यहाँ (पाण्डवों की सेना में) बड़े-बड़े शूरवीर हैं, जिनके बहुत बड़े-बड़े धनुष हैं तथा जो युद्ध में भीम और अर्जुनके समान हैं। उनमें युयुधान (सात्यकि), राजा विराट और महारथी द्रुपद भी हैं। धृष्टकेतु और चेकितान तथा पराक्रमी काशिराज भी हैं। पुरुजित् और कुन्तिभोज--ये दोनों भाई तथा मनुष्योंमें श्रेष्ठ शैब्य भी हैं। पराक्रमी युधामन्यु और पराक्रमी उत्तमौजा भी हैं। सुभद्रापुत्र अभिमन्यु और द्रौपदी के पाँचों पुत्र भी हैं। ये सब-के-सब महारथी हैं।"},{"c":1,"v":5,"sp":"sanjaya","sa":"धृष्टकेतुश्चेकितानः काशिराजश्च वीर्यवान् ।\nपुरुजित्कुन्तिभोजश्च शैब्यश्च नरपुङ्गवः ॥","tr":"dhṛṣṭaketuścekitānaḥ kāśirājaśca vīryavān\npurujitkuntibhojaśca śaibyaśca narapuṅgavaḥ","gs":"ધૃષ્ટકેતુશ્ચેકિતાનઃ કાશિરાજશ્ચ વીર્યવાન્ ।\nપુરુજિત્કુન્તિભોજશ્ચ શૈબ્યશ્ચ નરપુઙ્ગવઃ ॥","en":"Dhrishtaketu, Chekitana, the valiant king of Kasi, Purujit, Kuntibhoja, and Saibya—the best of men.","hi":"।।1.4 -- 1.6।। यहाँ (पाण्डवों की सेना में) बड़े-बड़े शूरवीर हैं, जिनके बहुत बड़े-बड़े धनुष हैं तथा जो युद्ध में भीम और अर्जुनके समान हैं। उनमें युयुधान (सात्यकि), राजा विराट और महारथी द्रुपद भी हैं। धृष्टकेतु और चेकितान तथा पराक्रमी काशिराज भी हैं। पुरुजित् और कुन्तिभोज--ये दोनों भाई तथा मनुष्योंमें श्रेष्ठ शैब्य भी हैं। पराक्रमी युधामन्यु और पराक्रमी उत्तमौजा भी हैं। सुभद्रापुत्र अभिमन्यु और द्रौपदी के पाँचों पुत्र भी हैं। ये सब-के-सब महारथी हैं।"},{"c":1,"v":6,"sp":"sanjaya","sa":"युधामन्युश्च विक्रान्त उत्तमौजाश्च वीर्यवान् ।\nसौभद्रो द्रौपदेयाश्च सर्व एव महारथाः ॥","tr":"yudhāmanyuśca vikrānta uttamaujāśca vīryavān\nsaubhadro draupadeyāśca sarva eva mahārathāḥ","gs":"યુધામન્યુશ્ચ વિક્રાન્ત ઉત્તમૌજાશ્ચ વીર્યવાન્ ।\nસૌભદ્રો દ્રૌપદેયાશ્ચ સર્વ એવ મહારથાઃ ॥","en":"The strong Yudhamanyu and the brave Uttamaujas, the son of Subhadra (Abhimanyu, the son of Subhadra and Arjuna), and the sons of Draupadi, all of them great charioteers (great heroes).\"","hi":"।।1.4 -- 1.6।। यहाँ (पाण्डवों की सेना में) बड़े-बड़े शूरवीर हैं, जिनके बहुत बड़े-बड़े धनुष हैं तथा जो युद्ध में भीम और अर्जुनके समान हैं। उनमें युयुधान (सात्यकि), राजा विराट और महारथी द्रुपद भी हैं। धृष्टकेतु और चेकितान तथा पराक्रमी काशिराज भी हैं। पुरुजित् और कुन्तिभोज--ये दोनों भाई तथा मनुष्योंमें श्रेष्ठ शैब्य भी हैं। पराक्रमी युधामन्यु और पराक्रमी उत्तमौजा भी हैं। सुभद्रापुत्र अभिमन्यु और द्रौपदी के पाँचों पुत्र भी हैं। ये सब-के-सब महारथी हैं।"},{"c":1,"v":7,"sp":"sanjaya","sa":"अस्माकं तु विशिष्टा ये तान्निबोध द्विजोत्तम ।\nनायका मम सैन्यस्य संज्ञार्थं तान्ब्रवीमि ते ॥","tr":"asmākaṃ tu viśiṣṭā ye tānnibodha dvijottama\nnāyakā mama sainyasya saṃjñārthaṃ tānbravīmi te","gs":"અસ્માકં તુ વિશિષ્ટા યે તાન્નિબોધ દ્વિજોત્તમ ।\nનાયકા મમ સૈન્યસ્ય સંજ્ઞાર્થં તાન્બ્રવીમિ તે ॥","en":"Know also, O best among the twice-born! the names of those who are the most distinguished amongst ourselves, the leaders of my army; these I name to you for your information.","hi":"हे द्विजोत्तम! हमारे पक्ष में भी जो मुख्य हैं, उनपर भी आप ध्यान दीजिये। आपको याद दिलाने के लिये मेरी सेना के जो नायक हैं, उनको मैं कहता हूँ।"},{"c":1,"v":8,"sp":"sanjaya","sa":"भवान्भीष्मश्च कर्णश्च कृपश्च समितिञ्जयः ।\nअश्वत्थामा विकर्णश्च सौमदत्तिस्तथैव च ॥","tr":"bhavānbhīṣmaśca karṇaśca kṛpaśca samitiñjayaḥ\naśvatthāmā vikarṇaśca saumadattistathaiva ca","gs":"ભવાન્ભીષ્મશ્ચ કર્ણશ્ચ કૃપશ્ચ સમિતિઞ્જયઃ ।\nઅશ્વત્થામા વિકર્ણશ્ચ સૌમદત્તિસ્તથૈવ ચ ॥","en":"\"Thou thyself, Bhishma, Karna, Kripa, the victorious in war, Asvatthama, Vikarna, and Bhurisrava, the son of Somadatta—all these are ready for battle.\"","hi":"आप (द्रोणाचार्य) और पितामह भीष्म तथा कर्ण और संग्रामविजयी कृपाचार्य तथा वैसे ही अश्वत्थामा, विकर्ण और सोमदत्त का पुत्र भूरिश्रवा।"},{"c":1,"v":9,"sp":"sanjaya","sa":"अन्ये च बहवः शूरा मदर्थे त्यक्तजीविताः ।\nनानाशस्त्रप्रहरणाः सर्वे युद्धविशारदाः ॥","tr":"anye ca bahavaḥ śūrā madarthe tyaktajīvitāḥ\nnānāśastrapraharaṇāḥ sarve yuddhaviśāradāḥ","gs":"અન્યે ચ બહવઃ શૂરા મદર્થે ત્યક્તજીવિતાઃ ।\nનાનાશસ્ત્રપ્રહરણાઃ સર્વે યુદ્ધવિશારદાઃ ॥","en":"And also many other heroes, ready to give up their lives for my sake, armed with various weapons and missiles, all well-skilled in battle.","hi":"इनके अतिरिक्त बहुत-से शूरवीर हैं, जिन्होंने मेरे लिये अपने जीने की इच्छा का भी त्याग कर दिया है और जो अनेक प्रकार के शस्त्र-अस्त्रों को चलानेवाले हैं तथा जो सब-के-सब युद्धकला में अत्यन्त चतुर हैं।"},{"c":1,"v":10,"sp":"sanjaya","sa":"अपर्याप्तं तदस्माकं बलं भीष्माभिरक्षितम् ।\nपर्याप्तं त्विदमेतेषां बलं भीमाभिरक्षितम् ॥","tr":"aparyāptaṃ tadasmākaṃ balaṃ bhīṣmābhirakṣitam\nparyāptaṃ tvidameteṣāṃ balaṃ bhīmābhirakṣitam","gs":"અપર્યાપ્તં તદસ્માકં બલં ભીષ્માભિરક્ષિતમ્ ।\nપર્યાપ્તં ત્વિદમેતેષાં બલં ભીમાભિરક્ષિતમ્ ॥","en":"Our army, marshalled by Bhishma, is insufficient, whereas theirs, marshalled by Bhima, is sufficient.","hi":"वह हमारी सेना पाण्डवों पर विजय करने में अपर्याप्त है, असमर्थ है; क्योंकि उसके संरक्षक (उभयपक्षपाती) भीष्म हैं। परन्तु इन पाण्डवों की सेना हमारे पर विजय करने में पर्याप्त है, समर्थ है; क्योंकि इसके संरक्षक (निजसेनापक्षपाती) भीमसेन हैं।"},{"c":1,"v":11,"sp":"sanjaya","sa":"अयनेषु च सर्वेषु यथाभागमवस्थिताः ।\nभीष्ममेवाभिरक्षन्तु भवन्तः सर्व एव हि ॥","tr":"ayaneṣu ca sarveṣu yathābhāgamavasthitāḥ\nbhīṣmamevābhirakṣantu bhavantaḥ sarva eva hi","gs":"અયનેષુ ચ સર્વેષુ યથાભાગમવસ્થિતાઃ ।\nભીષ્મમેવાભિરક્ષન્તુ ભવન્તઃ સર્વ એવ હિ ॥","en":"Therefore, do all of you, stationed in your respective positions in the several divisions of the army, protect Bhishma alone.","hi":"आप सब-के-सब लोग सभी मोर्चों पर अपनी-अपनी जगह दृढ़ता से स्थित रहते हुए ही पितामह भीष्म की चारों ओर से रक्षा करें।"},{"c":1,"v":12,"sp":"sanjaya","sa":"तस्य संजनयन्हर्षं कुरुवृद्धः पितामहः ।\nसिंहनादं विनद्योच्चैः शङ्खं दध्मौ प्रतापवान् ॥","tr":"tasya saṃjanayanharṣaṃ kuruvṛddhaḥ pitāmahaḥ\nsiṃhanādaṃ vinadyoccaiḥ śaṅkhaṃ dadhmau pratāpavān","gs":"તસ્ય સંજનયન્હર્ષં કુરુવૃદ્ધઃ પિતામહઃ ।\nસિંહનાદં વિનદ્યોચ્ચૈઃ શઙ્ખં દધ્મૌ પ્રતાપવાન્ ॥","en":"His glorious grandsire, the oldest of the Kauravas, roared like a lion to cheer Duryodhana and blew his conch.","hi":"दुर्योधन के हृदय में हर्ष उत्पन्न करते हुए कुरुवृद्ध प्रभावशाली पितामह भीष्म ने सिंह के समान गरज कर जोर से शंख बजाया।"},{"c":1,"v":13,"sp":"sanjaya","sa":"ततः शङ्खाश्च भेर्यश्च पणवानकगोमुखाः ।\nसहसैवाभ्यहन्यन्त स शब्दस्तुमुलोऽभवत् ॥","tr":"tataḥ śaṅkhāśca bheryaśca paṇavānakagomukhāḥ\nsahasaivābhyahanyanta sa śabdastumulo'bhavat","gs":"તતઃ શઙ્ખાશ્ચ ભેર્યશ્ચ પણવાનકગોમુખાઃ ।\nસહસૈવાભ્યહન્યન્ત સ શબ્દસ્તુમુલોઽભવત્ ॥","en":"Then, suddenly, conches, kettledrums, tabors, drums, and cow horns blared forth from the Kaurava side, and the sound was tremendous.","hi":"उसके बाद शंख, भेरी (नगाड़े), ढोल, मृदङ्ग और नरसिंघे बाजे एक साथ बज उठे। उनका वह शब्द बड़ा भयंकर हुआ।"},{"c":1,"v":14,"sp":"sanjaya","sa":"ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ ।\nमाधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः ॥","tr":"tataḥ śvetairhayairyukte mahati syandane sthitau\nmādhavaḥ pāṇḍavaścaiva divyau śaṅkhau pradadhmatuḥ","gs":"તતઃ શ્વેતૈર્હયૈર્યુક્તે મહતિ સ્યન્દને સ્થિતૌ ।\nમાધવઃ પાણ્ડવશ્ચૈવ દિવ્યૌ શઙ્ખૌ પ્રદધ્મતુઃ ॥","en":"Then, Madhava (Krishna) and the son of Pandu (Arjuna), seated in the magnificent chariot yoked with white horses, blew divine conches.","hi":"उसके बाद सफेद घोड़ों से युक्त महान् रथ पर बैठे हुए लक्ष्मीपति भगवान् श्रीकृष्ण और पाण्डुपुत्र अर्जुन ने दिव्य शंखों को बड़े जोर से बजाया।"},{"c":1,"v":15,"sp":"sanjaya","sa":"पाञ्चजन्यं हृषीकेशो देवदत्तं धनंजयः ।\nपौण्ड्रं दध्मौ महाशङ्खं भीमकर्मा वृकोदरः ॥","tr":"pāñcajanyaṃ hṛṣīkeśo devadattaṃ dhanaṃjayaḥ\npauṇḍraṃ dadhmau mahāśaṅkhaṃ bhīmakarmā vṛkodaraḥ","gs":"પાઞ્ચજન્યં હૃષીકેશો દેવદત્તં ધનંજયઃ ।\nપૌણ્ડ્રં દધ્મૌ મહાશઙ્ખં ભીમકર્મા વૃકોદરઃ ॥","en":"Hrishikesha blew the Panchajanya, Arjuna blew the Devadatta, and Bhima, the wolf-bellied doer of terrible deeds, blew the great conch Paundra.","hi":"अन्तर्यामी भगवान् श्रीकृष्ण ने पाञ्चजन्य नामक तथा धनञ्जय अर्जुन ने देवदत्त नामक शंख बजाया; और भयानक कर्म करनेवाले वृकोदर भीम ने पौण्ड्र नामक महाशंख बजाया।"},{"c":1,"v":16,"sp":"sanjaya","sa":"अनन्तविजयं राजा कुन्तीपुत्रो युधिष्ठिरः ।\nनकुलः सहदेवश्च सुघोषमणिपुष्पकौ ॥","tr":"anantavijayaṃ rājā kuntīputro yudhiṣṭhiraḥ\nnakulaḥ sahadevaśca sughoṣamaṇipuṣpakau","gs":"અનન્તવિજયં રાજા કુન્તીપુત્રો યુધિષ્ઠિરઃ ।\nનકુલઃ સહદેવશ્ચ સુઘોષમણિપુષ્પકૌ ॥","en":"King Yudhishthira, the son of Kunti, blew the Anantavijaya; Nakula and Sahadeva blew the Sughosha and the Manipushpaka.","hi":"कुन्तीपुत्र राजा युधिष्ठिर ने अनन्तविजय नामक शंख बजाया तथा नकुल और सहदेव ने सुघोष और मणिपुष्पक नामक शंख बजाये।"},{"c":1,"v":17,"sp":"sanjaya","sa":"काश्यश्च परमेष्वासः शिखण्डी च महारथः ।\nधृष्टद्युम्नो विराटश्च सात्यकिश्चापराजितः ॥","tr":"kāśyaśca parameṣvāsaḥ śikhaṇḍī ca mahārathaḥ\ndhṛṣṭadyumno virāṭaśca sātyakiścāparājitaḥ","gs":"કાશ્યશ્ચ પરમેષ્વાસઃ શિખણ્ડી ચ મહારથઃ ।\nધૃષ્ટદ્યુમ્નો વિરાટશ્ચ સાત્યકિશ્ચાપરાજિતઃ ॥","en":"The king of Kasi, an excellent archer, Sikhandi, the mighty car-warrior, Dhrishtadyumna, Virata, and Satyaki, the unconquered.","hi":"।।1.17 -- 1.18।। हे राजन्! श्रेष्ठ धनुषवाले काशिराज और महारथी शिखण्डी तथा धृष्टद्युम्न एवं राजा विराट और अजेय सात्यकि, राजा द्रुपद और द्रौपदी के पाँचों पुत्र तथा लम्बी-लम्बी भुजाओंवाले सुभद्रा-पुत्र अभिमन्यु - इन सभी ने सब ओर से अलग-अलग (अपने-अपने) शंख बजाये।"},{"c":1,"v":18,"sp":"sanjaya","sa":"द्रुपदो द्रौपदेयाश्च सर्वशः पृथिवीपते ।\nसौभद्रश्च महाबाहुः शङ्खान्दध्मुः पृथक्पृथक् ॥","tr":"drupado draupadeyāśca sarvaśaḥ pṛthivīpate\nsaubhadraśca mahābāhuḥ śaṅkhāndadhmuḥ pṛthakpṛthak","gs":"દ્રુપદો દ્રૌપદેયાશ્ચ સર્વશઃ પૃથિવીપતે ।\nસૌભદ્રશ્ચ મહાબાહુઃ શઙ્ખાન્દધ્મુઃ પૃથક્પૃથક્ ॥","en":"Drupada and the sons of Draupadi, O Lord of the Earth, and the son of Subhadra, the mighty-armed, blew their conches each separately.","hi":"।।1.17 -- 1.18।। हे राजन्! श्रेष्ठ धनुषवाले काशिराज और महारथी शिखण्डी तथा धृष्टद्युम्न एवं राजा विराट और अजेय सात्यकि, राजा द्रुपद और द्रौपदी के पाँचों पुत्र तथा लम्बी-लम्बी भुजाओंवाले सुभद्रा-पुत्र अभिमन्यु - इन सभी ने सब ओर से अलग-अलग (अपने-अपने) शंख बजाये।"},{"c":1,"v":19,"sp":"sanjaya","sa":"स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत् ।\nनभश्च पृथिवीं चैव तुमुलो व्यनुनादयन् ॥","tr":"sa ghoṣo dhārtarāṣṭrāṇāṃ hṛdayāni vyadārayat\nnabhaśca pṛthivīṃ caiva tumulo vyanunādayan","gs":"સ ઘોષો ધાર્તરાષ્ટ્રાણાં હૃદયાનિ વ્યદારયત્ ।\nનભશ્ચ પૃથિવીં ચૈવ તુમુલો વ્યનુનાદયન્ ॥","en":"The tumultuous sound rent the hearts of Dhritarashtra's party, reverberating through both heaven and earth.","hi":"पाण्डव-सेना के शंखों के उस भयंकर शब्द ने आकाश और पृथ्वी को भी गुँजाते हुए अन्यायपूर्वक राज्य हड़पनेवाले दुर्योधन आदि के हृदय विदीर्ण कर दिये।"},{"c":1,"v":20,"sp":"sanjaya","sa":"अथ व्यवस्थितान् दृष्ट्वा धार्तराष्ट्रान्कपिध्वजः ।\nप्रवृत्ते शस्त्रसंपाते धनुरुद्यम्य पाण्डवः ॥","tr":"atha vyavasthitān dṛṣṭvā dhārtarāṣṭrānkapidhvajaḥ\npravṛtte śastrasaṃpāte dhanurudyamya pāṇḍavaḥ","gs":"અથ વ્યવસ્થિતાન્ દૃષ્ટ્વા ધાર્તરાષ્ટ્રાન્કપિધ્વજઃ ।\nપ્રવૃત્તે શસ્ત્રસંપાતે ધનુરુદ્યમ્ય પાણ્ડવઃ ॥","en":"Then, seeing the people of Dhritarashtra's party standing arrayed and the discharge of weapons about to begin, Arjuna, the son of Pandu whose ensign was a monkey, took up his bow and said the following to Krishna, O Lord of the Earth.","hi":"हे महीपते! धृतराष्ट्र! अब शस्त्रों के चलने की तैयारी हो ही रही थी कि उस समय अन्यायपूर्वक राज्य को धारण करनेवाले राजाओं और उनके साथियों को व्यवस्थितरूप से सामने खड़े हुए देखकर कपिध्वज पाण्डुपुत्र अर्जुन ने अपना गाण्डीव धनुष उठा लिया और अन्तर्यामी भगवान् श्रीकृष्ण से ये वचन बोले।"},{"c":1,"v":21,"sp":"arjuna","sa":"हृषीकेशं तदा वाक्यमिदमाह महीपते ।\nसेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत ॥","tr":"hṛṣīkeśaṃ tadā vākyamidamāha mahīpate\nsenayorubhayormadhye rathaṃ sthāpaya me'cyuta","gs":"હૃષીકેશં તદા વાક્યમિદમાહ મહીપતે ।\nસેનયોરુભયોર્મધ્યે રથં સ્થાપય મેઽચ્યુત ॥","en":"Arjuna said, \"O Krishna, place my chariot in the middle between the two armies, so that I may behold those who stand here, desirous to fight, and know with whom I must fight when the battle is about to commence.\"","hi":"।।1.21 -- 1.22।। अर्जुन बोले - हे अच्युत! दोनों सेनाओं के मध्य में मेरे रथ को आप तब तक खड़ा कीजिये, जब तक मैं युद्धक्षेत्र में खड़े हुए इन युद्ध की इच्छावालों को देख न लूँ कि इस युद्धरूप उद्योग में मुझे किन-किन के साथ युद्ध करना योग्य है।"},{"c":1,"v":22,"sp":"arjuna","sa":"यावदेतान्निरीक्षेऽहं योद्धुकामानवस्थितान् ।\nकैर्मया सह योद्धव्यमस्मिन्रणसमुद्यमे ॥","tr":"yāvadetānnirīkṣe'haṃ yoddhukāmānavasthitān\nkairmayā saha yoddhavyamasminraṇasamudyame","gs":"યાવદેતાન્નિરીક્ષેઽહં યોદ્ધુકામાનવસ્થિતાન્ ।\nકૈર્મયા સહ યોદ્ધવ્યમસ્મિન્રણસમુદ્યમે ॥","en":"Arjuna said, \"O Krishna, place my chariot in the middle between the two armies, so that I may behold those who stand here, desirous to fight, and know with whom I must fight when the battle is about to commence.\"","hi":"।।1.21 -- 1.22।। अर्जुन बोले - हे अच्युत! दोनों सेनाओं के मध्य में मेरे रथ को आप तब तक खड़ा कीजिये, जब तक मैं युद्धक्षेत्र में खड़े हुए इन युद्ध की इच्छावालों को देख न लूँ कि इस युद्धरूप उद्योग में मुझे किन-किनके साथ युद्ध करना योग्य है।"},{"c":1,"v":23,"sp":"arjuna","sa":"योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः ।\nधार्तराष्ट्रस्य दुर्बुद्धेर्युद्धे प्रियचिकीर्षवः ॥","tr":"yotsyamānānavekṣe'haṃ ya ete'tra samāgatāḥ\ndhārtarāṣṭrasya durbuddheryuddhe priyacikīrṣavaḥ","gs":"યોત્સ્યમાનાનવેક્ષેઽહં ય એતેઽત્ર સમાગતાઃ ।\nધાર્તરાષ્ટ્રસ્ય દુર્બુદ્ધેર્યુદ્ધે પ્રિયચિકીર્ષવઃ ॥","en":"For I desire to observe those who are assembled here to fight, wishing to please in battle the evil-minded Duryodhana—the son of Dhritarashtra.","hi":"दुष्टबुद्धि दुर्योधन का युद्ध में प्रिय करने की इच्छावाले जो ये राजालोग इस सेना में आये हुए हैं, युद्ध करने को उतावले हुए इन सबको मैं देख लूँ।"},{"c":1,"v":24,"sp":"sanjaya","sa":"एवमुक्तो हृषीकेशो गुडाकेशेन भारत ।\nसेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तमम् ॥","tr":"evamukto hṛṣīkeśo guḍākeśena bhārata\nsenayorubhayormadhye sthāpayitvā rathottamam","gs":"એવમુક્તો હૃષીકેશો ગુડાકેશેન ભારત ।\nસેનયોરુભયોર્મધ્યે સ્થાપયિત્વા રથોત્તમમ્ ॥","en":"Sanjaya said, Thus addressed by Arjuna, Krishna stationed the best of chariots, O Dhritarashtra, in the midst of the two armies.","hi":"।।1.24 -- 1.25।। संजय बोले - हे भरतवंशी राजन्! निद्राविजयी अर्जुन के द्वारा इस तरह कहने पर अन्तर्यामी भगवान् श्रीकृष्ण ने दोनों सेनाओं के मध्यभाग में पितामह भीष्म और आचार्य द्रोण के सामने तथा सम्पूर्ण राजाओं के सामने श्रेष्ठ रथ को खड़ा करके इस तरह कहा कि 'हे पार्थ! इन इकट्ठे हुए कुरुवंशियोंको देख'।"},{"c":1,"v":25,"sp":"sanjaya","sa":"भीष्मद्रोणप्रमुखतः सर्वेषां च महीक्षिताम् ।\nउवाच पार्थ पश्यैतान्समवेतान्कुरूनिति ॥","tr":"bhīṣmadroṇapramukhataḥ sarveṣāṃ ca mahīkṣitām\nuvāca pārtha paśyaitānsamavetānkurūniti","gs":"ભીષ્મદ્રોણપ્રમુખતઃ સર્વેષાં ચ મહીક્ષિતામ્ ।\nઉવાચ પાર્થ પશ્યૈતાન્સમવેતાન્કુરૂનિતિ ॥","en":"In front of Bhishma and Drona, and all the rulers of the earth, he said: \"O Arjuna, son of Pritha, behold these Kurus gathered together.\"","hi":"।।1.24 -- 1.25।। संजय बोले - हे भरतवंशी राजन्! निद्राविजयी अर्जुन के द्वारा इस तरह कहने पर अन्तर्यामी भगवान् श्रीकृष्ण ने दोनों सेनाओं के मध्यभाग में पितामह भीष्म और आचार्य द्रोण के सामने तथा सम्पूर्ण राजाओं के सामने श्रेष्ठ रथको खड़ा करके इस तरह कहा कि 'हे पार्थ! इन इकट्ठे हुए कुरुवंशियोंको देख'।"},{"c":1,"v":26,"sp":"sanjaya","sa":"तत्रापश्यत्स्थितान्पार्थः पितृ़नथ पितामहान् ।\nआचार्यान्मातुलान्भ्रातृ़न्पुत्रान्पौत्रान्सखींस्तथा ॥","tr":"tatrāpaśyatsthitānpārthaḥ pitṛ़natha pitāmahān\nācāryānmātulānbhrātṛ़nputrānpautrānsakhīṃstathā","gs":"તત્રાપશ્યત્સ્થિતાન્પાર્થઃ પિતૃ़નથ પિતામહાન્ ।\nઆચાર્યાન્માતુલાન્ભ્રાતૃ़ન્પુત્રાન્પૌત્રાન્સખીંસ્તથા ॥","en":"Then, Arjuna (son of Pritha) saw there (in the armies) stationed fathers, grandfathers, teachers, maternal uncles, brothers, sons, grandsons, and friends.","hi":"उसके बाद पृथानन्दन अर्जुनने उन दोनों ही सेनाओंमें स्थित पिताओंको, पितामहोंको, आचार्योंको, मामाओंको, भाइयोंको, पुत्रोंको, पौत्रोंको तथा मित्रोंको, ससुरोंको और सुहृदोंको भी देखा।"},{"c":1,"v":27,"sp":"sanjaya","sa":"श्वशुरान्सुहृदश्चैव सेनयोरुभयोरपि ।\nतान्समीक्ष्य स कौन्तेयः सर्वान्बन्धूनवस्थितान् ॥","tr":"śvaśurānsuhṛdaścaiva senayorubhayorapi\ntānsamīkṣya sa kaunteyaḥ sarvānbandhūnavasthitān","gs":"શ્વશુરાન્સુહૃદશ્ચૈવ સેનયોરુભયોરપિ ।\nતાન્સમીક્ષ્ય સ કૌન્તેયઃ સર્વાન્બન્ધૂનવસ્થિતાન્ ॥","en":"He saw fathers-in-law and friends in both the armies. The son of Kunti, Arjuna, seeing all those kinsmen thus standing arrayed, spoke sorrowfully, deeply filled with pity.","hi":"अपनी-अपनी जगह पर स्थित उन सम्पूर्ण बान्धवों को देखकर वे कुन्तीनन्दन अर्जुन अत्यन्त कायरता से युक्त होकर विषाद करते हुए ये वचन बोले।"},{"c":1,"v":28,"sp":"arjuna","sa":"कृपया परयाऽऽविष्टो विषीदन्निदमब्रवीत् ।\nदृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुपस्थितम् ॥","tr":"kṛpayā parayā''viṣṭo viṣīdannidamabravīt\ndṛṣṭvemaṃ svajanaṃ kṛṣṇa yuyutsuṃ samupasthitam","gs":"કૃપયા પરયાઽઽવિષ્ટો વિષીદન્નિદમબ્રવીત્ ।\nદૃષ્ટ્વેમં સ્વજનં કૃષ્ણ યુયુત્સું સમુપસ્થિતમ્ ॥","en":"Arjuna said, \"O Krishna, seeing my kinsmen arrayed here, eager to fight,","hi":"।।1.28 -- 1.30।। अर्जुन बोले - हे कृष्ण! युद्ध की इच्छावाले इस कुटुम्ब-समुदाय को अपने सामने उपस्थित देखकर मेरे अङ्ग शिथिल हो रहे हैं और मुख सूख रहा है तथा मेरे शरीर में कँपकँपी आ रही है एवं रोंगटे खड़े हो रहे हैं। हाथ से गाण्डीव धनुष गिर रहा है और त्वचा भी जल रही है। मेरा मन भ्रमित-सा हो रहा है और मैं खड़े रहने में भी असमर्थ हो रहा हूँ।"},{"c":1,"v":29,"sp":"arjuna","sa":"सीदन्ति मम गात्राणि मुखं च परिशुष्यति ।\nवेपथुश्च शरीरे मे रोमहर्षश्च जायते ॥","tr":"sīdanti mama gātrāṇi mukhaṃ ca pariśuṣyati\nvepathuśca śarīre me romaharṣaśca jāyate","gs":"સીદન્તિ મમ ગાત્રાણિ મુખં ચ પરિશુષ્યતિ ।\nવેપથુશ્ચ શરીરે મે રોમહર્ષશ્ચ જાયતે ॥","en":"My limbs fail, my mouth is parched, my body quivers, and my hair stands on end.","hi":"।।1.28 -- 1.30।। अर्जुन बोले - हे कृष्ण! युद्ध की इच्छावाले इस कुटुम्ब-समुदाय को अपने सामने उपस्थित देखकर मेरे अङ्ग शिथिल हो रहे हैं और मुख सूख रहा है तथा मेरे शरीर में कँपकँपी आ रही है एवं रोंगटे खड़े हो रहे हैं। हाथ से गाण्डीव धनुष गिर रहा है और त्वचा भी जल रही है। मेरा मन भ्रमित-सा हो रहा है और मैं खड़े रहने में भी असमर्थ हो रहा हूँ।"},{"c":1,"v":30,"sp":"arjuna","sa":"गाण्डीवं स्रंसते हस्तात्त्वक्चैव परिदह्यते ।\nन च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः ॥","tr":"gāṇḍīvaṃ sraṃsate hastāttvakcaiva paridahyate\nna ca śaknomyavasthātuṃ bhramatīva ca me manaḥ","gs":"ગાણ્ડીવં સ્રંસતે હસ્તાત્ત્વક્ચૈવ પરિદહ્યતે ।\nન ચ શક્નોમ્યવસ્થાતું ભ્રમતીવ ચ મે મનઃ ॥","en":"The Gandiva slips from my hand, and my skin burns all over; I am unable to stand, and my mind is reeling, as it were.","hi":"।।1.28 -- 1.30।। अर्जुन बोले - हे कृष्ण! युद्ध की इच्छावाले इस कुटुम्ब-समुदाय को अपने सामने उपस्थित देखकर मेरे अङ्ग शिथिल हो रहे हैं और मुख सूख रहा है तथा मेरे शरीर में कँपकँपी आ रही है एवं रोंगटे खड़े हो रहे हैं। हाथ से गाण्डीव धनुष गिर रहा है और त्वचा भी जल रही है। मेरा मन भ्रमित-सा हो रहा है और मैं खड़े रहने में भी असमर्थ हो रहा हूँ।"},{"c":1,"v":31,"sp":"arjuna","sa":"निमित्तानि च पश्यामि विपरीतानि केशव ।\nन च श्रेयोऽनुपश्यामि हत्वा स्वजनमाहवे ॥","tr":"nimittāni ca paśyāmi viparītāni keśava\nna ca śreyo'nupaśyāmi hatvā svajanamāhave","gs":"નિમિત્તાનિ ચ પશ્યામિ વિપરીતાનિ કેશવ ।\nન ચ શ્રેયોઽનુપશ્યામિ હત્વા સ્વજનમાહવે ॥","en":"And I see ill omens, O Kesava. I do not see any good in slaying my kinsmen in battle.","hi":"हे केशव! मैं लक्षणों - (शकुनों) को भी विपरीत देख रहा हूँ और युद्ध में स्वजनोंको मारकर श्रेय (लाभ) भी नहीं देख रहा हूँ।"},{"c":1,"v":32,"sp":"arjuna","sa":"न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च ।\nकिं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा ॥","tr":"na kāṅkṣe vijayaṃ kṛṣṇa na ca rājyaṃ sukhāni ca\nkiṃ no rājyena govinda kiṃ bhogairjīvitena vā","gs":"ન કાઙ્ક્ષે વિજયં કૃષ્ણ ન ચ રાજ્યં સુખાનિ ચ ।\nકિં નો રાજ્યેન ગોવિન્દ કિં ભોગૈર્જીવિતેન વા ॥","en":"I desire not victory, O Krishna, nor kingdom, nor pleasures. What use is dominion to us, O Krishna, or pleasures or even life?","hi":"हे कृष्ण! मैं न तो विजय चाहता हूँ, न राज्य चाहता हूँ और न सुखों को ही चाहता हूँ। हे गोविन्द! हमलोगों को राज्य से क्या लाभ? भोगों से क्या लाभ? अथवा जीने से भी क्या लाभ?"},{"c":1,"v":33,"sp":"arjuna","sa":"येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च ।\nत इमेऽवस्थिता युद्धे प्राणांस्त्यक्त्वा धनानि च ॥","tr":"yeṣāmarthe kāṅkṣitaṃ no rājyaṃ bhogāḥ sukhāni ca\nta ime'vasthitā yuddhe prāṇāṃstyaktvā dhanāni ca","gs":"યેષામર્થે કાઙ્ક્ષિતં નો રાજ્યં ભોગાઃ સુખાનિ ચ ।\nત ઇમેઽવસ્થિતા યુદ્ધે પ્રાણાંસ્ત્યક્ત્વા ધનાનિ ચ ॥","en":"Those for whose sake we desire kingdom, enjoyments, and pleasures stand here in battle, having renounced life and wealth.","hi":"जिनके लिये हमारी राज्य, भोग और सुखकी इच्छा है, वे ही ये सब अपने प्राणों की और धन की आशा का त्याग करके युद्ध में खड़े हैं।"},{"c":1,"v":34,"sp":"arjuna","sa":"आचार्याः पितरः पुत्रास्तथैव च पितामहाः ।\nमातुलाः श्चशुराः पौत्राः श्यालाः सम्बन्धिनस्तथा ॥","tr":"ācāryāḥ pitaraḥ putrāstathaiva ca pitāmahāḥ\nmātulāḥ ścaśurāḥ pautrāḥ śyālāḥ sambandhinastathā","gs":"આચાર્યાઃ પિતરઃ પુત્રાસ્તથૈવ ચ પિતામહાઃ ।\nમાતુલાઃ શ્ચશુરાઃ પૌત્રાઃ શ્યાલાઃ સમ્બન્ધિનસ્તથા ॥","en":"Teachers, fathers, sons, and grandfathers, maternal uncles, fathers-in-law, grandsons, brothers-in-law, and other relatives—","hi":"।।1.34 -- 1.35।। आचार्य, पिता, पुत्र और उसी प्रकार पितामह, मामा, ससुर, पौत्र, साले तथा अन्य जितने भी सम्बन्धी हैं, मुझ पर प्रहार करने पर भी मैं इनको मारना नहीं चाहता, और हे मधुसूदन! मुझे त्रिलोकी का राज्य मिलता हो, तो भी मैं इनको मारना नहीं चाहता, फिर पृथ्वी के लिये तो (मैं इनको मारूँ ही) क्या?"},{"c":1,"v":35,"sp":"arjuna","sa":"एतान्न हन्तुमिच्छामि घ्नतोऽपि मधुसूदन ।\nअपि त्रैलोक्यराज्यस्य हेतोः किं नु महीकृते ॥","tr":"etānna hantumicchāmi ghnato'pi madhusūdana\napi trailokyarājyasya hetoḥ kiṃ nu mahīkṛte","gs":"એતાન્ન હન્તુમિચ્છામિ ઘ્નતોઽપિ મધુસૂદન ।\nઅપિ ત્રૈલોક્યરાજ્યસ્ય હેતોઃ કિં નુ મહીકૃતે ॥","en":"These I do not wish to kill, O Krishna, even though they kill me, for the sake of dominion over the three worlds; leave alone killing them for the sake of the earth.\"","hi":"।।1.34 -- 1.35।। आचार्य, पिता, पुत्र और उसी प्रकार पितामह, मामा, ससुर, पौत्र, साले तथा अन्य जितने भी सम्बन्धी हैं, मुझपर प्रहार करने पर भी मैं इनको मारना नहीं चाहता, और हे मधुसूदन! मुझे त्रिलोकी का राज्य मिलता हो, तो भी मैं इनको मारना नहीं चाहता, फिर पृथ्वीके लिये तो (मैं इनको मारूँ ही) क्या?"},{"c":1,"v":36,"sp":"arjuna","sa":"निहत्य धार्तराष्ट्रान्नः का प्रीतिः स्याज्जनार्दन ।\nपापमेवाश्रयेदस्मान्हत्वैतानाततायिनः ॥","tr":"nihatya dhārtarāṣṭrānnaḥ kā prītiḥ syājjanārdana\npāpamevāśrayedasmānhatvaitānātatāyinaḥ","gs":"નિહત્ય ધાર્તરાષ્ટ્રાન્નઃ કા પ્રીતિઃ સ્યાજ્જનાર્દન ।\nપાપમેવાશ્રયેદસ્માન્હત્વૈતાનાતતાયિનઃ ॥","en":"By killing these sons of Dhritarashtra, what pleasure could be ours, O Janardana? Only sin would accrue to us from killing these felons.","hi":"हे जनार्दन! इन धृतराष्ट्र-सम्बन्धियों को मारकर हमलोगों को क्या प्रसन्नता होगी? इन आततायियों को मारने से तो हमें पाप ही लगेगा।"},{"c":1,"v":37,"sp":"arjuna","sa":"तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान्स्वबान्धवान् ।\nस्वजनं हि कथं हत्वा सुखिनः स्याम माधव ॥","tr":"tasmānnārhā vayaṃ hantuṃ dhārtarāṣṭrānsvabāndhavān\nsvajanaṃ hi kathaṃ hatvā sukhinaḥ syāma mādhava","gs":"તસ્માન્નાર્હા વયં હન્તું ધાર્તરાષ્ટ્રાન્સ્વબાન્ધવાન્ ।\nસ્વજનં હિ કથં હત્વા સુખિનઃ સ્યામ માધવ ॥","en":"Therefore, we should not kill the sons of Dhritarashtra, our relatives; for how can we be happy by killing our own kin, O Madhava (Krishna)?","hi":"इसलिये अपने बान्धव इन धृतराष्ट्र-सम्बन्धियों को मारने के लिये हम योग्य नहीं हैं; क्योंकि हे माधव! अपने कुटुम्बियों को मारकर हम कैसे सुखी होंगे?"},{"c":1,"v":38,"sp":"arjuna","sa":"यद्यप्येते न पश्यन्ति लोभोपहतचेतसः ।\nकुलक्षयकृतं दोषं मित्रद्रोहे च पातकम् ॥","tr":"yadyapyete na paśyanti lobhopahatacetasaḥ\nkulakṣayakṛtaṃ doṣaṃ mitradrohe ca pātakam","gs":"યદ્યપ્યેતે ન પશ્યન્તિ લોભોપહતચેતસઃ ।\nકુલક્ષયકૃતં દોષં મિત્રદ્રોહે ચ પાતકમ્ ॥","en":"Though they, with intelligence overpowered by greed, see no evil in the destruction of families and no sin in hostility to friends,","hi":"।।1.38 -- 1.39।। यद्यपि लोभ के कारण जिनका विवेक-विचार लुप्त हो गया है, ऐसे ये (दुर्योधन आदि) कुल का नाश करने से होनेवाले दोष को और मित्रों के साथ द्वेष करने से होनेवाले पाप को नहीं देखते, (तो भी) हे जनार्दन! कुल का नाश करने से होनेवाले दोष को ठीक-ठीक जाननेवाले हमलोग इस पाप से निवृत्त होने का विचार क्यों न करें?"},{"c":1,"v":39,"sp":"arjuna","sa":"कथं न ज्ञेयमस्माभिः पापादस्मान्निवर्तितुम् ।\nकुलक्षयकृतं दोषं प्रपश्यद्भिर्जनार्दन ॥","tr":"kathaṃ na jñeyamasmābhiḥ pāpādasmānnivartitum\nkulakṣayakṛtaṃ doṣaṃ prapaśyadbhirjanārdana","gs":"કથં ન જ્ઞેયમસ્માભિઃ પાપાદસ્માન્નિવર્તિતુમ્ ।\nકુલક્ષયકૃતં દોષં પ્રપશ્યદ્ભિર્જનાર્દન ॥","en":"Why should we not, who clearly see the evil in the destruction of families, learn to turn away from this sin, O Janardana (Krishna)?","hi":"।।1.38 -- 1.39।। यद्यपि लोभ के कारण जिनका विवेक-विचार लुप्त हो गया है, ऐसे ये (दुर्योधन आदि) कुल का नाश करने से होनेवाले दोष को और मित्रों के साथ द्वेष करने से होनेवाले पाप को नहीं देखते, (तो भी) हे जनार्दन! कुल का नाश करने से होनेवाले दोष को ठीक-ठीक जाननेवाले हमलोग इस पाप से निवृत्त होनेका विचार क्यों न करें?"},{"c":1,"v":40,"sp":"arjuna","sa":"कुलक्षये प्रणश्यन्ति कुलधर्माः सनातनाः ।\nधर्मे नष्टे कुलं कृत्स्नमधर्मोऽभिभवत्युत ॥","tr":"kulakṣaye praṇaśyanti kuladharmāḥ sanātanāḥ\ndharme naṣṭe kulaṃ kṛtsnamadharmo'bhibhavatyuta","gs":"કુલક્ષયે પ્રણશ્યન્તિ કુલધર્માઃ સનાતનાઃ ।\nધર્મે નષ્ટે કુલં કૃત્સ્નમધર્મોઽભિભવત્યુત ॥","en":"In the destruction of a family, the immemorial religious rites of that family perish; on the destruction of spirituality, impiety indeed, overwhelms the whole family.","hi":"कुल का क्षय होने पर सदा से चलते आये कुलधर्म नष्ट हो जाते हैं और धर्म का नाश होनेपर (बचे हुए) सम्पूर्ण कुल को अधर्म दबा लेता है।"},{"c":1,"v":41,"sp":"arjuna","sa":"अधर्माभिभवात्कृष्ण प्रदुष्यन्ति कुलस्त्रियः ।\nस्त्रीषु दुष्टासु वार्ष्णेय जायते वर्णसङ्करः ॥","tr":"adharmābhibhavātkṛṣṇa praduṣyanti kulastriyaḥ\nstrīṣu duṣṭāsu vārṣṇeya jāyate varṇasaṅkaraḥ","gs":"અધર્માભિભવાત્કૃષ્ણ પ્રદુષ્યન્તિ કુલસ્ત્રિયઃ ।\nસ્ત્રીષુ દુષ્ટાસુ વાર્ષ્ણેય જાયતે વર્ણસઙ્કરઃ ॥","en":"O Krishna, by the prevalence of impiety, the women of the family become corrupt; and, when women are corrupted, O Varshenya (descendant of Vrishni), intermingling of castes arises.","hi":"हे कृष्ण! अधर्म के अधिक बढ़ जाने से कुल की स्त्रियाँ दूषित हो जाती हैं; (और) हे वार्ष्णेय! स्त्रियों के दूषित होने पर वर्णसंकर पैदा हो जाते हैं।"},{"c":1,"v":42,"sp":"arjuna","sa":"सङ्करो नरकायैव कुलघ्नानां कुलस्य च ।\nपतन्ति पितरो ह्येषां लुप्तपिण्डोदकक्रियाः ॥","tr":"saṅkaro narakāyaiva kulaghnānāṃ kulasya ca\npatanti pitaro hyeṣāṃ luptapiṇḍodakakriyāḥ","gs":"સઙ્કરો નરકાયૈવ કુલઘ્નાનાં કુલસ્ય ચ ।\nપતન્તિ પિતરો હ્યેષાં લુપ્તપિણ્ડોદકક્રિયાઃ ॥","en":"Confusion of castes leads to hell for the slayers of the family, for their forebears fall, deprived of the offerings of rice-balls and libations of water.","hi":"वर्णसंकर कुलघातियों को और कुल को नरक में ले जानेवाला ही होता है। श्राद्ध और तर्पण न मिलने से इन- (कुलघातियों-) के पितर भी अपने स्थान से गिर जाते हैं।"},{"c":1,"v":43,"sp":"arjuna","sa":"दोषैरेतैः कुलघ्नानां वर्णसङ्करकारकैः ।\nउत्साद्यन्ते जातिधर्माः कुलधर्माश्च शाश्वताः ॥","tr":"doṣairetaiḥ kulaghnānāṃ varṇasaṅkarakārakaiḥ\nutsādyante jātidharmāḥ kuladharmāśca śāśvatāḥ","gs":"દોષૈરેતૈઃ કુલઘ્નાનાં વર્ણસઙ્કરકારકૈઃ ।\nઉત્સાદ્યન્તે જાતિધર્માઃ કુલધર્માશ્ચ શાશ્વતાઃ ॥","en":"By these evil deeds of the destroyers of the family, which cause confusion of castes, the eternal religious rites of the caste and the family are destroyed.","hi":"इन वर्णसंकर पैदा करनेवाले दोषोंसे कुलघातियों के सदा से चलते आये कुलधर्म और जातिधर्म नष्ट हो जाते हैं।"},{"c":1,"v":44,"sp":"arjuna","sa":"उत्सन्नकुलधर्माणां मनुष्याणां जनार्दन ।\nनरकेऽनियतं वासो भवतीत्यनुशुश्रुम ॥","tr":"utsannakuladharmāṇāṃ manuṣyāṇāṃ janārdana\nnarake'niyataṃ vāso bhavatītyanuśuśruma","gs":"ઉત્સન્નકુલધર્માણાં મનુષ્યાણાં જનાર્દન ।\nનરકેઽનિયતં વાસો ભવતીત્યનુશુશ્રુમ ॥","en":"We have heard, O Janardana, that those men in whose families the religious practices have been destroyed are inevitably destined to dwell in hell for an unknown period.","hi":"हे जनार्दन! जिनके कुलधर्म नष्ट हो जाते हैं, उन मनुष्यों का बहुत काल तक नरकों में वापस होता है, ऐसा हम सुनते आये हैं।"},{"c":1,"v":45,"sp":"arjuna","sa":"अहो बत महत्पापं कर्तुं व्यवसिता वयम् ।\nयद्राज्यसुखलोभेन हन्तुं स्वजनमुद्यताः ॥","tr":"aho bata mahatpāpaṃ kartuṃ vyavasitā vayam\nyadrājyasukhalobhena hantuṃ svajanamudyatāḥ","gs":"અહો બત મહત્પાપં કર્તું વ્યવસિતા વયમ્ ।\nયદ્રાજ્યસુખલોભેન હન્તું સ્વજનમુદ્યતાઃ ॥","en":"Alas! We are involved in a great sin, for we are prepared to kill our kinsmen, out of greed for the pleasures of a kingdom.","hi":"यह बड़े आश्चर्य और खेद की बात है कि हमलोग बड़ा भारी पाप करने का निश्चय कर बैठे हैं, जो कि राज्य और सुख के लोभ से अपने स्वजनों को मारने के लिये तैयार हो गये हैं!"},{"c":1,"v":46,"sp":"arjuna","sa":"यदि मामप्रतीकारमशस्त्रं शस्त्रपाणयः ।\nधार्तराष्ट्रा रणे हन्युस्तन्मे क्षेमतरं भवेत् ॥","tr":"yadi māmapratīkāramaśastraṃ śastrapāṇayaḥ\ndhārtarāṣṭrā raṇe hanyustanme kṣemataraṃ bhavet","gs":"યદિ મામપ્રતીકારમશસ્ત્રં શસ્ત્રપાણયઃ ।\nધાર્તરાષ્ટ્રા રણે હન્યુસ્તન્મે ક્ષેમતરં ભવેત્ ॥","en":"If the sons of Dhritarashtra, with weapons in hand, should slay me in battle, unresisting and unarmed, that would be better for me.","hi":"अगर ये हाथों में शस्त्र-अस्त्र लिये हुए धृतराष्ट्र के पक्षपाती लोग युद्धभूमि में सामना न करनेवाले तथा शस्त्ररहित मुझ को मार भी दें, तो वह मेरे लिये बड़ा ही हितकारक होगा।"},{"c":1,"v":47,"sp":"sanjaya","sa":"एवमुक्त्वाऽर्जुनः संख्ये रथोपस्थ उपाविशत् ।\nविसृज्य सशरं चापं शोकसंविग्नमानसः ॥","tr":"evamuktvā'rjunaḥ saṃkhye rathopastha upāviśat\nvisṛjya saśaraṃ cāpaṃ śokasaṃvignamānasaḥ","gs":"એવમુક્ત્વાઽર્જુનઃ સંખ્યે રથોપસ્થ ઉપાવિશત્ ।\nવિસૃજ્ય સશરં ચાપં શોકસંવિગ્નમાનસઃ ॥","en":"Sanjaya said, Having thus spoken in the midst of the battlefield, Arjuna cast away his bow and arrow and, his mind overwhelmed with sorrow, sat down on the seat of the chariot.","hi":"संजय बोले - ऐसा कहकर शोकाकुल मनवाले अर्जुन बाणसहित धनुष का त्याग करके युद्धभूमि में रथके मध्यभाग में बैठ गये।"},{"c":2,"v":1,"sp":"sanjaya","sa":"तं तथा कृपयाऽविष्टमश्रुपूर्णाकुलेक्षणम् ।\nविषीदन्तमिदं वाक्यमुवाच मधुसूदनः ॥","tr":"taṃ tathā kṛpayā'viṣṭamaśrupūrṇākulekṣaṇam\nviṣīdantamidaṃ vākyamuvāca madhusūdanaḥ","gs":"તં તથા કૃપયાઽવિષ્ટમશ્રુપૂર્ણાકુલેક્ષણમ્ ।\nવિષીદન્તમિદં વાક્યમુવાચ મધુસૂદનઃ ॥","en":"Sanjaya said: To him, who was thus overcome with pity, despondent, with eyes full of tears and agitated, Madhusudana (the destroyer of Madhu) or Krishna spoke these words.","hi":"संजय बोले - वैसी कायरता से आविष्ट उन अर्जुन के प्रति, जो कि विषाद कर रहे हैं और आँसुओं के कारण जिनके नेत्रों की देखने की शक्ति अवरुद्ध हो रही है, भगवान् मधुसूदन ये (आगे कहे जानेवाले) वचन बोले।"},{"c":2,"v":2,"sp":"krishna","sa":"कुतस्त्वा कश्मलमिदं विषमे समुपस्थितम् ।\nअनार्यजुष्टमस्वर्ग्यमकीर्तिकरमर्जुन ॥","tr":"kutastvā kaśmalamidaṃ viṣame samupasthitam\nanāryajuṣṭamasvargyamakīrtikaramarjuna","gs":"કુતસ્ત્વા કશ્મલમિદં વિષમે સમુપસ્થિતમ્ ।\nઅનાર્યજુષ્ટમસ્વર્ગ્યમકીર્તિકરમર્જુન ॥","en":"The Blessed Lord said, \"From whence has this perilous strait come upon you, this dejection which is unworthy of you, disgraceful, and which will close the gates of heaven upon you, O Arjuna?\"","hi":"श्रीभगवान् बोले - हे अर्जुन! इस विषम अवसरपर तुम्हें यह कायरता कहाँसे प्राप्त हुई, जिसका कि श्रेष्ठ पुरुष सेवन नहीं करते, जो स्वर्गको देनेवाली नहीं है और कीर्ति करनेवाली भी नहीं है।"},{"c":2,"v":3,"sp":"krishna","sa":"क्लैब्यं मा स्म गमः पार्थ नैतत्त्वय्युपपद्यते ।\nक्षुद्रं हृदयदौर्बल्यं त्यक्त्वोत्तिष्ठ परन्तप ॥","tr":"klaibyaṃ mā sma gamaḥ pārtha naitattvayyupapadyate\nkṣudraṃ hṛdayadaurbalyaṃ tyaktvottiṣṭha parantapa","gs":"ક્લૈબ્યં મા સ્મ ગમઃ પાર્થ નૈતત્ત્વય્યુપપદ્યતે ।\nક્ષુદ્રં હૃદયદૌર્બલ્યં ત્યક્ત્વોત્તિષ્ઠ પરન્તપ ॥","en":"Do not yield to impotence, O Arjuna, son of Pritha. It does not befit you. Cast off this mean weakness of the heart! Stand up, O conqueror of foes!","hi":"हे पृथानन्दन अर्जुन ! इस नपुंसकताको मत प्राप्त हो; क्योंकि तुम्हारेमें यह उचित नहीं है। हे परंतप ! हृदयकी इस तुच्छ दुर्बलताका त्याग करके युद्धके लिये खड़े हो जाओ।"},{"c":2,"v":4,"sp":"arjuna","sa":"कथं भीष्ममहं संख्ये द्रोणं च मधुसूदन ।\nइषुभिः प्रतियोत्स्यामि पूजार्हावरिसूदन ॥","tr":"kathaṃ bhīṣmamahaṃ saṃkhye droṇaṃ ca madhusūdana\niṣubhiḥ pratiyotsyāmi pūjārhāvarisūdana","gs":"કથં ભીષ્મમહં સંખ્યે દ્રોણં ચ મધુસૂદન ।\nઇષુભિઃ પ્રતિયોત્સ્યામિ પૂજાર્હાવરિસૂદન ॥","en":"Arjuna said, \"O Madhusudana, how can I fight in battle with arrows against Bhishma and Drona, who are worthy of being worshipped, O destroyer of enemies?\"","hi":"अर्जुन बोले - हे मधुसूदन! मैं रणभूमिमें भीष्म और द्रोणके साथ बाणोंसे युद्ध कैसे करूँ? क्योंकि हे अरिसूदन! ये दोनों ही पूजाके योग्य हैं।"},{"c":2,"v":5,"sp":"arjuna","sa":"गुरूनहत्वा हि महानुभावान्  श्रेयो भोक्तुं भैक्ष्यमपीह लोके ।\nहत्वार्थकामांस्तु गुरूनिहैव  भुञ्जीय भोगान् रुधिरप्रदिग्धान् ॥","tr":"gurūnahatvā hi mahānubhāvān  śreyo bhoktuṃ bhaikṣyamapīha loke\nhatvārthakāmāṃstu gurūnihaiva  bhuñjīya bhogān rudhirapradigdhān","gs":"ગુરૂનહત્વા હિ મહાનુભાવાન્  શ્રેયો ભોક્તું ભૈક્ષ્યમપીહ લોકે ।\nહત્વાર્થકામાંસ્તુ ગુરૂનિહૈવ  ભુઞ્જીય ભોગાન્ રુધિરપ્રદિગ્ધાન્ ॥","en":"Better it is, indeed, in this world to accept alms than to slay the most noble teachers. But if I were to kill them, even in this world, all my enjoyments of wealth and fulfilled desires would be stained with their blood.","hi":"महानुभाव गुरुजनोंको न मारकर इस लोकमें मैं भिक्षाका अन्न खाना भी श्रेष्ठ समझता हूँ। क्योंकि गुरुजनोंको मारकर यहाँ रक्तसे सने हुए तथा धनकी कामनाकी मुख्यतावाले भोगोंको ही तो भोगूँगा!"},{"c":2,"v":6,"sp":"arjuna","sa":"न चैतद्विद्मः कतरन्नो गरीयो  यद्वा जयेम यदि वा नो जयेयुः ।\nयानेव हत्वा न जिजीविषाम  स्तेऽवस्थिताः प्रमुखे धार्तराष्ट्राः ॥","tr":"na caitadvidmaḥ kataranno garīyo  yadvā jayema yadi vā no jayeyuḥ\nyāneva hatvā na jijīviṣāma  ste'vasthitāḥ pramukhe dhārtarāṣṭrāḥ","gs":"ન ચૈતદ્વિદ્મઃ કતરન્નો ગરીયો  યદ્વા જયેમ યદિ વા નો જયેયુઃ ।\nયાનેવ હત્વા ન જિજીવિષામ  સ્તેઽવસ્થિતાઃ પ્રમુખે ધાર્તરાષ્ટ્રાઃ ॥","en":"I can hardly tell which would be better, that we should conquer them or that they should conquer us. Even the sons of Dhritarashtra, whom we do not wish to slay, stand facing us.","hi":"हम यह भी नहीं जानते कि हमलोगोंके लिये युद्ध करना और न करना - इन दोनोंमेंसे कौन-सा अत्यन्त श्रेष्ठ है; और हमें इसका भी पता नहीं है कि हम उन्हें जीतेंगे अथवा वे हमें जीतेंगे। जिनको मारकर हम जीना भी नहीं चाहते, वे ही धृतराष्ट्रके सम्बन्धी हमारे सामने खड़े हैं।"},{"c":2,"v":7,"sp":"arjuna","sa":"कार्पण्यदोषोपहतस्वभावः  पृच्छामि त्वां धर्मसंमूढचेताः ।\nयच्छ्रेयः स्यान्निश्िचतं ब्रूहि तन्मे  शिष्यस्तेऽहं शाधि मां त्वां प्रपन्नम् ॥","tr":"kārpaṇyadoṣopahatasvabhāvaḥ  pṛcchāmi tvāṃ dharmasaṃmūḍhacetāḥ\nyacchreyaḥ syānniśicataṃ brūhi tanme  śiṣyaste'haṃ śādhi māṃ tvāṃ prapannam","gs":"કાર્પણ્યદોષોપહતસ્વભાવઃ  પૃચ્છામિ ત્વાં ધર્મસંમૂઢચેતાઃ ।\nયચ્છ્રેયઃ સ્યાન્નિશ્િચતં બ્રૂહિ તન્મે  શિષ્યસ્તેઽહં શાધિ માં ત્વાં પ્રપન્નમ્ ॥","en":"My heart is overpowered by the taint of pity; my mind is confused as to my duty. I ask Thee: Tell me decisively what is good for me. I am Thy disciple; instruct me, who has taken refuge in Thee.","hi":"कायरतारूप दोषसे तिरस्कृत स्वभाववाला और धर्मके विषयमें मोहित अन्तःकरणवाला मैं आपसे पूछता हूँ कि जो निश्चित कल्याण करनेवाली हो, वह मेरे लिये कहिये। मैं आपका शिष्य हूँ। आपके शरण हुए मुझे शिक्षा दीजिये।"},{"c":2,"v":8,"sp":"arjuna","sa":"न हि प्रपश्यामि ममापनुद्या  द्यच्छोकमुच्छोषणमिन्द्रियाणाम् ।\nअवाप्य भूमावसपत्नमृद्धम्  राज्यं सुराणामपि चाधिपत्यम् ॥","tr":"na hi prapaśyāmi mamāpanudyā  dyacchokamucchoṣaṇamindriyāṇām\navāpya bhūmāvasapatnamṛddham  rājyaṃ surāṇāmapi cādhipatyam","gs":"ન હિ પ્રપશ્યામિ મમાપનુદ્યા  દ્યચ્છોકમુચ્છોષણમિન્દ્રિયાણામ્ ।\nઅવાપ્ય ભૂમાવસપત્નમૃદ્ધમ્  રાજ્યં સુરાણામપિ ચાધિપત્યમ્ ॥","en":"I do not see that this sorrow that burns up my senses would be removed, even if I were to attain prosperous and unrivaled dominion on earth or lordship over the gods.","hi":"पृथ्वीपर धन-धान्य-समृद्ध और शत्रुरहित राज्य तथा स्वर्गमें देवताओंका आधिपत्य मिल जाय तो भी इन्द्रियोंको सुखानेवाला मेरा जो शोक है, वह दूर हो जाय - ऐसा मैं नहीं देखता हूँ।"},{"c":2,"v":9,"sp":"sanjaya","sa":"एवमुक्त्वा हृषीकेशं गुडाकेशः परन्तप ।\nन योत्स्य इति गोविन्दमुक्त्वा तूष्णीं बभूव ह ॥","tr":"evamuktvā hṛṣīkeśaṃ guḍākeśaḥ parantapa\nna yotsya iti govindamuktvā tūṣṇīṃ babhūva ha","gs":"એવમુક્ત્વા હૃષીકેશં ગુડાકેશઃ પરન્તપ ।\nન યોત્સ્ય ઇતિ ગોવિન્દમુક્ત્વા તૂષ્ણીં બભૂવ હ ॥","en":"Sanjaya said: Having spoken thus to Hrishikesha, the Lord of the senses, Arjuna, the conqueror of sleep and destroyer of foes, said, \"I will not fight,\" and became silent.","hi":"संजय बोले - हे शत्रुतापन धृतराष्ट्र! ऐसा कहकर निद्राको जीतनेवाले अर्जुन अन्तर्यामी भगवान् गोविन्दसे 'मैं युद्ध नहीं करूँगा' ऐसा साफ-साफ कहकर चुप हो गये।"},{"c":2,"v":10,"sp":"sanjaya","sa":"तमुवाच हृषीकेशः प्रहसन्निव भारत ।\nसेनयोरुभयोर्मध्ये विषीदन्तमिदं वचः ॥","tr":"tamuvāca hṛṣīkeśaḥ prahasanniva bhārata\nsenayorubhayormadhye viṣīdantamidaṃ vacaḥ","gs":"તમુવાચ હૃષીકેશઃ પ્રહસન્નિવ ભારત ।\nસેનયોરુભયોર્મધ્યે વિષીદન્તમિદં વચઃ ॥","en":"To him who was despondent in the midst of the two armies, Krishna, smiling, O Bharata, spoke these words.","hi":"हे भरतवंशोद्भव धृतराष्ट्र! दोनों सेनाओंके मध्यभागमें विषाद करते हुए उस अर्जुनके प्रति हँसते हुए-से भगवान् हृषीकेश यह (आगे कहे जानेवाले) वचन बोले।"},{"c":2,"v":11,"sp":"krishna","sa":"अशोच्यानन्वशोचस्त्वं प्रज्ञावादांश्च भाषसे ।\nगतासूनगतासूंश्च नानुशोचन्ति पण्डिताः ॥","tr":"aśocyānanvaśocastvaṃ prajñāvādāṃśca bhāṣase\ngatāsūnagatāsūṃśca nānuśocanti paṇḍitāḥ","gs":"અશોચ્યાનન્વશોચસ્ત્વં પ્રજ્ઞાવાદાંશ્ચ ભાષસે ।\nગતાસૂનગતાસૂંશ્ચ નાનુશોચન્તિ પણ્ડિતાઃ ॥","en":"The Blessed Lord said, \"You have grieved for those who should not be grieved for; yet, you speak words of wisdom. The wise grieve neither for the living nor for the dead.\"","hi":"श्रीभगवान् बोले - तुमने शोक न करनेयोग्यका शोक किया है और पण्डिताईकी बातें कह रहे हो; परन्तु जिनके प्राण चले गये हैं, उनके लिये और जिनके प्राण नहीं गये हैं, उनके लिये पण्डितलोग शोक नहीं करते।"},{"c":2,"v":12,"sp":"krishna","sa":"न त्वेवाहं जातु नासं न त्वं नेमे जनाधिपाः ।\nन चैव न भविष्यामः सर्वे वयमतः परम् ॥","tr":"na tvevāhaṃ jātu nāsaṃ na tvaṃ neme janādhipāḥ\nna caiva na bhaviṣyāmaḥ sarve vayamataḥ param","gs":"ન ત્વેવાહં જાતુ નાસં ન ત્વં નેમે જનાધિપાઃ ।\nન ચૈવ ન ભવિષ્યામઃ સર્વે વયમતઃ પરમ્ ॥","en":"Nor, at any time, was I not, nor thou, nor these rulers of men; nor, verily, shall we ever cease to be hereafter.","hi":"किसी कालमें मैं नहीं था और तू नहीं था तथा ये राजालोग नहीं थे, यह बात भी नहीं है; और इसके बाद (भविष्य में) मैं, तू और राजलोग - हम सभी नहीं रहेंगे, यह बात भी नहीं है।"},{"c":2,"v":13,"sp":"krishna","sa":"देहिनोऽस्मिन्यथा देहे कौमारं यौवनं जरा ।\nतथा देहान्तरप्राप्तिर्धीरस्तत्र न मुह्यति ॥","tr":"dehino'sminyathā dehe kaumāraṃ yauvanaṃ jarā\ntathā dehāntaraprāptirdhīrastatra na muhyati","gs":"દેહિનોઽસ્મિન્યથા દેહે કૌમારં યૌવનં જરા ।\nતથા દેહાન્તરપ્રાપ્તિર્ધીરસ્તત્ર ન મુહ્યતિ ॥","en":"Just as the embodied soul passes through childhood, youth, and old age in this body, so too does it pass into another body; the steadfast one does not grieve over this.","hi":"देहधारीके इस मनुष्यशरीरमें जैसे बालकपन, जवानी और वृद्धावस्था होती है, ऐसे ही देहान्तरकी प्राप्ति होती है। उस विषयमें धीर मनुष्य मोहित नहीं होता।"},{"c":2,"v":14,"sp":"krishna","sa":"मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः ।\nआगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत ॥","tr":"mātrāsparśāstu kaunteya śītoṣṇasukhaduḥkhadāḥ\nāgamāpāyino'nityāstāṃstitikṣasva bhārata","gs":"માત્રાસ્પર્શાસ્તુ કૌન્તેય શીતોષ્ણસુખદુઃખદાઃ ।\nઆગમાપાયિનોઽનિત્યાસ્તાંસ્તિતિક્ષસ્વ ભારત ॥","en":"The contact of the senses with the objects, O son of Kunti, which causes heat and cold, pleasure and pain, has a beginning and an end; they are impermanent; endure them bravely, O Arjuna.","hi":"हे कुन्तीनन्दन! इन्द्रियोंके जो विषय (जड पदार्थ) हैं, वो तो शीत (अनुकूलता) और उष्ण (प्रतिकूलता) - के द्वारा सुख और दुःख देनेवाले हैं तथा आने-जानेवाले और अनित्य हैं। हे भरतवंशोद्भव अर्जुन! उनको तुम सहन करो।"},{"c":2,"v":15,"sp":"krishna","sa":"यं हि न व्यथयन्त्येते पुरुषं पुरुषर्षभ ।\nसमदुःखसुखं धीरं सोऽमृतत्वाय कल्पते ॥","tr":"yaṃ hi na vyathayantyete puruṣaṃ puruṣarṣabha\nsamaduḥkhasukhaṃ dhīraṃ so'mṛtatvāya kalpate","gs":"યં હિ ન વ્યથયન્ત્યેતે પુરુષં પુરુષર્ષભ ।\nસમદુઃખસુખં ધીરં સોઽમૃતત્વાય કલ્પતે ॥","en":"That firm man, whom surely these afflictions do not, O chief among men, to whom pleasure and pain are the same, is fit for attaining immortality.","hi":"कारण कि हे पुरुषोंमें श्रेष्ठ अर्जुन! सुख-दुःखमें सम रहनेवाले जिस धीर मनुष्यको ये मात्रास्पर्श (पदार्थ) व्यथित (सुखी-दुःखी) नहीं कर पाते, वह अमर होनेमें समर्थ हो जाता है अर्थात् वह अमर हो जाता है।"},{"c":2,"v":16,"sp":"krishna","sa":"नासतो विद्यते भावो नाभावो विद्यते सतः ।\nउभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः ॥","tr":"nāsato vidyate bhāvo nābhāvo vidyate sataḥ\nubhayorapi dṛṣṭo'ntastvanayostattvadarśibhiḥ","gs":"નાસતો વિદ્યતે ભાવો નાભાવો વિદ્યતે સતઃ ।\nઉભયોરપિ દૃષ્ટોઽન્તસ્ત્વનયોસ્તત્ત્વદર્શિભિઃ ॥","en":"The unreal has no being; there is no non-being of the real; the truth about both has been seen by the knowers of the truth (or the seers of the essence).","hi":"असत् का तो भाव (सत्ता) विद्यमान नहीं है और सत् का अभाव विद्यमान नहीं है, तत्त्वदर्शी महापुरुषोंने इन दोनोंका ही अन्त अर्थात् तत्त्व देखा है।"},{"c":2,"v":17,"sp":"krishna","sa":"अविनाशि तु तद्विद्धि येन सर्वमिदं ततम् ।\nविनाशमव्ययस्यास्य न कश्चित् कर्तुमर्हति ॥","tr":"avināśi tu tadviddhi yena sarvamidaṃ tatam\nvināśamavyayasyāsya na kaścit kartumarhati","gs":"અવિનાશિ તુ તદ્વિદ્ધિ યેન સર્વમિદં તતમ્ ।\nવિનાશમવ્યયસ્યાસ્ય ન કશ્ચિત્ કર્તુમર્હતિ ॥","en":"Know that to be indestructible, by which all this is pervaded. No one can cause the destruction of that, the Imperishable.","hi":"अविनाशी तो उसको जान, जिससे यह सम्पूर्ण संसार व्याप्त है। इस अविनाशीका विनाश कोई भी नहीं कर सकता।"},{"c":2,"v":18,"sp":"krishna","sa":"अन्तवन्त इमे देहा नित्यस्योक्ताः शरीरिणः ।\nअनाशिनोऽप्रमेयस्य तस्माद्युध्यस्व भारत ॥","tr":"antavanta ime dehā nityasyoktāḥ śarīriṇaḥ\nanāśino'prameyasya tasmādyudhyasva bhārata","gs":"અન્તવન્ત ઇમે દેહા નિત્યસ્યોક્તાઃ શરીરિણઃ ।\nઅનાશિનોઽપ્રમેયસ્ય તસ્માદ્યુધ્યસ્વ ભારત ॥","en":"These bodies of the embodied Self, which are eternal, indestructible, and immeasurable, are said to have an end. Therefore, fight, O Arjuna.","hi":"अविनाशी, अप्रमेय और नित्य रहनेवाले इस शरीरी के ये देह अन्तवाले कहे गये हैं। इसलिये हे अर्जुन! तुम युद्ध करो।"},{"c":2,"v":19,"sp":"krishna","sa":"य एनं वेत्ति हन्तारं यश्चैनं मन्यते हतम् ।\nउभौ तौ न विजानीतो नायं हन्ति न हन्यते ॥","tr":"ya enaṃ vetti hantāraṃ yaścainaṃ manyate hatam\nubhau tau na vijānīto nāyaṃ hanti na hanyate","gs":"ય એનં વેત્તિ હન્તારં યશ્ચૈનં મન્યતે હતમ્ ।\nઉભૌ તૌ ન વિજાનીતો નાયં હન્તિ ન હન્યતે ॥","en":"He who takes the Self to be the slayer and he who thinks it is slain, neither of them knows. It does not slay, nor is it slain.","hi":"जो मनुष्य इस अविनाशी शरीरीको मारनेवाला मानता है और जो मनुष्य इसको मरा मानता है, वे दोनों ही इसको नहीं जानते; क्योंकि यह न मारता है और न मारा जाता है।"},{"c":2,"v":20,"sp":"krishna","sa":"न जायते म्रियते वा कदाचि  न्नायं भूत्वा भविता वा न भूयः ।\nअजो नित्यः शाश्वतोऽयं पुराणो  न हन्यते हन्यमाने शरीरे ॥","tr":"na jāyate mriyate vā kadāci  nnāyaṃ bhūtvā bhavitā vā na bhūyaḥ\najo nityaḥ śāśvato'yaṃ purāṇo  na hanyate hanyamāne śarīre","gs":"ન જાયતે મ્રિયતે વા કદાચિ  ન્નાયં ભૂત્વા ભવિતા વા ન ભૂયઃ ।\nઅજો નિત્યઃ શાશ્વતોઽયં પુરાણો  ન હન્યતે હન્યમાને શરીરે ॥","en":"It is not born, nor does it ever die; after having been, it again does not cease to be; unborn, eternal, changeless, and ancient, it is not killed when the body is killed.","hi":"यह शरीरी न कभी जन्मता है और न मरता है तथा यह उत्पन्न होकर फिर होनेवाला नहीं है। यह जन्मरहित, नित्य-निरन्तर रहनेवाला, शाश्वत और पुराण (अनादि) है। शरीरके मारे जानेपर भी यह नहीं मारा जाता।"},{"c":2,"v":21,"sp":"krishna","sa":"वेदाविनाशिनं नित्यं य एनमजमव्ययम् ।\nकथं स पुरुषः पार्थ कं घातयति हन्ति कम् ॥","tr":"vedāvināśinaṃ nityaṃ ya enamajamavyayam\nkathaṃ sa puruṣaḥ pārtha kaṃ ghātayati hanti kam","gs":"વેદાવિનાશિનં નિત્યં ય એનમજમવ્યયમ્ ।\nકથં સ પુરુષઃ પાર્થ કં ઘાતયતિ હન્તિ કમ્ ॥","en":"Whoever knows it to be indestructible, eternal, unborn, and inexhaustible, how can that person slay, O Arjuna, or cause to be slain?","hi":"हे पृथानन्दन! जो मनुष्य इस शरीरीको अविनाशी, नित्य, जन्मरहित और अव्यय जानता है, वह कैसे किसको मारे और कैसे किसको मरवाये?"},{"c":2,"v":22,"sp":"krishna","sa":"वासांसि जीर्णानि यथा विहाय  नवानि गृह्णाति नरोऽपराणि ।\nतथा शरीराणि विहाय जीर्णा  न्यन्यानि संयाति नवानि देही ॥","tr":"vāsāṃsi jīrṇāni yathā vihāya  navāni gṛhṇāti naro'parāṇi\ntathā śarīrāṇi vihāya jīrṇā  nyanyāni saṃyāti navāni dehī","gs":"વાસાંસિ જીર્ણાનિ યથા વિહાય  નવાનિ ગૃહ્ણાતિ નરોઽપરાણિ ।\nતથા શરીરાણિ વિહાય જીર્ણા  ન્યન્યાનિ સંયાતિ નવાનિ દેહી ॥","en":"Just as a man casts off worn-out clothes and puts on new ones, so too the embodied Self casts off worn-out bodies and enters others that are new.","hi":"मनुष्य जैसे पुराने कपड़ोंको छोड़कर दूसरे नये कपड़े धारण कर लेता है, ऐसे ही देही पुराने शरीरोंको छोड़कर दूसरे नये शरीरोंमें चला जाता है।"},{"c":2,"v":23,"sp":"krishna","sa":"नैनं छिन्दन्ति शस्त्राणि नैनं दहति पावकः ।\nन चैनं क्लेदयन्त्यापो न शोषयति मारुतः ॥","tr":"nainaṃ chindanti śastrāṇi nainaṃ dahati pāvakaḥ\nna cainaṃ kledayantyāpo na śoṣayati mārutaḥ","gs":"નૈનં છિન્દન્તિ શસ્ત્રાણિ નૈનં દહતિ પાવકઃ ।\nન ચૈનં ક્લેદયન્ત્યાપો ન શોષયતિ મારુતઃ ॥","en":"Weapons cannot cut it, fire cannot burn it, water cannot wet it, wind cannot dry it.","hi":"शस्त्र इस शरीरीको काट नहीं सकते, अग्नि इसको जला नहीं सकती, जल इसको गीला नहीं कर सकता और वायु इसको सुखा नहीं सकती।"},{"c":2,"v":24,"sp":"krishna","sa":"अच्छेद्योऽयमदाह्योऽयमक्लेद्योऽशोष्य एव च ।\nनित्यः सर्वगतः स्थाणुरचलोऽयं सनातनः ॥","tr":"acchedyo'yamadāhyo'yamakledyo'śoṣya eva ca\nnityaḥ sarvagataḥ sthāṇuracalo'yaṃ sanātanaḥ","gs":"અચ્છેદ્યોઽયમદાહ્યોઽયમક્લેદ્યોઽશોષ્ય એવ ચ ।\nનિત્યઃ સર્વગતઃ સ્થાણુરચલોઽયં સનાતનઃ ॥","en":"This Self cannot be cut, burned, wetted, nor dried up; it is eternal, all-pervasive, stable, immovable, and ancient.","hi":"यह शरीरी काटा नहीं जा सकता, यह जलाया नहीं जा सकता, यह गीला नहीं किया जा सकता और यह सुखाया भी नहीं जा सकता। कारण कि यह नित्य रहनेवाला सबमें परिपूर्ण, अचल, स्थिर स्वभाववाला और अनादि है।"},{"c":2,"v":25,"sp":"krishna","sa":"अव्यक्तोऽयमचिन्त्योऽयमविकार्योऽयमुच्यते ।\nतस्मादेवं विदित्वैनं नानुशोचितुमर्हसि ॥","tr":"avyakto'yamacintyo'yamavikāryo'yamucyate\ntasmādevaṃ viditvainaṃ nānuśocitumarhasi","gs":"અવ્યક્તોઽયમચિન્ત્યોઽયમવિકાર્યોઽયમુચ્યતે ।\nતસ્માદેવં વિદિત્વૈનં નાનુશોચિતુમર્હસિ ॥","en":"This Self is said to be unmanifested, unthinkable, and unchangeable. Therefore, knowing this to be so, you should not grieve.","hi":"यह देही प्रत्यक्ष नहीं दीखता, यह चिन्तनका विषय नहीं है और यह निर्विकार कहा जाता है। अतः इस देहीको ऐसा जानकर शोक नहीं करना चाहिये।"},{"c":2,"v":26,"sp":"krishna","sa":"अथ चैनं नित्यजातं नित्यं वा मन्यसे मृतम् ।\nतथापि त्वं महाबाहो नैवं शोचितुमर्हसि ॥","tr":"atha cainaṃ nityajātaṃ nityaṃ vā manyase mṛtam\ntathāpi tvaṃ mahābāho naivaṃ śocitumarhasi","gs":"અથ ચૈનં નિત્યજાતં નિત્યં વા મન્યસે મૃતમ્ ।\nતથાપિ ત્વં મહાબાહો નૈવં શોચિતુમર્હસિ ॥","en":"But even if thou thinkest of It as constantly being born and constantly dying, even then, O mighty-armed one, thou shouldst not grieve.","hi":"हे महाबाहो ! अगर तुम इस देहीको नित्य पैदा होनेवाला अथवा नित्य मरनेवाला भी मानो, तो भी तुम्हें इस प्रकार शोक नहीं करना चाहिये।"},{"c":2,"v":27,"sp":"krishna","sa":"जातस्य हि ध्रुवो मृत्युर्ध्रुवं जन्म मृतस्य च ।\nतस्मादपरिहार्येऽर्थे न त्वं शोचितुमर्हसि ॥","tr":"jātasya hi dhruvo mṛtyurdhruvaṃ janma mṛtasya ca\ntasmādaparihārye'rthe na tvaṃ śocitumarhasi","gs":"જાતસ્ય હિ ધ્રુવો મૃત્યુર્ધ્રુવં જન્મ મૃતસ્ય ચ ।\nતસ્માદપરિહાર્યેઽર્થે ન ત્વં શોચિતુમર્હસિ ॥","en":"For the born, death is certain, and for the dead, birth is certain; therefore, you should not grieve over the inevitable.","hi":"क्योंकि पैदा हुएकी जरूर मृत्यु होगी और मरे हुएका जरूर जन्म होगा। इस (जन्म-मरण-रूप परिवर्तन के प्रवाह) का परिहार अर्थात् निवारण नहीं हो सकता। अतः इस विषयमें तुम्हें शोक नहीं करना चाहिये।"},{"c":2,"v":28,"sp":"krishna","sa":"अव्यक्तादीनि भूतानि व्यक्तमध्यानि भारत ।\nअव्यक्तनिधनान्येव तत्र का परिदेवना ॥","tr":"avyaktādīni bhūtāni vyaktamadhyāni bhārata\navyaktanidhanānyeva tatra kā paridevanā","gs":"અવ્યક્તાદીનિ ભૂતાનિ વ્યક્તમધ્યાનિ ભારત ।\nઅવ્યક્તનિધનાન્યેવ તત્ર કા પરિદેવના ॥","en":"Beings are unmanifest in their beginning, manifest in their middle state, O Arjuna, and unmanifest again in their end. What is there to grieve about?","hi":"हे भारत ! सभी प्राणी जन्मसे पहले अप्रकट थे और मरनेके बाद अप्रकट हो जायँगे, केवल बीचमें ही प्रकट दीखते हैं। अतः इसमें शोक करनेकी बात ही क्या है?"},{"c":2,"v":29,"sp":"krishna","sa":"आश्चर्यवत्पश्यति कश्चिदेन  माश्चर्यवद्वदति तथैव चान्यः ।\nआश्चर्यवच्चैनमन्यः श्रृणोति  श्रुत्वाप्येनं वेद न चैव कश्चित् ॥","tr":"āścaryavatpaśyati kaścidena  māścaryavadvadati tathaiva cānyaḥ\nāścaryavaccainamanyaḥ śrṛṇoti  śrutvāpyenaṃ veda na caiva kaścit","gs":"આશ્ચર્યવત્પશ્યતિ કશ્ચિદેન  માશ્ચર્યવદ્વદતિ તથૈવ ચાન્યઃ ।\nઆશ્ચર્યવચ્ચૈનમન્યઃ શ્રૃણોતિ  શ્રુત્વાપ્યેનં વેદ ન ચૈવ કશ્ચિત્ ॥","en":"One sees this (the Self) as a wonder; another speaks of it as a wonder; another hears of it as a wonder; yet, having heard, none understands it at all.","hi":"कोई इस शरीरीको आश्चर्यकी तरह देखता है और वैसे ही अन्य कोई इसका आश्चर्यकी तरह वर्णन करता है तथा अन्य कोई इसको आश्चर्यकी तरह सुनता है; और इसको सुनकर भी कोई नहीं जानता। अर्थात यह शरीरी दुर्विज्ञेय है।"},{"c":2,"v":30,"sp":"krishna","sa":"देही नित्यमवध्योऽयं देहे सर्वस्य भारत ।\nतस्मात्सर्वाणि भूतानि न त्वं शोचितुमर्हसि ॥","tr":"dehī nityamavadhyo'yaṃ dehe sarvasya bhārata\ntasmātsarvāṇi bhūtāni na tvaṃ śocitumarhasi","gs":"દેહી નિત્યમવધ્યોઽયં દેહે સર્વસ્ય ભારત ।\nતસ્માત્સર્વાણિ ભૂતાનિ ન ત્વં શોચિતુમર્હસિ ॥","en":"This indweller in the body of everyone is ever indestructible, O Arjuna; therefore, you should not grieve for any creature.","hi":"हे भरतवंशोद्भव अर्जुन! सबके देहमें यह देही नित्य ही अवध्य है। इसलिये सम्पूर्ण प्राणियोंके लिये अर्थात् किसी भी प्राणीके लिये तुम्हें शोक नहीं करना चाहिये।"},{"c":2,"v":31,"sp":"krishna","sa":"स्वधर्ममपि चावेक्ष्य न विकम्पितुमर्हसि ।\nधर्म्याद्धि युद्धाछ्रेयोऽन्यत्क्षत्रियस्य न विद्यते ॥","tr":"svadharmamapi cāvekṣya na vikampitumarhasi\ndharmyāddhi yuddhāchreyo'nyatkṣatriyasya na vidyate","gs":"સ્વધર્મમપિ ચાવેક્ષ્ય ન વિકમ્પિતુમર્હસિ ।\nધર્મ્યાદ્ધિ યુદ્ધાછ્રેયોઽન્યત્ક્ષત્રિયસ્ય ન વિદ્યતે ॥","en":"Further, having regard to your duty, you should not waver, for there is nothing higher for a Kshatriya than a righteous war.","hi":"अपने स्वधर्म (क्षात्रधर्म) को देखकर भी तुम्हें विकम्पित अर्थात् कर्तव्य-कर्मसे विचलित नहीं होना चाहिये; क्योंकि धर्ममय युद्धसे बढ़कर क्षत्रियके लिये दूसरा कोई कल्याणकारक कर्म नहीं है।"},{"c":2,"v":32,"sp":"krishna","sa":"यदृच्छया चोपपन्नं स्वर्गद्वारमपावृतम् ।\nसुखिनः क्षत्रियाः पार्थ लभन्ते युद्धमीदृशम् ॥","tr":"yadṛcchayā copapannaṃ svargadvāramapāvṛtam\nsukhinaḥ kṣatriyāḥ pārtha labhante yuddhamīdṛśam","gs":"યદૃચ્છયા ચોપપન્નં સ્વર્ગદ્વારમપાવૃતમ્ ।\nસુખિનઃ ક્ષત્રિયાઃ પાર્થ લભન્તે યુદ્ધમીદૃશમ્ ॥","en":"Happy are the Kshatriyas, O Arjuna! who are called to fight in such a battle that comes of its own accord as an open door to heaven.","hi":"अपने-आप प्राप्त हुआ युद्ध खुला हुआ स्वर्गका दरवाजा भी है। हे पृथानन्दन ! वे क्षत्रिय बड़े सुखी (भाग्यशाली) हैं, जिनको ऐसा युद्ध प्राप्त होता है।"},{"c":2,"v":33,"sp":"krishna","sa":"अथ चैत्त्वमिमं धर्म्यं संग्रामं न करिष्यसि ।\nततः स्वधर्मं कीर्तिं च हित्वा पापमवाप्स्यसि ॥","tr":"atha caittvamimaṃ dharmyaṃ saṃgrāmaṃ na kariṣyasi\ntataḥ svadharmaṃ kīrtiṃ ca hitvā pāpamavāpsyasi","gs":"અથ ચૈત્ત્વમિમં ધર્મ્યં સંગ્રામં ન કરિષ્યસિ ।\nતતઃ સ્વધર્મં કીર્તિં ચ હિત્વા પાપમવાપ્સ્યસિ ॥","en":"But if you will not fight this righteous war, then having abandoned your own duty and reputation, you will incur sin.","hi":"अब अगर तू यह धर्ममय युद्ध नहीं करेगा, तो अपने धर्म और कीर्तिका त्याग करके पापको प्राप्त होगा।"},{"c":2,"v":34,"sp":"krishna","sa":"अकीर्तिं चापि भूतानि कथयिष्यन्ति तेऽव्ययाम् ।\nसंभावितस्य चाकीर्तिर्मरणादतिरिच्यते ॥","tr":"akīrtiṃ cāpi bhūtāni kathayiṣyanti te'vyayām\nsaṃbhāvitasya cākīrtirmaraṇādatiricyate","gs":"અકીર્તિં ચાપિ ભૂતાનિ કથયિષ્યન્તિ તેઽવ્યયામ્ ।\nસંભાવિતસ્ય ચાકીર્તિર્મરણાદતિરિચ્યતે ॥","en":"People will also recount your everlasting dishonor; and for one who has been honored, dishonor is worse than death.","hi":"और सब प्राणी भी तेरी सदा रहनेवाली अपकीर्तिका कथन अर्थात निंदा करेंगे। वह अपकीर्ति सम्मानित मनुष्यके लिये मृत्युसे भी बढ़कर दुःखदायी होती है।"},{"c":2,"v":35,"sp":"krishna","sa":"भयाद्रणादुपरतं मंस्यन्ते त्वां महारथाः ।\nयेषां च त्वं बहुमतो भूत्वा यास्यसि लाघवम् ॥","tr":"bhayādraṇāduparataṃ maṃsyante tvāṃ mahārathāḥ\nyeṣāṃ ca tvaṃ bahumato bhūtvā yāsyasi lāghavam","gs":"ભયાદ્રણાદુપરતં મંસ્યન્તે ત્વાં મહારથાઃ ।\nયેષાં ચ ત્વં બહુમતો ભૂત્વા યાસ્યસિ લાઘવમ્ ॥","en":"The great chariot-warriors will think that you have withdrawn from the battle out of fear, and you will be held in low esteem by those who have held you in high regard.","hi":"महारथीलोग तुझे भयके कारण युद्धसे उपरत (हटा) हुआ मानेंगे। जिनकी धारणामें तू बहुमान्य हो चुका है, उनकी दृष्टिमें तू लघुताको प्राप्त हो जायगा।"},{"c":2,"v":36,"sp":"krishna","sa":"अवाच्यवादांश्च बहून् वदिष्यन्ति तवाहिताः ।\nनिन्दन्तस्तव सामर्थ्यं ततो दुःखतरं नु किम् ॥","tr":"avācyavādāṃśca bahūn vadiṣyanti tavāhitāḥ\nnindantastava sāmarthyaṃ tato duḥkhataraṃ nu kim","gs":"અવાચ્યવાદાંશ્ચ બહૂન્ વદિષ્યન્તિ તવાહિતાઃ ।\nનિન્દન્તસ્તવ સામર્થ્યં તતો દુઃખતરં નુ કિમ્ ॥","en":"Your enemies, scoffing at your power, will speak many abusive words—what could be more painful than this?","hi":"तेरे शत्रुलोग तेरी सार्मथ्यकी निन्दा करते हुए न कहनेयोग्य बहुत-से वचन भी कहेंगे। उससे बढ़कर और दुःखकी बात क्या होगी?"},{"c":2,"v":37,"sp":"krishna","sa":"हतो वा प्राप्स्यसि स्वर्गं जित्वा वा भोक्ष्यसे महीम् ।\nतस्मादुत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः ॥","tr":"hato vā prāpsyasi svargaṃ jitvā vā bhokṣyase mahīm\ntasmāduttiṣṭha kaunteya yuddhāya kṛtaniścayaḥ","gs":"હતો વા પ્રાપ્સ્યસિ સ્વર્ગં જિત્વા વા ભોક્ષ્યસે મહીમ્ ।\nતસ્માદુત્તિષ્ઠ કૌન્તેય યુદ્ધાય કૃતનિશ્ચયઃ ॥","en":"Slain, you will obtain heaven; victorious, you will enjoy the earth; therefore, stand up, O son of Kunti, resolved to fight.","hi":"अगर युद्धमें तू मारा जायगा तो तुझे स्वर्गकी प्राप्ति होगी और अगर युद्धमें तू जीत जायगा तो पृथ्वीका राज्य भोगेगा। अतः हे कुन्तीनन्दन! तू युद्धके लिये निश्चय करके खड़ा हो जा।"},{"c":2,"v":38,"sp":"krishna","sa":"सुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ ।\nततो युद्धाय युज्यस्व नैवं पापमवाप्स्यसि ॥","tr":"sukhaduḥkhe same kṛtvā lābhālābhau jayājayau\ntato yuddhāya yujyasva naivaṃ pāpamavāpsyasi","gs":"સુખદુઃખે સમે કૃત્વા લાભાલાભૌ જયાજયૌ ।\nતતો યુદ્ધાય યુજ્યસ્વ નૈવં પાપમવાપ્સ્યસિ ॥","en":"Having made pleasure and pain, gain and loss, victory and defeat equal, engage in battle for the sake of battle; thus, you shall not incur sin.","hi":"जय-पराजय, लाभ-हानि और सुख-दुःखको समान करके फिर युद्धमें लग जा। इस प्रकार युद्ध करनेसे तू पापको प्राप्त नहीं होगा।"},{"c":2,"v":39,"sp":"krishna","sa":"एषा तेऽभिहिता सांख्ये बुद्धिर्योगे त्विमां श्रृणु ।\nबुद्ध्यायुक्तो यया पार्थ कर्मबन्धं प्रहास्यसि ॥","tr":"eṣā te'bhihitā sāṃkhye buddhiryoge tvimāṃ śrṛṇu\nbuddhyāyukto yayā pārtha karmabandhaṃ prahāsyasi","gs":"એષા તેઽભિહિતા સાંખ્યે બુદ્ધિર્યોગે ત્વિમાં શ્રૃણુ ।\nબુદ્ધ્યાયુક્તો યયા પાર્થ કર્મબન્ધં પ્રહાસ્યસિ ॥","en":"This, which has been taught to you, is wisdom concerning Sankhya. Now listen to wisdom concerning Yoga, endowed with which, O Arjuna, you shall cast off the bonds of action.","hi":"हे पार्थ! यह समबुद्धि तेरे लिए पहले सांख्ययोगमें कही गयी, अब तू इसको कर्मयोगके विषयमें सुन; जिस समबुद्धिसे युक्त हुआ तू कर्मबन्धनका त्याग कर देगा।"},{"c":2,"v":40,"sp":"krishna","sa":"नेहाभिक्रमनाशोऽस्ति प्रत्यवायो न विद्यते ।\nस्वल्पमप्यस्य धर्मस्य त्रायते महतो भयात् ॥","tr":"nehābhikramanāśo'sti pratyavāyo na vidyate\nsvalpamapyasya dharmasya trāyate mahato bhayāt","gs":"નેહાભિક્રમનાશોઽસ્તિ પ્રત્યવાયો ન વિદ્યતે ।\nસ્વલ્પમપ્યસ્ય ધર્મસ્ય ત્રાયતે મહતો ભયાત્ ॥","en":"In this, there is no loss of effort, nor is there any harm produced, nor any transgression. Even a little of this knowledge protects one from great fear.","hi":"मनुष्यलोकमें इस समबुद्धिरूप धर्मके आरम्भका नाश नहीं होता, इसके अनुष्ठानका उलटा फल भी नहीं होता और इसका थोड़ासा भी अनुष्ठान (जन्म-मरणरूप) महान् भयसे रक्षा कर लेता है।"},{"c":2,"v":41,"sp":"krishna","sa":"व्यवसायात्मिका बुद्धिरेकेह कुरुनन्दन ।\nबहुशाखा ह्यनन्ताश्च बुद्धयोऽव्यवसायिनाम् ॥","tr":"vyavasāyātmikā buddhirekeha kurunandana\nbahuśākhā hyanantāśca buddhayo'vyavasāyinām","gs":"વ્યવસાયાત્મિકા બુદ્ધિરેકેહ કુરુનન્દન ।\nબહુશાખા હ્યનન્તાશ્ચ બુદ્ધયોઽવ્યવસાયિનામ્ ॥","en":"Here, O joy of the Kurus, there is only one single-pointed determination; many-branched and endless are the thoughts of the indecisive.","hi":"हे कुरुनन्दन! इस समबुद्धिकी प्राप्तिके विषयमें व्यवसायात्मिका बुद्धि एक ही होती है। अव्यवसायी मनुष्योंकी बुद्धियाँ अनन्त और बहुशाखाओंवाली ही होती हैं।"},{"c":2,"v":42,"sp":"krishna","sa":"यामिमां पुष्पितां वाचं प्रवदन्त्यविपश्चितः ।\nवेदवादरताः पार्थ नान्यदस्तीति वादिनः ॥","tr":"yāmimāṃ puṣpitāṃ vācaṃ pravadantyavipaścitaḥ\nvedavādaratāḥ pārtha nānyadastīti vādinaḥ","gs":"યામિમાં પુષ્પિતાં વાચં પ્રવદન્ત્યવિપશ્ચિતઃ ।\nવેદવાદરતાઃ પાર્થ નાન્યદસ્તીતિ વાદિનઃ ॥","en":"The unwise, taking pleasure in the eulogizing words of the Vedas, utter flowery speech, saying, \"There is nothing else,\" O Arjuna.","hi":"।।2.42 -- 2.43।। हे पृथानन्दन ! जो कामनाओंमें तन्मय हो रहे हैं, स्वर्गको ही श्रेष्ठ माननेवाले हैं, वेदोंमें कहे हुए सकाम कर्मोंमें प्रीति रखनेवाले हैं, भोगोंके सिवाय और कुछ है ही नहीं - ऐसा कहनेवाले हैं, वे अविवेकी मनुष्य इस प्रकारकी जिस पुष्पित (दिखाऊ शोभायुक्त) वाणीको कहा करते हैं, जो कि जन्मरूपी कर्मफलको देनेवाली है तथा भोग और ऐश्वर्यकी प्राप्तिके लिये बहुतसी क्रियाओंका वर्णन करनेवाली है।"},{"c":2,"v":43,"sp":"krishna","sa":"कामात्मानः स्वर्गपरा जन्मकर्मफलप्रदाम् ।\nक्रियाविशेषबहुलां भोगैश्वर्यगतिं प्रति ॥","tr":"kāmātmānaḥ svargaparā janmakarmaphalapradām\nkriyāviśeṣabahulāṃ bhogaiśvaryagatiṃ prati","gs":"કામાત્માનઃ સ્વર્ગપરા જન્મકર્મફલપ્રદામ્ ।\nક્રિયાવિશેષબહુલાં ભોગૈશ્વર્યગતિં પ્રતિ ॥","en":"Full of desires, with heaven as their goal, (they speak words that are directed to ends) leading to new births as the result of their works, and prescribe various methods abounding in specific actions, for the attainment of pleasure and power.","hi":"।।2.42 -- 2.43।। हे पृथानन्दन ! जो कामनाओंमें तन्मय हो रहे हैं, स्वर्गको ही श्रेष्ठ माननेवाले हैं, वेदोंमें कहे हुए सकाम कर्मोंमें प्रीति रखनेवाले हैं, भोगोंके सिवाय और कुछ है ही नहीं - ऐसा कहनेवाले हैं, वे अविवेकी मनुष्य इस प्रकारकी जिस पुष्पित (दिखाऊ शोभायुक्त) वाणीको कहा करते हैं, जो कि जन्मरूपी कर्मफलको देनेवाली है तथा भोग और ऐश्वर्यकी प्राप्तिके लिये बह
