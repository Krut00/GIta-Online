 प्रलय के ब्रह्मांडीय चक्रों और मृत्यु के बाद आत्मा के दो मार्गों का वर्णन करते हैं।","why":"अध्याय 7 पारिभाषिक शब्दों पर समाप्त हुआ। अर्जुन उनकी व्याख्या चाहते हैं, और मृत्यु का विषय फिर आता है।","ideas":["ब्रह्म अक्षर (अविनाशी) है; अध्यात्म व्यक्ति का मूल स्वभाव है (8.3)।","मृत्यु के समय जिसका स्मरण होता है, वही प्राप्त होता है (8.5–8.6)।","इसलिए हर समय मेरा स्मरण करो और युद्ध करो (8.7)।","सृष्टि और प्रलय विशाल चक्रों में होते हैं (8.17–8.19)।"],"summary":"जीवन भर की दिशा अंतिम क्षण को आकार देती है; उपदेश है कि सर्वोच्च को याद रखते हुए जियो।","lessons":["जो विचार आप रोज़ दोहराते हैं वही आपका स्वभाव बन जाते हैं।","सामान्य काम करते हुए भी जो महत्त्वपूर्ण है उसे याद रखने का अभ्यास करें (8.7)।","समय के विशाल चक्र रोज़ की चिंताओं को सही अनुपात में रखते हैं।"],"qa":[["क्या 8.24–8.25 (दो मार्ग) शाब्दिक हैं?","कुछ परंपराएँ इन्हें मृत्यु के बाद प्रकाश और धूम के शाब्दिक मार्ग मानती हैं। अन्य, कुछ वेदांती टीकाकारों सहित, इन शब्दों को देवता या प्रतीक मानते हैं। पाठ इनका ब्रह्मांडीय भाषा में वर्णन करता है।"]],"conn":"अध्याय 9 भक्ति के 'राजगुह्य' को आगे बढ़ाता है।","quiz":[["अध्याय 8 की शुरुआत में अर्जुन कितने प्रश्न पूछते हैं?",["एक","तीन","सात","अठारह"],2],["8.7 अर्जुन से क्या करने को कहता है?",["मेरा स्मरण करो और युद्ध करो","युद्ध छोड़ दो","सदा ध्यान करो","कर्मकांड करो"],0],["8.6 के अनुसार अगली अवस्था क्या तय करता है?",["धन","मृत्यु के समय का स्मरण","कुल का नाम","मृत्यु का स्थान"],1]]},"gu":{"title":"અક્ષર-બ્રહ્મ યોગ","intro":"અર્જુન બ્રહ્મ, અધ્યાત્મ, કર્મ જેવા શબ્દો અને મૃત્યુ સમયે ઈશ્વરને કેવી રીતે જાણવા તે વિશે સાત પ્રશ્નો પૂછે છે. કૃષ્ણ તેમની વ્યાખ્યા આપે છે અને શીખવે છે કે મૃત્યુ સમયે વ્યક્તિ જેનું સ્મરણ કરે છે તે જ તેની આગલી અવસ્થા નક્કી કરે છે. તેઓ સર્જન અને પ્રલયનાં બ્રહ્માંડીય ચક્રો અને મૃત્યુ પછી આત્માના બે માર્ગ વર્ણવે છે.","why":"અધ્યાય 7 પારિભાષિક શબ્દો પર પૂરો થયો. અર્જુન તેમની સમજૂતી ઇચ્છે છે, અને મૃત્યુનો વિષય ફરી આવે છે.","ideas":["બ્રહ્મ અક્ષર (અવિનાશી) છે; અધ્યાત્મ વ્યક્તિનો મૂળ સ્વભાવ છે (8.3).","મૃત્યુ સમયે જેનું સ્મરણ થાય, તે જ પ્રાપ્ત થાય છે (8.5–8.6).","એટલે દરેક સમયે મારું સ્મરણ કરો અને યુદ્ધ કરો (8.7).","સર્જન અને પ્રલય વિશાળ ચક્રોમાં થાય છે (8.17–8.19)."],"summary":"જીવનભરની દિશા અંતિમ ક્ષણને ઘડે છે; ઉપદેશ છે કે સર્વોચ્ચને યાદ રાખીને જીવો.","lessons":["જે વિચારો તમે રોજ દોહરાવો છો તે જ તમારો સ્વભાવ બની જાય છે.","સામાન્ય કામ કરતાં કરતાં પણ જે મહત્ત્વનું છે તે યાદ રાખવાનો અભ્યાસ કરો (8.7).","સમયનાં વિશાળ ચક્રો રોજની ચિંતાઓને યોગ્ય પ્રમાણમાં મૂકે છે."],"qa":[["શું 8.24–8.25 (બે માર્ગ) શાબ્દિક છે?","કેટલીક પરંપરાઓ તેમને મૃત્યુ પછીના પ્રકાશ અને ધુમાડાના શાબ્દિક માર્ગ માને છે. બીજા, કેટલાક વેદાંતી ટીકાકારો સહિત, આ શબ્દોને દેવતા કે પ્રતીક માને છે. લખાણ તેમનું બ્રહ્માંડીય ભાષામાં વર્ણન કરે છે."]],"conn":"અધ્યાય 9 ભક્તિના 'રાજગુહ્ય'ને આગળ વધારે છે.","quiz":[["અધ્યાય 8ની શરૂઆતમાં અર્જુન કેટલા પ્રશ્નો પૂછે છે?",["એક","ત્રણ","સાત","અઢાર"],2],["8.7 અર્જુનને શું કરવા કહે છે?",["મારું સ્મરણ કરો અને યુદ્ધ કરો","યુદ્ધ છોડી દો","સદા ધ્યાન કરો","કર્મકાંડ કરો"],0],["8.6 પ્રમાણે આગલી અવસ્થા શું નક્કી કરે છે?",["ધન","મૃત્યુ સમયનું સ્મરણ","કુળનું નામ","મૃત્યુનું સ્થળ"],1]]},"sa":"अक्षरब्रह्मयोग","iast":"Akṣhar Brahma Yog","count":28,"gs":"અક્ષરબ્રહ્મયોગ"},{"n":9,"key":["9.4","9.22","9.26","9.27","9.29","9.32","9.34"],"concepts":["bhakti","yajna"],"en":{"title":"Royal Knowledge and Royal Secret","intro":"Krishna calls this teaching the king of sciences and the king of secrets. He pervades everything yet is not contained in it. He accepts even a leaf, flower, fruit or water offered with love. He is equal to all, and those who worship him with devotion are in him and he in them. No devotee is lost, whatever their background.","why":"The path of devotion makes the highest goal open to everyone, not only scholars or ascetics.","ideas":["All beings rest in the Divine, but the Divine is not limited by them (9.4–9.5).","He carries what his devotees lack and preserves what they have (9.22).","A simple offering made with love is accepted (9.26).","Offer whatever you do, eat, give or practise (9.27)."],"summary":"Devotion turns ordinary life, every action and meal, into a relationship with the Divine.","lessons":["Sincerity matters more than expense.","Treat daily work as an offering, not a burden.","No one is excluded from the highest good (9.32)."],"qa":[["9.32 mentions women, vaishyas and shudras. Is that demeaning?","The verse says these groups too reach the highest goal. Some read it as inclusive for its time; critics note it reflects the social hierarchy of its era. Both readings are found in modern commentary."]],"conn":"Chapter 10 describes the Divine's manifestations so devotion has something concrete to rest on.","quiz":[["What does Krishna accept in 9.26?",["Only gold","A leaf, flower, fruit or water offered with love","Animal sacrifice","Long rituals"],1],["What does 9.27 ask Arjuna to offer?",["Only prayers","Whatever he does, eats, offers, gives or practises","His kingdom","Nothing"],1],["What does Krishna call this chapter's teaching?",["Royal knowledge and royal secret","Hidden law","Secret of war","Knowledge of stars"],0]]},"hi":{"title":"राजविद्या-राजगुह्य योग","intro":"कृष्ण इस उपदेश को विद्याओं का राजा और रहस्यों का राजा कहते हैं। वे सबमें व्याप्त हैं, फिर भी उसमें सीमित नहीं हैं। प्रेम से अर्पित एक पत्ता, फूल, फल या जल भी वे स्वीकार करते हैं। वे सबके लिए समान हैं, और जो भक्ति से उन्हें भजते हैं वे उनमें हैं और वे उनमें। कोई भी भक्त नष्ट नहीं होता, उसकी पृष्ठभूमि कुछ भी हो।","why":"भक्ति का मार्ग परम लक्ष्य को सबके लिए खोल देता है, केवल विद्वानों या तपस्वियों के लिए नहीं।","ideas":["सब प्राणी ईश्वर में स्थित हैं, पर ईश्वर उनसे सीमित नहीं (9.4–9.5)।","वे भक्तों की कमी पूरी करते हैं और जो है उसकी रक्षा करते हैं (9.22)।","प्रेम से की गई साधारण भेंट भी स्वीकार है (9.26)।","जो भी करो, खाओ, दो या तप करो, मुझे अर्पित करो (9.27)।"],"summary":"भक्ति साधारण जीवन — हर कर्म और भोजन — को ईश्वर से एक संबंध बना देती है।","lessons":["ख़र्च से ज़्यादा सच्चाई मायने रखती है।","रोज़ के काम को बोझ नहीं, भेंट समझें।","परम कल्याण से कोई वंचित नहीं है (9.32)।"],"qa":[["9.32 में स्त्रियों, वैश्यों और शूद्रों का उल्लेख है। क्या यह अपमानजनक है?","श्लोक कहता है कि ये भी परम गति पाते हैं। कुछ इसे अपने समय के लिए समावेशी मानते हैं; आलोचक कहते हैं कि यह उस युग का सामाजिक ऊँच-नीच दर्शाता है। आधुनिक टीकाओं में दोनों पाठ मिलते हैं।"]],"conn":"अध्याय 10 ईश्वर की विभूतियों का वर्णन करता है ताकि भक्ति को ठोस आधार मिले।","quiz":[["9.26 में कृष्ण क्या स्वीकार करते हैं?",["केवल सोना","प्रेम से अर्पित पत्ता, फूल, फल या जल","पशु बलि","लंबे कर्मकांड"],1],["9.27 अर्जुन से क्या अर्पित करने को कहता है?",["केवल प्रार्थना","जो कुछ भी वह करे, खाए, हवन करे, दे या तप करे","अपना राज्य","कुछ नहीं"],1],["कृष्ण इस अध्याय के उपदेश को क्या कहते हैं?",["राजविद्या और राजगुह्य","छिपा नियम","युद्ध का रहस्य","नक्षत्रों का ज्ञान"],0]]},"gu":{"title":"રાજવિદ્યા-રાજગુહ્ય યોગ","intro":"કૃષ્ણ આ ઉપદેશને વિદ્યાઓનો રાજા અને રહસ્યોનો રાજા કહે છે. તેઓ બધામાં વ્યાપેલા છે, છતાં તેમાં સીમિત નથી. પ્રેમથી અર્પેલું એક પાન, ફૂલ, ફળ કે જળ પણ તેઓ સ્વીકારે છે. તેઓ બધા માટે સમાન છે, અને જે ભક્તિથી તેમને ભજે છે તે તેમનામાં છે અને તેઓ તેમનામાં. કોઈ પણ ભક્ત નાશ પામતો નથી, તેની પૃષ્ઠભૂમિ ગમે તે હોય.","why":"ભક્તિનો માર્ગ પરમ લક્ષ્યને બધા માટે ખુલ્લું કરે છે, ફક્ત વિદ્વાનો કે તપસ્વીઓ માટે નહીં.","ideas":["બધા જીવો ઈશ્વરમાં રહેલા છે, પણ ઈશ્વર તેમનાથી સીમિત નથી (9.4–9.5).","તેઓ ભક્તોની ખોટ પૂરી કરે છે અને જે છે તેનું રક્ષણ કરે છે (9.22).","પ્રેમથી કરેલી સાદી ભેટ પણ સ્વીકાર્ય છે (9.26).","જે કંઈ કરો, ખાઓ, આપો કે તપ કરો, મને અર્પણ કરો (9.27)."],"summary":"ભક્તિ સામાન્ય જીવન — દરેક કર્મ અને ભોજન — ને ઈશ્વર સાથેનો સંબંધ બનાવે છે.","lessons":["ખર્ચ કરતાં સચ્ચાઈ વધુ મહત્ત્વની છે.","રોજના કામને બોજ નહીં, ભેટ સમજો.","પરમ કલ્યાણથી કોઈ વંચિત નથી (9.32)."],"qa":[["9.32માં સ્ત્રીઓ, વૈશ્યો અને શૂદ્રોનો ઉલ્લેખ છે. શું તે અપમાનજનક છે?","શ્લોક કહે છે કે આ લોકો પણ પરમ ગતિ પામે છે. કેટલાક તેને પોતાના સમય માટે સમાવેશી માને છે; ટીકાકારો કહે છે કે તે એ યુગની સામાજિક ઊંચ-નીચ દર્શાવે છે. આધુનિક ટીકાઓમાં બંને અર્થઘટન મળે છે."]],"conn":"અધ્યાય 10 ઈશ્વરની વિભૂતિઓ વર્ણવે છે જેથી ભક્તિને નક્કર આધાર મળે.","quiz":[["9.26માં કૃષ્ણ શું સ્વીકારે છે?",["ફક્ત સોનું","પ્રેમથી અર્પેલું પાન, ફૂલ, ફળ કે જળ","પશુબલિ","લાંબા કર્મકાંડ"],1],["9.27 અર્જુનને શું અર્પણ કરવા કહે છે?",["ફક્ત પ્રાર્થના","જે કંઈ તે કરે, ખાય, હોમે, આપે કે તપ કરે","પોતાનું રાજ્ય","કંઈ નહીં"],1],["કૃષ્ણ આ અધ્યાયના ઉપદેશને શું કહે છે?",["રાજવિદ્યા અને રાજગુહ્ય","છૂપો નિયમ","યુદ્ધનું રહસ્ય","નક્ષત્રોનું જ્ઞાન"],0]]},"sa":"राजविद्याराजगुह्ययोग","iast":"Rāja Vidyā Yog","count":34,"gs":"રાજવિદ્યારાજગુહ્યયોગ"},{"n":10,"key":["10.8","10.10","10.20","10.41","10.42"],"concepts":["bhakti"],"en":{"title":"Divine Manifestations","intro":"Krishna describes himself as the origin of all. Arjuna asks how to think of him in daily life. Krishna lists his 'vibhutis', the best in every class: among lights he is the sun, among rivers the Ganga, among letters 'A', among warriors Rama. Wherever there is excellence, glory or power, that is a spark of his splendour.","why":"Devotion needs something to hold on to. This chapter gives ways to see the Divine in the world.","ideas":["The Divine is the source of everything (10.8).","He gives understanding to those devoted to him (10.10).","He is the self in the heart of all beings (10.20).","All excellence is a fraction of his glory (10.41)."],"summary":"Look at what is finest in nature and people and recognise the sacred in it.","lessons":["Notice and respect excellence wherever it appears.","Admiration without envy is itself a discipline.","The ordinary world can be a reminder of the highest."],"qa":[["Is the list meant to be complete?","No. Krishna says his manifestations have no end and he names only the chief ones (10.19, 10.40)."]],"conn":"Arjuna, moved by this, asks to see the cosmic form in Chapter 11.","quiz":[["In 10.20, Krishna says he is:",["Only in temples","The self in the heart of all beings","Absent from the world","A distant king"],1],["What does 10.41 say about anything glorious or powerful?",["It is evil","It springs from a fraction of his splendour","It is illusion","It belongs to the gods"],1],["Does Krishna say his list is complete?",["Yes","No, his manifestations are endless","Only for humans","Only for animals"],1]]},"hi":{"title":"विभूति योग","intro":"कृष्ण स्वयं को सबका मूल बताते हैं। अर्जुन पूछते हैं कि रोज़मर्रा के जीवन में उनका चिंतन कैसे करें। कृष्ण अपनी 'विभूतियाँ' गिनाते हैं, हर वर्ग में सर्वश्रेष्ठ: प्रकाशों में सूर्य, नदियों में गंगा, अक्षरों में 'अ', शस्त्रधारियों में राम। जहाँ भी उत्कृष्टता, ऐश्वर्य या शक्ति है, वह उनके तेज का अंश है।","why":"भक्ति को पकड़ने के लिए कुछ चाहिए। यह अध्याय संसार में ईश्वर को देखने के तरीक़े देता है।","ideas":["ईश्वर सबका उद्गम है (10.8)।","वे अपने भक्तों को बुद्धियोग देते हैं (10.10)।","वे सब प्राणियों के हृदय में स्थित आत्मा हैं (10.20)।","हर उत्कृष्टता उनके तेज का अंश है (10.41)।"],"summary":"प्रकृति और लोगों में जो सर्वश्रेष्ठ है उसे देखें और उसमें पवित्रता पहचानें।","lessons":["जहाँ भी उत्कृष्टता दिखे, उसे पहचानें और सम्मान दें।","ईर्ष्या रहित प्रशंसा भी एक साधना है।","साधारण संसार भी सर्वोच्च की याद दिला सकता है।"],"qa":[["क्या यह सूची पूरी है?","नहीं। कृष्ण कहते हैं कि उनकी विभूतियों का अंत नहीं है और वे केवल मुख्य बता रहे हैं (10.19, 10.40)।"]],"conn":"इससे प्रभावित होकर अर्जुन अध्याय 11 में विराट रूप देखने की प्रार्थना करते हैं।","quiz":[["10.20 में कृष्ण कहते हैं कि वे हैं:",["केवल मंदिरों में","सब प्राणियों के हृदय में स्थित आत्मा","संसार से अनुपस्थित","दूर के राजा"],1],["10.41 किसी भी ऐश्वर्यपूर्ण या शक्तिशाली वस्तु के बारे में क्या कहता है?",["वह बुरी है","वह उनके तेज के अंश से उत्पन्न है","वह माया है","वह देवताओं की है"],1],["क्या कृष्ण कहते हैं कि उनकी सूची पूरी है?",["हाँ","नहीं, उनकी विभूतियाँ अनंत हैं","केवल मनुष्यों के लिए","केवल पशुओं के लिए"],1]]},"gu":{"title":"વિભૂતિ યોગ","intro":"કૃષ્ણ પોતાને બધાનું મૂળ કહે છે. અર્જુન પૂછે છે કે રોજિંદા જીવનમાં તેમનું ચિંતન કેવી રીતે કરવું. કૃષ્ણ પોતાની 'વિભૂતિઓ' ગણાવે છે, દરેક વર્ગમાં શ્રેષ્ઠ: પ્રકાશોમાં સૂર્ય, નદીઓમાં ગંગા, અક્ષરોમાં 'અ', શસ્ત્રધારીઓમાં રામ. જ્યાં પણ ઉત્કૃષ્ટતા, ઐશ્વર્ય કે શક્તિ છે, તે તેમના તેજનો અંશ છે.","why":"ભક્તિને પકડવા કંઈક જોઈએ. આ અધ્યાય જગતમાં ઈશ્વરને જોવાની રીતો આપે છે.","ideas":["ઈશ્વર બધાનું ઉદ્ગમ છે (10.8).","તેઓ પોતાના ભક્તોને બુદ્ધિયોગ આપે છે (10.10).","તેઓ બધા જીવોના હૃદયમાં રહેલો આત્મા છે (10.20).","દરેક ઉત્કૃષ્ટતા તેમના તેજનો અંશ છે (10.41)."],"summary":"પ્રકૃતિ અને લોકોમાં જે શ્રેષ્ઠ છે તે જુઓ અને તેમાં પવિત્રતા ઓળખો.","lessons":["જ્યાં પણ ઉત્કૃષ્ટતા દેખાય, તેને ઓળખો અને આદર આપો.","ઈર્ષ્યા વગરની પ્રશંસા પણ એક સાધના છે.","સામાન્ય જગત પણ સર્વોચ્ચની યાદ અપાવી શકે."],"qa":[["શું આ યાદી પૂરી છે?","ના. કૃષ્ણ કહે છે કે તેમની વિભૂતિઓનો અંત નથી અને તેઓ ફક્ત મુખ્ય કહે છે (10.19, 10.40)."]],"conn":"આનાથી પ્રભાવિત થઈને અર્જુન અધ્યાય 11માં વિરાટ રૂપ જોવાની પ્રાર્થના કરે છે.","quiz":[["10.20માં કૃષ્ણ કહે છે કે તેઓ છે:",["ફક્ત મંદિરોમાં","બધા જીવોના હૃદયમાં રહેલો આત્મા","જગતમાંથી ગેરહાજર","દૂરના રાજા"],1],["10.41 કોઈ પણ ઐશ્વર્યવાન કે શક્તિશાળી વસ્તુ વિશે શું કહે છે?",["તે ખરાબ છે","તે તેમના તેજના અંશમાંથી ઉત્પન્ન છે","તે માયા છે","તે દેવોની છે"],1],["શું કૃષ્ણ કહે છે કે તેમની યાદી પૂરી છે?",["હા","ના, તેમની વિભૂતિઓ અનંત છે","ફક્ત માણસો માટે","ફક્ત પ્રાણીઓ માટે"],1]]},"sa":"विभूतियोग","iast":"Vibhūti Yog","count":42,"gs":"વિભૂતિયોગ"},{"n":11,"key":["11.8","11.12","11.32","11.33","11.54","11.55"],"concepts":["bhakti"],"en":{"title":"The Universal Form","intro":"Arjuna asks to see Krishna's cosmic form. Krishna gives him divine eyes, and Arjuna sees the whole universe in one body: countless faces, the brilliance of a thousand suns, and the warriors of both armies rushing into its mouths. Terrified, Arjuna asks who he is. Krishna answers, 'I am Time, the destroyer of worlds.' Arjuna begs to see his familiar form again.","why":"Arjuna has heard about the Divine; now he needs to experience it directly. The vision shows that outcomes are part of a vast order beyond his control.","ideas":["Ordinary eyes cannot see the cosmic form; divine sight is needed (11.8).","Its light is like a thousand suns rising at once (11.12).","'I am Time (kala), destroyer of worlds' (11.32).","Be merely the instrument (nimitta-matra) (11.33).","Only devotion makes this vision possible (11.54)."],"summary":"The most dramatic chapter: awe, terror and finally tenderness as Krishna returns to his gentle form.","lessons":["Some things are bigger than our control; that can be humbling rather than paralysing.","See yourself as a contributor to outcomes, not the sole cause.","Awe can turn into love when the vast becomes personal again."],"qa":[["Does 11.33 mean Arjuna has no free will?","Commentators differ. Many read it as: the outcome is already set by the larger order, but Arjuna's role, attitude and responsibility remain his own."]],"conn":"After this overwhelming vision, Chapter 12 asks the practical question: which kind of devotion is best?","quiz":[["What does Krishna give Arjuna to see the cosmic form?",["A mirror","Divine eyes","A chariot","A mantra"],1],["Who does Krishna say he is in 11.32?",["Time, destroyer of worlds","A simple charioteer","Indra","Brahma"],0],["What does Krishna ask Arjuna to be in 11.33?",["A king","Merely an instrument","A monk","A judge"],1]]},"hi":{"title":"विश्वरूप-दर्शन योग","intro":"अर्जुन कृष्ण का विराट रूप देखने की प्रार्थना करते हैं। कृष्ण उन्हें दिव्य चक्षु देते हैं, और अर्जुन एक ही शरीर में पूरा ब्रह्मांड देखते हैं: असंख्य मुख, हज़ार सूर्यों जैसा प्रकाश, और दोनों सेनाओं के योद्धा उसके मुखों में समाते हुए। भयभीत अर्जुन पूछते हैं कि आप कौन हैं। कृष्ण उत्तर देते हैं, 'मैं लोकों का नाश करने वाला काल हूँ।' अर्जुन फिर से उनका परिचित रूप देखने की विनती करते हैं।","why":"अर्जुन ने ईश्वर के बारे में सुना है; अब उन्हें प्रत्यक्ष अनुभव चाहिए। यह दर्शन दिखाता है कि परिणाम उनके नियंत्रण से परे एक विशाल व्यवस्था का हिस्सा हैं।","ideas":["साधारण आँखें विराट रूप नहीं देख सकतीं; दिव्य दृष्टि चाहिए (11.8)।","उसका प्रकाश एक साथ उगे हज़ार सूर्यों जैसा है (11.12)।","'मैं काल हूँ, लोकों का नाश करने वाला' (11.32)।","केवल निमित्त बनो (11.33)।","केवल भक्ति से यह दर्शन संभव है (11.54)।"],"summary":"सबसे नाटकीय अध्याय: विस्मय, भय और अंत में कोमलता, जब कृष्ण अपने सौम्य रूप में लौटते हैं।","lessons":["कुछ चीज़ें हमारे नियंत्रण से बड़ी हैं; यह जड़ नहीं, विनम्र बना सकता है।","ख़ुद को परिणामों में योगदान देने वाला मानें, एकमात्र कारण नहीं।","जब विराट फिर से व्यक्तिगत बनता है तो विस्मय प्रेम में बदल सकता है।"],"qa":[["क्या 11.33 का अर्थ है कि अर्जुन की कोई स्वतंत्र इच्छा नहीं?","टीकाकारों में मतभेद है। कई इसे ऐसे पढ़ते हैं: परिणाम बड़ी व्यवस्था ने तय कर दिया है, पर अर्जुन की भूमिका, दृष्टिकोण और ज़िम्मेदारी उनकी अपनी है।"]],"conn":"इस प्रचंड दर्शन के बाद अध्याय 12 व्यावहारिक प्रश्न पूछता है: कौन-सी भक्ति श्रेष्ठ है?","quiz":[["विराट रूप देखने के लिए कृष्ण अर्जुन को क्या देते हैं?",["दर्पण","दिव्य चक्षु","रथ","मंत्र"],1],["11.32 में कृष्ण स्वयं को क्या बताते हैं?",["लोकों का नाश करने वाला काल","साधारण सारथी","इंद्र","ब्रह्मा"],0],["11.33 में कृष्ण अर्जुन से क्या बनने को कहते हैं?",["राजा","केवल निमित्त","संन्यासी","न्यायाधीश"],1]]},"gu":{"title":"વિશ્વરૂપ-દર્શન યોગ","intro":"અર્જુન કૃષ્ણનું વિરાટ રૂપ જોવાની પ્રાર્થના કરે છે. કૃષ્ણ તેમને દિવ્ય ચક્ષુ આપે છે, અને અર્જુન એક જ શરીરમાં આખું બ્રહ્માંડ જુએ છે: અસંખ્ય મુખ, હજાર સૂર્ય જેવો પ્રકાશ, અને બંને સેનાના યોદ્ધાઓ તેનાં મુખોમાં સમાતા. ભયભીત અર્જુન પૂછે છે કે આપ કોણ છો. કૃષ્ણ જવાબ આપે છે, 'હું લોકોનો નાશ કરનાર કાળ છું.' અર્જુન ફરી તેમનું પરિચિત રૂપ જોવાની વિનંતી કરે છે.","why":"અર્જુને ઈશ્વર વિશે સાંભળ્યું છે; હવે તેમને પ્રત્યક્ષ અનુભવ જોઈએ. આ દર્શન બતાવે છે કે પરિણામો તેમના નિયંત્રણથી પર એક વિશાળ વ્યવસ્થાનો ભાગ છે.","ideas":["સામાન્ય આંખો વિરાટ રૂપ જોઈ શકતી નથી; દિવ્ય દૃષ્ટિ જોઈએ (11.8).","તેનો પ્રકાશ એકસાથે ઊગેલા હજાર સૂર્ય જેવો છે (11.12).","'હું કાળ છું, લોકોનો નાશ કરનાર' (11.32).","ફક્ત નિમિત્ત બનો (11.33).","ફક્ત ભક્તિથી આ દર્શન શક્ય છે (11.54)."],"summary":"સૌથી નાટ્યાત્મક અધ્યાય: વિસ્મય, ભય અને અંતે કોમળતા, જ્યારે કૃષ્ણ પોતાના સૌમ્ય રૂપમાં પાછા આવે છે.","lessons":["કેટલીક વસ્તુઓ આપણા નિયંત્રણથી મોટી છે; તે જડ નહીં, નમ્ર બનાવી શકે.","પોતાને પરિણામોમાં ફાળો આપનાર માનો, એકમાત્ર કારણ નહીં.","જ્યારે વિરાટ ફરી અંગત બને ત્યારે વિસ્મય પ્રેમમાં બદલાઈ શકે."],"qa":[["શું 11.33નો અર્થ છે કે અર્જુનની કોઈ સ્વતંત્ર ઇચ્છા નથી?","ટીકાકારોમાં મતભેદ છે. ઘણા તેને આમ વાંચે છે: પરિણામ મોટી વ્યવસ્થાએ નક્કી કર્યું છે, પણ અર્જુનની ભૂમિકા, દૃષ્ટિકોણ અને જવાબદારી તેમની પોતાની છે."]],"conn":"આ પ્રચંડ દર્શન પછી અધ્યાય 12 વ્યવહારુ પ્રશ્ન પૂછે છે: કઈ ભક્તિ શ્રેષ્ઠ?","quiz":[["વિરાટ રૂપ જોવા કૃષ્ણ અર્જુનને શું આપે છે?",["અરીસો","દિવ્ય ચક્ષુ","રથ","મંત્ર"],1],["11.32માં કૃષ્ણ પોતાને શું કહે છે?",["લોકોનો નાશ કરનાર કાળ","સામાન્ય સારથિ","ઇન્દ્ર","બ્રહ્મા"],0],["11.33માં કૃષ્ણ અર્જુનને શું બનવા કહે છે?",["રાજા","ફક્ત નિમિત્ત","સંન્યાસી","ન્યાયાધીશ"],1]]},"sa":"विश्वरूपदर्शनयोग","iast":"Viśhwarūp Darśhan Yog","count":55,"gs":"વિશ્વરૂપદર્શનયોગ"},{"n":12,"key":["12.2","12.5","12.8","12.13","12.14","12.15","12.18"],"concepts":["bhakti","samatvam"],"en":{"title":"The Yoga of Devotion","intro":"Arjuna asks which is better: worshipping the personal form of the Divine or the formless, imperishable Absolute. Krishna says both reach him, but the formless path is harder for embodied beings. He gives a ladder of practices for those who find each step hard, and ends with a portrait of the devotee dear to him.","why":"After the overwhelming vision, Arjuna needs a path he can actually follow.","ideas":["Those devoted to the personal form with faith are 'most united' (12.2).","The path to the formless is harder for embodied beings (12.5).","A graded path: fix the mind on me; if not, practise; if not, work for me; if not, give up the fruits of action (12.8–12.11).","The dear devotee: without hatred, friendly, compassionate, free of ego (12.13–12.19)."],"summary":"The shortest chapter (20 verses) and one of the most loved: devotion described as character, not ritual.","lessons":["If the ideal feels out of reach, take the next possible step.","Kindness and steadiness are signs of real devotion.","Be someone others are not afraid of, and who is not afraid of others (12.15)."],"qa":[["Does this chapter say the formless path is wrong?","No. 12.3–12.4 says those who worship the imperishable also reach him. It says only that it is harder for most people."]],"conn":"Chapter 13 turns to knowledge: the field (body) and the knower of the field.","quiz":[["Which path does Krishna call harder for embodied beings?",["Worship of the formless","Worship of the personal form","Karma yoga","Charity"],0],["If one cannot do anything else, what does 12.11 suggest?",["Give up the fruits of action","Leave home","Stop working","Pray only at night"],0],["Which quality is NOT in the description of the dear devotee?",["Free from hatred","Compassionate","Proud of his learning","Same in honour and dishonour"],2]]},"hi":{"title":"भक्ति योग","intro":"अर्जुन पूछते हैं कि क्या श्रेष्ठ है: ईश्वर के साकार रूप की उपासना या निराकार, अक्षर ब्रह्म की। कृष्ण कहते हैं दोनों उन्हें प्राप्त होते हैं, पर देहधारियों के लिए निराकार का मार्ग कठिन है। जिन्हें हर क़दम कठिन लगे उनके लिए वे साधनाओं की सीढ़ी देते हैं, और अपने प्रिय भक्त के वर्णन से अध्याय समाप्त करते हैं।","why":"विराट दर्शन के बाद अर्जुन को ऐसा मार्ग चाहिए जिस पर वे सचमुच चल सकें।","ideas":["साकार रूप में श्रद्धा से लगे भक्त 'युक्ततम' हैं (12.2)।","देहधारियों के लिए निराकार का मार्ग कठिन है (12.5)।","क्रमिक मार्ग: मन मुझमें लगाओ; न हो तो अभ्यास करो; न हो तो मेरे लिए कर्म करो; न हो तो कर्मफल का त्याग करो (12.8–12.11)।","प्रिय भक्त: द्वेष रहित, मैत्रीपूर्ण, करुणामय, अहंकार रहित (12.13–12.19)।"],"summary":"सबसे छोटा अध्याय (20 श्लोक) और सबसे प्रिय अध्यायों में से एक: भक्ति को कर्मकांड नहीं, चरित्र के रूप में बताया गया है।","lessons":["अगर आदर्श पहुँच से दूर लगे तो अगला संभव क़दम उठाएँ।","दया और स्थिरता सच्ची भक्ति के लक्षण हैं।","ऐसे बनें जिनसे दूसरे न डरें, और जो दूसरों से न डरें (12.15)।"],"qa":[["क्या यह अध्याय निराकार मार्ग को ग़लत कहता है?","नहीं। 12.3–12.4 कहता है कि अक्षर की उपासना करने वाले भी उन्हें पाते हैं। बस यह अधिकतर लोगों के लिए कठिन है।"]],"conn":"अध्याय 13 ज्ञान की ओर मुड़ता है: क्षेत्र (शरीर) और क्षेत्रज्ञ।","quiz":[["कृष्ण देहधारियों के लिए किस मार्ग को कठिन बताते हैं?",["निराकार की उपासना","साकार की उपासना","कर्मयोग","दान"],0],["अगर कुछ और न हो सके तो 12.11 क्या सुझाता है?",["कर्मफल का त्याग","घर छोड़ना","काम बंद करना","केवल रात में प्रार्थना"],0],["प्रिय भक्त के वर्णन में कौन-सा गुण नहीं है?",["द्वेष रहित","करुणामय","अपनी विद्या का अभिमानी","मान-अपमान में समान"],2]]},"gu":{"title":"ભક્તિ યોગ","intro":"અર્જુન પૂછે છે કે શું શ્રેષ્ઠ: ઈશ્વરના સાકાર રૂપની ઉપાસના કે નિરાકાર, અક્ષર બ્રહ્મની? કૃષ્ણ કહે છે બંને તેમને પામે છે, પણ દેહધારીઓ માટે નિરાકારનો માર્ગ અઘરો છે. જેમને દરેક પગલું અઘરું લાગે તેમના માટે તેઓ સાધનાની સીડી આપે છે, અને પોતાના પ્રિય ભક્તના વર્ણનથી અધ્યાય પૂરો કરે છે.","why":"વિરાટ દર્શન પછી અર્જુનને એવો માર્ગ જોઈએ જેના પર તેઓ ખરેખર ચાલી શકે.","ideas":["સાકાર રૂપમાં શ્રદ્ધાથી જોડાયેલા ભક્તો 'યુક્તતમ' છે (12.2).","દેહધારીઓ માટે નિરાકારનો માર્ગ અઘરો છે (12.5).","ક્રમિક માર્ગ: મન મારામાં લગાવો; ન થાય તો અભ્યાસ કરો; ન થાય તો મારા માટે કર્મ કરો; ન થાય તો કર્મફળનો ત્યાગ કરો (12.8–12.11).","પ્રિય ભક્ત: દ્વેષ વગરનો, મૈત્રીભર્યો, કરુણાવાન, અહંકાર વગરનો (12.13–12.19)."],"summary":"સૌથી નાનો અધ્યાય (20 શ્લોક) અને સૌથી પ્રિય અધ્યાયોમાંનો એક: ભક્તિને કર્મકાંડ નહીં, ચારિત્ર્ય તરીકે વર્ણવી છે.","lessons":["જો આદર્શ પહોંચની બહાર લાગે તો આગળનું શક્ય પગલું ભરો.","દયા અને સ્થિરતા સાચી ભક્તિનાં લક્ષણ છે.","એવા બનો જેનાથી બીજા ન ડરે, અને જે બીજાથી ન ડરે (12.15)."],"qa":[["શું આ અધ્યાય નિરાકાર માર્ગને ખોટો કહે છે?","ના. 12.3–12.4 કહે છે કે અક્ષરની ઉપાસના કરનારા પણ તેમને પામે છે. ફક્ત તે મોટા ભાગના લોકો માટે અઘરો છે."]],"conn":"અધ્યાય 13 જ્ઞાન તરફ વળે છે: ક્ષેત્ર (શરીર) અને ક્ષેત્રજ્ઞ.","quiz":[["કૃષ્ણ દેહધારીઓ માટે કયા માર્ગને અઘરો કહે છે?",["નિરાકારની ઉપાસના","સાકારની ઉપાસના","કર્મયોગ","દાન"],0],["જો બીજું કંઈ ન થઈ શકે તો 12.11 શું સૂચવે છે?",["કર્મફળનો ત્યાગ","ઘર છોડવું","કામ બંધ કરવું","ફક્ત રાત્રે પ્રાર્થના"],0],["પ્રિય ભક્તના વર્ણનમાં કયો ગુણ નથી?",["દ્વેષ વગરનો","કરુણાવાન","પોતાની વિદ્યાનો અભિમાની","માન-અપમાનમાં સમાન"],2]]},"sa":"भक्तियोग","iast":"Bhakti Yog","count":20,"gs":"ભક્તિયોગ"},{"n":13,"key":["13.1","13.2","13.3","13.8","13.20","13.29"],"concepts":["prakriti","purusha","jnana","atman"],"en":{"title":"The Field and the Knower of the Field","intro":"Arjuna asks about prakriti and purusha, the field and its knower. Krishna explains that the body with its senses and mind is the 'field', and the conscious one who knows it is the 'knower of the field'. He lists the qualities that make up true knowledge, and explains how matter and spirit together produce experience.","why":"To act without attachment, one must know the difference between what one has (body, mind) and what one is (the conscious knower).","ideas":["The body is the field; the one who knows it is the knower of the field (13.2).","Krishna is the knower in all fields (13.3).","True knowledge includes humility, non-violence, patience, honesty and self-control (13.8–13.12).","Prakriti produces actions; purusha experiences pleasure and pain (13.21)."],"summary":"A step back from action to look at the observer: you are not just the body or the mind that acts.","lessons":["Watching your thoughts makes room between you and them.","Character is part of knowledge, not separate from it.","Seeing the same Divine everywhere ends harming others (13.29)."],"qa":[["Why does this chapter have 35 verses here but 34 elsewhere?","This edition includes Arjuna's opening question (13.1). Many editions omit it, so their verse numbers in this chapter are one lower."]],"conn":"Chapter 14 explains the three gunas, the forces of prakriti mentioned here.","quiz":[["What does Krishna call the body in 13.2?",["The temple","The field (kshetra)","The prison","The chariot"],1],["Who is the knower of the field in all fields, according to 13.3?",["Arjuna","Krishna","Brahma","The mind"],1],["Which quality appears in the list of true knowledge (13.8)?",["Pride","Non-violence","Wealth","Fame"],1]]},"hi":{"title":"क्षेत्र-क्षेत्रज्ञ विभाग योग","intro":"अर्जुन प्रकृति और पुरुष, क्षेत्र और क्षेत्रज्ञ के बारे में पूछते हैं। कृष्ण समझाते हैं कि इंद्रियों और मन सहित शरीर 'क्षेत्र' है, और जो चेतन इसे जानता है वह 'क्षेत्रज्ञ' है। वे सच्चे ज्ञान के गुण गिनाते हैं, और बताते हैं कि जड़ और चेतन मिलकर अनुभव कैसे बनाते हैं।","why":"आसक्ति रहित कर्म के लिए यह जानना ज़रूरी है कि हमारे पास क्या है (शरीर, मन) और हम क्या हैं (चेतन ज्ञाता)।","ideas":["शरीर क्षेत्र है; जो इसे जानता है वह क्षेत्रज्ञ है (13.2)।","सब क्षेत्रों में क्षेत्रज्ञ कृष्ण हैं (13.3)।","सच्चे ज्ञान में विनम्रता, अहिंसा, क्षमा, सरलता और संयम आते हैं (13.8–13.12)।","प्रकृति कर्म करती है; पुरुष सुख-दुःख का भोक्ता है (13.21)।"],"summary":"कर्म से एक क़दम पीछे हटकर देखने वाले को देखना: आप केवल कर्म करने वाला शरीर या मन नहीं हैं।","lessons":["अपने विचारों को देखने से उनमें और आपमें दूरी बनती है।","चरित्र ज्ञान का हिस्सा है, उससे अलग नहीं।","हर जगह एक ही ईश्वर देखने से दूसरों को हानि पहुँचाना ख़त्म होता है (13.29)।"],"qa":[["यहाँ इस अध्याय में 35 श्लोक और अन्यत्र 34 क्यों?","इस संस्करण में अर्जुन का आरंभिक प्रश्न (13.1) शामिल है। कई संस्करण इसे छोड़ते हैं, इसलिए उनके इस अध्याय के श्लोक-क्रमांक एक कम हैं।"]],"conn":"अध्याय 14 तीन गुणों को समझाता है, जो यहाँ बताई गई प्रकृति की शक्तियाँ हैं।","quiz":[["13.2 में कृष्ण शरीर को क्या कहते हैं?",["मंदिर","क्षेत्र","कारागार","रथ"],1],["13.3 के अनुसार सब क्षेत्रों में क्षेत्रज्ञ कौन है?",["अर्जुन","कृष्ण","ब्रह्मा","मन"],1],["सच्चे ज्ञान की सूची (13.8) में कौन-सा गुण है?",["अभिमान","अहिंसा","धन","कीर्ति"],1]]},"gu":{"title":"ક્ષેત્ર-ક્ષેત્રજ્ઞ વિભાગ યોગ","intro":"અર્જુન પ્રકૃતિ અને પુરુષ, ક્ષેત્ર અને ક્ષેત્રજ્ઞ વિશે પૂછે છે. કૃષ્ણ સમજાવે છે કે ઇન્દ્રિયો અને મન સહિતનું શરીર 'ક્ષેત્ર' છે, અને જે ચેતન તેને જાણે છે તે 'ક્ષેત્રજ્ઞ' છે. તેઓ સાચા જ્ઞાનના ગુણો ગણાવે છે, અને સમજાવે છે કે જડ અને ચેતન મળીને અનુભવ કેવી રીતે બનાવે છે.","why":"આસક્તિ વગરના કર્મ માટે એ જાણવું જરૂરી છે કે આપણી પાસે શું છે (શરીર, મન) અને આપણે શું છીએ (ચેતન જ્ઞાતા).","ideas":["શરીર ક્ષેત્ર છે; જે તેને જાણે છે તે ક્ષેત્રજ્ઞ છે (13.2).","બધાં ક્ષેત્રોમાં ક્ષેત્રજ્ઞ કૃષ્ણ છે (13.3).","સાચા જ્ઞાનમાં નમ્રતા, અહિંસા, ક્ષમા, સરળતા અને સંયમ આવે છે (13.8–13.12).","પ્રકૃતિ કર્મ કરે છે; પુરુષ સુખ-દુઃખનો ભોક્તા છે (13.21)."],"summary":"કર્મથી એક પગલું પાછળ હટીને જોનારને જોવો: તમે ફક્ત કર્મ કરનાર શરીર કે મન નથી.","lessons":["પોતાના વિચારોને જોવાથી તેમની અને તમારી વચ્ચે અંતર બને છે.","ચારિત્ર્ય જ્ઞાનનો ભાગ છે, તેનાથી અલગ નહીં.","દરેક જગ્યાએ એક જ ઈશ્વર જોવાથી બીજાને નુકસાન પહોંચાડવાનું બંધ થાય છે (13.29)."],"qa":[["અહીં આ અધ્યાયમાં 35 શ્લોક અને બીજે 34 કેમ?","આ આવૃત્તિમાં અર્જુનનો પ્રારંભિક પ્રશ્ન (13.1) સામેલ છે. ઘણી આવૃત્તિઓ તેને છોડી દે છે, એટલે તેમના આ અધ્યાયના શ્લોક-ક્રમાંક એક ઓછા છે."]],"conn":"અધ્યાય 14 ત્રણ ગુણો સમજાવે છે, જે અહીં વર્ણવેલી પ્રકૃતિની શક્તિઓ છે.","quiz":[["13.2માં કૃષ્ણ શરીરને શું કહે છે?",["મંદિર","ક્ષેત્ર","કારાગાર","રથ"],1],["13.3 પ્રમાણે બધાં ક્ષેત્રોમાં ક્ષેત્રજ્ઞ કોણ છે?",["અર્જુન","કૃષ્ણ","બ્રહ્મા","મન"],1],["સાચા જ્ઞાનની યાદી (13.8)માં કયો ગુણ છે?",["અભિમાન","અહિંસા","ધન","કીર્તિ"],1]]},"sa":"क्षेत्र-क्षेत्रज्ञविभागयोग","iast":"Kṣhetra Kṣhetrajña Vibhāg Yog","count":35,"gs":"ક્ષેત્ર-ક્ષેત્રજ્ઞવિભાગયોગ"},{"n":14,"key":["14.5","14.6","14.7","14.8","14.19","14.22","14.26"],"concepts":["gunas","sattva","rajas","tamas"],"en":{"title":"The Three Gunas","intro":"Krishna explains the three gunas, the qualities of nature that bind the self to the body: sattva (clarity, goodness), rajas (passion, activity) and tamas (inertia, darkness). Each binds in its own way. Arjuna asks how to recognise someone who has gone beyond them, and Krishna describes that person.","why":"Knowing how nature works inside us helps us see which force is driving us at any moment.","ideas":["Sattva binds by attachment to happiness and knowledge (14.6).","Rajas binds by attachment to action and craving (14.7).","Tamas binds by heedlessness, laziness and sleep (14.8).","One who rises above all three is steady in praise and blame, honour and dishonour (14.22–14.25)."],"summary":"A practical psychology: identify the guna at work, and you understand the behaviour.","lessons":["Restlessness and dullness both have causes you can notice.","Even good qualities can become a trap if you cling to them.","Unwavering devotion takes one beyond the gunas (14.26)."],"qa":[["Is sattva the goal?","Sattva is preferable to rajas and tamas, but Krishna says the goal is to go beyond all three (gunatita)."]],"conn":"Chapter 15 describes the world as an upside-down tree and the Supreme Person beyond the gunas.","quiz":[["Which guna binds through heedlessness and sleep?",["Sattva","Rajas","Tamas","None"],2],["What is rajas associated with?",["Calm and knowledge","Craving and activity","Laziness","Liberation"],1],["What is the goal according to this chapter?",["Increase rajas","Go beyond all three gunas","Stay in tamas","Avoid sattva"],1]]},"hi":{"title":"गुणत्रय-विभाग योग","intro":"कृष्ण तीन गुणों को समझाते हैं, प्रकृति के वे गुण जो आत्मा को शरीर से बाँधते हैं: सत्त्व (स्पष्टता, अच्छाई), रजस (आवेग, क्रियाशीलता) और तमस (जड़ता, अंधकार)। हर गुण अपने ढंग से बाँधता है। अर्जुन पूछते हैं कि जो इनसे परे चला गया उसे कैसे पहचानें, और कृष्ण उसका वर्णन करते हैं।","why":"हमारे भीतर प्रकृति कैसे काम करती है, यह जानकर हम देख पाते हैं कि किस क्षण कौन-सी शक्ति हमें चला रही है।","ideas":["सत्त्व सुख और ज्ञान की आसक्ति से बाँधता है (14.6)।","रजस कर्म और तृष्णा की आसक्ति से बाँधता है (14.7)।","तमस प्रमाद, आलस्य और निद्रा से बाँधता है (14.8)।","जो तीनों से ऊपर उठ जाता है, वह निंदा-स्तुति, मान-अपमान में स्थिर रहता है (14.22–14.25)।"],"summary":"व्यावहारिक मनोविज्ञान: काम कर रहे गुण को पहचानें, तो व्यवहार समझ में आता है।","lessons":["बेचैनी और सुस्ती दोनों के कारण हैं जिन्हें आप देख सकते हैं।","अच्छे गुण भी जाल बन सकते हैं अगर आप उनसे चिपक जाएँ।","अटल भक्ति गुणों से परे ले जाती है (14.26)।"],"qa":[["क्या सत्त्व ही लक्ष्य है?","सत्त्व रजस और तमस से बेहतर है, पर कृष्ण कहते हैं कि लक्ष्य तीनों से परे जाना है (गुणातीत)।"]],"conn":"अध्याय 15 संसार को उलटे वृक्ष के रूप में और गुणों से परे पुरुषोत्तम का वर्णन करता है।","quiz":[["कौन-सा गुण प्रमाद और निद्रा से बाँधता है?",["सत्त्व","रजस","तमस","कोई नहीं"],2],["रजस किससे जुड़ा है?",["शांति और ज्ञान","तृष्णा और क्रियाशीलता","आलस्य","मोक्ष"],1],["इस अध्याय के अनुसार लक्ष्य क्या है?",["रजस बढ़ाना","तीनों गुणों से परे जाना","तमस में रहना","सत्त्व से बचना"],1]]},"gu":{"title":"ગુણત્રય-વિભાગ યોગ","intro":"કૃષ્ણ ત્રણ ગુણ સમજાવે છે, પ્રકૃતિના એ ગુણ જે આત્માને શરીર સાથે બાંધે છે: સત્ત્વ (સ્પષ્ટતા, ભલાઈ), રજસ (આવેગ, પ્રવૃત્તિ) અને તમસ (જડતા, અંધકાર). દરેક ગુણ પોતાની રીતે બાંધે છે. અર્જુન પૂછે છે કે જે તેમનાથી પર ગયો હોય તેને કેવી રીતે ઓળખવો, અને કૃષ્ણ તેનું વર્ણન કરે છે.","why":"આપણી અંદર પ્રકૃતિ કેવી રીતે કામ કરે છે તે જાણીને આપણે જોઈ શકીએ કે કઈ ક્ષણે કઈ શક્તિ આપણને ચલાવે છે.","ideas":["સત્ત્વ સુખ અને જ્ઞાનની આસક્તિથી બાંધે છે (14.6).","રજસ કર્મ અને તૃષ્ણાની આસક્તિથી બાંધે છે (14.7).","તમસ પ્રમાદ, આળસ અને નિદ્રાથી બાંધે છે (14.8).","જે ત્રણેયથી ઉપર ઊઠે છે, તે નિંદા-સ્તુતિ, માન-અપમાનમાં સ્થિર રહે છે (14.22–14.25)."],"summary":"વ્યવહારુ મનોવિજ્ઞાન: કામ કરતા ગુણને ઓળખો, તો વર્તન સમજાય છે.","lessons":["બેચેની અને સુસ્તી બંનેનાં કારણો છે જે તમે જોઈ શકો.","સારા ગુણ પણ જાળ બની શકે જો તમે તેમને વળગી રહો.","અડગ ભક્તિ ગુણોથી પર લઈ જાય છે (14.26)."],"qa":[["શું સત્ત્વ જ લક્ષ્ય છે?","સત્ત્વ રજસ અને તમસ કરતાં સારું છે, પણ કૃષ્ણ કહે છે કે લક્ષ્ય ત્રણેયથી પર જવાનું છે (ગુણાતીત)."]],"conn":"અધ્યાય 15 જગતને ઊંધા વૃક્ષ તરીકે અને ગુણોથી પર પુરુષોત્તમનું વર્ણન કરે છે.","quiz":[["કયો ગુણ પ્રમાદ અને નિદ્રાથી બાંધે છે?",["સત્ત્વ","રજસ","તમસ","એકેય નહીં"],2],["રજસ શાની સાથે જોડાયેલો છે?",["શાંતિ અને જ્ઞાન","તૃષ્ણા અને પ્રવૃત્તિ","આળસ","મોક્ષ"],1],["આ અધ્યાય પ્રમાણે લક્ષ્ય શું છે?",["રજસ વધારવો","ત્રણેય ગુણોથી પર જવું","તમસમાં રહેવું","સત્ત્વથી દૂર રહેવું"],1]]},"sa":"गुणत्रयविभागयोग","iast":"Guṇa Traya Vibhāg Yog","count":27,"gs":"ગુણત્રયવિભાગયોગ"},{"n":15,"key":["15.1","15.3","15.7","15.15","15.16","15.18"],"concepts":["purusha","brahman","atman"],"en":{"title":"The Supreme Being","intro":"Krishna describes the world as an ashvattha tree with roots above and branches below, to be cut with the axe of detachment. The individual self is an eternal fragment of him. He describes three 'persons': the perishable, the imperishable, and the Supreme Person (Purushottama) beyond both.","why":"After explaining the gunas, Krishna shows what lies beyond the changing world and how to reach it.","ideas":["The world is like an upside-down tree, rooted in the Supreme (15.1).","Cut it with the strong axe of non-attachment (15.3).","The living self is an eternal part of the Divine (15.7).","The Purushottama is beyond the perishable and the imperishable (15.16–15.18)."],"summary":"A short, dense chapter traditionally recited before meals in many homes; a summary of Vedanta in 20 verses.","lessons":["Attachments grow like roots; noticing them is the first cut.","You share in something lasting, not only what decays.","Knowledge, memory and forgetfulness all come from one source (15.15)."],"qa":[["Why is the tree 'upside down'?","Its root is the Supreme, which is 'above'; its branches spread down into the world. It is an image also found in the Katha Upanishad (2.3.1)."]],"conn":"Chapter 16 contrasts divine and demonic qualities that lead toward or away from this Supreme.","quiz":[["What image does 15.1 use for the world?",["An upside-down ashvattha tree","A river","A wheel","A city"],0],["What is used to cut the tree in 15.3?",["Fire","The axe of non-attachment","Prayer","Wealth"],1],["What is the Purushottama?",["A warrior","The Supreme Person beyond perishable and imperishable","A sage","A heavenly city"],1]]},"hi":{"title":"पुरुषोत्तम योग","intro":"कृष्ण संसार को एक अश्वत्थ वृक्ष बताते हैं जिसकी जड़ें ऊपर और शाखाएँ नीचे हैं, जिसे वैराग्य की कुल्हाड़ी से काटना है। जीवात्मा उनका ही सनातन अंश है। वे तीन 'पुरुषों' का वर्णन करते हैं: क्षर, अक्षर, और दोनों से परे पुरुषोत्तम।","why":"गुणों को समझाने के बाद कृष्ण दिखाते हैं कि बदलते संसार से परे क्या है और वहाँ कैसे पहुँचें।","ideas":["संसार उलटे वृक्ष की तरह है, जिसकी जड़ परमात्मा में है (15.1)।","इसे असंग की दृढ़ कुल्हाड़ी से काटो (15.3)।","जीवात्मा ईश्वर का सनातन अंश है (15.7)।","पुरुषोत्तम क्षर और अक्षर दोनों से परे है (15.16–15.18)।"],"summary":"एक छोटा, गहन अध्याय जिसे कई घरों में भोजन से पहले पढ़ा जाता है; 20 श्लोकों में वेदांत का सार।","lessons":["आसक्तियाँ जड़ों की तरह बढ़ती हैं; उन्हें पहचानना पहला वार है।","आप किसी स्थायी के भागीदार हैं, केवल नष्ट होने वाले के नहीं।","ज्ञान, स्मृति और विस्मृति सब एक ही स्रोत से आते हैं (15.15)।"],"qa":[["वृक्ष 'उलटा' क्यों है?","इसकी जड़ परमात्मा है, जो 'ऊपर' है; इसकी शाखाएँ नीचे संसार में फैलती हैं। यह उपमा कठोपनिषद (2.3.1) में भी मिलती है।"]],"conn":"अध्याय 16 दैवी और आसुरी गुणों की तुलना करता है जो इस परमात्मा की ओर या उससे दूर ले जाते हैं।","quiz":[["15.1 संसार के लिए कौन-सी उपमा देता है?",["उलटा अश्वत्थ वृक्ष","नदी","पहिया","नगर"],0],["15.3 में वृक्ष को किससे काटा जाता है?",["अग्नि","असंग की कुल्हाड़ी","प्रार्थना","धन"],1],["पुरुषोत्तम क्या है?",["एक योद्धा","क्षर और अक्षर से परे परम पुरुष","एक ऋषि","स्वर्ग का नगर"],1]]},"gu":{"title":"પુરુષોત્તમ યોગ","intro":"કૃષ્ણ જગતને એક અશ્વત્થ વૃક્ષ તરીકે વર્ણવે છે જેનાં મૂળ ઉપર અને ડાળીઓ નીચે છે, જેને વૈરાગ્યની કુહાડીથી કાપવાનું છે. જીવાત્મા તેમનો જ સનાતન અંશ છે. તેઓ ત્રણ 'પુરુષો'નું વર્ણન કરે છે: ક્ષર, અક્ષર, અને બંનેથી પર પુરુષોત્તમ.","why":"ગુણો સમજાવ્યા પછી કૃષ્ણ બતાવે છે કે બદલાતા જગતથી પર શું છે અને ત્યાં કેવી રીતે પહોંચવું.","ideas":["જગત ઊંધા વૃક્ષ જેવું છે, જેનું મૂળ પરમાત્મામાં છે (15.1).","તેને અસંગની દૃઢ કુહાડીથી કાપો (15.3).","જીવાત્મા ઈશ્વરનો સનાતન અંશ છે (15.7).","પુરુષોત્તમ ક્ષર અને અક્ષર બંનેથી પર છે (15.16–15.18)."],"summary":"એક નાનો, ઊંડો અધ્યાય જે ઘણાં ઘરોમાં ભોજન પહેલાં બોલાય છે; 20 શ્લોકમાં વેદાંતનો સાર.","lessons":["આસક્તિઓ મૂળની જેમ ફેલાય છે; તેમને ઓળખવી એ પહેલો ઘા છે.","તમે કંઈક સ્થાયીના ભાગીદાર છો, ફક્ત નાશ પામનારના નહીં.","જ્ઞાન, સ્મૃતિ અને વિસ્મૃતિ બધું એક જ સ્રોતમાંથી આવે છે (15.15)."],"qa":[["વૃક્ષ 'ઊંધું' કેમ છે?","તેનું મૂળ પરમાત્મા છે, જે 'ઉપર' છે; તેની ડાળીઓ નીચે જગતમાં ફેલાય છે. આ ઉપમા કઠ ઉપનિષદ (2.3.1)માં પણ મળે છે."]],"conn":"અધ્યાય 16 દૈવી અને આસુરી ગુણોની તુલના કરે છે જે આ પરમાત્મા તરફ કે તેનાથી દૂર લઈ જાય છે.","quiz":[["15.1 જગત માટે કઈ ઉપમા આપે છે?",["ઊંધું અશ્વત્થ વૃક્ષ","નદી","પૈડું","નગર"],0],["15.3માં વૃક્ષને શાનાથી કાપવામાં આવે છે?",["અગ્નિ","અસંગની કુહાડી","પ્રાર્થના","ધન"],1],["પુરુષોત્તમ શું છે?",["એક યોદ્ધો","ક્ષર અને અક્ષરથી પર પરમ પુરુષ","એક ઋષિ","સ્વર્ગનું નગર"],1]]},"sa":"पुरुषोत्तमयोग","iast":"Puruṣhottam Yog","count":20,"gs":"પુરુષોત્તમયોગ"},{"n":16,"key":["16.1","16.2","16.3","16.4","16.21","16.24"],"concepts":["dharma"],"en":{"title":"Divine and Demonic Qualities","intro":"Krishna lists two sets of qualities. Divine qualities include fearlessness, purity, charity, self-control, non-violence, truth, compassion and humility. Demonic qualities include hypocrisy, arrogance, anger, harshness and ignorance. He describes the demonic mindset in detail and names three gates to self-destruction: desire, anger and greed.","why":"After the metaphysics of Chapter 15, Krishna returns to conduct: character decides the direction of a life.","ideas":["26 divine qualities, beginning with fearlessness (16.1–16.3).","Demonic qualities: hypocrisy, arrogance, pride, anger, harshness, ignorance (16.4).","Divine qualities lead to freedom; demonic ones to bondage (16.5).","Desire, anger and greed are three gates to hell (16.21)."],"summary":"A mirror for self-examination, not a list for labelling other people.","lessons":["Check yourself against both lists honestly.","Most harm starts with desire, anger or greed; watch for all three.","When unsure what to do, consult sound guidance rather than impulse (16.24)."],"qa":[["Are some people born 'demonic'?","16.5–16.6 speaks of beings born with divine or demonic endowments. Many commentators read this as tendencies that can change, since the Gita elsewhere urges self-improvement (6.5)."]],"conn":"Chapter 17 asks Arjuna's follow-up: what about people who act with faith but outside scriptural rules?","quiz":[["Which quality heads the list of divine qualities in 16.1?",["Wealth","Fearlessness","Fame","Strength"],1],["What are the three gates to hell in 16.21?",["Fear, doubt, sleep","Desire, anger, greed","Pride, wealth, fame","Hunger, thirst, cold"],1],["What should guide action when unsure, according to 16.24?",["Impulse","Scripture (sound guidance)","Majority opinion","Fortune"],1]]},"hi":{"title":"दैवासुर-संपद्-विभाग योग","intro":"कृष्ण गुणों के दो समूह बताते हैं। दैवी गुणों में अभय, शुद्धता, दान, संयम, अहिंसा, सत्य, दया और विनम्रता हैं। आसुरी गुणों में पाखंड, घमंड, क्रोध, कठोरता और अज्ञान हैं। वे आसुरी मानसिकता का विस्तार से वर्णन करते हैं और आत्मनाश के तीन द्वार बताते हैं: काम, क्रोध और लोभ।","why":"अध्याय 15 के तत्त्वज्ञान के बाद कृष्ण आचरण पर लौटते हैं: चरित्र ही जीवन की दिशा तय करता है।","ideas":["अभय से शुरू होने वाले 26 दैवी गुण (16.1–16.3)।","आसुरी गुण: दंभ, दर्प, अभिमान, क्रोध, कठोरता, अज्ञान (16.4)।","दैवी गुण मुक्ति की ओर, आसुरी बंधन की ओर ले जाते हैं (16.5)।","काम, क्रोध और लोभ नरक के तीन द्वार हैं (16.21)।"],"summary":"आत्म-परीक्षण के लिए दर्पण, दूसरों पर ठप्पा लगाने की सूची नहीं।","lessons":["दोनों सूचियों से ख़ुद को ईमानदारी से परखें।","अधिकतर हानि काम, क्रोध या लोभ से शुरू होती है; तीनों पर नज़र रखें।","जब संशय हो तो आवेग के बजाय सही मार्गदर्शन लें (16.24)।"],"qa":[["क्या कुछ लोग 'आसुरी' पैदा होते हैं?","16.5–16.6 दैवी या आसुरी संपदा के साथ जन्मे प्राणियों की बात करता है। कई टीकाकार इसे बदल सकने वाली प्रवृत्तियाँ मानते हैं, क्योंकि गीता अन्यत्र आत्म-उद्धार की प्रेरणा देती है (6.5)।"]],"conn":"अध्याय 17 अर्जुन का अगला प्रश्न लेता है: जो लोग श्रद्धा से, पर शास्त्र विधि के बाहर कर्म करते हैं, उनका क्या?","quiz":[["16.1 में दैवी गुणों की सूची किस गुण से शुरू होती है?",["धन","अभय","कीर्ति","बल"],1],["16.21 में नरक के तीन द्वार क्या हैं?",["भय, संशय, निद्रा","काम, क्रोध, लोभ","अभिमान, धन, कीर्ति","भूख, प्यास, ठंड"],1],["16.24 के अनुसार संशय में कर्म का मार्गदर्शन क्या करे?",["आवेग","शास्त्र (सही मार्गदर्शन)","बहुमत","भाग्य"],1]]},"gu":{"title":"દૈવાસુર-સંપદ્-વિભાગ યોગ","intro":"કૃષ્ણ ગુણોના બે સમૂહ ગણાવે છે. દૈવી ગુણોમાં અભય, શુદ્ધતા, દાન, સંયમ, અહિંસા, સત્ય, દયા અને નમ્રતા છે. આસુરી ગુણોમાં દંભ, ઘમંડ, ક્રોધ, કઠોરતા અને અજ્ઞાન છે. તેઓ આસુરી માનસિકતાનું વિગતે વર્ણન કરે છે અને આત્મનાશનાં ત્રણ દ્વાર ગણાવે છે: કામ, ક્રોધ અને લોભ.","why":"અધ્યાય 15ના તત્ત્વજ્ઞાન પછી કૃષ્ણ આચરણ પર પાછા આવે છે: ચારિત્ર્ય જ જીવનની દિશા નક્કી કરે છે.","ideas":["અભયથી શરૂ થતા 26 દૈવી ગુણો (16.1–16.3).","આસુરી ગુણો: દંભ, દર્પ, અભિમાન, ક્રોધ, કઠોરતા, અજ્ઞાન (16.4).","દૈવી ગુણો મુક્તિ તરફ, આસુરી બંધન તરફ લઈ જાય છે (16.5).","કામ, ક્રોધ અને લોભ નરકનાં ત્રણ દ્વાર છે (16.21)."],"summary":"આત્મ-પરીક્ષણ માટેનો અરીસો, બીજા પર લેબલ લગાવવાની યાદી નહીં.","lessons":["બંને યાદીઓથી પોતાને પ્રામાણિકપણે તપાસો.","મોટા ભાગનું નુકસાન કામ, ક્રોધ કે લોભથી શરૂ થાય છે; ત્રણેય પર નજર રાખો.","જ્યારે શંકા હોય ત્યારે આવેગને બદલે યોગ્ય માર્ગદર્શન લો (16.24)."],"qa":[["શું કેટલાક લોકો 'આસુરી' જન્મે છે?","16.5–16.6 દૈવી કે આસુરી સંપદા સાથે જન્મેલા જીવોની વાત કરે છે. ઘણા ટીકાકારો તેને બદલી શકાય તેવી વૃત્તિઓ માને છે, કારણ કે ગીતા બીજે આત્મ-ઉદ્ધારની પ્રેરણા આપે છે (6.5)."]],"conn":"અધ્યાય 17 અર્જુનનો આગળનો પ્રશ્ન લે છે: જે લોકો શ્રદ્ધાથી, પણ શાસ્ત્રવિધિની બહાર કર્મ કરે છે, તેમનું શું?","quiz":[["16.1માં દૈવી ગુણોની યાદી કયા ગુણથી શરૂ થાય છે?",["ધન","અભય","કીર્તિ","બળ"],1],["16.21માં નરકનાં ત્રણ દ્વાર કયાં છે?",["ભય, શંકા, નિદ્રા","કામ, ક્રોધ, લોભ","અભિમાન, ધન, કીર્તિ","ભૂખ, તરસ, ઠંડી"],1],["16.24 પ્રમાણે શંકામાં કર્મનું માર્ગદર્શન કોણ કરે?",["આવેગ","શાસ્ત્ર (યોગ્ય માર્ગદર્શન)","બહુમતી","ભાગ્ય"],1]]},"sa":"दैवासुरसम्पद्विभागयोग","iast":"Daivāsura Sampad Vibhāg Yog","count":24,"gs":"દૈવાસુરસમ્પદ્વિભાગયોગ"},{"n":17,"key":["17.3","17.8","17.9","17.10","17.14","17.15","17.16","17.20"],"concepts":["shraddha","gunas","yajna"],"en":{"title":"The Three Kinds of Faith","intro":"Arjuna asks about people who act with faith but ignore scriptural rules. Krishna says faith takes the shape of one's nature, and shows how food, sacrifice, austerity and charity each come in sattvic, rajasic and tamasic forms. He ends by explaining the words 'Om Tat Sat'.","why":"The gunas from Chapter 14 are now applied to everyday choices: what we eat, how we worship, how we give.","ideas":["A person is made of their faith; as their faith is, so are they (17.3).","Food classified by guna (17.8–17.10).","Austerity of body, speech and mind (17.14–17.16).","Charity given at the right time, place and to a worthy person, expecting nothing back, is sattvic (17.20)."],"summary":"Faith is not only belief; it shows in every choice. The quality of a practice depends on the motive behind it.","lessons":["Look at your daily choices to see what you really value.","Speak truthfully, kindly and helpfully (17.15).","Give without expecting a return."],"qa":[["Does this chapter ban meat or alcohol?","No verse names meat or alcohol. 17.10 calls stale, putrid, leftover and 'impure' (amedhyam) food tamasic; many commentators include meat and intoxicants under that, but it is an interpretation."]],"conn":"Chapter 18 gathers all the threads into a final summary.","quiz":[["According to 17.3, a person is made of their:",["Wealth","Faith","Caste","Food"],1],["What is the austerity of speech described in 17.15?",["Silence only","Speech that is truthful, pleasant, beneficial and does not upset others","Chanting loudly","Debating"],1],["Which kind of charity expects nothing in return?",["Sattvic","Rajasic","Tamasic","None"],0]]},"hi":{"title":"श्रद्धात्रय-विभाग योग","intro":"अर्जुन उन लोगों के बारे में पूछते हैं जो श्रद्धा से कर्म करते हैं पर शास्त्र विधि को छोड़ देते हैं। कृष्ण कहते हैं कि श्रद्धा व्यक्ति के स्वभाव के अनुसार होती है, और दिखाते हैं कि आहार, यज्ञ, तप और दान — हर एक सात्त्विक, राजसिक और तामसिक होता है। अंत में वे 'ॐ तत् सत्' का अर्थ समझाते हैं।","why":"अध्याय 14 के गुण अब रोज़ के चुनावों पर लागू होते हैं: हम क्या खाते हैं, कैसे पूजा करते हैं, कैसे देते हैं।","ideas":["मनुष्य श्रद्धामय है; जैसी उसकी श्रद्धा, वैसा ही वह (17.3)।","गुणों के अनुसार आहार (17.8–17.10)।","शरीर, वाणी और मन का तप (17.14–17.16)।","सही समय, स्थान और सुपात्र को, बदले में कुछ चाहे बिना दिया दान सात्त्विक है (17.20)।"],"summary":"श्रद्धा केवल विश्वास नहीं; वह हर चुनाव में दिखती है। किसी साधना का स्तर उसके पीछे के उद्देश्य पर निर्भर है।","lessons":["अपने रोज़ के चुनाव देखें, तो पता चलेगा कि आप सच में किसे महत्त्व देते हैं।","सच, प्रिय और हितकर बोलें (17.15)।","बदले की आशा के बिना दें।"],"qa":[["क्या यह अध्याय मांस या मदिरा पर रोक लगाता है?","किसी श्लोक में मांस या मदिरा का नाम नहीं है। 17.10 बासी, सड़े, जूठे और 'अमेध्य' भोजन को तामसिक कहता है; कई टीकाकार मांस और मादक पदार्थों को इसमें शामिल करते हैं, पर यह व्याख्या है।"]],"conn":"अध्याय 18 सभी सूत्रों को अंतिम सारांश में समेटता है।","quiz":[["17.3 के अनुसार मनुष्य किससे बना है?",["धन","श्रद्धा","जाति","भोजन"],1],["17.15 में वाणी का तप क्या है?",["केवल मौन","सत्य, प्रिय, हितकर और उद्वेग न करने वाली वाणी","ज़ोर से जाप","वाद-विवाद"],1],["कौन-सा दान बदले में कुछ नहीं चाहता?",["सात्त्विक","राजसिक","तामसिक","कोई नहीं"],0]]},"gu":{"title":"શ્રદ્ધાત્રય-વિભાગ યોગ","intro":"અર્જુન એવા લોકો વિશે પૂછે છે જે શ્રદ્ધાથી કર્મ કરે છે પણ શાસ્ત્રવિધિ છોડી દે છે. કૃષ્ણ કહે છે કે શ્રદ્ધા વ્યક્તિના સ્વભાવ પ્રમાણે હોય છે, અને બતાવે છે કે આહાર, યજ્ઞ, તપ અને દાન — દરેક સાત્ત્વિક, રાજસિક અને તામસિક હોય છે. અંતે તેઓ 'ૐ તત્ સત્'નો અર્થ સમજાવે છે.","why":"અધ્યાય 14ના ગુણો હવે રોજિંદી પસંદગીઓ પર લાગુ પડે છે: આપણે શું ખાઈએ છીએ, કેવી રીતે પૂજા કરીએ છીએ, કેવી રીતે આપીએ છીએ.","ideas":["માણસ શ્રદ્ધામય છે; જેવી તેની શ્રદ્ધા, તેવો તે (17.3).","ગુણો પ્રમાણે આહાર (17.8–17.10).","શરીર, વાણી અને મનનું તપ (17.14–17.16).","યોગ્ય સમય, સ્થળ અને સુપાત્રને, બદલામાં કંઈ ઇચ્છ્યા વગર આપેલું દાન સાત્ત્વિક છે (17.20)."],"summary":"શ્રદ્ધા ફક્ત માન્યતા નથી; તે દરેક પસંદગીમાં દેખાય છે. કોઈ સાધનાની ગુણવત્તા તેની પાછળના હેતુ પર આધાર રાખે છે.","lessons":["તમારી રોજની પસંદગીઓ જુઓ, તો ખબર પડશે કે તમે ખરેખર શાને મહત્ત્વ આપો છો.","સાચું, પ્રિય અને હિતકારી બોલો (17.15).","બદલાની આશા વગર આપો."],"qa":[["શું આ અધ્યાય માંસ કે દારૂ પર પ્રતિબંધ મૂકે છે?","કોઈ શ્લોકમાં માંસ કે દારૂનું નામ નથી. 17.10 વાસી, સડેલું, એંઠું અને 'અમેધ્ય' ભોજન તામસિક કહે છે; ઘણા ટીકાકારો માંસ અને માદક પદાર્થોને તેમાં ગણે છે, પણ તે અર્થઘટન છે."]],"conn":"અધ્યાય 18 બધા દોરા અંતિમ સારાંશમાં સમેટે છે.","quiz":[["17.3 પ્રમાણે માણસ શાનો બનેલો છે?",["ધન","શ્રદ્ધા","જાતિ","ભોજન"],1],["17.15માં વાણીનું તપ શું છે?",["ફક્ત મૌન","સાચી, પ્રિય, હિતકારી અને ઉદ્વેગ ન કરનારી વાણી","મોટેથી જાપ","વાદ-વિવાદ"],1],["કયું દાન બદલામાં કંઈ ઇચ્છતું નથી?",["સાત્ત્વિક","રાજસિક","તામસિક","એકેય નહીં"],0]]},"sa":"श्रद्धात्रयविभागयोग","iast":"Śhraddhā Traya Vibhāg Yog","count":28,"gs":"શ્રદ્ધાત્રયવિભાગયોગ"},{"n":18,"key":["18.2","18.25","18.47","18.63","18.65","18.66","18.73","18.78"],"concepts":["sannyasa","moksha","dharma","gunas"],"en":{"title":"Liberation through Renunciation","intro":"Arjuna asks the difference between sannyasa (renunciation) and tyaga (relinquishment). Krishna says true relinquishment is giving up attachment to results, not giving up action. He applies the three gunas to knowledge, action, doer, intellect, resolve and happiness, sums up the whole teaching, and gives his final, most confidential instruction. Arjuna declares his confusion gone. Sanjaya closes the dialogue.","why":"The final chapter gathers the threads: action, knowledge, devotion and the gunas. It also returns the decision to Arjuna.","ideas":["Sannyasa is giving up desire-driven actions; tyaga is giving up the fruits of all actions (18.2).","Action begun in delusion, without regard for harm to others, is tamasic (18.25).","Better one's own duty, even imperfect, than another's (18.47).","'Reflect fully, then do as you wish' (18.63).","'Abandon all dharmas and take refuge in me alone' (18.66)."],"summary":"The longest chapter (78 verses). It ends with Arjuna saying his delusion is destroyed and he will act on Krishna's word (18.73).","lessons":["Real renunciation is internal: keep acting, drop the clinging.","Check every major action for the harm it may cause others.","Good guidance leaves room for your own judgement."],"qa":[["What does 18.66 'abandon all dharmas' mean?","One of the most debated verses. Advaita reads it as giving up the sense of being the doer and resting in knowledge. Vishishtadvaita and Dvaita read it as complete surrender to God. Some read it as giving up anxiety about whether one has fulfilled every duty perfectly."]],"conn":"It returns to Chapter 1: the man who dropped his bow now picks it up, by his own understanding.","quiz":[["What does Arjuna say in 18.73?",["I will leave","My delusion is destroyed; I will do as you say","I need more time","Show me your form again"],1],["What does Krishna say in 18.63?",["Obey me without question","Reflect fully, then do as you wish","Never question scripture","Give up action"],1],["Who speaks the last verse of the Gita (18.78)?",["Krishna","Arjuna","Sanjaya","Vyasa"],2]]},"hi":{"title":"मोक्ष-संन्यास योग","intro":"अर्जुन संन्यास और त्याग में अंतर पूछते हैं। कृष्ण कहते हैं कि सच्चा त्याग फल की आसक्ति छोड़ना है, कर्म छोड़ना नहीं। वे ज्ञान, कर्म, कर्ता, बुद्धि, धृति और सुख पर तीन गुणों को लागू करते हैं, पूरे उपदेश का सार बताते हैं, और अपना अंतिम, सबसे गोपनीय उपदेश देते हैं। अर्जुन कहते हैं कि उनका मोह नष्ट हो गया। संजय संवाद समाप्त करते हैं।","why":"अंतिम अध्याय सभी सूत्रों को समेटता है: कर्म, ज्ञान, भक्ति और गुण। यह निर्णय फिर अर्जुन को लौटाता है।","ideas":["संन्यास है कामना वाले कर्मों का त्याग; त्याग है सभी कर्मों के फल का त्याग (18.2)।","मोह से शुरू किया गया, दूसरों की हिंसा का विचार किए बिना किया कर्म तामसिक है (18.25)।","दूसरे के धर्म से अपना धर्म, कमी वाला भी, बेहतर है (18.47)।","'पूरा विचार करो, फिर जैसा चाहो करो' (18.63)।","'सब धर्मों को छोड़कर केवल मेरी शरण में आ जाओ' (18.66)।"],"summary":"सबसे लंबा अध्याय (78 श्लोक)। यह अर्जुन के इस कथन से समाप्त होता है कि उनका मोह नष्ट हो गया और वे कृष्ण के वचन पर चलेंगे (18.73)।","lessons":["सच्चा संन्यास भीतरी है: कर्म करते रहें, चिपकना छोड़ें।","हर बड़े कर्म को इस दृष्टि से जाँचें कि वह दूसरों को कैसी हानि पहुँचा सकता है।","अच्छा मार्गदर्शन आपके अपने विवेक के लिए जगह छोड़ता है।"],"qa":[["18.66 के 'सब धर्मों को छोड़ो' का क्या अर्थ है?","सबसे अधिक बहस वाले श्लोकों में से एक। अद्वैत इसे कर्तापन का भाव छोड़कर ज्ञान में स्थित होना मानता है। विशिष्टाद्वैत और द्वैत इसे ईश्वर के प्रति पूर्ण शरणागति मानते हैं। कुछ इसे इस चिंता को छोड़ना मानते हैं कि हर कर्तव्य पूरी तरह निभाया या नहीं।"]],"conn":"यह अध्याय 1 पर लौटता है: जिसने धनुष रख दिया था, वह अपनी समझ से उसे फिर उठाता है।","quiz":[["18.73 में अर्जुन क्या कहते हैं?",["मैं चला जाऊँगा","मेरा मोह नष्ट हो गया; मैं आपका कहा करूँगा","मुझे और समय चाहिए","फिर से अपना रूप दिखाइए"],1],["18.63 में कृष्ण क्या कहते हैं?",["बिना प्रश्न के मानो","पूरा विचार करो, फिर जैसा चाहो करो","शास्त्र पर कभी प्रश्न मत करो","कर्म छोड़ दो"],1],["गीता का अंतिम श्लोक (18.78) कौन बोलता है?",["कृष्ण","अर्जुन","संजय","व्यास"],2]]},"gu":{"title":"મોક્ષ-સંન્યાસ યોગ","intro":"અર્જુન સંન્યાસ અને ત્યાગ વચ્ચેનો તફાવત પૂછે છે. કૃષ્ણ કહે છે કે સાચો ત્યાગ ફળની આસક્તિ છોડવી છે, કર્મ છોડવું નહીં. તેઓ જ્ઞાન, કર્મ, કર્તા, બુદ્ધિ, ધૃતિ અને સુખ પર ત્રણ ગુણો લાગુ કરે છે, આખા ઉપદેશનો સાર કહે છે, અને પોતાનો અંતિમ, સૌથી ગોપનીય ઉપદેશ આપે છે. અર્જુન કહે છે કે તેમનો મોહ નાશ પામ્યો. સંજય સંવાદ પૂરો કરે છે.","why":"અંતિમ અધ્યાય બધા દોરા સમેટે છે: કર્મ, જ્ઞાન, ભક્તિ અને ગુણો. તે નિર્ણય ફરી અર્જુનને સોંપે છે.","ideas":["સંન્યાસ એટલે કામનાવાળાં કર્મોનો ત્યાગ; ત્યાગ એટલે બધાં કર્મોના ફળનો ત્યાગ (18.2).","મોહથી શરૂ કરેલું, બીજાને થતી હિંસાનો વિચાર કર્યા વગરનું કર્મ તામસિક છે (18.25).","બીજાના ધર્મ કરતાં પોતાનો ધર્મ, ખામીવાળો પણ, સારો (18.47).","'પૂરો વિચાર કરો, પછી જેમ ઇચ્છો તેમ કરો' (18.63).","'બધા ધર્મો છોડીને ફક્ત મારા શરણે આવો' (18.66)."],"summary":"સૌથી લાંબો અધ્યાય (78 શ્લોક). તે અર્જુનના એ કથનથી પૂરો થાય છે કે તેમનો મોહ નાશ પામ્યો અને તેઓ કૃષ્ણના વચન પ્રમાણે ચાલશે (18.73).","lessons":["સાચો સંન્યાસ અંદરનો છે: કર્મ કરતા રહો, વળગણ છોડો.","દરેક મોટા કર્મને એ દૃષ્ટિએ તપાસો કે તે બીજાને કેવું નુકસાન કરી શકે.","સારું માર્ગદર્શન તમારા પોતાના વિવેક માટે જગ્યા છોડે છે."],"qa":[["18.66ના 'બધા ધર્મો છોડો'નો શો અર્થ છે?","સૌથી વધુ ચર્ચાતા શ્લોકોમાંનો એક. અદ્વૈત તેને કર્તાપણાનો ભાવ છોડીને જ્ઞાનમાં સ્થિર થવું માને છે. વિશિષ્ટાદ્વૈત અને દ્વૈત તેને ઈશ્વર પ્રત્યે પૂર્ણ શરણાગતિ માને છે. કેટલાક તેને એ ચિંતા છોડવી માને છે કે દરેક ફરજ પૂરેપૂરી નિભાવી કે નહીં."]],"conn":"તે અધ્યાય 1 પર પાછો ફરે છે: જેણે ધનુષ્ય મૂકી દીધું હતું, તે પોતાની સમજથી તેને ફરી ઉપાડે છે.","quiz":[["18.73માં અર્જુન શું કહે છે?",["હું જતો રહીશ","મારો મોહ નાશ પામ્યો; હું આપનું કહ્યું કરીશ","મારે વધુ સમય જોઈએ","ફરી આપનું રૂપ બતાવો"],1],["18.63માં કૃષ્ણ શું કહે છે?",["પ્રશ્ન કર્યા વગર માનો","પૂરો વિચાર કરો, પછી જેમ ઇચ્છો તેમ કરો","શાસ્ત્ર પર ક્યારેય પ્રશ્ન ન કરો","કર્મ છોડી દો"],1],["ગીતાનો અંતિમ શ્લોક (18.78) કોણ બોલે છે?",["કૃષ્ણ","અર્જુન","સંજય","વ્યાસ"],2]]},"sa":"मोक्षसंन्यासयोग","iast":"Mokṣha Sanyās Yog","count":78,"gs":"મોક્ષસંન્યાસયોગ"}],"glossary":[{"id":"dharma","sa":"धर्म","pron":"DHUR-muh","refs":["1.1","2.31","3.35","4.7","18.47","18.66"],"en":{"name":"Dharma","def":"Right conduct; the duty that fits your role and nature; what holds life together.","deep":"From the root 'dhri', to hold or sustain. Dharma is both a cosmic order and personal duty. The Gita's tension is that dharmas can conflict, as with Arjuna's duty to family and to justice. In 18.66 Krishna asks Arjuna to 'abandon all dharmas', which schools interpret very differently.","ex":"A doctor treats a patient she personally dislikes because that is her duty as a doctor.","diff":"Dharma is not the same as 'religion'. It is closer to 'right way of being' and includes ethics, law and duty."},"hi":{"name":"धर्म","def":"सही आचरण; अपनी भूमिका और स्वभाव के अनुकूल कर्तव्य; जो जीवन को धारण करता है।","deep":"'धृ' धातु से, जिसका अर्थ है धारण करना। धर्म ब्रह्मांडीय व्यवस्था भी है और व्यक्तिगत कर्तव्य भी। गीता का तनाव यह है कि धर्म आपस में टकरा सकते हैं, जैसे अर्जुन का परिवार और न्याय के प्रति कर्तव्य। 18.66 में कृष्ण 'सब धर्मों को छोड़ने' को कहते हैं, जिसकी व्याख्या संप्रदाय बहुत अलग ढंग से करते हैं।","ex":"एक डॉक्टर उस मरीज़ का भी इलाज करती है जिसे वह निजी तौर पर पसंद नहीं करती, क्योंकि डॉक्टर के रूप में यही उसका कर्तव्य है।","diff":"धर्म 'मज़हब' या 'रिलीजन' जैसा नहीं है। यह 'सही ढंग से होना' के ज़्यादा क़रीब है और इसमें नैतिकता, नियम और कर्तव्य शामिल हैं।"},"gu":{"name":"ધર્મ","def":"સાચું આચરણ; પોતાની ભૂમિકા અને સ્વભાવને અનુરૂપ ફરજ; જે જીવનને ધારણ કરે છે.","deep":"'ધૃ' ધાતુમાંથી, જેનો અર્થ ધારણ કરવું. ધર્મ બ્રહ્માંડીય વ્યવસ્થા પણ છે અને અંગત ફરજ પણ. ગીતાનો તણાવ એ છે કે ધર્મો અંદરોઅંદર ટકરાઈ શકે, જેમ અર્જુનની કુટુંબ અને ન્યાય પ્રત્યેની ફરજ. 18.66માં કૃષ્ણ 'બધા ધર્મો છોડવા' કહે છે, જેનું અર્થઘટન સંપ્રદાયો ખૂબ જુદી રીતે કરે છે.","ex":"એક ડૉક્ટર એવા દર્દીની પણ સારવાર કરે છે જે તેને અંગત રીતે ગમતો નથી, કારણ કે ડૉક્ટર તરીકે એ જ તેની ફરજ છે.","diff":"ધર્મ 'મજહબ' કે 'રિલિજન' જેવો નથી. તે 'સાચી રીતે હોવું'ની વધુ નજીક છે અને તેમાં નીતિ, નિયમ અને ફરજ સામેલ છે."}},{"id":"karma","sa":"कर्म","pron":"KUR-muh","refs":["2.47","3.5","3.8","4.17","4.18","18.23"],"en":{"name":"Karma","def":"Action; also the consequences actions produce.","deep":"In the Gita, karma mainly means action, including ritual action. Every action leaves an imprint. The question is not whether to act (3.5 says no one can avoid it) but how to act so that action does not bind.","ex":"Choosing to finish a project well even when no one will check is karma, and it shapes the kind of worker you become.","diff":"Karma is the action itself; karma yoga is a particular way of doing it, without attachment."},"hi":{"name":"कर्म","def":"क्रिया; और क्रियाओं से उत्पन्न परिणाम।","deep":"गीता में कर्म का मुख्य अर्थ है क्रिया, यज्ञ-कर्म सहित। हर कर्म एक छाप छोड़ता है। प्रश्न यह नहीं कि कर्म करें या नहीं (3.5 कहता है कि कोई बच नहीं सकता), बल्कि यह कि कैसे करें ताकि कर्म बाँधे नहीं।","ex":"कोई जाँचेगा नहीं, फिर भी प्रोजेक्ट अच्छे से पूरा करना — यह कर्म है, और यही तय करता है कि आप कैसे कार्यकर्ता बनते हैं।","diff":"कर्म स्वयं क्रिया है; कर्मयोग उसे करने का एक विशेष ढंग है, आसक्ति के बिना।"},"gu":{"name":"કર્મ","def":"ક્રિયા; અને ક્રિયાઓમાંથી આવતાં પરિણામ.","deep":"ગીતામાં કર્મનો મુખ્ય અર્થ ક્રિયા છે, યજ્ઞકર્મ સહિત. દરેક કર્મ એક છાપ છોડે છે. પ્રશ્ન એ નથી કે કર્મ કરવું કે નહીં (3.5 કહે છે કે કોઈ બચી શકતું નથી), પણ એ છે કે કેવી રીતે કરવું જેથી કર્મ બાંધે નહીં.","ex":"કોઈ તપાસવાનું નથી, છતાં પ્રોજેક્ટ સારી રીતે પૂરો કરવો — એ કર્મ છે, અને એ જ નક્કી કરે છે કે તમે કેવા કાર્યકર બનો છો.","diff":"કર્મ પોતે ક્રિયા છે; કર્મયોગ તેને કરવાની એક ખાસ રીત છે, આસક્તિ વગર."}},{"id":"nishkama-karma","sa":"निष्काम कर्म","pron":"nish-KAA-muh KUR-muh","refs":["2.47","2.48","3.19","5.10","18.6"],"en":{"name":"Nishkama Karma","def":"Action done without selfish desire for its results.","deep":"The phrase itself is a later term, but the idea runs through the Gita (2.47, 3.19). It does not mean acting without goals. It means the goal does not own your mind, and success or failure does not decide your worth.","ex":"A volunteer teaches children every Sunday for years without expecting thanks or recognition.","diff":"Not the same as indifference. You still care about doing it well; you just don't cling to the outcome."},"hi":{"name":"निष्काम कर्म","def":"फल की स्वार्थपूर्ण इच्छा के बिना किया गया कर्म।","deep":"यह शब्द बाद में प्रचलित हुआ, पर यह विचार पूरी गीता में है (2.47, 3.19)। इसका अर्थ बिना लक्ष्य के कर्म करना नहीं है। इसका अर्थ है कि लक्ष्य आपके मन पर हावी न हो, और सफलता या असफलता आपका मूल्य तय न करे।","ex":"एक स्वयंसेवक सालों तक हर रविवार बच्चों को पढ़ाता है, बिना धन्यवाद या पहचान की उम्मीद के।","diff":"यह उदासीनता नहीं है। आप अच्छे से करने की परवाह करते हैं; बस परिणाम से चिपकते नहीं।"},"gu":{"name":"નિષ્કામ કર્મ","def":"ફળની સ્વાર્થી ઇચ્છા વગર કરેલું કર્મ.","deep":"આ શબ્દ પછીથી પ્રચલિત થયો, પણ આ વિચાર આખી ગીતામાં છે (2.47, 3.19). તેનો અર્થ લક્ષ્ય વગર કર્મ કરવું નથી. તેનો અર્થ છે કે લક્ષ્ય તમારા મન પર હાવી ન થાય, અને સફળતા કે નિષ્ફળતા તમારું મૂલ્ય નક્કી ન કરે.","ex":"એક સ્વયંસેવક વર્ષો સુધી દર રવિવારે બાળકોને ભણાવે છે, આભાર કે ઓળખની આશા વગર.","diff":"આ ઉદાસીનતા નથી. તમે સારી રીતે કરવાની પરવા કરો છો; ફક્ત પરિણામને વળગી રહેતા નથી."}},{"id":"atman","sa":"आत्मन्","pron":"AAT-mun","refs":["2.17","2.20","2.22","2.23","6.5","13.29"],"en":{"name":"Atman","def":"The true self; pure consciousness that witnesses body and mind.","deep":"The Gita says the atman is unborn, eternal, cannot be cut, burnt, wetted or dried (2.20–2.24). It changes bodies as we change clothes (2.22). Advaita says atman is identical with Brahman; Vishishtadvaita says it is a real part of Brahman; Dvaita says it is eternally distinct from God.","ex":"You were a child, a teenager and an adult, yet the one who has experienced all of it feels like the same 'I'.","diff":"Atman is not the ego (ahamkara) or the mind (manas); those are instruments the self uses."},"hi":{"name":"आत्मा","def":"सच्चा स्वरूप; शुद्ध चेतना जो शरीर और मन की साक्षी है।","deep":"गीता कहती है आत्मा अजन्मा, नित्य है; इसे शस्त्र काट नहीं सकते, आग जला नहीं सकती, जल भिगो नहीं सकता, वायु सुखा नहीं सकती (2.20–2.24)। यह शरीर ऐसे बदलती है जैसे हम कपड़े बदलते हैं (2.22)। अद्वैत कहता है आत्मा ब्रह्म ही है; विशिष्टाद्वैत कहता है यह ब्रह्म का वास्तविक अंश है; द्वैत कहता है यह ईश्वर से नित्य भिन्न है।","ex":"आप बच्चे थे, किशोर थे और अब वयस्क हैं, फिर भी इन सबका अनुभव करने वाला 'मैं' एक ही लगता है।","diff":"आत्मा अहंकार या मन नहीं है; ये वे साधन हैं जिनका आत्मा उपयोग करती है।"},"gu":{"name":"આત્મા","def":"સાચું સ્વરૂપ; શુદ્ધ ચેતના જે શરીર અને મનની સાક્ષી છે.","deep":"ગીતા કહે છે આત્મા અજન્મા, નિત્ય છે; તેને શસ્ત્ર કાપી શકતું નથી, અગ્નિ બાળી શકતો નથી, જળ ભીંજવી શકતું નથી, વાયુ સૂકવી શકતો નથી (2.20–2.24). તે શરીર એવી રીતે બદલે છે જેમ આપણે કપડાં બદલીએ છીએ (2.22). અદ્વૈત કહે છે આત્મા બ્રહ્મ જ છે; વિશિષ્ટાદ્વૈત કહે છે તે બ્રહ્મનો વાસ્તવિક અંશ છે; દ્વૈત કહે છે તે ઈશ્વરથી નિત્ય ભિન્ન છે.","ex":"તમે બાળક હતા, કિશોર હતા અને હવે પુખ્ત છો, છતાં આ બધાનો અનુભવ કરનાર 'હું' એક જ લાગે છે.","diff":"આત્મા અહંકાર કે મન નથી; એ સાધનો છે જેનો આત્મા ઉપયોગ કરે છે."}},{"id":"brahman","sa":"ब्रह्मन्","pron":"BRUH-mun","refs":["8.3","13.13","14.27","18.54"],"en":{"name":"Brahman","def":"The ultimate reality, the ground of everything.","deep":"Krishna calls Brahman 'the imperishable, the supreme' (8.3) and says he is the foundation of Brahman (14.27). How Brahman relates to Krishna and to individual selves is the central disagreement between the Vedanta schools.","ex":"Like the ocean that waves rise from and return to, Brahman is described as what all things come from and rest in.","diff":"Not the god Brahma (the creator). Brahman (neuter) is the Absolute; Brahma (masculine) is a deity."},"hi":{"name":"ब्रह्म","def":"परम सत्य, सबका आधार।","deep":"कृष्ण ब्रह्म को 'अक्षर, परम' कहते हैं (8.3) और कहते हैं कि वे ब्रह्म की प्रतिष्ठा हैं (14.27)। ब्रह्म का कृष्ण और जीवात्माओं से क्या संबंध है, यही वेदांत के संप्रदायों का मुख्य मतभेद है।","ex":"जैसे समुद्र से लहरें उठती हैं और उसी में लौट जाती हैं, वैसे ही ब्रह्म को सबका उद्गम और आधार बताया गया है।","diff":"यह सृष्टिकर्ता देवता ब्रह्मा नहीं है। ब्रह्म (नपुंसक लिंग) परम सत्य है; ब्रह्मा (पुल्लिंग) एक देवता हैं।"},"gu":{"name":"બ્રહ્મ","def":"પરમ સત્ય, બધાનો આધાર.","deep":"કૃષ્ણ બ્રહ્મને 'અક્ષર, પરમ' કહે છે (8.3) અને કહે છે કે તેઓ બ્રહ્મની પ્રતિષ્ઠા છે (14.27). બ્રહ્મનો કૃષ્ણ અને જીવાત્માઓ સાથે શો સંબંધ છે, એ જ વેદાંતના સંપ્રદાયોનો મુખ્ય મતભેદ છે.","ex":"જેમ સમુદ્રમાંથી મોજાં ઊઠે છે અને તેમાં જ પાછાં સમાય છે, તેમ બ્રહ્મને બધાનું ઉદ્ગમ અને આધાર કહેવાયું છે.","diff":"આ સર્જનહાર દેવ બ્રહ્મા નથી. બ્રહ્મ (નપુંસકલિંગ) પરમ સત્ય છે; બ્રહ્મા (પુંલિંગ) એક દેવ છે."}},{"id":"moksha","sa":"मोक्ष","pron":"MOHK-shuh","refs":["2.72","5.24","18.66"],"en":{"name":"Moksha","def":"Liberation from the cycle of birth and death and from suffering.","deep":"The Gita uses related words like 'brahma-nirvana' (2.72, 5.24) and 'param gati' (highest state). Schools disagree on what liberation is: merging into Brahman (Advaita) or eternal loving service of God (Vishishtadvaita, Dvaita).","ex":"Some describe moments of complete peace, free of wanting anything, as a small taste of what liberation points to.","diff":"Moksha is the goal; yoga is the path."},"hi":{"name":"मोक्ष","def":"जन्म-मृत्यु के चक्र और दुःख से मुक्ति।","deep":"गीता 'ब्रह्मनिर्वाण' (2.72, 5.24) और 'परम गति' जैसे शब्दों का प्रयोग करती है। मुक्ति क्या है, इस पर संप्रदायों में मतभेद है: ब्रह्म में लीन होना (अद्वैत) या ईश्वर की नित्य प्रेममय सेवा (विशिष्टाद्वैत, द्वैत)।","ex":"कुछ लोग कुछ भी न चाहने वाली पूर्ण शांति के क्षणों को मुक्ति की ओर एक छोटी झलक बताते हैं।","diff":"मोक्ष लक्ष्य है; योग मार्ग है।"},"gu":{"name":"મોક્ષ","def":"જન્મ-મરણના ચક્ર અને દુઃખમાંથી મુક્તિ.","deep":"ગીતા 'બ્રહ્મનિર્વાણ' (2.72, 5.24) અને 'પરમ ગતિ' જેવા શબ્દો વાપરે છે. મુક્તિ શું છે તે વિશે સંપ્રદાયોમાં મતભેદ છે: બ્રહ્મમાં લીન થવું (અદ્વૈત) કે ઈશ્વરની નિત્ય પ્રેમભરી સેવા (વિશિષ્ટાદ્વૈત, દ્વૈત).","ex":"કેટલાક લોકો કંઈ પણ ન ઇચ્છતી પૂર્ણ શાંતિની ક્ષણોને મુક્તિની એક નાની ઝલક કહે છે.","diff":"મોક્ષ લક્ષ્ય છે; યોગ માર્ગ છે."}},{"id":"yoga","sa":"योग","pron":"YOH-guh","refs":["2.48","2.50","6.23","6.47"],"en":{"name":"Yoga","def":"Union; a disciplined way of living that connects one with the highest.","deep":"The Gita gives two famous definitions: 'evenness of mind is yoga' (2.48) and 'yoga is skill in action' (2.50). In 6.23 it is 'disconnection from union with sorrow'. Every chapter is called a yoga.","ex":"Staying calm and doing your best work during a stressful deadline is yoga in the Gita's sense.","diff":"Not only physical postures (asanas), which are one small part of later hatha yoga."},"hi":{"name":"योग","def":"जुड़ना; जीने का अनुशासित ढंग जो सर्वोच्च से जोड़ता है।","deep":"गीता दो प्रसिद्ध परिभाषाएँ देती है: 'समत्व ही योग है' (2.48) और 'कर्मों में कुशलता ही योग है' (2.50)। 6.23 में इसे 'दुःख के संयोग से वियोग' कहा गया है। हर अध्याय को योग कहा गया है।","ex":"तनावपूर्ण डेडलाइन में शांत रहकर अपना सर्वश्रेष्ठ काम करना गीता के अर्थ में योग है।","diff":"केवल शारीरिक आसन नहीं, जो बाद के हठयोग का एक छोटा हिस्सा हैं।"},"gu":{"name":"યોગ","def":"જોડાણ; જીવવાની શિસ્તબદ્ધ રીત જે સર્વોચ્ચ સાથે જોડે છે.","deep":"ગીતા બે પ્રખ્યાત વ્યાખ્યાઓ આપે છે: 'સમત્વ એ જ યોગ છે' (2.48) અને 'કર્મોમાં કુશળતા એ જ યોગ છે' (2.50). 6.23માં તેને 'દુઃખના સંયોગથી વિયોગ' કહ્યો છે. દરેક અધ્યાયને યોગ કહેવાયો છે.","ex":"તણાવભરી ડેડલાઇનમાં શાંત રહીને પોતાનું શ્રેષ્ઠ કામ કરવું એ ગીતાના અર્થમાં યોગ છે.","diff":"ફક્ત શારીરિક આસનો નહીં, જે પાછળના હઠયોગનો એક નાનો ભાગ છે."}},{"id":"bhakti","sa":"भक्ति","pron":"BHUK-tee","refs":["9.26","9.34","11.54","12.2","18.65"],"en":{"name":"Bhakti","def":"Loving devotion to the Divine.","deep":"From 'bhaj', to share or participate. The Gita presents bhakti as open to all (9.32) and as the means to see the Divine (11.54). Chapter 12 describes the devotee mainly by character: kind, steady and free of hatred.","ex":"A grandmother who quietly offers her day's work to God before starting is practising bhakti.","diff":"Bhakti centres on relationship and love; jnana centres on understanding; karma yoga on selfless action. The Gita combines all three."},"hi":{"name":"भक्ति","def":"ईश्वर के प्रति प्रेममय समर्पण।","deep":"'भज्' धातु से, जिसका अर्थ है भाग लेना या सेवा करना। गीता भक्ति को सबके लिए खुला बताती है (9.32) और ईश्वर-दर्शन का साधन मानती है (11.54)। अध्याय 12 भक्त का वर्णन मुख्यतः चरित्र से करता है: दयालु, स्थिर और द्वेष रहित।","ex":"एक दादी जो काम शुरू करने से पहले चुपचाप दिन का काम भगवान को अर्पित करती हैं, भक्ति कर रही हैं।","diff":"भक्ति संबंध और प्रेम पर केंद्रित है; ज्ञान समझ पर; कर्मयोग निःस्वार्थ कर्म पर। गीता तीनों को जोड़ती है।"},"gu":{"name":"ભક્તિ","def":"ઈશ્વર પ્રત્યે પ્રેમભર્યું સમર્પણ.","deep":"'ભજ્' ધાતુમાંથી, જેનો અર્થ ભાગ લેવો કે સેવા કરવી. ગીતા ભક્તિને બધા માટે ખુલ્લી ગણાવે છે (9.32) અને ઈશ્વર-દર્શનનું સાધન માને છે (11.54). અધ્યાય 12 ભક્તનું વર્ણન મુખ્યત્વે ચારિત્ર્યથી કરે છે: દયાળુ, સ્થિર અને દ્વેષ વગરનો.","ex":"એક દાદી જે કામ શરૂ કરતાં પહેલાં ચૂપચાપ દિવસનું કામ ભગવાનને અર્પણ કરે છે, તે ભક્તિ કરે છે.","diff":"ભક્તિ સંબંધ અને પ્રેમ પર કેન્દ્રિત છે; જ્ઞાન સમજ પર; કર્મયોગ નિઃસ્વાર્થ કર્મ પર. ગીતા ત્રણેયને જોડે છે."}},{"id":"jnana","sa":"ज्ञान","pron":"GYAA-nuh","refs":["4.34","4.38","7.2","13.8","18.20"],"en":{"name":"Jnana","def":"Knowledge, especially direct understanding of the self and reality.","deep":"Not just information. The Gita says nothing purifies like it (4.38) and lists moral qualities as part of it (13.8–13.12). Jnana yoga is the path of discrimination between the lasting and the passing.","ex":"Knowing facts about anger is information; seeing your own anger rise and not being carried by it is closer to jnana.","diff":"Vijnana (7.2) is often translated as realised or practical knowledge, the step from theory to experience."},"hi":{"name":"ज्ञान","def":"ज्ञान, विशेषकर आत्मा और सत्य की प्रत्यक्ष समझ।","deep":"केवल जानकारी नहीं। गीता कहती है इसके समान कुछ भी पवित्र नहीं करता (4.38) और नैतिक गुणों को इसका हिस्सा बताती है (13.8–13.12)। ज्ञानयोग स्थायी और अस्थायी में विवेक का मार्ग है।","ex":"क्रोध के बारे में तथ्य जानना जानकारी है; अपने क्रोध को उठते देखना और उसमें न बहना ज्ञान के क़रीब है।","diff":"विज्ञान (7.2) का अर्थ अक्सर अनुभवजन्य ज्ञान बताया जाता है, सिद्धांत से अनुभव तक का क़दम।"},"gu":{"name":"જ્ઞાન","def":"જ્ઞાન, ખાસ કરીને આત્મા અને સત્યની પ્રત્યક્ષ સમજ.","deep":"ફક્ત માહિતી નહીં. ગીતા કહે છે તેના જેવું કંઈ પવિત્ર કરતું નથી (4.38) અને નૈતિક ગુણોને તેનો ભાગ ગણાવે છે (13.8–13.12). જ્ઞાનયોગ સ્થાયી અને અસ્થાયી વચ્ચે વિવેકનો માર્ગ છે.","ex":"ક્રોધ વિશે તથ્યો જાણવાં એ માહિતી છે; પોતાના ક્રોધને ઊઠતો જોવો અને તેમાં ન તણાવું એ જ્ઞાનની નજીક છે.","diff":"વિજ્ઞાન (7.2)નો અર્થ ઘણી વાર અનુભવસિદ્ધ જ્ઞાન કહેવાય છે, સિદ્ધાંતથી અનુભવ સુધીનું પગલું."}},{"id":"sannyasa","sa":"संन्यास","pron":"sun-NYAA-suh","refs":["5.1","5.2","6.1","18.2"],"en":{"name":"Sannyasa","def":"Renunciation.","deep":"Traditionally the life stage of a monk who gives up home and ritual. The Gita redefines it: the true sannyasi is one who acts without depending on the fruits (6.1). In 18.2 sannyasa is giving up desire-driven action and tyaga is giving up the fruits of all action.","ex":"A manager who stops needing credit for her team's work has renounced something real without leaving her job.","diff":"Sannyasa (outer renunciation) vs tyaga (inner relinquishment). The Gita values the inner one."},"hi":{"name":"संन्यास","def":"त्याग।","deep":"परंपरा में यह संन्यासी का आश्रम है जो घर और कर्मकांड छोड़ देता है। गीता इसे नए ढंग से परिभाषित करती है: सच्चा संन्यासी वह है जो कर्मफल का आश्रय लिए बिना कर्म करता है (6.1)। 18.2 में संन्यास कामना वाले कर्मों का त्याग है और त्याग सभी कर्मों के फल का।","ex":"जो मैनेजर अपनी टीम के काम का श्रेय लेने की ज़रूरत छोड़ देती है, उसने नौकरी छोड़े बिना कुछ सच्चा त्यागा है।","diff":"संन्यास (बाहरी त्याग) बनाम त्याग (भीतरी)। गीता भीतरी को महत्त्व देती है।"},"gu":{"name":"સંન્યાસ","def":"ત્યાગ.","deep":"પરંપરામાં તે સંન્યાસીનો આશ્રમ છે જે ઘર અને કર્મકાંડ છોડી દે છે. ગીતા તેને નવી રીતે વ્યાખ્યાયિત કરે છે: સાચો સંન્યાસી એ છે જે કર્મફળનો આશ્રય લીધા વગર કર્મ કરે છે (6.1). 18.2માં સંન્યાસ એટલે કામનાવાળાં કર્મોનો ત્યાગ અને ત્યાગ એટલે બધાં કર્મોના ફળનો ત્યાગ.","ex":"જે મેનેજર પોતાની ટીમના કામનો શ્રેય લેવાની જરૂર છોડી દે છે, તેણે નોકરી છોડ્યા વગર કંઈક સાચું ત્યાગ્યું છે.","diff":"સંન્યાસ (બહારનો ત્યાગ) વિરુદ્ધ ત્યાગ (અંદરનો). ગીતા અંદરનાને મહત્ત્વ આપે છે."}},{"id":"prakriti","sa":"प्रकृति","pron":"PRUH-kri-tee","refs":["3.27","7.4","7.5","13.20","14.5"],"en":{"name":"Prakriti","def":"Nature; the material world, including body and mind.","deep":"Prakriti is made of the three gunas and does all action (3.27). Krishna has a lower prakriti of eight elements and a higher one, the life principle (7.4–7.5). It is beginningless, like purusha (13.20).","ex":"Hunger, tiredness and moods arise from prakriti; you notice them, but they are not 'you'.","diff":"Prakriti is what changes; purusha is the conscious witness."},"hi":{"name":"प्रकृति","def":"प्रकृति; भौतिक जगत, शरीर और मन सहित।","deep":"प्रकृति तीन गुणों से बनी है और सारे कर्म करती है (3.27)। कृष्ण की आठ तत्त्वों वाली अपरा प्रकृति है और जीव रूप परा प्रकृति (7.4–7.5)। यह पुरुष की तरह अनादि है (13.20)।","ex":"भूख, थकान और मूड प्रकृति से उठते हैं; आप उन्हें देखते हैं, पर वे 'आप' नहीं हैं।","diff":"प्रकृति वह है जो बदलती है; पुरुष चेतन साक्षी है।"},"gu":{"name":"પ્રકૃતિ","def":"પ્રકૃતિ; ભૌતિક જગત, શરીર અને મન સહિત.","deep":"પ્રકૃતિ ત્રણ ગુણોની બનેલી છે અને બધાં કર્મ કરે છે (3.27). કૃષ્ણની આઠ તત્ત્વવાળી અપરા પ્રકૃતિ છે અને જીવરૂપ પરા પ્રકૃતિ (7.4–7.5). તે પુરુષની જેમ અનાદિ છે (13.20).","ex":"ભૂખ, થાક અને મૂડ પ્રકૃતિમાંથી ઊઠે છે; તમે તેમને જુઓ છો, પણ તે 'તમે' નથી.","diff":"પ્રકૃતિ એ છે જે બદલાય છે; પુરુષ ચેતન સાક્ષી છે."}},{"id":"purusha","sa":"पुरुष","pron":"POO-roo-shuh","refs":["13.20","13.21","13.23","15.16","15.18"],"en":{"name":"Purusha","def":"The conscious principle; spirit.","deep":"In Chapter 13 purusha is the experiencer within the body (13.21–13.23). Chapter 15 names three: the perishable, the imperishable and the Supreme Person (Purushottama).","ex":"While watching a film, the screen images change constantly; the one watching does not. Purusha is like the watcher.","diff":"Purusha here does not mean 'man' in the gender sense; it means the conscious self."},"hi":{"name":"पुरुष","def":"चेतन तत्त्व; आत्मा।","deep":"अध्याय 13 में पुरुष शरीर में भोक्ता है (13.21–13.23)। अध्याय 15 तीन पुरुष बताता है: क्षर, अक्षर और पुरुषोत्तम।","ex":"फ़िल्म देखते समय पर्दे के दृश्य बदलते रहते हैं; देखने वाला नहीं बदलता। पुरुष देखने वाले जैसा है।","diff":"यहाँ पुरुष का अर्थ लिंग के अर्थ में 'आदमी' नहीं; इसका अर्थ है चेतन आत्मा।"},"gu":{"name":"પુરુષ","def":"ચેતન તત્ત્વ; આત્મા.","deep":"અધ્યાય 13માં પુરુષ શરીરમાં ભોક્તા છે (13.21–13.23). અધ્યાય 15 ત્રણ પુરુષ ગણાવે છે: ક્ષર, અક્ષર અને પુરુષોત્તમ.","ex":"ફિલ્મ જોતી વખતે પડદા પરનાં દૃશ્યો બદલાતાં રહે છે; જોનાર બદલાતો નથી. પુરુષ જોનાર જેવો છે.","diff":"અહીં પુરુષનો અર્થ જાતિના અર્થમાં 'માણસ' નથી; તેનો અર્થ ચેતન આત્મા છે."}},{"id":"maya","sa":"माया","pron":"MAA-yaa","refs":["4.6","7.14","7.25","18.61"],"en":{"name":"Maya","def":"The divine power that creates appearances and veils reality.","deep":"Krishna calls it 'my divine maya, made of the gunas, hard to cross' (7.14). Advaita reads maya as the cause of the world's appearance over Brahman. Theistic schools read it as God's real creative power.","ex":"Feeling sure that a new phone will make you lastingly happy, and finding it doesn't, is a small taste of how appearance misleads.","diff":"Maya is not simply 'illusion' in the sense of 'nothing is real'. Schools differ on how real the world is."},"hi":{"name":"माया","def":"वह दिव्य शक्ति जो रूप रचती है और सत्य को ढकती है।","deep":"कृष्ण इसे 'मेरी गुणमयी दैवी माया, जिसे पार करना कठिन है' कहते हैं (7.14)। अद्वैत माया को ब्रह्म पर जगत के आभास का कारण मानता है। आस्तिक संप्रदाय इसे ईश्वर की वास्तविक सृजन शक्ति मानते हैं।","ex":"यह पक्का लगना कि नया फ़ोन आपको हमेशा के लिए ख़ुश कर देगा, और फिर ऐसा न होना — यह छोटा-सा उदाहरण है कि दिखावा कैसे भटकाता है।","diff":"माया का अर्थ केवल 'भ्रम' यानी 'कुछ भी सच नहीं' नहीं है। जगत कितना सच है, इस पर संप्रदायों में मतभेद है।"},"gu":{"name":"માયા","def":"એ દિવ્ય શક્તિ જે રૂપો રચે છે અને સત્યને ઢાંકે છે.","deep":"કૃષ્ણ તેને 'મારી ગુણમયી દૈવી માયા, જે પાર કરવી અઘરી છે' કહે છે (7.14). અદ્વૈત માયાને બ્રહ્મ પર જગતના આભાસનું કારણ માને છે. આસ્તિક સંપ્રદાયો તેને ઈશ્વરની વાસ્તવિક સર્જનશક્તિ માને છે.","ex":"એવું પાકું લાગવું કે નવો ફોન તમને હંમેશ માટે ખુશ કરી દેશે, અને પછી એવું ન થવું — આ નાનું ઉદાહરણ છે કે દેખાવ કેવી રીતે ભટકાવે છે.","diff":"માયાનો અર્થ ફક્ત 'ભ્રમ' એટલે 'કંઈ સાચું નથી' નથી. જગત કેટલું સાચું છે તે વિશે સંપ્રદાયોમાં મતભેદ છે."}},{"id":"gunas","sa":"गुण","pron":"GOO-nuh","refs":["3.27","14.5","17.2","18.40"],"en":{"name":"Gunas","def":"The three qualities of nature: sattva, rajas and tamas.","deep":"Everything in prakriti is a mix of the three gunas (18.40). They bind the self to the body in different ways (14.5). Chapters 14, 17 and 18 apply them to food, faith, action, intellect and happiness.","ex":"Morning clarity (sattva), afternoon rush (rajas) and post-lunch drowsiness (tamas) can all show up in one day.","diff":"Guna here does not mean 'virtue'. It means a strand or quality of nature."},"hi":{"name":"गुण","def":"प्रकृति के तीन गुण: सत्त्व, रजस और तमस।","deep":"प्रकृति में सब कुछ तीन गुणों का मिश्रण है (18.40)। वे आत्मा को अलग-अलग ढंग से शरीर से बाँधते हैं (14.5)। अध्याय 14, 17 और 18 इन्हें आहार, श्रद्धा, कर्म, बुद्धि और सुख पर लागू करते हैं।","ex":"सुबह की स्पष्टता (सत्त्व), दोपहर की भागदौड़ (रजस) और खाने के बाद की सुस्ती (तमस) — तीनों एक ही दिन में दिख सकते हैं।","diff":"यहाँ गुण का अर्थ 'अच्छाई' नहीं है। इसका अर्थ है प्रकृति का एक धागा या गुण।"},"gu":{"name":"ગુણ","def":"પ્રકૃતિના ત્રણ ગુણ: સત્ત્વ, રજસ અને તમસ.","deep":"પ્રકૃતિમાં બધું ત્રણ ગુણોનું મિશ્રણ છે (18.40). તે આત્માને જુદી જુદી રીતે શરીર સાથે બાંધે છે (14.5). અધ્યાય 14, 17 અને 18 તેમને આહાર, શ્રદ્ધા, કર્મ, બુદ્ધિ અને સુખ પર લાગુ કરે છે.","ex":"સવારની સ્પષ્ટતા (સત્ત્વ), બપોરની દોડધામ (રજસ) અને જમ્યા પછીની સુસ્તી (તમસ) — ત્રણેય એક જ દિવસમાં દેખાઈ શકે.","diff":"અહીં ગુણનો અર્થ 'સદ્ગુણ' નથી. તેનો અર્થ પ્રકૃતિનો એક તંતુ કે ગુણ છે."}},{"id":"sattva","sa":"सत्त्व","pron":"SUT-tvuh","refs":["14.6","14.11","17.8","18.20"],"en":{"name":"Sattva","def":"The quality of clarity, harmony and goodness.","deep":"Sattva is pure, illuminating and free of disease (14.6), but it binds through attachment to happiness and knowledge. When it dominates, the light of knowledge shines through all the senses (14.11).","ex":"After a good night's sleep, a calm walk and a simple meal, you think clearly and act kindly.","diff":"Sattva is the best of the three but still a guna; the goal is to go beyond all three."},"hi":{"name":"सत्त्व","def":"स्पष्टता, सामंजस्य और अच्छाई का गुण।","deep":"सत्त्व निर्मल, प्रकाशक और विकार रहित है (14.6), पर सुख और ज्ञान की आसक्ति से बाँधता है। जब यह बढ़ता है तो सभी इंद्रियों में ज्ञान का प्रकाश फैलता है (14.11)।","ex":"अच्छी नींद, शांत सैर और सादे भोजन के बाद आप साफ़ सोचते हैं और दया से व्यवहार करते हैं।","diff":"सत्त्व तीनों में श्रेष्ठ है, पर फिर भी गुण है; लक्ष्य तीनों से परे जाना है।"},"gu":{"name":"સત્ત્વ","def":"સ્પષ્ટતા, સંવાદિતા અને ભલાઈનો ગુણ.","deep":"સત્ત્વ નિર્મળ, પ્રકાશક અને વિકાર વગરનો છે (14.6), પણ સુખ અને જ્ઞાનની આસક્તિથી બાંધે છે. જ્યારે તે વધે ત્યારે બધી ઇન્દ્રિયોમાં જ્ઞાનનો પ્રકાશ ફેલાય છે (14.11).","ex":"સારી ઊંઘ, શાંત ચાલ અને સાદા ભોજન પછી તમે સ્પષ્ટ વિચારો છો અને દયાથી વર્તો છો.","diff":"સત્ત્વ ત્રણેયમાં શ્રેષ્ઠ છે, પણ છતાં ગુણ છે; લક્ષ્ય ત્રણેયથી પર જવાનું છે."}},{"id":"rajas","sa":"रजस्","pron":"RUH-jus","refs":["3.37","14.7","14.12","17.9"],"en":{"name":"Rajas","def":"The quality of passion, activity and restlessness.","deep":"Rajas is born of craving and attachment and binds through attachment to action (14.7). It shows as greed, restlessness and longing (14.12). Krishna names desire and anger, born of rajas, as the enemy (3.37).","ex":"Checking your phone forty times while waiting for a reply, unable to settle on anything else.","diff":"Rajas is not simply 'energy'; it is energy driven by craving."},"hi":{"name":"रजस","def":"आवेग, क्रियाशीलता और बेचैनी का गुण।","deep":"रजस तृष्णा और आसक्ति से उत्पन्न है और कर्म की आसक्ति से बाँधता है (14.7)। यह लोभ, बेचैनी और लालसा के रूप में दिखता है (14.12)। कृष्ण रजोगुण से उत्पन्न काम और क्रोध को शत्रु बताते हैं (3.37)।","ex":"जवाब का इंतज़ार करते हुए चालीस बार फ़ोन देखना, किसी और काम में मन न लगना।","diff":"रजस केवल 'ऊर्जा' नहीं; यह तृष्णा से चलने वाली ऊर्जा है।"},"gu":{"name":"રજસ","def":"આવેગ, પ્રવૃત્તિ અને બેચેનીનો ગુણ.","deep":"રજસ તૃષ્ણા અને આસક્તિમાંથી જન્મે છે અને કર્મની આસક્તિથી બાંધે છે (14.7). તે લોભ, બેચેની અને ઝંખના રૂપે દેખાય છે (14.12). કૃષ્ણ રજોગુણમાંથી જન્મેલા કામ અને ક્રોધને શત્રુ ગણાવે છે (3.37).","ex":"જવાબની રાહ જોતાં ચાલીસ વાર ફોન જોવો, બીજા કોઈ કામમાં મન ન લાગવું.","diff":"રજસ ફક્ત 'ઊર્જા' નથી; તે તૃષ્ણાથી ચાલતી ઊર્જા છે."}},{"id":"tamas","sa":"तमस्","pron":"TUH-mus","refs":["14.8","14.13","17.10","18.25","18.39"],"en":{"name":"Tamas","def":"The quality of inertia, darkness and heedlessness.","deep":"Tamas is born of ignorance and binds through heedlessness (pramada), laziness and sleep (14.8). Tamasic food is stale and impure (17.10); tamasic action ignores harm to others (18.25).","ex":"Scrolling for hours late at night, knowing you'll regret it, but not getting up.","diff":"Tamas is not rest; healthy rest restores you, tamas dulls you."},"hi":{"name":"तमस","def":"जड़ता, अंधकार और प्रमाद का गुण।","deep":"तमस अज्ञान से उत्पन्न है और प्रमाद, आलस्य और निद्रा से बाँधता है (14.8)। तामसिक भोजन बासी और अशुद्ध है (17.10); तामसिक कर्म दूसरों की हानि की परवाह नहीं करता (18.25)।","ex":"देर रात घंटों तक स्क्रॉल करते रहना, यह जानते हुए कि
